chassis: "Mechanized Wheeled Platoon (AFFS)"
model: "(Combat Engineers 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Mechanized wheeled platoons ride wheeled transports that offer good speed on roads and developed terrain, making them well-suited to garrison duty on worlds with established infrastructure where rapid response matters more than cross-country capability. Trained as combat engineers, these troops construct field fortifications, clear obstacles, and prepare defensive positions, providing the engineering capability that transforms raw terrain into defensible ground.</p>
