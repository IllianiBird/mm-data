chassis: "Jump Duplus Contubernium (MHAF)"
model: "(LRM 3049+)"
overview: |-
  <p>Caesar's ongoing program to modernize the Legiones Marianes has extended to conventional infantry formations, with improved equipment and weapons gradually replacing older stockpiles across the Hegemony's auxiliary legions. A duplus contubernium, or double tent-group, fields two squads of ten soldiers. Jump-equipped duplus contubernia provide the Legiones Marianes with mobile infantry capable of seizing elevated positions and conducting rapid flanking maneuvers that exploit terrain inaccessible to foot troops. Support troops operate man-portable long-range missile launchers capable of engaging targets at distances well beyond personal weapon range, providing indirect fire capability against vehicles and fortified positions.</p>
