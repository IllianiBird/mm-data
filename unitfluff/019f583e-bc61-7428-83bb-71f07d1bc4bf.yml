chassis: "Field Gun Platoon (FWLM)"
model: "(Tracked LBX20 3060+)"
overview: |-
  <p>The Free Worlds League's fractious politics have always made centralized BattleMech procurement difficult, pushing the FWLM toward heavy investment in conventional infantry to fill the gaps. Towing crew-served LB 20-X autocannon, these platoons combine devastating short-range stopping power with the option of cluster munitions, making them equally dangerous to armored vehicles and massed infantry.</p>
