chassis: "Longshot"
model: "LNG-3"
overview: |-
  <p>The Longshot is a thirty-five-ton light BattleMech designed by Innovative Design Concepts for the Solaris VII arena circuit. First entering the featherweight fight scene in the mid-3050s, the design was built as an extensive customization of the venerable Assassin chassis, tailored specifically for the close-quarters combat of Solaris competition. Initially dismissed by many MechWarriors for its unimpressive armament (particularly the inclusion of a Narc missile beacon better suited to team matches than the popular one-on-one duels) the Longshot gradually earned a loyal following through its combination of speed, agility, and resilience.</p><p>IDC, one of the many small ’Mech design firms operating on the Game World, was notable as the only Solaris-based company listed on the Lyran Alliance stock exchanges, driven by CEO Ramon Pietro’s ambitions to break into the mainline ’Mech market. A steady stream of variant designs incorporating increasingly advanced technology helped the Longshot overcome early skepticism and establish itself as a competitive arena design.</p>
capabilities: |-
  <p>The Longshot’s primary configuration, the LNG-2, combines a 245-rated XL engine with an endo steel frame to achieve a top speed of nearly one hundred twenty kilometers per hour, making it one of the faster designs in its weight class. The design’s most notable feature is its use of reactive armor, an advanced defensive system that provides enhanced protection against ballistic and missile attacks, a significant advantage in the missile-heavy arena environment. The main armament consists of twin TharHes Maxi SRM-6 launchers linked to an Artemis IV fire control system, providing devastating close-range punch with improved accuracy. These are supplemented by a pair of IDC medium X-pulse lasers and two IDC small X-pulse lasers, giving the Longshot reliable energy weapon backup that does not depend on ammunition supplies.</p><p>Despite its impressive speed and firepower for its tonnage, the Longshot carries only six tons of armor protection, leaving it vulnerable to sustained engagements against heavier opponents. The absence of jump jets limits its tactical flexibility in broken terrain, though on the flat arena floors of Solaris this is less of a concern. The design has also earned a reputation for being difficult to maintain, with its mix of advanced and experimental systems requiring specialized technicians more readily found on Solaris VII than in frontline military formations.</p>
deployment: |-
  <p>This variant, entering production in 3062, took a different approach by building on the original LNG-1B’s weapon philosophy rather than the LNG-2’s. IDC upgraded the medium lasers to medium X-pulse versions and the small lasers to extended-range models while retaining the Narc missile beacon, but freed tonnage for these improvements by replacing the XL engine with an even lighter XXL variant. The removal of the Artemis IV fire control system from the SRM-6 launchers was the trade-off required to accommodate the Narc system alongside the upgraded weapons. This configuration appealed to arena pilots who valued the tactical flexibility of the Narc beacon but wanted more advanced direct-fire capabilities.</p>
history: |-
  <p>The Longshot’s history is inextricably tied to the Solaris VII arena circuit and the fortunes of its manufacturer, Innovative Design Concepts. Introduced in the mid-3050s during the Clan Invasion era, the design emerged from IDC’s workshop as a purpose-built arena combatant at a time when the featherweight fight class was growing in popularity. The original LNG-1B drew mixed reviews, its combination of a Narc missile beacon with conventional lasers and short-range missiles proved effective in team matches and grand melees, but placed it at a disadvantage in the one-on-one duels that drew the largest audiences and betting pools.</p><p>IDC responded aggressively to pilot criticism, rolling out the improved LNG-2 in 3058 with reactive armor and upgraded X-pulse weaponry. The redesign transformed the Longshot from a curiosity into a genuine contender, and its success fueled IDC’s commercial ambitions. The LNG-3 followed in 3062 during the Civil War era, pushing the technological envelope further with an XXL engine while returning to the Narc-equipped philosophy of the original. The LNG-3C represented an attempt to mount the more advanced iNarc system, though ComStar’s refusal to grant an export license delayed its introduction until 3064.</p><p>Solaris VII’s turbulent political history shaped IDC’s fortunes throughout the design’s production life. The Game World changed hands repeatedly, from Free Worlds League control in the Star League era to Lyran ownership through the Succession Wars, then briefly under the Federated Commonwealth during the alliance period before reverting to Lyran control. The Jihad devastated Solaris VII’s arena infrastructure, and while IDC survived the conflict, the firm struggled to compete with larger and more advanced manufacturers in the post-war market. By the Dark Age, Clan Wolf’s conquest of Solaris VII placed IDC and its production lines under new management, though the Longshot’s niche appeal as an arena design limited its strategic significance.</p><p>The large number of quickly placed orders during the design’s peak years helped recoup IDC’s capital investment and funded research and testing on several other designs and weapon systems. The Longshot’s competitive success in the arenas (particularly through the repeated rebuilding and evolution of famous arena ’Mechs bearing its name) slowly changed the design’s shape over seventy-six matches and twenty-four complete rebuilds, cementing its reputation as a resilient platform that could absorb punishment and keep fighting.</p>
