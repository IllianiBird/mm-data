chassis: "Osteon"
model: "A"
overview: |-
  <p>The Osteon was The Society's assault-class OmniMech. To maximize the 'Mech's battlefield longevity, the designers focused on survivability above all other considerations. Eighteen tons of Ferro-Lamellor armor provide excellent protection against weapons fire, but in case the armor is breached the Reinforced Structure will resist most attacks. In addition, the Torso-Mounted Cockpit allows the Osteon's pilot to take advantage of the heavy center torso armor. To maximize the Osteon's damage potential, a Nova CEWS allows the unit to share targeting data with friendly units, and this equipment is so valuable that it is permanently mounted in the 'Mech's head.</p>
capabilities: |-
  <p>While some Society strategists insisted that volume production focus on an assault 'Mech, it became clear early on that infrastructure bottlenecks would lead to intolerable compromises in design. The decision was made to use advanced technologies to give the assault an edge over its contemporaries. The Osteon proved itself a very flexible force multiplier and support platform, executing a role alien even to Naga MechWarriors, who fling themselves into combat at the earliest opportunity.</p><p>Emphasizing survivability, the Osteon packs astonishing protection in the form of eighteen tons of ferro-lamellor armor, effectively carrying protection available only to a 100-ton 'Mech. Should this shell be cracked, the 'Mech relies on its extremely durable seventeen-ton reinforced frame to stay functional well beyond the point where lesser 'Mechs would fall. The cockpit was moved to the center torso to further improve the 'Mech's ability to withdraw from combat.</p><p>All these measures did inhibit total pod space, but as the operational role for the Osteon made it entirely subservient to all other battlefield units, this sacrifice was considered acceptable. As an added benefit, more hidebound warrior caste battlefield doctrines caused them to focus a disproportionate amount of attention on the Osteon, ignoring 'Mechs of lesser weight. Given their typical position at the extremities of the battlefield and their high durability, this tendency often caused Clan warriors to use a large fraction of their firepower in inefficient ways.</p>
deployment: |-
  <p>The Alpha configuration uses Mech Mortar/8s to provide indirect fire support. The weapons proved themselves capable of decimating infantry and battle armor formations, while also proving efficient against ProtoMechs and light 'Mechs. A trio of mortar launchers provides devastating suppressive fire, while four Improved Heavy Medium Lasers and an ER Large Laser deter hostiles from rushing it. A Medium Pulse Laser provides additional close defense.</p>
history: |-
  <p>As rare as the Cephalus, the Osteon was routinely deployed in dense formations of Treys and Septs, where multiple units could provide overlapping fields of fire while sharing targeting data through their Nova CEWS networks. It was heavily utilized on Babylon, where it worked in concert with Septicemia Treys and other OmniMechs equipped with Nova CEWS to exact a heavy toll on the planet's former occupiers.</p><p>Due to the role this OmniMech played with The Society during the Wars of Reaving, the Osteon, as of 3090, was outlawed by the Home Clans, although it was undergoing study. The surviving examples represented some of the most advanced military technology the Clans had ever produced, and their analysis yielded valuable data on ferro-lamellor armor and reinforced internal structures that would influence later Clan designs.</p>
