chassis: "Jump Platoon (Generic)"
model: "(MG 2200+)"
overview: |-
  <p>Jump infantry platoons equip their troops with personal jump packs that allow short powered hops across broken terrain, over walls, and onto rooftops. This vertical mobility gives jump platoons access to positions that foot and motorized infantry cannot reach, making them particularly effective in urban combat, mountainous terrain, and defensive operations where elevation matters. The trade-off is cost and logistics: jump packs require fuel, maintenance, and trained operators, limiting the number of jump platoons a garrison command can field compared to standard foot formations.</p><p>Carrying infantry-portable machine guns that deliver sustained automatic fire at close range, these platoons trade precision for volume, putting enough rounds downrange to suppress enemy positions and deny open ground to advancing troops.<p>
