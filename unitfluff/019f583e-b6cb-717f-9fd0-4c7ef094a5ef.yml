overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing assault-class ultra autocannon capable of double-rate fire, these field gun crews field the most devastating rapid-fire direct weapons available to conventional ground forces.</p>
