chassis: "Tramp JumpShip"
model: "(2754)"
overview: "<p>The Tramp-class JumpShip is a venerable design dating back to 2754. While its integrated weaponry initially made it a favorite for traders navigating the dangerous Periphery, it never achieved widespread production. Despite being similar in scale to the Star Lord, the Tramp is less efficient, supporting only three DropShips compared to the Star Lord\u0092s six. Consequently, by the early 29th century, most shipyards abandoned the design in favor of its more capable rival. Though the \"Succession Wars Downgraded\" variant saw sporadic production, ComStar remained the only major power to consistently field the original Star League-era model.</p>"
capabilities: |-
  <p>Designed for high-risk trade in the "wilder" reaches of the Periphery, the Tramp is among the most heavily armed civilian JumpShips in existence. Its hull is dotted with a potent mix of offensive and defensive weaponry, including eight ER large lasers and twelve anti-missile systems. While this arsenal can be further supplemented by weapons from the three docked DropShips, the Tramp remains vulnerable in sustained combat due to its fragile armor. The vessel features two small-craft bays, used primarily for shuttles as these have proven unsuitable for the vast majority of modern fighter designs. The Tramp-class can be seen as a dedicated trader with its featured combined storage of more than 2800 tons. The vessel has a grav deck of 140 metres wide to the benefit of its the 23 crew members, who have access to decent quarters as well as supplies from its vast stores.</p>
history: |-
  <p>Originally launched in 2754, the Tramp was popular with frontier traders due to its defensive armament. However, it eventually lost market share to the larger Star Lord class and fell out of production by the 30th century. In 3040, the manufacturer SelaSys Inc. revived the design. Because the Tramp shared a similar size with the Star Lord, SelaSys was able to save significantly on manufacturing costs and resume full-scale production within six years. The revival was marred by a major defect in the drive coils discovered in 3052. This led to a recall of all eleven newly produced ships and a three-year production halt to fix a faulty "mesh spinner." Although production resumed in 3055, the recall severely damaged the ship's reputation. Due to low demand and lingering doubts about its reliability, the Tramp is currently considered relatively easy to acquire. Since 3067, Isesaki Shipping has produced a small number of the class every few years directly for own company use. Surplus ships are often sold to independent buyers and other shipping corporations at auction.</p>
manufacturer: "Isesaki Shipping, SelaSys Incorporated"
