chassis: "Field Gun Platoon (AFFS)"
model: "(Motorized LBX20 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing assault-class LB-X autocannon that can fire cluster rounds capable of shredding infantry in the open, these field gun crews deliver the heaviest area-effect direct fire available to ground forces.</p>
