chassis: "Thunder Fox"
model: "TFT-F11"
overview: |-
  <p>The Thunder Fox is a fifty-five-ton quad BattleMech introduced in 3077 by Skobel MechWorks on Terra. Derived from stolen Word of Blake technology during the final years of the Jihad, the design is based on the chassis of the Blue Flame quad 'Mech. Despite the stigma attached to Word of Blake designs in the post-Jihad era, the Thunder Fox proved commercially successful, finding eager buyers in the newly formed Republic of the Sphere. Production soon expanded to Defiance Industries on Hesperus II and Luthien Armor Works on New Samarkand, establishing the design as a multi-faction medium striker. The Thunder Fox fills a specialist niche as a stable, four-legged sniping platform with respectable mobility, and its ease of maintenance has helped sustain its popularity across multiple successor states well into the Dark Age.</p>
capabilities: |-
  <p>Built on a heavily modified Dennenbach-Mitchell Series 8 chassis inherited from the Blue Flame, the Thunder Fox adds ten tons to that design while sacrificing some mobility. A standard DAV 220 fusion engine provides a top speed of sixty-four kilometers per hour, modest for a medium 'Mech but adequate for its intended role as a ranged combatant. Three Rawlings 60 jump jets, arranged with a center-mounted unit providing lift and two rear-leg units offering directional control, grant a ninety-meter jump capability that helps compensate for the quad chassis's limited torso rotation.</p><p>The Thunder Fox's primary armament centers on long-range engagement. A Corean light Gauss rifle and Diverse Optics Sunbeam extended-range large laser provide effective striking power beyond six hundred meters, allowing the 'Mech to exploit its stable firing platform. Close-range defense relies on a Guided Technologies Streak SRM-4 launcher and a Diverse Optics ER small laser, though the Thunder Fox is often outgunned in brawling engagements. Nine tons of Krupp light ferro-fibrous armor with CASE protection offer acceptable survivability, sufficient to absorb a heavy PPC strike without penetration except when caught from behind. The quad configuration provides excellent stability for precision fire but limits the design's ability to engage multiple threats simultaneously.</p>
deployment: |-
  <p>Fielded in 3119, this variant stands as a radical departure from the original Thunder Fox concept. Over twenty tons of hardened armor make this variant extraordinarily resilient, while a Clan-built ER PPC mounted in a head turret provides devastating firepower with a wide firing arc. A torso-mounted cockpit and compact gyro free space for the turret installation, and a larger XXL engine maintains reasonable mobility despite the massive armor burden. Five standard jump jets provide one hundred fifty meters of jumping capability. A targeting computer enhances the accuracy of the main weapon, making the F11 a formidable defensive emplacement on legs. The XXL engine's fragility is the design's primary weakness, though the sheer volume of hardened armor mitigates much of this concern. Produced exclusively by Defiance Industries on Hesperus II, the F11 has seen service primarily with Lyran Commonwealth forces.</p>
history: |-
  <p>The Thunder Fox's origins are rooted in corporate espionage and the chaos of the Jihad's final years. When the Word of Blake Protectorate began to collapse, most defense corporations scrambled to reposition their product lines. Skobel MechWorks on Terra prospered thanks to an engineer who had defected from Mitchell Vehicles and joined Skobel in 3075. Using connections within the Word of Blake, she redirected components from multiple Blakist production programs, combining the Blue Flame's chassis with diverted weaponry, armor, and engine components to create what was essentially a 'Mech that officially did not exist. Republic Intelligence later determined that the engineer had been siphoning trade secrets from Mitchell for years and may have been on Skobel's payroll the entire time.</p><p>The gamble paid off handsomely. Despite predictions that Blake-derived designs would carry a lasting stigma, the Thunder Fox became a popular design within the Republic of the Sphere. The TFT-A9 entered service with the Principes Guards and other Republic formations by 3083. Lyran units along the Republic border began receiving limited quantities, and Defiance Industries on Hesperus II soon established its own production line. The Draconis Combine followed suit, with Luthien Armor Works beginning production on New Samarkand around the same time. StarCorps Industries on Loburg briefly held a production license as a contingency arrangement, though this line never became fully active.</p><p>The engineer behind the Thunder Fox's creation was ultimately indicted for war crimes and profiteering, a fate that did nothing to diminish demand for her creation. By the 3130s, the HPG Blackout and the fragmentation of the Republic scattered Thunder Foxes across numerous splinter factions. Steel Wolves, Swordsworn, and Spirit Cats units all fielded the design, drawn to its reliability and ease of maintenance. Both the Lyran Commonwealth and Draconis Combine continued developing specialized variants, ensuring the Thunder Fox remained a common sight on battlefields well into the ilClan era.</p>
