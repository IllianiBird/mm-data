chassis: "UrbanMech IIC"
model: "2"
overview: |-
  <p>The UrbanMech IIC represents Clan Coyote's Golden Century upgrade of the original Inner Sphere design, developed around 2849 while Coyote scientists were pioneering OmniMech technology. Technicians studied battle data from the Amaris Civil War to understand the design's limitations and potential, ultimately deciding that the UrbanMech required refinement rather than radical redesign. By upgrading key components to Clan standards, they increased ground speed by more than fifty percent and improved jumping capability to ninety meters.</p><p>The UrbanMech was never popular among Inner Sphere MechWarriors, and its Clan successor found a similar niche in second-line and freeborn units rather than front-line Clusters. Clan Coyote remains the sole manufacturer, producing the design at Beta Plant 2W, though the 'Mech has spread to several other Clans through combat salvage and inter-Clan trade.</p>
capabilities: |-
  <p>The UrbanMech IIC improves upon its predecessor through systematic component upgrades rather than fundamental redesign. The original Leenex 60 engine was replaced with a Model XT4 90 series powerplant, increasing maximum speed to 54 kilometers per hour, a more than fifty percent improvement that makes the design considerably more viable in varied terrain. The Light Series Mk. II jump jets extend jumping range to ninety meters, enhancing the 'Mech's ability to exploit urban terrain and access elevated positions.</p><p>The primary armament was upgraded to a Type 9 Ultra Autocannon/10, allowing the 'Mech's main gun to fire at double the rate of its Inner Sphere predecessor. This dramatically increases damage potential during brief engagements, though MechWarriors must carefully manage ammunition consumption. A Series 1 Extended-Range small laser provides backup capability when ammunition runs dry. CASE protection in the right torso shields the pilot from ammunition explosions.</p><p>Particularly, the Coyote engineers retained the original's six tons of standard armor and ten single heat sinks rather than upgrading to Clan-standard double heat sinks. This cost-saving measure reflects the design's intended role as an inexpensive second-line unit rather than a front-line combatant, keeping production costs manageable while still delivering meaningful capability improvements.</p>
deployment: |-
  <p>Introduced in 3070 during the Jihad era, the UrbanMech IIC 2 replaces the ultra autocannon and ER small laser with a Class 20 Hyper-Assault Gauss Rifle and two tons of ammunition. A flamer provides backup capability for anti-infantry work. The HAG/20 delivers devastating close-range firepower through rapid-fire gauss slugs, making this variant even more lethal in the confined urban terrain the design was built to dominate. The modification maintains the improved speed and jumping capability of the standard IIC while significantly increasing short-range lethality.</p>
history: |-
  <p>The UrbanMech IIC emerged during the Golden Century as Clan Coyote's technician caste sought to upgrade existing 'Mech designs while their scientist caste developed revolutionary OmniMech technology. The UrbanMech was selected as the first such project, with engineers reviewing battlevids from the Amaris Civil War to establish a comprehensive picture of the design's strengths and limitations. The resulting upgrade retained the original's urban combat philosophy while addressing its most critical deficiency, ground speed.</p><p>The newly christened UrbanMech IIC proved its worth during a Clan Burrock raid on the Coyote genetic repository on Tamaron. When Burrock warriors attempted to seize genetic material, they were intercepted by the Eighteenth Assault Cluster of Lambda Galaxy in the close confines of Mecca City. Fighting in terrain ideally suited to their capabilities, the UrbanMech IICs repeatedly rounded corners of buildings, fired on the Burrock 'Mechs, and jumped away before their opponents could effectively respond. After a drawn-out engagement, the Burrock warriors withdrew without reaching the repository.</p><p>Production has remained exclusively with Clan Coyote at Beta Plant 2W, though the design has spread to other Clans over the centuries. Both Omicron and Nu Galaxies of Clan Coyote field several units equipped with the UrbanMech IIC. Clans Snow Raven, Ice Hellion, and Hell's Horses also maintain small numbers in their second-line formations. During the Jihad era, Coyote engineers introduced the UrbanMech IIC 2 variant in 3070, replacing the ultra autocannon with a Hyper-Assault Gauss Rifle for even greater close-range devastation.</p>
