chassis: "Foot Duplus Contubernium (MHAF)"
model: "(SRM 3049+)"
overview: |-
  <p>The Marian Hegemony Armed Forces organize their conventional infantry along Roman legionary lines, with formations structured into contubernia, centuries, and cohorts rather than the squads and platoons used by Inner Sphere armies. A duplus contubernium, or double tent-group, fields two squads of ten soldiers and serves as the standard patrol and security element within Marian garrison forces. Foot duplus contubernia hold ground, man defensive positions, and conduct area security operations across Hegemony worlds. Support elements carry man-portable short-range missile launchers firing the same warheads used by BattleMechs, giving the formation a potent anti-armor punch at close range.</p>
