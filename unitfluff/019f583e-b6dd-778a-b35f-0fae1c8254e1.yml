chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled RAC2 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing rotary autocannon that fire in rapid bursts, these field gun crews deliver a volume of sustained fire that suppresses enemy positions more effectively than single-shot weapons of comparable caliber.</p>
