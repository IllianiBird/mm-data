chassis: "Field Artillery Century (MHAF)"
model: "(Tracked Sniper Cannon)"
overview: |-
  <p>Infantry within the Legiones Marianes form the backbone of planetary garrison and territorial defense, freeing the Hegemony's limited BattleMech assets for offensive operations and prestige assignments. Marian field artillery centuries operate indirect fire weapons that deliver area bombardment at ranges measured in kilometers, providing the Legiones Marianes with fire support capability independent of their scarce aerospace assets. The century operates a Sniper Cannon, a direct-fire variant that engages visible targets with greater precision than its indirect-fire counterpart.</p>
