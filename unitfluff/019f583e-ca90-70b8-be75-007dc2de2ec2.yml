chassis: "Nightstar"
model: "NSR-9J"
overview: |-
  <p>The Nightstar was born in 2767 during the Amaris Civil War, commissioned by the Star League Defense Force after battlefield analysis revealed that unit commanders (particularly those piloting Marauder BattleMechs) were being systematically targeted by Amaris loyalist forces. Designed jointly by General Motors and Norse-Storm Technologies as a ninety-five-ton heavy support and command platform, the Nightstar entered production just eight months after its initial commission, evidence of the urgency of the SLDF's need. The design saw distinguished service during the liberation of Terra before becoming an early casualty of the technological regression that followed the Star League's collapse. It would take nearly three centuries before the Federated Commonwealth restored the Nightstar to active production, returning one of the Star League's most formidable assault 'Mechs to the battlefield.</p>
capabilities: |-
  <p>The Nightstar shares a number of design features with its Marauder lineage, but at twenty tons heavier and powered by a Pitban 285-rated extralight fusion engine, the chassis carries over fifty tons of weapons and equipment atop eighteen tons of Kallon Royalstar heavy armor. This combination of firepower and protection makes the Nightstar one of the most dangerous stand-off combatants in the Inner Sphere, capable of engaging and destroying opponents at virtually any range bracket.</p><p>The primary armament consists of twin Norse-Storm Model 7D Gauss rifles mounted in each arm, backed by a Defiance 1001 extended-range PPC in the right torso. This trio of weapons delivers devastating long-range firepower, with each Gauss rifle capable of stripping nearly a ton of armor per shot. For close-range defense, a pair of Defiance P5M medium pulse lasers and a head-mounted ExoStar small laser provide supplemental firepower. Fourteen double heat sinks manage the thermal load with minimal difficulty.</p><p>Beyond its weapons array, the Nightstar's electronics suite is exceptional. The Tek BattleCom communications system provides superior command-and-control capability, while the DLK Phased Array Sensor System (widely regarded as the finest stock targeting and tracking system available prior to the development of dedicated targeting computers) grants pilots extraordinary accuracy. This combination of firepower, protection, and sophisticated electronics firmly establishes the Nightstar's role as a premier command assault 'Mech, though its modest top speed of fifty-four kilometers per hour leaves it vulnerable to faster opponents that can dictate engagement range.</p>
deployment: |-
  <p>The original NSR-9J is the definitive Nightstar configuration, introduced in 2767 as the SLDF's answer to the targeted killing of Marauder-equipped commanders during the Amaris Civil War. Its combination of twin Gauss rifles, an extended-range PPC, and a sophisticated electronics suite established it as one of the premier command assault 'Mechs of the Star League era. Following the destruction of both factories in 2786, surviving examples became exceptionally rare battlefield prizes throughout the Succession Wars. When production resumed in 3057 at both Kathil and Solaris VII, this variant quickly became a common sight in both the Armed Forces of the Federated Suns and the Lyran Alliance Armed Forces, serving as the backbone of heavy assault lances across the former Federated Commonwealth.</p>
history: |-
  <p>The Nightstar's origins trace directly to the chaos of the Amaris Civil War, when Stefan Amaris's forces made a deliberate practice of targeting SLDF unit commanders in their distinctive Marauder BattleMechs. The SLDF's response was swift, within eight months of commissioning, the first Nightstars rolled off production lines at General Motors on Kathil and Norse Technologies on Afleir, providing commanders with a vastly more survivable platform from which to lead their forces. The design saw distinguished service during the liberation of Terra and the final campaigns against Amaris.</p><p>The Nightstar became one of the earliest victims of the First Succession War. In 2786, a Free Worlds League raid savaged the Norse Technologies factory on Afleir, while a freak accident killed the General Motors engineering team on Kathil. With both production lines silenced and the technological expertise to rebuild them lost, the Nightstar joined the growing list of Star League designs that slipped beyond the Inner Sphere's ability to manufacture. Surviving examples became increasingly rare prizes, fought over by Successor State militaries desperate for any edge.</p><p>Nearly three centuries later, in 3057, the recovery of lostech and advances in manufacturing enabled both halves of the fracturing Federated Commonwealth to restart Nightstar production. General Motors reopened its Kathil line, while Norse-Storm Technologies (the corporate successor to Norse Technologies) established production on Solaris VII. The timing proved fortuitous, as the Nightstar entered service just as the Clan threat and internal divisions within the Federated Commonwealth created enormous demand for heavy assault platforms.</p><p>During the FedCom Civil War, the Nightstar served on both sides of the conflict, with its presence on the battlefield often marking the location of senior commanders. Reports from the war include accounts of Nightstar pilots employing extreme measures in the bitter fighting (including the use of atomic weapons on worlds such as Axton and Marlette) illustrating the desperate intensity of that conflict. The Lyran Alliance permitted mercenary sales early on, particularly to units deployed along the Clan Occupation Zones, while the Federated Suns restricted sales to its most trusted mercenary commands only after line units like the Davion Assault Guards received adequate numbers.</p><p>The design has continued to see active production and deployment through the Jihad and into the Dark Age. General Motors leveraged its experience with the successful Marauder MAD-9D to restart an updated Nightstar production line on Kathil, producing the NSR-10D variant beginning around 3144. The Nightstar remains a symbol of battlefield command authority, its distinctive silhouette marking the presence of senior officers and elite formations across the Inner Sphere.</p>
