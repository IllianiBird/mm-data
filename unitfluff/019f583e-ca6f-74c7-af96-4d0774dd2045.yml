chassis: "Lynx"
model: "LNX-9Q"
overview: |-
  <p>The Lynx was introduced in 2761 by Blue Shot Weapons of Solaris VII as a dedicated striker BattleMech for the Star League Defense Force. One of the first designs built around an Extended Range Particle Projection Cannon, the Lynx offered an exceptional combination of speed, firepower, and protection for a medium 'Mech. Blue Shot Weapons' limited production capacity meant the design never achieved widespread deployment during the Star League era, and the technological decline of the Succession Wars drove it to the brink of extinction.</p><p>The design was resurrected in 3056 when Blue Shot Weapons rebuilt its production lines, with a subsequent licensing agreement with Telfar BattleMechs of Midway expanding output to meet demand from both the Lyran Alliance and the Draconis Combine. Beyond the Inner Sphere, Clan Smoke Jaguar rebuilt the Lynx with Clan technology during the Golden Century, designating it the Lynx C.</p>
capabilities: |-
  <p>The Lynx achieves its striker role through a potent combination of mobility and ranged firepower. Powered by a Nissan 275 XL extralight engine, the fifty-five-ton 'Mech reaches speeds of eighty-six kilometers per hour, while five Luxor Load Lifter jump jets provide a hundred and fifty meters of jumping distance, enabling it to exploit terrain that heavier opponents cannot follow. Nearly twelve tons of Kallon Unity Weave armor provide protection approaching the maximum a chassis of this weight can bear, giving MechWarriors confidence to engage targets well above the Lynx's weight class.</p><p>The primary armament centers on a Defiance 1001 ER PPC mounted in the right arm, delivering punishing fire at nearly seven hundred meters. A Defiance B3L large laser in the right torso supplements this reach, while four Defiance B3M medium lasers distributed across the center torso, left torso, and left arm create a devastating close-range bracket. This all-energy loadout eliminates ammunition dependency, allowing the Lynx to operate independently for extended periods, a critical advantage for deep strikes and prolonged engagements. Fifteen double heat sinks manage the considerable thermal load, though sustained alpha strikes still demand careful heat discipline from pilots.</p>
deployment: |-
  <p>This variant is the original Star League-era production model, representing the Lynx as Blue Shot Weapons intended it. Its combination of an ER PPC, large laser, and four medium lasers provides overlapping engagement envelopes from extreme range down to point-blank combat. The all-energy weapons suite and generous armor protection make the 9Q an exceptionally self-sufficient design, well-suited to the independent operations and extended patrols that defined its Star League Defense Force role.</p>
history: |-
  <p>The Lynx traces its origins to the height of the Star League era, when Blue Shot Weapons of Solaris VII began production in 2761. Designed for the SLDF as a striker capable of independent operations, the Lynx earned distinction as one of the first BattleMechs engineered around an extended-range PPC. Despite its impressive capabilities, Blue Shot's limited manufacturing capacity restricted the Lynx to relatively small production runs throughout the Star League period.</p><p>The fall of the Star League brought further hardship to the design. Blue Shot Weapons struggled to maintain production as the technological base of the Inner Sphere eroded during the Succession Wars. Many surviving Lynxes were downgraded to the less capable LNX-8Q configuration as advanced components became irreplaceable. In 2928, a House Marik raid destroyed the Solaris VII factory entirely, and the remaining Lynxes were gradually cannibalized for parts until the design effectively vanished from the Inner Sphere's battlefields.</p><p>The Lynx's story diverged among the Clans. Carried into exile with Kerensky's Exodus fleet, the design found a new home with Clan Smoke Jaguar. Rebuilt with Clan technology around 2848, the Lynx C served alongside the Sling during the Jaguars' participation in Operation Klondike and the Mongoose Absorption campaign. However, the rapid advance of Clan technology in the mid-twenty-ninth century (particularly the advent of OmniMechs) eclipsed the Lynx C, relegating it to garrison clusters and second-line formations.</p><p>In the Inner Sphere, the Lynx's resurrection came in 3056 when Blue Shot Weapons finally secured the resources to rebuild its Solaris VII production lines. A licensing agreement with Telfar BattleMechs of Midway in the Draconis Combine expanded production capacity, allowing both LAAF and DCMS commands to field the design. By 3067, both manufacturers reported strong sales, with the Lynx appearing in several of the best-equipped regular and mercenary commands of both realms.</p><p>The Clan Lynx C met a grimmer fate. The Jaguars' defense of Huntress during Operation Serpent saw surviving Lynx C units pressed into service against Inner Sphere forces. Following the destruction of Clan Smoke Jaguar, Clan Ice Hellion salvaged many of the surviving examples, only for the majority to be destroyed during the disastrous Operation Ice Storm. The Lynx C's manufacturing base on Huntress and Strana Mechty passed through several Clan hands in the post-Invasion period, though active production appears to have long since ceased.</p>
