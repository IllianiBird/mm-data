chassis: "Jump Platoon (AFFS)"
model: "(Laser 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Jump-capable infantry provide the vertical mobility that AFFS commanders prize in urban combat and rough terrain, able to bypass obstacles and seize elevated positions that ground-bound platoons cannot reach. Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these platoons field one of the most effective personal arms available to conventional infantry, though the weapons are significantly more expensive and require soldiers to carry additional power packs.</p>
