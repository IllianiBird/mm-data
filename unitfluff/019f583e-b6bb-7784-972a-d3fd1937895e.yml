chassis: "Field Gun Platoon (AFFS)"
model: "(Tracked AC5 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing medium autocannon that balance range and hitting power, these field gun crews provide flexible direct fire support effective against both infantry positions and light vehicles.</p>
