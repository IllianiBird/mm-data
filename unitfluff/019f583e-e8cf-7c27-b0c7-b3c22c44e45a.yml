chassis: "HoverPod"
overview: |-
  <p>The tiny and relatively slow HoverPod is a very common tool for motorized and mechanized infantry units. These vehicles are very small and can easily be transported by most APCs. They award a high measure of individual mobility to troopers, but are in no way actual combat units, as their use requires a level of dexterity that precludes the deployment of support weaponry.</p>
