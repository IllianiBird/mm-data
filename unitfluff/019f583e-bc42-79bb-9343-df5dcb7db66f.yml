chassis: "Field Artillery Platoon (FWLM)"
model: "(Tracked Arrow IV 3044+)"
overview: |-
  <p>Conventional infantry within the FWLM serve as the backbone of provincial defense across a patchwork of semi-autonomous states, each maintaining its own military traditions and equipment preferences. Deploying Arrow IV artillery systems, these platoons field the most sophisticated indirect fire weapon available to conventional formations. Arrow IV rounds can be guided to their targets with remarkable precision, and the system's compatibility with homing munitions allows designated targets to be engaged with near-certainty.</p>
