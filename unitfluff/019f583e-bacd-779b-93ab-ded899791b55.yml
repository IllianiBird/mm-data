chassis: "Clan Field Gun Point"
model: "(Tracked AC5 Basic)"
overview: |-
  <p>Conventional infantry within the Clan touman fills the garrison and screening roles that battle armor and BattleMech forces cannot efficiently sustain across dozens of occupied worlds. Field Gun Points are crew-served weapon teams that bring heavier firepower to the infantry level, towing weapons too large for individual soldiers to carry. The gun itself defines the Point's role, with lighter autocannons providing anti-infantry and anti-vehicle fire while heavier weapons can threaten even armored targets. The Point's field gun is a medium-caliber autocannon that balances range, accuracy, and stopping power, providing flexible direct-fire support against both vehicles and infantry concentrations.</p>
