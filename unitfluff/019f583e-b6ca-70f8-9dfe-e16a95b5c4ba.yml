overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing ultra autocannon capable of double-rate fire, these field gun crews deliver rapid-fire direct support that doubles their effective output during critical engagements.</p>
