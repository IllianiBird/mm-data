chassis: "Rime Otter"
model: "B"
overview: |-
  <p>The Rime Otter is a 55-ton medium Clan OmniMech introduced in 3146 by Jötunn BattleWorx for the Rasalhague Dominion. Designed to fill the role of a heavy medium support unit, the Rime Otter was conceived to operate alongside specialist designs within the Dominion's front-line Clusters, providing a rugged anchor for lighter formations or screening heavier assault Stars. Jötunn BattleWorx drew heavily on its experience developing the Grizzly (particularly that design's reinforced internal structure) to create an OmniMech that could absorb punishment far beyond what its weight class would suggest. Built exclusively at the company's facilities on Goito, the Rime Otter represents the Dominion's effort to develop indigenous OmniMech designs rather than relying solely on established Clan Ghost Bear production lines.</p>
capabilities: |-
  <p>The Rime Otter is built around a RUFM XL 275 extralight engine augmented by a fixed MASC system, giving it a cruising speed of 54 kph that can be pushed to a sprinting speed of 108 kph in short bursts. This combination allows the design to keep pace with lighter machines such as the Fire Moth while retaining the structural integrity to stand alongside heavier units like the Mastodon. The chassis itself uses a Type 56-55C Modified reinforced internal structure, granting exceptional survivability for a medium OmniMech, the Rime Otter can continue fighting through damage that would cripple less robust designs.</p><p>The trade-off for this durability is a relatively modest 18.5 tons of pod space, comparable to many 45-ton designs. This limitation has drawn criticism from MechWarriors who would prefer the firepower of established Sea Fox or WarBear-produced alternatives. IceSheet ferro-fibrous armor provides solid protection for the weight, while a Garret T10B communications suite and GC Heimdallr System Type 1 targeting system round out the electronics package. The Rime Otter's Prime configuration leans into a brawler role, mounting paired large pulse lasers in the arms alongside an Artemis V-guided LRM-10 with CASE II ammunition protection, a loadout that rewards aggressive pilots willing to close to effective range rather than trade fire at distance.</p>
deployment: |-
  <p>Alternate Configuration B is optimized for anti-infantry and vehicle suppression at close to intermediate range. A pair of improved heavy medium lasers in the right arm serve as the primary anti-armor weapons, while two machine gun arrays (each comprising four light machine guns mounted in the side torsos) deliver devastating volumes of fire against unarmored targets. An LB 10-X autocannon in the left arm with two tons of ammunition rounds out the configuration, offering flexibility between cluster and slug rounds depending on the engagement. CASE II protects the light machine gun ammunition in the right torso. This loadout has seen effective use in garrison and counter-insurgency operations where the Dominion faces conventional military threats.</p>
history: |-
  <p>Rime Otter production began in 3146 at Jötunn BattleWorx on Goito, making it one of the newer OmniMech designs to enter service with the Rasalhague Dominion. The design emerged from the Dominion's broader effort to field indigenous military hardware rather than depending entirely on legacy Clan Ghost Bear production lines or purchases from Clan Sea Fox merchants. Jötunn BattleWorx, already known for the Grizzly, leveraged its experience with reinforced structures to create a medium-weight OmniMech that could serve as the backbone of mixed-weight formations.</p><p>The Rime Otter's integration into front-line Clusters proved uneven at first, as warriors accustomed to established designs required time to adapt to the new machine's particular strengths and limitations. Early deployments revealed that some units struggled to employ the design effectively. On Ganshoren, the 300th Battle Cluster's encounter with the Second Falcon Dragoons nearly ended in disaster when warriors used their Rime Otters as shields for Mad Dog Mk III fire-support units, absorbing punishing fire in a role better suited to dedicated heavy 'Mechs. While the Rime Otter's reinforced structure allowed many to survive the engagement, the tactic proved costly and unsustainable.</p><p>Other formations found more success by embracing the design's intended role. When the Crater Cobras raided Soverzene, a lone Rime Otter serving with the Sixth Bear Regulars repeatedly absorbed damage from the raiding force's screening elements, using its reinforced chassis to shrug off hits that would have disabled lighter scouts. The 'Mech returned to harass the frustrated Cobras day after day, demonstrating the design's exceptional durability in extended operations. Less traditionalist Clusters have learned to employ the Rime Otter judiciously, committing the design to battle only when the full weight of a formation can be brought to bear.</p><p>Among Dominion commanders, a Rime Otter that holds its ground and fights rather than withdrawing has become a recognized signal that a formation is fully committed to an engagement and that reinforcements are imminent. Jötunn BattleWorx has continued to refine the design, and it has slowly spread through the Dominion's Clusters as warriors grow more familiar with its capabilities. The company would go on to carry the Rime Otter's signature reinforced structure forward into the Mastodon assault OmniMech, further establishing Jötunn BattleWorx as a key supplier to the Dominion's military.</p>
