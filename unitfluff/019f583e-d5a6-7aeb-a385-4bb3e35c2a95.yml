chassis: "Raider"
model: "JL-3A"
overview: |-
  <p>The Raider is a fifty-ton medium BattleMech introduced in 3134 by Bannson Universal Unlimited. Conceived as part of the controversial "Project Jacob's Ladder," the design was an attempt by Republican industrialist Jacob Bannson to produce a cheap yet combat-capable 'Mech built entirely from in-house components. Powered by an internal combustion engine rather than a fusion plant, the Raider occupies an unusual niche among medium BattleMechs, trading conventional performance expectations for dramatically lower manufacturing costs.</p><p>Despite falling short of its original design goals, the Raider proved a commercial success on the open market. Its low production cost and straightforward construction made it attractive to smaller mercenary commands and planetary garrisons unable to afford conventional BattleMechs, and the design's continued proliferation across the Inner Sphere has ensured its presence on battlefields well into the ilClan era.</p>
capabilities: |-
  <p>The Raider's defining characteristic is its Bannson Spark 200 internal combustion engine, a feature that sets it apart from virtually all contemporary medium BattleMechs. While this powerplant limits the design to a maximum speed of sixty-four kilometers per hour and prevents the mounting of energy weapons without auxiliary power amplifiers, it dramatically reduces manufacturing costs. The incorporation of military-grade Triple Strength Myomer partially compensates for the engine's limitations, boosting the Raider's top speed to over eighty-six kilometers per hour and enhancing close-combat effectiveness when heat levels are properly managed.</p><p>The base armament consists of a pair of BUU Quarrel-10 MRM launchers in the right torso, fed by a single ton of ammunition, and a BUU SuperCutter dual saw mounted on the left arm. This loadout is functional but limited, with the MRM launchers suffering from inherent inaccuracy and the dual saw restricting the 'Mech to close-range engagements. Seven tons of BUU MechStandard armor provides protection that exceeds most IndustrialMechs but falls well short of what a conventional fifty-ton BattleMech would carry, leaving the Raider vulnerable to sustained fire from dedicated combat designs.</p>
deployment: |-
  <p>This variant is one of several locally produced variants that emerged after Bannson Universal licensed the Raider's design specifications to third-party manufacturers. Tagged by Republic of the Sphere intelligence as part of the JL-3 series, this variant follows the common pattern of removing the cumbersome dual saw and replacing the original single heat sinks with double-strength models to improve thermal management. The addition of ferro-fibrous armor provides improved protection without a significant weight increase, while revised weaponry addresses the base design's lack of versatility. Production of this variant began around 3138 at multiple facilities across the Inner Sphere.</p>
history: |-
  <p>The Raider's origins lie in Jacob Bannson's ambition to build a private military force capable of operating independently of Republic oversight. Project Jacob's Ladder began as an attempt to produce a fully functional BattleMech using only Bannson Universal Unlimited's in-house manufacturing capabilities. When the company's engineers failed to develop a viable fusion engine after years of effort, the project pivoted to an ICE-powered design. The resulting 'Mech was christened the Raider by Bannson's marketing department and entered production in 3134 at the company's facilities on Tybalt and St. Andre.</p><p>The Raider saw its earliest combat service with Bannson's personal mercenary force, Bannson's Raiders, also known as the Scourge. Few warriors assigned the design were enthusiastic about it, and the 'Mech was frequently given to the newest recruits as an assessment tool before they could be assigned more capable machines. This practice meant that Raider pilots were often the first casualties in any engagement, though some experienced warriors learned to exploit the design's low cost and expendability to compensate for its shortcomings through sheer aggression and numbers.</p><p>Following the collapse of Bannson Universal in the late 3140s, the Raider's legacy was carried forward by the numerous companies to whom Bannson had licensed the design specifications. Simcox Industrials of Mandalas introduced their own production line using these plans, and the design became increasingly popular among smaller mercenary forces working the Coreward Periphery. The low cost of production and ease of construction ensured the Raider's continued manufacture even as it was recognized as wildly outclassed by virtually every medium BattleMech produced since the early Succession Wars. By the ilClan era, Simcox and the remnants of Bannson's manufacturing network continue to sell the Raider to planetary garrisons, budget-conscious mercenary units, and paramilitary organizations of questionable standing.</p>
