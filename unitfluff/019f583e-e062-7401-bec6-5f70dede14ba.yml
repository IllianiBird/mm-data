chassis: "HawkWolf"
model: "HWK-3F"
overview: |-
  <p>The HawkWolf is an eighty-ton assault-class BattleMech designed and produced by Hope Industrial Works on Randis IV for the Brotherhood of Randis. Named after a canine predator native to the planet, the design entered service in 3076 as the first wholly original BattleMech produced by the Brotherhood. The HawkWolf was conceived as a dedicated long-range fire support platform, filling a role similar to the venerable Longbow but built with the limited industrial resources available to a single-planet Deep Periphery nation. Despite the constraints of its origins, the HawkWolf proved to be a reliable and effective missile platform that earned a solid reputation among both the Brotherhood's own forces and export customers in the near Periphery.</p>
capabilities: |-
  <p>The HawkWolf is built around an Advanced HWK chassis powered by a Pitban 320 fusion engine, giving the eighty-ton design a top speed of sixty-four kilometers per hour. Twelve tons of Hope Shield standard armor provide solid protection for a fire support platform, while CASE protects against catastrophic ammunition detonations in the right torso, where all munitions are stored. The design mounts fourteen single heat sinks, adequate for managing the heat load of its missile-centric arsenal.</p><p>The HawkWolf's primary armament consists of a pair of Delta Dart LRM-15 launchers mounted in each arm, capable of delivering devastating salvos at long range. These are supplemented by two Doombud five-tube Multi-Missile Launchers in the left and right torsos, which offer tactical flexibility by accepting both long-range and short-range missile ammunition. Four tons of LRM reloads and two tons of MML ammunition provide reasonable endurance, though extended engagements will tax the design's supplies.</p><p>The HawkWolf's primary weakness lies in its complete lack of close-combat capability. With no arms to speak of (replaced entirely by the LRM launcher housings) the design cannot punch or grapple, and MechWarriors must rely on the MML launchers switched to short-range missiles if enemies close the distance. The Brotherhood mitigates this by deploying HawkWolfs behind more agile frontline 'Mechs, where the design's protected actuators and easy maintenance characteristics serve it well in a sustained fire support role.</p>
deployment: |-
  <p>The original HWK-3F was the first HawkWolf to enter service in 3076, built entirely with primitive technology due to the Brotherhood's limited industrial base at the time. Slower, heavier, and hotter-running than its modernized successor, the primitive HawkWolf nonetheless served the Brotherhood well in its intended role as a training and fire support platform for the order's squires, keeping the Brotherhood's youngest warriors at a safe distance from more advanced opponents. The HWK-3F remained the primary production model for over two decades before the availability of modern manufacturing techniques enabled its replacement.</p>
history: |-
  <p>The HawkWolf's origins are inseparable from the history of the Brotherhood of Randis itself. Founded in 2988 when MechWarrior Commander Erdelmaine Randis led a small cadre of warriors to liberate the planet then known as Hope IV, the Brotherhood established itself as a quasi-religious knightly order dedicated to BattleMech combat. For decades, the Brotherhood operated with a handful of salvaged and purchased 'Mechs, relying on mercenary contracts to fund their activities and defend the Fiefdom of Randis from Periphery pirates.</p><p>The path toward indigenous 'Mech production began under Grand Knight Galahad Frews, who took command in 3037 and initiated a sustained program of planetary development. Hope Industrial Works was established to build "RetroMechs" using primitive technology, the only manufacturing level the Fiefdom's limited industrial base could support. Initial production focused on RetroTech Firebees and Dervishes, which proved successful both for equipping the Brotherhood's own forces and generating revenue through export sales. Emboldened by this success, the Brotherhood authorized development of an entirely new design, and the HawkWolf entered production in 3076.</p><p>The HWK-3F's appearance during the Jihad went largely unnoticed beyond the Deep Periphery, as the Brotherhood's enemies were primarily pirate bands rather than the major powers consumed by the Word of Blake conflict. The primitive HawkWolf served as a training platform for the Brotherhood's squires and as fire support for more capable frontline 'Mechs. By 3095, HawkWolfs had found their way into several nearby states' militaries through export sales, establishing the design's reputation as a reliable if unsophisticated missile platform.</p><p>A transformative moment came in 3100 when Grand Knight William Dirac negotiated comprehensive economic and military pacts with the Calderon Protectorate and the Filtvelt Coalition, the Fiefdom's closest allies. These agreements brought modern manufacturing techniques to Hope Industrial Works, enabling the upgrade from the primitive HWK-3F to the standard-technology HWK-4F. In return, raw materials from the Randis system supported terraforming projects in the Protectorate and BattleMech production in the Coalition.</p><p>The value of these alliances was tested in 3128 when a battalion-sized bandit force from the Tortuga Dominions raided Randis IV, inflicting substantial damage on Hope Industrial Works. The following year, during Operation TRIDENT (a combined military operation involving forces from the Fiefdom of Randis, the Calderon Protectorate, and the Taurian Concordat) the Brotherhood deployed HawkWolfs against the Tortuga Pirates at New Port Royal. In the largest engagement of the campaign at Copper Ridge Plateau, a lance of Brotherhood HawkWolfs provided critical fire support, helping to break a pirate force estimated at eight battalions and earning credit for dozens of destroyed pirate 'Mechs and vehicles. The facility recovered from the 3128 raid and expanded its production lines, producing several new BattleMech designs using Succession Wars-level technology that represented a significant advance over the original RetroTech machines.</p>
