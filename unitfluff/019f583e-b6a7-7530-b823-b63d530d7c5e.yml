overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing heavy LB-X autocannon capable of firing cluster ammunition, these field gun crews deliver devastating anti-infantry capability at ranges that threaten light vehicles with solid shot.</p>
