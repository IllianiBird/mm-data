overview: |-
  <p>The Templar III is a Dark Age era eighty-five ton assault OmniMech produced by General Motors for the Federated Suns. Introduced around 3100, it was designed as a direct replacement for the original Templar after the destruction of Kallon Industries' factory on Talon during the Jihad eliminated production of the first-generation design. General Motors established a new production line on New Valencia to continue the Templar legacy with updated technologies.</p><p>Like its predecessor, the Templar III serves primarily as a command 'Mech for AFFS assault formations. The design incorporates advanced equipment across its alternate configurations, giving field commanders significant tactical flexibility while maintaining the assault-weight presence that made the original Templar an effective formation anchor.</p>
capabilities: |-
  <p>The most significant change from the original Templar is the Templar III's adoption of a GM 340 Light engine in place of the KalTek 340 Extralight. This substantially improves survivability by eliminating the vulnerability to side torso destruction that plagued the original design, though it comes at the cost of reduced pod space, dropping from forty tons to twenty-nine. The Kallon Type XX Endo Steel chassis and StarGuard CIV armor maintain the same level of protection as the predecessor, and a Heavy-Duty Gyro improves stability under fire.</p><p>The primary configuration draws comparison to the proven WHM-8D Warhammer loadout, mounting twin ER PPCs as its primary armament alongside extended-range medium and small lasers. A four-tube short-range missile launcher provides supplementary close-range firepower, with CASE protecting the ammunition. A targeting computer links all energy weapons for improved accuracy, while four additional double heat sinks manage the considerable thermal output of the energy-heavy weapons suite.</p><p>While the reduced pod capacity limits the Templar III's ability to mount the heaviest weapon loadouts, the improved chassis durability ensures it can remain in the fight longer. Several configurations take advantage of advanced and Clan-specification technologies to maximize firepower within the tighter weight budget, making the Templar III a more resilient, if somewhat less versatile, successor to the original.</p>
deployment: |-
  <p>The primary configuration draws heavily from the proven WHM-8D Warhammer weapons loadout, mounting twin ER PPCs as its main armament alongside extended-range medium and small lasers. A four-tube short-range missile launcher provides supplementary close-range firepower, with CASE protecting the ammunition store. All energy weapons are linked to a targeting computer for enhanced accuracy, and four additional double heat sinks manage the heavy thermal output.</p>
history: |-
  <p>The Templar III's development grew directly from the ashes of the Jihad. With the Kallon Industries factory on Talon destroyed by the Word of Blake, the Federated Suns lost its only production source for the original Templar. General Motors on New Valencia, already producing the Pendragon, a limited-production design loosely based on the Templar chassis, leveraged their familiarity with the platform to develop a modernized successor. Production of the Templar III began around 3100, establishing New Valencia as the new center of Templar-lineage manufacturing.</p><p>The Templar III quickly became a popular command 'Mech for AFFS company and battalion commanders, appearing regularly in assault lances throughout Federated Suns frontline formations. During the Capellan invasion campaigns of the Dark Age, lances of Templar IIIs proved effective in combined arms operations. In one notable engagement on Spica in late 3144, a lance of three Templar IIIs and a Salamander inflicted significant casualties on a Capellan 'Mech company, using ER PPCs and targeting computers to devastating effect while channeling the enemy through minefields and narrow streets.</p><p>The Templar III's influence extended beyond the Federated Suns. When General Motors resumed Victor production in the 3080s, they redesigned that venerable assault 'Mech to share many components with the Templar III, creating manufacturing efficiencies on New Valencia. Additionally, the custom configuration piloted by the First Prince demonstrated the platform's ability to accept Clan-specification weaponry, producing a significantly more lethal variant that served through the critical campaigns of the late 3140s and into the ilClan era.</p>
