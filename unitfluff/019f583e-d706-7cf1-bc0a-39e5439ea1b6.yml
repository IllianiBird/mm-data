chassis: "Waneta"
model: "S-WN-1LAM"
overview: |-
  <p>The Waneta was the heaviest of the three Spectral Land-Air 'Mechs developed by the Word of Blake, tying the long-lost Shadow Hawk LAM as the largest LAM ever designed at fifty-five tons. Introduced in 3078, the Waneta was produced by Master's Wings Aerospace and Bannock-Braigh Aerospace for the Word of Blake Militia. Named after shapeshifting spirits from the mythology of ancient AmerIndian cultures on Terra, the Waneta represented the Blakists' most ambitious attempt to revive LAM technology for the modern battlefield. Despite boasting greater combat potential than its lighter stablemates, the Pwwka and Yurei, the design was produced in extremely limited numbers and became extinct by 3081 following the destruction of both manufacturing sites during the final days of the Jihad.</p>
capabilities: |-
  <p>The Waneta's designers prioritized firepower and aerial agility over endurance, producing a capable but short-legged combatant. The primary armament centers on a Clan ER large laser and a pair of Clan LRM 15 launchers, providing substantial long-range striking power supplemented by a single Clan ER small laser for close defense. The source of this Clan-grade weaponry, whether salvage, black market acquisition, or indigenous Blakist production, was never confirmed before the design's extinction.</p><p>Built on the Spectral-L Series WN2L chassis, the Waneta mounts a DAV 220 fusion engine for a top ground speed of sixty-four kilometers per hour. Twelve Chilton 950 Improved Jump Jets provide enhanced mobility in both AirMech and fighter modes, boosting atmospheric performance beyond what standard jump jets could deliver. This improved aerial agility came at significant cost, as the weight of the Improved Jump Jets precluded larger fuel tanks, bomb bays, or additional weapons. With only a single ton of fuel and eight rounds per LRM launcher, the Waneta suffered from poor battlefield endurance.</p><p>Nine tons of Durallex Divine Protector armor provide reasonable protection for a medium-weight LAM. Like all Spectral LAMs, the Waneta pairs a small cockpit with VDNI to offset the reduced pilot workspace, and mounts standard double heat sinks to manage its thermal load.</p>
deployment: |-
  <p>This bomber variant was identified from combat footage of the Principality of Regulus campaign against Circinus, the last stronghold of the Word of Blake leadership. The Improved Jump Jets of the standard configuration were replaced with standard models, freeing tonnage for internal bomb bays capable of carrying specialized ordnance. The trade-off resulted in noticeably slower acceleration in hybrid and fighter modes compared to the standard Waneta. Fielded exclusively during the defense of Circinus, these Waneta carried special ordnance against Regulan assault forces. None are known to have survived the engagement, and the variant's full technical specifications remain incomplete, reconstructed primarily from limited intelligence footage.</p>
history: |-
  <p>The Waneta emerged during the final desperate years of the Jihad as part of the Word of Blake's Spectral LAM program, an ambitious effort to resurrect Land-Air 'Mech technology that had been considered extinct since the Succession Wars. The appearance of the Spectral LAMs on the battlefield in 3075 and 3076 shocked both the allied coalition and the Principality of Regulus, as conventional wisdom had long held that LAMs were relics of the Star League era incapable of modern production.</p><p>Production of the Waneta began around 3078, making it the last of the three Spectral LAMs to enter service, following the lighter Pwwka and Yurei. The Waneta was the only Spectral type produced at both Gibson and Terra, a distinction that reflected the Blakists' confidence in the design's potential. While the engineering achievement of creating three entirely new LAM designs was remarkable, the fundamental limitations of LAM technology proved impossible to overcome. Even with Clan weaponry and VDNI pilot interfaces, the Waneta remained a BattleMech attempting to serve as an aerospace fighter, mastering neither domain.</p><p>The Waneta saw combat primarily against forces from the Principality of Regulus and the Duchy of Oriente during operations along the Word of Blake Protectorate's periphery. In the final days of the Jihad, Waneta LAMs were among the defenders of the Blakist stronghold on Circinus, the last refuge of the Word's leadership. A bomber variant carrying special ordnance was identified from combat footage of the Regulan campaign against Circinus, though none of these modified Waneta survived the assault.</p><p>The design's factories met their end alongside the Word of Blake itself. On Gibson, the Regulan nuclear bombardment of 3079 annihilated the Master's Wings Aerospace facility, erasing all trace of Waneta production. On Terra, fierce fighting around the Bannock-Braigh Aerospace complex during the Liberation of Terra, combined with suspected sabotage by Blakist holdouts, left nothing for the allied forces to salvage. With no factories, no spare parts supply, and the fall of the Word of Blake in 3081, the Waneta joined its Spectral stablemates as an extinct design. The Land-Air 'Mech once again passed from the battlefield into the pages of history.</p>
