chassis: "Werewolf"
model: "WER-LF-004"
overview: |-
  <p>The Werewolf is a forty-ton medium BattleMech introduced in 3056 by O'Neil BattleMechs of Solaris VII. Purpose-built for the gladiatorial arenas of the Game World, the Werewolf was designed from the outset as an ambush platform suited to close-quarters arena combat. O'Neil, a small manufacturer with limited production capacity, found an eager market among independent MechWarriors and fighting stables seeking an edge in the dense terrain arenas. The design exists in two distinct variants, each offering a different approach to arena dominance. The Werewolf has earned a reputation as one of the more dangerous Solaris machines of its era, with an improved model further raising its profile among the Game World's competitive stables.</p>
capabilities: |-
  <p>Both Werewolf models share a common forty-ton chassis driven by a Nissan 200 XL engine, reaching a respectable eighty-six kilometers per hour. The XL engine saves considerable weight but leaves the design vulnerable to torso breaches, a tradeoff deemed acceptable for arena machines that fight in single engagements rather than sustained campaigns. Eight tons of armor provide reasonable protection for the weight class.</p><p>The original WER-LF-004 mounts a large pulse laser as its primary weapon, supported by a standard SRM-6 launcher, paired small pulse lasers, and twin machine guns. Four Rawlings 75 jump jets give the older model strong aerial mobility, well-suited to repositioning attacks and Death From Above strikes. The improved WER-LF-005 introduced a Star League-era null signature system reverse-engineered from a salvaged Specter, rendering the 'Mech nearly invisible to sensors when the temperamental system functions properly. The WER-LF-005 trades the original's conventional weapons for a Sutel Precision Line large X-pulse laser, a Harpoon Streak SRM-6 launcher, and twin Poland Main Model C Magshot gauss weapons, while thirteen double heat sinks manage the increased thermal output. Jump capability was halved to two jets to accommodate the stealth system and upgraded armament. Both models are effective ambush platforms, though the older variant offers reliability where the newer one gambles on technological superiority.</p>
deployment: |-
  <p>The original WER-LF-004 remains in limited production alongside its improved successor, appealing to arena fighters who prefer dependable performance over the gamble of an unreliable stealth system. With twice the jump capability of the newer model, this variant gives pilots significantly more options for repositioning and launching aerial attacks, while a slight edge in armor protection further compensates for the lack of stealth capability. Several Solaris stables maintain at least one WER-LF-004 in their rosters as a reliable fallback when arena conditions favor straightforward aggression over subtlety.</p>
history: |-
  <p>The Werewolf's origins lie in the competitive arena circuit of Solaris VII, where O'Neil BattleMechs carved out a niche producing specialized gladiatorial designs during the 3050s. The original WER-LF-004 debuted in 3056 and quickly proved popular in the dense terrain arenas, where its combination of speed, jump capability, and solid close-range firepower made it a competitive platform for MechWarriors who preferred an aggressive fighting style.</p><p>The crucial moment in the Werewolf's development came when the Banshees stable approached O'Neil with a request for modifications ahead of an upcoming contest in the Hartford Gardens arena. O'Neil proposed incorporating a stealth system along with upgraded weaponry and experimental technology. The resulting WER-LF-005, introduced around 3060, proved a significant leap forward, though its effectiveness varied dramatically from fight to fight depending on whether the stealth system cooperated.</p><p>O'Neil BattleMechs has struggled to expand beyond the Solaris market. Unlike some arena manufacturers who successfully licensed their designs to major producers, O'Neil has been unable to secure a partnership with a larger firm for mass production. The company continues to fill orders for both variants, though production rates remain low. Marketing efforts have focused on Solaris VII itself, where several stables have purchased the improved model following the Banshees' success in Hartford Gardens.</p><p>The Werewolf's reliance on experimental and non-standard components has limited its appeal outside the arena circuit. Military buyers have shown little interest in a design whose signature technology is unreliable, and whose weapons loadout, while effective in arena conditions, offers limited versatility on an open battlefield. The Werewolf remains a distinctly Solarian design, its fortunes tied to the continued health of the Game World's combat sports industry.</p>
