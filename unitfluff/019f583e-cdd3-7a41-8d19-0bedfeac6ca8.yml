chassis: "Blue Flame"
model: "BLF-40"
overview: |-
  <p>The Blue Flame is a forty-five-ton quadrupedal BattleMech introduced in 3062 by Mitchell Vehicles on Terra. Produced under the Word of Blake's industrial revitalization program, the Blue Flame and its heavier companion, the White Flame, were among the first quad 'Mechs fielded by the order, joining a growing trend of quadrupedal designs appearing across the Inner Sphere during this era. Designed as a medium-weight networked combatant, the Blue Flame leveraged the inherent stability of its four-legged configuration to serve as a reliable fire support platform within coordinated formations, earning a solid if quiet reputation within Word of Blake Militia units.</p>
capabilities: |-
  <p>The Blue Flame carries a potent weapons array for its weight class, combining two Diverse Optics Sunbeam extended range large lasers with a trio of Hovertec Streak SRM-2 launchers. This loadout makes the design dangerous at virtually all engagement ranges, with the paired lasers providing accurate long-range fire while the Streak launchers deliver precise close-range missile salvos that waste no ammunition on missed shots. The design's most notable electronic feature is its improved C3 computer, enabling seamless targeting data exchange with other C3i-equipped units and dramatically increasing the combat effectiveness of networked lances.</p><p>Built on a Dennenbach-Mitchell Series 8 endo steel frame housing a VOX 225 light engine, the Blue Flame achieves a respectable top speed of eighty-six kilometers per hour. Eleven tons of StarSlab armor provide impressive protection for a medium 'Mech, giving pilots considerable staying power on the battlefield. However, the design carries notable vulnerabilities. As a quadrupedal chassis, the Blue Flame cannot twist its torso to engage threats from the rear, and it mounts no rear-facing weaponry. An enemy that successfully flanks the design can exploit this blind spot with relative impunity. The lack of CASE protection also means that an ammunition explosion in the Streak bins poses a serious risk, though most Word of Blake pilots accepted this trade-off in stride.</p>
deployment: |-
  <p>Introduced in 3073 during the height of the Jihad, this variant stands as a significant reworking of the Blue Flame's weapons philosophy. The original laser and missile loadout is entirely replaced by three light particle projection cannons mounted in the torso sections, providing consistent energy-based firepower without ammunition dependency. A medium variable speed pulse laser covers the rear arc, directly addressing the base model's most criticized vulnerability. All weapons are linked to a targeting computer that enhances accuracy across the entire array. The improved C3 computer is retained, preserving the design's role as a networked combatant within Blakist formations.</p>
history: |-
  <p>The Blue Flame's origins are inseparable from the Word of Blake's seizure of Terra and the order's ambitious industrial revitalization program. When the Blakists captured humanity's homeworld, they inherited a vast network of mothballed Star League-era manufacturing complexes that ComStar had maintained but never fully utilized. The Mitchell Vehicles facility, with its deep heritage of BattleMech and combat vehicle production stretching back to the twenty-second century, was among the highest-priority sites selected for reactivation. The decision to dedicate converted production lines to quadrupedal designs reflected both the growing acceptance of quad 'Mechs across the Inner Sphere and the Word of Blake's desire to field distinctive, purpose-built combat units.</p><p>Blue Flames were distributed in small numbers to all divisions of the Word of Blake Militia following their introduction. Military analysts noted a significant discrepancy between estimated production volumes at the Mitchell Vehicles complex and the number of Blue Flames actually observed in Militia formations. This gap was substantial enough that some experts concluded the Word of Blake had formed at least one secret division, and possibly more, equipped with 'Mechs and vehicles whose production numbers exceeded official distribution records. With the Blakists' complete control of the Sol system and aggressive recruiting throughout the Chaos March, such hidden formations were considered entirely plausible.</p><p>The Blue Flame saw extensive service throughout the Jihad, deployed alongside other Word of Blake designs in the brutal campaigns that engulfed the Inner Sphere from 3067 onward. During the later years of the conflict, the design's legacy took an unexpected turn when an engineer who had helped build the 'Mech stole its design specifications and fled Blakist territory. These stolen blueprints would later form the foundation for the Thunder Fox, introduced in the post-Jihad era. The fall of the Word of Blake and the subsequent establishment of the Republic of the Sphere brought an end to Blue Flame production at the Mitchell Vehicles complex, and the design has not seen active manufacturing since.</p>
