chassis: "Field Artillery Platoon (AFFS)"
model: "(Tracked Arrow IV 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing Arrow IV artillery systems, these platoons field the most sophisticated indirect fire capability available to conventional forces, launching guided missiles that can be directed onto targets by forward observers with TAG designators.</p>
