chassis: "Mechanized Hover Platoon (LCAF)"
model: "(Flamer 3058+)"
overview: |-
  <p>Lyran military budgets translate directly into infantry equipment quality, giving LCAF conventional forces a material edge that compensates for the uneven tactical leadership the social general tradition sometimes produces. Mechanized hover platoons ride into battle aboard hovercraft that provide both speed and the ability to cross water and rough terrain without slowing, making them effective rapid-reaction forces. Armed with standard assault rifles and supplemented by man-portable flamers, these platoons can both engage enemy personnel at range and deny terrain or flush defenders from cover with incendiary fire.</p>
