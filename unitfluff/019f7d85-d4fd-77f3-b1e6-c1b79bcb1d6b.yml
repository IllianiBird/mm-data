chassis: "Mechanized Hover Platoon (Generic)"
model: "(SRM 2400+)"
overview: |-
  <p>Mechanized hover platoons transport their infantry in hovercraft capable of crossing water, swamps, and open terrain at high speed. The fastest conventional mechanized formation available, hover platoons trade the all-terrain reliability of tracked vehicles for raw speed and amphibious capability. They are well suited to coastal defense, riverine operations, and rapid flanking maneuvers on open ground. Rough terrain and dense forests limit hovercraft effectiveness, and the vehicles offer less protection than heavier tracked or wheeled transports.</p><p>Supplementing their primary arms with shoulder-launched short-range missile systems, these platoons carry enough anti-armor punch to threaten light vehicles and damage exposed BattleMech components at close range.</p>
