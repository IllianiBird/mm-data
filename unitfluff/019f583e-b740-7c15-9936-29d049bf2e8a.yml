chassis: "Motorized Platoon (AFFS)"
model: "(MG 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Motorized platoons ride light vehicles that give them the speed to screen advancing columns, patrol supply routes, and respond to threats faster than foot infantry, though they sacrifice protection for that mobility. Supplementing their rifles with portable machine guns that provide sustained automatic fire, these platoons anchor defensive positions with suppressive capability that pins attacking infantry and discourages unarmored vehicles from closing.</p>
