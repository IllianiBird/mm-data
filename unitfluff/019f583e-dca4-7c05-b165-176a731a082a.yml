chassis: "Hel"
model: "HL-2"
overview: |-
  <p>The Hel was introduced in 3092 by Nashan Diversified, a longtime IndustrialMech manufacturer seeking to break into the BattleMech market. Designed as a fifty-ton medium skirmisher, the Hel filled the same ambush and interdiction roles as the venerable Wolverine and Enfield. Built at Nashan's Furillo production facility, the design offered impressive firepower for its weight class through an aggressive combination of energy and missile weapons on a fast, well-armored chassis.</p><p>Despite a capable design, the Hel faced immediate market challenges. The Lyran Commonwealth Armed Forces rejected the 'Mech, and Nashan managed only limited sales to mercenary commands and two provincial governments within the former Free Worlds League. When a key component supplier ceased providing critical parts, Nashan was forced to halt production entirely. Unable to continue manufacturing, Nashan sold the design specifications to Kallon Weapon Industries, who would go on to redesign the chassis as the Eris.</p>
capabilities: |-
  <p>The Hel was built to operate in lance formations for ambush and interdiction missions, filling the same strategic and tactical roles as the Wolverine and Enfield. Its right-arm-mounted Defiance 980 heavy particle projection cannon provided devastating mid-range firepower, capable of crippling lighter 'Mechs in a single volley. The Defiance Sting-3 Streak SRM-6 launcher offered reliable close-range punch, with its guided missiles ensuring ammunition efficiency against fast-moving targets. A pair of BlazeFire Longshot extended-range medium lasers in the left arm rounded out the weapons loadout, providing the Hel with effective combined-arms capability at multiple engagement ranges.</p><p>The Hermes 250 XL engine provided excellent speed for a fifty-ton chassis, allowing MechWarriors to dictate engagement terms and disengage when outmatched. HildCo Model 13 jump jets enhanced battlefield mobility, enabling the 'Mech to exploit rough terrain for ambush positions and escape routes. Ten tons of Nashan HD armor with CASE II protection offered solid defensive coverage, though the extralight engine remained a vulnerability, loss of either side torso would disable the 'Mech entirely, a significant risk for a design intended to operate in close proximity to enemy forces.</p>
deployment: |-
  <p>The sole factory variant of the Hel, this variant replaced the heavy particle projection cannon with a pair of standard large lasers, reducing the design's raw hitting power while improving heat management and eliminating reliance on the Defiance-manufactured primary weapon. In a practical concession to field maintenance, Nashan offered the entire HL-2 right arm assembly as a spare-parts package, allowing field technicians to rapidly swap weapon configurations between the two variants.</p>
history: |-
  <p>The Hel saw its first combat during a Wolf's Dragoons raid into the Duchy of Tamarind-Abbey in 3094. The Dragoons' Black Cats battalion struck the world of Kosciusko, intending to destroy a regional training center. When aerospace defenses forced one of the Cats' Union-C-class DropShips to land over a hundred kilometers from the main force, the embarked 'Mechs (including three Hels) deployed to block advancing Duchy forces intent on capturing the grounded vessel. The three Hels demonstrated the design's ambush potential by concealing themselves behind a series of boulders while a second Star drew enemy attention. When the Duchy column rushed past, the Hels rose from concealment and destroyed two 'Mechs with concentrated heavy PPC fire before using their jump jets to escape over the lip of the arroyo, buying the Dragoons enough time to repair their DropShip.</p><p>The Hel continued to see service during the Clan Wolf invasion along the Lyran Commonwealth border. On Colfax, the mercenary company Cox's Cattle Prods (equipped with eight BattleMechs, four of them Hels) found themselves the sole 'Mech garrison when Wolf Guards attacked. Refusing a batchall from a Nova of Wolf Guards, the Cattle Prods retreated into the hills to wage a guerrilla campaign. The Hels proved particularly effective in sustained operations, as their standard armor and readily available missile ammunition allowed them to remain operational for months without significant resupply. The four Hels ultimately became the last Cattle Prod assets to be run to ground, even managing to destroy a Wolf Blood Reaper before being eliminated.</p><p>Beyond its origins in the former Free Worlds League, the Hel found wider distribution across the Inner Sphere. Warriors in House Davion's Syrtis Fusiliers operated the design along the Capellan border, demonstrating the 'Mech's effectiveness in border skirmishing well beyond the markets Nashan had originally targeted. Though production was ultimately short-lived, the Hel's legacy endured through its successor, the Eris, which Kallon Weapon Industries developed from the original Nashan specifications.</p>
