chassis: "Mechanized Hover Level I (WOBM)"
model: "(SRM)"
overview: |-
  <p>Drawing veterans from the Com Guards, recruits from the Free Worlds League, and volunteers from Protectorate worlds, the Word of Blake Militia assembled infantry formations whose quality varied but whose equipment was consistently first-rate. Mechanized hover Level I formations gave the Word of Blake Militia its fastest ground-mobile infantry, capable of crossing water obstacles and open terrain at speeds that outpaced wheeled or tracked alternatives. Their speed made them effective pursuit forces when Protectorate populations attempted to flee contested areas. Equipped with infantry-portable short-range missile launchers that provide anti-armor capability beyond what personal weapons can achieve, these troops can threaten light vehicles and battle armor at close range.</p>
