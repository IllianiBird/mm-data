chassis: "Field Artillery Platoon (AFFS)"
model: "(Wheeled Thumper Cannon 3079+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing Thumper cannon, a direct-fire variant of the standard Thumper artillery tube, these platoons deliver heavy shell fire against visible targets without the arc trajectory of indirect systems.</p>
