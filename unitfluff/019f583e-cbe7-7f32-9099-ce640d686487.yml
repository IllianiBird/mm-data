chassis: "Garm"
model: "GRM-01A2"
overview: |-
  <p>Named for the mythological hound that guards the entrance to the Norse realm of the dead, the Garm was introduced in 3058 as a light fire support BattleMech manufactured by Johnston Industries on New Syrtis. Designed to operate within fire support lances of the Federated Commonwealth, the thirty-five ton design entered a market long dominated by the venerable Valkyrie, a signature 'Mech of the AFFC. The Garm's combination of long-range direct and indirect firepower on a mobile, jump-capable platform was intended to provide commanders with a viable alternative to the aging Valkyrie design.</p><p>Built on an endo steel chassis to maximize payload, the Garm sacrifices heavy armor protection in favor of the firepower and mobility necessary for its intended role. Despite initial difficulties finding buyers among AFFC commands, the design eventually proved itself in Periphery combat and earned a place in the Federated Commonwealth's order of battle.</p>
capabilities: |-
  <p>The Garm is built around a Johnston Biped L-25-a2 endo steel chassis powered by an Omni 175 fusion engine, providing a top speed of eighty-six kilometers per hour. Five Rawlings 80-Beta jump jets grant the 'Mech a jumping range of one hundred fifty meters, allowing it to exploit terrain effectively while maintaining optimal firing positions. The design's primary armament consists of a Mydron Excel 5SG LB 5-X autocannon capable of firing both standard and cluster ammunition, paired with a Federated 10-Shot LRM-10 launcher for indirect fire support. This combination allows the Garm to engage targets at considerable range while providing tactical flexibility through ammunition selection.</p><p>The Garm carries only three and a half tons of Johnston Duraweave 6000 ferro-fibrous armor, leaving it particularly under-protected for a thirty-five ton 'Mech. This design compromise reflects the Garm's intended doctrine of engaging from distance rather than closing to brawling range. Johnston's engineers equipped the 'Mech with fully functional hands, a late addition to the design driven by the growing presence of armored infantry on the battlefield. The hands complement the jump jets when navigating mountainous terrain and provide a measure of defense against battle armor swarm attacks.</p>
deployment: |-
  <p>A comprehensive redesign introduced during the Jihad in 3076, this variant addresses many of the original Garm's shortcomings. Johnston Industries replaced the standard engine with an Omni 210 light fusion engine, boosting the top speed to ninety-seven kilometers per hour, while an XL gyro freed additional tonnage. The LB 5-X autocannon gives way to a ChisComp 12000 plasma rifle, a weapon reverse-engineered from captured Capellan technology following the failed Operation Sovereign Justice. Light ferro-fibrous armor and double heat sinks round out the upgrades, transforming the Garm from a modest fire support platform into a capable harassment 'Mech. Jump capacity is also increased to one hundred eighty meters to match the improved ground speed.</p>
history: |-
  <p>The Garm's development by Johnston Industries on New Syrtis began as an attempt to challenge the Valkyrie's dominance in the Federated Commonwealth's light fire support role. When the design debuted in 3058, the AFFC high command showed little enthusiasm for a competitor to their established favorite. Johnston Industries found buyers primarily among mercenary units and Periphery states, with the Taurian Concordat's Defense Forces making the largest early purchases.</p><p>The turning point for the Garm came when several lances of Taurian-operated Garms distinguished themselves fending off pirate raids on the world of Mithron. Reports of the 'Mech's effectiveness in these engagements reached AFFC military officials, who reconsidered their assessment and placed orders for several hundred units. This Taurian endorsement proved critical to the design's survival, as Johnston Industries had been preparing to discontinue production before the Mithron reports emerged.</p><p>The Garm saw increasing deployment during the FedCom Civil War era, particularly the GRM-01C variant with its rotary autocannon, which won broader acceptance among AFFC units. Johnston Industries continued refining the design throughout this period, introducing variants tailored to different tactical requirements and operational doctrines.</p><p>During the Jihad, the New Syrtis facility survived the initial Capellan counterattack following the failure of Operation Sovereign Justice, though the world suffered greatly in the fighting. The recovery of advanced Capellan technology from salvage left behind by the retreating invaders provided Johnston Industries with the means to develop the GRM-01A2, incorporating a plasma rifle reverse-engineered from captured Capellan weapons. Later Taurian strikes during the Jihad caused significant damage to the New Syrtis production lines, temporarily halting output.</p><p>Production of the Garm resumed in the post-Jihad era, with Johnston Industries restoring the New Syrtis lines after decontamination efforts addressed radiation damage from the Taurian attacks. The design has continued to serve in Federated Suns forces through the Dark Age and into the ilClan era, maintaining its niche as a capable light fire support platform.</p>
