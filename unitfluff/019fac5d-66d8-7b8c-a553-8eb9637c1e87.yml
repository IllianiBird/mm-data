chassis: "Field Gun Platoon (Generic)"
model: "(Motorized LBX5 3060+)"
overview: |-
  <p>Motorized infantry platoons use light ground vehicles, typically motorcycles or utility trucks, for rapid movement between positions. Faster than foot infantry and cheaper than fully mechanized formations, motorized platoons fill the gap between static garrison troops and armored combat units. They excel at road-bound patrol routes, rapid redeployment along prepared axes, and screening operations where speed matters more than protection. Off-road performance depends heavily on terrain and vehicle type, and the troops must dismount to fight, leaving their transport vulnerable.</p><p>Towing LB-X autocannon that can switch between solid slugs and cluster rounds, these field gun crews adapt their fire to engage both armored point targets and dispersed infantry formations.</p>
