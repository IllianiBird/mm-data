chassis: "Mongoose II"
model: "MON-266"
overview: |-
  <p>The Mongoose II is a forty-ton medium BattleMech born from the chaos of the Jihad, designed as a replacement for ComStar's devastating losses of Mongoose scout assets. When Luthien Armor Works' original upgrade project was disrupted by fighting on Luthien in the early years of the Jihad, ComStar financed a partnership with Defiance Industries and Arc-Royal MechWorks to bring the design to production. Despite sharing a name with its twenty-five-ton predecessor, the Mongoose II is a fundamentally different machine: heavier, faster in absolute terms thanks to its powerful Pitban 320 XL engine, and laden with an electronics suite that makes it one of the most capable scout platforms in the Inner Sphere.</p><p>Production began in 3073, split between Arc-Royal MechWorks and Defiance's manufacturing annex on Kwangjong-ni, with ComStar receiving two-thirds of initial output. The design's emphasis on electronic warfare over raw firepower reflects ComStar's doctrine of information superiority, carrying the Mongoose legacy forward into a new era of warfare.</p>
capabilities: |-
  <p>The Mongoose II is built on an Alshain Type 69-40S chassis powered by a Pitban 320 XL engine that propels the forty-ton design to a base speed of 129 kph, matching the original Mongoose's ground performance despite carrying fifteen additional tons of equipment. A MASC system allows brief sprints up to 172 kph, giving the Mongoose II the ability to disengage from virtually any threat. Seven tons of Starshield armor provide solid protection for the chassis and its vulnerable XL engine.</p><p>Where the Mongoose II truly excels is in its electronics suite. A Nashan-built Beagle Active Probe feeds targeting data to a sophisticated C3i computer, while a Guardian ECM suite provides electronic countermeasures against enemy sensors. The Nashan Comm-i U-284 communications system and Trac V-102 targeting system tie these components together into an integrated reconnaissance and command package. The sole ranged weapon is a Diverse Optics Sunbeam ER large laser, providing ammunition-independent firepower at extended range. While this leaves the design undergunned for direct combat, the Mongoose II's speed and electronic warfare capabilities allow it to choose its engagements carefully and serve as an effective force multiplier for allied units.</p>
deployment: |-
  <p>The base MON-266 configuration carries the full electronics suite that defines the Mongoose II: a Beagle Active Probe, Guardian ECM suite, and C3i computer linked through Nashan communications and targeting systems. A MASC system provides emergency speed bursts up to 172 kph, and the single Diverse Optics Sunbeam ER large laser offers long-range, ammunition-independent firepower. Production of this variant was discontinued at both factories following the Jihad as the C3i computer system fell out of common use.</p>
history: |-
  <p>The Mongoose II's origins trace to the early Jihad, when ComStar found itself facing catastrophic losses of scout 'Mechs in the fighting against the Word of Blake. Luthien Armor Works had been developing an upgraded Mongoose for ComStar when the conflict on Luthien disrupted the project. Rather than abandon the initiative, ComStar redirected funding to the Lyran Alliance, where Defiance Industries was retooling an old Rim Worlds Republic factory on Kwangjong-ni. The success of new Zeus and Banshee variants walking off that line prompted ComStar to finance further upgrades to the facility, and Defiance agreed to sell two-thirds of initial Mongoose II production to ComStar for the first two years.</p><p>Since Luthien Armor Works had completed most of the chassis development, Defiance turned to Nashan Diversified to outfit the electronics suite. Arc-Royal MechWorks simultaneously began production at their facility on Arc-Royal, and by 3073 both lines were delivering units to the Com Guards. The Mongoose II quickly proved its worth in the intelligence-gathering role, with its combination of speed, ECM, and C3i capability making it a cornerstone of ComStar's reconstituted scout formations.</p><p>The base MON-266 saw its production discontinued at both factories following the Jihad due to the C3i computer falling out of favor, though existing units continued to serve. The MON-267 variant, adapted for Lyran Alliance C3 networks with stealth armor, proved more enduring and has been widely distributed to Alliance elite units and formations equipped with Firestarter OmniMechs in C3-linked scout lances. The Lyran Alliance and its successor states have maintained production of the MON-267 and MON-268 variants through the Dark Age and into the ilClan era, ensuring the Mongoose II's continued presence on battlefields across the Inner Sphere.</p>
