chassis: "Tian-Zong"
model: "TNZ-N5"
overview: |-
  <p>The Tian-Zong was introduced in 3090 as a dedicated command BattleMech for the Capellan Confederation Armed Forces. Developed by Hellespont 'Mech Works on Sian in cooperation with the Capellan Science Foundation, the design was originally intended as a mobile fire support platform for the Confederation's shadow lances. Combining potent Gauss-based firepower with sophisticated stealth technology and an advanced command and control suite, the Tian-Zong quickly exceeded its intended role. Its exceptional electronics allow battalion-level coordination while its stealthy profile makes it difficult to engage at range, earning it a reputation as one of the most dangerous heavy command 'Mechs in the Inner Sphere.</p><p>The design became the preferred mount of elite formations including the Death Commandos and Warrior Houses, serving as the Capellan Confederation's premier command 'Mech for over half a century. Ongoing production at Hellespont 'Mech Works has ensured a steady supply of upgraded variants incorporating the latest advances in Capellan military science.</p>
capabilities: |-
  <p>The Tian-Zong's combination of stealth armor, electronic warfare capabilities, and devastating firepower makes it a formidable opponent at any range. Its Hellespont Lite II stealth armor works in concert with an Angel ECM suite, rendering the 'Mech extremely difficult to detect and target. This is a critical advantage for a design meant to operate on the flanks and behind enemy lines with shadow lances. The paired Mydron Concussor Gauss rifles deliver crushing long-range firepower without generating appreciable heat, while the Ceres Arms Striker light particle projection cannons provide accurate medium-range support. This weapons mix allows sustained engagement without taxing the 'Mech's heat management systems, leaving its pilot free to concentrate on battlefield coordination.</p><p>The Rawlings 300 XL engine propels the seventy-five-ton chassis to a respectable top speed of 64 kph, adequate for keeping pace with medium 'Mech formations. The endo-composite internal structure saves weight allocated to the heavy armor protection and weapons payload. However, the design's reliance on an extralight engine creates vulnerability in the side torsos, and its lack of jump jets limits tactical flexibility in close terrain. The small cockpit fitted to later production variants also increases pilot fatigue during prolonged engagements.</p>
deployment: |-
  <p>Building upon the original TNZ-N1 as its foundation, this variant incorporates the Chameleon light polarization shield and light ferro-fibrous armor of the newer generation while taking a dramatically different tactical direction. One Gauss rifle is replaced with a Clan-grade extended-range PPC sourced from the Skate Khanate, and a TAG system is fitted for semi-guided munition coordination. The extralight engine is exchanged for a lighter-model fusion engine, and four jump jets provide the Tian-Zong with vertical mobility for the first time. Though the mixed weapons loadout requires more careful heat management, the combination of jump capability, indirect fire coordination, and Clan-grade weaponry makes this variant one of the most tactically flexible in the lineup.</p>
history: |-
  <p>The Tian-Zong entered production in 3090 at Hellespont 'Mech Works on Sian, quickly earning its place as the Capellan Confederation's foremost command 'Mech. Originally conceived for shadow lance operations, its combination of stealth, firepower, and command electronics made it irresistible to elite formations. The Death Commandos and Warrior Houses adopted the design almost immediately, and within a decade the Tian-Zong had become synonymous with Capellan heavy command assets.</p><p>During the siege of Victoria by Armed Forces of the Federated Suns, Warrior House Kamata demonstrated the Tian-Zong's devastating potential. Using stolen encryption keys, a force comprised principally of Tian-Zongs slipped behind enemy lines during a unit rotation between battered elements of the Sixth Syrtis Fusiliers and the reconstituted Forty-second Avalon Hussars. The Warrior House maneuvered two companies of shadow lances into a gap in the Davion lines, catching the AFFS regiments mid-rotation. Their combined volley felled a full company of 'Mechs, while a second volley disabled or destroyed another dozen. Both regiments broke and ran before regrouping for a counterattack, by which time the Warrior House had withdrawn behind cover.</p><p>On Arboris, elements of the First McCarron's Armored Cavalry used the Tian-Zong to delay a company of Hastati Sentinels. Commanding a single shadow lance and a platoon of light tanks, a Capellan officer used convenient weather and varying engagement ranges to repeatedly ambush the Sentinels' patrols, throwing them off-guard each time. This resourceful use of the Tian-Zong's stealth and command capabilities tied down a significantly larger force for weeks until additional Capellan troops arrived.</p><p>During Operation Tiamat in 3149, the Fifth McCarron's Armored Cavalry teamed with Warrior House Imarra to capture Liberty. On the island of Dendez, Tian-Zong pilots of the Fifth MAC held defensive positions against a Republic Armed Forces unit identified as Stone's Fury. Despite being surprised by advanced RISC weaponry, the Tian-Zong's firepower proved decisive in several engagements, with Silver Bullet Gauss rifle shards piercing enemy cockpits at close range.</p><p>By the ilClan era, Hellespont 'Mech Works had introduced a new generation of Tian-Zong variants leveraging the Capellan Confederation's success in replicating the Star League-era Chameleon light polarization shield. These newer models traded stealth armor for lighter protection combined with the Chameleon system, freeing weight for heavier weaponry and, in some variants, jump capability. The acquisition of Clan-grade weapons through trade with the Skate Khanate further expanded the Tian-Zong's tactical versatility, ensuring the design's continued relevance on the battlefields of the thirty-second century.</p>
