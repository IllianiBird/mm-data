chassis: "Field Artillery Platoon (FWLM)"
model: "(Wheeled Thumper 3035+)"
overview: |-
  <p>The Free Worlds League's fractious politics have always made centralized BattleMech procurement difficult, pushing the FWLM toward heavy investment in conventional infantry to fill the gaps. Deploying crew-served Thumper artillery pieces, these platoons provide indirect fire support at the battalion and regimental level, lobbing high-explosive rounds onto targets beyond direct line of sight. The Thumper is the lightest tube artillery in common service, valued for its mobility relative to heavier systems.</p>
