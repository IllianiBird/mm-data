overview: |-
  <p>The Vapor Eagle, known to Inner Sphere intelligence services by its reporting name Goshawk, is a fifty-five-ton Clan medium BattleMech introduced in 2863 by Clan Steel Viper. Designed principally as a dueling platform rather than a line combat unit, the Vapor Eagle was built to excel in the one-on-one Trials so prevalent in Clan warrior culture. Its distinctive arm baffles, which lend the design its Inner Sphere codename, serve a functional role in stabilizing jump jet flight rather than merely deflecting exhaust. First appearing in the Inner Sphere with Steel Viper forces during the Clan Invasion, ComStar operatives initially struggled to understand the close-combat garrison 'Mech's intended purpose until Clan society became better understood. Production of the Vapor Eagle has been maintained across multiple Clan Homeworld factories and, following the relocation of Clan Snow Raven to the Inner Sphere, at facilities in the Raven Alliance.</p>
capabilities: |-
  <p>The Vapor Eagle's chassis mounts a 330-rated extralight fusion engine driving the fifty-five-ton 'Mech to speeds of 97.2 km/h, while six jump jets provide a leap capability of one hundred and eighty meters. Built on an endo steel frame and clad in nine tons of ferro-fibrous armor, the design achieves an impressive balance of protection, speed, and firepower for its weight class. The most distinctive feature of the Vapor Eagle is its large arm baffles, reminiscent of the venerable Griffin's blast deflectors but functioning as stabilizing wings. By diverting thrust from the torso-mounted jump jets over their surfaces, these baffles grant the Vapor Eagle exceptionally smooth and controllable jump flight, allowing precision landings that few 'Mechs of comparable mass can match.</p><p>The standard weapons configuration emphasizes devastating close-range firepower suitable for formal dueling. A large pulse laser serves as the primary weapon in the right arm, supported by three medium pulse lasers split between the side torsos and a quartet of machine guns. Two Streak SRM-2 launchers round out the armament, while a targeting computer enhances the accuracy of the entire loadout. This configuration makes the Vapor Eagle lethal within its engagement envelope, though it lacks any meaningful long-range capability, leaving it vulnerable to opponents who can dictate engagement distances.</p>
deployment: |-
  <p>The Vapor Eagle 6 retains the targeting computer and arm-mounted weapons of the base model but replaces the large pulse laser with a pair of torso-mounted Ultra Autocannon/2s, each with a dedicated ton of ammunition. While the rapid-firing autocannons provide continuous long-range harassment capability, their relatively light caliber significantly reduces the variant's overall damage potential compared to other configurations. The three medium pulse lasers and machine guns remain effective at close range, but the 6 has earned a reputation as an underwhelming variant that fails to capitalize on the Vapor Eagle's proven close-combat strengths.</p>
history: |-
  <p>The Vapor Eagle originated with Clan Steel Viper as a dedicated dueling design, seeing its earliest service in the garrison formations that defended Viper holdings across the Clan Homeworlds. Produced primarily at New Kent Armorworks on New Kent and at facilities on Hellgate, the design became a staple of Steel Viper second-line forces throughout the Golden Century and into the Political Century. Additional production was established by Clan Ice Hellion on Hector and Clan Goliath Scorpion on Roche, giving the Vapor Eagle a broad manufacturing base among the Homeworld Clans.</p><p>When Clan Steel Viper seized the Hellgate enclave from Clan Snow Raven in 2899, the conquest brought the facility under Viper control. Ironically, the Snow Ravens' long familiarity with the design from their time on Hellgate would later enable them to establish their own production. The Vapor Eagle saw little notice from the Inner Sphere until the Clan Invasion, where Steel Viper garrison forces brought it to the Occupation Zones. ComStar operatives puzzled over the close-range dueling 'Mech until Clan culture became better understood.</p><p>The Hegira War proved a turning point for the design. After Clan Jade Falcon ejected the Steel Vipers from the Inner Sphere, Viper leadership undertook a broad reconfiguration program to produce variants better suited to larger, more fluid engagements. These updated models filled gaps in frontline formations during the Vipers' campaigns against Clans Snow Raven and Star Adder in the Homeworlds. The progression to increasingly heavy ballistic armament in later Clan refits of the Vapor Eagle has drawn comparisons to similar trends in Phoenix Hawk lineage designs, casting the Vapor Eagle as a conceptual bridge between upgraded SLDF chassis and the monstrously upsized Phoenix Hawk IIC.</p><p>The Wars of Reaving devastated many Homeworld Clans, and the destruction of Clan Steel Viper scattered surviving production among successor factions including Clan Coyote and the remnants of other Homeworld powers. The New Kent facilities fell silent as the Steel Vipers were annihilated, while factories on Hector and Roche passed through Goliath Scorpion and eventually Coyote control. Meanwhile, Clan Snow Raven's relocation to the Outworlds Alliance saw the design take on new life, with Snow Raven Industrial Complex Alpha on Dante establishing production for the Raven Alliance military. Salvaged Viper-made Vapor Eagles also appeared in Jade Falcon garrisons and on Solaris VII's arena circuit, where the design's dueling pedigree found an appreciative audience among holovid broadcasters. In the Dark Age, reports surfaced of rare Vapor Eagle variants appearing on contested worlds near the Fortress Republic, with structural analysis suggesting custom refits of older Steel Viper airframes connected to forces behind the Fortress Wall.</p>
