chassis: "'Gestalt'"
model: "D2X-G"
overview: |-
  <p>The Gestalt was the first and only BattleMech produced under the Word of Blake's Machina Domini program. Manufactured by Gibson Federated BattleMechs on Gibson in 3078, the forty-five-ton design represented a radical departure from conventional BattleMech engineering. Unlike any other 'Mech in production, the Gestalt required its pilot to operate the machine through a neural-interface battlesuit, creating a direct link between warrior and machine that eliminated the need for conventional cockpit systems entirely.</p><p>Still in prototype testing when the factories that built it were destroyed, the Gestalt never progressed beyond limited production. Whether the design was intended as a field test for technology meant for the Celestial OmniMech series or as a complement to those designs remains unknown, and the truth likely perished with the Word of Blake's leadership.</p>
capabilities: |-
  <p>The Gestalt's combat philosophy revolved around stealth and precision striking. Its Divine Spectre-C heavy ferro-fibrous armor provided respectable protection for a medium 'Mech while incorporating a Void Signature System that rendered the design extremely difficult to detect on sensors. Combined with a Master's Voice Cel-Alpha communications system integrating an Angel ECM suite, the Gestalt could approach targets virtually undetected, making it exceptionally effective in ambush and interdiction roles.</p><p>Offensive capability centered on a Blankenburg "Divine Wrath" heavy PPC mounted in the right arm, enhanced by a PPC capacitor that allowed devastating strikes against unprepared targets. A pair of Siplan M3-XR extended-range medium lasers in the left arm provided supplementary firepower at closer ranges. The Hermes 315 XL engine drove the Gestalt to speeds of 118 kilometers per hour, while Rawlings 55 jump jets granted a 180-meter jump radius, exceptional mobility for a design carrying this level of electronic warfare equipment.</p><p>The Gestalt's greatest tactical limitation was inherent to its Machina Domini nature: only pilots equipped with compatible neural-interface battlesuits could operate the 'Mech, severely restricting the available pilot pool and making battlefield losses virtually impossible to replace.</p>
deployment: |-
  <p>This variant is the sole production configuration of the Gestalt, carrying the experimental designation befitting its prototype status. The design mounts a stealth-focused electronics suite paired with a single heavy energy weapon and backup lasers, optimized for ambush and interdiction operations where its advanced sensor-masking systems could be leveraged to full effect. Only pilots equipped with compatible Manei Domini neural-interface battlesuits could operate the machine, making this variant entirely dependent on the Word of Blake's cybernetic warrior program for its crew. With the destruction of Gibson's production facilities and the subsequent disappearance of the Manei Domini, no replacement pilots or spare parts remain available, rendering the configuration effectively extinct.</p>
history: |-
  <p>The Gestalt's origins lie within the Word of Blake's ambitious Machina Domini program, which sought to create weapons systems specifically designed for the cybernetically enhanced Manei Domini warriors. Gibson Federated BattleMechs (a division of Free Worlds Defense Industries seized by the Word of Blake during their occupation of Gibson) served as the manufacturing center, leveraging the facility's existing expertise in BattleMech production to develop this experimental design.</p><p>Field testing began in the mid-3070s, with prototype Gestalts deployed against Gibson's persistent insurgency. The resistance movement, which had been fighting the Blakist occupation since the Word first established control over the former Free Worlds League world, proved an unwitting testing ground for the new technology. During these operations, the Gestalt demonstrated remarkable versatility, transitioning between high-speed reconnaissance, pursuit, interdiction, and close-quarters ambush roles with equal effectiveness. Gibson's rebels, who coined the 'Mech's name, were reportedly unable to destroy any of the prototypes during the testing period, though accounts from the resistance remain fragmentary.</p><p>The Gestalt's operational history was cut brutally short in 3078 when the Principality of Regulus launched a devastating assault on Gibson, destroying the planet's industrial infrastructure and Gibson Federated BattleMechs' production facilities along with it. The Word of Blake managed to extract approximately a dozen Gestalts before the bombardment, and these surviving machines were deployed exclusively within the Master's personal forces and the Manei Domini entourage.</p><p>The final confirmed Gestalt deployment occurred on Diamantina, where a full Level II attempted to hold against Regulan ground forces. Following the destruction of Circinus and the apparent death of the Word of Blake's remaining senior leadership, the surviving Manei Domini (and their Gestalts) vanished from the Inner Sphere. No Gestalt has been reliably reported in service since 3081, and the design is widely considered extinct.</p><p>The unique neural-interface technology that made the Machina Domini program possible has never resurfaced, leaving the Gestalt as a footnote to one of the Jihad's most enigmatic weapons development programs.</p>
