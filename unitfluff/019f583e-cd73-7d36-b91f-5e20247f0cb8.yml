chassis: "Rabid Coyote"
overview: |-
  <p>The Rabid Coyote is a 55-ton Clan second-line BattleMech designed by Clan Coyote scientists to address a critical mobility gap in their touman. Entering service in 3066, the design emerged from the Clan's urgent crash development programs following a series of defeats in the inter-Clan fighting that erupted after the Great Refusal in 3060. Built as a cost-conscious second-line design, the Rabid Coyote was intended to serve as an escort and pursuit complement to the Clan's heavier assault formations.</p><p>Produced at the Ashton 'Mech Production Complex on Foster, the Rabid Coyote was among the last original BattleMech designs Clan Coyote would field before the devastation of the Wars of Reaving. The design earned a mixed reputation, proving tactically effective but culturally controversial among warriors who viewed its escort role as beneath their honor.</p>
capabilities: |-
  <p>The Rabid Coyote was designed around the Advanced Tactical Missile system, built with conflicting considerations of cost and mobility in mind. Employing a standard 275-rated fusion engine rather than a more expensive extralight model, the 'Mech achieves a top speed of 86 kph. This is adequate for its intended escort role alongside heavier designs like the Canis and Savage Coyote, though considered barely sufficient for a medium-weight chassis by Clan standards. Endo-steel construction and ferro-fibrous armor keep the design's weight manageable while providing solid protection with eight and a half tons of Compound CL20 armor plating.</p><p>The centerpiece of the armament is the Remer Series Alpha Deuce ATM-12, the largest Advanced Tactical Missile launcher available. Fed by four tons of ammunition, this system provides approximately three minutes of sustained fire and the flexibility to select standard, extended-range, or high-explosive munitions based on engagement distance. Four Kolibri Series medium pulse lasers, two mounted in each arm, deliver punishing close-range accuracy as secondary weapons.</p><p>An integrated ECM suite built into the TJ7 "Siren" communications system provides electronic warfare capability, helping shield both the Rabid Coyote and nearby friendly units from enemy sensor networks and guided munitions. The design's primary weaknesses are its limited ammunition endurance, which forces careful shot discipline during prolonged engagements, and the absence of jump jets, which restricts tactical flexibility in rough terrain. The standard engine, while more durable than an extralight model, imposes a heavier weight penalty that limits the design's overall payload capacity compared to what a lighter powerplant could have allowed.</p>
deployment: |-
  <p>The design philosophies behind the Rabid Coyote made it something of a pariah among Clan Coyote warriors. Conceived as a bodyguard and escort for heavier BattleMechs, the very concept of one 'Mech playing support to another runs counter to the Clans' deeply ingrained sense of personal honor in battle. Many warriors declared Trials of Refusal against assignment to these 'Mechs, viewing the posting as a profound insult. Star Commanders receiving Rabid Coyotes into their units found that overcoming this stigma through demonstrated battlefield effectiveness became a constant endeavor. Despite this cultural resistance, field performance validated the design, and Clan Coyote's leadership remained committed to fielding it in the touman.</p>
history: |-
  <p>The Rabid Coyote emerged during one of Clan Coyote's darkest periods. Once dominant in the Clan homeworlds and credited with the invention of the OmniMech, the Coyotes had spent decades in decline by the early 3060s. The inter-Clan fighting that erupted following the Great Refusal in 3060 exposed a critical weakness in the touman's heavy reliance on assault-weight designs, which proved devastating in direct engagements but left the Clan unable to effectively pursue or respond to faster opponents.</p><p>With the Clan's resources dwindling and its leadership desperate to reverse the decline, a new development program was launched at the Ashton 'Mech Production Complex on Foster. The result was the Rabid Coyote, which entered service in 3066. The design prominently featured Clan Coyote's proprietary Advanced Tactical Missile technology, a system that had proven a valuable asset to the Coyotes and their few remaining allies. Ultimately, however, it failed to provide enough of an edge to halt the Clan's slide toward irrelevance.</p><p>The fate of the Rabid Coyote became intertwined with the devastating Wars of Reaving. In 3071, Clan Goliath Scorpion launched a Trial of Possession against the Ashton facility on Foster, where Clan Coyote's Lambda Galaxy was stationed. The Scorpions successfully claimed the Rabid Coyote production line along with a ProtoMech facility. Clan Coyote's Delta Galaxy later struck back, damaging or destroying the complex by March 3073. Despite this destruction, production eventually resumed under new management.</p><p>MUPL records indicate that Clan Goliath Scorpion controlled the facility during the Jihad era before ownership passed to Clan Cloud Cobra in the early Republic period. The facility's continued operation beyond 3085 remains uncertain, with Clan Cloud Cobra's control marked as provisional in later records. The Rabid Coyote thus stands as evidence of Clan Coyote's ingenuity in the face of decline, a practical and effective design that outlived the Clan that conceived it, continuing to serve under successive owners in the Clan homeworlds.</p>
