chassis: "Mechanized Wheeled Platoon (AFFS)"
model: "(LRM 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Mechanized wheeled platoons ride wheeled transports that offer good speed on roads and developed terrain, making them well-suited to garrison duty on worlds with established infrastructure where rapid response matters more than cross-country capability. Carrying man-portable long-range missile launchers alongside their primary weapons, these platoons can engage armored targets at distances well beyond normal infantry range, providing organic fire support that reduces dependence on dedicated armor or artillery assets.</p>
