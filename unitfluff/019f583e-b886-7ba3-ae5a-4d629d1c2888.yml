chassis: "Jump Platoon (CCAF)"
model: "(Flamer 3045+)"
overview: |-
  <p>The Capellan Confederation has always relied on its infantry to compensate for the CCAF's chronic shortage of heavier assets. Conventional foot soldiers, drawn from the citizens' militia system that defines Capellan military service, form the backbone of garrison forces across the Confederation's commonalities. Jump-capable infantry give CCAF commanders a vertical mobility option for urban combat and rough terrain operations. The added cost of jump equipment limits their numbers compared to foot formations, but their ability to bypass obstacles and reach elevated positions makes them valuable in the defensive fighting the Confederation often faces. Flamer sections carry man-portable incendiary weapons that are devastating in close quarters and against fortified positions, though the short range and hazardous fuel supply make flamer duty one of the most dangerous assignments in the platoon.</p>
