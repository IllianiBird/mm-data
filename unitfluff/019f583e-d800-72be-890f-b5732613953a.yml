chassis: "Crucible"
model: "2"
overview: |-
  <p>The Crucible is a one-hundred-ton Clan assault BattleMech introduced in 3149 by Earthwerks-FWL, Inc. for the Wolf Empire. Facing overstretched supply lines and a touman composed almost entirely of offensive designs, Khan Ward recognized the need for a purpose-built defensive 'Mech capable of protecting vulnerable logistical assets. The project drew from the Stone Rhino as a starting point, resulting in a dedicated rear-echelon combatant.</p><p>Designed specifically for assignment to solahma warriors tasked with rear-echelon security, the Crucible serves as a deliberate departure from Clan Wolf's traditionally offensive doctrine and a rare example of a Clan design built from the outset for a purely defensive role.</p>
capabilities: |-
  <p>The Crucible's weapon systems were inspired by the Annihilator's proven Gauss rifle configuration. Four Series II Gauss Rifles are distributed across both arms and side torsos, providing devastating alpha strike capability that can strip nearly four tons of standard armor in a single volley. A single Raid Micro Pulse Laser provides token anti-infantry defense at close range. The Starfire 300 XL engine drives the chassis to a maximum speed of 54 kph, while Grandthrust Mk. 5 jump jets provide a ninety-meter leap capability, ensuring the Crucible can reposition across varied terrain.</p><p>The design makes deliberate trade-offs to achieve its firepower advantage. Its emphasis on raw damage output comes at the cost of sustained engagement capability, making it better suited as a deterrent and ambush predator than a front-line combatant. Fifteen tons of Compound 12B2 Standard armor provides adequate but not exceptional protection for an assault 'Mech, and the use of an extralight engine creates critical vulnerability to torso damage. Twelve double heat sinks far exceed what the ballistic-focused loadout requires, but this over-engineering serves a practical purpose: the excess heat dissipation capacity allows pilots to operate effectively even when subjected to plasma weaponry and Inferno missile attacks that frequently target supply line defenders.</p>
deployment: |-
  <p>The Crucible 2 reconfigures the design as a more versatile front-line combatant. The arm-mounted Gauss Rifles are replaced with extended-range particle projector cannons and Artemis V-enhanced LRM-15 launchers carrying a generous two hundred and forty missiles per launcher, while the torso-mounted Gauss Rifles are retained. Two additional double heat sinks and a center-torso coolant pod manage the increased thermal load generated by the energy weapons. This weapons variety ensures effectiveness against a broader range of opponents and provides an overall increase in sustained firepower, making it better suited for prolonged engagements than the purely ballistic base configuration.</p>
history: |-
  <p>The Crucible emerged from necessity during one of the most ambitious military campaigns in Inner Sphere history. As Clan Wolf committed the bulk of its touman to the drive toward Terra in the late 3140s, supply lines grew dangerously exposed. The traditional Clan approach of assigning solahma warriors to garrison and defensive roles proved inadequate, as most second-line units were equipped with aging, obsolete designs intended for offensive warfare rather than sustained defensive operations.</p><p>Production began at the Earthwerks-FWL, Inc. facility on Keystone in 3149, leveraging shared manufacturing infrastructure with the Tomahawk II line. While the Wolves were unable to produce sufficient quantities to fully implement their defensive plans before reaching Terra, the Crucibles that reached operational units made an immediate impact. Several Stars of Crucibles proved effective in countering Republic of the Sphere and Jade Falcon raiding forces that targeted Wolf supply corridors during the advance.</p><p>The most significant early engagements involving the Crucible occurred on Skye, where the design demonstrated its effectiveness against the Turkina Keshik. The Crucible's devastating volleys proved particularly effective at deterring aggressive advances, with individual units credited with holding defensive positions against numerically superior forces. On Keystone itself, Crucibles successfully defended the Earthwerks manufacturing facility against raiders, further validating the design's defensive doctrine.</p><p>Particularly, no Crucibles were deployed during Operation Shofar, a decision the Wolf Watch considers a deliberate operational security measure to deny the Republic intelligence on the design's capabilities prior to the final push toward Terra. Following the establishment of the ilClan, the Keystone facility continues production under Clan Wolf authority, with the Crucible filling an ongoing need for dedicated defensive assets as the ilClan consolidates its territorial holdings across the former Republic and beyond.</p>
