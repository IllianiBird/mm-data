chassis: "Ryoken"
model: "H"
overview: |-
  <p>The Stormcrow is a widespread, second-generation 55-ton OmniMech fielded by many Clans. Designated "Ryoken" by warriors of the Draconis Combine Mustered Soldiery, this reporting name derives from a misspelling of the Japanese term for "hunting dog." The Stormcrow's chassis emerged from the refinement of Clan Hell's Horses' Omni-Corvis prototype by Clan Snow Raven scientists in 2930, and its combination of speed, armor, and generous pod space for its tonnage class has made it one of the most successful medium OmniMech designs in Clan history. Production has spread across numerous facilities in both the Homeworlds and the Inner Sphere occupation zones.</p>
capabilities: |-
  <p>The Stormcrow is built on a lightweight Endo Steel chassis and is powered by a 330 XL engine that propels it to a top speed of 97.2 km/h, placing it among the fastest medium OmniMechs available. The Stormcrow is protected by nine and a half tons of Ferro-Fibrous armor, giving the 'Mech the ability to survive encounters with other units that it is not capable of outpacing.</p><p>The design's generous pod space relative to its tonnage allows for a wide range of weapon configurations, from heavy ballistic loadouts to energy-focused builds to missile-heavy fire support packages. This flexibility is the Stormcrow's defining advantage, enabling a single Star of these OmniMechs to be reconfigured for virtually any tactical scenario. The primary limitation is the fragility of the XL engine, which leaves the Stormcrow vulnerable to destruction from side torso penetration, a weakness that more cautious warriors must account for through careful positioning.</p>
deployment: |-
  <p>A heavy laser-focused version of the primary configuration, the H mounts two heavy large lasers as its main weapons, delivering devastating damage per salvo at medium range. These are backed up by three ER medium lasers for additional firepower. This configuration also carries twelve extra double heat sinks to manage the extreme thermal output of the heavy laser armament.</p>
history: |-
  <p>The Stormcrow traces its lineage to the Corvis and Omni-Corvis, both designed by Clan Hell's Horses. When the Omni-Corvis's blueprints were scattered across Clan space in 2921 -- released on the Chatterweb by Clan Ghost Bear as punishment for Khan Kilbourne Jorgensson's death during the Battle of Tokasha -- Clan Snow Raven scientists undertook a series of design refinements that culminated in the Stormcrow's debut in 2930.</p><p>The Stormcrow quickly proved itself as one of the most versatile second-generation OmniMechs in Clan arsenals. Its combination of speed, armor, and generous pod space attracted widespread adoption across multiple Clans, with production eventually established at numerous facilities throughout Clan space. Clan Smoke Jaguar made particularly heavy use of the design during the Clan Invasion of the Inner Sphere, where warriors of the Draconis Combine Mustered Soldiery encountered it frequently enough to assign the reporting name 'Ryoken.'</p><p>The Stormcrow's influence extended far beyond its own production. In 3075, Clan Ghost Bear applied the same upscaling concept that produced the Mad Cat Mk II, creating the 75-ton Ryoken II as a heavier evolution of the chassis. Decades later, Clan Wolf drew on the Stormcrow's proven design lineage to develop the Skinwalker, incorporating advanced Interface Cockpit technology and Ferro-Lamellor armor into a radical reimagining of the 55-ton platform.</p>
