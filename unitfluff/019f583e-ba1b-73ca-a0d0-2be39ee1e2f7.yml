chassis: "Foot demi-I (WOBM)"
model: "(Rifle)"
overview: |-
  <p>Word of Blake Militia infantry served as the backbone of Protectorate garrison forces across dozens of conquered worlds, providing the manpower for territorial control that the Militia's BattleMech and armor assets could not sustain alone. Foot infantry Level I formations provided the bulk of Protectorate garrison manpower, assigned to hold ground that the Militia's BattleMech forces had already taken. On occupied worlds, these platoons maintained checkpoints, patrolled population centers, and enforced curfews as the visible face of Blakist territorial control. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon in the Inner Sphere, these troops deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
