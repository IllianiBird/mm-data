chassis: "Fireball"
model: "ALM-7D"
overview: |-
  <p>The Fireball was introduced in 3053 as a direct response to the devastating effectiveness of Clan Elemental battle armor during Operation Revival. Designed by Corean Enterprises at the behest of Federated Commonwealth military planners and scientists at the New Avalon Institute of Science, the twenty-ton ALM-7D was intended to provide rapid-response anti-infantry support for front-line regiments engaged along the Clan Occupation Zone borders. Built around an oversized engine that gave it extraordinary speed, the Fireball promised sustained firepower against swarming battle armor squads.</p><p>In practice, the design proved woefully undergunned for its intended role, and Federated Commonwealth commanders quickly repurposed the Fireball as a scout and raider, a role far better suited to its exceptional speed. The design has served in that capacity across multiple conflicts since, earning a lasting reputation as one of the fastest BattleMechs in the Inner Sphere.</p>
capabilities: |-
  <p>The Fireball is built around a DAV 220 extralight fusion engine mounted on a Corean Model 334AA endo steel frame, a combination that propels the twenty-ton chassis to a cruising speed of 119 kilometers per hour and a top speed of 184 kilometers per hour. This makes the Fireball one of the fastest BattleMechs in service, capable of reaching trouble spots across a battlefield faster than nearly any other design. The extreme speed comes at a significant cost, however, as the chassis carries only four tons of Durallex Nova armor, barely adequate protection against even light weapons fire.</p><p>The armament is similarly sparse. A single Hovertec Streak SRM-2 rack serves as the primary weapon, providing accurate short-range missile fire that conserves ammunition by only firing when a solid lock is achieved. A secondary LFN Lindblad machine gun offers anti-infantry capability, though its effectiveness against armored targets is negligible. The Corean B-Tech targeting system is a proven and reliable component, selected partly because it was manufactured on New Avalon alongside the Fireball itself, reducing logistical complexity.</p><p>The Fireball's critical weakness is its inability to sustain a meaningful engagement. Against anything heavier than conventional infantry, MechWarriors must rely on speed to avoid return fire, making hit-and-run tactics essential to the design's survival.</p>
deployment: |-
  <p>The base ALM-7D entered service in 3053 with the Crucis Lancers, Deneb Light Cavalry, and Ceti Hussars, regiments chosen for their extensive experience fighting the Clans. The 'Mechs were deliberately assigned to rookie pilots, both to match the aggressive tendencies of inexperienced MechWarriors and to build their combat experience quickly. Though the design failed in its intended anti-Elemental role, it proved an excellent scout and raider, capable of outrunning virtually any pursuit while gathering intelligence or striking vulnerable targets behind enemy lines.</p>
history: |-
  <p>The Fireball's development traces directly to the panic that gripped the Inner Sphere following the Clan Invasion. In meetings between Federated Commonwealth military commanders and scientists at the New Avalon Institute of Science, the need for a light 'Mech capable of countering Clan Elemental battle armor emerged as a priority. Corean Enterprises, already well-established on New Avalon, was awarded the contract and produced the ALM-7D design. The first shipments reached the Crucis Lancers, Deneb Light Cavalry, and Ceti Hussars in 3053, immediately following the Truce of Tukayyid, and these regiments deployed the design along the Clan Occupation Zone borders during the constant raiding that characterized the post-Truce period.</p><p>Reports from the front quickly revealed the Fireball's fundamental shortcoming: despite its speed, the 'Mech was simply outgunned by the Elementals it was designed to fight. Federated Commonwealth commanders pragmatically reassigned the Fireball to scouting and raiding duties, where its exceptional speed proved a decisive advantage. Successful field modifications led to the ALM-8D and ALM-9D variants in 3054, both of which Corean Enterprises later adopted as production models after demonstrating their worth in combat.</p><p>The Fireball saw its most intense combat during the FedCom Civil War, ironically on the very doorstep of the Corean Enterprises factory on New Avalon. During the battle for control of the world, Corean produced Fireballs at maximum capacity, first for the Loyalist forces, then for the Allied faction after they seized the planet. The design became a mainstay of the Allied reconnaissance force during the closing stages of the civil war.</p><p>In the aftermath of the FedCom Civil War, the Fireball played a vital role in rebuilding the shattered Deneb Light Cavalry and Ceti Hussars regiments. The introduction of the ALM-10D in 3076, during the Jihad, brought significant technological upgrades that enhanced both the design's combat effectiveness and survivability. Production of the modernized variant continued on New Avalon through the Republic era and into the Dark Age, though the factory's ownership ultimately passed to the Draconis Combine during the ilClan era.</p>
