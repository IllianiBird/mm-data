chassis: "Peregrine Attack VTOL"
model: "(Cargo)"
overview: |-
  <p>The Peregrine Attack VTOL is a 30-ton combat helicopter produced by Blackwell Corporation and introduced in 3021. Originally commissioned to escort troop transports and deliver suppressive fire during air assault operations, the design was quickly made available for open sale and found its way into the arsenals of Houses Kurita, Liao, and Marik throughout the 3020s. Wolf's Dragoons, for whom the vehicle was first developed, never pressed it into general service. That early indifference set the tone for the Peregrine's career. The design swiftly earned a reputation for mechanical unreliability, dangerously thin armor, and casualty rates that far exceeded those of comparable platforms. Most operators eventually transferred their Peregrines to reserve depots, local militias, or civilian paramilitary forces. The saying "gone watching Perries" entered common military slang as a euphemism for feigning injury to escape front-line duty, a phrase that captured the vehicle's near-universal absence from serious combat.</p>
capabilities: |-
  <p>The Peregrine's offensive suite centers on a pair of Larkin SRM 4 launchers backed by two Blackwell B75 machine guns, providing concentrated short-range firepower for a vehicle of its weight class. Its Dalban StarLink IIa communications gear and Garret E2b targeting system are serviceable, and its DAV 220 fusion engine delivers flank speeds approaching 200 kph, enough velocity to close quickly on a target. Closing, however, requires entering small-arms range, where the Peregrine's ProTech Medium armor offers little protection. The plating is simply too thin to absorb meaningful punishment, and combat loss rates were consistently high.</p><p>A fundamental design flaw compounded the danger. The Peregrine uses an internal flywheel in place of a traditional tail rotor to counteract rotor torque. During hard emergency landings, the flywheel could break free of its mountings and tear through the fusion plant and into the cockpit, killing the crew. Maintenance was equally problematic. Poorly designed access hatches made routine servicing difficult, and preventative maintenance procedures were needlessly complex. Technicians working on the fusion plant were required to wear Level 1 protective garments. A particularly burdensome requirement mandated complete disassembly of the fusion plant and rotor system every 100 flight hours simply to replace a single drive belt, consuming enormous maintenance resources with every cycle. The combination of battlefield fragility, crew hazard, and high operating cost made the Peregrine widely regarded as more liability than asset.</p>
deployment: |-
  <p>The Cargo variant, introduced in 3036, removes the Peregrine's weapons suite entirely in favor of expanded cargo capacity, converting the airframe into a utility transport. Widely adopted across multiple factions by logistics formations, civilian organizations, and local defense forces, this variant represents the most practical use of the airframe's genuine advantages: speed and reasonable payload. Field-converted from standard Peregrines deemed surplus to combat requirements or too expensive to sustain in an armed role, Cargo variants appeared wherever operators needed an affordable light transport helicopter and had a supply of worn-out Peregrines on hand.</p>
history: |-
  <p>Blackwell Corporation introduced the Peregrine in 3021 from their New Valencia production facility, building the type initially to meet requirements identified by Wolf's Dragoons for a dedicated close air support platform capable of operating alongside assault transports. The design entered the open market almost immediately, finding buyers across Houses Kurita, Liao, and Marik, though the Dragoons themselves declined to integrate it into their standard order of battle.</p><p>After 3030, Blackwell relocated production to Outreach, consolidating manufacturing at the Dragoons' mercenary enclave and continuing to supply the broader market. New Valencia remained active into the 3040s, with both lines operating in parallel through the early Renaissance period before the New Valencia facility wound down. By 3028, whatever prestige the Peregrine had borrowed from its Wolf's Dragoons association had eroded entirely in combat, and house militaries moved their stocks steadily toward reserve depots and local police forces. The Kurita Civilian Guidance Corps absorbed a significant number of the type, deploying them in support roles that suited the vehicle's limited practical combat value.</p><p>Peregrines serving with Kurita second-line units during the Clan Invasion fared no better against Clan opponents than they had against Inner Sphere forces. The FedCom Civil War prompted Houses Davion and Steiner to press stockpiled Peregrines back into service as stop-gap reinforcements for depleted armies, though commanders consistently confined them to rear-area and gap-filler roles well behind the front. Production at Outreach came to an end during the Jihad, when Word of Blake forces seized the world. The chronic unreliability, high maintenance burden, and genuine lethality the design posed to its own crews ultimately produced the resigned humor captured in the saying "gone watching Perries," a lasting sign of the type's consistent absence from serious fighting throughout its operational career.</p>
