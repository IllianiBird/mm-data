chassis: "Hunter JumpShip"
model: "(2948) (LF)"
overview: |-
  <p>The Hunter is a specialized scout JumpShip originally developed by Clan Ghost Bear for reconnaissance and deep-space exploration. Slightly larger than the standard Scout-class vessel, it is specifically designed to operate with a weak jump signature, allowing it to slip into hostile systems with a lower chance of detection. While it lacks a grav deck for crew comfort, its exceptional fuel endurance makes it a staple for long-range scouting missions.</p>
capabilities: "<p>Much like the Inner Sphere\u0092s Magellan, the Hunter carries enough fuel for over a year of operations. However, the installation of lithium-fusion batteries significantly reduced cargo space; most modern Hunters are now limited to six-month missions due to supply constraints rather than fuel limits. Its primary tactical advantage is its \"weak jump signature,\" which makes it the ideal first-in vessel for scouting enemy fleet movements. Lacking a gravitational deck, the ship must use constant acceleration maneuvering to provide artificial gravity. While this consumes extra fuel, captains consider it a necessary expense to prevent the rapid deterioration of crew morale and health. The ship is lightly armed, for a Clan vessel, carrying only a few pulse lasers and Streak SRM systems. While it features an anti-missile system, the sensors and launchers are nose-mounted; this leaves the vital engineering module and Kearny-Fuchida drive completely exposed to missile fire from the rear.</p>"
history: "<p>The Hunter was commissioned shortly after the founding of the Clans. Early models were hindered by the absence of lithium-fusion batteries, a deficiency that was largely corrected by the mid-30th century when most of the fleet was refitted with the advanced tech. Today, the few remaining unmodified vessels are typically relegated to freebirth units. Outside of the Clans, several Hunters are known to operate within the Wolf\u0092s Dragoons aerospace fleet, though their exact technical specifications remain unconfirmed.</p>"
manufacturer: "Alshain Naval Yards"
primaryFactory: "Alshain Naval Yards"
