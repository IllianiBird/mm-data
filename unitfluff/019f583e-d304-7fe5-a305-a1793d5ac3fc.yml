chassis: "Warwolf"
model: "B"
overview: |-
  <p>The Warwolf is a 75-ton Clan heavy OmniMech introduced in 3138 by Clan Wolf as a next-generation replacement for the venerable Timber Wolf. Designed by the Wolf scientist caste to serve as a flexible cavalry platform, the Warwolf was conceived during the Clan's transition from their Occupation Zone to the former Free Worlds League border regions. The design was intended to blend the proven mobility of the Timber Wolf with the latest advances in Clan military technology, creating a new iconic heavy 'Mech for the Wolf touman. Exclusively awarded to elite warriors, the Warwolf serves as both a mark of distinction and a supremely capable frontline combatant.</p>
capabilities: |-
  <p>The Warwolf inherits the Starfire 375-rated Extra-Light Fusion Engine from its Timber Wolf predecessor, granting it a top speed of 86 kph and ensuring the same flexible mobility that made the older design so effective. Built on a WW-1 Heavy Endo Steel frame, the design dedicates 30 tons of pod space to mission-configurable weapons and equipment, providing commanders with exceptional versatility across fire support, assault, and urban combat roles.</p><p>The Warwolf's most distinctive fixed feature is its 14.5 tons of Forging BL2 Reactive Armor, which provides robust protection against conventional munitions while offering enhanced resistance to explosive ordnance such as missiles and autocannon shells. A fixed Laser Anti-Missile System further supplements the 'Mech's defensive profile, giving pilots an additional layer of protection against incoming missile fire without consuming ammunition.</p><p>In its Prime configuration, the Warwolf carries a Gauss rifle linked to a Targeting Computer for exceptional long-range accuracy, supported by twin LRM-10 launchers for sustained indirect fire capability. TAG equipment and three jump jets round out the Prime's loadout, enabling the 'Mech to designate targets for artillery support while maintaining tactical mobility across broken terrain. The combination of precision striking power and battlefield flexibility makes the Warwolf a supremely capable cavalry 'Mech.</p>
deployment: |-
  <p>Alternate Configuration B is built around mobility and intermediate-range combat. Five jump jets give the Warwolf exceptional maneuverability for a 75-ton 'Mech, allowing pilots to exploit terrain and gain positional advantage over heavier opponents. The primary armament centers on an arm-mounted Ultra Autocannon/10 with three tons of ammunition, providing sustained burst-fire capability at medium ranges. An ER Large Pulse Laser serves as the secondary weapon, delivering accurate fire even during high-speed maneuvers. A head-mounted Laser Anti-Missile System supplements the fixed system for enhanced missile defense, while five additional double heat sinks ensure thermal stability. This configuration is well-suited to aggressive flanking tactics and urban combat scenarios.</p>
history: |-
  <p>The Warwolf emerged from Clan Wolf's strategic decision to modernize its touman following the enthusiastic devaluation of the Timber Wolf by Clan Sea Fox's aggressive export sales. As Timber Wolves became increasingly common among Inner Sphere militaries and minor Clans, Khan Alaric Ward directed the scientist caste to develop a replacement that would restore the prestige of Clan Wolf's heavy cavalry formations. Development began while the Wolves still occupied their traditional Occupation Zone, with initial prototypes assembled at the W-7 Facilities on Weingarten.</p><p>When Clan Wolf abandoned their Occupation Zone to forge a new empire along the former Free Worlds League border, only a handful of Warwolf prototypes had been completed. These early machines yet made a terrifying impression on Wolf enemies during the initial campaigns to secure the Wolf Empire's territory. Full-scale production was established at Kallon Weapon Industries on Thermopolis, leveraging the captured Inner Sphere manufacturer's facilities. However, Kallon's limitations as an Inner Sphere firm adapting to Clan production standards meant output remained constrained through the mid-3140s, though steady improvements suggested the Warwolf would eventually proliferate in greater numbers.</p><p>Since entering service, the Warwolf has been exclusively awarded to ristars and individuals who have earned the personal favor of the Khan, making it a mark of exceptional distinction within the Wolf touman. The design saw notable action during the invasion of Tharkad in 3143, where Warwolf pilots served in Alpha and Beta Galaxy formations during fierce urban combat against Lyran defenders. The 'Mech was also present during the assault on Hesperus II in 3145, where elements of the Eighty-eighth Wolf Battle Cluster employed Warwolves alongside Thors and Mad Cats to break through Lyran defensive lines outside Quetta.</p><p>The Warwolf's assignment to elite ristar formations has produced a wide variety of proven weapons configurations that have since become standardized options, reflecting the design philosophy of allowing the Clan's best warriors to tailor their 'Mechs to individual combat doctrine. With production at Thermopolis continuing to improve, the Warwolf is expected to become a cornerstone of Clan Wolf's frontline formations in future conquests.</p>
