chassis: "Motorized Platoon (Generic)"
model: "(Laser Anti-Mek 2456+)"
overview: |-
  <p>Motorized infantry platoons use light ground vehicles, typically motorcycles or quad bikes, for rapid movement between positions. Faster than foot infantry and cheaper than fully mechanized formations, motorized platoons fill the gap between static garrison troops and armored combat units. They excel at road-bound patrol routes, rapid redeployment along prepared axes, and screening operations where speed matters more than protection. These anti-BattleMech specialists are trained in the dangerous art of swarming enemy machines using grapling lines and powerful winches to target vulnerable joints and exposed systems that would normally be safely out of reach.</p><p>Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these platoons field one of the most effective personal arms available to conventional infantry, though the weapons are significantly more expensive and require soldiers to carry additional power packs.</p>
