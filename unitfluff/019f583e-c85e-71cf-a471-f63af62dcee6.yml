chassis: "Onslaught"
model: "SA-OS3"
overview: |-
  <p>The Onslaught is a seventy-five-ton heavy BattleMech produced by Solaris Arms, the small Solaris VII-based manufacturer known for designing arena-specific combat machines. Initially conceived as a technology test bed in the wake of the Clan Invasion, the Onslaught soon entered limited production and proved popular enough to keep the company afloat for years. Though mainstream manufacturers dismissed it as a limited-run novelty, the design earned a loyal following among Solaris stables and independent gladiators, establishing itself as one of the more recognizable heavy designs on the arena circuit. Over a hundred were built across the design's production life, with a distinctive culture of salvage rebuilds extending its presence well beyond original manufacturing numbers.</p>
capabilities: |-
  <p>The Onslaught's defining characteristic is its remarkable speed for a heavy 'Mech. Powered by a 375-rated XL fusion engine, the design achieves a cruising speed of fifty-four kilometers per hour and a maximum speed of eighty-six, performance figures that compare favorably with 'Mechs ten or twenty tons lighter. Five standard jump jets further enhance its mobility with a jump capacity of one hundred fifty meters, making the Onslaught one of the most agile heavy designs on the Solaris arena circuit.</p><p>The SA-OS2 mounts an experimental SA Light Autocannon/5 paired with an SA Large X-Pulse Laser as its primary weapons. Six Voelkers 200 machine guns provide effective anti-infantry capability and close-range supplemental fire, while two SureShot Mk VIa SRM-6 launchers deliver significant short-range punch. An experimental Angel ECM Suite integrated into the custom targeting system provides electronic warfare protection, including defense against Streak missile locks.</p><p>This speed and agility comes at a cost, however. The Onslaught's armor protection, while adequate, is hardly exceptional for a seventy-five-ton chassis. The reliance on an XL engine also creates a critical vulnerability to side torso damage, a trade-off that demands skilled piloting to mitigate in the unforgiving arena environment.</p>
deployment: |-
  <p>This variant differs from the SA-OS2 through fundamental structural modifications that make it available only as a factory-built 'Mech rather than a field upgrade. The design replaces the endo steel internal structure with a composite chassis and substitutes standard armor for ferro-fibrous plating, achieving comparable protection at reduced weight. The primary armament is reconfigured around an Ultra Autocannon/10 paired with a Medium X-Pulse Laser, trading the SA-OS2's longer engagement range for greater close-range firepower. The SA-OS3's distinct construction requirements mean that it cannot be produced from upgrade kits, requiring full new production from Solaris Arms' facility.</p>
history: |-
  <p>The Onslaught emerged during the technological ferment that followed the Clan Invasion, as Solaris Arms sought to capitalize on the flood of new technologies reaching the Inner Sphere's arenas. Designed as a platform to test and showcase experimental weapon systems, the design entered production in the early 3050s and quickly established itself as a competitive heavy contender in the Solaris VII arena circuit. More than one hundred Onslaughts were built over the design's decade and a half of production, with roughly forty-five remaining in active service by the mid-3060s.</p><p>Despite its niche origins, the Onslaught proved commercially viable enough to sustain Solaris Arms through the economic turbulence of the early 3060s, a period that nearly drove the small manufacturer into bankruptcy. The introduction of the SA-OS2 standard in 3062 and the subsequent SA-OS3 variant reinvigorated sales and secured the company's survival. Solaris Arms' strategy of offering upgrade kits that could bring older SA-OS models up to SA-OS2 specifications proved particularly shrewd, extending the service life of existing machines without requiring full new production.</p><p>The Onslaught's limited production numbers and the violent nature of arena combat have ensured a steady attrition rate, contributing to the proliferation of FrankenMech rebuilds that have become the design's most distinctive cultural feature. The practice of combining salvaged components from multiple destroyed Onslaughts into a single functioning machine became so widespread that it developed into a recognized tradition among Solaris stables and independent gladiators alike. These rebuilt machines often adopt combined names from their donor 'Mechs, further cementing the Onslaught's reputation as a uniquely Solarian creation.</p><p>During the Jihad, Solaris Arms' facility on Solaris VII suffered no capital or personnel losses and maintained full production capacity through at least 3072. The Onslaught continued to serve primarily in the arena circuit throughout this period, though the broader conflict disrupted the gladiatorial economy that sustained demand for the design.</p>
