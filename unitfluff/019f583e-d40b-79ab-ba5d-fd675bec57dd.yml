overview: |-
  <p>The Diomede is a one-hundred-ton IndustrialMech introduced in 3084 by Curtiss Hydroponics on Silver, produced through its Power Systems Division in partnership with its Curtiss MiliTech subsidiary. Born from the devastation of the Word of Blake Jihad, the Diomede was conceived during an era of unprecedented civilian reconstruction across the Inner Sphere. Curtiss recognized a paradigm shift in the IndustrialMech market: customers increasingly demanded machines capable of providing meaningful protection against hostile threats while performing heavy construction tasks. The result was a massive ConstructionMech that doubled as a credible SecurityMech, blurring the line between civilian and military hardware. The Republic of the Sphere took notice of this dual capability and imposed strict licensing requirements for civilian purchasers, though this did little to dampen demand for what many regarded as the most capable IndustrialMech of its generation.</p>
capabilities: |-
  <p>The Diomede is best described as a hybrid between a heavy ConstructionMech and a SecurityMech, built on the massive Curtiss Diomede chassis and powered by the proven Nissan 200 fusion engine. Standing taller and sleeker than any previous IndustrialMech, the design mounts dual Aeneas lift hoists on its rear torso capable of carrying loads up to one hundred tons, fulfilling its primary crane function. The left arm carries a ThruSteel Heavy Duty pile driver for trench digging and cable installation, while the fully articulated right hand (uncommon among ConstructionMechs) wields a pair of SperryBrowning-Civ rivet guns with enough dexterity to hold girders in place while simultaneously securing them. Curtiss Expert sprayers round out the industrial toolkit.</p><p>What elevates the Diomede beyond conventional IndustrialMechs is its combat capability. Twin Doombud MML-7 launchers sit concealed beneath torso fairings, guided by a Dynatec 256/MissileTrac V Advanced targeting system normally reserved for BattleMechs. Nineteen tons of Kallon FWL Heavy Industrial armor with CASE protection provide a level of survivability that rivals some medium BattleMechs. The cockpit features an ejection seat and advanced fire control systems, features almost unheard of in the IndustrialMech sector. Caterpillar tracks fitted to the lower legs allow the Diomede to bend at the knee for stable low-speed movement, though its maximum speed of thirty-two kilometers per hour leaves it vulnerable if caught in the open.</p>
deployment: |-
  <p>This variant is a radical departure from the Diomede's industrial origins. Introduced in 3092, this variant was explicitly designed to circumvent the Republic of the Sphere's moratorium on BattleMech construction, creating what many have described as a poor man's assault 'Mech built on an IndustrialMech chassis. Every piece of industrial equipment has been stripped away and replaced with military hardware: an Imperator Gauss rifle dominates the left arm, a pair of medium lasers and twin machine guns replace the rivet guns and sprayers, and the twin Doombud MML-7 launchers are retained for additional firepower. The caterpillar tracks remain, giving this variant a distinctive silhouette on the battlefield. While it cannot match a purpose-built assault BattleMech in speed or sophistication, this variant offers a hundred tons of armored firepower at a fraction of the cost, making it attractive to budget-conscious militias and mercenary commands operating in the fractured political sphere of the Dark Age.</p>
history: |-
  <p>The Diomede emerged from the ruins of the Jihad, a conflict that inflicted destruction on a scale not seen since the Second Succession War. Curtiss Hydroponics, long established as a Free Worlds League industrial conglomerate specializing in hydroponic food production and water purification, had weathered the Succession Wars by stockpiling critical supplies and maintaining its vital TriFil water purification network. However, the Jihad brought new challenges. The destruction of its Curtiss MiliTech BattleMech factory on Paradise in 3080 and the subsequent imposition of Devlin Stone's moratorium on BattleMech construction forced the company to pivot entirely to the civilian sector.</p><p>Curtiss's Power Systems Division, based on Silver, seized the opportunity presented by the massive post-Jihad reconstruction effort. The Diomede entered production in 3084 and found immediate success, with Curtiss adopting a stance of strict neutrality to maximize its customer base. Orders flowed in from all successor governments of the former Free Worlds League, and Curtiss opened sales to independent companies and mercenary commands as well, though the latter category drew scrutiny from Republic authorities. Silver itself changed hands during the Dark Age, falling under the Duchy of Tamarind-Abbey before eventually returning to Free Worlds League control.</p><p>The Diomede's combat potential did not go unnoticed. By 3092, the militarized D-M3D-M variant appeared, stripping away all industrial equipment in favor of weapons and effectively creating a budget assault 'Mech that circumvented the Republic's restrictions on BattleMech construction. This development validated the concerns that had led the Republic to impose licensing fees on the original design, though by that point the political theater had shifted enough that enforcement proved difficult. The D-M3D-4 DemolitionMech variant also found its way into aftermarket refit channels during the Dark Age, further expanding the Diomede's reach beyond its original Free Worlds League customer base.</p>
