chassis: "Mechanized Wheeled Platoon (AFFS)"
model: "(Flamer 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Mechanized wheeled platoons ride wheeled transports that offer good speed on roads and developed terrain, making them well-suited to garrison duty on worlds with established infrastructure where rapid response matters more than cross-country capability. Carrying man-portable flamers that project streams of burning accelerant, these platoons are equipped for area denial and anti-infantry work, able to clear defensive positions and flush enemies from fortified structures.</p>
