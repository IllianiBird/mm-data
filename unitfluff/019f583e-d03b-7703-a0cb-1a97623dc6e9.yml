chassis: "Tundra Wolf"
model: "3"
overview: |-
  <p>The Tundra Wolf is a 75-ton Clan heavy BattleMech introduced in 3076, notable as the first all-new Clan Wolf design developed and produced entirely in the Inner Sphere. Cut off from Homeworld industry and under constant pressure during the Word of Blake Jihad, Khan Vlad Ward authorized a crash program to expand manufacturing capabilities within the Wolf Clan Occupation Zone. Rather than pursuing a costly and complex OmniMech, Wolf engineers focused on a standard generalist BattleMech that could be readily manufactured and fill multiple roles within the Clan's depleted touman.</p><p>Stepping off the W-7 assembly lines on Tamar, the Tundra Wolf represented a pragmatic departure from traditional Clan design philosophy. Its inclusion of an ECM suite, specifically installed to counter Word of Blake electronic warfare capabilities, signaled a willingness to adapt that had been resisted for decades. The design quickly became a symbol of Clan Wolf's determination to maintain combat effectiveness despite being severed from Clan space.</p>
capabilities: |-
  <p>Built on a Mark XX Heavy Endo Steel chassis powered by a 300-rated XL engine, the Tundra Wolf achieves a cruising speed of 43 kilometers per hour with a top speed of 65. MASC allows short bursts approaching 86 kilometers per hour, while BMP Series XV jump jets provide 120 meters of vertical mobility. Fourteen and a half tons of Beta Compound standard armor provide robust protection for a design of its weight class, though battleROM analysis suggests the shoulder and elbow joints are particularly vulnerable to concentrated fire.</p><p>The base configuration carries an impressive weapons array covering virtually all engagement ranges. A Type 9 Series ATM-9 and Type XX Long Bow LRM-20 deliver heavy missile fire at range, while a Series 7K ER large laser adds direct fire capability. Four Series 2b ER medium lasers provide effective medium-range output, and a Smartshot MkV Streak SRM-4 rounds out the close-range arsenal. Seventeen double heat sinks manage the thermal load adequately under most combat conditions. A Khan Series communications system with integrated ECM suite provides electronic warfare protection, a capability specifically designed to counter Blakist C3i networks.</p>
deployment: |-
  <p>The Tundra Wolf 3 was clearly designed with Clan duelists in mind. Using the Tundra Wolf 2 as its baseline, this variant sacrifices the targeting computer, three tons of armor, and two medium lasers to mount a second ER PPC. Paired with the Series 7K ER large laser and LRM-15, the Tundra Wolf 3 is optimized for long-range engagements. A quartet of Series 2b ER medium lasers backed by a Streak SRM-4 provide close-range defense. The primary long-range arsenal generates nearly twenty-five percent more heat than the 'Mech's nineteen double-strength heat sinks can immediately shed, making heat management a critical concern for pilots. Despite this limitation, the variant quickly became a favorite among more traditional Wolves who favor zellbrigen.</p>
history: |-
  <p>The Tundra Wolf's origins lie in the desperate circumstances facing Clan Wolf during the Jihad. For years after the Clan Invasion, the merchant caste maintained the flow of supplies through deals with fellow Invading Clans. However, the disruptions of the Jihad soon made this untenable. With the supply problem becoming critical, Khan Vlad Ward authorized a fundamental shift in industrial policy, ordering production site upgrades with an eye toward manufacturing Clan technology designs within the Wolf Clan Occupation Zone. This decision had been delayed for decades, partly to avoid putting superior Clan technology within reach of Spheroid insurgents, but necessity finally overcame caution.</p><p>The engineering teams were given broader latitude in design than was typical for Clan programs. The result was the Tundra Wolf, stepping off the W-7 assembly lines on Tamar in 3076. As the first Clan Wolf BattleMech designed and built entirely in the Inner Sphere, it became a powerful symbol of the Wolves' new roots in the occupation zones. Limited production initially restricted deployment to Delta Galaxy, the Wolf Clan force assigned to fight alongside Devlin Stone's Coalition against the Blakists. The design proved its worth in that campaign, demonstrating the flexibility its engineers had intended.</p><p>Despite its recent inception, Wolf engineers rapidly developed multiple variants to address different tactical requirements. The energy-focused Tundra Wolf 2 and the duelist-oriented Tundra Wolf 3 appeared alongside the base model, while the Tundra Wolf 4 emerged roughly twelve months later and quickly became the most popular configuration among Wolf warriors. During the fierce fighting to shatter the Blake Protectorate, the Wolves allowed Stone's Coalition to salvage and repair a number of Tundra Wolves, and the design still appears in modest numbers within the Republic Armed Forces. The Wolves have offered spare parts and other supplies to the RAF to maintain their supply of Tundra Wolf 'Mechs, though they have not agreed to sell complete machines.</p><p>Clan Wolf-in-Exile also fields some examples of the design, though whether these were acquired in Trials against Clan Wolf or through other means remains unclear. When Alaric Ward forged the Wolf Empire, he left the W-7 facilities on Tamar to Clan Hell's Horses, transferring Tundra Wolf production to the Horses along with the factory itself. Under Hell's Horses stewardship, the design continues in production, serving as a capable frontline heavy 'Mech for multiple Clan forces.</p>
