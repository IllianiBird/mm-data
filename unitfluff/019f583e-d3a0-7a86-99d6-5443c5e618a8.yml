chassis: "Sarath"
model: "SRTH-1OA"
overview: |-
  <p>The Sarath is a fifty-ton medium quad OmniMech introduced in 3122 as the only native Regulan OmniMech design. Developed by Ronin Inc. on Wallis for the Principality of Regulus, the Sarath was conceived during a period when Free Worlds League successor states sought to develop advanced military technologies independent of former League partners. Named for the charioteer guise adopted by the divine Krishna in the Mahabharata, Regulan expectations for the design were immense.</p><p>Ronin's engineers built the Sarath as a quad platform with an advanced turret system, combining Inner Sphere and Clan technologies to create a versatile combat platform. The design's prestige was such that all production was initially barred from export and reserved exclusively for the Regulan Hussars. Despite its capable design, the Sarath ultimately acquired a reputation that failed to match these lofty expectations, becoming a symbol of institutional disappointment rather than the military triumph its creators envisioned.</p>
capabilities: |-
  <p>The Sarath's most distinctive feature is its quad turret mounting, which houses fifteen of the 'Mech's nineteen tons of pod space. Regulan engineers adopted this configuration to address the space constraints inherent in a quad chassis frame, allowing turret-mounted weapons to engage targets in any direction regardless of the 'Mech's facing. However, the turret controls proved counter-intuitive to many BattleMech pilots, contributing to the design's poor reception among MechWarriors more accustomed to conventional bipedal controls.</p><p>Built on a lightweight RI-17p Vijaya chassis with a Magna 250 XL engine, the Sarath achieves respectable speeds for a fifty-ton design. Triple Strength Myomer further enhances both speed and physical combat potential as the design runs hot, giving it a significant advantage in close quarters. Nearly twelve tons of Durallex Heavy armor provide excellent protection for a medium 'Mech, ensuring the Sarath can absorb considerable punishment. The generous pod space and full-rotation turret give each configuration considerable tactical flexibility, though the quad chassis limits hand-held weapon options and the turret's additional weight constrains overall firepower compared to similarly-sized bipedal OmniMechs.</p>
deployment: |-
  <p>Alternate Configuration A recasts the Sarath in a fire support role, leveraging Clan Sea Fox as its weapons supplier. The turret mounts a pair of Clan-specification LRM-15 launchers supplemented by two MML-3 launchers, providing both long-range bombardment capability and flexible missile support. Ammunition reserves stored across the 'Mech's four legs ensure sustained fire. Five jump jets grant enhanced mobility unusual for a fire support platform, allowing the Sarath A to reposition quickly between salvos. A Clan-produced ER small laser in the center torso supplements the fixed head-mounted laser for close defense.</p>
history: |-
  <p>The Sarath's development emerged from the Regulan Fiefs' ambition to field an OmniMech designed and built entirely within its borders. Ronin Inc., the Regulan military's primary domestic manufacturer, undertook the project at their Wallis facility, and the SRTH-1O entered production in 3122. Initially, the Sarath was held in high esteem, with all production reserved for the Regulan Hussars and export strictly forbidden. Most units were assigned to the prestigious First, Second, and Fourth Hussars, making the Sarath a symbol of Regulan military pride.</p><p>The 'Mech's fortunes took a sharp turn during its combat debut at Aitutaki in 3134. The Fourth Regulan Hussars, taking a cue from Capellan rapid-deployment doctrine, overloaded a pair of Union-class DropShips and landed two companies near the planetary capital. The Sarath's compact frame made this possible, and the planetary militia, underestimating the size of the Regulan force, engaged what they believed to be a raid. The Saraths played a key role in defeating the defenders and securing the planet.</p><p>However, the victory proved short-lived. The Marik-Stewart Commonwealth responded with the elite First Free Worlds Guards. Hussar Saraths performed effectively in the defense, with their turrets proving particularly useful against lighter Guard 'Mechs attempting flanking maneuvers. In one notable engagement captured on battleROM, a Guard Locust was obliterated by PPC fire from a Sarath while it tried to engage the OmniMech from the rear. Despite this, the Fourth Hussars were ultimately driven from Aitutaki, and the loss was laid at the feet of the new OmniMech rather than the strategic situation.</p><p>The defeat catalyzed a cycle of declining prestige. A decision to abbreviate training programs for Sarath pilots compounded the problem, producing less capable crews who reinforced the 'Mech's emerging reputation as a disappointment. Assignment to a Sarath became viewed as a sign of a MechWarrior falling out of favor, further eroding morale among the design's operators. The unit's rapid fall in prestige eventually led to a more even distribution across all Hussar regiments, as assignment to the Sarath was no longer considered a mark of distinction.</p><p>Despite its capable design and solid performance when properly crewed, the Sarath has struggled to overcome this institutional stigma within the Regulan military. The 'Mech remains in production at the Ronin facility on Wallis, and its continued service across the Regulan Hussars ensures that the design's true capabilities occasionally shine through the cloud of its tarnished reputation.</p>
