chassis: "Xanthos"
model: "XNT-3O"
overview: |-
  <p>The Xanthos is a hundred-ton quadrupedal assault BattleMech designed by Hollis Industries on Corey. Conceived by Dr. David Harrison, it represented the first four-legged combat platform ever developed, a revolutionary departure from conventional bipedal design philosophy. Harrison believed the quad configuration offered superior stability and could support heavier armor loadouts than traditional assault designs, making it ideal for frontal assault operations. Commissioned during the Age of War, the Xanthos was initially produced for the Capellan Confederation and would later see limited service with other Inner Sphere powers. Though overshadowed by its more famous bipedal contemporaries, the design proved its underlying concept sound, eventually inspiring the development of other quadrupedal BattleMechs. The Xanthos holds a unique place in military history as the progenitor of all four-legged combat machines.</p>
capabilities: |-
  <p>The XNT-3O Xanthos is built on a Hollis XNT Mark V chassis powered by a Vlar 300 fusion engine, giving the hundred-ton machine a modest top speed of fifty-four kilometers per hour. Over twenty tons of Durallex Heavy armor provide exceptional battlefield endurance, taking full advantage of the quad chassis's ability to distribute protection across four leg assemblies. Twenty-three single heat sinks manage the thermal output of a diverse weapons array.</p><p>A GE 508 Class 20 Autocannon serves as the primary close-range weapon, capable of devastating damage at short distances. A Donal PPC extends the engagement envelope to longer ranges, while three Martell medium lasers and a Holly six-tube Short Range Missile rack exploit openings created by the heavier weapons. A rear-mounted Diverse Optics Type 10 small laser provides minimal coverage against flanking attacks. With only fifteen salvos each for the autocannon and missile rack, pilots must manage ammunition carefully, relying on the energy weapons to sustain combat once ballistic stores are depleted. HartfordCo Com 2500 communications and HartfordCo XKX 2 targeting systems complete the electronics suite.</p>
deployment: |-
  <p>This variant is the definitive production model of the Xanthos, incorporating all the lessons learned from the primitive prototype and subsequent quad design work. This variant formed the backbone of Capellan heavy assault lances during the Star League era, though limited procurement meant relatively few were built. Its combination of heavy armor, a devastating close-range autocannon, and supplementary energy weapons made it a formidable anchor for any assault formation, though the design was discontinued decades before the introduction of the BattleMaster in 2633.</p>
history: |-
  <p>The origins of the Xanthos trace back to the early 2540s when Hollis Industries recruited Dr. David Harrison, a brilliant young engineer given near-complete creative freedom. His mandate was straightforward: produce a BattleMech that would bring Hollis into the upper echelon of military manufacturers. His first success came in 2561 with the Catapult, which provided the financial foundation for his more ambitious vision of a four-legged combat platform.</p><p>Harrison spent years refining his quadruped concepts, producing the first XNT-2O prototypes in 2564 using proven but outdated primitive technologies. These early machines were presented to the Hegemony Armed Forces for evaluation, but the results were disastrous. Test pilots struggled to keep the prototype upright on uneven terrain, and its supposed stability proved illusory. The Hegemony rejected the design, and Harrison departed for the Brigadier Corporation, where he finally succeeded in producing stable quadrupedal designs in the Scorpion and Goliath.</p><p>Hollis eventually perfected the Xanthos by incorporating refinements developed through those later quad designs. The production XNT-3O entered service in 2579, earning Capellan interest. House Liao purchased most of the initial production run, but delivery delays led the Confederation to cancel further procurement. Attrition gradually removed the design from active service, and the Xanthos was effectively extinct by the Second Succession War. The "Harrison's Follies" label dogged all four-legged BattleMechs for centuries, and MechWarriors and commanders alike viewed the quad configuration with deep suspicion.</p><p>In 2761, the SLDF's Eighty-first Mechanized Infantry Division received an unusual gift when the Capellan government donated a full battalion of Xanthos assault machines to the division, a reflection of the longstanding goodwill between the unit and the Confederation.</p><p>The Xanthos experienced a dramatic revival in the 3070s following the discovery of the Hegemony Memory Core, which preserved the technical specifications needed to restart production. Hollis Industries and Norse-Storm Technologies partnered to produce modern variants incorporating advanced technologies. Elite Capellan and Lyran units, along with select mercenary commands, began fielding the redesigned assault machine. During the Jihad, additional retrotech XNT-2O production lines were established at Tsinghai, Togura, and Illiushin to help meet wartime demand for heavy combat platforms, though these temporary facilities ceased operations by 3079. Hollis continued to develop new variants through the Dark Age, keeping the Xanthos in active Capellan service well into the thirty-second century.</p>
