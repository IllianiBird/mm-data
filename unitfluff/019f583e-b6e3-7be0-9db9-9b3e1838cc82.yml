chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled UAC20 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing assault-class ultra autocannon capable of double-rate fire, these field gun crews field the most devastating rapid-fire direct weapons available to conventional ground forces.</p>
