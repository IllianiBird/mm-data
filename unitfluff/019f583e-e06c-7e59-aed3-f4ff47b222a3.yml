chassis: "Agrotera"
model: "AGT-UA 'Ariel'"
overview: |-
  <p>The Agrotera is a 50-ton medium BattleMech introduced in 3108 by Majesty Metals and Manufacturing on Canopus IV. Conceived as a multipurpose and ammunition-independent design for the Magistracy of Canopus, the Agrotera was built to excel in a variety of tactical roles, though it is most frequently deployed in support of lighter reconnaissance elements. Its origins trace to inherited Word of Blake manufacturing infrastructure on Canopus IV, which Majesty Metals repurposed following the Jihad to produce a wholly new design rather than continue existing production lines. The Agrotera has since entered service with both the Magistracy of Canopus and its close ally, the Capellan Confederation, where it has earned a solid reputation as a versatile and self-sufficient medium striker.</p>
capabilities: |-
  <p>The Agrotera's fully energy-based armament gives it exceptional battlefield endurance and loitering capability, a quality prized by supply officers operating far from established logistics chains. Its primary weapon, a Ceres Arms Smasher extended-range particle projection cannon mounted in the left arm, delivers punishing long-range fire with its accuracy further enhanced by an Actuator Enhancement System. Supplementing this at closer ranges are a Diverse Optics 37V medium variable-speed pulse laser, a medium pulse laser, and a pair of small pulse lasers distributed across the torso sections to deter infantry and battle armor threats. A TAG unit enables the Agrotera to designate targets for allied artillery and missile support.</p><p>Mobility is a defining characteristic of the design. A Rawlings 300 XL engine propels the chassis to speeds of 97 kph, while Rawlings 45 jump jets augmented by a partial wing system extend both its jumping range and heat dissipation capacity. The partial wing's additional cooling effect partially offsets the heat burden of sustained energy fire. Nine and a half tons of Durallex Light standard armor provide respectable protection for a medium 'Mech, and a Full-Head Ejection System offers the pilot enhanced survivability should that protection fail. However, the reliance on an XL engine and XL gyro means that torso damage can prove catastrophic, and quartermasters often note that the variable-speed pulse laser components remain difficult to source in the Periphery.</p>
deployment: |-
  <p>The AGT-UA 'Ariel' is a heavily customized arena variant that debuted in 3145 at The Pool on Solaris VII, specifically adapted for underwater combat. The conversion trades the standard model's improved jump jets for Underwater Maneuvering Units, sacrificing aerial mobility entirely in favor of aquatic capability. The weapons loadout is replaced wholesale with Clan-specification equipment, mounting two extended-range large lasers and two extended-range medium lasers for superior reach both above and below the waterline. Clan reflective armor and BattleMech HarJel systems across the torso sections provide exceptional protection against hull breaches, making engine-killing damage extremely difficult to achieve in the submerged environment. Clan-grade double heat sinks manage the considerable thermal output of the energy weapons suite. The TAG unit is removed, as forward observation capability is irrelevant in arena competition.</p>
history: |-
  <p>The Agrotera's origins trace directly to the Jihad-era Word of Blake presence in the Magistracy of Canopus. When Blakist forces established production of the PXH-4W Phoenix Hawk on Canopus IV, the manufacturing infrastructure they built survived their eventual defeat. Majesty Metals and Manufacturing inherited the production line and, rather than simply continuing Phoenix Hawk production, undertook a comprehensive redesign that yielded the Agrotera in 3108. The new design retained the Earthwerks PXH II chassis frame and Rawlings powerplant but incorporated post-Jihad technological advances including a partial wing system and variable-speed pulse laser technology.</p><p>The Agrotera saw its baptism of fire almost immediately upon entering production. In 3108, newly delivered Agroteras assigned to the 1st Magistracy Highlanders clashed with bandit forces on Bethonolog. When a pirate lance of heavy BattleMechs threatened the Canopian Industries consumer electronics factory roughly twenty kilometers from the Highlanders' position, the only units fast enough to intercept were a pair of Agroteras. Despite being outweighed by nearly 200 tons, the two 'Mechs employed hit-and-run tactics among the factory complex's dozens of buildings, delivering punishing volleys before using their jump capability to break contact. By the time the Highlanders' heavier elements arrived, the Agroteras had destroyed one bandit 'Mech, crippled another, and damaged the remaining two sufficiently to force their surrender.</p><p>The Capellan Confederation subsequently adopted the Agrotera for its own armed forces, deploying the design alongside the Yinghuchong in mixed formations. During the Capellan invasion of Cumberland in 3144, a combined unit of Agroteras and Yinghuchongs engaged Federated Suns defenders in the Sarasota Flats. The extreme temperatures of the Flats limited the Agrotera's ability to fully leverage its energy-heavy loadout, relegating it to a harassing role similar to its lighter companion. Over four days of running engagements, the Capellan force disabled five Davion 'Mechs while sustaining only moderate damage, and the constant distraction enabled a Capellan detachment to bypass the Flats and capture two Federated Suns DropShips. The engagement demonstrated both the Agrotera's tactical flexibility and the frustration it could inflict on heavier opponents unable to pin down the nimble design.</p><p>The Agrotera's reputation has also extended to the arena circuits, with at least one heavily customized variant appearing on Solaris VII by 3145, adapted for the unique demands of underwater combat in The Pool arena. The design continues to serve as a mainstay of Magistracy and Capellan medium 'Mech formations, valued for its independence from ammunition supply lines and its ability to sustain prolonged engagements.</p>
