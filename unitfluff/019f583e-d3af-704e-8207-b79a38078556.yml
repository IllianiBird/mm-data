chassis: "Hound"
model: "HD-2F"
overview: |-
  <p>The Hound is a seventy-ton heavy BattleMech introduced in 3098 by Coalition Armory Inc. on the Periphery world of Filtvelt. Designed to fill a fire support role comparable to the venerable Warhammer, the Hound was built around a philosophy of simplicity and reliability, using proven components that were widely available and easy to maintain. Representing a landmark achievement for the Filtvelt Coalition, the Hound marked a significant step forward in the Coalition's domestic military production capability.</p><p>The straightforward design of the Hound endeared it not only to its pilots but to logistics personnel across the Coalition and beyond. Its dependability and ease of repair made it attractive to mercenary commands and small nations operating on tight budgets, and production has continued steadily at Coalition Armory for nearly half a century.</p>
capabilities: |-
  <p>The Hound mounts a diverse arsenal centered on a Mydron Excel LB 10-X autocannon carried in a shoulder mount reminiscent of the Shadow Hawk. Fed by two tons of ammunition, the autocannon can deliver solid slugs to crack armor or switch to cluster munitions to maximize the chance of damaging exposed internal systems. A pair of Johnston Lite light particle projection cannons in the right arm provide long-range fire support, matching the reach of a standard PPC at half the damage output. This combination ensures the Hound can engage effectively at extended ranges even after exhausting its autocannon ammunition.</p><p>At closer ranges, a Holly SRM-4 launcher backed by a ton of reloads and a ChisComp 39 medium laser give the Hound additional punch against opponents that close the distance. The design benefits significantly from its use of a standard GM 280 fusion engine, which provides a respectable top speed of sixty-four kilometers per hour while granting the Hound exceptional survivability. Unlike XL engine-equipped designs, the loss of a side torso will not cripple the Hound, allowing damaged machines to continue fighting or withdraw under their own power. Fifteen single heat sinks manage the modest thermal load of its mixed weapon systems. The tradeoff for this reliability is a lack of jump capability and a conservative top speed for its weight class, limiting tactical flexibility in broken terrain.</p>
deployment: |-
  <p>No factory variants of the Hound have been produced as of the mid-thirty-second century. The baseline HD-2F remains the sole production model, reflecting the Filtvelt Coalition's pragmatic approach to military procurement. Coalition Armory has focused on maintaining steady production of the proven design rather than diverting resources to develop specialized variants, a strategy well-suited to the Coalition's limited industrial base and the Hound's versatile combat profile.</p>
history: |-
  <p>The Hound emerged from a critical inflection point in the Filtvelt Coalition's military development. When the Coalition seceded from the Federated Suns in 3072, its armed forces were desperately short of modern equipment, relying on aging RetroTech designs and cast-off machines from better-equipped formations. Coalition Armory Inc. on Filtvelt initially produced RetroTech BattleMechs as the only viable option, but by the late 3090s, improvements to the Coalition's industrial base allowed the company to begin manufacturing designs using Succession Wars-era components and select newer technologies. The Hound was the first to move beyond RetroTech construction, resulting in a simple, effective heavy 'Mech that dramatically improved the combat capability of the Filtvelt Citizen's Militia.</p><p>The Hound quickly earned its reputation as a "shredder" in engagements against the pirate bands that plagued the Coalition's borders. In 3101, one of its first major tests came on the world of Broken Wheel, where elements of the Second Filtvelt Citizens Militia engaged the Border Lords, a pirate band that had fled the Calderon Protectorate seeking easier prey in Coalition space. A company of Hounds, supported by Pegasus hovertanks and locally produced Light Thunderbolt Carriers, fought the pirates through tight urban streets where the heavy 'Mechs' durability and firepower proved decisive. The Hounds set up firing lanes and ambushes that systematically dismantled the pirate force, and the Border Lords fled the world having lost half their 'Mechs.</p><p>The Hound also proved effective in offensive operations. In 3117, when pirates from the Pirates Haven rampaged through Carvajal, the local militia was overwhelmed. The mercenary Green Machine, the closest available reinforcement from the Calderon Protectorate, responded with a force that included Hounds providing heavy fire support. The Hounds championed the assault into the capital city, weathering punishing fire from pirate DropShips while driving the raiders from residential areas. In the final engagement on the plains outside the capital, concentrated autocannon fire from the Hounds demolished the pirate DropShips' engines and weapons, trapping the raiders and ending the threat.</p><p>By the mid-thirty-second century, the Hound had become a cornerstone of the Filtvelt Coalition's military, serving with distinction in every brigade of the Citizen's Militia. Its popularity with mercenary commands operating along the Periphery border ensured a steady export market, and Coalition Armory's continued production kept the design available in quantity. The combination of rugged construction, straightforward maintenance requirements, and punishing firepower has kept the Hound rolling off the assembly lines for decades, earning it a reputation as a dependable workhorse in a dangerous region of space.</p>
