chassis: "Hunchback"
model: "HBK-LGN-Pin 'Drizella'"
overview: |-
  <p>The HBK-LGN-Pin Ugly Stepsister Drizella is a fifty-ton mixed-technology BattleMech built for the Solaris dueling stable Team Godmother during the Dark Age. It is the twin counterpart to Anastasia, assembled from the same salvaged trio of donor 'Mechs and presented as the second of the team's wicked stepsisters under the stable's Cinderella theme.</p><p>Where its sister leans on mass and armor, Drizella takes the opposite approach. It is fast and light on its feet, built around mobility and a dense battery of short-range energy weapons rather than a single heavy punch. The design trades reach and durability for speed, aiming to close quickly and overwhelm a single opponent before the crowd has time to settle.</p>
capabilities: |-
  <p>Drizella is a saturation brawler designed to bury a single target under a wall of short-range fire. Its mixed battery combines a pair of medium lasers, two Clan medium pulse lasers, and four Clan micro pulse lasers, a loadout that produces enormous damage at point-blank range while contributing almost nothing past a short reach. A three-hundred-fifty-rated extralight engine drives the machine to highway speeds, and jump jets let it cover nearly its full running distance in a single bound, giving it the agility to dictate range against slower foes.</p><p>That speed and firepower come at a cost. Fourteen double heat sinks struggle to keep pace with the full array, so the pilot must choose which weapons fire on any given pass or risk building dangerous heat. The extralight engine saves weight but spreads vulnerable components into the side torsos, and the short effective range of every weapon means a faster or longer-ranged opponent can simply refuse the close fight Drizella needs.</p>
deployment: |-
  <p>Drizella was Team Godmother's aggressor, using its speed and jump capability to chase down and corner single opponents in the arena. The machine excelled in the kind of fast, brutal, short-ranged duel its loadout was tuned for, swarming a target with overlapping fire before a bout could turn into a long-range contest. Spectators came to recognize it as the faster, flashier half of the Stepsister pairing.</p>
history: |-
  <p>The two machines that became the Ugly Stepsisters began as scrap. Around 3138, technicians working for what would later be organized as Team Godmother cannibalized three very different donor 'Mechs, a Hunchback dating to the early 3050s, an early-production Legionnaire, and a Clan-built Pinion, and recombined their salvageable sections into a matched pair of fifty-ton hybrids. The result honored none of the original designs and instead followed the team's theatrical conceit, a Solaris dueling stable themed around the Cinderella story, with the two brawlers cast as the wicked stepsisters Anastasia and Drizella.</p><p>Team Godmother was a newcomer to the Solaris VII circuit, assembled and trained for the 3146 Royal Fantasy Tournament after several quieter years of preparation. The stable carried no permanent owner of record and was widely understood to be backed by the Federated Suns, fielding three contracted independent gladiators rather than a roster of house pilots. On a world where reputation is won in the arena rather than on the battlefield, the Stepsisters provided the team's heavy muscle, deliberately unlovely machines built to punish opponents who underestimated cobbled-together salvage.</p>
