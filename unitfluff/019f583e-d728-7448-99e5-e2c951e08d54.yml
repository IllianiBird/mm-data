chassis: "Daedalus"
model: "GTX2B 'Navvy'"
overview: |-
  <p>The Daedalus was a multi-role quad utility 'Mech designed by Mason Farquarson on Terra during the Star League era. A common sight across the Terran Hegemony, the sixty-ton IndustrialMech served in a wide variety of civilian and engineering roles. Widely regarded as one of the most versatile utility platforms of its era, the design earned a strong reputation among the SLDF Corps of Engineers for its reliability and adaptability.</p><p>Though no examples are known to have survived the upheavals that followed the fall of the Star League, the Daedalus left a lasting legacy as a workhorse of Hegemony-era construction and logistics.</p>
capabilities: |-
  <p>The Daedalus was built as a rugged, flexible, and stable utility 'Mech, its quad design providing exceptional balance across rough terrain. Powered by a GM 240 fusion engine, the sixty-ton chassis could maintain a top speed of sixty-five kilometers per hour, adequate for construction and cargo operations. Though not as easily reconfigurable as the military OmniMechs that would emerge decades later, the Daedalus could be readily adapted into a wide range of specialized loadouts. Two configurations dominated during the Star League-in-Exile: the Stevedore cargo hauler and the Navvy construction platform.</p><p>The Stevedore's pressurized and heated cargo pods could transport up to fifteen tons of goods, including delicate or live cargo, across the harshest environments, a vital capability in the deserts of Circe or the uplands of Dagda. The Navvy carried construction equipment including a rock cutter and backhoe, enabling teams of Daedaluses to swiftly clear terrain and assemble structures. The design mounted MF-Heavy Industrial armor, sufficient protection against workplace hazards but offering little defense against military weapons. The absence of communications and targeting systems reflected the Daedalus's purely civilian design philosophy.</p>
deployment: |-
  <p>The Navvy was the general-purpose construction configuration of the Daedalus platform. It reduced cargo capacity in favor of heavy work equipment, allowing it to operate across a wide range of construction and demolition tasks. Navvy crews developed a reputation for speed and efficiency, with experienced teams capable of preparing a prefabricated structure's foundation in a single work shift. The variant was a common sight in the growing cities of the Pentagon Worlds, where the demand for new construction far outstripped the available labor pool.</p>
history: |-
  <p>The Daedalus served throughout the Terran Hegemony during the Star League era, where Mason Farquarson produced the design at facilities on Terra. An additional production site operated on Gateway, expanding the supply chain for what had become one of the SLDF Corps of Engineers' most relied-upon utility platforms.</p><p>When General Kerensky led the SLDF into exile during Operation EXODUS in 2784, the Daedalus was among the critical support assets taken along. The design proved essential during the early settlement of the Pentagon Worlds, constructing the new cities and infrastructure that would house the exiled Star League. Novy Moscva on Eden, the capital established by Kerensky, was built in large part by Daedalus work crews.</p><p>The withdrawal of Nicholas Kerensky and his followers to Strana Mechty marked a turning point for the Daedalus. Military equipment was prioritized for the Second Exodus, and the settlements of the Kerensky Cluster were built by more traditional methods. The bulk of the Daedalus population remained on the Pentagon Worlds, where they became prizes for the various factions that arose during the Pentagon Civil War.</p><p>As order collapsed across the Pentagon, desperate factions armed whatever machinery they could find. The Daedalus was a particular favorite for militarization due to its adaptable chassis. Numerous armed variants appeared across the Pentagon Worlds, though the most notable was the configuration employed by the Levic Ascendancy on Eden following their seizure of Novy Moscva. These militarized Daedaluses proved dangerous in urban combat and against infantry, though they were no match for true BattleMechs in open engagements.</p><p>No examples of the Daedalus are known to have survived the Pentagon Civil War, Operation KLONDIKE, or the Succession Wars. However, the Clans preserved the design's blueprints, and the Scorpion Empire restarted production of the Daedalus in 3151 to support its industrial expansion efforts.</p>
