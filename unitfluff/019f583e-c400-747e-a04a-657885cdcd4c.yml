chassis: "Crab"
model: "CRB-27"
overview: |-
  <p>The Crab was introduced in 2719 as one of the final BattleMech designs produced for the Star League Defense Force before the Amaris Civil War brought an end to that golden age. Designed by Cosara Weaponries on Northwind, the fifty-ton medium 'Mech was built as a raider and guerrilla fighter capable of operating far behind enemy lines without resupply. The design philosophy emphasized reliability and ease of maintenance above all else, using proven off-the-shelf components wherever possible. This approach proved so successful that technicians coined the term "Crabwalk" to describe easy duty, as the Crab required less than half the maintenance time of comparable medium 'Mechs.</p><p>So popular was the design that many within the SLDF believed the Crab would become the standard medium BattleMech of the Star League's military forces. Unfortunately, fewer than one thousand units had been produced when the Succession Wars began, and large-scale production would not resume for centuries.</p>
capabilities: |-
  <p>The Crab's all-energy weapons loadout makes it ideally suited for extended operations without logistical support. Twin RAMTech 1200 large lasers mounted in the distinctive claw-like arm housings provide substantial firepower at medium and long ranges, while a Ceres Arms medium laser beneath the cockpit and an Exostar small laser in a head-mounted turret round out the armament. The weapons are deliberately simple and rugged, though the large lasers' focusing mirrors can be knocked out of alignment during physical combat, requiring field adjustments from within the arm assembly.</p><p>The original CRB-27 mounted the sophisticated Dalban Series K communications system with an integrated 650 RND targeting-tracking system. This advanced electronics suite could monitor all radio and short-wave bands to determine the 'Mech's exact location and track friendly and enemy units without satellite support, even predicting enemy movements. However, the system proved fragile and difficult to maintain, and most surviving Crabs eventually had these systems replaced with more robust Garret components. Nine tons of ferro-fibrous armor provides solid protection for a machine of its weight class, with even the weakest armor locations capable of surviving a PPC strike.</p>
deployment: |-
  <p>The original CRB-27 represents the Crab as Cosara Weaponries intended it, a sophisticated raider mounting advanced Star League technology. The combination of Paulina ferro-fibrous armor and the Dalban Series K communications suite made it an exceptional reconnaissance and deep-strike platform. Though production ceased with the Northwind factory's destruction in 2786, ComStar preserved stockpiles of original CRB-27s for centuries. The variant returned to production in the 3050s following the recovery of lostech, and today serves primarily with elite units capable of maintaining its demanding electronics.</p>
history: |-
  <p>The Crab's history is one of promise cut short by the fall of the Star League. Cosara Weaponries' factory on Northwind was among the strategic targets destroyed in the opening salvos of the First Succession War in 2786. Though dedicated technicians managed to keep portions of the assembly line operational as a refit and repair facility, the advanced technology required for the original's ferro-fibrous armor and Dalban electronics was soon lost. The surviving machines were gradually downgraded to CRB-20 specifications, trading their advanced systems for readily available components.</p><p>By the end of the Fourth Succession War, approximately one hundred Crabs remained active in the Inner Sphere, all of them CRB-20 models. Unknown to the Great Houses, ComStar had secreted away stockpiles of original CRB-27 Crabs along with other Star League relics. When the organization formed the Com Guards, these pristine machines equipped their forces while downgraded CRB-20s were gifted to the Draconis Combine during the War of 3039 as part of Operation Rosebud.</p><p>The discovery of the Helm Memory Core in 3028 eventually enabled the refit line on Northwind to begin upgrading surviving Crabs back to their original specifications. Cosara Weaponries resumed full production of the CRB-27 in the 3050s, and new variants incorporating C3 technology soon followed. The Word of Blake's capture of the Northwind factory during the Jihad led to the development of the radical CRB-45 variant, though the facility was eventually liberated. Today, Crabs serve with numerous factions across the Inner Sphere, from the Com Guards and their Word of Blake successors to the Draconis Combine and various mercenary commands.</p>
