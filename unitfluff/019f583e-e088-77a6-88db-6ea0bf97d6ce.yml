chassis: "Watchman"
model: "WTC-4MB 'Belle'"
overview: |-
  <p>The Watchman is a forty-ton BattleMech born from the political and military pressures of the Clan Invasion era. When First Prince Hanse Davion stripped frontline units from the Draconis March to face the advancing Clans, Duke Aaron Sandoval demanded recompense for leaving his border vulnerable. The compromise was a new militia 'Mech based on the proven Enforcer chassis, designed for rapid and inexpensive production at Robinson Standard BattleWorks. Entering service in 3055, the Watchman was built with readily available off-the-shelf components to ensure ease of repair and maintenance by militia technicians, establishing itself as a durable and reliable garrison design suited to training and border defense roles throughout the Federated Suns.</p>
capabilities: |-
  <p>The Watchman shares the Dorwinion Standard chassis and Nissan 200 engine of the original Enforcer, giving the lighter forty-ton design a brisk top speed of 86 km/h. Five HildCo Model 12 jump jets provide a 150-meter jump capability, making the Watchman surprisingly agile for a garrison design. Eight and a half tons of Starshield A armor with CASE provide respectable protection, while the simplified cockpit layout was specifically designed to accommodate less experienced MechWarriors, making the Watchman an excellent training platform.</p><p>The Watchman's armament trades the Enforcer's autocannon for a more maintenance-friendly weapons suite. A ChisComp 43 Special large laser serves as the primary weapon, providing good medium-to-long range striking power without the ammunition dependency of ballistic weapons. Two ChisComp 39 medium lasers handle close-range defense, while a pair of Sperry Browning machine guns deter infantry attacks. This all-energy primary armament with minimal ammunition requirements reflects the design's garrison role, where sustained operation without reliable supply lines is a constant concern. The trade-off is a lack of concentrated striking power compared to heavier designs, requiring Watchman pilots to rely on mobility and coordinated fire to engage serious threats.</p>
deployment: |-
  <p>Debuting in 3144 at the New Hartford Gardens arena on Solaris VII, this custom variant is an experiment in bringing master-and-drone technology to BattleMech dueling. Backed by the Duchy of Andurien, the design features a modified command console that allows a copilot to control a heavyweight drone, a modified Vulpes refit. The armament is completely reworked around a large re-engineered laser supported by four ER medium lasers, a combination that taxes the twelve double heat sinks but provides substantial striking power against opponents in the same weight class. A 200-rated light engine saves mass at the cost of survivability, while seven tons of ferro-fibrous armor provides adequate protection. The real advantage lies in the Clan-spec Watchdog composite electronic warfare system, which combines active probe and ECM capabilities to disrupt adversary sensors while maintaining reliable control links to the accompanying drone even through hostile electronic interference.</p>
history: |-
  <p>The Watchman's creation was driven by the intersection of Clan Invasion-era strategic realities and Draconis March politics. When the bulk of the AFFS redeployed to face the Clans, Duke Aaron Sandoval of Robinson leveraged his political influence to secure funding for a new militia 'Mech. Hanse Davion agreed to share financing for the project, and Robinson Standard BattleWorks (previously a minor equipment supplier) was expanded and upgraded to full BattleMech manufacture. The Watchman was designed to maximize parts commonality with the existing Enforcer, using the same chassis, engine, and similar armor to minimize production costs and ensure ready access to spare parts.</p><p>The Watchman proved itself during the fighting on Proserpina between 3062 and 3063, where Robinson Battle Academy cadets and militia formations equipped with the design demonstrated its effectiveness in real combat. Demand for the Watchman increased significantly during the FedCom Civil War, as border militias found themselves bearing increased responsibility for regional defense. Duke Sandoval used allocation of Watchman production as a political tool, distributing the 'Mechs to reward political allies and consolidate his influence within the Draconis March.</p><p>The Watchman's legacy extends beyond its own production run, serving as the foundation for the Sentry and Cuirass designs that followed. Robinson Standard BattleWorks built on the success of the Watchman to establish itself as a significant manufacturer within the Federated Suns, eventually producing far more advanced designs including the Atlas III. The WTC-4DM upgrade, developed after James Sandoval's incursion into the Draconis Combine, brought the Watchman closer to frontline capability with a PPC, double heat sinks, and ferro-fibrous armor, reflecting the evolving demands placed on what was originally conceived as a simple garrison design.</p><p>The Jihad and its aftermath saw Robinson Standard BattleWorks struggle under contested ownership, with the factory falling under provisional Federated Suns control during the conflict before stabilizing in the early Republic era. Watchman production had already ceased by that point, but the design remained in widespread militia service across the Draconis March. The Draconis Combine's invasion of the region in the mid-thirty-second century thrust the aging Watchman back into the spotlight, as garrison units equipped with the venerable design found themselves facing modern Combine forces employing advanced armor composites. Militia technicians responded with the WTC-4DM2 field refit, stripping the original weapons suite entirely and replacing it with a large re-engineered laser and supporting arms specifically chosen to defeat the Combine's specialty plating. The Watchman also found an unexpected second life on the Solaris VII dueling circuit, where its rugged chassis and easy maintenance proved attractive to smaller stables seeking a reliable platform for aftermarket modification.</p>
