chassis: "Liberator"
model: "LIB-4T"
overview: |-
  <p>The Liberator is a forty-ton medium BattleMech designed by Kali Yama Weapons Industries on Kalidasa for the Free Worlds League. Conceived in 3018 as a medium trooper intended to outperform the Hermes II, the Liberator promised heavier firepower at comparable speed and represented the League's first attempt at an entirely new BattleMech design in centuries. The project ended in disaster when a catastrophic flaw in its production model rendered the design nonfunctional, and the Liberator never entered serial production. Only a handful of hand-built prototypes were ever completed, leaving the design as a cautionary tale of ambition outpacing engineering capability.</p>
capabilities: |-
  <p>The Liberator was built around a standard 240-rated fusion engine, giving the forty-ton design a top speed of ninety-seven kilometers per hour, closely matching the Hermes II it was intended to replace. Six and a half tons of standard armor provided reasonable protection for a medium 'Mech, only one ton less than the Hermes II, a deliberate trade to accommodate a significantly heavier weapons loadout.</p><p>The primary armament centered on a pair of LRM-5 launchers, one mounted in each arm, providing sustained long-range fire support. A Magna large laser in the center torso served as the design's backbone weapon, delivering reliable damage without ammunition dependency. An SRM-2 rack in the left torso rounded out the loadout with close-range punch. A single ton each of LRM and SRM ammunition gave the design adequate field endurance, and the engineers calculated that alternating volleys between the missile systems and laser would easily manage heat output.</p><p>On paper, this weapons philosophy was sound. The combination of reach, sustained fire, and close-range backup represented a genuine improvement over the Hermes II's autocannon-centric approach. However, the Liberator suffered from a severe flaw in its revolutionary torso construction. The hand-built prototypes functioned adequately, but the transition to mass-production methods caused the ten heat sinks to become effectively nonfunctional, transforming manageable heat levels into a catastrophic vulnerability. This single defect negated every advantage the weapons suite offered, as any sustained engagement would drive cockpit temperatures to dangerous levels within seconds.</p>
deployment: |-
  <p>This variant is the sole configuration of the Liberator, and it never progressed beyond the prototype stage. Kali Yama Weapons Industries built only a small number of hand-assembled prototypes, which functioned adequately due to manufacturing techniques that differed from the planned production process. When the transition to mass-production methods revealed the fatal cooling system flaw, the entire program collapsed. The three surviving prototypes lingered in storage for nearly fifty years after the program's cancellation, none seeing meaningful service.</p>
history: |-
  <p>The Liberator program was born from the Free Worlds League's anxiety over its technological stagnation during the waning years of the Third Succession War. By the late 3010s, SAFE intelligence had confirmed that multiple rival states were developing entirely new BattleMech designs, a capability the League had not demonstrated in centuries. Captain-General Janos Marik, eager to prove the Free Worlds League could compete, turned to Kali Yama Weapons Industries rather than the more established Irian Technologies. The decision was driven partly by industrial rivalry; Kali Yama saw the contract as an opportunity to surpass their competitors at IrTech, whose Hermes II had earned a mediocre reputation among Free Worlds League Military commanders.</p><p>Kali Yama's engineers pursued an ambitious design philosophy, developing a revolutionary new torso construction intended to reduce manufacturing costs and simplify maintenance. The hand-built prototypes performed well in initial testing, outgunning the Hermes II while maintaining comparable speed. However, the production models assembled using standard manufacturing techniques revealed a critical flaw: the innovative torso design caused a complete failure in the cooling system. Some test pilots reported alarming heat spikes even before weapons were fitted, though Kali Yama technicians dismissed these concerns as typical MechWarrior discomfort with an unfamiliar cockpit layout.</p><p>Rather than disclose the defect and risk losing the multibillion-Eagle contract with the LCCC, Kali Yama attempted to conceal the problem while scrambling for a fix. They carefully choreographed the 3018 public unveiling to minimize heat buildup, planning a demonstration routine with ample cooling intervals. The deception unraveled spectacularly when Captain-General Janos Marik, unaware of the issue, requested that the Liberator destroy an abandoned Augustus tank after the formal presentation. The resulting weapons fire generated crippling heat within seconds, detonating the ammunition stores and sending the ejected pilot rocketing toward the assembled spectators.</p><p>The fallout was immediate and devastating. All contracts were canceled, marketing efforts ceased, and Kali Yama's reputation suffered lasting damage. Further investigation revealed that the chassis flaws were so fundamental that the entire design would need to be rebuilt from scratch. The three surviving prototypes were effectively abandoned, languishing in storage for nearly half a century with no prospect of resurrection. In a final irony, the last surviving Liberator was destroyed during a live-fire exercise by the Moltke, a descendant of the Augustus tank that had served as the catalyst for the design's public humiliation.</p>
