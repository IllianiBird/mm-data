chassis: "Tai-sho"
model: "TSH-7S"
overview: |-
  <p>The Tai-sho was introduced in 3061 by Independence Weaponry as a dedicated command 'Mech for the Draconis Combine Mustered Soldiery. Named for the DCMS rank equivalent to a general, the eighty-five ton assault 'Mech was designed to serve as the centerpiece of a C3-equipped company, coordinating targeting data across an entire formation. Independence Weaponry produced a heavily armored platform that could anchor a C3 network while still delivering formidable direct firepower, filling a critical command role the DCMS had lacked since adopting the technology.</p>
capabilities: |-
  <p>The Tai-sho was intended as the command hub of a twelve-unit C³-equipped company. By carrying two C³ master computers, the design links two full lances together, sharing real-time targeting data that dramatically improves the accuracy of every connected unit. This coordination capability comes at a significant tonnage cost, but Independence Weaponry compensated by building the Tai-sho around a standard Strand 255 fusion engine rather than an extra-light model, extending the 'Mech's survivability on the battlefield and reducing production costs.</p><p>Twin Lord's Light 2 extended-range particle projector cannons serve as the primary armament, capable of engaging targets at extreme range and leveraging C³ targeting data from forward spotters. An Imperator Automatic Ultra-class autocannon, sourced from the Free Worlds League, provides additional firepower with its ability to fire at twice the normal rate. Fifteen tons of Durallex ferro-fibrous armor and CASE protection in the right torso give the Tai-sho excellent survivability for an assault 'Mech of its weight class.</p><p>The primary weakness of the design is its limited speed, with a maximum of only fifty-four kilometers per hour and no jump capability. The Tai-sho depends entirely on its networked lancemates for close-range protection and must rely on its heavy armor when caught at short distances.</p>
deployment: |-
  <p>The first production run of this variant was assigned to the First Genyosha following their return from operations against the remnants of Clan Smoke Jaguar in the Deep Periphery. As the regiment with the most experience operating C³-equipped units in the DCMS, the Genyosha provided invaluable feedback on the design's performance as a command platform. Subsequent production batches were distributed to other frontline DCMS regiments as Independence Weaponry expanded output from the Quentin facility.</p>
history: |-
  <p>The Tai-sho's development was driven by the Draconis Combine's troubled relationship with C³ technology. For a decade following the system's introduction, the DCMS struggled to integrate C³ into its doctrine. Combine MechWarriors, steeped in the samurai tradition of individual combat, were resistant to the cooperative targeting philosophy that C³ demanded. Many warriors viewed the system's encouragement of concentrated fire on single targets as dishonorable, directly contradicting the valued tradition of single combat.</p><p>The turning point came during Operation Bulldog in 3059, when C³-equipped formations proved devastatingly effective against the Smoke Jaguars. The decisive engagement occurred on Kiamba, where a C³-equipped company from the elite First Genyosha, led by the heir to the Combine throne, destroyed a Smoke Jaguar Assault Cluster's Command Trinary in Hecate's Swamp. This spectacular success finally overcame the cultural resistance to C³ technology within the DCMS.</p><p>Independence Weaponry capitalized on this shift in doctrine, designing the Tai-sho and the Shugenja simultaneously, both incorporating C³ master systems. Production began on Quentin in 3061, with initial units assigned to the First Genyosha and subsequent production distributed to other DCMS regiments.</p><p>The Jihad brought significant disruption when Quentin fell to the Word of Blake. The DCMS pressured Independence Weaponry to maintain production, but the company's New Samarkand facility could not accommodate assault 'Mech assembly. Instead, Independence broadened its existing shared-technology agreement with Blankenburg Technologies, establishing a new production line on Soul. With C³ master computer supplies becoming unreliable, Independence also developed the TSH-8S variant, a frontline combatant that traded the command-oriented dual C³ masters for a simpler C³ slave configuration. By 3079, the Soul facility had expanded to produce both variants, ensuring continued supply to the DCMS through the post-Jihad reconstruction period and into the Dark Age.</p>
