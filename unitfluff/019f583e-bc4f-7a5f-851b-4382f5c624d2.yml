chassis: "Field Gun Platoon (FWLM)"
model: "(Motorized AC10 3035+)"
overview: |-
  <p>Conventional infantry within the FWLM serve as the backbone of provincial defense across a patchwork of semi-autonomous states, each maintaining its own military traditions and equipment preferences. Towing crew-served autocannon/10 field guns, these platoons bring heavy direct fire to bear against vehicles, fortifications, and even BattleMech armor at medium range. The AC/10's punch makes it one of the most respected crew-served weapons on any battlefield.</p>
