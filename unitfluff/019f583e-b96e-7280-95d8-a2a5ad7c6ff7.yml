model: "(Tracked LBX2)"
overview: |-
  <p>Com Guard conventional infantry benefit from ComStar's access to preserved Star League technology, fielding weapons and equipment that match or exceed the standard issue of any Inner Sphere military, backed by the institutional discipline of the secular Order's professional military culture. Operating light cluster-munition autocannon that fire shotgun-pattern rounds for anti-infantry and anti-aircraft work, these crews provide flexible fire support effective against dispersed or fast-moving targets.</p>
