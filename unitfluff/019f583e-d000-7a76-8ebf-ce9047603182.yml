chassis: "Raptor II"
model: "RPT-2X1"
overview: |-
  <p>The Raptor II is synonymous with the Void Signature System, a revolutionary stealth technology that renders the 'Mech effectively invisible to both electronic sensors and visual detection. Developed by the Word of Blake using research recovered from ComStar's Terra archives after Operation Odysseus in 3058, the forty-ton design married mimetic armor composites, chameleon-scale light polarization, and emission baffling into a single integrated package powered by an onboard ECM suite. First fielded as early as 3067, the Raptor II served as a premier infiltration and search-and-destroy platform throughout the Jihad.</p><p>Following the liberation of Terra, the Republic of the Sphere recovered the design specifications and restarted production at a classified facility, assigning all Raptor IIs exclusively to its most elite special forces units. The extreme secrecy surrounding the design, from classified manufacturers to the deliberate omission of ejection systems, reinforces the lengths taken to prevent the Void Signature technology from falling into foreign hands.</p>
capabilities: |-
  <p>The Raptor II is built on a Void Integrated endo steel chassis powered by a VOX 280 XL engine, achieving a base speed of 118 kilometers per hour with MASC providing burst speeds up to 151 kilometers per hour in the standard RPT-3X configuration. Seven and a half tons of specially shaped Void Integrated light ferro-fibrous armor bonded with mimetic composites provides moderate protection while maintaining the sensor-deflecting properties essential to the Void Signature System's operation. A Guardian ECM suite is integral to every production model, as it is required for VoidSig to function.</p><p>The RPT-3X mounts two Streak SRM-6 launchers and two ER medium lasers, providing efficient and accurate firepower for an infiltrator. The Streak systems ensure no wasted ammunition, while the extended-range lasers allow engagement at distances where the Raptor II's stealth makes return fire extremely difficult. A small cockpit and the deliberate omission of both CASE and an ejection system reflect the Republic's uncompromising approach to operational security: pilots are expected to escape or die, with capture considered unacceptable.</p><p>At a standstill, the Raptor II is virtually undetectable, capable of lurking at optimum engagement range before striking with lethal precision and vanishing before effective countermeasures can be mounted. This combination of stealth, speed, and focused firepower makes the Raptor II one of the most feared light-to-medium combatants on the modern battlefield.</p>
deployment: |-
  <p>The second Blakist variant trades the taser for a more conventional but potent weapons array, mounting an ER large laser, ER medium laser, ER small laser, and a Streak SRM-6 launcher. Its most notable feature is a prototype Bloodhound active probe, one of the few systems rumored to be capable of penetrating VoidSig cloaking. This ironic inclusion suggests the Blakists were already developing countermeasures against their own stealth technology, possibly in anticipation of captured Raptor IIs being turned against them.</p>
history: |-
  <p>The origins of the Raptor II trace to the Word of Blake's seizure of Terra from ComStar during Operation Odysseus in 3058. Among the vast technological archives recovered were records of Star League-era stealth systems, including the Null Signature System and Chameleon Light Polarization Shield, technologies that had been largely forgotten or abandoned even by the Clans, who considered such systems dishonorable. The Blakists recognized the potential in these technologies and initiated a decade-long development program that culminated in 3070 with the Void Signature System, a synthesis that combined the fidelity of mimetic armor, the scale of chameleon technology, and the emission baffling of the Null Signature System.</p><p>Reports of invisible 'Mechs stalking the battlefields of the Inner Sphere began circulating as early as 3067, though most were dismissed as fantasy or propaganda. The RPT-2X and RPT-2X1 are considered to have been formally introduced by 3073, produced at a classified Blakist facility on Terra. These early models proved devastatingly effective during the Jihad, with Blakist Raptor IIs conducting raids and infiltration operations that left defenders unable to identify, let alone engage, their attackers. Multiple facilities were targeted by Raptor IIs during the conflict, with the surprise and destruction wrought by invisible attackers spreading fear far beyond the immediate tactical impact.</p><p>The Coalition's liberation of Terra saw the destruction of the Blakist production facility, but the development laboratory and design specifications survived intact. The Republic of the Sphere, under Devlin Stone's leadership, quickly recognized the strategic significance of VoidSig technology and prioritized the acquisition of all salvaged Raptor IIs. A standing order directed Republic Armed Forces officers to destroy any intact Raptor IIs found in the field rather than risk them falling into foreign hands. By 3084, the Republic had restarted production with the redesigned RPT-3X at a classified facility, with all units assigned exclusively to elite special forces.</p><p>Despite the Republic's efforts at containment, evidence emerged during the thirty-second century that some Raptor IIs had slipped beyond their control. Examples appeared among foreign powers and independent mercenary commands, with some reportedly serving as family 'Mechs passed down since the Jihad era. Units with functional Void Signature Systems remain high-priority targets for Republic intelligence services, reflecting the ongoing sensitivity surrounding this technology.</p>
