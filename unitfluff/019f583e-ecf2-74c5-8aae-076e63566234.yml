chassis: "Impavido Destroyer"
model: "(3058)"
overview: |-
  <p>The Impavido-class destroyer was a collaborative WarShip design produced through an unprecedented partnership between the Free Worlds League, the Capellan Confederation, and the Word of Blake. Built primarily at the Technicron Manufacturing yards above Tamarind with additional construction at the Brigadier Corporation facility on MacKenzie, the Impavido marked the first new WarShip produced by the Free Worlds League in over two centuries. The design was developed specifically to counter the Federated Commonwealth's Fox-class corvette rather than as a response to the Clan threat, reflecting the inward-facing strategic priorities of the League and Confederation alliance. The tri-faction nature of the program, combining League shipbuilding infrastructure with Capellan industrial components and Blakist technical expertise, made the Impavido one of the most ambitious cooperative military ventures of the post-Succession Wars naval rearmament period.</p>
capabilities: |-
  <p>Displacing 490,000 tons, the Impavido was a fast and agile destroyer capable of sustained high-speed operations. Its advanced maneuvering drive delivered a safe acceleration of five thrust points with a maximum of eight, enabling the vessel to outmaneuver most transport craft and match the pace of lighter corvettes. A lithium-fusion battery supplemented the standard Kearny-Fuchida drive, providing the ability to make consecutive jumps without recharging. The hull carried 479.5 tons of improved ferro-aluminum armor, providing solid protection for sustained engagements.</p><p>The weapons suite centered on naval autocannons, with NAC/20 batteries forming the primary capital armament supported by NAC/10 guns across all firing arcs. Eight NL45 naval lasers and three Light Naval PPCs added energy-based capital firepower. Anti-fighter defense was comprehensive, combining Gauss rifles and ER Large Lasers with sixteen LRM-20 launchers slaved to Artemis IV fire control systems and four anti-missile systems for point defense. The vessel carried eighteen aerospace fighters and two docking collars for DropShip escort, while over 25,000 tons of cargo space supported extended autonomous operations. Two marine platoons provided boarding and security capability.</p>
deployment: |-
  <p>The FWLS Impavido served as the lead vessel and was stationed above Atreus by 3059 under the politically appointed Commodore Ian Deakin. At the Battle of Atreus on 25 October 3068, the vessel defected to Word of Blake forces alongside several other suborned League WarShips, turning against the loyalist fleet in a devastating betrayal. The Impavido was ultimately destroyed in 3078 at Gibson by a Principality of Regulus task force. The FWLS Janos Marik fought on the loyalist side at Atreus and was presumed lost in the battle, while the FWLS Phrygia was destroyed in 3077 at Atreus by Word of Blake forces. The CCS Zhejiang was ambushed in deep space by The Medusans mercenary unit while en route to New Syrtis in 3069, sustaining crippling damage that contributed to its loss during the subsequent Capellan retreat. The CCS Anhui defended Sian in 3068 before being destroyed over Necromo in 3071 alongside the Feng Huang-class Sundermann Rhys fighting the 48th Shadow Division. The CCS Xizang was the sole survivor, defending Sian twice during the Jihad and undergoing emergency repairs at Capella before disappearing from service rolls by 3145.</p>
history: |-
  <p>The Impavido program emerged from the Free Worlds League's determination to rebuild its naval capabilities following centuries without WarShip production. The League partnered with the Capellan Confederation, which supplied interplanetary drive components from its Necromo facilities, while the Word of Blake provided critical technical expertise that accelerated development timelines beyond what either nation could have achieved independently. Technicron Manufacturing at the Tamarind Yards served as the primary construction facility, with additional keels laid down at the Brigadier Corporation yards on MacKenzie.</p><p>The prototype launched in 3057, a full year ahead of schedule, becoming the first new Free Worlds League WarShip in over two hundred years. Six vessels were ultimately completed and divided equally between the League and the Confederation. The three Free Worlds League vessels were stationed at strategic worlds across League space under politically appointed commanders, while the three Capellan vessels were named after important duchies within the Confederation and entered service by August 3063. The program stood as a significant achievement in interstellar cooperation, though the clandestine nature of the Word of Blake's involvement foreshadowed the treachery to come.</p><p>The Jihad proved catastrophic for the Impavido class. The Word of Blake's subversion of League naval personnel turned the very vessels the organization had helped build against their nominal owners, while Capellan vessels were ground down in desperate defensive actions and ambushes across multiple star systems. Five of the six vessels were destroyed between 3068 and 3078, consumed by engagements that ranged from fleet-scale betrayals to isolated actions against Blakist shadow divisions. Only a single Capellan vessel survived the conflict, emerging battered and entirely dependent on emergency maintenance facilities at Capella. That vessel had disappeared from Capellan naval rolls by 3145, ending the operational history of a class that had been consumed by the very conflict its secret patron had ignited.</p>
