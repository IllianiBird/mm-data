chassis: "Arctic Wolf II"
model: "C"
overview: |-
  <p>The Arctic Wolf II is a medium Clan OmniMech produced by Clan Wolf-in-Exile at WC Site 1 on Arc-Royal, first deployed in 3085. Developed as a complete redesign of the original Arctic Wolf OmniMech, the project began in 3082 after the earlier variant's persistent performance problems led to its discontinuation. Rather than attempting incremental improvements, the engineering team rebuilt the design from the ground up, restoring the original BattleMech's speed to recover the ground performance that front-line warriors had demanded.</p><p>The resulting chassis bears a distinctly different silhouette reminiscent of the Mad Cat, a consequence of the extensive structural changes required to accommodate the larger engine alongside fixed jump jets and fourteen tons of pod space. Improved armor protection over both predecessors rounds out a design that successfully bridges the speed of the original BattleMech with the flexibility demanded of a modern OmniMech.</p>
capabilities: |-
  <p>The Arctic Wolf II addresses the fundamental criticisms leveled against its predecessor through a philosophy of balanced compromise. The restored Light Force 280 XL engine delivers a maximum ground speed of 118 kilometers per hour, effectively matching the original BattleMech's performance, while seven fixed jump jets provide a 210-meter jumping capability that dramatically expands tactical options. The AR1 endo steel chassis supports fourteen tons of pod space, somewhat less than either predecessor, but the design's superior mobility allows it to bring its payload to bear with greater efficiency.</p><p>The Royal-7a ferro-fibrous armor provides the best protection of any Arctic Wolf variant, though at six and a half tons it remains relatively light for a forty-ton chassis, making sustained close-range engagements inadvisable. In its Primary Configuration, the Arctic Wolf II demonstrates a notable departure from the original's close-range missile doctrine, mounting a pair of LRM-15 launchers for long-range fire support backed by ER medium lasers and a small pulse laser. Eleven double heat sinks manage the thermal load adequately for sustained fire at range, though pilots must exercise discipline during intense engagements.</p>
deployment: |-
  <p>Alternate Configuration C breaks new ground for the Arctic Wolf lineage as a dedicated fast harasser. Twin arm-mounted ER large lasers deliver punishing long-range firepower, supported by a pair of torso-mounted SRM-4 launchers with two tons of ammunition for close-range engagements. Twelve double heat sinks partially offset the significant heat generation of the extended-range lasers, though sustained fire will inevitably cause overheating. The configuration proves particularly effective against light and fast vehicles that have become increasingly common across the modern battlefield.</p>
history: |-
  <p>The development of the Arctic Wolf II began in 3082 when WC Site 1 initiated a project to finally correct the failings that had plagued the original Arctic Wolf OmniMech since its introduction fifteen years earlier. The engineering team's decision to start with a clean-sheet redesign rather than attempt further modifications to the existing chassis proved decisive, resulting in a design that successfully married the speed of the original BattleMech with the flexibility demanded of a modern OmniMech.</p><p>The first production Arctic Wolf II units walked off the Arc-Royal assembly lines in 3085, entering service exclusively with the Exiles' Alpha Galaxy during the design's initial deployment phase. The limited distribution reflected both the cautious approach of the Wolf leadership, wary of repeating the earlier Omni's troubled reception, and the practical constraints of a single production facility ramping up a new chassis.</p><p>Despite the restricted deployment, the Arctic Wolf II quickly attracted attention beyond the Exiles' own forces. The Immortal War franchise, one of the most popular war game simulation systems operating across the Inner Sphere, licensed the Arctic Wolf II for inclusion in its near-military-grade simulators. An affiliate on Terra began offering the design to civilian players, a development that Clan Wolf-in-Exile observers noted with interest, given the franchise's track record for selecting commercially successful BattleMech designs.</p><p>The most notable early deployment outside the Exiles' touman involved a single Arctic Wolf II gifted to the rebuilding Kell Hounds mercenary unit. Designated 'Allard's Revenge' and painted in Hound colors, the 'Mech served as a visible symbol of the enduring alliance between the Exiles and their Inner Sphere partners, a relationship that had been instrumental to the Arctic Wolf program from its very inception when Kell Hound materials first enabled the original BattleMech's production decades earlier.</p>
