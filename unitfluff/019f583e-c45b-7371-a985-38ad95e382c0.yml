chassis: "Enforcer III"
model: "ENF-6G"
overview: |-
  <p>The Enforcer III was born from First Prince Victor Steiner-Davion's "Redesign for Davion Pride" initiative, commissioned in the aftermath of the Lyran Alliance's secession from the Federated Commonwealth. Debuting in 3059, the design sought to modernize the iconic Enforcer while simultaneously reinforcing Davion national identity during a period of political turmoil. Built by Achernar BattleMechs on New Avalon and Kallon Weapon Industries on Talon, the Enforcer III successfully brought the venerable chassis into the modern era with an endo steel frame, XL engine, and upgraded weaponry. The similarities to its predecessor ensured the Enforcer III became a direct replacement for destroyed Enforcers in many frontline formations.</p>
capabilities: |-
  <p>The Enforcer III is built on a Dorwinion Standard-Alpha endo steel chassis powered by a Magna 250 XL engine, giving the fifty-ton design a top speed of 86 km/h. Five McCloud Specials jump jets provide a 150-meter jump capability, making the Enforcer III significantly more mobile than its predecessor. Ten tons of StarGuard CIV standard armor provide solid protection for a medium 'Mech, though the reliance on an XL engine means that torso breaches carry catastrophic risk.</p><p>The primary weapon is a Mydron Excel Ultra AC/10, capable of delivering twice the firepower of a standard autocannon at its maximum firing rate, sustained for over ninety seconds of continuous combat. A BlazeFire Sweetshot ER large laser provides energy-based firepower that complements the autocannon's ballistic punch, while a ChisComp 2000 ER small laser rounds out the weapons suite. This balanced combination of ballistic and energy weapons makes the Enforcer III a formidable trooper 'Mech, and the controversy among veteran pilots over switching from the LB-X cluster ammunition of the ENF-5D to the Ultra's concentrated damage pattern proved short-lived as newer MechWarriors readily adapted to the weapon system.</p>
deployment: |-
  <p>Proposed simultaneously with the ENF-6T, this variant did not enter production until targeting computer shortages during the FedCom Civil War forced a redesign. The space originally allocated for a targeting computer is instead devoted to an expanded laser battery: an ER small laser is retained while two ER medium lasers and a single medium pulse laser are added, creating a formidable close-range energy weapons array. This configuration sacrifices the precision of the targeting computer for raw volume of fire, making this variant particularly effective against fast-moving targets in close engagements.</p>
history: |-
  <p>The Enforcer III emerged from one of the most politically charged military procurement programs in Federated Suns history. When Victor Steiner-Davion ordered the redesign of the Enforcer as part of his "Redesign for Davion Pride" initiative, the goal was as much about rebuilding national morale as improving combat capability. Independence Weaponries reverse-engineered the Clan Ultra AC/10 specifically for the new design, and Achernar BattleMechs rolled out the first ENF-6M units in 3059. The new 'Mechs were rapidly deployed along Federated Commonwealth borders with heavy publicity, including recruitment posters declaring "Upgraded for more enforcement." The pairing of Enforcer IIIs with JagerMech IIIs became a standard combined-arms doctrine.</p><p>The Enforcer III quickly spawned several variants to meet diverse tactical requirements. The ENF-6T, originally a field refit replacing the autocannon with a Gauss rifle and targeting computer, proved successful enough to enter factory production. When targeting computer shortages emerged during the FedCom Civil War, the ENF-6G variant was developed to fill the gap by devoting that space to additional laser weaponry. The conflict also produced the ENF-6Ma field refit, which replaced the Ultra AC/10 with a standard AC/10 compatible with precision ammunition, a practical modification that persisted well beyond the war.</p><p>The Jihad devastated the Enforcer III's production base. Kallon's Talon facility was destroyed in 3069, leaving Achernar's New Avalon plant as the sole manufacturer. During the Word of Blake's assault on New Avalon, the MUSE COMPACT project attempted to return battlefield salvage to action using Clan-sourced components, producing the experimental ENF-7X with binary laser cannons. The NAIS simultaneously developed the ENF-6NAIS with advanced weapons systems including a snub-nose PPC and large variable speed pulse laser. After the Jihad, Achernar restored only four of its eight production lines, with the Enforcer III among the designs that resumed limited manufacture.</p><p>In the post-Jihad era, the Enforcer III continued to evolve. The ENF-7C3BS introduced experimental C3 boosted slave technology in 3075, enhancing networked combat capability. The Victoria War of the early thirty-second century inspired the ENF-7D, which incorporated a torso-mounted cockpit after analysis showed that humanoid head designs were disproportionately vulnerable to headhunting tactics. This variant was disseminated to Davion cavalry commanders and Republic of the Sphere Armed Forces units, with the Battle of Quemoy validating the torso cockpit concept in combat. During the Dark Age, the ENF-6R variant entered service with a rotary AC/5 and ER PPC, continuing the Enforcer III's tradition of adapting to emerging battlefield requirements.</p>
