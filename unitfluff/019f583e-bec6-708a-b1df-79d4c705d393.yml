chassis: "Mechanized Tracked Century (MHAF)"
model: "(Flamer 3049)"
overview: |-
  <p>The Marian military tradition places infantry at the foundation of its legionary system, with conventional soldiers organized into units bearing Latin designations that reflect the Hegemony's deliberate cultivation of Roman imperial identity. A centuria, or century, is the Marian equivalent of a company-sized formation. Mechanized tracked centuries ride armored personnel carriers that trade speed for all-terrain capability, providing reliable transport across the rough ground common to many Hegemony garrison worlds. Support troops carry man-portable flamers that project streams of burning chemicals, providing devastating area-effect capability against infantry and structures at the cost of short range and the vulnerability of the operator's fuel tank.</p>
