chassis: "Supernova"
overview: |-
  <p>The Supernova is a ninety-ton Clan assault BattleMech first produced in 2846, designed by Clan Nova Cat as an ammunition-independent alternative to the Star League-era King Crab. Faced with chronic autocannon ammunition shortages, Nova Cat engineers replaced the King Crab's signature weapon loadout with clusters of extended-range large lasers. Initial attempts to adapt the King Crab's own chassis met with limited success due to the design's integral ferro-fibrous armor, but the project yielded a lighter, purpose-built frame optimized for an all-energy armament. Though many observers assumed the Supernova was developed after the smaller Black Hawk OmniMech due to superficial design similarities, evidence indicates the Supernova actually predates its more famous cousin.</p><p>Produced primarily at Nova Cat facilities on Barcella and Brim during its early history, the design served as a mainstay of the Clan's garrison forces for centuries before production expanded to the Inner Sphere following the Nova Cats' Abjuration.</p>
capabilities: |-
  <p>Slow but surprisingly agile for its mass, the Supernova relies on destroying its enemies at extended range before they can close to effective combat distance. Its primary armament of six Series 7NC extended-range large lasers gives it devastating firepower capable of crippling multiple opponents in rapid succession. Provided a MechWarrior maintains a clear line of sight, a single Supernova can threaten an entire Star of approaching 'Mechs before they enter their own effective weapons range.</p><p>However, this fearsome firepower comes with a critical weakness. The design's twenty-six double heat sinks are insufficient to dissipate the heat generated by a full salvo of all six lasers, allowing only approximately two-thirds of its weapons to fire simultaneously without risking an emergency shutdown. MechWarriors must carefully manage their firing discipline, rotating between laser clusters to maintain sustained combat effectiveness.</p><p>The Consolidated Fusion 270 Standard engine provides a modest top speed of 54 km/h, but three Northrup Super Heavy Starlifters A100s jump jets compensate with a 90-meter jump capability, granting the Supernova tactical mobility unusual for an assault 'Mech. Standard armor protection of 14.5 tons provides adequate shielding for its intended standoff engagement role, though the design remains vulnerable if caught at close quarters.</p>
deployment: |-
  <p>The base Supernova mounts six extended-range large lasers as its sole armament, a configuration that remained unchanged for over two centuries of service. This standardized loadout reflects the Nova Cat philosophy of logistical simplicity, as the design requires no ammunition supply chain whatsoever. While the heat management limitations of the base configuration are well-documented, experienced MechWarriors have learned to exploit the design's fearsome alpha-strike capability for devastating opening salvos before transitioning to more disciplined fire rotations.</p>
history: |-
  <p>The Supernova's origins trace to the early Clan era, when Clan Nova Cat scientists sought to create an assault 'Mech that could operate independently of ammunition supply lines. Drawing inspiration from the Star League-era King Crab, they replaced its autocannon-based armament with an all-laser loadout. The resulting design entered production in 2846 at facilities on Barcella and Brim, predating the smaller Black Hawk OmniMech that many later observers mistakenly assumed was its predecessor.</p><p>For nearly two centuries, the Supernova served as a cornerstone of the Nova Cat garrison touman. The design's simplicity and logistical independence made it ideal for frontier garrison duty, where supply lines were often tenuous. When the Barcella facility changed hands to Clan Diamond Shark during the Political Century and later to Clan Coyote, and Brim's Ironworks fell under Clan Cloud Cobra control, the Supernova's production continued under new masters, ensuring its presence across multiple Clan toumans.</p><p>The Supernova first encountered Inner Sphere forces during the Clan Invasion, where its withering laser fire earned it a fearsome reputation among opposing MechWarriors. Clans Wolf, Ghost Bear, Diamond Shark, Star Adder, and Cloud Cobra all fielded limited numbers in their garrison forces alongside the Nova Cats' larger deployments.</p><p>Following Clan Nova Cat's Abjuration and resettlement in the Irece Prefecture of the Draconis Combine, a new production line was established at Irece Alpha around 3062. This facility produced the base Supernova alongside three new variants that incorporated endo steel construction and diversified weapon loadouts, reflecting the Nova Cats' evolving tactical doctrine within the Inner Sphere. The Irece Alpha facility was destroyed in 3071 during the Jihad, ending Nova Cat production of the design.</p><p>The Supernova found an unexpected new chapter when Clan Nova Cat accepted an offer to establish production at Irian BattleMechs Unlimited on Angell II. The resulting Supernova 5, incorporating endo steel and coolant pod technology, entered production around 3144 under Clan Sea Fox management. Delta Aimag claimed most of the initial production run, though Clan Sea Fox's merchant networks have since distributed the design throughout the Inner Sphere, ensuring the venerable Supernova remains a presence on battlefields across the galaxy.</p>
