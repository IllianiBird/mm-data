chassis: "Field Gun Platoon (AFFS)"
model: "(Tracked LBX10 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing heavy LB-X autocannon capable of firing cluster ammunition, these field gun crews deliver devastating anti-infantry capability at ranges that threaten light vehicles with solid shot.</p>
