overview: |-
  <p>The Word of Blake Militia inherited ComStar's combined-arms organizational philosophy and its Star League-era equipment stocks, fielding infantry formations that ranked among the best equipped in the Inner Sphere during the Jihad. Operating heavy field autocannon, these crews deliver punishing direct fire capable of damaging medium-weight combat vehicles, providing organic heavy weapons support that reduces a formation's dependence on armor assets.</p>
