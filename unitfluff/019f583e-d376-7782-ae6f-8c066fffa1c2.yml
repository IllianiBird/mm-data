chassis: "Catapult II"
model: "CPLT-L7"
overview: |-
  <p>The Catapult II is a 70-ton heavy BattleMech first produced in 3135 by Hollis Incorporated on Corey for the Capellan Confederation. Conceived as both an indirect fire-support platform and a testbed for Tight-Stream Electromagnetic Pulse cannon technology, the design serves as a direct evolution of the original Catapult chassis scaled up to the heavy weight class. Five tons heavier than its venerable ancestor, the Catapult II was built to accommodate the demanding power and cooling requirements of the advanced TSEMP weaponry that the Confederation was investing in heavily during the early thirty-second century. The Catapult II has established itself as a potent if demanding addition to the Capellan arsenal, rewarding disciplined crews with battlefield results that few comparable platforms can match.</p>
capabilities: |-
  <p>Designed as an indirect fire-support 'Mech and TSEMP test platform, the Catapult II is remarkably similar to its predecessor in overall layout. The Hollis Mk.II-Beta Endo Steel chassis and General Motors 280-rated extralight fusion engine maintain the same speed profile as the original Catapult while accommodating the heavier weapons payload. Anderson Propulsion 25 jump jets provide the standard 120-meter jump capability, and Ceres Heavy armor offers a half-ton improvement over the original's protection. The highly reliable Holly Ballista-20 launchers cycle faster than competing systems from domestic manufacturers, and the Diverse Optics lasers have a history of solid performance.</p><p>The primary long-range armament consists of paired Holly Ballista-20 LRM-20 launchers mounted in the 'Mech's stubby arm assemblies, each fed by two tons of ammunition that pilots must carefully manage during protracted engagements. The design's signature weapons are twin Firmir Hypnos TSEMP Cannons mounted in the side torsos, capable of disabling enemy 'Mechs through targeted electromagnetic pulses. A pair of Diverse Optics Sunfire Extended Range Medium Lasers in the center torso provide backup firepower. The O/P targeting and tracking system performs satisfactorily under normal conditions but has been noted to stutter when tracking the maximum number of contacts, leading many technicians to reduce tracked targets by fourteen percent as a standard workaround. The combination of energy-intensive weaponry and limited heat dissipation capacity creates significant thermal management challenges that demand disciplined fire control from pilots.</p>
deployment: |-
  <p>The base Catapult II model entered production in 3135 as the first dedicated TSEMP-equipped fire-support platform in the Capellan arsenal. Its combination of Holly Ballista-20 LRM launchers and twin Firmir Hypnos TSEMP Cannons gave lance commanders unprecedented tactical flexibility, able to soften targets with long-range missile fire before disabling them with electromagnetic pulses at closer range. The fifty percent increase in missile ammunition over the original Catapult improved battlefield endurance, though crews still needed to be mindful of supply during protracted operations. Despite its heat management reputation, the L7 proved devastatingly effective when deployed with proper tactical discipline.</p>
history: |-
  <p>The Catapult II's development grew from the Capellan Confederation's increasing investment in TSEMP technology during the early thirty-second century. As TSEMP weapons became more prevalent across the Capellan Confederation Armed Forces, appearing on many newer 'Mech designs, Hollis Incorporated was tasked with creating a dedicated platform that could exploit the technology's potential while maintaining the proven fire-support doctrine of the original Catapult. Initial prototypes suffered stress fractures in the weapon housings, requiring the five-ton chassis increase that distinguished the new design from its ancestor.</p><p>Despite its unpopularity among garrison forces, the Catapult II proved its combat worth during the 3145 Capellan incursion into the Federated Suns. Elements of the Third McCarron's Armored Cavalry and Sung's Rangers deployed the design during the invasion of Taygeta, where they faced determined resistance from the Ridgebrook Capellan March Militia and Fifth Crucis Lancers. In the rolling hills outside the capital city, Capellan forces used lances of Catapult IIs alongside other fire-support 'Mechs to bombard Davion positions before committing to close engagement. After exhausting their missile stores, crews demonstrated the devastating potential of coordinated TSEMP fire, immobilizing Davion defenders and enabling accompanying heavy 'Mechs to close for decisive physical attacks. The Davion commander was forced to withdraw despite fielding a larger formation, a victory largely credited to the 'Mech-crippling effects of the electromagnetic pulse weapons.</p><p>The L7L variant further demonstrated the chassis' adaptability during fierce urban fighting on New Syrtis, where its heat-dissipating armor proved invaluable against Davion defenders who had resorted to inferno munitions during desperate street-to-street combat. These engagements helped rehabilitate the Catapult II's reputation within the CCAF, proving that proper tactical employment could overcome the design's acknowledged thermal limitations.</p>
