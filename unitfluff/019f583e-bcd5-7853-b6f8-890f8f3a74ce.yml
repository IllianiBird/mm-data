chassis: "Motorized Platoon (FWLM)"
model: "(MG 3035+)"
overview: |-
  <p>The Free Worlds League Military has long fielded some of the largest infantry formations in the Inner Sphere, with regiments numbering nearly 1,800 soldiers compared to roughly 750 in the Combine and just over 1,000 in the Federated Suns. Motorized platoons provide the speed the FWLM needs to cover the vast distances between garrison posts on provincial worlds, mounting troops on light vehicles that can respond to threats faster than foot infantry but without the expense of full mechanization. Carrying infantry-portable machine guns that deliver sustained automatic fire at close range, these platoons trade precision for volume, putting enough rounds downrange to suppress enemy positions and deny open ground to advancing troops.</p>
