chassis: "Mechanized Tracked Platoon (Generic)"
model: "(Laser TAG 3051+)"
overview: |-
  <p>Mechanized tracked platoons move their infantry in armored personnel carriers fitted with tracks for reliable all-terrain performance. Tracked APCs handle mud, snow, rubble, and rough ground better than any wheeled or hover alternative, making these platoons the preferred mechanized infantry for operations where terrain is uncertain or hostile. They sacrifice road speed compared to wheeled formations but gain the ability to keep pace with armored vehicles across broken ground. The APCs provide meaningful ballistic protection during transit, though troops must still dismount to fight effectively.</p><p>Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these platoons field one of the most effective personal arms available to conventional infantry, though the weapons are significantly more expensive and require soldiers to carry additional power packs. These TAG specialists carry Target Acquisition Gear that designates targets with a laser for guided munitions delivered by artillery, aerospace assets, or missile units, providing precision strike capability far beyond the platoon's organic firepower.</p>
