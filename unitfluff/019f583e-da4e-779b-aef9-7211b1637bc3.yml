chassis: "Kontio"
overview: |-
  <p>The Kontio emerged from the Rasalhague Dominion in 3145 as a controversial forty-ton medium BattleMech designed around melee assassination tactics. Born from Bergan Industries' Alshain facility, the design drew upon the Dominion's connections with the Capellan Confederation to blend Clan and Inner Sphere technologies into a dedicated close-combat platform. The Kontio secured production approval through a dramatic proving trial, though the manner of its victory proved deeply divisive within Clan Ghost Bear. Its reputation as a pilot killer precedes it on any battlefield where it deploys, and the design's aggressive aesthetics have made it one of the most visually distinctive 'Mechs of the Dark Age era.</p>
capabilities: |-
  <p>The Kontio is built as a melee assassin, with every system oriented toward closing with targets and delivering devastating claw strikes. Its forty-ton frame rides on an Alshain M endo-steel chassis powered by a 280-rated XL engine, achieving a cruising speed of seventy-five kilometers per hour. When the Triple Strength Myomer activates at elevated heat levels, a supercharger can push the design to a blistering one hundred seventy-two kilometers per hour in short bursts, fast enough to overtake most light 'Mechs.</p><p>The weapons loadout is deliberately designed to generate heat. Two Kolibri Delta Series medium pulse lasers and six Series 1 extended-range small lasers provide respectable short-range firepower while quickly building the thermal output needed to activate the TSM. A single Series 3c micro pulse laser rounds out the armament for anti-infantry work. The deliberate use of only ten double heat sinks ensures the 'Mech reaches and maintains optimal TSM activation temperatures during sustained combat.</p><p>Eight and a half tons of Hellespont Lite stealth armor, paired with an ECM suite, allow the Kontio to close undetected before unleashing its retractable claws. This combination of speed, stealth, and devastating melee capability makes it a terrifying opponent at close range. However, the design remains highly vulnerable to enemies who can engage it at distance before it can close, and the loss of the ECM suite drastically reduces the Kontio's survivability during the critical approach phase.</p>
deployment: |-
  <p>The sole production configuration of the Kontio stands as a mixed-technology approach that pairs Clan-specification structural components with Inner Sphere stealth systems and myomer technology sourced through Bergan Industries' Capellan connections. No factory variants are produced as of the mid-thirty-second century, though the design's export success with Clan Wolf and the Capellan Confederation suggests future modifications may emerge as those factions adapt it to their own doctrinal requirements.</p>
history: |-
  <p>The Kontio's genesis lies in the creative vision of a Ghost Bear ristar during his service with the Rasalhague Dominion. Inspired by an encounter with a concealed ghost bear during his Clawing ritual, the designer championed a 'Mech concept built around stealth and clawed melee combat. The use of claws proved immediately controversial within Clan Ghost Bear, where such weapons carried implications of dishonorable conduct. The debate intensified when the prototype's pilot impaled an opposing MechWarrior during the initial combat trial, a victory so efficient yet so inherently dishonorable that it nearly ended the project entirely.</p><p>Despite the controversy, the design's effectiveness forced reluctant consideration from Ghost Bear leadership. Bergan Industries authorized a single test run at their Alshain facility, leveraging the company's established connections with the Capellan Confederation to source the specialized armor and myomer systems critical to the design. When Clan Wolf expressed sudden and strong interest, production accelerated rapidly. The Dominion permitted Wolf combat testing while maintaining steady demand from its own garrison forces.</p><p>The Kontio quickly established itself as a potent symbol of clawed predation. Bergan Industries' deliberate choice to paint production models with canid and feline features enhanced the design's intimidating reputation. Freeborn Wolf Clusters raised from the Free Worlds League and Lyran Commonwealth became early adopters, though clashes involving inexperienced freeborn warriors often devolved into messy short-range engagements where the Kontio's advantages were partially offset by poor tactical discipline.</p><p>Falcon Jaeger units raiding into Dominion territory found themselves particularly targeted by Kontio pilots, who used the 'Mech's stealth capabilities to form defensive redoubts and ambush raiding forces. Engagements on Lamon, Sarpsborg, and Clinton saw Kontio formations chasing down Hierofalcons and Ion Sparrows in running battles that demonstrated both the design's pursuit capabilities and the vulnerability of lighter aerospace assets to a determined ground-based hunter. While the Lyran and Free Worlds League states do not threaten the Wolf Empire directly, Jade Falcon raiders remain eager to test themselves against the controversial design.</p><p>Relatively rare and expensive even for a garrison Cluster, the Kontio is considered a reward for exemplary service within the Dominion's military structure. Its growing presence in the Capellan Confederation, which supplied critical technology for its development, suggests that the design's influence will continue to expand across the Inner Sphere in the coming decades.</p>
