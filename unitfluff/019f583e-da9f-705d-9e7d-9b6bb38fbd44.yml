chassis: "Katana (Crockett)"
model: "CRK-5006-1"
overview: |-
  <p>The Katana is an eighty-five-ton assault BattleMech derived from the Star League-era Crockett, created when ComStar transferred a cache of downgraded Crocketts to the Draconis Combine as part of Operation Rosebud in 3035. The 'Mechs were delivered through the Blankenburg Technologies storage facility on Soul, which Primus Myndo Waterly handed over to Independence Weaponry under the guise of a lease agreement. After examining and making minor modifications to the Crocketts, IW rechristened them as Katanas and deployed them to replace Chargers in several DCMS line units. The Katana quickly established itself as a valued heavy assault platform, particularly after the development of C3 computer technology enabled coordinated lance operations. When the Soul facility's lease expired and reverted to Blankenburg Technologies, the company retained the former IW engineering team and entered into a technology-sharing agreement to continue Katana production and development.</p>
capabilities: |-
  <p>The Katana shares the fundamental design architecture of its Crockett parent, retaining the same Geometric 530 Hard Core chassis, Strand 255 fusion engine, and Geotec 300 jump jets. This provides identical ground speed of fifty-four kilometers per hour and ninety meters of jumping capability. Twelve and a half tons of CarboStrand armor matches the protection level of the original Crockett design, and the same GRPNTR Groundpainter 5 communications system and Scope 30 RNDST targeting-tracking system handle battlefield awareness.</p><p>Where the Katana diverges from its predecessor is in its weapons fit and heat management. The extended-range large lasers are replaced with standard Magna Mk III large lasers, a practical concession to the Combine's manufacturing capabilities in the 3030s. The Blankenburg LB 10-X autocannon is retained in the left torso, fed by a two-ton ammunition bin, preserving the versatility of standard and cluster munitions. Twin Holly SRM-6 launchers in the side torsos and two Dodd small lasers mounted co-axially with the large lasers round out the armament. The most significant compromise is the substitution of twenty standard heat sinks for the original fifteen double units, substantially reducing the 'Mech's ability to sustain high rates of fire and forcing pilots to manage their heat output more carefully during extended engagements.</p>
deployment: |-
  <p>This variant is a Dark Age era variant first seen around 3108 and closely associated with the Hikage, the Draconis Combine's secretive special operations formation. This configuration replaces the autocannon with a Gauss rifle as the primary striking weapon and mounts a Streak SRM-6 in each side torso with CASE II protection addressing the ammunition vulnerability of earlier variants. Each arm carries a light PPC and ER medium laser, and improved jump jets provide one hundred fifty meters of leaping capability. While the ten double heat sinks struggle to manage the heat output of a full alpha strike, the variant's combination of precision firepower and advanced protection systems serves as a substantial evolution of the Katana platform.</p>
history: |-
  <p>The Katana's origins trace directly to ComStar's Operation Rosebud, a diplomatic initiative designed to strengthen ties with the Draconis Combine during the 3030s. Primus Myndo Waterly authorized the transfer of the Blankenburg Technologies storage facility on Soul to the Combine in 3035 as a gesture of good faith. The facility, nominally leased to Independence Weaponry to maintain appearances, contained not only a cache of Crocketts but also a trove of lostech weapons and components that IW reverse-engineered for distribution to other Combine manufacturers.</p><p>Independence Weaponry spent several months examining the Crocketts before making minor modifications and redesignating them as Katanas. The rechristening served the dual purpose of obscuring the 'Mechs' ComStar origins and asserting Combine ownership of the design. Deployed to replace underperforming Chargers in several DCMS mobile line units, the Katana proved effective enough that it quickly became a mainstay in heavier formations throughout the Combine's military structure.</p><p>The introduction of C3 computer technology prompted Independence Weaponry to develop specialized variants in 3057, including the CRK-5003-C with a C3 slave unit and the CRK-5003-CM carrying a C3 master computer. These configurations enhanced the Katana's value as a lance coordination platform within the DCMS's increasingly network-centric doctrine. When the lease on the Soul facility expired and Blankenburg Technologies resumed direct control, the company recognized the value of IW's work and hired the entire Katana engineering team, entering into a technology-sharing agreement to ensure continuity of production.</p><p>This arrangement bore fruit during the Jihad era with the CRK-5003-CJ variant in 3071, which upgraded the design with improved jump jets and double heat sinks, finally restoring the thermal management capabilities lost when the original Crocketts were downgraded. The Katana continued to evolve well into the Dark Age, with the CRK-5006-1 variant fielded by the secretive Hikage, the Combine's shadowy special operations unit. This advanced configuration incorporated a Gauss rifle, Streak SRM-6 launchers with CASE II protection, and improved jump jets, representing a substantial capability leap that demonstrated the Draconis Combine's ongoing commitment to developing the Katana as a distinct platform rather than merely a derivative of the Crockett.</p>
