chassis: "Field Gun Platoon (FWLM)"
model: "(Tracked UAC2 3057+)"
overview: |-
  <p>New technology and creative tactical thinking have long featured in FWLM infantry deployment, with varied unit types and specialized formations treated as the norm rather than the exception. Towing crew-served Ultra autocannon/2, these platoons can double their rate of fire at the risk of weapon jamming, providing sustained suppressive capability that standard autocannon formations cannot match.</p>
