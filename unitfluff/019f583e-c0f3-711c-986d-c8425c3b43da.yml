chassis: "Scout JumpShip"
model: "(2712)"
overview: |-
  <p>Developed for independent operations, the Scout-class JumpShip is a specialized, military-grade vessel that prioritizes speed and stealth over raw transport capacity. It is the smallest JumpShip found travelling the stars, with a low mass, single docking collar, and negligible jump signature, while sporting extensive facilities for its small crew.</p>
capabilities: |-
  <p>Scout-class JumpShips are equipped with a large and modern bridge, and an extensive computer network for complex navigational calculations. Its shortened Kearny-Fuchida drive allows for 80% shorter charging, while its small size additionally means its damage resistant jump sail unfolds more rapidly than is the case in other JumpShips. The reduced drive and its comperatively small mass of 87000 tons allows the Scout-class a difficult to detect jump signature. As the design prioritises independent operation, its 18 strong crew has access to extensive recreation facilities, as well as a highly equipped medbay for up to four emergency cases and life support systems featuring backup generators. A necessary concession due to its size does mean the Scout-class lacks a grav deck, being limited to gravity maneuvring to sustain the crew its health. This is rounded out by 1037,5 tons of storage and a single small craft bay. A final strength of the design is that due to its reinforced docking collar the vessel has the rare ability to accelerate with a DropShip attached.</p>
history: |-
  <p>The most famous modification is the Capellan Quetzalcoatl, named after the namesake vessel its docking collar was damaged during a boarding action. This variant removes the docking collar entirely and replaces it with a specialized fighter bay capable of launching and recovering up to 20 heavy AeroSpace Fighters, effectively turning the tiny Scout into a pocket carrier.</p>
