chassis: "Stiletto"
model: "STO-4C"
overview: |-
  <p>The Stiletto is a thirty-five ton light BattleMech introduced in 3061 by Coventry Metal Works. Born from the aftermath of the Battle of Coventry in 3058, the design was developed by reverse-engineering salvaged Clan Jade Falcon Fire Falcon OmniMechs. Coventry's engineers deliberately chose not to implement OmniMech technology, instead producing a conventional design that closely mimics the Fire Falcon's visual profile and speed, making it nearly indistinguishable from its Clan counterpart at a distance. While the Stiletto never achieved widespread popularity within the Lyran Alliance's arsenal, it filled a critical niche as a fast scout with electronic warfare capabilities, earning a reputation as a capable reconnaissance platform within the units that received it.</p>
capabilities: |-
  <p>The Stiletto achieves the Fire Falcon's impressive top speed of 129 kilometers per hour through a VOX 280 light engine, which provides greater survivability than the extra-light engines found on comparable designs. A MatherTech 750 endo steel chassis and six tons of Lexington Ltd. High Grade ferro-fibrous armor give the 'Mech solid protection for its weight class, while CASE protects the MechWarrior from catastrophic ammunition explosions.</p><p>The original STO-4A configuration emphasizes missile combat, mounting two Coventry TH4 Streak SRM-2 launchers for close engagements and a single Coventry LRM-5 for indirect fire support. This loadout drew criticism for its heavy ammunition dependence, as the 'Mech carries only one ton each of LRM and Streak ammunition, leaving the pilot defenseless once supplies are exhausted. A Guardian ECM suite provides valuable electronic warfare protection, allowing the Stiletto to disrupt enemy targeting networks and advanced sensor systems.</p><p>Despite its limitations, the Stiletto's combination of speed, sensors, and electronic countermeasures makes it an effective reconnaissance platform. The light engine's reduced critical vulnerability compared to XL designs means the 'Mech can absorb side torso hits that would cripple many competitors, giving pilots greater confidence in running engagements.</p>
deployment: |-
  <p>Developed in 3076 during the Jihad, this variant seeks a middle ground between the original missile configuration and the all-energy STO-4B. The standard weapon systems are replaced with a pair of ER medium lasers and a multi-missile launcher capable of firing both long-range and short-range ammunition from a single system. Additional armor rounds out the tonnage, providing improved protection over earlier models.</p>
history: |-
  <p>The Stiletto's origins trace to the Battle of Coventry in 3058, when Clan Jade Falcon forces swept through the Lyran Alliance world before being driven off by a combined Inner Sphere task force. The battle left the Lyran military with substantial quantities of Clan salvage, including several Fire Falcon OmniMechs. Coventry Metal Works, already experienced with advanced BattleMech production, undertook the ambitious task of reverse-engineering the Fire Falcon's performance characteristics using Inner Sphere technology, joining a broader trend of Clan-inspired designs that included the Black Hawk-KU and the Rakshasa.</p><p>Prototypes of the Stiletto entered service in 3061, with most early production units shipped to pro-Victor units for field testing. The First Davion Guards received several machines and employed them against Clan Smoke Jaguar during the final campaigns of the era. Limited production began that same year, with full-scale manufacturing following in 3062.</p><p>The Stiletto's service during the FedCom Civil War defined its reputation for decades. The design saw action in most major battles of the conflict, including the fighting on Tharkad and New Avalon. However, the noble ruler of Coventry refused to deliver Stilettos to any unit supporting Archon Katherine Steiner-Davion, ensuring the 'Mech served almost exclusively with loyalist armies. This politically charged deployment left the Stiletto virtually shunned by all forces in the Armed Forces of the Federated Suns and even many within the Lyran Alliance Armed Forces, earning it a lasting stigma that hampered broader adoption.</p><p>Production continued through the Jihad under contested Lyran control, with Coventry Metal Works developing the STO-4C variant in 3076 to modernize the aging platform. The experimental STO-6X prototype followed in 3078, representing a complete redesign with BattleMech turrets, a supercharger, and a Bloodhound active probe. This experimental work bore fruit in 3083 when the STO-6S production model entered service. The 6S was deliberately deployed first to the First Royal Guards in an effort to rehabilitate the Stiletto's tarnished reputation among LCAF MechWarriors. The strategy proved moderately successful, with the First Skye Jaegers and Fourth Donegal Guards subsequently adopting the upgraded design.</p>
