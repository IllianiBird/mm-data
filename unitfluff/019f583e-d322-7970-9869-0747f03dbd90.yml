chassis: "Centurion"
model: "CN11-OB"
overview: |-
  <p>The Centurion OmniMech was introduced by Corean Enterprises in the second decade of the thirty-second century as part of the company's effort to expand its market share. Manufactured at Corean's facility on New Avalon and designated the CN11-O, this fifty-ton OmniMech draws heavily on the legacy of the original Centurion BattleMech that served the Federated Suns for centuries. The design was a natural evolution for Corean, whose experience with countless Centurion upgrades and the advanced Legionnaire made the classic chassis an ideal candidate for OmniMech conversion.</p><p>Built on a Corean Model OM77 endo steel frame with a Magna 250 XL engine and compact gyro, the CN11-O achieves a top speed of eighty-six kilometers per hour while dedicating twenty-four tons (nearly half its total mass) to pod space. The most common configurations deliberately echo the varied weapon loadouts that Centurion variants have carried over the centuries, providing MechWarriors with familiar tactical options in a flexible, reconfigurable package.</p>
capabilities: |-
  <p>The Centurion OmniMech's design philosophy centers on versatility through reconfiguration. The fixed chassis mounts a Magna 250 XL engine, ten double heat sinks, and nine and a half tons of StarGuard III standard armor on a Corean Model OM77 endo steel frame fitted with a compact gyro. This combination provides twenty-four tons of available pod space, offering exceptional flexibility for a medium OmniMech and allowing field commanders to tailor each machine to the demands of a specific mission.</p><p>The Primary configuration echoes the proven CN9-D loadout, mounting an LB 10-X autocannon, an Artemis IV-enhanced LRM-10, and two extended-range medium lasers with CASE II-protected ammunition stores. Across all six standard configurations, the Centurion OmniMech maintains the traditional emphasis on combining long and short range weaponry, with loadouts available for roles ranging from precision sniping to close-quarters melee combat. A noted deficiency is that only two of the six standard configurations mount jump jets, an increasingly important tactical tool on the modern battlefield.</p>
deployment: |-
  <p>A more radical departure from the Primary configuration, this loadout removes all standard weaponry in favor of a heavy PPC in the right arm and an MML-7 with Artemis IV fire control in the left torso. A targeting computer in the center torso enhances accuracy for both weapons, while a Guardian ECM suite in the right torso provides electronic warfare capability. Two tons of CASE II-protected missile ammunition and an additional double heat sink round out the pod allocation. The configuration excels at medium to long range engagements while providing electronic protection for the formation.</p>
history: |-
  <p>The Centurion OmniMech entered service during a period when Corean Enterprises sought to expand beyond its traditional Centurion lineup. The company's centuries of experience with the platform, including the development of the advanced Legionnaire, made the Centurion a natural candidate for OmniMech conversion. The CN11-O's introduction in the 3110s coincided with the design largely dominating New Avalon's Centurion production output, contributing to the decline of the older CN10 line.</p><p>In the field, the Centurion OmniMech has seen service primarily with Federated Suns commands along the Draconis March. Units of the Morrill Draconis March Militia developed a notable tactical innovation, pairing traditional BattleMech Centurions with OmniMech variants in mixed formations. During engagements with Wolf's Dragoons striker battalions conducting spoiling raids from the Combine, the militia exploited the OmniMech's reconfiguration capability to deceive their opponents. By swapping configurations between attacks, the mixed Centurion formations convinced the Dragoons that the Morrill DMM had been heavily reinforced, causing them to abandon their advance and retreat off-world rather than press the attack.</p><p>By 3145, the Centurion OmniMech had established itself as a reliable utility platform within the AFFS, with its six standard configurations offering sufficient tactical variety to fulfill the diverse roles that Centurion variants have traditionally served throughout the design's storied service history.</p>
