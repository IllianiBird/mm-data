chassis: "Field Gun Platoon (FWLM)"
model: "(Wheeled LBX2 3060+)"
overview: |-
  <p>Conventional infantry within the FWLM serve as the backbone of provincial defense across a patchwork of semi-autonomous states, each maintaining its own military traditions and equipment preferences. Towing crew-served LB 2-X autocannon, these platoons can switch between solid slugs for long-range precision and cluster munitions that scatter across a wider area, providing tactical flexibility rare in field gun formations.</p>
