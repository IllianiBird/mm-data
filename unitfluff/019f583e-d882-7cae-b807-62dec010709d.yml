overview: |-
  <p>The Huntsman was originally developed by Clan Diamond Shark as a totemic OmniMech honoring their namesake predator, but before the design could enter full production, Clan Nova Cat won exclusive manufacturing rights through a Trial of Possession driven by the fierce rivalry between the two Clans' Merchant Castes. Entering production in 3049, the fifty-ton Huntsman quickly became the premier medium OmniMech of Clan Nova Cat, exemplifying the flexibility and adaptability that defined the OmniMech concept. Khan Severen Leoux contracted Clan Cloud Cobra's Brim Ironworks facility for additional manufacturing, ensuring sufficient production to equip Nova Cat frontline units in time for Operation Revival.</p><p>First encountered by Inner Sphere forces during the Battle of Luthien in 3052, a Draconis Combine intelligence officer designated the OmniMech "Nobori-nin" after the distinctive dorsal fin projection reminded him of the banners feudal samurai wore on their backs. The Huntsman has since spread well beyond its Nova Cat origins, serving with multiple Clans and finding renewed production under the Clan Protectorate on Asellus Australis.</p>
capabilities: |-
  <p>Sturdy and stable, the Huntsman dedicates nearly half its mass to pod space, granting MechWarriors exceptional flexibility in loadout configuration. Built on a Mynx Type Medium Endo Steel chassis and powered by a 250-rated Consolidated extralight fusion engine, the design achieves a respectable top speed of eighty-six kilometers per hour. Five fixed Northrup Starlifters jump jets provide a one-hundred-fifty-meter leap capability, offsetting what some warriors consider a middling ground speed for a medium OmniMech. Nine tons of Alpha Compound ferro-fibrous armor provide protection comparable to many heavier designs, contributing to the Huntsman's reputation as the equal in raw survivability of numerous heavy 'Mechs taking the field.</p><p>The Primary configuration demonstrates the Huntsman's versatility with a broad weapons mix spanning all engagement ranges. An Ultra autocannon/2 and Artemis IV-enhanced LRM-10 provide long-range suppression, while four extended-range medium lasers and a Streak SRM-6 deliver devastating close-range firepower. An active probe, TAG spotting laser, and anti-missile system round out the electronics suite, making the Prime configuration an exceptionally capable scout and skirmisher. The twenty-three and a half tons of available pod space allow configurations ranging from heavy fire support to dedicated brawler loadouts, though warriors accustomed to faster medium designs occasionally chafe at the Huntsman's more measured pace.</p>
deployment: |-
  <p>Alternate Configuration G is built for aggressive close-quarters combat. A retractable blade in the right arm provides devastating melee capability, while three ER medium pulse lasers in the left arm and a leg-mounted small pulse laser deliver accurate energy weapon fire. Paired Streak SRM-6 launchers with CASE II-protected ammunition bays add reliable short-range missile firepower. A pod-mounted engine supercharger allows the Huntsman G to sprint at one hundred kilometers per hour in short bursts, closing to blade range with surprising speed. An active probe and targeting computer complete the package.</p>
history: |-
  <p>The Huntsman's origins lie in the intense commercial rivalry between the Merchant Castes of Clans Nova Cat and Diamond Shark, whose competition for resources and trade opportunities was among the fiercest in the Clan Homeworlds prior to Operation Revival. When the Nova Cats successfully trialed for exclusive production rights to the promising new Diamond Shark OmniMech, it became a long-standing point of irritation that their totemic shark design had become a quintessential Nova Cat machine. Khan Severen Leoux wisely contracted Clan Cloud Cobra's Brim Ironworks to supplement Nova Cat production, preserving the Clan's own industrial capacity for other priorities.</p><p>The Huntsman first saw combat against Inner Sphere forces during Operation Revival, where it appeared in the ranks of the 119th Nova Cat Striker Cluster at the Battle of Luthien. Throughout the Clan Invasion, the design remained almost exclusively a Nova Cat asset, prized for its flexibility across diverse opponents and battlefield conditions. In the years following the invasion, however, Clan Diamond Shark finally reclaimed the right to produce their totemic design, while Clan Cloud Cobra's long manufacturing partnership led to the sharing of schematics with Clan Star Adder. By the outbreak of the Jihad, multiple Clans fielded significant numbers of the Huntsman.</p><p>The Word of Blake Jihad proved devastating for Huntsman production. The Nova Cat facilities on Irece and Avon were both destroyed in 3071, severely curtailing the supply of new chassis. When a significant portion of the Clan Nova Cat Touman joined the Republic of the Sphere after the Jihad, Huntsmans began appearing in Republic Armed Forces livery, a sight that raised eyebrows among observers who recognized the distinctly Clan design in recent RAF operations.</p><p>The Second Combine-Dominion War further depleted Nova Cat Huntsman numbers, as combat losses outpaced the Clan's diminished ability to replace them. The establishment of the Clan Protectorate brought renewed hope for the design, with Clan Protectorate Arms on Asellus Australis placing the Huntsman back into production for use by the descendants of both Nova Cat and Sea Fox, serving as a symbol of new cooperation within the Protectorate. Meanwhile, Brim Ironworks has maintained continuous production throughout these upheavals, ensuring the Huntsman remains a common sight on battlefields across the Inner Sphere and Clan territories alike.</p>
