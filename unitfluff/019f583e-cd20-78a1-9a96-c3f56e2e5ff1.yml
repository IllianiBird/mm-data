chassis: "Gurkha"
model: "GUR-4G"
overview: |-
  <p>The Gurkha is a thirty-five-ton light BattleMech developed by the Word of Blake on Terra in the early 3060s. Designed as a fast networked striker built around close-quarters combat, the Gurkha entered full production in early 3063 at the Krupp Armament Works in Germany. Named after the famed Terran commandos known for their loyalty and blade work, the design filled a need for an aggressive light platform in the expanding Word of Blake Militia.</p><p>The Gurkha quickly became popular among Blakist light 'Mech pilots who favored close-quarters engagements. Its combination of networking capability and physical combat potential gave the Militia a distinctive tactical asset during the Civil War and Jihad eras, though production ceased following the Coalition's liberation of Terra.</p>
capabilities: |-
  <p>Built on a lightweight Krupp 255 endo steel chassis and powered by a Magna 245 XL engine, the Gurkha achieves a top speed of nearly 119 kilometers per hour, exceptional for a design carrying seven and a half tons of Krupp 155 armor. This combination of speed and protection makes the Gurkha remarkably difficult to bring down for its weight class, though the absence of jump jets limits its maneuverability in rough or urban terrain.</p><p>The Gurkha's primary tactical value stems from its Exeter Longscan 500 communications system integrated with a C3i computer. Operating within a six-unit network, the 'Mech can close with enemy targets and provide precise targeting data to its heavier lancemates, enabling the entire formation to fire with devastating accuracy. A Fusigon Longtooth ER PPC provides surprisingly potent long-range firepower for a light 'Mech, while four Diverse Optics extended-range small lasers and a broadsword deliver punishing damage at close quarters.</p><p>The design's principal weakness is that opponents who recognize the C3i threat will prioritize Gurkhas for immediate elimination. The exposed actuators in the 'Mech's arms represent an additional vulnerability, and the lack of jump jets can leave a Gurkha stranded when terrain restricts its ground speed advantage.</p>
deployment: |-
  <p>Developed as a field modification around 3065, this variant replaces the ER PPC with a Tronel large pulse laser. The swap trades the base model's long-range striking power for significantly improved accuracy at closer ranges, a trade-off many pilots found acceptable given the Gurkha's design emphasis on closing with the enemy to employ its sword and provide C3i targeting data. The modification proved straightforward enough that front-line technicians could perform the conversion without factory support, leading to its widespread adoption across Blakist Militia formations.</p>
history: |-
  <p>The Gurkha's origins trace to the Word of Blake's consolidation of Terran military industry following ComStar's schism. The Krupp Armament Works in Germany had already begun producing Raijins for the Blakist Militia, but idle assembly capacity prompted calls for additional designs. The Gurkha was selected from several competing proposals in 3061 and entered production by early 3063, filling a need for a networked light striker in the expanding Word of Blake Militia.</p><p>During the FedCom Civil War, Gurkhas were deployed alongside Vanquishers to form the core of C3i-linked combat networks. This pairing proved highly effective, with the fast-moving Gurkhas providing forward targeting data while heavier 'Mechs delivered concentrated fire on designated targets. The sword (adopted as a symbol of pride and fanaticism within the Militia) became closely associated with the Word of Blake's martial identity, appearing on unit insignia and dress uniforms.</p><p>The onset of the Jihad in 3067 saw continued and expanded Gurkha production at the Krupp facility. New variants incorporating advanced weaponry entered service as the conflict intensified, reflecting the Word of Blake's access to cutting-edge Terran military technology. Gurkhas served in Blakist formations across multiple theaters, their C3i networks making them force multipliers in combined-arms engagements even as Coalition forces increasingly learned to target the networked light 'Mechs early in any engagement.</p><p>The fall of Terra to the allied Coalition brought an end to Gurkha production. The Krupp Armament Works survived the fighting largely intact, but the victorious Republic of the Sphere deactivated the production lines. No subsequent faction has resumed manufacture of the design, leaving surviving Gurkhas as an increasingly rare sight on battlefields of the Dark Age and ilClan eras, maintained only through salvage and cannibalization of existing stocks.</p>
