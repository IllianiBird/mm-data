chassis: "Mechanized Hover Platoon (Taurian 3047+)"
model: "(LRM)"
overview: |-
  <p>Taurian infantry reflect the Concordat's citizen-soldier tradition, with national service requirements ensuring that most adults have received basic military training before ever donning a uniform. Mechanized hover platoons are among the fastest ground infantry in the TDF, riding hovercraft that can traverse both land and water at speeds that let them cover the vast distances between Taurian population centers. The Concordat has historically favored hovercraft for its armor forces, and that preference extends to mechanized infantry as well.</p><p>Support troops operate man-portable long-range missile launchers capable of engaging targets at distances well beyond personal weapon range, providing the platoon with indirect fire capability against vehicles and fortified positions.</p>
