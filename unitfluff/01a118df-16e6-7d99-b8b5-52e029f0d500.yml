chassis: "Foot Platoon (Generic)"
model: "(Riot Police 2200+)"
overview: |-
  <p>Foot infantry platoons are the most basic and numerous conventional military formation across the Inner Sphere and Periphery. Deployed on foot without dedicated transport, these platoons are slow to reposition but cheap to raise, easy to supply, and capable of holding ground that faster units cannot afford to garrison permanently. Every major military fields foot platoons in enormous numbers for planetary defense, installation security, and rear-area policing. Their lack of mobility makes them poorly suited for offensive operations against armored forces, but in prepared defensive positions, urban terrain, or dense forests, dismounted infantry remain difficult to dislodge without committing disproportionate resources.</p><p>Configured for civil disturbance management rather than conventional military combat, these riot control troops are trained in crowd suppression, population control, and non-lethal enforcement operations on garrison worlds during periods of unrest or political transition.</p>
