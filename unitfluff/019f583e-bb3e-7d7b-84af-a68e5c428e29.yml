chassis: "Clan Jump Point"
model: "(Rifle Advanced)"
overview: |-
  <p>Despite the low regard most Clans hold for conventional infantry, these formations benefit from incidental access to Clan technology that makes even a disaffected garrison Point a match for its Inner Sphere equivalent. Jump Points are equipped with jump packs that grant vertical mobility and the ability to traverse rough terrain that would slow or stop foot and mechanized formations. This makes them valuable in urban fighting, mountainous terrain, and any environment where the ability to bypass obstacles matters more than sustained speed. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon available, these Points deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
