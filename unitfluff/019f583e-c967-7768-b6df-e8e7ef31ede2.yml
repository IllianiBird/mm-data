chassis: "Blackjack"
model: "BJ2-O"
overview: |-
  <p>The Blackjack OmniMech was developed by Luthien Armor Works in 3057, born from the Draconis Combine's technology exchange program during the Clan Invasion. When Ceres Metals Industries' St. Ives branch provided LAW with specifications and licenses for the BJ-2 Blackjack, the company manufactured only a handful of standard models before retooling the production line for an OmniMech variant. Weighing fifty tons (five more than its parent design) the BJ2-O became the first Inner Sphere OmniMech exported for foreign manufacture when LAW provided production plans to Irian BattleMechs Unlimited and Ceres Metals Industries.</p><p>This milestone was tarnished by the "monkey model" controversy, when both IBMU and Ceres discovered their initial production runs could only mount Inner Sphere OmniPods while DCMS units suffered no such limitation. LAW eventually released the necessary software interfaces, and the design has since become one of the most widely produced OmniMechs in the Inner Sphere.</p>
capabilities: |-
  <p>Built on an Alshain 50 endo steel chassis and powered by a Nissan 200 XL engine, the Blackjack OmniMech achieves a top speed of sixty-four kilometers per hour supplemented by four permanently mounted Icarus Standard jump jets providing 120 meters of jump range. Nine and a half tons of Mitchell Argon armor offers solid protection for a fifty-ton platform, while the weight savings from the XL engine and endo steel construction free an impressive 26.5 tons of pod space, rivaling many heavy 'Mechs in payload capacity.</p><p>The Prime configuration reflects the design's fire-support heritage with twin Ultra AC/5s capable of doubling their rate of fire, supported by four medium lasers for close engagements and four machine guns for anti-infantry work. The generous pod capacity has made the chassis remarkably adaptable, with configurations ranging from long-range sniper loadouts featuring Gauss rifles to energy-heavy brawling packages. This flexibility, combined with reliable jump capability and adequate protection, has made the Blackjack OmniMech a valued platform for commanders requiring a medium-weight design capable of fulfilling multiple tactical roles.</p>
deployment: |-
  <p>The Prime configuration embodies the Blackjack OmniMech's fire-support heritage with twin Ultra AC/5s capable of sustained high-volume fire at medium to long range. Four medium lasers provide reliable close-range backup, while four machine guns offer effective anti-infantry capability. This balanced loadout makes the Prime the most commonly deployed configuration, equally suited to offensive operations and defensive engagements across a wide variety of tactical situations.</p>
history: |-
  <p>Luthien Armor Works converted the newly licensed BJ-2 design into an OmniMech beginning in 3057, and the decision to export the BJ2-O to both Irian BattleMechs Unlimited and Ceres Metals Industries marked the first time an Inner Sphere OmniMech had been licensed for foreign manufacture. The goodwill this gesture generated was quickly squandered when both IBMU and CMI discovered their exported production runs could only accept Inner Sphere OmniPods, while Draconis Combine Mustered Soldiery Blackjacks had no such restriction. LAW's claim that the complex software interfaces for Clan weapon compatibility had not been perfected at the time of export rang hollow, and the company eventually released the necessary technical data with earlier export models upgraded during scheduled overhauls.</p><p>The design was produced across the Inner Sphere for nearly a decade before the Word of Blake Jihad reshaped the production sphere. Luthien Armor Works suffered devastating losses during the conflict's opening stages, and the increasingly desperate company sold the entire Blackjack OmniMech engineering and design rights to Irian BattleMechs Unlimited. Ceres Metals Industries accepted a production license from IBMU rather than purchasing the design outright. IBMU reworked the engineering to accommodate Free Worlds League weapon components, and by 3068 had begun producing record numbers of BJ2-O series units.</p><p>Maintenance on post-Jihad Blackjacks requires IBMU-certified parts, with persistent rumors of incompatibility between newer IBMU OmniPods and older LAW-produced units complicating logistics for mixed-era formations. The Free Worlds League and Capellan Confederation field the largest number of Blackjack OmniMechs, with Ceres Metal Works maintaining limited production primarily serving Capellan formations along the Federated Suns border. General Motors also operates a production line on New Valencia, further expanding the design's reach across the Inner Sphere.</p>
