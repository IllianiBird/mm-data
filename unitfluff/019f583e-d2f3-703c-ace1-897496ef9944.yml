chassis: "Tomahawk"
model: "C"
overview: |-
  <p>The Tomahawk is a 100-ton assault-class OmniMech designed by Clan Wolf in 3065. Conceived as a next-generation heavy assault platform to complement the Clan's existing stable of frontline OmniMechs, the Tomahawk represented an ambitious attempt to create the most devastating battlefield unit available to any military force. Several prototypes were constructed and tested by Omega Galaxy, demonstrating impressive firepower potential despite persistent system errors and integration issues that plagued early production models. The design was never approved for serial production, with the onset of the Jihad and the subsequent loss of Clan Wolf's Homeworld manufacturing infrastructure effectively ending the prototype program. The Tomahawk nonetheless served as the direct predecessor to the mass-produced Tomahawk II, which incorporated significant structural improvements to resolve the original design's shortcomings.</p>
capabilities: |-
  <p>The Tomahawk was designed to deliver overwhelming firepower from a heavily armored assault chassis. Built around a standard internal structure and powered by a 300-rated extra-light fusion engine, the design achieves a maximum speed of 54 kilometers per hour, adequate for an assault platform intended to anchor battle lines rather than pursue lighter opponents. The chassis provides 56 tons of available pod space, offering tremendous flexibility in weapons configuration across its various loadouts.</p><p>The Primary configuration exemplifies the design's intent, mounting paired Gauss rifles and extended-range large lasers in the arms for devastating long-range engagements, supplemented by medium pulse lasers and Streak SRM-4 launchers for close defense. An anti-missile system and ECM suite provide additional protection and electronic warfare capability. The Tomahawk's lack of endo-composite structure, later addressed in its successor, means the design carries slightly less armor protection than might otherwise be possible, though this compromise was acceptable given the prototype's role as a proof-of-concept platform. The absence of jump jets limits tactical mobility, requiring careful positioning to maximize the design's formidable direct-fire capability.</p>
deployment: |-
  <p>Alternate Configuration C blends pulse laser precision with versatile missile support. Four large pulse lasers in the arms provide accurate, concentrated energy fire effective against fast-moving targets, while twin ATM-12 launchers in the side torsos offer flexible munitions options ranging from long-range standard missiles to devastating short-range high-explosive rounds. Two tons of ATM ammunition per launcher ensure reasonable endurance in extended engagements. Ten additional double heat sinks manage the configuration's thermal demands.</p>
history: |-
  <p>The Tomahawk's origins trace to Clan Wolf's drive for battlefield supremacy in the mid-thirty-first century. By 3065, Clan Wolf had established a prototype program at the W-7 Facilities on Tranquil in the Clan Homeworlds, producing a small number of test units for evaluation by Omega Galaxy. Early trials revealed significant promise alongside persistent technical difficulties, system errors and integration gremlins prevented the design from being cleared for frontline deployment despite its impressive combat performance during field testing.</p><p>One of the first prototypes saw combat in a Circle of Equals on Tamar in September 3065, successfully defeating a Summoner despite the acknowledged system issues. The same prototype subsequently deployed with Omega Galaxy to Novo Cressidas in the Star's End system in April 3064, demonstrating the design's combat potential in an operational environment. These deployments provided valuable data that would later inform the development of the improved Tomahawk II.</p><p>The onset of the Jihad proved catastrophic for the Tomahawk program. Clan Wolf's attention and resources were diverted to more pressing matters, and the eventual loss of Homeworld manufacturing infrastructure effectively terminated any possibility of serial production. The design remained in prototype status, its small number of operational units gradually lost to combat attrition. Following the Jihad, Clan Wolf's engineers revisited the Tomahawk concept, incorporating endo-composite structure and other improvements that culminated in the Tomahawk II, a design that would finally realize the original Tomahawk's potential as a dominant assault platform.</p>
