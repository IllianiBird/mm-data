chassis: "Jump Platoon (DCMS)"
model: "(LRM 3065+)"
overview: |-
  <p>The Draconis Combine Mustered Soldiery assigns conventional infantry to garrison roles across its military districts, with district regulars often fielding extra platoons to secure worlds that BattleMech forces cannot permanently garrison. Jump infantry carry jump packs that make them the most mobile troops in the DCMS inventory for urban and broken terrain fighting. The ability to bypass obstacles and seize elevated positions gives these platoons a tactical value that district commanders prize, particularly on heavily built-up garrison worlds where conventional movement is restricted. Their support troops operate man-portable long-range missile launchers capable of reaching targets well beyond personal weapon range. The ability to engage vehicles and fortified positions from a distance that keeps the crew out of direct fire makes LRM teams among the most valued assets in any infantry formation.</p>
