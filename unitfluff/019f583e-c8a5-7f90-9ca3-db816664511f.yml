chassis: "Rakshasa"
model: "MDG-2A"
overview: |-
  <p>The Rakshasa is a seventy-five-ton heavy BattleMech introduced in 3055 by General Motors for the Federated Commonwealth. Named for the mythical creature that mimics the appearance and skills of its adversaries, the Rakshasa was engineered as one of the most ambitious Inner Sphere efforts to replicate the fearsome Clan Timber Wolf OmniMech, providing heavy formations with a platform that could match the general speed and weapons profile of its Clan counterpart.</p><p>While Inner Sphere technology of the era could not fully match Clan capabilities, the Rakshasa emerged as a capable heavy combatant in its own right. Its relatively straightforward construction and use of widely available components earned it a reputation for easy maintenance, though the design has struggled to escape an undeserved reputation for mediocrity that belies its actual combat record.</p>
capabilities: |-
  <p>The Rakshasa achieves its mission profile through a combination of speed, firepower, and advanced construction techniques. A GM 375 XL engine propels the seventy-five-ton 'Mech to speeds of eighty-six kilometers per hour, matching the ground speed of the Timber Wolf it was designed to emulate. The use of endo steel internal structure and StarGuard ferro-fibrous armor maximizes available tonnage for weapons and equipment, providing near-maximum armor protection for its weight class.</p><p>The weapons array mirrors the Timber Wolf's general philosophy of combining long-range missile support with direct-fire energy weapons. Twin shoulder-mounted Federated LRM-10 racks, each linked to an Artemis IV fire control system, provide accurate indirect fire capability. A pair of ExoStar extended-range large lasers mounted in the arms deliver punishing damage at range, while two Martell medium lasers and a Martell medium pulse laser round out the close-combat armament.</p><p>This weapons mix generates considerable heat, representing the design's primary tactical limitation. The fifteen double heat sinks struggle to manage sustained fire from all weapons simultaneously, forcing MechWarriors to exercise careful fire discipline. The absence of jump jets further limits tactical flexibility, though the 'Mech's high ground speed partially compensates. A known weakness in the head armor has been noted by field commanders, requiring pilots to avoid prolonged exposure to concentrated headshots.</p>
deployment: |-
  <p>Introduced around 3064 during the intense fighting for Kathil, this variant is a significant departure from the original Timber Wolf emulation concept. This factory-produced variant strips the entire long-range weapons suite and replaces it with an arsenal optimized for close-quarters combat. A Rotary AC/5 serves as the primary weapon, capable of delivering devastating volumes of fire at short range, supported by a large pulse laser and four medium pulse lasers. The pulse-heavy energy loadout provides exceptional accuracy in the chaotic conditions of urban and close-range engagements. Debuting at the height of the nearly three-year battle for Kathil, the 2A rapidly became a favorite among Capellan March MechWarriors.</p>
history: |-
  <p>The Rakshasa's origins trace to the aftermath of the Clan Invasion, when NAIS engineers spent five years studying salvaged Timber Wolf OmniMechs in an effort to reproduce the design's capabilities using Inner Sphere technology. The project faced significant challenges, as the technological gap between Inner Sphere and Clan manufacturing remained substantial throughout the 3050s. Still, the team produced a workable design that, while clearly inferior to its Clan progenitor, offered a competitive platform by Inner Sphere standards.</p><p>The Rakshasa first saw combat shortly after its introduction in 3055, with initial combat trials proving promising. Early deployments included service with a joint FedCom-Clan Wolf task force formed to combat the Red Corsair in 3055, where Rakshasas assigned to the Kell Hounds performed well on Arc-Royal and Elyssa. Despite these successes, the design acquired an unfortunate reputation during Operation Guerrero two years later, when Rakshasas serving with the Eighth FedCom RCT were destroyed in engagements that had more to do with poor tactical circumstances than any inherent design flaw. The resulting criticism from senior officers unfairly tainted the 'Mech's reputation for years.</p><p>Production continued at the General Motors facility on Kathil, which became a critical battleground during the FedCom Civil War. The close-combat MDG-2A variant emerged during the height of the fighting for Kathil around 3064-3065, developed by resourceful technicians who adapted the design to meet the demands of the intense urban and close-quarters combat that characterized the struggle for the planet. The Rakshasa found a surprising following among Capellan March MechWarriors who appreciated the 2A's devastating short-range firepower.</p><p>Beyond its primary service with the Armed Forces of the Federated Suns, the Rakshasa gained a small but dedicated following on Solaris VII, where its combination of speed and firepower proved well-suited to arena combat. Individual Rakshasas have appeared in the service of the Draconis Combine and other states through battlefield salvage and the gray market, demonstrating the design's appeal beyond its nation of origin. Field refit packages developed during the Jihad era further extended the chassis's service life, ensuring the Rakshasa continues to see deployment across the Inner Sphere.</p>
