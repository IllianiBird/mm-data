chassis: "Motorized demi-I (ComGuards)"
model: "(Rifle)"
overview: |-
  <p>Under the reforms of Precentor Martial Anastasius Focht, Com Guard infantry train extensively in combined-arms cooperation, conducting regular exercises alongside heavier elements to ensure seamless coordination across all branches when battle demands it. Motorized Level I formations use light vehicles to achieve rapid redeployment between positions, trading the armor protection of mechanized transports for greater speed and lower logistical burden. These formations excel at screening operations and can cover more ground than foot infantry during extended patrol assignments. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon in the Inner Sphere, these troops deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
