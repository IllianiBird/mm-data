chassis: "Field Artillery Platoon (DCMS)"
model: "(Motorized Thumper Cannon 3079+)"
overview: |-
  <p>The Draconis Combine Mustered Soldiery assigns conventional infantry to garrison roles across its military districts, with district regulars often fielding extra platoons to secure worlds that BattleMech forces cannot permanently garrison. The platoon tows a Thumper Cannon, a direct-fire variant of the standard Thumper that trades indirect bombardment capability for improved accuracy against visible targets. Faster to bring into action and more responsive than its artillery counterpart.</p>
