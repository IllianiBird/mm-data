chassis: "Mechanized Hover Platoon (LCAF)"
model: "(MG 3058+)"
overview: |-
  <p>Lyran infantry draw confidence from knowing their equipment is first-rate, even when assigned to garrison duty on worlds far from the front lines. Mechanized hover platoons ride into battle aboard hovercraft that provide both speed and the ability to cross water and rough terrain without slowing, making them effective rapid-reaction forces. Armed with assault rifles backed by portable machine guns, these platoons combine individual marksmanship with sustained suppressive fire from crew-served weapons that can pin down opposing formations.</p>
