chassis: "Hierofalcon"
model: "C"
overview: |-
  <p>The Hierofalcon is a 45-ton Clan OmniMech introduced in 3148 by Clan Jade Falcon. Designed alongside the heavier Jade Phoenix at CJF Factory Zone 4 on Alyina, the Hierofalcon represented a new generation of OmniMechs intended to eventually supplant the standard BattleMechs still fielded by the Falcon touman. Born from decades of hard-learned lessons on the battlefield and the gantries of frustrated technicians, the design emphasized the speed and maneuverability that had become hallmarks of Jade Falcon doctrine by the mid-thirty-second century. The development of the Ion Sparrow on Alyina enabled full-scale production of partial wing equipped OmniMechs, paving the way for the Hierofalcon to enter service as a premier striker platform.</p>
capabilities: |-
  <p>The Hierofalcon achieves its striker role through an exceptional combination of speed and agility. A 270-rated extralight engine propels the chassis to speeds approaching 97 kilometers per hour, while a permanently mounted partial wing serves double duty as both a jump distance enhancer and supplemental heat dissipation system. This signature piece of Jade Falcon equipment allows Hierofalcon pilots to glide across battlefields with some of the longest jump ranges possible for a BattleMech, a capability that becomes even more pronounced when configurations mount improved jump jets. The partial wing also enables Elementals to ride the 'Mech into position rather than being confined to vulnerable hovercraft or VTOLs, making Jade Falcon Nova formations particularly deadly.</p><p>Seven and a half tons of Compound JF ferro-fibrous armor provides modest but adequate protection for a design that relies on speed rather than durability. With nineteen tons of pod space available for weapons and equipment, the Hierofalcon offers considerable flexibility in its loadout. The Prime configuration pairs a Hyper-Assault Gauss Rifle 20 with twin improved heavy medium lasers, supplemented by TAG and an ECM suite that enhances both offensive coordination and electronic warfare capability. Six jump jets in this configuration allow leaps of up to 240 meters when combined with the partial wing, giving the Prime a potent mix of firepower and battlefield mobility.</p>
deployment: |-
  <p>Alternate Configuration C converts the Hierofalcon into a long-range sniper, a role unusual for a design built around speed and agility. An ER PPC provides heavy hitting power at extreme range, complemented by a rotary AC/2 with ninety rounds of ammunition that can deliver sustained suppressive fire or focused bursts against distant targets. Six jump jets preserve the chassis's mobility, allowing the C configuration to engage from advantageous positions and relocate before the enemy can effectively respond. This configuration excels in open terrain where its range advantage can be fully exploited.</p>
history: |-
  <p>The Hierofalcon entered service in 3148 as part of Clan Jade Falcon's concerted effort to modernize its touman during the turbulent years leading up to the ilClan Trial. CJF Factory Zone 4 on Alyina, already producing the Ion Sparrow, proved the ideal facility to manufacture the new design, leveraging existing expertise with partial wing technology. The Hierofalcon and its larger companion, the Jade Phoenix, were conceived as complementary designs that together could replace aging standard BattleMechs across multiple weight classes within the Falcon force structure.</p><p>The design saw its baptism of fire in 3149 during a skirmish on Hyperion against Clan Hell's Horses, former allies whose relationship with the Jade Falcons had deteriorated. A Star Commander of the First Falcon Jaegers engaged a Horse Nova composed of Balius OmniMechs supported by Buraq battle armor. The speedy Buraqs initially ran circles around the Falcon force until two Beta configuration Hierofalcons switched to inferno rounds, turning the field into a nightmare of flames. The Buraqs were either melted into slag or herded into the guns of heavier Falcon 'Mechs, and though the outnumbered Falcons eventually fled, they were credited with turning certain defeat into an opportunity to fight again. The engagement earned the Hierofalcon a fearsome reputation among the Hell's Horses.</p><p>The capture of Rigil Kentarus at the end of 3150 brought the Jade Falcons the closest to Terra they had ever come, and Hierofalcons were among the forces committed to the desperate fighting that followed. Republic defenders and Clan Wolf forces already on-planet faced a frenzy unlike anything seen since the Jihad as Falcon warriors abandoned all restraint. During the assault on Fortress Carmichael, a Word of Blake fortification rebuilt after the Jihad, Republic BattleMechs perched atop the sixty-meter-high ferrocrete walls and rained fire upon the invaders. Falcon artillery pounded the reinforced walls, but the assault seemed hopeless until a Hierofalcon equipped with improved jump jets rocketed to the very top of the wall, depositing a group of Elementals who fought their way to the fortress command center and slaughtered the entire staff. The remaining defenders fled within the hour, leaving the Jade Falcons on Terra's doorstep.</p><p>As Clan Jade Falcon's military ambitions intensified in the race toward the ilClan Trial, the Hierofalcon became an increasingly common sight throughout the Falcon touman. Its combination of speed, jump capability, and flexible pod space made it a natural fit for the aggressive, mobility-focused doctrine that characterized Jade Falcon operations during this era. Production at CJF Factory Zone 4 continued to expand as the facility shifted resources away from older designs to meet demand for the new generation of OmniMechs.</p>
