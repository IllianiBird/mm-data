chassis: "Field Gun Platoon (AFFS)"
model: "(Tracked UAC10 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing heavy ultra autocannon capable of double-rate fire, these field gun crews deliver punishing direct fire that can overwhelm the armor of medium vehicles and threaten BattleMech limbs.</p>
