chassis: "Foot Platoon (LCAF)"
model: "(Flamer 3058+)"
overview: |-
  <p>The LCAF fields conventional infantry that benefit from the Commonwealth's deep industrial base, equipping even garrison formations with reliable, well-maintained weapons and transport. Foot infantry platoons form the backbone of the LCAF's garrison forces, deploying on foot to hold positions, patrol perimeters, and secure urban areas where vehicles cannot easily operate. Armed with standard assault rifles and supplemented by man-portable flamers, these platoons can both engage enemy personnel at range and deny terrain or flush defenders from cover with incendiary fire.</p>
