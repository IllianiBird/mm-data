chassis: "Tomahawk II"
model: "B"
overview: |-
  <p>The Tomahawk II is a 100-ton assault OmniMech produced by Clan Wolf beginning in 3088. Developed as the fully realized production version of the earlier prototype Tomahawk, the Tomahawk II incorporates significant structural improvements that maximize available tonnage for weapons and armor. Initially manufactured at the W-7 Facilities on Weingarten and later at Earthwerks-FWL on Keystone following the Wolf Empire's relocation, the design benefits from mature manufacturing processes refined over decades. The Tomahawk II represents one of the most formidable assault platforms fielded by any faction during the thirty-second century. Few assault 'Mechs in either the Inner Sphere or Clan inventories can match its combination of firepower, protection, and operational flexibility, establishing the design as a prestige unit within Clan Wolf's touman.</p>
capabilities: |-
  <p>The Tomahawk II achieves its devastating combat capability through a carefully optimized chassis design. The DSAM Endo 10-Composite internal structure saves critical tonnage compared to the prototype's standard skeleton, freeing weight for the design's impressive 56 tons of available pod space. A Starfire 300 XL engine propels the hundred-ton assault 'Mech to a maximum speed of 54 kilometers per hour, while nineteen tons of Advanced/3 armor provides near-maximum protection for an assault-class platform. The chassis is supported by Khan Series communications and Build 4 MadCat targeting systems, ensuring reliable command integration and weapons accuracy.</p><p>The Primary configuration demonstrates the Tomahawk II's offensive philosophy with a pair of Hyper-Assault Gauss 30 rifles, among the most powerful kinetic weapons available in the Clan arsenal. Three extended-range large lasers and two medium pulse lasers supplement the main battery, creating overlapping fields of fire from extreme to close range. CASE II protects the ammunition stores against catastrophic detonation. The design's principal weakness is its lack of mobility, without jump jets in most configurations and limited ground speed, the Tomahawk II depends on friendly forces to prevent flanking maneuvers and must be deployed with careful attention to terrain and tactical positioning. The design also carries a known fault in its ejection system that presents a concern for pilots under combat conditions.</p>
deployment: |-
  <p>Alternate Configuration B adapts the Tomahawk II for urban combat with the addition of three jump jets, providing the massive assault 'Mech with unprecedented tactical mobility for its weight class. Paired Streak LRM-15 launchers deliver guaranteed missile strikes against locked targets, while arm-mounted ER large pulse lasers and torso-mounted ER large lasers ensure devastating energy firepower at all ranges. A laser anti-missile system provides active missile defense without ammunition dependency. Ten additional double heat sinks attempt to manage the configuration's heavy energy weapon load. This is the only standard configuration to equip the Tomahawk II with jump capability.</p>
history: |-
  <p>Full production of the Tomahawk II commenced in 3088 at the W-7 Facilities on Weingarten, where Clan Wolf established dedicated manufacturing lines following the Jihad. The superior facilities available at the W-7 complex, already responsible for other key Clan Wolf designs, enabled the integration of the endo-composite structure and advanced electronics that had been absent from the prototype Tomahawk. A significant number of Tomahawk IIs entered service before Clan Wolf's migration from its occupation zone in the late 3130s.</p><p>When Clan Wolf relocated to former Free Worlds League space to establish the Wolf Empire, the Weingarten production line was necessarily abandoned. Unlike some other designs that required extensive retooling, the Tomahawk II was able to resume production relatively quickly at the Earthwerks-FWL facilities on Keystone, proof of both the design's manufacturing maturity and the capabilities of the Earthwerks complex. Clan Hell's Horses also gained access to the Tomahawk II through decades of Trials with Clan Wolf, fielding the design alongside their own assault assets.</p><p>The Tomahawk II's most dramatic moment came during the invasion of Tharkad in 3143. Galaxy Commander Alaric Ward of Beta Galaxy deployed a Binary of elite Tomahawk II pilots against the Second Royal Guards defending the Nagelring military academy. On 13 July, the Binary shattered two companies of heavy and assault Lyran machines in two hours of intense combat, suffering the loss of only a single Tomahawk II. The engagement effectively broke Lyran resistance at the Nagelring and demonstrated the Tomahawk II's ability to dominate the battlefield against even the most determined opposition.</p><p>The invasion of Tharkad cemented the Tomahawk II's reputation as one of the most feared assault platforms in the Inner Sphere. With production secured on Keystone under Wolf Empire control, the design continues to serve as the premier assault OmniMech in the Clan Wolf touman, a symbol of the technological superiority that Clan Wolf has long cultivated.</p>
