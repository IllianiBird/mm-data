chassis: "Mechanized Wheeled Platoon (Taurian 3047+)"
model: "(Rifle)"
overview: |-
  <p>The Taurian Defense Force assigns conventional infantry to garrison and planetary defense roles across the Concordat, where citizen-soldiers serve out of patriotic duty rather than mere obligation. Mechanized wheeled platoons offer a balance of speed and economy, their wheeled transports being cheaper to maintain than hover or tracked alternatives. For a military that must stretch limited resources across a significant number of garrison worlds, this cost efficiency matters as much as tactical performance.</p><p>Armed with standard ballistic assault rifles, the most common and affordable infantry weapon in the Inner Sphere, these platoons deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
