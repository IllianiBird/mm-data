chassis: "Grim Reaper"
model: "GRM-R-PR62A"
overview: |-
  <p>The Grim Reaper is a fifty-five-ton medium BattleMech introduced in 3052 as part of ComStar's crash program to rebuild the Com Guards following the devastating Battle of Tukayyid. The staggering losses sustained during that crucial engagement, compounded by defections to the nascent Word of Blake, forced ComStar to establish new BattleMech production capabilities for the first time. Produced at Blankenburg Technologies' plant on Terra, the Grim Reaper was designed as a versatile medium trooper capable of contributing across multiple mission profiles. The design saw service in moderate numbers across both Com Guard and Word of Blake Militia formations throughout its production run.</p>
capabilities: |-
  <p>The Grim Reaper's greatest asset is its balanced weapons array, designed to engage effectively at multiple range brackets. A Blankenburg extended-range large laser and Holly LRM-20 rack provide potent long-range firepower, allowing the design to soften targets at distance or deliver indirect fire support. At closer ranges, a Holly SRM-6 and Blankenburg medium pulse laser deliver concentrated damage, making the Grim Reaper dangerous in brawling engagements. A McArthur II anti-missile system provides an additional layer of protection against incoming missile fire, a valuable defensive asset for a design expected to operate in the thick of combat.</p><p>The design achieves respectable mobility through a Core Tek 275 XL extralight engine, propelling the chassis to a top speed of eighty-six kilometers per hour. This speed, combined with over ten tons of StarGuard ferro-fibrous armor, gives the Grim Reaper reasonable survivability for its weight class. However, the use of an extralight engine is a significant vulnerability, as a critical hit to either side torso will disable the 'Mech entirely. The absence of jump jets further limits tactical flexibility, leaving the design dependent on speed and firepower rather than terrain exploitation.</p><p>Ammunition for both missile systems is stored in a CASE-protected left torso, mitigating the risk of catastrophic ammunition explosions.</p>
deployment: |-
  <p>This Jihad-era field modification strips the standard weapons array in favor of a snub-nose PPC, an MML-9 launcher with configurable ammunition, and an extended-range medium laser. The anti-missile system is retained, while the freed weight allows installation of a targeting computer for enhanced weapons accuracy and seven improved jump jets. The addition of jump capability dramatically transforms the Grim Reaper from a ground-bound trooper into an agile skirmisher, representing a radical departure from the original design philosophy that reflects the desperate improvisation characteristic of many Jihad-era modifications.</p>
history: |-
  <p>The Grim Reaper's origins are inseparable from the political upheaval that fractured ComStar following the Battle of Tukayyid in 3052. For centuries, ComStar had maintained its military strength through carefully preserved Star League-era equipment stored in hidden depots across the Inner Sphere. The massive losses suffered during the Tukayyid campaign, while ultimately a strategic victory, exposed the fundamental fragility of this approach. When the Word of Blake Schism further depleted Com Guard strength through defections, ComStar was compelled to establish indigenous BattleMech production for the first time.</p><p>Blankenburg Technologies' facility on Terra was selected as the cornerstone of this rebuilding effort. The plant, which had served ComStar in various capacities throughout the Succession Wars, was retooled for full BattleMech production, with the Grim Reaper among the first designs to roll off the new lines. Production commenced in 3052, and the design quickly proved itself a reliable and effective trooper 'Mech.</p><p>The few recorded combat actions featuring the Grim Reaper demonstrated its versatility. During Operation Odysseus, remnants of the Com Guards' 201st Division encountered elements of the Shadow Lancers' Alpha Battalion in Central Africa. The engagement showcased the design's mixed-range capability, with multiple Grim Reapers engaging enemy BattleMechs across varying distances while supporting combined-arms operations alongside armor and infantry formations.</p><p>The Word of Blake's seizure of Terra transferred control of the Blankenburg facility to Blakist authority. Rather than discontinue production, the Word of Blake expanded the Grim Reaper program. In late 3065, Precentor Cameron St. Jamais contracted Vicore Industries (the design firm that had gained prominence through the Project Phoenix initiative) to develop upgraded variants. Production of the new PR30 and PR31 models began in early 3066, with the original PR29 continuing in production primarily for sale to mercenary commands. By the summer of 3067, the upgraded variants were expected to fully replace older models in frontline Word of Blake Militia formations.</p><p>All Com Guard and Word of Blake divisions deployed moderate numbers of Grim Reapers during this period, establishing the design as a common sight in both organizations' orders of battle. The Jihad saw continued Grim Reaper deployment across Blakist operations, with field-modified variants appearing as the conflict's desperate conditions drove increasingly creative adaptations of the base chassis. Following the liberation of Terra and the fall of the Word of Blake, the Blankenburg facility passed to Republic of the Sphere authority, though active Grim Reaper production appears to have ceased.</p>
