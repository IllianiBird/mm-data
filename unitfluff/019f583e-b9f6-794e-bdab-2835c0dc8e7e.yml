chassis: "Field Gun demi-I (WOBM)"
model: "(Motorized LBX20)"
overview: |-
  <p>The Word of Blake Militia inherited ComStar's combined-arms organizational philosophy and its Star League-era equipment stocks, fielding infantry formations that ranked among the best equipped in the Inner Sphere during the Jihad. Operating assault-class cluster-munition autocannon, these gun crews bring overwhelming close-range firepower that devastates anything caught in the blast pattern, though the weapon's weight and ammunition consumption limit sustained operations.</p>
