chassis: "Hauptmann"
model: "HA1-OB"
overview: |-
  <p>The Hauptmann is the Lyran Alliance's first domestically designed and manufactured OmniMech, introduced in 3060 by Coventry Metal Works. Drawing inspiration from captured Clan Dire Wolf OmniMechs and leveraging experience gained through licensed production of the Draconis Combine-designed Firestarter OmniMech, Coventry's engineers created a ninety-five-ton assault platform intended to serve as a frontline command machine for Lyran Alliance Armed Forces officers. Archon Katrina Steiner named the design to honor the hauptmanns (company-grade commanders who represent the highest-ranking officers to consistently see combat) reinforcing loyalty within the newly restructured LAAF.</p><p>Despite having ample room for an extralight engine, the Hauptmann deliberately employs a standard fusion powerplant, a design choice that reduced manufacturing costs while dramatically improving battlefield survivability. With forty-three tons of available pod space and a robust chassis, the Hauptmann provides field commanders with a flexible and durable platform capable of adapting to virtually any tactical scenario.</p>
capabilities: |-
  <p>The Hauptmann's Coventry HAI III chassis mounts a Pitban 285 standard fusion engine, providing a top speed of fifty-four kilometers per hour. While this makes the design one of the slower assault OmniMechs in the Inner Sphere, the standard engine ensures the 'Mech cannot be destroyed by a side torso hit, a critical survivability advantage over designs relying on extralight powerplants. Eighteen and a half tons of Glasgow Limited armor provide excellent protection for a design of its weight class, while CASE fixed in the right torso mitigates the risk of catastrophic ammunition explosions. Eleven fixed double heat sinks provide a solid thermal baseline for all configurations.</p><p>The Prime configuration exemplifies the Hauptmann's versatility. Paired ER large lasers deliver effective long-range fire, while an LB 20-X autocannon provides devastating close-range firepower capable of exploiting armor breaches with cluster munitions. Medium pulse lasers, an ER small laser, and Streak SRM-2 launchers complete the close-range arsenal. A Guardian ECM suite disrupts enemy targeting and communications, enhancing the survivability of the Hauptmann and nearby friendly units. Six additional double heat sinks allow the Prime to manage its weapons load with reasonable efficiency, though sustained engagement with the full arsenal still generates problematic heat levels.</p>
deployment: |-
  <p>Alternate Configuration B adopts a multi-range combat philosophy, mounting paired ER PPCs for punishing long-range fire and three medium pulse lasers for close defense. The centerpiece of this configuration is an Ultra Autocannon/20, capable of delivering massive damage at close range with its double-fire capability. However, the configuration sacrifices heat management for raw firepower, carrying only five additional double heat sinks, insufficient for sustained use of the full arsenal. Pilots must exercise strict fire discipline to avoid dangerous heat buildup, particularly when combining the ER PPCs with the autocannon.</p>
history: |-
  <p>The Hauptmann emerged in 3060 as the culmination of the Lyran Alliance's drive to develop indigenous OmniMech production capability. Following the Clan Invasion, the Lyran state recognized the critical need for flexible assault platforms to counter Clan OmniMechs on more equal terms. Coventry Metal Works, which had gained valuable experience producing the Draconis Combine-designed Firestarter OmniMech under a technology-sharing arrangement, leveraged data from captured Clan Dire Wolf OmniMechs to create an entirely Lyran design.</p><p>Archon Katrina Steiner's decision to name the design after the LAAF's company-level commanders was a calculated political move, reinforcing loyalty within the newly restructured military. The first production models were distributed to hauptmanns serving in the showpiece Bolan, Skye, Donegal, Coventry, and Alarion Jaegers regiments, units that embodied the reformed Lyran Alliance Armed Forces. Additional Hauptmanns reached Skye Rangers formations, while Coventry Metal Works retained several units for factory defense and assigned others to garrison forces on Coventry.</p><p>The Hauptmann served throughout the FedCom Civil War, where its durability and flexibility proved valuable in the bitter fighting between Lyran loyalist and Federated Suns-aligned forces. The design's standard engine and heavy armor made it particularly resilient in the attritional campaigns that characterized the conflict. Production continued at the Coventry Metal Works facility through the Civil War era.</p><p>The Word of Blake Jihad devastated the Lyran military-industrial complex, and Coventry's factories suffered under the upheaval. Production of the Hauptmann ceased in the wake of the Jihad and Devlin Stone's subsequent military reduction programs. As the Republic of the Sphere era gave way to the renewed conflicts of the Dark Age, Coventry Metal Works explored reviving the design with upgraded Clan-grade double heat sink technology, only to be rebuffed by overstretched domestic Lyran ClanTech manufacturers. Clan Sea Fox's ilKhanate eventually learned of these difficulties through the Chatterweb and brokered a deal under Project Reynard between CMW, Free Worlds League-based Technicron Manufacturing, and Clan Sea Fox to produce the Regent, a ninety-ton purely Clan-technology OmniMech intended as the Hauptmann's spiritual successor.</p><p>Despite the Regent's development, the Hauptmann itself remained in service with Lyran units that had maintained their existing machines through decades of conflict. New configurations incorporating mixed Inner Sphere and Clan technology continued to appear during the Dark Age and into the ilClan era, demonstrating the enduring adaptability of Coventry Metal Works' original design.</p>
