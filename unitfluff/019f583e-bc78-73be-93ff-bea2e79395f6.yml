chassis: "Field Gun Platoon (FWLM)"
model: "(Wheeled UAC5 3040+)"
overview: |-
  <p>The Free Worlds League's fractious politics have always made centralized BattleMech procurement difficult, pushing the FWLM toward heavy investment in conventional infantry to fill the gaps. Towing crew-served Ultra autocannon/5, these platoons exploit the Ultra mechanism's double-fire capability to deliver punishing volumes of medium-caliber fire, though the jamming risk under rapid fire is a known hazard.</p>
