chassis: "Porcupine"
model: "PRC-3N"
overview: |-
  <p>The Porcupine was introduced in 3063 by the Solaris VII-based design firm Innovative Design Concepts as a highly specialized BattleMech built exclusively for the arenas. Billed as a "speed demon with attitude," the twenty-ton Porcupine fills the unusual niche of a lightweight charge specialist, designed from the ground up with the Class Two divisions of the Solaris circuit in mind. While critics have derided the concept as impractical, labeling it a "spinning ball of doom," the Porcupine represents one of the most audacious approaches to arena combat ever attempted. IDC has continued refining the concept across multiple variants spanning decades of development.</p>
capabilities: |-
  <p>Unlike conventional light BattleMechs designed for scouting or patrol duties, the Porcupine exists solely to close with its opponent at maximum speed and deliver a devastating physical attack. Its Edasich Motors 180 XL engine propels the twenty-ton frame to speeds approaching 151 kilometers per hour, and with its experimental supercharger engaged, the Porcupine can reach nearly 194 kilometers per hour in open terrain. Built on an IDC-PRC01 Lite endo steel chassis and clad in Lexington Limited High Grade ferro-fibrous armor embedded with reinforced spikes, the entire machine effectively becomes a weapon during a charge.</p><p>The Porcupine's conventional armament consists of just four Defiance B3M medium lasers, intended primarily to soften an opponent's armor before the decisive ramming attack. The design philosophy trades ranged combat effectiveness for durability in the close-range arena environment, where extreme speed and spike-enhanced physical attacks can doom even heavier opponents. The greatest weakness of this approach remains survivability, the light, fragile Porcupine must endure incoming fire long enough to set up its devastating charge, and even a successful strike risks destroying the 'Mech in the process.</p>
deployment: |-
  <p>Beginning development in 3132, this variant represents IDC's ambitious attempt to evolve the Porcupine from an arena curiosity into a viable battlefield machine. This variant abandons all ranged weaponry entirely, instead relying on a 180-rated XXL engine boosted by both a supercharger and MASC to achieve extraordinary closing speeds. Impact-resistant armor replaces the original ferro-fibrous plating, helping prevent the 'Mech from destroying itself during a charge, while a null-signature system renders the Porcupine difficult to detect until it is too late. A laser anti-missile system provides some defensive capability during the approach. The result is a twenty-ton 'Mech costing as much as three modern Panthers, with no ranged capability whatsoever and maintenance requirements three times that of a typical light design. As of the project's trial phase, IDC has found no buyers willing to commit to production orders.</p>
history: |-
  <p>The Porcupine emerged from Innovative Design Concepts, one of many small BattleMech design firms operating on Solaris VII during the height of the arena circuit's popularity in the 3060s. IDC, especially the only Solaris design firm listed on the Lyran Alliance stock exchange as of 3067, created the Porcupine as its first experimental BattleMech, deliberately targeting the lightweight Class Two divisions where unconventional designs could find success.</p><p>Initial deployment yielded mixed results. The first major customer, Zelazni Stables, purchased two Porcupines and became the first stable to field the design in real competition. However, a less-than-stellar performance during a grudge match against Tandrek Stables left Zelazni reportedly looking to offload its remaining machine, casting doubt on the Porcupine's viability even within the specialized arena environment it was designed for.</p><p>Despite this rocky start, IDC continued refining the concept. The PRC-2N variant appeared in 3067, trading the original's charge-oriented design for a close-quarters laser barrage approach that retained much of the Porcupine's outward appearance. IDC's engineers remained convinced that targeted improvements could transform the concept from arena novelty into something with broader military applications.</p><p>This conviction ultimately led to the PRC-3N project, begun in 3132 during the upheaval following Gray Monday and the collapse of the HPG network. The design attempted to make the Porcupine viable on the open battlefield through impact-resistant armor, stealth systems, and extreme speed enhancements. However, the astronomical cost (comparable to three modern Panthers) and the complete absence of ranged weaponry proved insurmountable obstacles. A careful analysis concluded the design amounted to an 11.5-million C-bill gamble on a single charging attack. No buyer has proceeded beyond initial trials, though IDC reportedly remains undaunted in their pursuit of the concept.</p>
