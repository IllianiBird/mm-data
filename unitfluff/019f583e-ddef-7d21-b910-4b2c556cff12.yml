chassis: "Dig King"
model: "RCL-1 MiningMech MOD"
overview: |-
  <p>The Dig King is one of the earliest known MiningMech designs in the Inner Sphere, introduced in 2573 during the early Star League era by Achernar BattleMechs. Designed as a light thirty-five-ton IndustrialMech purpose-built for underground tunnel mining, the Dig King established Achernar as a leading manufacturer of industrial designs alongside its better-known BattleMech lines. The durable and dependable chassis proved enormously popular with mining operations across the Terran Hegemony and later the wider Inner Sphere, its rugged construction allowing it to endure the punishing conditions of subterranean extraction work for decades with minimal maintenance.</p><p>The Dig King's success spawned an entire family of derivative designs over the centuries, from Achernar's own heavy-class Dig Lord to numerous third-party imitations produced by companies throughout the Inner Sphere and Periphery. The widespread availability of the Dig King's specifications only accelerated this proliferation, making the MiningMech family one of the most common industrial chassis types found on inhabited worlds.</p>
capabilities: |-
  <p>The Dig King is a straightforward mining platform built around simplicity and reliability rather than sophistication. Its primary working tools consist of a mining drill mounted in place of the left hand actuator and a rock cutter assembly replacing the right hand actuator, giving operators effective cutting and boring capability for tunnel excavation. A lift hoist mounted in the left torso allows the 'Mech to haul ore, debris, or equipment, making it a self-sufficient extraction unit that can cut, break, and move material without requiring additional support vehicles.</p><p>Powered by a modest fuel cell engine that propels the thirty-five-ton chassis to a maximum speed of fifty-four kilometers per hour, the Dig King prioritizes endurance over speed. Heavy industrial armor protects the frame from the constant impacts and abrasion of mining operations, though this protection is minimal by military standards. The design lacks any form of weapons or targeting systems in its base configuration, reflecting its purely civilian purpose. This simplicity, however, proved to be an unexpected asset, the uncomplicated systems and readily available components made the Dig King easy to maintain even during the technological decline of the Succession Wars, ensuring its continued production when more complex designs faltered.</p>
deployment: |-
  <p>First appearing during the Succession Wars around 2802, the RCL-1 MOD represents one of the earliest standardized militarized MiningMech conversions. The modification replaces the lift hoist with two SRM-4 launchers and a ton of ammunition, while a pair of machine guns with ammunition replace the left arm mining drill. The rock cutter is retained for close combat. This pattern of adding missiles and machine guns to an industrial chassis became the template for countless subsequent MiningMech conversions, and the Dig King MOD saw service with various factions, militias, and garrison forces throughout the Succession Wars and beyond.</p>
history: |-
  <p>The Dig King first appeared on Cahokia in the late twenty-sixth century, quickly establishing itself as a mainstay of mining operations across the Terran Hegemony. Achernar BattleMechs produced the design continuously at their facility on Achernar, and the chassis earned a reputation for exceptional durability that kept it in service long after more advanced industrial designs became available. During the Star League era, the Dig King could be found on mining worlds throughout the Inner Sphere, its simple construction making it accessible to operations of all sizes.</p><p>The Succession Wars transformed the Dig King from a purely civilian machine into an unlikely combatant. As the devastating conflicts depleted BattleMech stockpiles and shattered industrial capacity, desperate commanders and militia forces began converting available IndustrialMechs for military use. The Dig King's rock cutter and mining drill, while crude weapons, could inflict serious damage on infantry and light vehicles. Militarized variants appeared as early as 2802, armed with missile launchers and machine guns in place of mining equipment, and saw service with various factions, planetary militias, and garrison forces throughout the Succession Wars period.</p><p>The factory on Achernar changed hands multiple times over the centuries, passing from the Terran Hegemony through various Successor State owners including the Capellan Confederation, Federated Suns, and Federated Commonwealth. During the Jihad, the Word of Blake seized control of Achernar, and the Republic of the Sphere subsequently administered the facility during the early Dark Age. A civilian renaissance in the late 3090s through mid-3130s saw widespread peacetime use of the Dig King across the Inner Sphere, but the chaos following Gray Monday in 3132 once again drove conversion of these mining 'Mechs into makeshift combat platforms, as splinter groups and local defense forces scrambled to arm themselves after the collapse of the HPG network.</p>
