chassis: "Motorized Triplus Contubernium (MHAF)"
model: "(Rifle)"
overview: |-
  <p>Infantry within the Legiones Marianes form the backbone of planetary garrison and territorial defense, freeing the Hegemony's limited BattleMech assets for offensive operations and prestige assignments. A triplus contubernium, or triple tent-group, combines three squads of ten soldiers mounted on light vehicles. Motorized triplus contubernia provide fast-moving infantry support for Marian armored columns and conduct sweeps across open terrain where foot infantry cannot keep pace. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon available, these formations deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
