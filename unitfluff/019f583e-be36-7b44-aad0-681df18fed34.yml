chassis: "Field Gun Century (MHAF)"
model: "(Motorized Light Cannon)"
overview: |-
  <p>The Marian military tradition places infantry at the foundation of its legionary system, with conventional soldiers organized into units bearing Latin designations that reflect the Hegemony's deliberate cultivation of Roman imperial identity. Marian field gun centuries tow crew-served weapons on wheeled, tracked, or motorized carriages, providing direct-fire anti-armor capability that supplements the Legiones Marianes' limited BattleMech strength. The century's weapon is a light cannon, a simple direct-fire piece that provides basic anti-vehicle capability using readily available ammunition.</p>
