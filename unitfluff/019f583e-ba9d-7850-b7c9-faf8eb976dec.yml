chassis: "Mechanized Wheeled Level I (WOBM)"
model: "(Flamer)"
overview: |-
  <p>The Word of Blake Militia inherited ComStar's combined-arms organizational philosophy and its Star League-era equipment stocks, fielding infantry formations that ranked among the best equipped in the Inner Sphere during the Jihad. Mechanized wheeled Level I formations used wheeled APCs for efficient patrol and garrison operations on developed worlds within the Protectorate. Their lower maintenance burden compared to tracked or hover transports made them the most common mechanized infantry type in the Word of Blake Militia's order of battle. Armed with man-portable flamers that project streams of ignited fuel, these troops carry one of the most psychologically devastating weapons available to conventional infantry, effective at clearing fortified positions and enclosed spaces at the cost of extreme danger to the operator.</p>
