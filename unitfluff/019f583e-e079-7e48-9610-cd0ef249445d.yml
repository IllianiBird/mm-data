chassis: "Gunsmith"
model: "CH11-NGC 'Cinderella'"
overview: |-
  <p>The Gunsmith is a twenty-five-ton light BattleMech introduced in 3131 by Jalastar Aerospace at their facility on Panpour. Designed as a high-speed pursuit and raiding platform for the Armed Forces of the Federated Suns, the Gunsmith entered service with the AFFS just prior to the HPG Blackout, a timing that proved unfortunate for Jalastar's marketing efforts. The war-ridden aftermath of that event left many procurement officers reluctant to invest in such an expensive light chassis, though units that reached the front quickly silenced their critics.</p><p>Despite initial resistance to its price tag, the Gunsmith demonstrated its worth as a devastatingly fast striker that packs considerably more firepower and protection than most machines in its weight class. Jalastar's gamble on cutting-edge weight-saving technology earned the Gunsmith a fearsome reputation among Davion raider and pursuit lances.</p>
capabilities: |-
  <p>The Gunsmith's design philosophy centers on speed and concentrated energy firepower at the expense of operational endurance. A PlasmaStar 250 XXL engine drives the chassis at a cruising speed of one hundred and eight kilometers per hour, while a Myomer Accelerator Signal Circuitry system pushes the top speed beyond two hundred and sixteen kilometers per hour in combat sprints. This extraordinary mobility makes the Gunsmith one of the fastest BattleMechs fielded during the Dark Age, capable of running down virtually any target or disengaging from unfavorable encounters at will.</p><p>The Jalastar Mk.V-CH7 endo steel chassis and an extra-light gyroscope free enough tonnage to mount five and a half tons of StarGuard reflective armor, providing above-average protection against energy weapons for a light 'Mech. Four Martell-X medium X-Pulse lasers, paired in each arm, deliver punishing accuracy at short to medium ranges, though sustained fire generates considerable heat. This heat burden, compounded by aggressive use of the MASC system, represents the Gunsmith's primary operational limitation, occasionally forcing MechWarriors to temper their aggression or risk overheating at critical moments. A Full-Head Ejection System provides pilots an additional margin of safety befitting the chassis's high-risk combat profile.</p>
deployment: |-
  <p>First debuting at the New Hartford Gardens arena on Solaris VII in 3138, this custom variant was developed for Team Godmother's competitive circuit appearances. Classified as a mixed Inner Sphere experimental design, the configuration replaces the standard powerplant with a smaller 200-rated extra-light engine, reducing top speed but freeing tonnage for Clan-specification equipment. Four Clan ER medium pulse lasers replace the original Martell-X weapons, delivering superior range and accuracy, while a Clan-built laser anti-missile system provides point defense capability. Clan-grade reflective armor further enhances protection against energy weapon fire. Though slower than the production Gunsmith, the configuration's enhanced hitting power and defensive systems have proven well-suited to the controlled engagements of the Solaris arenas.</p>
history: |-
  <p>The Gunsmith's development at Jalastar Aerospace's Panpour facility represented an ambitious attempt to field a next-generation light pursuit 'Mech for the Federated Suns at a time when the Inner Sphere stood on the brink of unprecedented upheaval. Entering service in 3131, the design arrived just before the HPG Blackout severed interstellar communication across the Inner Sphere, leaving Jalastar's planned marketing campaign in ruins. In the chaotic aftermath, many AFFS procurement officers balked at the Gunsmith's considerable price tag, driven primarily by the cost of its rare extra-extralight engine technology. Yet, the 'Mechs that did reach frontline units quickly silenced their critics through outstanding combat performance.</p><p>Gunsmiths earned a fearsome reputation during the invasions that swept through Davion space in the Dark Age. Assigned to already-aggressive MechWarriors, the sense of outrage most Davion pilots felt during this period only heightened their combat ferocity. The Davion Light Guards demonstrated the Gunsmith's raiding potential to devastating effect on Brookeland, where a lance of Gunsmiths under Leftenant Arbotov conducted extended operations behind enemy lines. Over two weeks, the strike lance hit isolated outposts, destroyed supply convoys, and called in air strikes on enemy aerospace assets. When Ghost BattleMechs dedicated a full battalion to hunting the lance, the Gunsmiths proved adept at luring away their pursuers' fastest units and ambushing them in detail.</p><p>During the early fighting on Robinson, Gunsmiths proved instrumental in several critical engagements against Combine forces. When a Davion company was overrun by elements of the Seventh Sword of Light, a reaction lance of four Gunsmiths arrived in time to prevent the capture of their commanding officer, concentrating their fire on enemy 'Mechs with lethal precision. The combination of extreme speed and accurate pulse laser fire allowed the Gunsmiths to engage heavier opponents on their own terms, striking hard and withdrawing before effective return fire could be organized.</p><p>Beyond its military deployments, the Gunsmith's speed and compact firepower have attracted attention on the Solaris VII competitive circuit, where customized variants have appeared in arena combat. The design's continued production at the Jalastar Aerospace facility on Panpour ensures a steady supply of new frames for both AFFS garrison units and the mercenary market, though procurement remains limited by the ongoing cost concerns that have dogged the chassis since its introduction.</p>
