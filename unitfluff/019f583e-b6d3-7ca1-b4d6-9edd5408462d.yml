chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled Gauss 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing infantry-scale gauss cannon that propel slugs at hypersonic velocities, these field gun crews deliver the longest-ranged and most accurate direct fire available to conventional ground forces.</p>
