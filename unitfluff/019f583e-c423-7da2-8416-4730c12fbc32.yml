model: "Prime"
overview: |-
  <p>The Dire Wolf was introduced in 3010 as the brainchild of the Clan Wolf scientist caste, conceived as the "Ultimate Assault OmniMech." Before Clan Wolf could begin production, however, Clan Smoke Jaguar warriors learned of the project and seized the design through a Trial of Possession fought on the boundaries of zellbrigen, a trial rumored to have been conducted dishonorably. Production commenced at the Phan Industriplex on Huntress, giving the Smoke Jaguars first claim to one of the most devastating war machines ever fielded. The hundred-ton behemoth earned the Inner Sphere codename "Daishi," pseudo-Japanese for "Great Death," bestowed by the criminal underworld of the Draconis Combine upon first encountering the OmniMech during the Clan Invasion. The name proved grimly prophetic as the Dire Wolf became one of the most feared assault platforms in known space, capable of carrying over fifty tons of pod-mounted weaponry into battle.</p>
capabilities: |-
  <p>The Dire Wolf's design philosophy is straightforward: sacrifice speed for an unparalleled volume of firepower. Powered by a Starfire 300 XL engine, the chassis manages only 54 kph at full stride, matching the ponderous gait of an Atlas. What it surrenders in mobility, however, it reclaims through sheer destructive potential. With 50.5 tons of available pod space (more than any other OmniMech in common production) the Dire Wolf can mount weapon loadouts that rival entire lances of lighter designs. Nineteen tons of Compound 12B2 Standard armor provide protection equivalent to the heaviest Inner Sphere assault 'Mechs, ensuring the Dire Wolf can absorb considerable punishment while closing to effective range.</p><p>In its Prime configuration, the Dire Wolf pairs four ER large lasers with two Ultra Autocannon/5s and an LRM-10 for devastating long-range engagement capability, supported by four medium pulse lasers for close-quarters defense. The sheer variety of available configurations reflects the design's extraordinary flexibility, from the Gauss rifle-armed Alternate Configuration A to the HAG 40-equipped Alternate Configuration D, each loadout transforms the chassis into a fundamentally different battlefield threat. Heat management remains the primary constraint across all configurations, as even the most generous heat sink allocations struggle to keep pace with the firepower the Dire Wolf can bring to bear.</p>
deployment: |-
  <p>This variant configuration establishes the Dire Wolf as a multi-range fire platform of extraordinary lethality. Four ER large lasers deliver punishing damage at extreme distances, while two Ultra Autocannon/5s supplement this direct fire capability with high-volume ballistic support. An LRM-10 launcher provides indirect fire options, and four medium pulse lasers ensure that enemies closing to short range face withering defensive fire. Twenty-two double heat sinks struggle to manage the tremendous heat output, demanding disciplined fire rotation from the MechWarrior to avoid catastrophic shutdown.</p>
history: |-
  <p>The Dire Wolf's history is inseparable from the rivalry between Clans Wolf and Smoke Jaguar. When the Jaguars seized the design in 3010, Clan Wolf's honor demanded a response, but ilKhan action and political considerations initially stayed their hand. It was not until 3019 that Star Colonel Ulric initiated a Trial of Possession specifically for manufacturing rights, which he won decisively. Clan Wolf subsequently established production at Wolf Clan Site #1 on Strana Mechty, breaking the Jaguar monopoly on the chassis. Other Clans could acquire the Dire Wolf only through trade, as isorla, or through individual Trials, a limitation that kept the design concentrated primarily among the Wolves and Jaguars for decades.</p><p>The Clan Invasion of 3049 brought the Dire Wolf to the Inner Sphere in terrifying fashion. Smoke Jaguar forces employed the OmniMech as a spearhead against Draconis Combine defenses, where its devastating firepower earned the Daishi name that would become synonymous with Clan assault doctrine. The battles of Luthien and Huntress represented the golden era of Dire Wolf deployment, where massed formations of the hundred-ton OmniMechs shattered defensive lines through sheer weight of fire.</p><p>Wolf's Dragoons, leveraging technical information provided by Khan Kerlin Ward, began limited manufacturing of the Dire Wolf at Blackwell Corporation on Outreach in the late 3040s. This represented the only Inner Sphere production of the chassis, though the facility's output remained modest compared to the Clan homeworld factories. The destruction of the Phan Industriplex on Huntress in 3060 during Operation BULLDOG eliminated the original Smoke Jaguar production line, while the Wars of Reaving disrupted Clan Wolf's homeworld manufacturing on Paxon.</p><p>The aging OmniMech has been eclipsed in some roles by newer designs such as the Tomahawk, yet the Dire Wolf continues to inspire dread on battlefields across the Inner Sphere and Clan occupation zones alike. Against the defending Turkina Keshik on Skye, Dire Wolfs of the Ninth Wolf Guard Striker Cluster demonstrated both the design's enduring strengths and its persistent vulnerability to fast-moving opponents, while the heavy OmniMechs fared well at range against Jade Falcon forces, they suffered heavy losses when lighter Shrikes and Flamberges closed to exploit the Dire Wolf's poor maneuverability.</p><p>Clan Hell's Horses recognized the continued value of the design and brought the Dire Wolf back into active production at Svarstaad Industriplex Delta on Svarstaad in 3149, introducing new configurations optimized for the ilClan era. This renewal of manufacturing has ensured that the Dire Wolf remains a relevant battlefield presence well into the thirty-second century, evidence of the fundamental soundness of Clan Wolf's original design philosophy.</p>
