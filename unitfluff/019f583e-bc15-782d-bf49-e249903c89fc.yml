chassis: "Mechanized Tracked Platoon (DCMS)"
model: "(PPC 3075+)"
overview: |-
  <p>The Combine's martial traditions extend beyond the BattleMech cockpit, and the Dictum Honorium demands that all citizens contribute their talents to the defense of House Kurita. Infantry soldiers of the DCMS embody that expectation on garrison worlds across the realm. Tracked mechanized infantry ride armored carriers that can cross rough ground where wheeled vehicles cannot follow. The DCMS values these platoons for operations on worlds with poor road infrastructure, where the broken terrain that stops lighter transport is simply another day's march for tracked APCs and the soldiers they carry. Their support squads operate semi-portable particle projection cannons, among the heaviest energy weapons that conventional infantry can bring to the field. A single hit from a support PPC delivers damage comparable to light BattleMech-scale weapons, giving these platoons a punch far above their weight class.</p>
