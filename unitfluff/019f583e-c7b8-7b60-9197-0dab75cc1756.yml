chassis: "Great Turtle"
model: "GTR-1"
overview: |-
  <p>The Great Turtle is a one-hundred-ton quad BattleMech produced by Vining Engineering and Salvage Team on Solaris VII, entering production in 3067. Born from VEST's analysis of MechWarrior casualty data, the design was conceived as a radical experiment in pilot survivability above all else. Rather than pursuing offensive firepower, VEST took a fundamentally different approach, creating a 'Mech that could absorb punishment that would destroy conventional assault designs while keeping its pilot alive. The Great Turtle earned a reputation as one of the most heavily protected BattleMechs ever produced, though its extreme defensive focus comes at the cost of the offensive capability expected from a machine of its tonnage.</p>
capabilities: |-
  <p>The Great Turtle's defensive philosophy permeates every aspect of its design. At its core, the 'Mech employs a Corean Model 202BLP Endo Steel quad chassis mounting 40.5 tons of StarSlab/Hardened Mk III armor, effectively doubling its protection compared to standard plate of equal weight. Beyond the armor, VEST incorporated a torso-mounted cockpit that eliminates the vulnerability of a head-mounted pilot compartment, while a compact gyro reduces the risk of catastrophic stability failures. The standard Vlar 300 engine avoids the explosive vulnerability of extralight designs, ensuring that only the most thorough destruction of the center torso can bring the Great Turtle down.</p><p>Offensively, the Great Turtle is deliberately underarmed for its weight class. A single Sutel Precision Line Large X-Pulse Laser serves as the primary weapon, supported by three Medium X-Pulse Lasers, all linked to a targeting computer that compensates for the limited number of weapons with exceptional accuracy. Three HildCo Model 13 jump jets provide surprising mobility for such a massive machine, allowing it to reposition or navigate difficult terrain at ninety meters per bound. The design's primary weakness is its slow cruising speed of just 32 kph, making it vulnerable to flanking maneuvers and unable to dictate engagement range against faster opponents.</p>
deployment: |-
  <p>This variant represents VEST's original vision for the Great Turtle, pairing maximum passive armor protection with precision energy weapons in a package designed above all to keep its pilot alive. As the base production model, this variant trades most of the offensive capability expected from an assault 'Mech for a near-impervious defensive shell, relying on accurate fire from a small number of weapons rather than volume of firepower. The design generated significant interest from buyers seeking a durable command platform or objective holder, though its severe speed limitations restrict it to defensive and positional roles rather than offensive operations.</p>
history: |-
  <p>The Great Turtle's development was driven by a grim statistical reality that emerged during the FedCom Civil War. VEST engineers spent extensive time studying combat reports from that conflict, and the data painted a disturbing picture: MechWarrior life expectancy had steadily decreased over the preceding two decades. The proliferation of advanced weapons technology recovered from the Helm Memory Core meant that more and more 'Mechs were being destroyed in combat by single devastating hits, driving instant pilot kill ratios to alarming levels. VEST's response was to create a machine that prioritized pilot survival above all other considerations.</p><p>Production began on Solaris VII in 3067, with the Great Turtle initially proving itself in the arenas that had long served as VEST's primary proving ground. The design drew public attention when its test pilot won three consecutive registered matches at Bromley Stables, including a notable victory against a <i>Sasquatch</i> despite the Great Turtle's significant speed and firepower disadvantages. These arena successes demonstrated the viability of VEST's extreme defensive design philosophy and sparked broader interest in the concept.</p><p>The VEST factory on Solaris VII operated under Lyran Commonwealth authority during the Great Turtle's initial production run, with active manufacturing confirmed during the late Civil War period. The world's complex ownership history (having passed through Free Worlds League, Lyran, and Federated Commonwealth control over the centuries) meant that VEST operated within whatever political framework currently governed the famed gaming world. Production appears to have been limited in scale, constrained by both the niche nature of the design and the disruptions of the Jihad that followed shortly after the GTR-1's introduction.</p><p>By the Dark Age, Solaris VII had fallen under Clan Wolf control, though records do not indicate continued Great Turtle production under the new regime. The design remains a notable curiosity in BattleMech history, a radical experiment in survivability that challenged conventional assumptions about the balance between offense and defense in assault 'Mech design. Whether VEST's philosophy will find renewed interest as warfare continues to evolve remains to be seen.</p>
