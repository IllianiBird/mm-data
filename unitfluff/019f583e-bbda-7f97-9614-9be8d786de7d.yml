chassis: "Foot Platoon (DCMS)"
model: "(SRM 2620+)"
overview: |-
  <p>The Combine's martial traditions extend beyond the BattleMech cockpit, and the Dictum Honorium demands that all citizens contribute their talents to the defense of House Kurita. Infantry soldiers of the DCMS embody that expectation on garrison worlds across the realm. Foot infantry are the cheapest troops the DCMS can field, and the Combine fields them in enormous numbers. Every military district maintains garrison formations whose sole purpose is holding ground that BattleMech regiments cannot occupy permanently. Slow and vulnerable in open terrain, these soldiers prove their worth through discipline and endurance, standing post on worlds across the Combine because the Dragon demands nothing less. Support elements carry man-portable short-range missile launchers that fire the same warheads used by BattleMechs and combat vehicles. At close range, a well-aimed SRM can crack vehicle armor that personal weapons cannot scratch, giving the platoon a meaningful anti-armor capability.</p>
