overview: |-
  <p>The Revenant is a 30-ton quadrupedal drone BattleMech with origins rooted in the Word of Blake's desperate final defense of Terra during the Jihad. First appearing in 3075, the original UBM-1A was an autonomous unmanned 'Mech produced at the Devil's Peak Production Site, designed to bolster ground defenses against the allied coalition assault on the Terran system. Controlled by a robotic cockpit rather than a human pilot, the Revenant filled the role of a cheap, expendable sentry capable of engaging infantry and light armor in large numbers.</p><p>The concept was later recovered and refined by the Republic of the Sphere into the UBM-2R series, transforming a crude Blakist weapon into a practical, inexpensive defensive asset. The Revenant represents one of the few successful implementations of fully autonomous BattleMech technology in the post-Jihad era.</p>
capabilities: |-
  <p>The Revenant is slower than most modern light 'Mechs, with its GM 180 engine providing a top speed of only 97 kph, but compensates with durability that belies its weight class. Built on a Spectre IV-Gamma endo steel frame, the UBM-2R mounts a respectable amount of Strasbourg Armaments Type 3 standard armor for a 30-ton design, allowing it to absorb considerable punishment and still return to base. The lack of jump jets limits its tactical flexibility in rough terrain, though its quad configuration provides superior stability on uneven ground.</p><p>The primary UBM-2R configuration carries four Martell extended range medium lasers paired with four MainFire light machine guns, giving the drone effective anti-infantry and anti-armor capability at medium range. The laser-heavy loadout eliminates ammunition dependency for its primary weapons, an important consideration for an autonomous unit operating without logistical support. While the Revenant cannot match dedicated combat 'Mechs in a stand-up fight, its combination of toughness, low production cost, and drone operation makes it ideally suited for nighttime patrols, sentry duty, and raiding operations where risking a human pilot would be unacceptable.</p>
deployment: |-
  <p>The original Revenant, this variant first appeared in Word of Blake forces throughout the Terran system in 3075. Armed with two extended range medium lasers, two medium pulse lasers, and four light machine guns split evenly between its torso sections, the design was intended primarily to deter infantry and light armor. Controlled by a robotic cockpit, this variant was notoriously clumsy and prone to erratic behavior, particularly when subjected to electronic countermeasures. It fought without regard for tactics or self-preservation, leading coalition forces to initially suspect the drones were a new form of Manei Domini. The production lines were destroyed during the fighting at Devil's Peak, and a Blakist computer virus subsequently wiped all schematics and programming data.</p>
history: |-
  <p>The Revenant's origins trace to the final, desperate years of the Jihad, when the Word of Blake began fielding autonomous drone 'Mechs to supplement their dwindling conventional forces defending the Terran system. In 3075, allied coalition forces first encountered the quadrupedal drones during the assault on Terra, Mars, and Luna. Intelligence operatives initially could not identify the source of the unfamiliar unmanned BattleMechs, and it was not until coalition troops overran Cameron St. Jamais' command post at Devil's Peak in North America that the manufacturing facility was discovered. The Revenant was the most numerous of at least three robotic 'Mech designs produced at the site.</p><p>Despite being deployed in significant numbers, the Revenant proved to be more of a nuisance than a genuine threat. Its erratic behavior under ECM exposure and complete disregard for tactical principles made individual drones easy to dispatch. However, the sheer volume of Revenants, combined with their unfamiliar quadrupedal design, occasionally gave coalition attackers pause and forced them to divert resources from more critical objectives. The fighting at Devil's Peak ultimately destroyed the production lines, and a Word of Blake computer virus erased all design schematics and programming specifications, seemingly ending the program.</p><p>The concept was not forgotten, however. ComStar had experimented with similar drone technology alongside programs like the Celerity before the organization's disarmament, and the Republic of the Sphere inherited both the research and the recovered Blakist hardware. Following the activation of Fortress Republic in 3136, Republic Armed Forces scientists at the Manufacturing Center Providence on Terra began developing the UBM-2R series, replacing the original's crude robotic cockpit with a more capable Drone Operating System. Production began around 3139, yielding a family of specialized variants optimized for different tactical roles.</p><p>Within the Fortress, Revenants have served on a number of RAF raids against hostile forces, exploiting the advantage that enemies who have not faced drone 'Mechs since the Jihad have no idea what they are confronting. Elements of the XIV Principes have deployed Revenants in spoiling attacks, where mixed formations of combat and fire support variants have successfully raided Capellan Confederation resupply points and engaged hovertank companies under cover of darkness. The drones' willingness to execute anti-capture protocols and their indifference to personal risk have made them particularly effective in night raids and operations where the loss of a human pilot would be strategically unacceptable.</p>
