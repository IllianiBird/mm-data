chassis: "Masauwu"
overview: |-
  <p>The Masauwu is a seventy-five-ton heavy BattleMech developed by Clan Coyote during the early Golden Century. Named after the Hopi Spirit of Death by the Coyote scientists who recovered its Star League Defense Force prototype plans following Operation Klondike, the design was conceived as a close-combat dueling machine. Designed to bring parity between Clan Coyote and their faster-growing rivals such as Clans Wolf and Smoke Jaguar, the Masauwu represented the Coyotes' determination to field competitive heavy designs. Built by Coyote Industrial on Babylon, the Masauwu earned a reputation as a formidable Trial combatant, though it saw only limited production before shifting Clan priorities overtook its place in the touman.</p>
capabilities: |-
  <p>Built on a Viper NK12 Endo Steel frame and powered by a 300-rated XL fusion engine, the Masauwu achieves a respectable top speed of sixty-four kilometers per hour for a design of its tonnage. Four Coyote Leapers jump jets provide a hundred and twenty meters of jump capability, granting tactical flexibility on broken terrain that offsets the chassis's relatively modest ground speed. Series Ab armor provides solid protection for sustained engagements.</p><p>The Masauwu's armament reflects the emerging Clan preference for short, decisive combat consistent with zellbrigen traditions. A pair of Kolibri Delta Series large pulse lasers mounted in the left arm deliver devastating accurate fire at close range, while a Type KOV LB-X 10 autocannon in the right arm offers versatility against both hardened and dispersed targets. Two Pattern 2J Streak SRM-2 launchers capitalize on openings created by the primary weapons, and a Shield-1 anti-missile system enhances survivability on missile-saturated battlefields. A single Series 1 extended-range small laser rounds out the arsenal for point defense. The combination of heavy close-range firepower, jump capability, and anti-missile protection made the Masauwu a formidable dueling platform, though its lack of meaningful long-range engagement capability limited its usefulness outside of Trial combat.</p>
deployment: |-
  <p>No factory variants of the Masauwu are known to exist. The design was produced as a single configuration reflecting Clan Coyote's original Golden Century specifications, with the chassis seeing only limited production at the Coyote Industrial facility on Babylon before the Clan's interest shifted toward more modern OmniMech platforms. Surviving examples remained in second-line service, their loadout unchanged from the original design.</p>
history: |-
  <p>The Masauwu was designed and built during the early years of the Golden Century, a period when the newly established Clans were rapidly developing their military capabilities from recovered Star League technology. Clan Coyote, seeking to offset the numerical and industrial advantages enjoyed by Clans Wolf and Smoke Jaguar in the wake of Nicholas Kerensky's death, invested heavily in building competitive BattleMech designs. The Masauwu was among these early efforts, combining the best available technology into a platform optimized for the ritualized combat trials that defined Clan warfare.</p><p>The design proved its worth during a notable engagement on Tamaron in 2834, when a Clan Mongoose force launched an assault against a Coyote agricultural enclave. The resulting Trial demonstrated the Masauwu's effectiveness in close combat, as Coyote warriors used the 'Mech's jump capability and anti-missile systems to neutralize the faster Mongoose machines in a protracted engagement near the planet's equatorial desert. The battle showcased the design's strengths in chosen terrain where its jump jets and heavy close-range firepower could be leveraged to maximum advantage.</p><p>Despite this early success, the Coyotes soon lost interest in producing conventional BattleMechs as OmniMech technology matured and came to dominate Clan military doctrine. The Masauwu saw diminishing production and was eventually sidelined in favor of more flexible platforms. By the time of the Clan Invasion of the Inner Sphere, the Masauwu had largely faded from frontline Coyote toumans, relegated to garrison duty or second-line formations where it still served adequately but without distinction. The design's legacy persists primarily through its Inner Sphere descendant, the War Dog, which achieved far greater fame and production numbers than its Clan predecessor.</p>
