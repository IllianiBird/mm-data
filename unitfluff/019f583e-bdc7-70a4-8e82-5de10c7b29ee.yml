chassis: "Jump Platoon (LCAF)"
model: "(SRM 3058+)"
overview: |-
  <p>The Lyran Commonwealth's industrial wealth ensures its infantry are among the best-equipped in the Inner Sphere, fielding hardware that most armies reserve for elite formations as standard issue. Jump infantry use thruster backpacks to leap across obstacles and reposition rapidly on the battlefield, trading platoon size for the tactical mobility to seize or defend terrain that foot troops cannot reach quickly. Armed with assault rifles and infantry-portable short-range missile launchers, these platoons carry enough anti-armor punch to threaten light vehicles and BattleMechs at close range.</p>
