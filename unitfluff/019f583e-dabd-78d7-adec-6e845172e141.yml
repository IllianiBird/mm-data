overview: |-
  <p>The Skinwalker is a 55-ton Clan OmniMech produced by Kali Yama Weapons Industries on Kalidasa for Clan Wolf, first entering production during the ilClan era. It represents the furthest evolution of the Stormcrow design lineage, incorporating exotic technologies rarely seen in Clan designs. The Skinwalker's Interface Cockpit eliminates the need for a conventional gyroscope while encasing the MechWarrior in powered armor, and its advanced lamellor armor construction provides substantially greater protection than previous designs in the family. Clan Wolf initially maintained strict secrecy around the design, going so far as to cosmetically modify standard Stormcrows to mask the true number of Skinwalkers in their touman.</p>
capabilities: |-
  <p>Built on the Model MHO-9M endo steel chassis, an advancement of the Stormcrow's MHO-7E, the Skinwalker retains the 330-rated XL engine for the same 97.2 km/h top speed as its ancestor. Its most distinctive feature is the Interface Cockpit, which encases the MechWarrior in a power-armor interface suit and eliminates the need for a conventional gyroscope. This exotic system provides the pilot with enhanced control responsiveness and the additional protection of powered armor should ejection become necessary.</p><p>Eleven and a half tons of Composite Alpha-V1 Ferro-Lamellor armor provides substantially greater protection than the Stormcrow's ferro-fibrous plating, with the lamellor construction offering improved resistance to cluster munitions and missile warheads. The trade-off for these advanced systems is a reduced pod space compared to what a conventional 55-ton OmniMech might achieve, though the increased survivability and pilot protection compensate significantly. The Non-Standard Parts design quirk reflects the difficulty of maintaining these exotic systems outside of dedicated Clan Wolf supply chains.</p>
deployment: |-
  <p>A sniper variant mounting a PPC capacitor-enhanced ER PPC and a Gauss rifle for devastating long-range alpha strikes capable of crippling opponents before they can close to effective range. Six jump jets provide 180 meters of jump capability, making this the only Skinwalker configuration with jump jets and granting exceptional repositioning ability.</p>
history: |-
  <p>The Skinwalker represents the culmination of a design lineage spanning over three centuries, from the original Corvis through the Omni-Corvis and Stormcrow to this radical reimagining of the 55-ton medium OmniMech concept. Developed by Clan Wolf at the captured Kali Yama Weapons Industries facility on Kalidasa -- in the former Marik-Stewart Commonwealth -- the Skinwalker incorporates technologies rarely seen in Clan designs.</p><p>The design's most remarkable feature is its Interface Cockpit, which encases the MechWarrior in a power-armor interface suit that eliminates the need for a conventional gyroscope. This exotic technology, thought lost to the Inner Sphere, was recovered and refined by Clan Wolf's scientists. Combined with Ferro-Lamellor armor offering superior protection at reduced weight, the Skinwalker achieves the same speed as its Stormcrow ancestor while mounting significantly more durable protection.</p><p>Clan Wolf initially maintained strict secrecy around the design, reportedly disguising standard Stormcrows to resemble Skinwalkers to mask the new OmniMech's true capabilities and numbers. The first confirmed encounter came in 3148 when Republic Remnant forces raided Kalidasa, where an experimental prototype -- the Ryoken III-XP, equipped with Triple Strength Myomer -- was disabled. The production Skinwalker that followed removed these rare experimental components in favor of proven technologies, ensuring reliable mass production for Clan Wolf's expanding military campaigns.</p>
