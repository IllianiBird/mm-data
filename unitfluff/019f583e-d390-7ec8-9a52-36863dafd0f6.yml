chassis: "Anzu"
model: "ZU-G60"
overview: |-
  <p>The Anzu is a 60-ton heavy BattleMech introduced in 3098 by Earthwerks-FWL, Incorporated as the embodiment of AMSC combat doctrine for the reformed Free Worlds League. Named for the mythological griffin that snatched the tablets of destiny from the gods, the Anzu symbolizes the refusal of the Free Worlds peoples to allow others to dictate their future. Designed to fulfill the AMSC's need for a reliable heavy fire-support platform capable of aggressive mid-range combat, the sixty-ton design has been widely adopted throughout Free Worlds League formations, where its mechanical reliability and versatile weapons suite have earned it favor among MechWarriors and technicians alike.</p>
capabilities: |-
  <p>The Anzu is built around an aggressive mid-range combat philosophy, mounting a diverse weapons array designed for direct engagement while maintaining the ability to provide indirect fire support. The Imperator Automatic Ultra Class 10 Autocannon serves as the primary weapon, delivering punishing bursts of fire at medium range, while a Zeus LRM 10 launcher provides indirect fire capability and extends the 'Mech's threat envelope. A Fusigon Shorttooth Light Particle Projection Cannon, enhanced by a PPC Capacitor, gives pilots the option to boost damage output for critical moments, and a Diverse Optics Sunfire Extended-Range Medium Laser rounds out the weapons suite.</p><p>Mounted on an Earthwerks ZU Endo Steel chassis and powered by a Hermes 240 XL engine, the Anzu achieves a top speed of 64 kilometers per hour. Chilton 465 jump jets provide a 120-meter jump capability, giving MechWarriors tactical mobility that compensates for the design's moderate ground speed. Eleven tons of Starshield A armor protected by CASE II ammunition bins provide solid protection for a heavy 'Mech of its tonnage. The RCA Instatrac Mark X targeting system, paired with integrated TAG equipment, allows the Anzu to simultaneously engage multiple targets while designating for indirect fire from supporting lancemates, making it an indispensable member of fire lances.</p>
deployment: |-
  <p>This variant represents the baseline Anzu configuration as originally produced for the AMSC in 3098. Its primary autocannon can deliver punishing rapid-fire bursts at medium range, while the missile rack provides indirect fire capability for supporting lancemates. The capacitor-enhanced light particle cannon allows pilots to concentrate additional energy into decisive shots during critical engagements. Three tons of autocannon ammunition and two tons of missile reloads provide respectable battlefield endurance, while protective ammunition storage in both torsos mitigates the risks inherent in carrying significant ordnance stores. The ZU-G60 remains the most widely fielded Anzu variant in Free Worlds League service.</p>
history: |-
  <p>The Anzu was born from the post-Jihad reformation of the Free Worlds League, when the newly established AMSC sought purpose-built designs to equip its forces with 'Mechs tailored to its more direct and aggressive combat doctrine. Earthwerks-FWL, Incorporated won the production contract and began manufacturing at their Keystone facility in 3098, delivering a heavy 'Mech that quickly became a staple of AMSC formations.</p><p>The Anzu saw its first significant combat during the conflicts that erupted among the Free Worlds states in 3119, when long-simmering tensions boiled over into open warfare along the Regulan border. During the battle for Harmony, the Eleventh Atrean Dragoons employed their Anzus to devastating effect in the narrow streets and tightly packed industrial buildings of Natus. The 'Mech's jump jets and semi-guided missile capability allowed Anzu-led lances to outmaneuver Regulan defenders in urban terrain, engaging at point-blank range while simultaneously directing indirect fire from supporting Shockwaves and Griffins with no loss of accuracy. The battle demonstrated the Anzu's effectiveness in the kind of aggressive, combined-arms operations the AMSC had envisioned when commissioning the design.</p><p>As Clan Wolf expanded into former Free Worlds League territory during the Dark Age, the Keystone production facility came under direct threat. Rather than allow the manufacturing line to fall into Clan hands, the facility was deliberately destroyed. Earthwerks subsequently reestablished Anzu production at their Calloway VI plant, ensuring an uninterrupted supply of both the ZU-G60 and its ZU-J70 lancemate variant to frontline units of the reformed Free Worlds League. The relocation underscored both the strategic importance the League placed on the design and the determination of its people to maintain their industrial independence in the face of Clan aggression.</p>
