chassis: "Field Gun Platoon (FWLM)"
model: "(Motorized LAC2 3070+)"
overview: |-
  <p>New technology and creative tactical thinking have long featured in FWLM infantry deployment, with varied unit types and specialized formations treated as the norm rather than the exception. Towing crew-served light autocannon/2, these platoons field compact, lightweight weapons that sacrifice hitting power for ease of transport and rapid deployment, suited to mobile operations where heavier guns cannot keep pace.</p>
