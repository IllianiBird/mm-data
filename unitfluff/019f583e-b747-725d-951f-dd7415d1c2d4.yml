chassis: "Motorized Platoon (AFFS)"
model: "(Rifle Heavy 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Motorized platoons ride light vehicles that give them the speed to screen advancing columns, patrol supply routes, and respond to threats faster than foot infantry, though they sacrifice protection for that mobility. Carrying heavy assault rifles alongside their standard arms, these platoons pack a harder punch than standard rifle formations, trading some logistical simplicity for increased stopping power against armored targets.</p>
