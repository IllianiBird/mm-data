overview: |-
  <p>The Templar was the first unique Federated Suns OmniMech, an eighty-five ton assault design produced by Kallon Industries and introduced in 3062. Commissioned to address the Federated Suns' lack of an indigenous OmniMech design, the Templar was intended to replace aging designs like the Awesome and Victor in frontline units.</p><p>Built around proven off-the-shelf components to reduce costs and speed development, the design offered a generous forty tons of pod space for mission-specific configurations, establishing itself as a powerful and versatile command platform for AFFS assault formations. Though production was eventually disrupted, the Templar proved durable enough to remain in active service well beyond its original production run.</p>
capabilities: |-
  <p>The Templar is built on a lightweight Kallon Type XIX Endo Steel chassis and powered by a KalTek 340 Extralight engine, achieving a respectable top speed of sixty-four kilometers per hour for its weight class. Sixteen and a half tons of Starshield A armor provide excellent protection, while CASE in the right torso mitigates ammunition explosion risks. Thirteen fixed double heat sinks manage the baseline thermal load, leaving the full forty tons of pod space available for weapons and equipment.</p><p>The primary configuration emphasizes multi-range engagement capability. A Gauss rifle provides devastating long-range firepower, while a large pulse laser, medium pulse laser, and two extended-range medium lasers deliver punishing damage at closer distances. A Streak SRM-4 launcher exploits armor breaches, and an advanced targeting computer links the Gauss rifle and all lasers for enhanced accuracy. This combination makes the Prime an effective battlefield command platform capable of engaging threats at virtually any range.</p><p>The Templar's primary vulnerability lies in its reliance on an Extralight engine, which leaves it susceptible to destruction from torso penetration. However, the design philosophy accepted this trade-off to maximize the available pod space, giving field commanders exceptional flexibility in tailoring the 'Mech to specific mission requirements.</p>
deployment: |-
  <p>Alternate Configuration H combines missile and energy firepower with networking capability, carrying an MRM-30 launcher with Apollo Fire Control System in each arm for devastating medium-range salvos. A pair of Light PPCs and an ER Flamer round out the weapons suite, with a targeting computer enhancing energy weapon accuracy. A C3 slave unit provides data-sharing capability, and four jump jets grant the mobility to maintain effective engagement ranges.</p>
history: |-
  <p>The Templar's origins trace directly to the political tensions within the Federated Commonwealth following the Great Refusal in 3060. While both Archon-Prince Victor Steiner-Davion and his sister Archon Katrina dismissed calls for OmniMech development on economic grounds, Field Marshal Duke George Hasek of the Capellan March took matters into his own hands. Hasek directly commissioned Kallon Industries on Talon, a moon of Wernke, to develop the design, backing the project with his own considerable personal fortune. The resulting 'Mech entered production in 3062, just as the FedCom Civil War was erupting.</p><p>With House Hasek as the driving force behind its creation, the Templar's initial distribution was heavily weighted toward Capellan March formations. The first units off Kallon's production lines were routed to the Syrtis Fusiliers, with subsequent production runs reaching units such as the Federated Suns Armored Cavalry and the Davion Assault Guards. Throughout the Civil War, Hasek's loyalists ensured these powerful OmniMechs were directed exclusively to units opposing Archon Katrina, especially excluding Loyalist commands from receiving any. The Twenty-Second Avalon Hussars received several during their defense of Talon, though this alone proved insufficient to secure victory.</p><p>The Word of Blake Jihad dealt a catastrophic blow to the Templar program when the Kallon Industries factory on Talon was vaporized, halting all production. The design's intended rise as a flagship AFFS assault 'Mech was set back by decades. General Motors, having obtained access to the Templar's design data through Operation MUSE RED, eventually established production on New Valencia, though they chose to develop a modernized successor rather than restart the original line.</p><p>During the Republic era, the Republic Institute of Strategic Combat developed the experimental ORISC configuration, fitting stored Templar chassis with RISC Repeating TSEMP weapons and other volatile experimental technology. The Republic of the Sphere and its wartime Exarch deployed these in false-flag operations under AFFS colors against the Capellan Confederation and Draconis Combine. When Julian Davion visited Terra in 3146, nearly all stored ORISC equipment packages were included in supplies provided to the AFFS, where they saw continued use until every piece of the experimental gear was destroyed through combat, wear, or self-detonation by the end of the 3140s.</p><p>Despite the loss of its original production line, surviving Templars remained in AFFS service throughout the Dark Age and into the ilClan era, valued for their durability, flexibility, and the Easy to Maintain quirk that kept aging chassis operational far beyond their expected service life. The Blessed Order's revived First Division also operated a modified configuration, the BLO variant, incorporating improved C3 networking to coordinate their reformed ComStar forces.</p>
