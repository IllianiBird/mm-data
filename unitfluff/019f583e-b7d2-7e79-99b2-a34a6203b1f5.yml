chassis: "Field Artillery Platoon (CCAF)"
model: "(Motorized Thumper Cannon 3079+)"
overview: |-
  <p>Capellan infantry serve where BattleMechs and armor cannot be spared, which in the resource-constrained CCAF means nearly everywhere. The Xin Sheng movement revitalized the infantry arm alongside every other facet of the Capellan Confederation Armed Forces, giving foot soldiers better equipment and renewed purpose. Field artillery platoons give CCAF ground commanders organic indirect fire support without requiring dedicated artillery vehicles. Operating crew-served tube or missile artillery pieces from mechanized transports, these platoons can displace and redeploy faster than vehicle-mounted artillery at the cost of lower rates of fire and less ammunition. Operating a Thumper Cannon, these platoons provide direct-fire light artillery support, combining the portability of a field gun with the explosive payload of tube artillery.</p>
