chassis: "Predator"
model: "2"
overview: |-
  <p>The Predator is a sixty-ton heavy BattleMech introduced in 3060, representing an unprecedented cooperative venture among the fractious Kindraa of Clan Fire Mandrill. Conceived under the leadership of Khan Carrol, the design drew upon the manufacturing capabilities of multiple Kindraa to create a capable second-line combatant. Designed as a versatile medium-range duelist and close-quarters skirmisher, the Predator proved that even the most politically divided Clan could produce effective military hardware when properly motivated.</p><p>Despite its capable performance in combat, no rival Clan ever declared a Trial of Possession for the design. The Predator's association with the Fire Mandrills and its second-line classification discouraged interest from other Clans, leaving the design largely confined to the touman that created it throughout most of its service life.</p>
capabilities: |-
  <p>The Predator's primary armament consists of twin Faraday LB 10-X autocannons mounted symmetrically, consuming roughly a third of the chassis's total mass. These versatile weapons can fire both standard slug and cluster ammunition, allowing MechWarriors to concentrate firepower against armored targets or exploit breaches in damaged opponents with scattershot rounds. The autocannons carry sufficient ammunition for extended engagements and most Clan Trial formats.</p><p>Supporting the autocannons are paired Series 2FM extended-range medium lasers and two Series 1 extended-range small lasers, providing reliable energy-based firepower when ballistic ammunition runs low. The symmetrical weapons layout ensures consistent performance regardless of damage distribution. Ten double heat sinks manage thermal output efficiently, allowing sustained fire without the overheating problems common to many Clan designs.</p><p>A Dagda-Production Series A 300 XL engine drives the Predator to a respectable eighty-six kilometers per hour, though the lack of jump jets limits tactical mobility in rough terrain. Eleven and a half tons of 17-J Standard armor provide solid protection for a second-line design, though the lowered cockpit creates cramped conditions and complicates emergency ejection procedures.</p>
deployment: |-
  <p>Introduced in 3075 during the Jihad, this Clan Diamond Shark refit substantially revises the original Predator's armament and protection scheme. The twin LB 10-X autocannons give way to a pair of Class 20 Hyper-Assault Gauss Rifles fed by four tons of ammunition divided between the torsos, dramatically increasing raw destructive potential at the cost of the original's ammunition versatility. The standard armor is replaced by ferro-fibrous protection for marginally improved coverage, while the extended-range medium lasers are exchanged for medium pulse lasers offering improved accuracy at closer ranges. The paired extended-range small lasers are retained from the original design.</p>
history: |-
  <p>The Predator emerged from a political theater unique among the Clans. Clan Fire Mandrill's notorious internal divisions between Kindraa had long hampered their collective military production capabilities, making Khan Carrol's achievement in uniting multiple Kindraa around a single manufacturing project all the more remarkable. Initial testing revealed that the twin autocannon design caused excessive cockpit vibration, spoiling pilot accuracy and frequently triggering equipment failures. Engineers resolved this by lowering the cockpit, a relatively straightforward modification that nonetheless gave the design its characteristic cramped interior and complicated ejection profile.</p><p>The Predator's combat debut came during a Trial of Possession fought just prior to the Absorption of Clan Burrock in 3059. Clan Fire Mandrill deployed their Predators in a flanking formation alongside front-line units, and when Burrock forces counterattacked, five Predators reformed into a Star and led a devastating charge that decimated the opposing line. Every Predator walked off the field under its own power, each having claimed at least two kills in the engagement.</p><p>Despite this impressive showing, no rival Clan declared Trials of Possession for the design. Many Clans refused to consider fighting for a second-line BattleMech, and none wished to be the first to publicly acknowledge wanting a Fire Mandrill product. Only Clans Blood Spirit and Diamond Shark fielded small numbers obtained through trade rather than Trial, exchanging some of their more prestigious designs for a few Stars' worth of Predators. Kindraa Mattila-Carrol subsequently began reconditioning a second production facility on Shadow to increase output and meet growing internal demand.</p><p>The destruction of Clan Fire Mandrill during the Wars of Reaving in the early 3070s ended production of the Predator on both Atreus and Shadow permanently. Clan Diamond Shark, having acquired a number of existing chassis through their earlier trade agreements, developed the Predator 2 refit at their IndustriPlex-C facility on Itabaiana during the Jihad. The refit substantially upgraded the design's firepower with Hyper-Assault Gauss technology, though Diamond Shark plans for full-scale production were ultimately abandoned, leaving the Predator 2 as a limited refit-only variant.</p>
