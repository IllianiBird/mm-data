chassis: "Field Gun Platoon (FWLM)"
model: "(Wheeled LBX5 3060+)"
overview: |-
  <p>The Free Worlds League's fractious politics have always made centralized BattleMech procurement difficult, pushing the FWLM toward heavy investment in conventional infantry to fill the gaps. Towing crew-served LB 5-X autocannon, these platoons field versatile weapons capable of firing solid slugs for armor penetration or cluster rounds for area effect against dispersed targets.</p>
