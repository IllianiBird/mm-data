chassis: "Wakazashi"
overview: |-
  <p>The Wakazashi was the first original BattleMech design produced by Clan Jade Falcon, introduced around 2830 during a period of severe internal crisis. Suffering from self-inflicted injuries to their touman in the early twenty-ninth century, the Falcons needed to rebuild quickly. Khan Lisa Buhallin directed Falcon scientists to develop a heavily armed and armored defensive 'Mech, and the Wakazashi was selected from seven competing submissions. Named for the wakizashi, the short companion sword traditionally associated with desperate measures and ritual sacrifice, the design reflected the Khan's blunt assessment of her Clan's dire situation. Built by Eagle Craft Group on Ironhold, the eighty-five ton assault 'Mech earned a reputation as a durable and reliable garrison fighter, though it would ultimately be overtaken by more advanced technology.</p>
capabilities: |-
  <p>The Wakazashi mounts a potent combination of long-range and close-combat weaponry on a heavily armored chassis. An SLDF Model 22-99-b Gauss rifle and a Talon 5 extended-range PPC provide devastating firepower at extended ranges, giving the 'Mech an effective kill zone extending roughly two-thirds of a kilometer. Supporting these is a Flocculation LB 20-X autocannon capable of switching between standard and cluster munitions, allowing the Wakazashi to exploit breaches in enemy armor at closer ranges. A pair of Series 7J extended-range medium lasers round out the armament as backup weapons.</p><p>The design emphasizes durability over sophistication. A standard Falcon 255 engine, while limiting the 'Mech to a top speed of just over fifty kilometers per hour, eliminates the catastrophic vulnerability of extralight designs and reduces resource demands. Sixteen and a half tons of StarForge ferro-fibrous armor mounted on a Falcon 85-1ES endo steel frame provide excellent protection. Falcon Heavy jump jets compensate for the low ground speed with ninety meters of jump capability, allowing effective tactical repositioning. Fourteen double heat sinks manage the thermal load efficiently, permitting alpha strikes with all primary weapons or combined jumping and energy weapon fire without dangerous heat buildup.</p><p>The Wakazashi's greatest limitation is its inflexibility. The combination of endo steel frame and ferro-fibrous armor leaves little internal volume for modification, and the standard engine cannot be easily swapped without extensive structural redesign. This rigidity, combined with the slow ground speed, means the Wakazashi is best employed in defensive or garrison roles where its firepower and armor can be leveraged from prepared positions rather than in mobile operations.</p>
deployment: |-
  <p>The Wakazashi was produced in a single configuration throughout its manufacturing life. No factory variants were ever developed, as the design's internal layout resisted modification. The few Wakazashis that survived into the thirty-first century remained in their original configuration, serving in garrison and solahma formations where their heavy armor and firepower continued to provide value in defensive assignments.</p>
history: |-
  <p>The Wakazashi's development was driven by Clan Jade Falcon's desperate need to rebuild its military after a period of devastating internal conflict during the early twenty-ninth century. As the first original BattleMech design produced by the Falcons, the Wakazashi represented more than just a weapons platform, serving as a symbol of the Clan's determination to recover from near-destruction.</p><p>Eagle Craft Group on Ironhold began manufacturing the new assault 'Mech around 2830, and the design's emphasis on durability and ease of construction proved valuable during the rebuilding period, allowing the Falcons to field heavy firepower relatively quickly. The Wakazashi served in Falcon garrison and defensive formations throughout the remainder of the Golden Century, its combination of ranged firepower and heavy armor well-suited to the positional warfare that characterized much of the era's Clan conflicts.</p><p>However, the very qualities that made the Wakazashi effective as a stop-gap worked against it as Clan military technology advanced. The rise of OmniMech technology beginning in 2854 rendered the Wakazashi increasingly obsolete. Its resistance to modification meant it could not be upgraded to compete with the flexibility offered by new omnipod-equipped designs, and maintaining the aging chassis pulled technicians away from higher-priority systems.</p><p>Eagle Craft Group shut down the Wakazashi production line in the early thirtieth century, ending roughly one hundred and seventy years of manufacturing. Though the design disappeared from frontline service, a handful of surviving examples persisted in garrison and solahma units. A few Wakazashis reportedly survived into the late thirty-first century, though none were brought to the Inner Sphere during Operation Bulldog or subsequent Clan deployments to the occupation zones.</p>
