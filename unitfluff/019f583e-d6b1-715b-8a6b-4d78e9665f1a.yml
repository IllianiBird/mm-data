chassis: "King Crab"
model: "KGC-0KP"
overview: |-
  <p>The Golden Unity's redesign of the King Crab has been likened to a "big brother for the Marauder" due to its weapon layout. Arm-mounted PPCs paired with light blazers replace the assault autocannons, while a single superheavy autocannon sits in a pronounced dorsal mount. Jump jets provide extra maneuverability in cluttered environments, making this variant a nasty surprise for unsuspecting enemies.</p>
capabilities: |-
  <p>The jump jets give this assault machine unexpected repositioning ability in broken terrain, allowing it to occupy firing positions that conventional assaults cannot reach. The PPCs and dorsal autocannon create overlapping engagement zones that punish enemies at every range. Pilots should use jump mobility to maintain optimal firing distance rather than wading into brawls, letting the light blazers handle anything that slips inside PPC range.</p>
