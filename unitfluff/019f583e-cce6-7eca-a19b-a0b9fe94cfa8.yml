chassis: "Anubis"
model: "ABS-3R"
overview: |-
  <p>The Anubis was introduced in 3063 as the flagship product of Detroit Consolidated MechWorks, a factory built in the New Colony Region with Capellan Confederation backing to supply advanced war material to all three Trinity Alliance members. Designed by engineers from Fredonian Industrial Technologies whose Osiris companion design had been rejected by every major Federated Suns manufacturer, the thirty-ton Anubis was the first non-Capellan-produced BattleMech to incorporate the Confederation's revolutionary stealth armor technology. The Detroit plant was one of only three facilities in existence capable of building BattleMechs incorporating the full range of advanced Capellan technologies, and the Anubis served as proof of the Trinity Alliance's commitment to sharing military innovation across national borders.</p><p>Intended as a light fire support platform, the Anubis was produced in equal numbers for the Magistracy Armed Forces, Taurian Defense Force, and Capellan Confederation Armed Forces, though the Colonial Marshals of the New Colony Region became its most prolific operators during the design's early years.</p>
capabilities: |-
  <p>The Anubis combines speed and stealth to operate as a light fire support platform that relies on not being seen rather than absorbing damage. A Ceres Motors 240 XL engine propels the thirty-ton chassis to speeds exceeding 129 kilometers per hour, while five and a half tons of Hellespont Lite stealth armor and a Guardian ECM suite make the 'Mech exceptionally difficult to target at range. The common refrain among Periphery forces is that the only Anubis visible on the battlefield is the one that wants to be seen, as the design's electronic warfare suite allows it to operate with near-impunity at extended distances.</p><p>The primary armament of four Sian/Ceres Jaguar LRM-5 launchers enables the Anubis to lay down sustained suppressive fire or deploy specialized munitions such as Thunder minefields while faster 'Mechs close with the enemy. A single Diverse Optics extended-range small laser provides minimal self-defense capability at close quarters. This missile-heavy loadout does create significant ammunition dependency, identified as the design's primary tactical weakness alongside its thin armor protection.</p><p>Construction quality has been a persistent concern, as the Detroit facility's use of identical forearm housings on both arms despite only the left mounting a weapon, combined with field reports indicating equipment malfunction rates roughly thirty percent higher than comparable designs, has earned the Anubis a reputation as difficult to maintain.</p>
deployment: |-
  <p>Developed in 3064 to address the base model's lack of short-range punch, this variant replaces two of the four LRM-5 launchers with a Rocket Launcher 10 and two Rocket Launcher 15 systems. This modification gives the Anubis a devastating one-time alpha strike capability at close range, allowing pilots to deliver a concentrated barrage of rocket fire before withdrawing at speed. The remaining pair of LRM-5 launchers preserve some long-range capability, but the variant's tactical doctrine shifts markedly toward hit-and-fade engagements where the initial volley of rocket fire can cripple or destroy lighter targets outright.</p>
history: |-
  <p>The Anubis emerged from the diplomatic and military framework of the Trinity Alliance, the tripartite agreement between the Capellan Confederation, Magistracy of Canopus, and Taurian Concordat that saw unprecedented sharing of military technology among the three nations. The Capellan Confederation rebuilt a ruined BattleMech factory on Detroit, completing the facility in 3060 to serve as a manufacturing hub for advanced designs incorporating technology previously restricted to Capellan production lines. The Anubis entered service in late 3063, quickly becoming the most visible symbol of Trinity Alliance cooperation.</p><p>The design's early service was marked by political turmoil in the New Colony Region. When Force Marshal McEvens declared independence for the Colony Region and established a provisional government on Fronc, the Magistracy Armed Forces halted all further shipments of the Anubis to the Colonial Marshals. This decision sent mixed signals, particularly as the Magestrix publicly considered recognizing the breakaway government, a position that reportedly angered Capellan leadership. Despite this political disruption, the Anubis continued to serve in significant numbers with the Colonial Marshals, who had already received substantial deliveries before the embargo.</p><p>The Anubis proved its worth during the Jihad era, with Detroit Consolidated MechWorks producing updated variants including the energy-weapon ABS-3T and experimental ABS-3MC prototype. The 3MC represented an ambitious collaboration between the Magistracy and Capellan weapons scientists, though only twelve prototypes were completed before the line was retooled. During this period, ownership of the Detroit facility transitioned fully to the Magistracy of Canopus.</p><p>Following the Jihad, the political arena shifted dramatically when Detroit was gifted to the Capellan Confederation. Detroit Consolidated MechWorks relocated Anubis production to their facility on Krimari, where redesigned variants incorporating a smaller engine and upgraded weaponry entered service beginning in 3121. The Anubis has served the Magistracy of Canopus for over eight decades, remaining a common sight in Canopian and Capellan regiments conducting long-range search-and-destroy missions. A notable engagement in 3145 saw the Fourth Andurien Cavalry deploy two companies of fast 'Mechs including Anubises purchased from the Magistracy for a reconnaissance of Ruschegg, though the operation ended in disaster when the scouts attempted to engage planetary defenders and were ambushed by concealed armor units. The Anubis has also figured prominently in anti-piracy operations, with Colonial Marshals employing lances of the design to devastating effect against raiding bands in the Fronc Reaches.</p>
