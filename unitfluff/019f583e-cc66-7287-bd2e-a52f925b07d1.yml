chassis: "Orion IIC"
overview: |-
  <p>As Aleksandr Kerensky’s chosen BattleMech, the original Orion held a special place within the Clans, especially Clan Wolf. Out of respect for the Great Father, the Clans maintained the design for decades despite the invention of newer technologies. Behind the scenes, however, Clan Wolf was designing an updated version, as they saw it, neither of the great Kerenskys would have approved of blindly following tradition at the expense of military progress. The Orion IIC debuted early in the Golden Century but received little attention alongside the OmniMechs that were fast becoming standard frontline machines. Clan Wolf has jealously guarded the Orion IIC design, defending their exclusive right to it in Trials of Possession and refusing all proposed trades despite generous offers. Like the Kerensky bloodname heritages, Clan Wolf sees the Orion IIC as tied to their honor as guardians of Kerensky’s legacy.</p>
capabilities: |-
  <p>Produced before the advent of OmniMechs, the Orion IIC features many technological advancements preserved or developed by the Clans. Endo steel and ferro-fibrous construction materials lighten the design, allowing for a heavier weapons configuration, while double heat sinks manage thermal buildup effectively. The IIC upgrades the original Orion’s medium lasers to extended-range large lasers, particularly two different models, the result of a late design change in which a pulse laser was upgraded to an extended-range weapon. The older Series 6W laser was retained despite maintenance complications because it better matched the original design’s architecture.</p><p>A Clan-specification Omega 12-Coil Gauss rifle replaces the original autocannon, delivering devastating kinetic impacts without generating heat, while upgraded Type XX “Great Bow” LRM-20 and Offset Pattern K4 SRM-4 launchers provide comprehensive missile coverage. The resulting design delivers significantly more firepower than the Inner Sphere original while maintaining the same seventy-five-ton weight class, evidence of the efficiency of Clan manufacturing techniques.</p>
deployment: |-
  <p>Clan Wolf produces the standard Orion IIC in limited numbers at WC Aux Site #2 on Strana Mechty, with additional refits conducted at W-7 Facilities on Weingarten using purchased Inner Sphere chassis. The design’s Omega 12-Coil Gauss Rifle serves as the primary weapon, complemented by a Type XX “Great Bow” LRM-20 for ranged bombardment and two extended-range large lasers (the Series 6W and Series 7W) providing heavy energy firepower. An Offset Pattern K4 SRM launcher handles close-range engagements. The combination creates a versatile seventy-five-ton platform that outperforms the Inner Sphere original in virtually every engagement category.</p>
history: |-
  <p>The Orion IIC’s history is inseparable from Clan Wolf’s reverence for Aleksandr Kerensky. While other Clans moved rapidly toward OmniMech technology during the Golden Century, Clan Wolf’s scientists quietly redesigned the Orion to incorporate Clan technological advancements while preserving the spirit of Kerensky’s chosen mount. The IIC debuted early in the Golden Century at WC Aux Site #2 on Strana Mechty, produced in limited numbers exclusively for Clan Wolf’s use.</p><p>Clan Wolf has consistently defended its exclusive claim to the Orion IIC, winning Trials of Possession against other Clans who sought the design and refusing all trade proposals regardless of how generous the offers. This possessiveness mirrors the Wolf Clan’s guardianship of the Kerensky bloodname heritages, both are considered matters of honor central to the Clan’s identity.</p><p>Rather than assigning the Orion IIC to frontline units, Clan Wolf uses the design to reward officers in second-line Galaxies who are expected to advance to frontline assignments. Each Orion IIC is sent to its recipient “with the compliments of” Clan Wolf’s Khan or saKhan, a gesture of personal recognition that no officer has ever refused, even if it meant trading an assault-class BattleMech for the smaller heavy design.</p><p>A few Orion IICs traveled to the Inner Sphere with Phelan Kell’s Wolves-in-Exile, where they remain part of the exiled Clan’s second-line forces. Especially, no effort has been made to produce the Orion IIC outside Strana Mechty, a possible gesture of reconciliation toward the homeworld Clan Wolf. The Jihad-era Wars of Reaving disrupted Strana Mechty production, and a refit facility at W-7 Facilities on Weingarten was established to convert purchased Inner Sphere chassis to IIC specifications.</p>
