chassis: "Eagle"
model: "EGL-2M"
overview: |-
  <p>The Eagle is Curtiss Militech's entry into the light BattleMech market, introduced in 3058 as a follow-up to their highly successful Wraith medium 'Mech. Designed primarily for the Free Worlds League, the Eagle was conceived as a balanced mix of firepower and mobility on a twenty-five-ton chassis, sacrificing the raw speed typical of its weight class in favor of heavier armament and a valuable target designation role.</p><p>The Eagle's practical approach to maintenance and logistics has made it attractive to provincial militia and second-line formations across the Free Worlds League, where reliable supply chains are valued as highly as raw combat performance.</p>
capabilities: |-
  <p>Though not as fast as many 'Mechs in its weight class, the Eagle compensates with considerable firepower at extended ranges. The design mounts a Diverse Optics Sunbeam extended-range large laser as its primary weapon, capable of stripping significant armor from targets at distances exceeding five hundred meters. A Diverse Optics extended-range medium laser provides supplementary fire at closer ranges, giving the Eagle a credible damage output for a twenty-five-ton platform. The inclusion of a Forward-1 TAG laser designator adds a critical force-multiplier role, enabling the Eagle to call in accurate Arrow IV artillery strikes and semi-guided long-range missile fire from supporting units.</p><p>Built on a Curtiss Eagle endo steel chassis and powered by a Vlar 125 standard fusion engine, the Eagle achieves a top speed of 86 kilometers per hour with five CurtissJet 55 jump jets providing a hundred and fifty meters of jump capability. The standard engine reduces production costs and improves battlefield survivability compared to extralight alternatives, while simplifying field repair with more readily available replacement parts. Five tons of Kallon FWL armor provide respectable protection against other light 'Mechs, though the design remains vulnerable to concentrated fire from heavier opponents. The design philosophy clearly prioritizes sustained ranged engagement and target designation over the close-range skirmishing role typical of most light designs.</p>
deployment: |-
  <p>This variant represents the definitive production model of the Eagle, incorporating the Forward-1 TAG laser designator that transformed the design from a simple light skirmisher into a valuable combined-arms asset. Mounting both the TAG system and an extended-range medium laser alongside the primary Diverse Optics Sunbeam extended-range large laser, this variant can operate independently as a capable light combatant while simultaneously providing target designation for Arrow IV artillery and semi-guided missile systems. This dual-role capability drove strong sales across the Free Worlds League and into the Capellan Confederation, making this variant by far the most numerous Eagle variant in service.</p>
history: |-
  <p>The Eagle's development grew directly from Curtiss Militech's experience with the Wraith, as the company sought to leverage its reputation and manufacturing expertise into the light 'Mech market. The original design, designated EGL-1M, lacked the TAG system that would come to define the Eagle's battlefield role. When the League Central Coordination and Command introduced new semi-guided long-range missiles, Curtiss engineers recognized the opportunity for a fast, light 'Mech capable of designating targets for these munitions and added the TAG system to create the EGL-2M.</p><p>Initial sales validated Curtiss's market instincts. Both the Free Worlds League and Capellan Confederation placed substantial orders, with many units coming from formations already familiar with Curtiss-built 'Mechs through their experience with the Wraith. Within the League, various Marik Militia formations received the majority of Eagle shipments, followed by the Fusiliers of Oriente. Smaller numbers were exported to the Capellan Confederation, where the design found a niche in combined-arms formations that valued its target designation capabilities.</p><p>During the Jihad, the Eagle saw service across nearly every Marik province, primarily operating in its intended role as a close-in spotter for guided munitions and artillery. The disruption of normal military procurement channels during the conflict created uncertainty for continued production, though officers from both the Fusiliers of Oriente and Regulan Hussars were observed meeting with Curtiss executives on Paradise to secure future deliveries. The Jihad-era EGL-3M variant emerged during this period as Curtiss sought to market a less specialized version of the Eagle for general combat duties.</p><p>In the post-Jihad era, Curtiss Militech eventually exited the military market entirely, licensing the Eagle design to Graham-Davis Enterprises on Tamarind. Graham-Davis began production of the EGL-2M and EGL-3M sometime in the mid-3090s under the Duchy of Tamarind-Abbey, ensuring the Eagle's continued availability even as its original manufacturer departed from 'Mech production. The line subsequently passed back to Free Worlds League control as political boundaries shifted during the Dark Age.</p>
