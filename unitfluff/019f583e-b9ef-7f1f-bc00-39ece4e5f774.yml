chassis: "Field Gun demi-I (WOBM)"
model: "(Motorized AC5)"
overview: |-
  <p>The Word of Blake Militia inherited ComStar's combined-arms organizational philosophy and its Star League-era equipment stocks, fielding infantry formations that ranked among the best equipped in the Inner Sphere during the Jihad. Crewing medium-caliber field autocannon, these gunners provide direct fire support with enough hitting power to threaten light armor while remaining mobile enough to reposition as the tactical situation evolves.</p>
