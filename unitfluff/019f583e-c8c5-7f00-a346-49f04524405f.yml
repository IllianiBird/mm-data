chassis: "Snake"
model: "SNK-1V"
overview: |-
  <p>The Snake was introduced in 3053 by Ceres Metals Industries as a dedicated anti-battle armor platform built on the proven Ceresplex IV chassis shared with the Vindicator. Officially designed to counter the fearsome Clan Elemental, the reality was that Chancellor Sun-Tzu Liao had given high priority to developing a 'Mech optimized for maximum effectiveness against the lighter Inner Sphere battle armor suits then beginning to proliferate across the Successor States. Reusing an existing chassis should have accelerated development, but the design team squandered time bickering over weapons selection until the Maskirovka intervened and the surviving designers finalized their recommendations.</p><p>The resulting forty-five-ton medium 'Mech trades the Vindicator's versatility for speed and specialized anti-infantry firepower, mounting a VOX 225 extralight engine that pushes the top speed to over 86 kilometers per hour and five jump jets providing 150 meters of jumping distance, sufficient to outmaneuver any battle armor formation.</p>
capabilities: |-
  <p>The Snake's primary weapon is the Mydron Excel LB 10-X autocannon, capable of firing both standard slugs and cluster munitions that act as 'Mech-sized shotgun shells, making it devastatingly effective against battle armor formations. Three Hovertec Streak SRM-2 launchers complement the autocannon, their guided missiles reliably finding weak points in armored targets. Speed and mobility were carefully balanced against the Snake's intended prey, with seven tons of Starshield armor and CASE protection deemed sufficient to survive engagements at typical battle armor combat ranges.</p><p>However, the Snake's specialized nature is also its greatest limitation. Only the LB 10-X autocannon carries enough punch to genuinely threaten a Clan Elemental, making the 'Mech far too lightly armed for its officially stated role. Against lighter Inner Sphere suits such as the Sloth and Infiltrator employed by the Federated Commonwealth, the combination of autocannon cluster rounds and Streak missiles proves extremely effective. When facing actual BattleMech opponents, the Snake's ammunition dependence, lack of energy weapons, relatively light armor, and merely average speed for its weight class require it to fall back on its lancemates for support.</p>
deployment: |-
  <p>The base Snake configuration mounts a Mydron Excel LB 10-X autocannon as its primary weapon, complemented by three Hovertec Streak SRM-2 launchers for guided close-range fire. Sharing many components with the ubiquitous Vindicator gives the Snake access to plentiful spare parts and experienced technicians comfortable working on the chassis. When first deployed, Inner Sphere battle armor was still rare enough that many Snakes were reassigned to anti-vehicle and infantry support roles, where the LB 10-X's cluster munitions proved effective. Against contemporary medium BattleMechs, however, the Snake remains outclassed due to its ammunition dependence, lack of energy weapons, and relatively light armor protection.</p>
history: |-
  <p>When the Snake was first introduced, the Confederation had little chance of facing the Clans directly, and Inner Sphere battle armor remained relatively rare. The Snake proved difficult to employ effectively in its intended anti-suit role, and many were relegated to anti-vehicle or infantry support duties. Some were even transferred to the Free Worlds League, where they served with formations such as the Thirtieth Marik Militia on the world of Wing. Ceres Metals entertained hopes of exporting the design to the Draconis Combine, but negotiations collapsed when the DCMS opted for the homegrown Komodo instead.</p><p>The formation of the Trinity Alliance reinvigorated the Snake program. Ceres increased production and began shipping new units to the Taurian Concordat and Magistracy of Canopus, where they fought alongside Capellan troops in St. Ives and the Chaos March. Sharing many components with the ubiquitous Vindicator gave the Snake access to plentiful spare parts and experienced technicians, easing the logistical burden of deploying the design far from its Capellan factories.</p><p>As the Capellan battle armor program matured and began producing workable domestic designs, the Snake's original anti-suit mission became increasingly redundant. In an attempt to find a new operational role, Ceres experimented with mounting stealth armor on the chassis, producing the SNK-2B. The next generation of battle armor promised increased firepower against which the Snake could find itself dangerously under-armored, but the introduction of the SNK-2Br with its dual plasma rifles finally achieved a viable anti-battle armor configuration, even if the weapons' limited ammunition supply remained a persistent operational concern.</p>
