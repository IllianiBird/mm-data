chassis: "Stinger IIC"
overview: |-
  <p>The Stinger IIC emerged from the formal unification of the Outworlds Alliance and Clan Snow Raven into the Raven Alliance. Constant border struggles with the Draconis Combine had depleted both parties' scout forces, and with limited light 'Mech production capabilities in the Inner Sphere, the Ravens faced difficult choices. Johann Eshei, CEO of Alliance Defenders Limited, proposed a solution that would serve as both practical military asset and symbol of the deep bond between the Snow Ravens and their Outworlds partners.</p><p>By upgrading ADL's existing Stinger production facilities to Clan standards, both Clan warriors and Periphery pilots would receive a capable reconnaissance platform. The venerable Inner Sphere design would gain Clan technology sufficient that warriors would not consider it beneath them to pilot. The Raven Alliance Council approved the project with strict oversight, though the speed of implementation demonstrated growing trust between Outworlds citizens and the warrior-dominant Ravens. Beyond combat effectiveness, the Stinger IIC succeeded as a unifying symbol, embraced by warriors on both sides of the alliance.</p>
capabilities: |-
  <p>The Stinger IIC maintains the original chassis weight at twenty tons while incorporating significant technological improvements. Ground speed remains modest at approximately 100 kilometers per hour (relatively slow for the weight class) but 180 meters of jump capability compensates effectively, enabling rapid repositioning or escape from difficult situations. Three and a half tons of Compound FM3 ferro-fibrous armor provides near-maximum protection for the frame, allowing the IIC to withstand more punishment than most 'Mechs of comparable mass.</p><p>Primary armament consists of twin Series X-a improved heavy medium lasers, weapons that match standard medium laser range while delivering firepower comparable to a PPC. This allows the Stinger IIC to threaten heavier opponents and destroy lighter targets rapidly. However, the improved heavy lasers' powerful capacitors remain unstable and prone to explosion when struck. While CASE mitigates catastrophic ammunition-style detonation, the neurofeedback from capacitor failure remains dangerous to pilots.</p><p>A Sigma-I anti-personnel Gauss rifle in the right arm might appear an afterthought but proves highly effective at dispersing infantry while serving as a backup weapon during heat management. The Nissan 120 engine, SR Starlifter 20 jump jets, and Garret T10B communications system with Tokasha B4 targeting computer round out a well-integrated reconnaissance platform. Raven warriors typically employ the IIC as a scout and fast skirmisher, while Outworlds pilots favor hit-and-run tactics that maximize the jump jet and improved heavy laser combination.</p>
deployment: |-
  <p>The standard Stinger IIC configuration balances reconnaissance capability with meaningful combat power. Twin improved heavy medium lasers provide striking power comparable to much heavier 'Mechs, while the AP Gauss rifle handles infantry threats and heat management. This baseline variant sees service throughout Raven Alliance forces in both scouting and fast skirmisher roles, with Snow Raven pilots and Outworlds warriors developing complementary tactical doctrines around its capabilities.</p>
history: |-
  <p>The Stinger IIC's development reflected the evolving relationship between Clan Snow Raven and the Outworlds Alliance following their merger into the Raven Alliance. Border conflicts with the Draconis Combine had reduced both nations' reconnaissance capabilities to critical levels. Traditional Clan procurement would have favored entirely new OmniMech designs, but the Outworlds' industrial base could not support such sophisticated manufacturing.</p><p>Alliance Defenders Limited's proposal to upgrade existing Stinger production lines offered an elegant solution. The company had manufactured STG-3R Stingers for generations, and retooling for Clan-specification components proved faster and more economical than establishing entirely new production. The project received Raven Alliance Council approval with characteristically strict Clan oversight, yet the rapid successful implementation demonstrated how far trust had developed between the warrior caste and their Periphery partners.</p><p>Production splits evenly between Snow Raven line Clusters and native Outworlds militias, with initial shipments to both groups departing Alpheratz simultaneously, a deliberate symbolic gesture. The design has seen extensive deployment in ongoing border struggles with the Draconis Combine. Combine forces, expecting only Snow Raven warriors to continue fighting after the alliance merger, discovered Alliance-born troops operating the new 'Mech during Periphery raids, demonstrating that the Outworlds military had gained genuine capability rather than merely accepting Clan protection.</p><p>The symbolic success matched the tactical achievements. Warriors from both origins embraced the design without the cultural friction that might have accompanied a purely Clan or purely Inner Sphere solution. The Stinger IIC stands as proof that the Raven Alliance merger produced genuine integration rather than simple absorption.</p>
