chassis: "Naja"
overview: |-
  <p>The Naja was created by Clan Cloud Cobra in 2826 as a show of force following the horrendous losses the Clan suffered during the liberation of the Pentagon Worlds. Seeking to rapidly bolster their touman during a period of increasing inter-Clan competition, Cloud Cobra scientists turned to the Kintaro chassis found in their SLDF Brian Caches as a readily available foundation for a new design. The Naja was purpose-built to showcase the Clan's advances in improved missile launcher technology, rebuilding the venerable Kintaro into a potent mixed-tech missile platform.</p><p>The design proved popular within Clan Cloud Cobra but saw limited adoption elsewhere. Other Clans shunned the Naja for its reliance on the obsolete Narc-era chassis, and captured examples were frequently traded back to the Cobras. When the Clan shifted its strategic focus toward aerospace supremacy and the newly developed OmniMechs, the Naja was largely removed from frontline service, with production dwindling to a handful per year until only two Stars' worth remained operational by the early 3000s.</p>
capabilities: |-
  <p>Built on the proven Kintaro platform, the Naja retains the fifty-five-ton chassis's respectable speed of just under ninety kilometers per hour while dramatically upgrading its weapons suite with Clan technology. A Type XX "Great Bow" LRM-20 launcher provides devastating long-range fire support, a significant improvement over the original Kintaro's modest LRM-5. At close range, a pair of Pattern C3 Improved SRM-6 racks and two Pattern C4 SRM-4 launchers can unleash a withering barrage of short-range missiles. Two SEP-Class extended-range medium lasers and a Series 1b extended-range small laser round out the weapons array, providing energy backup when ammunition runs low.</p><p>Twelve tons of Standard Composition A armor plate give the Naja excellent protection for a medium chassis, exceeding the Kintaro's already respectable defensive profile. All ammunition bays are protected by Clan CASE, ensuring catastrophic ammunition explosions do not destroy the 'Mech outright. Fourteen double heat sinks manage the considerable thermal load from the expanded weapons suite. The integration of the Pattern C3 racks into the Kintaro's left arm proved so tight that the launchers became virtually impossible to replace, a design quirk that contributed to the Naja's eventual obsolescence as newer SRM designs emerged.</p>
deployment: |-
  <p>The standard production Naja represents the fully realized Cloud Cobra design, manufactured from 2826 onward at Babylon Mechworks V. Built on the purpose-designed CCTech-2 chassis rather than refitted Star League-era frames, this variant integrates Clan-specification weapons throughout, including Improved SRM-6 racks, SRM-4 launchers, and extended-range lasers alongside the Type XX LRM-20. Twelve tons of Standard Composition A armor and Clan CASE provide robust protection. The fourteen double heat sinks manage the expanded weapons suite effectively, though sustained alpha strikes still generate significant heat. The tightly integrated Pattern C3 SRM racks in the left arm eventually became a liability as they could not be replaced with newer designs, contributing to the Naja's gradual obsolescence.</p>
history: |-
  <p>The Naja's origins lie in the aftermath of Clan Cloud Cobra's costly campaigns to liberate the Pentagon Worlds. Desperate to rebuild their ground forces, the Cobras' scientist caste identified stockpiles of Star League-era Kintaros in their Brian Caches and saw an opportunity to field a new design quickly. The first Najas were extensive refits of these original SLDF machines (designated KTO-19b-EC) retaining the Inner Sphere XL engine and double heat sinks while replacing the weapons suite. By 2826, Babylon Mechworks V on Babylon had begun producing the fully realized Naja with integrated Clan technology on the new CCTech-2 chassis.</p><p>The first batch of Najas saw action during an abortive Clan Coyote attempt to seize some of the new Cloud Cobra SRM racks. The overconfident Coyote warriors expected to bulldoze the weaker Cobra defenders and closed for a quick kill, only to be met by a devastating storm of short-range missiles. As Clan missile technology proliferated throughout Clan space during the early Golden Century, the Naja served admirably despite being progressively outclassed by newer designs. The frugal Cobras retained the obsolete Improved SRM-6 launchers rather than replacing them, reasoning that the outdated weapons made the Naja less appealing to rival Clans in Trials, reducing losses while maintenance remained straightforward for their technician caste.</p><p>The Naja's greatest moment came during the ferocious Trials of Possession for Zara in 2850, when Clan Jade Falcon contested what was maturing into Cloud Cobra's principal holding. Over ten days, Alpha Galaxy battled the Jade Falcons along the shores of the Ochre Sea for possession of the planet. Naja-equipped units from the First Cobra Fang Cluster played a crucial role defending the aerospace base outside El Giza, fending off wave after wave of Falcon BattleMechs with massed missile salvos while suffering horrendous losses. Their tenacious defense preserved the vital airfields, allowing Cloud Cobra aerospace fighters to drive the invaders off-world.</p><p>The battle for Zara proved to be the Naja's swan song. The Cloud Cobras began emphasizing aerospace growth over ground forces, and BattleMechs like the Naja became an unpopular necessity. Production at Babylon Mechworks V dwindled to only a handful of machines annually, and by the early 3000s only two Stars' worth remained in operation within the Cobras' Gamma Galaxy. The rise of the OmniMech rendered the fixed-configuration Naja strategically obsolete, though its legacy endured as proof that the humble Kintaro chassis could serve as a foundation for effective Clan combat designs.</p>
