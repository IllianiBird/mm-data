chassis: "Field Artillery Platoon (DCMS)"
model: "(Tracked Sniper 2620+)"
overview: |-
  <p>The Draconis Combine Mustered Soldiery assigns conventional infantry to garrison roles across its military districts, with district regulars often fielding extra platoons to secure worlds that BattleMech forces cannot permanently garrison. The platoon operates a Sniper artillery piece that delivers heavier bombardment than a Thumper, with a larger blast radius and greater destructive effect against fortified positions. A single Sniper battery can make an entrenched enemy reconsider whether their cover is as solid as they believed.</p>
