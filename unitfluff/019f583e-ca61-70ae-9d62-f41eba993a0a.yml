chassis: "Lineholder"
model: "KW1-LH2"
overview: |-
  <p>The Lineholder was introduced in 3058 as the first BattleMech design produced by Kressly Warworks on Epsilon Eridani. Created using a set of "Common Sense Design" guidelines, the fifty-five-ton 'Mech was developed by a Kressly think tank to meet self-imposed standards for speed, heat management, weapons-to-heat-sink ratios, and damage bracket projections. The result is a medium-weight platform that balances firepower, protection, and mobility at a price point attractive to small commands, minor nobles, and garrison forces throughout the Chaos March.</p><p>In its first year of production, the Lineholder achieved remarkable commercial success compared to other designs in its weight class, rapidly becoming the garrison machine of choice for factions able to afford newly manufactured BattleMechs. The design's affordable price point and reliance on easy-to-source components have kept it in production across multiple political upheavals, a sign of the enduring appeal of Kressly's common-sense engineering philosophy.</p>
capabilities: |-
  <p>The Lineholder is built around a philosophy of reliability and simplicity. A standard Kressly GRF1A-MDX chassis carries a Core Tek 275 fusion engine, giving the 'Mech a top speed of 86 kilometers per hour, sufficient to keep pace with all but the fastest light and medium designs. Ten tons of Kressly Stoneskin 30M armor provide above-average protection for its weight class, reinforcing the 'Mech's intended role as a dependable workhorse rather than a specialized combatant.</p><p>The Lineholder's weapons suite emphasizes versatility across engagement ranges. A pair of LongFire V LRM-5 launchers provide long-range fire support and limited indirect capability, while a BlazeFire Systems large laser delivers accurate damage at medium ranges. Four Intek medium lasers round out the arsenal, creating a formidable close-range deterrent. Fourteen heat sinks manage the thermal load effectively, allowing sustained fire in all but the most prolonged engagements.</p><p>The design's reliance on proven, off-the-shelf components is both its greatest strength and its principal limitation. While the Lineholder is remarkably easy to maintain and repair (a quality reinforced by its widely recognized Easy to Maintain design quirk) it lacks the specialized edge of more expensive competitors. Many commands assign the Lineholder as the damage dealer in a medium attack lance or as the quick-response element of a heavier assault company, roles that play to its combination of speed, firepower, and endurance.</p>
deployment: |-
  <p>The base Lineholder model can be found in almost every garrison within the Chaos March and beyond. Its low cost and ease of repair have made it highly desirable among small and medium-sized units, from minor planetary militia to independent mercenary companies. Demand for the design has reached as far as Periphery states such as the Circinus Federation. In both its intended roles (as the damage dealer in a medium attack lance or as the quick ready-response 'Mech of a heavier assault company) the Lineholder's reputation for dependable, solid performance remains well-deserved.</p>
history: |-
  <p>The Lineholder emerged in 3058 from Kressly Warworks, an independent manufacturer operating on Epsilon Eridani in the contested Chaos March. Kressly's think tank developed the design using their "Common Sense Design" guidelines, a set of self-imposed engineering principles governing speed, thermal management, and weapons effectiveness. The result was a medium BattleMech that offered solid performance at a highly competitive price, a combination that proved irresistible to the minor factions, garrison commands, and independent units that formed the bulk of Kressly's target market.</p><p>The Lineholder's commercial success in its first years of production was remarkable by any standard for a new design. Its affordable price point and reliance on common, easy-to-source components made it the garrison machine of choice across the Chaos March, and demand quickly spread to the Federated Suns, the Word of Blake, and even Periphery states such as the Circinus Federation. This early success encouraged Kressly to invest in variant development, producing upgraded models targeting higher-paying customers.</p><p>The relationship between Kressly Warworks and the Word of Blake proved particularly significant. When the Blakists gained control of Epsilon Eridani during the late Civil War era, Kressly came under Word of Blake ownership, resulting in the development of the advanced KW2-LHW variant with integrated C3i networking. Simultaneously, Kressly produced the Linebreaker variant exclusively for the Federated Suns, until production was abruptly suspended following the dissolution of the second Star League, apparently as Blakist retaliation for the Federated Suns' no-confidence vote.</p><p>During the Jihad, Kressly Warworks continued operations under Word of Blake control, producing the LHW and base Lineholder variants for Blakist forces. Following the liberation of Epsilon Eridani and the establishment of the Republic of the Sphere, the factory transitioned to Republic oversight, resuming broader production including the previously suspended Linebreaker. The Republic era also saw the introduction of the KW2-LH10, a thoroughly modernized variant incorporating plasma weaponry and C3 emergency master technology that proved popular in command lances.</p><p>With the collapse of the Republic and the rise of the ilClan era, Epsilon Eridani passed to Capellan Confederation control, and Kressly Warworks continues to produce the Lineholder under its latest owners, proof of the enduring commercial viability of a design built from the start on principles of affordability, simplicity, and common sense.</p>
