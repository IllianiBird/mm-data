chassis: "Wyvern IIC"
overview: |-
  <p>The Wyvern IIC traces its origins to a chance discovery by Clan Burrock warriors, who found a forgotten Brian Cache in the Pentagon Worlds that had been thought lost during the Exodus Civil War. The well-stocked facility contained a modest number of BattleMechs and vehicles along with a substantial supply of components. Clan Burrock successfully defended their claim to the cache and their scientists converted it into a small factory for refitting BattleMechs, focusing primarily on the Wyvern. Upgraded with Clan-grade technology including double heat sinks and improved weaponry, the reborn design was designated the Wyvern IIC. First produced around 2843, the Wyvern IIC retained its predecessor's core architecture while gaining the firepower and thermal management advantages of Clan technology.</p>
capabilities: |-
  <p>The Wyvern IIC retains the original Wyvern's 180-rated fusion engine, full nine and a half ton armor complement, and 120-meter jumping capability on a new Type OES-45 Light Modified endo steel chassis. The primary armament centers on a Series 6b extended-range large laser backed by a pair of Series 2a Mk. 5 ER medium lasers, giving the design a potent medium-to-long-range energy punch that the original lacked. The Mk. 46 Type II LRM-10 and Mk. 22 Type III SRM-6 launchers are direct upgrades of the original missile systems, maintaining combined-arms flexibility.</p><p>A pair of Type VII rotary cannons and a "Hellfire" Series II flamer enhance the Wyvern IIC's effectiveness in garrison and anti-infantry operations. Both hands were retained so the 'Mech could assist in construction and heavy lifting during peacetime. Twelve double heat sinks give the design far superior thermal management compared to the original, allowing sustained weapons fire that would quickly overwhelm the earlier model.</p>
deployment: |-
  <p>The base Wyvern IIC retains the original Wyvern's core architecture, including its 180-rated fusion engine and 120-meter jump capability, while upgrading nearly every other system to Clan standards. The Clan-grade endo steel chassis and CASE-protected ammunition bays restore the protection that was stripped from many Succession Wars era Wyverns, while twelve double heat sinks provide dramatically improved thermal management. The addition of machine guns and a flamer alongside the upgraded energy and missile weapons reinforces the design's traditional role as a city garrison 'Mech, equally capable of engaging enemy combatants and controlling civilian populations.</p>
history: |-
  <p>Clan Burrock established the Manzikert Fabrication and Assembly Plant Gamma on Dagda to produce the Wyvern IIC beginning around 2843. As the Burrocks expanded into new territory and began colonizing nearby worlds in the Kerensky Cluster, the Khans assigned Stars of Wyvern IICs to each new settlement as garrison forces. Production continued on and off at the Manzikert facility for approximately two centuries, with the Wyvern IIC finding a place in nearly every Clan's touman as a practical second-line 'Mech. The Blood Spirits and Fire Mandrills acquired a notable number through years of raiding the Burrocks.</p><p>The Absorption of Clan Burrock by Clan Star Adder in 3059 brought the Wyvern IIC's production facilities under new management. Clan Star Adder inherited the Manzikert plant and the majority of existing Wyvern IICs, reportedly gearing up the facility for renewed production to fill gaps in their expanded second-line Galaxies following the Absorption War.</p><p>During the Jihad era, a field refit variant designated the Wyvern IIC 2 emerged in 3071, upgrading the design with advanced technology including heavy lasers and an ATM launcher. This variant was associated with Clan Wolf field modifications rather than the Manzikert production facility.</p>
