chassis: "Field Gun Platoon (CCAF)"
model: "(Wheeled HVAC5 3059+)"
overview: |-
  <p>Capellan infantry serve where BattleMechs and armor cannot be spared, which in the resource-constrained CCAF means nearly everywhere. The Xin Sheng movement revitalized the infantry arm alongside every other facet of the Capellan Confederation Armed Forces, giving foot soldiers better equipment and renewed purpose. Field gun platoons provide Capellan infantry with organic direct-fire heavy weapons, towing crew-served autocannons or other heavy guns to prepared positions. The weapon crew operates the gun while the remaining troopers provide local security with personal arms. Their hyper-velocity autocannon/5 combines improved range with respectable hitting power, giving the crew greater standoff distance.</p>
