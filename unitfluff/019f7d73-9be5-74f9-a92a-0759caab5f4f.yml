chassis: "Foot Platoon (Generic)"
model: "(SRM 2400+)"
overview: |-
  <p>Foot infantry platoons are the most basic and numerous conventional military formation across the Inner Sphere and Periphery. Deployed on foot without dedicated transport, these platoons are slow to reposition but cheap to raise, easy to supply, and capable of holding ground that faster units cannot afford to garrison permanently. Every major military fields foot platoons in enormous numbers for planetary defense, installation security, and rear-area policing. Their lack of mobility makes them poorly suited for offensive operations against armored forces, but in prepared defensive positions, urban terrain, or dense forests, dismounted infantry remain difficult to dislodge without committing disproportionate resources.</p><p>Supplementing their primary arms with shoulder-launched short-range missile systems, these platoons carry enough anti-armor punch to threaten light vehicles and damage exposed BattleMech components at close range.</p>
