chassis: "Motorized Platoon (CCAF)"
model: "(Gauss 3063+)"
overview: |-
  <p>The Capellan Confederation has always relied on its infantry to compensate for the CCAF's chronic shortage of heavier assets. Conventional foot soldiers, drawn from the citizens' militia system that defines Capellan military service, form the backbone of garrison forces across the Confederation's commonalities. Motorized platoons provide the CCAF with faster-moving infantry that can reposition between garrison posts or screen advancing forces along road networks. Their motorcycle and light vehicle transports sacrifice protection for speed, making them best suited to patrol and rapid-response roles. Light David gauss rifle sections carry precision electromagnetic weapons that deliver exceptional accuracy and penetration at range, making these platoons a serious threat to lightly armored targets.</p>
