chassis: "Firestarter"
model: "FS9-HB"
overview: |-
  <p>The FS9-HB is a low-cost attempt to make the Firestarter more effective against battlefield Abominations. It replaces the machine guns and standard medium lasers of the FS9-H with a pair of light blazers while retaining all fusion-charged flamers. The result offers extra punch at medium range but runs significantly hotter, even with lasers tuned to dazzle mode. The lack of ammunition means this variant is more likely to shut down than explode when overheated.</p>
capabilities: |-
  <p>Retains the Firestarter's signature speed and jump mobility, making it ideal for hit-and-run harassment. The blazers extend effective engagement range beyond flamer distance, allowing pilots to soften targets before closing. Heat accumulation is the primary tactical concern, as sustained fire will force shutdowns. Experienced pilots cycle between dazzle mode and full power shots to maintain pressure without cooking themselves.</p>
