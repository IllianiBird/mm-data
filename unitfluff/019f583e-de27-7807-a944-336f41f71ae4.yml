chassis: "Atlas II"
model: "AS7-D-H (Devlin)"
overview: |-
  <p>Designed in 2755 to maintain the SLDF's edge over the League's Member States, the AS7-D Atlas remains a formidable assault 'Mech even today. But to General Aleksandr Kerensky that was only the beginning, and an advanced version developed for the Royal BattleMech regiments was just beginning deployment on the eve of the bloody Amaris Coup. At one hundred tons, the Atlas II refined its predecessor's already formidable combination of firepower, protection, and psychological impact, incorporating Star League-era technologies to create what many consider the definitive Royal assault 'Mech. Its extreme rarity and storied lineage have made the Atlas II one of the most sought-after chassis in the Inner Sphere and Clan space alike.</p>
capabilities: |-
  <p>An evolution of the iconic AS7-D, the AS7-D-H Atlas II retains the basic structure and electronics. The original missile armament is retained, but a smaller caliber arm-mounted LB 10-X autocannon replaces the heavy autocannon. Installed in a double mount on the left forearm, extended-range large lasers complement the autocannon and LRM launcher. With this heavier arm-mounted weaponry, rear-firing weaponry was deemed redundant and the medium lasers (upgraded to pulse models) were switched to fire forward.</p><p>There was no way to surpass the Atlas' legendary armor, but upgrading to ferro-fibrous allowed CASE to be installed. Many of the stylistic alterations in the BattleMech's appearance were made during this change in armor type.</p><p>The trade-offs in this redesign are notable. The LB 10-X, while versatile with its cluster and slug ammunition options, lacks the devastating close-range stopping power of the original AC/20 that made the standard Atlas such a fearsome brawler. Additionally, the Atlas II's extreme rarity has always posed significant logistics challenges. Spare parts, particularly for the advanced ferro-fibrous armor and LB 10-X feed system, are difficult to source outside of major manufacturing centers, and field repairs often require cannibalization of other advanced 'Mechs.</p>
deployment: |-
  <p>Originally assigned to the Word of Blake garrison on Kittery, this Atlas II became the personal command vehicle of the enigmatic Devlin Stone when the planet was liberated from Blakist control. Stone's technicians extensively modified the machine, combining Clan and Inner Sphere technology to create a unique command platform. An XL engine freed tonnage for an MML-9 with Artemis IV fire control, CASE II ammunition protection, an Angel ECM suite, and an anti-missile system. Sporting its distinctive black-and-white skeletal color scheme, the "Phantom" became the most recognizable 'Mech of the coalition war against the Word of Blake. Stone personally commanded from its cockpit during the Trial of Possession against a Star of Ghost Bears on Tukayyid in 3073, and led the flanking maneuver that shattered the Blakist Third Division on Skye in mid-3074.</p>
history: |-
  <p>The Atlas II was still in its first stages of deployment when the New Vandenburg Revolt sparked off the Periphery uprisings in 2765. Facing formidable odds, these few AS7-D-Hs performed magnificently in the hands of their Royal regiment pilots. General Kerensky himself piloted one during his escape from New Vandenburg, proof of the faith the Commanding General placed in his enhanced Atlas design.</p><p>With the news that the Terran Hegemony had fallen under Amaris' control, Kerensky led his troops to secure the lightly defended Rim Worlds Republic as a base of operations. Captured Republican factories were repurposed to produce Atlas IIs for Royal commands as they fought the grueling campaign to liberate the Terran Hegemony. When the time came for the Exodus, the Atlas II's fate diverged sharply from its predecessor. While many standard AS7-D Atlas pilots chose to remain in the Inner Sphere, the surviving Atlas II pilots chose almost unanimously to follow their Commanding General into exile. The Atlas II thus vanished from the Inner Sphere entirely, becoming a near-mythical machine known only from old records and fading memories.</p><p>In the Clan Homeworlds, the Atlas II became one of the most prized assault 'Mechs. The Clans treasured every example discovered in Brian Caches during their formative years. The most famous Atlas II in Clan history was piloted by ilKhan Nicholas Kerensky himself, eldest son of Aleksandr. Nicholas had followed his father into exile and, after the elder Kerensky's death, forged the scattered exiles into twenty Clans. He led them on a crusade to retake the war-ravaged Pentagon worlds in 2821. Thirteen years later, in 2834, ilKhan Nicholas Kerensky died at the controls of his Atlas II when he intervened in a Trial of Grievance between Widowmaker Khan Cal Jorgensson and Wolf Khan Jerome Winson. The Widowmakers had committed a gross breach of zellbrigen, and when Kerensky stepped between the combatants, Khan Jorgensson fired into the Atlas II's cockpit, killing the ilKhan and sealing Clan Widowmaker's fate. The destruction of the Widowmakers that followed remains one of the most consequential events in Clan history.</p><p>The Atlas II returned to the Inner Sphere in dramatic fashion. A single example was sighted among the Jade Falcon Touman during the fighting on Tukayyid in 3052, sending shockwaves through ComStar intelligence analysts who had believed the design extinct. During the Jihad, when the Word of Blake captured Defiance Industries' factories on Hesperus II, they produced several runs of the Atlas II for their forces. The enigmatic Devlin Stone piloted one such machine, the "Phantom," in its distinctive black-and-white skeletal color scheme, as he led his growing coalition against the Blakists. Stone personally commanded from the Atlas II's cockpit during the Trial of Possession against a Star of Ghost Bears on Tukayyid in 3073, and led the flanking maneuver that shattered the Blakist Third Division on Skye in 3074. After the coalition forces evicted the Word of Blake from Hesperus II, Defiance Industries chose to keep the Atlas II in production, finally returning this legendary Royal 'Mech to the Inner Sphere after nearly three centuries of absence.</p>
