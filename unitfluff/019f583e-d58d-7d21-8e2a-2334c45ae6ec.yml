chassis: "Storm Raider"
model: "STM-R4"
overview: |-
  <p>The Storm Raider was designed by Defiance Industries as a light BattleMech alternative to the venerable Hollander, arriving roughly half a century too late to make the impact its creators had envisioned. The prototypes were so poorly received during evaluation trials that Defiance elected to license the entire product line to Coventry Metal Works rather than continue development in-house. Coventry began manufacturing four versions of the thirty-five ton design on Coventry, originally intended for small-scale surgical strikes and urban defense operations.</p><p>The Storm Raider struggles in both intended roles, easily outpaced and outgunned by contemporaries such as the Havoc and Nyx. Despite these shortcomings, the design found an unexpected niche on the Solaris VII arena circuit, where its modular weapons system and combination of speed and melee capability made it a fan favorite. Most military deployments see the Storm Raider relegated to picket and garrison duties within the Lyran Commonwealth Armed Forces.</p>
capabilities: |-
  <p>The Storm Raider is most notable as the first BattleMech equipped with Coventry Cast Off, a hybrid modular weapons system developed by Coventry Metal Works. Like competing modular products, a CCO-compliant weapon can be quickly and easily replaced in the field. Unlike the competition, a CCO weapon may be jettisoned during combat without posing any risk to the MechWarrior. However, CCO weapons are not interchangeable between mount points, and while repair times have been reduced, reconfiguration still presents the usual logistical challenges.</p><p>Built on a MatherTech 750 endo steel frame and powered by a GM 210 XL engine, the Storm Raider achieves a respectable top speed of ninety-seven kilometers per hour, which can be pushed to nearly one hundred and thirty with its MASC system engaged. The primary ranged weapon is a Thor 40mm rotary autocannon mounted in the left arm, complemented by a mace in the right arm for close-quarters engagements. Seven tons of Lexington Ltd. Medium Grade armor provide adequate protection for a light BattleMech, with CASE safeguarding the ammunition supply. The lack of jump jets limits the Storm Raider's tactical flexibility, particularly in the urban environments it was ostensibly designed to fight in.</p>
deployment: |-
  <p>This variant retains the STM-R3's complete weapons loadout but upgrades the standard Lexington Ltd. armor to impact-resistant plating, improving the 'Mech's resilience against physical attacks and falls. This variant also replaces standard CASE with CASE II, providing superior ammunition explosion containment. The modifications make this variant particularly well-suited for the rough-and-tumble conditions of urban combat and arena fighting, where physical impacts are frequent and catastrophic ammunition detonations can end a fight instantly.</p>
history: |-
  <p>The Storm Raider's development at Defiance Industries was intended to provide the Lyran Commonwealth with a modern light BattleMech alternative to the aging Hollander design. Unfortunately, the project suffered from chronic delays, and by the time prototypes were ready for evaluation, the market had moved on. Competing designs from other Lyran manufacturers had already filled the tactical niche Defiance had targeted, and the Storm Raider's lackluster performance during trials convinced Defiance to cut its losses. Rather than scrap the project entirely, Defiance licensed the design to Coventry Metal Works, which began production in the early thirty-second century.</p><p>Despite its poor reputation among military planners, the Storm Raider saw action during significant engagements in the Dark Age era. In 3127, during Donegal Guards war games on Caledonia, two Storm Raiders became involved in an incident that demonstrated both the design's capabilities and its limitations in chaotic close-quarters fighting. The exercise devolved into live fire when participants lost discipline, resulting in courts-martial and highlighting the dangers inherent in mixing volatile light BattleMechs with hot-tempered MechWarriors.</p><p>The design saw more purposeful combat during the nineteenth battle for Hesperus II, where Eridani Light Horse forces were pursued by elements of Clan Hell's Horses' 666th Mechanized Assault Cluster. A reconnaissance lance that included two Storm Raiders was deployed as bait in the Somerset Wilderness, using the 'Mechs' speed and MASC capability to lure Clan vehicles into a prepared ambush among the region's distinctive rock columns. The Storm Raiders engaged the pursuing forces with rolling autocannon fire before leading them into the kill zone, where the ambush destroyed one vehicle and disabled another, denying the 666th critical tactical intelligence. When the Clanners entered the wilderness two hours later, they faced multiple ambushes and paid dearly for every meter gained.</p><p>The Storm Raider has maintained steady production at Coventry Metal Works throughout the Dark Age and into the ilClan era. While never achieving widespread front-line deployment, the design continues to serve in garrison and picket roles across the Lyran Commonwealth, with a significant secondary market on the Solaris VII arena circuit where its modular weapons system and melee capability have earned it a loyal following among spectators and competitors alike.</p>
