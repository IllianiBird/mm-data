chassis: "Malak"
model: "C-MK-OC Comminus"
overview: |-
  <p>The Malak is the lightest member of the Word of Blake's Celestial series, a family of advanced OmniMechs designed exclusively for the order's cybernetically enhanced Manei Domini warriors. Entering service in 3069, the thirty-ton design was the most numerous Celestial produced, its relatively modest resource requirements allowing faster assembly than its heavier siblings. Gibson Federated BattleMechs and Martinson Armaments handled volume production. As the fastest Celestial, the Malak fills the role of a swift striker and reconnaissance platform, leveraging its speed and OmniPod flexibility to punch well above its weight class in the combined-arms formations favored by the Shadow Divisions.</p>
capabilities: |-
  <p>The Malak's chassis employs an aggressive weight-saving philosophy, combining a Celestial Series MK1E endo steel frame with a DefHes 210 light fusion engine, XL gyro, and small cockpit. Six tons of Divine Shield light ferro-fibrous armor provide reasonable protection for the weight class. These measures free nine and a half tons of pod space, a remarkably generous allocation for a thirty-ton design. The DefHes engine pushes the Malak to a top speed of one hundred eighteen kilometers per hour, making it the fastest Celestial by a considerable margin. A fixed C3i computer enables seamless networked targeting with other Manei Domini units.</p><p>The Invictus configuration pairs a light PPC with an ER medium laser and flamer for supply-independent operations, supplemented by an SRM-2 capable of firing Inferno rounds that prove devastating against vehicles and infantry. A retractable blade gives the Malak a credible melee threat, while CASE protects against ammunition detonation. Across its configurations, the Malak emphasizes energy weapons and electronic warfare packages, reflecting its intended role as a dangerous forward element operating beyond conventional supply lines.</p>
deployment: |-
  <p>The Comminus configuration is a dedicated scout and electronic warfare platform. A Beagle active probe detects hidden units, TAG designates targets for artillery and guided munitions, and a Guardian ECM suite masks the formation from enemy sensors. A targeting computer guides two ER medium lasers and three ER small lasers with precision, while a single-use B-Pod deters battle armor from attempting to swarm the chassis. The configuration makes the Malak an invaluable intelligence asset within Manei Domini formations.</p>
history: |-
  <p>The Malak was the Celestial series design that most Coalition forces encountered first, and its operational debut came as a profound shock. When the Shadow Divisions revealed themselves during the Jihad, intelligence services struggled to classify the new OmniMechs, and the Malak's light tonnage led many commands to underestimate it. That mistake cost several units dearly. Operating in fast-moving Level IIs alongside heavier Celestials, Malaks exploited their C3i networking to deliver coordinated strikes with lethal precision. A single Malak was dangerous. A networked lance of them, sharing targeting data in real time through the C3i system, could focus fire with an accuracy that seemed almost preternatural to conventional opponents. Standard anti-OmniMech tactics assumed independent targeting, but C3i-linked Malaks shared sensor feeds and firing solutions across the entire lance, meaning that destroying one machine's sensors did nothing to degrade its accuracy as long as another unit in the network maintained target lock. This networked lethality became the defining tactical signature of the Shadow Divisions and forced Coalition planners to rethink engagement doctrine against Word of Blake formations entirely.</p><p>As the lightest Celestial, the Malak was produced in greater numbers than its heavier siblings. Its relatively modest material requirements meant faster assembly times, and a steady flow of replacements reached front-line Shadow Divisions throughout the conflict. This numerical advantage made the Malak the backbone of Celestial light elements. The design proved particularly effective in urban environments, where its small profile and jump-capable configurations exploited avenues of approach that larger machines could not use. In open terrain, Malaks served as the eyes and flankers of Celestial formations, ranging ahead to identify targets and relay C3i firing solutions back to the heavier designs trailing behind.</p><p>The Fifty-first Shadow Division made extensive use of Malaks during its campaigns, with Ghost Adept Omega Anaku piloting a particularly aggressive custom configuration. Anaku's unit demonstrated the design's value as a flanking element, using speed and electronic warfare to isolate enemy formations before the heavier Celestials closed in. The Caelestis configuration, which incorporated captured Clan technology including a PPC capacitor, demonstrated the lengths to which Blakist engineers went to maximize combat effectiveness, integrating experimental and foreign technology into a thirty-ton frame.</p><p>Members of the Opacus Venatori also favored the chassis for covert operations. Operative Mi Tomitaki fielded a configuration built around experimental variable speed pulse lasers that allowed her to close rapidly and deliver devastating precision fire. Her machine also mounted a supercharger for brief bursts of extraordinary speed, a combination that highlighted the Opacus Venatori's preference for specialized technology packages tailored to individual operatives.</p><p>By the ilClan era, functional Malaks are exceedingly rare. The Malak's numbers during the Jihad ensured more survived than any other Celestial, but attrition and the impossibility of manufacturing replacement parts have steadily reduced that advantage. Intelligence analysts consider each confirmed sighting a significant indicator, as the design's advanced maintenance requirements suggest the presence of organized Blakist support infrastructure rather than isolated rogue operators. Despite their scarcity, the Malak's proven lethality in networked formations means that even a single confirmed example demands a serious tactical response.</p>
