chassis: "Mechanized Wheeled Century (MHAF)"
model: "(Rifle 3049+)"
overview: |-
  <p>Caesar's ongoing program to modernize the Legiones Marianes has extended to conventional infantry formations, with improved equipment and weapons gradually replacing older stockpiles across the Hegemony's auxiliary legions. A centuria, or century, is the Marian equivalent of a company-sized formation. Mechanized wheeled centuries use wheeled transports that offer good road speed and lower maintenance costs than tracked vehicles, well suited to the Hegemony's infrastructure-limited Periphery worlds where supply lines stretch thin. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon available, these formations deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
