chassis: "Mechanized Hover Platoon (DCMS)"
model: "(SRM 2620+)"
overview: |-
  <p>Conventional infantry within the DCMS serve as the foundation of planetary defense, providing the manpower essential to territorial control while freeing BattleMech and armored assets for offensive operations. Hover-mechanized infantry ride hovercraft that can cover ground faster than any tracked or wheeled formation in the DCMS inventory. District commanders prize these platoons for rapid redeployment between garrison posts, and during the Jihad, hover-mechanized troops proved their worth in the kind of hit-and-run resistance operations that the Dictum Honorium demanded of citizens on occupied worlds. Support elements carry man-portable short-range missile launchers that fire the same warheads used by BattleMechs and combat vehicles. At close range, a well-aimed SRM can crack vehicle armor that personal weapons cannot scratch, giving the platoon a meaningful anti-armor capability.</p>
