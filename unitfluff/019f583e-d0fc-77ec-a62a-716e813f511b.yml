chassis: "Raptor"
model: "RTX1-OU"
overview: |-
  <p>The Raptor holds the distinction of being the first Inner Sphere OmniMech ever produced. Designed by Luthien Armor Works as a proof of concept after months of studying Clan OmniMech salvage recovered from the Battle of Luthien in 3052, the twenty-five ton design validated that Inner Sphere engineers could replicate the modular technology that had given the Clans such a decisive advantage during the invasion. The Raptor filled the role of a light reconnaissance and fast strike platform, where its ability to rapidly reconfigure loadouts between missions proved invaluable to Draconis Combine commanders adjusting to the new reality of the Clan threat.</p><p>Though initially regarded with skepticism by traditionalists within the DCMS, Luthien Armor Works stood behind the design and eventually won over even its harshest critics. The Raptor became the premier light OmniMech of the Combine, and its prolific production saw it spread beyond Combine borders to become one of the most widely fielded Inner Sphere OmniMechs of its era.</p>
capabilities: |-
  <p>The Raptor is built on an Alshain Type KR140 endo steel chassis powered by a weight-saving Omni 175 XL engine, giving the design a top speed of just under 119 kilometers per hour. This speed is the Raptor's primary defense, as three and a half tons of StarSlab/4 armor provides only modest protection against sustained fire. The trade-off is deliberate, maximizing the eleven and a half tons of pod space available for mission-specific loadouts, which represents an impressive proportion of the chassis's total mass.</p><p>The Prime configuration reflects a versatile combat philosophy, mounting three LRM-5 launchers for long-range harassment alongside two medium lasers and two small lasers for closer engagements. A pair of machine guns provides anti-infantry capability. This mix allows the Prime to contribute meaningfully at multiple range brackets while maintaining the speed to disengage when outmatched.</p><p>With seven distinct factory configurations and additional field variants, the Raptor demonstrates the flexibility that makes OmniMech technology so valued. Loadouts range from pure energy builds for extended operations to electronic warfare packages and even an underwater combat configuration, ensuring the Raptor can be tailored to virtually any light 'Mech mission profile.</p>
deployment: |-
  <p>Alternate Configuration U is a specialized underwater combat variant, equipping three ER medium lasers and two SRT-4 launchers alongside seven underwater maneuvering units. The UMUs maximize the Raptor's aquatic mobility, making it one of the few light OmniMechs capable of effective subsurface operations. While highly specialized, the configuration fills an important niche for naval base defense and amphibious assault support missions.</p>
history: |-
  <p>The Raptor's origins trace directly to the Battle of Luthien in January 3052, when the combined defense of the Combine capital against Clan Smoke Jaguar and Clan Nova Cat yielded significant quantities of Clan salvage. Luthien Armor Works engineers studied the captured OmniMech technology intensively, and by May 3052, just months after the battle, the first Raptors walked off the production line at the OmniMech Production Facility on Luthien. The very first units were assigned to the Dragon's Claws for testing, with additional Raptors sent to the Sword of Light, Genyosha, and Ghost regiments for further evaluation.</p><p>Acceptance within the DCMS was gradual. Many Combine soldiers, steeped in tradition, were slow to appreciate the advantages of an OmniMech that could swap its weapons between engagements. It took years for the standard Combine soldier to recognize the tactical flexibility the Raptor offered, but its performance during Operation Bulldog in 3059 and the Combine-Dominion War proved decisive in cementing the design's reputation. By the early 3060s, the Raptor was found in the regiments of every top-rated command within the Combine.</p><p>The Raptor's success saw it proliferate beyond Combine boundaries, becoming available to allied states and even appearing in mercenary commands. The design's "Easy to Maintain" reputation made it popular with units that lacked dedicated OmniMech maintenance facilities, as the Raptor proved more forgiving of improvised repair work than many of its contemporaries.</p><p>Production at Luthien Armor Works continued through the Civil War era, but the facility ceased Raptor production during the Jihad when the Word of Blake's assault on Luthien devastated much of the planet's industrial capacity. While LAW survived and eventually resumed other production lines, Raptor manufacturing was not restarted, leaving surviving units increasingly reliant on salvage and aftermarket parts to remain operational.</p>
