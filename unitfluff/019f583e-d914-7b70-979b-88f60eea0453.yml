chassis: "Cauldron-Born"
model: "X"
overview: |-
  <p>The Ebon Jaguar was first fielded by Clan Smoke Jaguar in 3049, designed to address perceived shortcomings in the venerable Hellbringer OmniMech. Originally designated the Ebon Jaguar by its creators, the design was still so new at the time of Operation Revival that even among the Clans the 'Mech became more commonly known by its Inner Sphere reporting name of Cauldron-Born. Inner Sphere forces first encountered the design during the Battle of Luthien in 3052, where its ability to absorb punishing damage and remain operational inspired the codename after the unstoppable zombies of Irish mythology. Built on a sixty-five-ton Endo Steel chassis powered by a 325-rated XL engine, the Cauldron-Born was conceived as a versatile heavy 'Mech capable of engaging enemies across multiple range brackets while maintaining a respectable top speed of eighty-six kilometers per hour.</p>
capabilities: |-
  <p>The Cauldron-Born's base chassis provides an exceptional platform for its thirty tons of available pod space. The Consolidated Fusion 325 XL engine drives the sixty-five-ton frame to a top speed of eighty-six kilometers per hour, granting the design unusual mobility for a heavy OmniMech. Nine and a half tons of Composite A-4 ferro-fibrous armor provide solid protection, though the design concentrates this armor heavily on the torso sections at the expense of the limbs, contributing to its reputation for staying operational even under sustained fire. Thirteen integral double heat sinks form the foundation of the thermal management system, though many configurations require additional sinks to manage their weapons loads.</p><p>The primary configuration exemplifies the Cauldron-Born's multi-range philosophy, mounting a Gauss rifle in the right arm for devastating long-range strikes alongside an LB 5-X autocannon in the left arm for flexible engagement options. An LRM-10 rack provides additional indirect fire capability, while an SRM-2 launcher and ER medium laser offer close-range defense. This combination allows the Prime to threaten opponents at virtually any distance while keeping heat generation well within manageable levels. The design's primary weakness lies in its lack of jump jets, limiting its ability to exploit terrain advantages that lighter OmniMechs take for granted.</p>
deployment: |-
  <p>Alternate Configuration X leverages advanced and experimental technology to create a sophisticated electronic warfare platform. An Angel ECM Suite provides comprehensive protection against enemy targeting and communications systems. The primary weapon is a Rotary Autocannon/5 in the right arm, capable of delivering devastating volumes of fire, supported by three ER medium pulse lasers and an ER small pulse laser. All weapons are linked to a targeting computer that maximizes accuracy. This combination of electronic warfare capability and precision firepower makes the X configuration particularly effective in combined-arms operations.</p>
history: |-
  <p>The Ebon Jaguar earned its reputation in blood during the Battle of Luthien in 3052. On the Tairakana Plains, the Trinary Alpha of the First Jaguar Guards Cluster charged the center of the Combine defense, and the Cauldron-Born's relentless ability to sustain damage and continue fighting left an indelible impression on the defending forces. The Sword of Light regiment engaged these 'Mechs repeatedly, with after-action reports and corroborating video evidence confirming extensive kill tallies that underscored the design's lethality in sustained engagements.</p><p>By the time of Operation Bulldog, the Cauldron-Born had become a mainstay of the rebuilding Smoke Jaguar heavy 'Mech formations. Following the Annihilation of Clan Smoke Jaguar in 3060, the design proliferated rapidly among the remaining Clans, though the Jade Falcons, Wolves, and Coyotes continued to favor the older Hellbringer in their respective toumans. The Wars of Reaving further accelerated the Ebon Jaguar's adoption among the Home Clans, where it finally supplanted the Hellbringer in most toumans. Only Clan Coyote remained loyal to the older design, driven by a determination to redeem the Hellbringer's honor through continued service.</p><p>The sundering of ties between the Clan Homeworlds and the Inner Sphere saw the number of Cauldron-Borns in the occupation zones steadily decline over the following decades. This trend reversed in the late Dark Age era when Clan Sea Fox chose to revive production of the design at Manufacturing Plant SFF-CO1 on Corell. The Cauldron-Born appeared in strength across the Sea Fox Aimags, with Gamma Aimag of the Tiburon Khanate deploying the OmniMech in raids against the Capellan Confederation. When SaKhan Andreas Sutherland offered the design to Khan Alaric Ward of Clan Wolf, the offer was declined, but the Capellan Confederation proved eager to acquire the OmniMech for its campaigns against the Republic of the Sphere. The Second McCarron's Armored Cavalry received Cauldron-Borns in time for their assault on Liberty, where the design's long-range firepower helped reduce Republic resistance at the capital city of Dronane.</p>
