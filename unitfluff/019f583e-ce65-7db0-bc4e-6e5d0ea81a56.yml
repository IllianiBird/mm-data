chassis: "Galahad"
model: "GLH-1D"
overview: |-
  <p>The Galahad was conceived by Mitchell Vehicles as a direct replacement for the RFL-2N Rifleman in service with the Terran Hegemony. First unveiled in 2570, the GLH-1D was a fifty-ton medium fire-support platform that carried heavier firepower than its predecessor but suffered from the same chronic overheating problems. Despite finding acceptance within the Hegemony Armed Forces and seeing action during the Reunification War, the Galahad never fully supplanted the Rifleman in the fire-support role.</p><p>The development of the Gauss rifle prompted Mitchell Vehicles to fundamentally redesign the chassis in 2594, creating the sixty-ton GLH-2D heavy BattleMech that would become the definitive version. The Hegemony restricted the advanced GLH-2D primarily to SLDF Royal units, and the design's reliance on cutting-edge Star League technology would ultimately seal its fate during the technological decline of the Succession Wars.</p>
capabilities: |-
  <p>The GLH-2D Galahad serves as a bold commitment to ballistic firepower over all other considerations. Mounting two massive M-7 Gauss rifles in fully articulated arm assemblies, the design earned the nickname "Gausszilla" for its ability to deliver devastating long-range barrages. This firepower comes at significant cost, however. The GM 180 engine provides a maximum speed of only 54 km/h, making it one of the slowest heavy 'Mechs of its era and often forcing accompanying units to reduce speed to avoid leaving the Galahad behind. The complete absence of secondary armament or hand and lower arm actuators leaves the design critically vulnerable in close-quarters engagements.</p><p>The shoulder rotation rings, originally engineered for the GLH-1D's energy weapon loadout, proved inadequate for absorbing Gauss rifle recoil. Frontline units during the Reunification War reported catastrophic coupling failures, with accounts of fifteen-ton detached rifle assemblies spinning through the air after firing. Although Mitchell Vehicles redesigned the couplings, the Galahad still required fifteen percent more preventative maintenance time compared to similar-weight designs. Eleven tons of Grumman-3 ferro-fibrous armor mounted on a Star League VI endo-steel frame provide respectable protection, but the design's true survivability depends on maintaining the standoff distance its Gauss rifles demand.</p>
deployment: |-
  <p>The original Galahad was a fifty-ton medium fire-support design powered by a GM 150 fusion engine and built on Star League V endo-steel internals. Armed with two Magna Hellstar PPCs and two Nova large lasers, this variant carried impressive firepower for its weight class but was plagued by chronic overheating despite mounting thirteen double heat sinks. The slow speed compounded this weakness, as MechWarriors who attempted alpha strikes risked catastrophic heat buildup. Built in large numbers for the Hegemony Armed Forces, this variant spread throughout the Star League militaries over the next two centuries but was ultimately supplanted when the RFL-3N Rifleman became the standard fire-support 'Mech.</p>
history: |-
  <p>Mitchell Vehicles developed the original GLH-1D to replace the aging Rifleman for the Terran Hegemony. Though the design found acceptance in the Hegemony Armed Forces and saw deployment during the Reunification War, the Galahad never fully displaced its predecessor. The introduction of the GLH-2D in 2594, built around the revolutionary Gauss rifle, transformed the chassis from a troubled medium 'Mech into a formidable heavy fire-support platform. The Hegemony restricted the advanced GLH-2D primarily to SLDF Royal units, keeping the powerful Gauss weaponry out of the hands of the League's member states.</p><p>The process of manufacturing the M-7 Gauss rifle's superconductors was among the first technological casualties of the Succession Wars. Combined with the destruction of the Graham IV manufacturing center during the First Succession War, the loss of endo-steel and ferro-fibrous armor production capability made it impossible for the Successor States to maintain or reproduce the design. While sizable numbers of the less advanced GLH-1D had spread to the Member State militaries, the technological decline of the era claimed most of those as well. A handful of examples survived in ComStar's secret weapons caches, and occasional patchwork Galahads could be found defending Periphery backwaters or serving with mercenary commands, but the design effectively vanished from the Inner Sphere's battlefields for centuries.</p><p>The Galahad's return came during the Word of Blake Jihad. After capturing Hesperus II in 3070, the Word of Blake established a new production line for the modernized GLH-3D variant at the Defiance Industries complex. The Fortieth Shadow Division fielded these new Galahads to telling effect against coalition forces during the brutal siege at Maria's Elegy. When Blakist fortifications finally fell at the end of 3074, the First Skye Jaegers salvaged several relatively intact examples.</p><p>Following the liberation of Hesperus II, the Lyran Alliance converted the production line back to the GLH-2D variant, restoring this ancient design to active service in the post-Jihad era. The Lyran Commonwealth has maintained production at Defiance Industries since, ensuring the Galahad once again patrols the battlefields of the Inner Sphere centuries after its original designers intended.</p>
