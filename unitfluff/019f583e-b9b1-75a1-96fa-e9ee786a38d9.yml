overview: |-
  <p>Word of Blake Militia infantry served as the backbone of Protectorate garrison forces across dozens of conquered worlds, providing the manpower for territorial control that the Militia's BattleMech and armor assets could not sustain alone. Towing crew-served autocannon rated for light suppressive fire, these field gun crews deliver sustained ballistic firepower at ranges well beyond personal weapons, providing area denial capability against infantry and light vehicles.</p>
