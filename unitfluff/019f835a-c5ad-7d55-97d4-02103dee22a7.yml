chassis: "Foot Platoon (Generic)"
model: "(Sniper Detachment 2200+)"
overview: |-
  <p>Foot infantry platoons are the most basic and numerous conventional military formation across the Inner Sphere and Periphery. Deployed on foot without dedicated transport, these platoons are slow to reposition but cheap to raise, easy to supply, and capable of holding ground that faster units cannot afford to garrison permanently. Every major military fields foot platoons in enormous numbers for planetary defense, installation security, and rear-area policing. Their lack of mobility makes them poorly suited for offensive operations against armored forces, but in prepared defensive positions, urban terrain, or dense forests, dismounted infantry remain difficult to dislodge without committing disproportionate resources. Operating as designated marksman teams within a larger platoon framework, these snipers provide precision long-range fire from concealed positions, engaging high-value targets with disproportionate tactical and psychological effect.</p>
