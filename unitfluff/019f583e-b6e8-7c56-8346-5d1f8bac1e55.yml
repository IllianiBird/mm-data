chassis: "Foot Platoon (AFFS)"
model: "(LRM 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Foot infantry remain the backbone of AFFS planetary garrisons, cheap enough to deploy in numbers across the Federated Suns' vast territory and reliable enough to hold ground that BattleMech forces cannot permanently occupy. Carrying man-portable long-range missile launchers alongside their primary weapons, these platoons can engage armored targets at distances well beyond normal infantry range, providing organic fire support that reduces dependence on dedicated armor or artillery assets.</p>
