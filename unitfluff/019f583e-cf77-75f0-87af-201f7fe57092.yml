chassis: "Deimos"
model: "2"
overview: |-
  <p>The Deimos is a Clan Snow Raven assault OmniMech that spent over two decades in development before being formally unveiled to the Inner Sphere. First reports of the eighty-five-ton design emerged from the Kerensky Cluster world of Lum during the mid-3060s, where rumors described a massive machine built to the Ravens' exacting aerospace technology standards. Designed to support naval and aerospace operations while maintaining formidable ground combat capability, the Deimos represented the Snow Ravens' ambition to field a heavy assault platform worthy of their aerospace-centric doctrine. The Jihad and the subsequent White Out severed intelligence channels from the Homeworlds, and the project faded from Inner Sphere awareness. It was not until 3085 that the Snow Ravens formally revealed the Deimos, now in production at the Snow Raven Industrial Complex Alpha on Dante, establishing it as a source of considerable Clan pride.</p>
capabilities: |-
  <p>The Deimos features a broad-shouldered, digitigrade frame comparable to designs such as the Ghost Bears' Bruin, the Hell's Horses' Hellstar, and the Wolves' Night Wolf and Blood Reaper. The broad foot assembly provides enhanced stability in motion and under fire, with particular benefits for accuracy when engaging aerospace targets. Electromagnetic grippers integrated into the feet allow the Deimos to secure itself to DropShip hulls, reflecting the Snow Ravens' emphasis on naval integration.</p><p>A Type 255 extralight engine provides adequate speed for the eighty-five-ton chassis, a powerplant shared with the Omen second-line assault 'Mech in a nod to Clan efficiency principles. Rather than mounting jump jets, engineers installed a MASC system to provide short-term speed boosts beyond its base fifty-four kilometer per hour cruising speed. The chassis is protected by fourteen and a half tons of Longanecker PlastiSteel standard armor, providing solid protection across all arcs.</p><p>The Deimos offers forty-three tons of pod space, making it one of the most capacious OmniMech designs in service. Fixed armament includes two extended-range medium lasers in the side torsos and a head-mounted anti-missile system, ensuring baseline defensive capability regardless of configuration. The Prime configuration emphasizes the design's anti-aerospace role with six Class 2 Ultra autocannons and paired LRM-15 launchers, leveraging the chassis' inherent anti-aircraft targeting characteristics.</p>
deployment: |-
  <p>The Deimos 2 is a non-OmniMech variant that Armed Forces of the Federated Suns intelligence has identified as likely based on the original pre-Omni test bed for the design. The weapon layout mirrors the Prime configuration, including six Ultra autocannons and paired LRM-15 launchers, but replaces the standard anti-missile system with an experimental laser version. The chassis mounts only ten double heat sinks and trades the standard Longanecker PlastiSteel for thirteen tons of ferro-fibrous armor protection. A larger 340-rated extralight engine increases the MASC-accelerated top speed to over eighty kilometers per hour. The number of these units in existence and whether further production is planned remain unknown.</p>
history: |-
  <p>The Deimos project originated on the Kerensky Cluster world of Lum during the mid-3060s, where Snow Raven engineers undertook the ambitious task of creating an assault OmniMech that embodied their Clan's aerospace-centric combat philosophy. Early intelligence reports filtering back to the Inner Sphere described a formidable new design capable of supporting flight operations while engaging ground targets with devastating effect.</p><p>The onset of the Jihad and the subsequent White Out that descended over communications between the Pentagon and Kerensky Clusters silenced all further reports of the project. For nearly two decades, the Deimos remained nothing more than an unconfirmed rumor in Inner Sphere intelligence files. Between the opening shots of the Jihad and the veil of silence that settled over the Homeworlds, the Snow Ravens' ambitious assault OmniMech project was all but forgotten.</p><p>The Snow Ravens' migration to the Inner Sphere and subsequent formation of the Raven Alliance with the Outworlds Alliance brought the Deimos out of obscurity. Production facilities were established at the Snow Raven Industrial Complex Alpha on Dante, and in February of 3085 the Snow Ravens formally unveiled the design. The initial production run was substantial, with at least one Deimos assigned to every cluster within the Raven touman, reinforcing the design's importance to Snow Raven military doctrine.</p><p>The Deimos quickly established itself as a symbol of Raven technological capability and Clan pride. While it may not have been the most devastating assault 'Mech ever produced, the combination of massive pod space, aerospace integration features, and the Snow Ravens' characteristic engineering precision made it a distinctive addition to the post-Jihad battlefield. Armed Forces of the Federated Suns intelligence later identified evidence of a non-OmniMech variant believed to be based on the original pre-Omni test bed, suggesting the design's development history was even longer than initially understood.</p><p>Subsequent configurations developed through the Republic and Dark Age eras expanded the Deimos's tactical flexibility well beyond its original anti-aerospace role, with variants optimized for ground assault, space operations, and advanced combined-arms warfare. The design's continued evolution reflects both the Snow Ravens' commitment to their signature platform and the broader trend toward multi-role assault OmniMechs in the post-Jihad era.</p>
