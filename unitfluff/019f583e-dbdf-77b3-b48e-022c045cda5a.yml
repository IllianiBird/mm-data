overview: |-
  <p>The Conjurer, designated the Hellhound by Inner Sphere intelligence agencies, is in every practical sense a Wolverine IIC, a comprehensive Clan technology rebuild of the venerable Inner Sphere design. Introduced in 2829, the Conjurer was developed from the WVR-7H Wolverine II, the Star League Defense Force's Royal variant of the standard Wolverine chassis. Despite the clear lineage, the Clans refused to retain the original name due to the stigma associated with the Not-Named Clan, instead designating the rebuilt 'Mech the Conjurer.</p><p>Built on an endo steel internal structure and protected by eight and a half tons of ferro-fibrous armor, the fifty-ton Conjurer served primarily as a second-line combatant throughout much of Clan history. The design gained renewed prominence when Clan Nova Cat established manufacturing on Irece following the Clan's Abjurement, and later when the Wolf Empire converted the Thermopolis Wolverine production lines to Conjurer manufacture in 3142, granting Clan Wolf a manufacturing capacity that exceeded their most ambitious projections.</p>
capabilities: |-
  <p>The Conjurer combines respectable speed with a potent short-to-medium range weapons suite, making it an effective skirmisher and raider. Powered by a standard Hermes 300 fusion engine, the design achieves a top speed of 96.6 kilometers per hour, a notable improvement over its Wolverine ancestor. Six BMP Mk. XXI jump jets provide a 180-meter jump capability, granting exceptional tactical mobility that allows the Conjurer to dominate broken terrain and exploit flanking opportunities.</p><p>The base configuration mounts a Kolibri Delta Series large pulse laser as its primary weapon, delivering accurate and devastating fire at medium range. Two Series 2b extended-range medium lasers provide supporting firepower, while a pair of Pattern J2 Streak SRM-2 launchers add close-range punch with the efficiency of Streak technology ensuring every missile finds its mark. This all-energy primary armament, supplemented by the ammunition-efficient Streak systems, gives the Conjurer excellent operational endurance, a quality particularly valued in the independent raiding operations for which second-line Clan units are frequently tasked.</p><p>The use of a standard fusion engine rather than the extra-light designs favored in frontline OmniMechs reflects the Conjurer's second-line status, but also grants superior survivability when absorbing torso damage. The endo steel chassis and ferro-fibrous armor maximize protection without sacrificing payload capacity, resulting in a well-balanced medium 'Mech that has consistently exceeded expectations throughout its long service history.</p>
deployment: |-
  <p>Born from the Wolf Empire's capture of Kallon Industries' Thermopolis facility in 3142, this variant was originally conceived as a stopgap solution. When Clan Wolf reconfigured the former Wolverine production lines for Conjurer manufacturing, true Clan-specification weaponry was not immediately available in sufficient quantities. Factory personnel improvised by drawing upon Inner Sphere components already in the supply chain, including a 250-rated extra-light engine and rotary autocannon/5 from the Shockwave production line, with MASC systems already tooled for Wolverine variants. A Clan Streak SRM-6 and two Clan medium pulse lasers round out the armament, creating a hybrid design mixing Inner Sphere and Clan technology. Despite its improvised origins, the Conjurer 8 proved remarkably popular with Wolf warriors, who valued its potent autocannon firepower and burst-speed capability. What began as a temporary expedient continues in production alongside fully Clan-specification models at Thermopolis.</p>
history: |-
  <p>The Conjurer emerged during the early years of Clan civilization, when the descendants of Kerensky's Exodus fleet were establishing their military doctrines and rebuilding their arsenals with newly developed technology. The design was created in 2829 as part of the broader Clan effort to upgrade proven Star League designs, with the WVR-7H Wolverine II serving as the foundation for the rebuild. ComStar intelligence initially reported the design as a modified Wolverine before recognizing it as a distinct Clan variant and assigning the reporting name Hellhound.</p><p>For centuries, the Conjurer served as a reliable second-line combatant across the Clan homeworlds. With the advent of OmniMech technology, frontline Galaxies transitioned to more flexible designs, but the Conjurer retained a valued role in garrison and second-line formations. Its standard engine construction and logistical simplicity made it particularly well-suited for independent operations, and warriors assigned to the design found it an effective platform for reconnaissance and special operations. When the Clans invaded the Inner Sphere, Great House military analysts came to respect the Conjurer's combat capabilities, noting that its combination of speed, firepower, and ruggedness made it a more dangerous opponent than its second-line designation might suggest.</p><p>The Conjurer's fortunes shifted dramatically following Clan Nova Cat's Abjurement from Clan society and resettlement in the Draconis Combine. Facing the need to rebuild their depleted touman, the Nova Cats negotiated a complex exchange with Clan Diamond Shark, trading three Carrack-class merchant vessels and manufacturing rights to the Hellhound in return for raw materials and access to factory facilities on Irece and Avon. The Nova Cat variants that emerged from this arrangement demonstrated considerable innovation, and the Diamond Sharks' own Spina Galaxies began fielding their version of the design. The Nova Cat rebuilds honored the sacrifice of allied Draconis Combine units, particularly the Second Arkab Legion and the Ryuken-ni, who had fought alongside the Clan during the Ghost Bear-Combine War.</p><p>The Wolf Empire's conquest of Thermopolis in 3142 opened an entirely new chapter in the Conjurer's production history. Clan Wolf converted the existing Kallon Industries Wolverine manufacturing lines to produce the Conjurer, initially assembling a stopgap variant from available Inner Sphere components, including spare engines and autocannons from the Shockwave production line, supplemented by MASC systems already being manufactured at the facility. This Conjurer 8, originally intended as a temporary measure while full Clan-specification manufacturing was established, proved popular enough with warriors that it continued production alongside standard Clan-technology models. The first Conjurer 8 units saw combat during a raid on Asellus Australis, where they engaged the First Nova Cat Regulars in what served as an effective shakedown for the new variant.</p>
