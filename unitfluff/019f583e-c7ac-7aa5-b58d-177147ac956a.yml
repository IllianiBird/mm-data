chassis: "Grand Crusader II"
model: "GRN-D-03"
overview: |-
  <p>The Grand Crusader II is an 80-ton assault BattleMech that is a comprehensive redesign of the original Grand Crusader, developed on Terra during the Word of Blake's occupation. Commissioned in 3065 by Precentor Martial Cameron St. Jamais as part of a broader effort to streamline Terra's manufacturing capacity, the redesign leveraged shared components with other Blakist assault platforms to accelerate production. The first Grand Crusader II rolled off the line in early March 3066, and the redesign so thoroughly altered the 'Mech's armor profile and appearance that it was designated as a distinct chassis from its predecessor. The Grand Crusader II represented a marked improvement in survivability and mobility over the original design.</p>
capabilities: |-
  <p>The Grand Crusader II addresses the two most significant criticisms of the original design: limited long-range firepower and the vulnerability inherent in its XL engine. Engineers replaced the Hermes 240 XL with a Pitban 320 Light Fusion engine, dramatically improving survivability while simultaneously increasing the 'Mech's top speed to 64 kilometers per hour. The incorporation of triple-strength myomer further enhances ground speed to over 86 kilometers per hour when the 'Mech runs hot, giving the Grand Crusader II a burst mobility unusual for an assault platform. Four CurtissJet 80 jump jets provide additional tactical flexibility, allowing the design to navigate terrain that would stymie its predecessor.</p><p>Built on a Skobel Template 8 Endo Steel chassis and protected by fifteen tons of Aldis Plate armor with CASE, the Grand Crusader II trades the original's missile-heavy loadout for a more balanced direct-fire arsenal. An improved C3 computer allows the design to share targeting data with lance mates, strengthening Level II coordination and fire control. The streamlined production process, sharing components with other Blakist assault designs, gave the Grand Crusader II an ease of maintenance that its predecessor lacked, though the 'Mech's stable firing platform and improved survivability are what most distinguish it from the original Grand Crusader.</p>
deployment: |-
  <p>This variant introduces the Pitban 320 Light Fusion engine, triple-strength myomer, and CurtissJet 80 jump jets that define the Grand Crusader II platform. Armed with two extended-range large lasers as primary weapons, the variant supplements its direct-fire capability with an LRM-15 launcher equipped with Artemis IV fire control and a Streak SRM-6 for close-range engagements. Three extended-range medium lasers round out the weapons array. The incorporation of an improved C3 computer allows this variant to function as a networked fire-support node, sharing targeting data with lance mates to improve overall formation accuracy.</p>
history: |-
  <p>The Grand Crusader II emerged directly from the Word of Blake's aggressive military expansion on Terra following Operation Odysseus. With Cameron St. Jamais driving production quotas beyond what Terra's factories could sustain, the involvement of Vicore Industries proved critical to both increasing output and improving the design. The shared component philosophy with the Vanquisher and Legacy programs enabled rapid manufacturing ramp-up across Skobel MechWorks and Krupp Armament Works facilities in Russia and Germany.</p><p>All Blakist divisions received the Grand Crusader II as it entered production, with older Grand Crusader models being rotated out of frontline service. The 'Mech saw extensive action throughout the Jihad, serving in garrison and offensive operations across the Word of Blake Protectorate. The Grand Crusader II's improved survivability compared to the XL-engine original proved its worth in the brutal close-quarters fighting that characterized much of the conflict.</p><p>Following the Coalition's liberation of Terra and the destruction of the Word of Blake, both Skobel MechWorks and Krupp Armament Works fell under Republic of the Sphere control. While the factories themselves survived the Jihad, production of the Grand Crusader II appears to have been discontinued, with the Republic showing little interest in perpetuating Blakist designs. The schematics for a proposed Grand Crusader OmniMech, which the Word of Blake had been developing before the Jihad erupted, were never completed and the project was abandoned in favor of the Celestial series. However, copies of these incomplete plans would later surface in unexpected hands, ultimately giving rise to the Scorpion Empire's Star Crusader.</p>
