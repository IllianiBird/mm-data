chassis: "Wraith"
model: "TR2-P 'Pocahontas'"
overview: |-
  <p>The Wraith was introduced in 3055 by Curtiss Militech, a little-known military technologies division of Curtiss Hydroponics, a Free Worlds League water purification company. Seeking to diversify into more profitable markets, Curtiss formed the division to leverage recovered technology and produce state-of-the-art military hardware. The resulting TR1 Wraith defied skeptics who dismissed it as little more than a walking water cooler. Built around one of the largest extralight engines ever fitted to a medium chassis, the fifty-five-ton Wraith prioritized speed and agility above all else, filling the role of a fast raider and scout hunter.</p><p>Its pulse laser armament complemented its jump-heavy combat doctrine, and the design proved surprisingly resilient for its weight class. Following the destruction of the Curtiss Militech factory on Paradise during the Jihad, the Wraith's production rights were acquired by Hellespont Industries on Sian, ensuring the design's continued service within the Capellan Confederation.</p>
capabilities: |-
  <p>Speed and maneuverability are the keystones of the Wraith's design. Weapons and armor came secondary to cramming the massive LTV 385 XL engine into a medium chassis, granting the 'Mech a top speed approaching 119 kilometers per hour. Seven CurtissJet jump jets provide an impressive 210-meter jump capability, allowing the Wraith to outmaneuver most BattleMechs in existence and traverse difficult terrain with ease.</p><p>The Wraith's armament centers on Tronel pulse lasers, a deliberate choice that compensates for the accuracy penalties inherent in its jump-intensive combat style. A Tronel XIII large pulse laser serves as the primary weapon, backed by a pair of Tronel XII medium pulse lasers for close engagements. This all-energy loadout eliminates ammunition dependence, a significant logistical advantage for a design intended to operate independently on extended raids.</p><p>The 'Mech carries over eight tons of Kallon FWL Special ferro-fibrous armor, respectable protection for a medium design, though the cramped internal layout resulting from the oversized engine and endo steel structure makes battlefield repairs notoriously difficult. Curtiss addressed early maintenance concerns by providing a liberal warranty and producing replacement parts alongside each unit, though this did little to endear the design to field technicians.</p>
deployment: |-
  <p>Debuting in the Tennessee Valley arena in 3141, this custom variant was developed by Team New World on Solaris VII. Clan ferro-lamellor armor provides exceptional resistance to nearly all forms of damage, while a Clan-specification XL engine improves durability over the original powerplant. MASC enables even greater bursts of speed, and four Clan extended-range medium lasers replace the entire original weapons suite, delivering more firepower at greater range. A hatchet adds a melee dimension suited to arena combat, quickly earning the nickname of a tomahawk among the stable's fanbase.</p>
history: |-
  <p>Curtiss Hydroponics had been a household name in the Free Worlds League for generations, manufacturing water purification systems that served communities across the nation. By the mid-3050s, however, spiraling costs and declining profits left the company searching for new revenue streams. The formation of Curtiss Militech, a military technologies division devoted to producing state-of-the-art BattleMech hardware using recovered technology, was met with open skepticism from the defense industry. Analysts who had scoffed at the idea of a water purification company entering the military market were forced to reconsider when the TR1 Wraith debuted in 3055, a design far removed from the "water cooler on legs" many had predicted.</p><p>The Wraith found an immediate audience among independent MechWarriors and mercenary commands who valued its exceptional speed and ammunition-independent weapons loadout. Early operational experience revealed that the design was more difficult to employ effectively than its raw specifications suggested. Commanders frequently compared the Wraith to the Charger, noting that while both designs possessed impressive speed and durability for their weight class, the Wraith's short-ranged pulse lasers left it ill-suited to line combat or traditional scouting roles. It lacked the reach to engage lighter scout hunters at range, yet carried too little firepower to serve as a frontline combatant.</p><p>Over time, tactical doctrine evolved to match the Wraith's unique capabilities. Commanders began assigning the design to skirmisher and fast raider roles, where its speed allowed it to strike and withdraw before heavier opponents could respond. Free Worlds League units along the Marik-Steiner border struggled to find a niche for the design, but Curtiss found greater success selling on the general market. The Capellan Confederation, Draconis Combine, and Word of Blake all purchased the Wraith, as did numerous mercenary commands. Individual pilots quickly discovered that replacing the large pulse laser with an extended-range PPC transformed the design into a highly capable sniper, and this TR2 field modification became widespread. The Word of Blake developed the TR3 variant, mounting an improved C3 computer to make the Wraith a fast, mobile network node for their C3i-equipped formations.</p><p>The Jihad brought catastrophe to the Wraith's production. On 26 February 3080, forces from the Principality of Regulus bombarded Paradise with thousands of cobalt-laced strategic nuclear weapons, destroying the Curtiss Militech factory and rendering the planet uninhabitable. The attack killed over a hundred million civilians and left Curtiss Hydroponics in severe financial distress. The parent company announced its complete withdrawal from the military market and put the Curtiss Militech assets up for sale. No Free Worlds League company expressed interest in the Wraith's production rights, and Curtiss flatly refused to sell to the Regulans, whose destruction of Paradise had directly caused the company's ruin.</p><p>Hellespont Industries on Sian proved a willing buyer, and production began at the Hellespont 'Mech Works facility by 3087. The transition replaced existing Stinger production and scaled back Assassin manufacture to accommodate the new line. Under Capellan ownership, the Wraith became firmly associated with the Confederation Armed Forces. Hellespont engineers eventually leveraged their experience with Capellan manufacturing partners like Ceres Arms to develop new variants incorporating advanced pulse lasers and supercharger technology. The design's cultural integration into the CCAF was reflected in its informal Mandarin phoneticization, though the preferred pronunciation varied between units. The Death Commandos and Warrior Houses favored one reading while most line formations used another, a distinction that observers at the Capellan court noted extended even to the Chancellor and senior nobility.</p><p>On the arena circuits of Solaris VII, the Wraith's speed and agility made it a natural fit for gladiatorial combat. Custom modifications like the TR2-X Alexander and TR2-P Pocahontas pushed the chassis to its experimental limits, incorporating Clan technology and partial wings that would later inspire Hellespont's own Wing Wraith development program. The Wraith's journey from a water purification company's unlikely debut design to a mainstay of the Capellan military stands as one of the more remarkable manufacturing stories of the post-Clan Invasion era.</p>
