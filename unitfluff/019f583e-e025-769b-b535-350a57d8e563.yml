chassis: "Mad Cat Mk IV PR"
model: "RISC"
overview: |-
  <p>The Mad Cat Mk IV PR represents the prototype lineage of the Savage Wolf program, a series of non-OmniMech chassis that predated the full production model. These prototypes emerged from the illicit collaboration between Clan Jade Falcon and Clan Sea Fox's Spina Khanate Beta Aimag during the early 3130s. When the partnership was dissolved by the Sea Fox Clan Council, the Jade Falcons retained an unspecified number of these non-Omni frames. Built on a fundamentally different technical foundation than the production OmniMech (utilizing a standard XL fusion engine rather than the production model's XXL and conventional ferro-fibrous armor instead of ferro-lamellor) the PR chassis represents an earlier, more conservative stage in the design's evolution. At least one prototype was subsequently acquired and modified by the Republic Institute of Strategic Combat for experimental weapons testing.</p>
capabilities: |-
  <p>While sharing the seventy-five-ton mass and general silhouette of the production Savage Wolf, the PR prototype differs in several critical respects. The chassis utilizes a standard XL fusion engine rather than the production model's more advanced XXL, resulting in a heavier but significantly more survivable powerplant, a side torso loss that would destroy the production model merely cripples the PR. Endo steel internal structure is retained, but the revolutionary ferro-lamellor armor of the production model is replaced with twelve tons of conventional ferro-fibrous armor. While this provides respectable protection on paper, it lacks the ferro-lamellor's superior damage-dissipating properties.</p><p>As a non-OmniMech design, the PR carries a fixed weapons loadout rather than utilizing modular pod space, limiting its tactical flexibility compared to the production Savage Wolf. The base prototype mirrors the production Prime configuration's armament philosophy with paired ER PPCs and Streak SRM-6 launchers providing both long-range striking power and close-range defense. The chassis proved adaptable enough to support variant configurations, with the more reliable XL engine offering a practical advantage in prolonged engagements where the risk of catastrophic engine failure is a constant concern.</p>
deployment: |-
  <p>The PR RISC is a dramatic experimental modification performed by the Republic Institute of Strategic Combat at their Sandhurst facilities on Terra, with a project start date of 3134. Starting from an acquired PR frame, RISC engineers replaced the standard weaponry with a pair of experimental hyper lasers (devastating energy weapons still under development at the time) backed by four SRM-6 launchers in the standard two-forward, two-rear arrangement. An XL gyro replaced the standard unit to free internal volume, while four coolant pods and a RISC heat sink override kit were installed to manage the extreme thermal output of the hyper lasers. Utilizing a Mixed Clan experimental technology base, this variant was deployed in at least one false flag operation against Augustine in 3135, where it demonstrated the hyper lasers' devastating power before ultimately being destroyed by cascading internal explosions.</p>
history: |-
  <p>The prototype Mad Cat Mk IV chassis occupies an unusual position in military history, existing at the intersection of inter-Clan politics, espionage, and experimental weapons development. When Clan Sea Fox repudiated the unauthorized collaboration between its Spina Khanate and Clan Jade Falcon, the Falcons managed to retain several non-OmniMech prototype frames. These prototypes, designated PR, saw limited deployment with Jade Falcon forces, though specific operational details remain scarce given the clandestine nature of their acquisition.</p><p>The most dramatic chapter in the prototype's history involves the Republic Institute of Strategic Combat, which acquired at least one PR frame through unknown channels. RISC engineers modified the chassis to serve as a testbed for their experimental hyper laser technology, deploying the resulting PR RISC variant in at least one confirmed false flag operation, a raid against the then-independent world of Augustine in 3135. Post-war analysis of recovered wreckage and battleROM data from Augustine's defenders, correlated with records found on Terra after Clan Wolf's conquest, confirmed with high confidence that the unit was produced at RISC's Sandhurst facilities. The Augustine incident demonstrated both the devastating potential and the inherent dangers of the experimental technology, as the modified prototype was ultimately destroyed when successive ammunition detonations breached the reactor shielding and caused catastrophic containment failure.</p>
