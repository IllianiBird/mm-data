model: "(Wheeled LBX20)"
overview: |-
  <p>The Com Guards field conventional infantry as a core component of their combined-arms formations, with Level I infantry units integrated into the same command structure alongside BattleMech, armor, and aerospace elements at every organizational level. Operating assault-class cluster-munition autocannon, these gun crews bring overwhelming close-range firepower that devastates anything caught in the blast pattern, though the weapon's weight and ammunition consumption limit sustained operations.</p>
