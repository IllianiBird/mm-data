chassis: "Field Artillery Platoon (AFFS)"
model: "(Tracked Thumper 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing Thumper artillery pieces, these platoons provide light indirect fire support that disrupts enemy formations and suppresses defensive positions at ranges well beyond direct-fire weapons.</p>
