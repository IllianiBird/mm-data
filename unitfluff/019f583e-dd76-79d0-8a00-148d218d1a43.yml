chassis: "Burrower"
model: "DTM-1 MiningMech"
overview: |-
  <p>The Burrower is a sixty-five-ton MiningMech produced by Duratron Enterprises on Nashira, one of many designs inspired by the success of Achernar BattleMechs' Dig King and Dig Lord. Introduced in 3115, the Burrower is a cheap, low-tech copy of the Dig Lord built around readily available components and an internal combustion engine rather than the original's fuel cell powerplant. The widespread availability of the Dig King's specifications facilitated this proliferation, allowing manufacturers like Duratron to produce their own interpretations without licensing agreements.</p><p>The Burrower came to be particularly prominent among the wave of Dig Lord imitations, finding widespread service in mining operations across Draconis Combine space and beyond. Like its inspiration, the design proved equally attractive to those seeking an affordable platform for military conversion, and factory-standard armed variants followed shortly after the base model entered production.</p>
capabilities: |-
  <p>The Burrower closely mirrors the Dig Lord's general layout while substituting lower-cost components throughout. The chassis is built around a Duratron MM-2600 frame powered by a ConLee 195-rated internal combustion engine, a deliberate downgrade from the Dig Lord's fuel cell that reduces cost and maintenance complexity at the expense of some operational flexibility. The civilian DTM-1 variant carries a mining drill and two fluid guns as its primary working tools, adequate for standard extraction operations though lacking the Dig Lord's four-gun fluid capacity.</p><p>The factory-standard DTM-1M MiningMech MOD transforms the Burrower into a paramilitary platform by replacing the mining drill and fluid guns with an MML-9 tube system and two Bulldog machine guns, while retaining the rock cutter for close combat. An advanced fire control system aids targeting, and four heat sinks manage the thermal output of sustained missile fire. Heavy industrial armor manufactured by Strong Arm provides meaningful protection against small arms and light weapons, while the retained track system from the original mining configuration enhances stability when firing. The MOD variant is not intended to challenge purpose-built BattleMechs, but against infantry, vehicles, and other IndustrialMechs it serves as a credible threat at a fraction of the cost.</p>
deployment: |-
  <p>The base DTM-1 is the original civilian Burrower introduced in 3115, a straightforward mining platform equipped with a mining drill and two fluid guns for excavation work. Running on an internal combustion engine rather than the Dig Lord's fuel cell, the DTM-1 prioritizes affordability and ease of maintenance. Only a single heat sink is included, reflecting the minimal thermal output of its civilian equipment. The design serves as the conversion basis for the armed DTM-1M variant.</p>
history: |-
  <p>Duratron Enterprises began production of the Burrower in 3115 at their facility on Nashira, then under Draconis Combine control. The design entered an already crowded market of Dig Lord derivatives, but Duratron's competitive pricing and the Burrower's use of widely available ICE components helped it carve out a significant market share among mining operations that prioritized affordability over sophistication.</p><p>The armed DTM-1M MOD variant appeared in 3132, coinciding with the chaos following Gray Monday and the collapse of the HPG network. The timing was not coincidental, the sudden demand for armed platforms of any kind created an immediate market for factory-conversion MiningMechs. Duratron's MOD featured the common pattern of machine guns and shoulder-mounted missiles that characterized most MiningMech conversions, a configuration suspected to be derived from earlier Dig King MOD designs that had proven effective during the Succession Wars centuries prior.</p><p>The Burrower and its MOD variant saw service across the Republic of the Sphere and Draconis Combine territories during the Dark Age, favored by professional mercenary units, planetary militias, and even criminal organizations that found the armed MiningMech an effective tool for intimidation and low-intensity combat. The thriving secondary market in conversion parts that developed on mercenary-friendly worlds like Galatea ensured a steady supply of components for both factory and field conversions.</p>
