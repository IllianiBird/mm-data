overview: |-
  <p>The Pack Hunter II is a thirty-ton light BattleMech developed by Clan Wolf-in-Exile at WC Site 3 on Arc-Royal during the Jihad. First deployed in 3077 after years of development delays, the design originated as an ambitious plan to create an OmniMech successor to the original Pack Hunter. The Word of Blake's attack on Arc-Royal in 3072 and the resulting disruption to manufacturing forced the Exiled Wolves to abandon the OmniMech concept and instead produce an improved conventional BattleMech. Further delays arose from collaboration opportunities with the Hell's Horses that resulted in the Cygnus, and from repeated attempts to incorporate advanced technologies that proved unsuitable for mass production.</p><p>Despite these setbacks, the Pack Hunter II emerged as a substantial improvement over its predecessor, retaining the original's speed and mobility while adding significantly enhanced weaponry, improved armor protection, and a full-head ejection system to preserve the lives of its warrior pilots. The design has since spread to multiple factions, appearing in the forces of Clan Hell's Horses, the Draconis Combine, Stone's Coalition, and the Republic of the Sphere.</p>
capabilities: |-
  <p>The Pack Hunter II retains the Type AR1 endo steel chassis and Leaper Model L5 jump jets of its predecessor but replaces the standard fusion engine with a Light Force 210 extralight model, freeing mass for significant upgrades. The armor has been dramatically improved to approximately eighty percent of the maximum possible protection for a thirty-ton frame using Royal-7a ferro-fibrous plating, a marked increase over the original's minimal four tons of standard armor.</p><p>The main weapon remains a Ripper Series A1 extended-range PPC, now supplemented by a pair of Series 2b extended-range medium lasers mounted in the arms that provide effective secondary firepower at closer ranges. Two Delta X B-Pods in the legs offer defense against battle armor attempting to swarm the 'Mech, an addition that proved instrumental in surviving ambushes during the Jihad when the Clan initially lacked modular armor or actuator enhancement system options for the legs. A full-head ejection system reflects the Exiled Wolves' concern for preserving their limited warrior caste.</p><p>A Trueborn Ultra 945B communications system replaced the original's Kell Hound-sourced K9 equipment, while the Hunter 5 Dedicated targeting and tracking system represents an upgrade from the earlier Hunter 3 model. Ten double heat sinks manage the thermal load, though pilots must exercise careful fire discipline when pushing all weapons simultaneously at sustained rates.</p>
deployment: |-
  <p>An experimental technology variant first produced in 3082, the Pack Hunter II 3 strips away all weapons except the extended-range PPC to mount an array of improved jump jets that extend the jump range to an exceptional three hundred meters, making this one of the most agile 'Mechs of its era. The weight savings required to accommodate the improved jump jets necessitated the installation of an extralight gyro and the reduction of one ton of armor, trading protection for unmatched aerial mobility on the battlefield.</p>
history: |-
  <p>The Pack Hunter II's troubled development history spans nearly a decade. What began as an ambitious OmniMech replacement project at WC Site 3 on Arc-Royal was derailed by the Word of Blake's assault on the world in March 3072. The attack destroyed the original Pack Hunter production line and forced the Exiled Wolves to cease work on the planned OmniMech successor. When production efforts resumed, the focus shifted to developing a comprehensive conventional BattleMech upgrade instead. Further delays resulted from the diversion of resources to collaborate with the Hell's Horses on the Cygnus, and from engineers' repeated attempts to incorporate cutting-edge technologies such as endo-composite structure, modular armor, and actuator enhancement systems that proved unsuitable for mass production.</p><p>The Pack Hunter II finally entered service in 3077, and despite its protracted gestation, the design proved well worth the effort. The Exiled Wolves quickly began supplying the design to allied factions, with Pack Hunter IIs appearing in the toumans of Clan Hell's Horses and within the militaries of the Draconis Combine and Stone's Coalition. The Republic of the Sphere also acquired the design following its formation, while mercenary units obtained examples through various channels.</p><p>The design's production on Arc-Royal was marked by ongoing challenges. Anti-Clan insurgents sabotaged extralight engine production shortly after full-scale manufacturing began, forcing the development of the light-engine Pack Hunter II 2 as a temporary stopgap in 3078. This mixed-technology variant demonstrated the Exiled Wolves' pragmatic willingness to incorporate Inner Sphere components when necessity demanded. As production stabilized, more advanced variants followed, the improved-jump-jet Pack Hunter II 3 in 3082 and the actuator-enhanced Pack Hunter II 4 in 3093.</p><p>WC Site 3 continued producing Pack Hunter IIs throughout the Republic era, Dark Age, and into the ilClan period, making the design one of the most enduring products of the Exiled Wolves' manufacturing efforts on Arc-Royal. The emergence of custom variants in service with other Clans demonstrated both the design's adaptability and its spread well beyond its original Clan Wolf-in-Exile operators. The Pack Hunter II stands as perhaps the most successful product of the Exiled Wolves' Arc-Royal industrial base, a design born of compromise and delay that ultimately exceeded the expectations of its creators.</p>
