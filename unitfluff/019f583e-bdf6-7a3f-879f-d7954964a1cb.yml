chassis: "Motorized Platoon (LCAF)"
model: "(Gauss 3065+)"
overview: |-
  <p>Reforms begun under Alessandro Steiner and reinforced by Federated Suns influence have integrated Lyran infantry into combined-arms operations more effectively than at any point in the Commonwealth's history. Motorized platoons add light transport vehicles to standard infantry formations, giving them the speed to conduct rapid strikes, screening operations, and quick withdrawals that foot infantry cannot manage. Armed with assault rifles and Grand Mauler infantry gauss cannons, these platoons field some of the hardest-hitting crew-served weapons available to conventional infantry, capable of threatening armored vehicles at extended range.</p>
