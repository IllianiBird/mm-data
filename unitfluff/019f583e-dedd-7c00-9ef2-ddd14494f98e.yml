chassis: "Cephalus"
model: "A"
overview: |-
  <p>While the main avenue of warfare for the Society was asymmetrical in nature, it also seemed prudent to act perpendicular to standard Clan tactics. The further the Society's tactics disconnected from the warrior caste's precepts, the less successful the warriors might be in responding. The Nova CEWS' C3 capability aligned perfectly with that strategy, but it would only be successful if a unit was able to provide targeting information. The resulting Cephalus OmniMech proved so thoroughly elusive and difficult to engage that many Clan warriors did not fire upon it at all. A key factor appears to be that the most commonly used configurations lacked offensive weaponry of any kind. Many Clan warriors were prone to categorizing the Cephalus as an irrelevant noncombatant, which greatly contributed to the design's infamy.</p>
capabilities: |-
  <p>The Society began with a twenty-five ton frame, which is capable of packing the most protection per ton of any 'Mech, and provided it with ample speed. The Clan warrior caste had long since abandoned the Chameleon Light Polarization Shield and Null-Signature systems (naming them unClanlike) but the technologies could be replicated from archived data. Improved versions using modern electronics seemed plausible, but unfeasible in the short term.</p><p>This defensive technology was integrated with the new ferro-lamellor armor carefully laid out to repel common Clan weapons, providing protection to the Cephalus well in excess of any other machine in its weight class. The five and a half tons of pod space left over after the permanent installation of the Nova CEWS proved ample enough to allow the Cephalus to execute its missions.</p><p>To enhance the odds of any recon information staying available to the Society, the Cephalus is equipped with a full-head ejection system, allowing friendly forces to pick up the head, MechWarrior and data in the event that a Cephalus is run to ground.</p>
deployment: |-
  <p>The Alpha configuration is similar to the Prime, but appeared in battles held in especially rough terrain, where the Prime's ground speed is affected. Seven jump jets provide a jump capability of 210 meters, while a TAG system provides targeting support for friendly units. A single laser anti-missile system provides point defense.</p>
history: |-
  <p>As one of the supplemental 'Mechs to the Septicemia, the Cephalus could be built using far more advanced technologies since fewer would be created. It needed to plug into existing Clan infrastructure and utilized several components also installed on the Viper OmniMech, such as its Series D8 CC-25X communications system and many leg components. It was deployed in a rough one-to-three ratio with the Osteon, and worked primarily to provide Osteon units with close proximity targeting information and general recon and electronic countermeasure duties. Its first operational use was on Shadow, when it assisted Clan Coyote in the destruction of Kindraa Mick-Kline-Kreese-Sainze.</p><p>Due to the role this OmniMech played with The Society during the Wars of Reaving, the Cephalus was outlawed by the Home Clans. Unlike the Septicemia, the Cephalus could not be easily separated from its integrated Nova CEWS, sealing its fate.</p>
