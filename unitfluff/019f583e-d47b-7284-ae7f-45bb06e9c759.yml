chassis: "Quickdraw"
model: "QKD-9M"
overview: |-
  <p>The Quickdraw was introduced in 2779 by Technicron Manufacturing as an intended replacement for the aging Rifleman, though the design emerged from a troubled development process that reflected Technicron's inexperience—their only prior BattleMech being the century-old Awesome. While the Quickdraw failed to supplant the Rifleman in its intended fire support role, the sixty-ton heavy 'Mech quickly proved itself as a reliable generalist throughout the Succession Wars. Combining respectable firepower with above-average speed and solid armor protection, the design earned the respect of MechWarriors across every Successor State and became a workhorse in militaries throughout the Inner Sphere.</p><p>The Quickdraw benefited from several unique engineering features that set it apart from contemporary designs. Its highly articulated ankle actuators allowed the 'Mech to maintain footing on difficult terrain and traverse gradients up to twelve degrees steeper than other machines in its weight class, while specially modified arm actuators could bend backward to provide formidable rear-arc firepower—a nasty surprise for would-be flankers.</p>
capabilities: |-
  <p>Geared toward medium and short-range combat, the Quickdraw carries a Delta Dart LRM-10 launcher as its sole long-range weapon, supplemented by four Omicron 4000 medium lasers—two arm-mounted firing forward and two rear-mounted in the right torso. A Hovertec Quad SRM-4 launcher in the center torso allows pilots to exploit weakened armor at close range. The design's most distinctive tactical feature is its arm actuators' ability to bend backward, enabling all four lasers to cover the rear arc and creating exceptional protection against flanking attacks.</p><p>The Quickdraw's mobility stems from its Vlar 300 engine and five Chilton 460 jump jets, allowing it to achieve speeds of 86 kilometers per hour and leap 150 meters. However, this mobility comes at a cost. The distinctive circular rotor housings of the ankle actuators are notoriously fragile, and savvy opponents quickly learned to target the ankles with weapons fire or well-placed kicks to cripple or immobilize the 'Mech. Additionally, the original design's thirteen single heat sinks proved inadequate for sustained combat, limiting the effective use of lasers during protracted engagements or when employing jump jets frequently.</p><p>Eight tons of Riese 475 armor provides reasonable protection for a heavy 'Mech, though less than many contemporaries in its weight class carry into battle.</p>
deployment: |-
  <p>The QKD-9M is a factory-built derivative of the Jihad-era 5Mr field refit, produced at both Earthwerks Limited on Tikonov and Irian BattleMechs Unlimited on Shiro III. The design mounts heavier large lasers in each arm tied to a targeting computer, replacing the 5Mr's ER medium lasers with significantly increased firepower. A single LRM-15 launcher with three tons of CASE II-protected ammunition replaces the original LRM-10, while a TAG system enables artillery coordination. The 9M transforms the Quickdraw from a generalist into a dedicated fire support platform, trading the design's traditional close-range capability for precision strikes at extended range.</p>
history: |-
  <p>When SLDF losses of Riflemen reached critical levels during the Amaris Civil War, manufacturers raced to provide inexpensive alternatives. Kallon Industries won that race with the JagerMech, while Technicron's entry—the Quickdraw—emerged from a muddled development process that produced multiple competing prototypes. The QKD-4R hewed closer to the Rifleman concept with heavier forward-facing lasers and reduced speed, but the more balanced QKD-4G ultimately entered mass production in 2779, just seven years before the First Succession War would devastate the Inner Sphere's industrial capacity.</p><p>Despite failing to replace the Rifleman, the Quickdraw found its niche as a bodyguard for the very design it was meant to supplant. Its speed and maneuverability made it ideal for protecting slower, thinly-armored Riflemen from opportunistic light 'Mech attacks. This ironic partnership became common throughout the Succession Wars as both designs remained in continuous production at facilities across the Free Worlds League and Draconis Combine.</p><p>Production continued at Luthien Armor Works and Technicron Manufacturing's Savannah plant throughout the Succession Wars, with the design seeing widespread deployment in every Great House military. The Quickdraw proved particularly popular among Capellan Confederation forces, especially the less traditional or more progressive units, despite House Liao's general preference for domestically-produced designs. Lyran Commonwealth and Federated Suns forces also fielded the design in significant numbers, though never in the concentrations seen in Free Worlds League or Draconis Combine service.</p><p>The Clan Invasion spurred significant modernization efforts. Technicron's QKD-5M solved the chronic heat dissipation problems with double-strength heat sinks and upgraded armor, steadily replacing older 4G models in frontline units throughout the 3050s. Older variants were relegated to Periphery nations and second-tier mercenary commands. Luthien Armor Works responded with their own upgraded variants, while the Jihad-era chaos saw Earthwerks Incorporated on Tikonov develop experimental designs incorporating advanced technologies like stealth armor and handheld weapons.</p><p>By the thirty-second century, the Quickdraw had somewhat fallen out of favor, prompting Technicron to introduce the radical QKD-9G variant combining Clan technology with extreme mobility systems in an attempt to redefine the chassis as a dedicated skirmisher.</p>
