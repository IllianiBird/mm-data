chassis: "Clan Field Gun Point"
model: "(Tracked CUAC5 Advanced)"
overview: |-
  <p>Conventional infantry within the Clan touman fills the garrison and screening roles that battle armor and BattleMech forces cannot efficiently sustain across dozens of occupied worlds. Field Gun Points are crew-served weapon teams that bring heavier firepower to the infantry level, towing weapons too large for individual soldiers to carry. The gun itself defines the Point's role, with lighter autocannons providing anti-infantry and anti-vehicle fire while heavier weapons can threaten even armored targets. The Point tows a medium-caliber Clan ultra autocannon that can fire at twice the normal rate, providing heavy suppressive firepower at the risk of mechanical jamming.</p>
