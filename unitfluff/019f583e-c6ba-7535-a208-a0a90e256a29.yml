overview: |-
  <p>The Summoner, designated Thor by Inner Sphere forces, is a 70-ton Clan OmniMech introduced in 2872 by Clan Jade Falcon. The design emerged shortly after the Jade Falcons became the first Clan to win OmniMech technology from Clan Coyote in 2863, making the Summoner one of the earliest second-generation OmniMechs ever produced. Jade Falcon engineers combined technology derived from the Coyote Warlock OmniMech with captured Thresher BattleMech chassis to create a versatile heavy platform capable of filling multiple battlefield roles.</p><p>Produced primarily by the Eagle Craft Group and other Clan manufacturers, the Summoner became a signature design of the Jade Falcon touman and one of the most widely recognized Clan OmniMechs in the Inner Sphere. Its combination of speed, firepower, and jump capability has kept it in continuous production for nearly three centuries, earning it the distinction of being one of the longest-serving OmniMechs in existence.</p>
capabilities: |-
  <p>The Summoner achieves its remarkable versatility through a balanced combination of speed, firepower, and protection. Powered by a Redline 350 XL engine, the seventy-ton chassis reaches speeds of just over eighty-six kilometers per hour, while five permanently mounted JF Standard jump jets provide a jump capability of one hundred and fifty meters. This combination of ground speed and jump capability gives the Summoner mobility that rivals many medium OmniMechs, allowing it to dictate engagement ranges and exploit terrain to an unusual degree for a heavy design.</p><p>Nine and a half tons of J63-3E Ferro Fibrous armor provide respectable protection for the chassis weight, though the design sacrifices maximum armor coverage to preserve its generous twenty-two and a half tons of pod space. In its Primary configuration, the Summoner carries an ER PPC in the right arm for devastating long-range strikes, an LB 10-X Autocannon in the left arm for flexible direct fire, and an LRM-15 in the left torso for indirect fire support. This combination of energy, ballistic, and missile weaponry allows a single Summoner to engage effectively across all range brackets.</p><p>The fixed jump jets represent both a strength and a design constraint. While they ensure every configuration benefits from superior tactical mobility, they consume tonnage and critical space that cannot be reallocated, limiting the pod space available compared to competing heavy OmniMechs that mount jump jets as pod equipment. This trade-off has proven acceptable in practice, as the Summoner's consistent mobility across all configurations remains one of its defining tactical advantages.</p>
deployment: |-
  <p>Alternate Configuration H mirrors the D configuration's precision-fire concept but substitutes Heavy Large Lasers as the primary weapons. These deliver greater damage per shot than standard ER Large Lasers at the cost of reduced range and accuracy at extreme distances, a trade-off offset by the included Targeting Computer. Two ER Medium Lasers provide supplementary fire, an anti-missile system adds defensive capability, and nine additional heat sinks ensure the configuration can sustain its energy-heavy firepower without overheating. The H configuration reflects the Civil War era trend of incorporating heavy laser technology into established Clan designs.</p>
history: |-
  <p>The Summoner's history is inextricably linked to the rise of Clan Jade Falcon as a military power. When the Jade Falcons won OmniMech technology from Clan Coyote in 2863, they moved quickly to develop their own designs. The Summoner was among the first results, entering production at Eagle Craft Group facilities on Ironhold and rapidly becoming the backbone of Falcon heavy OmniMech forces. St. Louis MechWorks on Niles, operating under Clan Hell's Horses control, established a parallel production line that ensured the design's availability beyond Falcon territory. Kindraa Kline of Clan Fire Mandrill also maintained limited production at their facility on Dagda, though in far smaller numbers.</p><p>During Operation REVIVAL, the Summoner was three times as common in Jade Falcon units as in any other Clan's forces, and it was during this campaign that Victor Steiner-Davion assigned the reporting name Thor after his personal encounter with the design on Trellwan. The name proved fitting, the combination of a PPC's lightning and an autocannon's thunder made an indelible impression on Inner Sphere commanders. A Clan Coyote adage born of the Invasion warned that encountering a Falcon outside a Summoner, Hellbringer, or Kit Fox warranted doubling one's caution, sign of how thoroughly the design defined Jade Falcon tactical doctrine.</p><p>The Wars of Reaving reshaped the Summoner's production sphere dramatically. The Ghost Bear facility on Bearclaw, which had produced Summoners since the design's early years, passed to Clan Snow Raven and later to Clan Stone Lion as alliances and absorptions shifted Clan territories. The Fire Mandrill facility on Dagda fell under Clan Goliath Scorpion and then Clan Star Adder control. Meanwhile, the Jade Falcon factory on Vantaa was destroyed when the planet was rendered uninhabitable during fighting between the Hell's Horses and Ice Hellions in 3072.</p><p>In the Inner Sphere occupation zones, the Jade Falcons expanded Summoner production through Eagle Craft Group operations on Erewhon and mobile factory assets, while Olivetti Weaponry on Sudeten briefly hosted a production line during the Jihad era. The Hell's Horses, having long maintained production on Niles through St. Louis MechWorks, added a new line at Svarstaad Industriplex Gamma after capturing that world. This proved prescient, as the Jade Falcons increasingly shifted their heavy OmniMech production to the Grand Summoner during the Dark Age, leaving the Hell's Horses as the primary champions of the original design.</p><p>By 3150, the Summoner had served continuously for nearly three centuries, an almost unmatched record for any OmniMech. Clan Hell's Horses embraced the design for both training and front-line service, introducing new configurations that incorporated modern weapons technology while retaining the chassis's proven mobility and reliability. The Hell's Horses' continued investment ensured that the Summoner remained a relevant battlefield presence well into the ilClan era, even as newer designs increasingly dominated the rosters of other Clans.</p>
