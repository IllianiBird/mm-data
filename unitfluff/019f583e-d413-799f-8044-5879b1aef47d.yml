chassis: "Fennec"
model: "FEC-5CM"
overview: |-
  <p>The Fennec is a fifty-five-ton medium BattleMech developed by Corean Enterprises to address a critical shortcoming in the Armed Forces of the Federated Suns' force structure: the lack of a mobile, medium-weight C3 command platform. Introduced in 3080, the design emerged from Davion experience during the Jihad, where existing C3 command architecture proved dangerously vulnerable. The Fennec provides lance-level C3 coordination in a faster, more survivable package than previous command platforms.</p><p>Produced exclusively at Corean's Augusta facility, the Fennec filled a gap that had cost Davion commanders dearly, combining respectable speed and firepower with the networking capability needed to coordinate medium lance operations across the Federated Suns' frontline formations.</p>
capabilities: |-
  <p>The Fennec shares the Corean Model AG47 endo steel chassis and VOX 330 XL engine with Corean's Legionnaire project. This powerplant pushes the fifty-five-ton design to a maximum speed of ninety-seven kilometers per hour, making it significantly faster than most medium-weight command platforms. The design sacrifices jump capability entirely, relying on raw speed for tactical repositioning.</p><p>The primary armament consists of dual arm-mounted Magna Hellstar PPCs supplemented by a pair of Sutel Precision Line medium pulse lasers, a weapon combination reminiscent of proven designs like the Warhammer and Marauder. This loadout provides credible long-range striking power backed by effective close-defense capability. However, the arm-mounted weapons configuration creates known handling issues in combination with the Fennec's narrow, digitigrade legs, as the compactly-designed torso forced designers to mount weapons in the arms rather than the torso. This preserves the design's speed-focused profile but contributes to recognized footing difficulties under sustained fire.</p><p>Nine and a half tons of Kallon Unity Weave ferro-fibrous armor provides solid protection for the weight class, though the reliance on only ten double heat sinks means MechWarriors must manage their fire discipline carefully when both PPCs are cycling. The C3 master computer integrated with the communications suite serves as the design's core purpose, enabling lance-level tactical coordination that the AFFS had previously lacked in this weight range.</p>
deployment: |-
  <p>Entering production in 3133, this variant represents Corean Enterprises' willingness to incorporate Clan-grade technology into the Fennec platform. A Clan-manufactured 275-rated XXL engine and endo-composite skeleton free sufficient mass for a dramatic weapons upgrade, replacing the standard PPCs with large re-engineered lasers paired with Clan-spec extended-range medium lasers in each arm. The standard C3 master gives way to a boosted C3 master computer, enhancing the design's networking capability beyond the original specification. A Clan-built light active probe adds battlefield awareness for detecting hidden units, while eleven double heat sinks tied into a Radical Heat Sink System manage the considerable thermal demands of the advanced weapons suite. The FEC-5CM showcases the increasing availability of Clan technology on the Inner Sphere market during the Dark Age period.</p>
history: |-
  <p>The Fennec's origins trace directly to the hard lessons learned by the Armed Forces of the Federated Suns during the Jihad. Throughout the Word of Blake conflict, the AFFS discovered that their C3 command architecture was dangerously top-heavy, with master computers concentrated in primarily heavy and assault BattleMechs. Only imported Cyclops and Gunslinger designs were available for lance command duties, and company-level command was limited to conventional vehicles. When the Word of Blake consistently outmaneuvered and isolated these large, slow command units through electronic countermeasures, the need for a faster, more survivable C3 platform became urgent.</p><p>Corean Enterprises answered this requirement by leveraging its ongoing Legionnaire development program. The Augusta-based manufacturer adapted the Legionnaire's chassis architecture and component base to create a dedicated C3 cavalry 'Mech, trading the Legionnaire's speed for nearly double the weapon tonnage and the space required for a C3 master computer. Early prototypes were rushed to the Davion Assault Guard, which deployed them during operations against the Taurian Concordat around 3080. These initial engagements demonstrated the Fennec's value as a mobile command platform, with Davion strike formations using the design to coordinate rapid deployment operations that repeatedly caught Taurian defenders off-balance.</p><p>Production at Corean's Augusta facility expanded through the early Republic era, with the FEC-3C companion variant entering service in 3087 to provide C3 slave-equipped wingmates for Fennec lance formations. The design remained in continuous production through the Republic's collapse and into the Dark Age, with Corean introducing the extensively modernized FEC-5CM in 3133. This variant's incorporation of Clan-grade technology, including an XXL engine and Clan-manufactured weapons systems, reflects both the increasing availability of such technology through merchant Clan trading networks and Corean's commitment to keeping the Fennec competitive against evolving threats.</p><p>The Fennec has remained a cornerstone of Federated Suns medium lance command doctrine from the Jihad's aftermath through the Republic era and into the ilClan period, with the design's three production variants ensuring that C3-equipped Davion formations can field both master and slave nodes from a common, fast-moving chassis family.</p>
