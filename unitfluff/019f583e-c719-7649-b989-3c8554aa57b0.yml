chassis: "Wolfhound IIC"
model: "'Grinner'"
overview: |-
  <p>The Wolfhound IIC is a unique Clan-technology rebuild of a captured Inner Sphere Wolfhound BattleMech, produced around 3051 by Clan Wolf technicians. Authorized by Khan Ulric Kerensky, the rebuild spared no expense in upgrading the original design with advanced Clan materials and weaponry. The project used an endo-steel internal structure and a Clan XL engine to dramatically reduce weight, while maximizing armor protection with six and a half tons of ferro-fibrous plating. An ECM suite provides additional electronic defense capabilities unusual for a design of this era. Whether the Wolfhound IIC ever achieved full production remains unclear, and the only confirmed example in existence is the original rebuild. The design nonetheless demonstrates the transformative potential of applying Clan technology to a proven Inner Sphere chassis, retaining the original Wolfhound's all-energy weapon philosophy while dramatically improving performance across every metric.</p>
capabilities: |-
  <p>The Wolfhound IIC maintains the original Wolfhound's all-energy weapon design philosophy while leveraging Clan technology for substantial improvements in firepower and heat management. The primary weapon is an arm-mounted Series 7K ER large laser, providing excellent range and damage output. Three torso-mounted Kolibri Omega Series medium pulse lasers deliver accurate close-range firepower, while a rear-mounted Series 2b ER medium laser discourages pursuit, a defensive feature inherited from the original design.</p><p>Fourteen Clan-specification double heat sinks provide exceptional thermal management, keeping the 'Mech cool during sustained engagements provided the rear-mounted laser sees limited use. The design team considered mounting an anti-missile system but ultimately decided against it, preserving the Wolfhound's traditional ammunition-free operational profile.</p><p>The Clan XL engine maintains the standard 97 kph top speed while freeing significant tonnage for other systems. Six and a half tons of ferro-fibrous armor provides the maximum protection achievable on the thirty-five-ton chassis, substantially exceeding the protection offered by the Inner Sphere original. The addition of an ECM suite is a rare defensive electronics package that enhances the 'Mech's survivability against enemy targeting systems and guided munitions, making it a formidable light combatant despite its unique, non-production status.</p>
deployment: |-
  <p>The sole confirmed Wolfhound IIC is this unique Clan Wolf rebuild, completed around 3051 using captured Inner Sphere hardware upgraded with Clan technology. Armed with a Series 7K ER large laser, three Kolibri Omega Series medium pulse lasers, a rear-mounted Series 2b ER medium laser, and an ECM suite, the design represented a dramatic improvement over the standard Wolfhound in every performance category. The 'Mech saw active service during the Clan Invasion era and proved itself in formal Clan trials of combat before being retired from frontline duty by 3059 in favor of heavier OmniMech designs.</p>
history: |-
  <p>The Wolfhound IIC's origins trace to the capture of an Inner Sphere Wolfhound during Operation REVIVAL, the Clan Invasion of 3049-3052. The 'Mech and its pilot were taken by Clan Wolf forces, and the pilot subsequently earned a place within the Clan through trials of combat. Khan Ulric Kerensky authorized a comprehensive rebuild of the captured machine, directing Clan Wolf technicians to upgrade it using the full extent of available Clan technology.</p><p>The rebuild was completed around 3051, transforming the Inner Sphere chassis with Clan-grade endo steel, an XL engine, ferro-fibrous armor, and an entirely new weapons suite incorporating Clan-manufactured energy weapons. The technicians initially considered incorporating an anti-missile system into the design, but ultimately preserved the Wolfhound's defining characteristic as a purely energy-based weapons platform free from ammunition concerns.</p><p>The Wolfhound IIC saw action during some of the most significant engagements of the Clan Invasion era and the subsequent political upheavals within Clan Wolf. The design proved itself in single combat during Bloodname trials, demonstrating that the combination of proven Inner Sphere design philosophy with Clan technological superiority produced a formidable light combatant. By 3059, the original machine had been retired from active service in favor of heavier OmniMech designs better suited to the evolving tactical requirements of Clan warfare.</p><p>Whether any additional Wolfhound IICs were ever produced remains a matter of debate among military historians. No confirmed examples beyond the original rebuild have been documented, suggesting the design remained a one-of-a-kind curiosity rather than a production program. The Wolfhound IIC nonetheless holds historical significance as an early example of Clan-Inner Sphere technological fusion, presaging the broader trend of mixed-technology designs that would emerge decades later.</p>
