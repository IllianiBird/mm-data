chassis: "Penthesilea"
model: "PEN-2H"
overview: |-
  <p>The Penthesilea is a seventy-five-ton heavy BattleMech completed in early 3083, the heaviest design ever produced by the Magistracy of Canopus. Designed by Majesty Metals and Manufacturing at their Dunianshire facility, the 'Mech was named after an Amazon queen of Greek mythology who fought to protect Troy. Intended to serve as a heavy fire support platform capable of engaging at multiple range brackets, the Penthesilea filled a critical gap in the Magistracy Armed Forces' roster. The design has proven a reliable heavy combatant across the Periphery, earning a solid reputation among both Magistracy formations and allied states who have received export models.</p>
capabilities: |-
  <p>The Penthesilea balances offensive and defensive capabilities through careful engineering trade-offs. A complex Dynastic 75-P endo steel frame and twelve tons of Maximillian 42F ferro-fibrous armor provide a solid protective foundation, while a compact gyro paired with a standard Vlar 300 fusion engine enhances pilot survivability, a longstanding Magistracy Armed Forces tradition. The design's sixty-four kilometer per hour top speed is modest for a heavy 'Mech, but three Nike Doublejet 9s jump jets providing ninety meters of jump capability offer valuable tactical repositioning.</p><p>The weapons array enables the Penthesilea to function as both sniper and brawler. A Majesty Metals Royal Flush extended-range PPC and Deuce light PPC deliver effective long-range harassment, while an Imperator Code Red LB-10X autocannon offers versatility through selectable solid slugs for armor penetration or cluster munitions for exploiting breaches. Three Diverse Optics Type II extended-range medium lasers round out the close-range arsenal. The primary drawback is heat management, thirteen double heat sinks struggle to dissipate the full weapons suite's output, demanding careful fire discipline from MechWarriors. CASE protection in the right torso mitigates the risk posed by the autocannon's ammunition bay.</p>
deployment: |-
  <p>The base production model, this variant entered service in 3083 as the Magistracy's first indigenous heavy fire support design. Combining an extended-range PPC and light PPC for long-range engagement with an LB-10X autocannon offering tactical flexibility through selectable ammunition types, the design excels at forcing opponents into unfavorable closing engagements. Three ER medium lasers provide credible short-range firepower when enemies manage to close the distance. The inclusion of jump jets, unusual for a fire support design of this weight, allows pilots to rapidly reposition to optimal firing positions, giving this variant an unexpected tactical edge over more conventional heavy fire support platforms.</p>
history: |-
  <p>The Penthesilea emerged from political tensions surrounding Magistracy of Canopus weapons manufacturing in the early post-Jihad period. With the vast majority of military production concentrated on Detroit (a world under tenuous Magistracy control) pressure mounted from two directions. Reactionaries were wary of relying on a politically vulnerable manufacturing base, while Majesty Metals and Manufacturing sought to expand production and profit from the advanced technology that had helped transform the Magistracy Armed Forces. The end of the Jihad brought a fragile peace that allowed the Magestrix to authorize the project, gaining political capital while strengthening the realm's industrial base on Dunianshire.</p><p>The first Penthesilea units rolled off the Dunianshire assembly line in 3083 and were sold to the mercenary command Zeus' Thunderbolts for field testing. Despite the unit's conspicuously reflective paint scheme making them impossible to miss, combat testing validated the design as an effective fire support platform. The jump jets, initially questioned by some critics, proved their worth by enabling rapid repositioning to optimal sniping positions and traversal of otherwise impassable terrain.</p><p>Once full production commenced, approximately half the output was assigned to elite Magistracy formations including the Royal Guard and the Chasseurs á Cheval regiments. Machines replaced by the new Penthesilea in both units were transferred to the Chasseurs. The remaining production was earmarked for export to allied Periphery nations and loyal mercenary commands. The Taurian Concordat became the first foreign customer approved for shipments, with Protector Boris Tharn rushing the new 'Mechs to Concordat units stationed in Federated Suns space to form the backbone of TDF fire support lances in the Pleiades region.</p><p>By the Late Republic era, the Penthesilea continued to evolve. A new variant was spotted with Canopian Lancers deployed on Pleione, Second Try, and Yunnah, supporting Capellan Confederation Mortis formations. This experimental redesign, incorporating actuator enhancement systems and a bombast laser, demonstrated the continued investment by Majesty Metals in expanding the Penthesilea's capabilities, even as the resulting design drew criticism for lacking a coherent tactical purpose.</p>
