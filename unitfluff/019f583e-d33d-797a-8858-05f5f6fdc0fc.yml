chassis: "Avalanche"
model: "AVL-1OB"
overview: |-
  <p>The Avalanche is a medium Inner Sphere OmniMech introduced in 3133 by Luthien Armor Works on Luthien. Conceived as a joint development between the Draconis Combine and Clan Nova Cat in the aftermath of the Second Combine-Dominion War, the design was intended to rebuild the Clan's depleted touman while providing the DCMS with a cost-effective trooper OmniMech. Built entirely from off-the-shelf Inner Sphere components, the Avalanche fills a niche as an economical medium OmniMech prioritizing reliability and ease of maintenance over raw performance. Production has continued on Luthien through the Dark Age and into the ilClan era, with exports reaching the Capellan Confederation and mercenary markets following Clan Nova Cat's destruction.</p>
capabilities: |-
  <p>The Avalanche prioritizes economy and maintainability over cutting-edge performance. Built on a Luthien Class M endo steel chassis, the design employs a standard Hermes 250 fusion engine providing a maximum speed of 86 kilometers per hour, adequate but unexceptional for a fifty-ton platform. Five Icarus Standard jump jets enhance tactical mobility with a jump capacity of 150 meters, while ten tons of Mitchel Argon Standard armor provides reasonable protection, though less than many contemporary medium designs. Ten double heat sinks manage thermal loads across most configurations, and CASE protection in the right torso guards against catastrophic ammunition detonation.</p><p>The chassis allocates sixteen tons of pod space, offering decent reconfiguration flexibility for a medium OmniMech. A significant design flaw manifests when Clan-manufactured weapons are installed: the Matabushi Stalker targeting system loses alignment after extended use, with Nova Cat warriors reporting misalignment reaching two full degrees during gunnery exercises, a deficiency that severely undermined confidence in the platform and ultimately led to its abandonment by Clan Nova Cat in favor of the purpose-built Wendigo.</p>
deployment: |-
  <p>Designed as a dedicated long-range combatant, the B configuration mounts a light PPC and ER medium laser in each arm, providing sustained energy fire without ammunition dependency. Thunderbolt 5 missile launchers in each side torso supplement the energy package with guided missile fire, fed by two tons of ammunition in the right torso. This configuration maximizes the Avalanche's effective engagement distance while maintaining energy weapons as a fallback when missiles are depleted, making it well-suited for extended operations where resupply is uncertain.</p>
history: |-
  <p>The Avalanche emerged from the aftermath of the Second Combine-Dominion War, which ended in 3101 and left Clan Nova Cat's military forces severely depleted. The DCMS granted Luthien Armor Works carte blanche to collaborate with the Clan on a jointly developed OmniMech that would be economical to produce using readily available resources. What followed was one of the longest development cycles in modern BattleMech history, with the project plagued by three decades of false starts, reappropriated funding, and unresolved technical challenges before the first Avalanche rolled off LAW's production line in 3133.</p><p>The design was deployed shortly before the Draconis Combine's invasion of the Republic of the Sphere, seeing action with elite formations including the Sword of Light and Benjamin Regulars. A lance of Avalanches from the Sixth Benjamin Regulars participated in a hot-drop onto Shinonoi to secure the primary landing zone, engaging targets from long range with Clan technology before reconfiguring to support capital defense operations. The DCMS found the Avalanche to be a serviceable trooper OmniMech, but Clan Nova Cat's warrior caste was far less satisfied. Persistent targeting system malfunctions with Clan weaponry frustrated Nova Cat warriors to the point where the Clan developed only two mixed-technology configurations before abandoning the platform entirely, opting instead to create the Wendigo, a purely Clan-built OmniMech based on the Avalanche's chassis.</p><p>Following the destruction of Clan Nova Cat after its revolt against Coordinator Yori Kurita, the dead Clan's allotment of Avalanches was redistributed. Luthien Armor Works refurbished former Nova Cat machines and channeled them through the Clan's export division, where Clan Sea Fox, the Capellan Confederation, and the Free Worlds League expressed interest. The Confederation purchased a significant number of Avalanches prior to its invasion of the Federated Suns, deploying them extensively in the conquest of Capellan March worlds. Sea Fox merchants resold additional units to mercenary companies, where the solidly-built 'Mech found favor among smaller outfits that valued its reliability and ease of maintenance over raw combat performance.</p>
