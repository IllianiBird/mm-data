overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing LB-X autocannon that can switch between solid slugs and cluster rounds, these field gun crews adapt their fire to engage both armored point targets and dispersed infantry formations.</p>
