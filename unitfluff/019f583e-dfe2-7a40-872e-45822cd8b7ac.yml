chassis: "Crossbow"
model: "CRS-X"
overview: |-
  <p>Arcturan Arms' first foray into BattleMech manufacturing produced the sixty-ton CRS-6B Crossbow, a fast missile support platform that entered service with the Lyran Commonwealth in the late Age of War. Considered a middleweight machine compared to the heavier Mackies and Ymirs already in circulation, the Crossbow was designed to deliver heavy ranged missile fire before closing to engage with directed energy weapons. The prototype CRS-X first walked onto the battlefield in 2468, with the refined production model following several years later.</p><p>Though produced in limited numbers before financial difficulties forced the shutdown of the Arcturus production line, the Crossbow's distinctive arm-mounted weapons configuration left a lasting legacy. The design's self-contained arm assemblies, conceived as easily replaceable turrets, likely inspired the Clan Steel Viper OmniMech that would bear the same name centuries later.</p>
capabilities: |-
  <p>The most distinctive feature of the CRS-6B Crossbow is its arm assemblies. Designed with a minimum of complex actuators, these assemblies function as self-contained turrets that could theoretically be easily replaced if severed in combat. Each arm mounts a CDC Double-Five LRM-10 launcher backed by a Rassal Blue-Beam medium laser, providing the Crossbow with effective fire support capability at multiple engagement ranges. This arm-centric weapons philosophy, combined with the 'Mech's primary role as a missile platform, would centuries later likely serve as the inspiration for the Clan-made Crossbow OmniMech.</p><p>An A-4 "Lightning" Series particle projection cannon mounted in the torso provides additional long-range firepower, though the meager heat dissipation system provided by Arcturan Arms' engineers prevents the Crossbow from effectively employing all of its long-range weapons simultaneously. In practice, the PPC serves as a medium-range alternative when the 'Mech's missile ammunition runs low. Powered by an AA Eterna 300-rated fusion engine, the Crossbow achieves an impressive top speed of 86 km/h for its weight class, though this speed comes at the cost of armor protection. With only eight tons of Diamond Skin Beta Series armor, the Crossbow is especially vulnerable to concentrated fire, a trade-off that would imperil many Lyran MechWarriors during the late Age of War.</p>
deployment: |-
  <p>The original Crossbow prototype entered field testing in 2468, mounting paired LRM-5 launchers and a medium laser in each arm with a large laser in the torso. Powered by a primitive engine that limited the 'Mech to a top speed of 64 km/h, this variant required significantly more tonnage devoted to its engine, cockpit, and armor than later production models. The prototype's cooling system proved inadequate for sustained fire, and barrages of twenty missiles that regularly failed to find their targets disappointed Lyran evaluators. Fewer than a dozen prototypes were constructed before the Lyran government rejected the design, though the experience gained from the program proved essential to developing the improved CRS-6B.</p>
history: |-
  <p>The Crossbow's origins trace to the early Age of War, when the Coventry Defense Conglomerate was enjoying record profits from its military contracts. Dozens of other manufacturers competed for their share of the massive Lyran military spending, and Arcturan Arms positioned itself as a viable contender with the CRS-X prototype in 2468. Originally envisioned as a fast cavalry BattleMech capable of delivering heavy ranged missile fire, the prototype mounted paired LRM-5 launchers and a medium laser in each arm with a heavy laser in the torso. However, fewer than a dozen prototypes were constructed before the Lyran government rejected the design, citing inadequate firepower and persistent cooling problems.</p><p>Despite this initial setback, Arcturan Arms secured a supplemental contract to produce Banshees for the Lyran military, giving the company the expertise and revenue needed to refine the Crossbow. The production model CRS-6B replaced the prototype's smaller launchers with LRM-10s and swapped the heavy laser for a harder-hitting PPC, earning a long-term production contract in 2485. The 6B series entered production earmarked exclusively for the LCAF's Royal Guard, but a host of complications quickly undermined Arcturan Arms' ambitions.</p><p>Constantly behind schedule and suffering from financial and labor crises following the relocation of the Lyran capital from Arcturus to Tharkad, Arcturan Arms managed to produce only a fraction of the Crossbows originally planned. The Lyran government cancelled the production order in 2490 after a mere 337 CRS-6Bs had been built. Efforts to restart the line would ultimately fail, and MacEnroe Motors bought out the financially troubled company in 2541, shutting down Crossbow production entirely by 2550.</p><p>The Crossbow faded into obscurity during the Succession Wars, with surviving examples becoming increasingly rare battlefield curiosities. The design saw an unexpected revival during the Jihad, when the Arcturan Arms Refit Facility on Arcturus began producing the modernized CRS-9A variant, built on the remains of the old factory complex. This updated model incorporated advanced technology including double heat sinks, ferro-fibrous armor, and extended-range weaponry, giving the ancient chassis new relevance in a changed battlefield environment.</p>
