chassis: "Hollander II"
model: "BZK-F5"
overview: |-
  <p>The Hollander II represents Coventry Metal Works' most ambitious attempt to address the original Hollander's critical shortcomings. By increasing the chassis weight to forty-five tons, engineers gained sufficient mass to mount backup weapons alongside the design's signature long-range firepower. First produced in 3058, the Hollander II line retained the parent design's core philosophy of delivering outsized firepower on a relatively inexpensive platform while addressing the most dangerous vulnerability: the original's complete lack of secondary armament. Two production models emerged from Coventry, each taking a different approach to exploiting the additional tonnage. The Hollander II saw service primarily with Lyran Alliance forces during the Civil War era.</p>
capabilities: |-
  <p>Building on the Hollander's proven chassis philosophy, the Hollander II adds ten tons of mass to create a medium-weight platform better suited to sustained combat operations. The increased tonnage allows engineers to address the original design's most critical failing (the total absence of backup weaponry) while retaining the devastating long-range punch that defined the Hollander concept. The reinforced leg structure and stabilization systems carry over from the lighter design, maintaining the ability to deliver accurate fire on the move.</p><p>The BZK-F5, the more balanced of the two production models, pairs the proven Poland Main Model A Gauss rifle with a Streak SRM-2 launcher and a medium laser, giving the MechWarrior options when ammunition runs low or combat closes to shorter ranges. The BZK-F7 takes the opposite approach, replacing the standard Gauss rifle with the newly developed heavy Gauss rifle for even greater destructive potential at the cost of returning to the original design's single-weapon vulnerability. This trade-off makes the F7 a controversial choice among field commanders, as it recreates the very problem the Hollander II was designed to solve.</p>
deployment: |-
  <p>Entering production in 3058, this variant represents the balanced approach to the Hollander II concept. Retaining the proven Poland Main Model A Gauss rifle as its primary weapon, the additional tonnage allows the mounting of a Streak SRM-2 launcher and a medium laser as secondary armament. This combination provides the MechWarrior with meaningful fallback options when Gauss ammunition is depleted or when engagements close to ranges where the missile and laser systems prove more practical. The design was well received by Lyran commanders who had long requested exactly this capability from the Hollander line.</p>
history: |-
  <p>The Hollander II program began at Coventry Metal Works in the late 3050s as a direct response to field commanders' growing frustration with the original Hollander's limitations. While the BZK-F3 had proven effective as a sniper platform, its inability to defend itself at close range or continue fighting after expending its limited Gauss ammunition made it a liability in prolonged engagements. Coventry's solution was straightforward: increase the chassis weight to forty-five tons, providing the mass budget for backup weapons and improved protection.</p><p>The BZK-F5 entered production first in 3058, achieving the balanced design that field units had requested. The more aggressive BZK-F7 followed in 3061, appealing to commanders who valued raw firepower over versatility. Both variants saw action during the FedCom Civil War, serving primarily with Lyran Alliance units.</p><p>Production of the Hollander II line at Coventry effectively ceased during the Jihad, when the factory came under contested control and active manufacturing was disrupted. Unlike the lighter Hollander, which found new life through the BZK-G2 field refit program, the Hollander II received no comparable modernization effort, leaving surviving examples as increasingly rare relics of the pre-Jihad Lyran military-industrial complex.</p>
