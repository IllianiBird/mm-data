chassis: "Motorized demi-I (WOBM)"
model: "(SRM)"
overview: |-
  <p>Drawing veterans from the Com Guards, recruits from the Free Worlds League, and volunteers from Protectorate worlds, the Word of Blake Militia assembled infantry formations whose quality varied but whose equipment was consistently first-rate. Motorized Level I formations used light vehicles for rapid movement between garrison posts, providing the speed needed to respond to civil unrest or insurgent attacks faster than foot infantry could march. Their mobility made them a preferred choice for patrol duties across the Word's Protectorate holdings. Equipped with infantry-portable short-range missile launchers that provide anti-armor capability beyond what personal weapons can achieve, these troops can threaten light vehicles and battle armor at close range.</p>
