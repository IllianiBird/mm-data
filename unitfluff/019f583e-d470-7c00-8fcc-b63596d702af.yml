chassis: "Onager"
model: "2"
overview: |-
  <p>The Onager is a ninety-ton Clan assault BattleMech introduced in 3083 by Red Devil Industries on Pandora for Clan Jade Falcon. Named after a medieval siege engine, the design was developed to fill the Jade Falcon garrison clusters with a proper Clan-technology assault platform, replacing the captured Inner Sphere machines that had been pressed into service during the Jihad. Built around proven Clan technology, the Onager prioritized durability, ease of maintenance, and manufacturing simplicity over cutting-edge performance, making it well suited to the second-line formations it was intended to reinforce. The design served as a visible commitment to rebuilding the Falcon's defensive strength with purpose-built Clan hardware.</p>
capabilities: |-
  <p>Built around a sturdy endo steel frame, the Onager is protected by fifteen tons of ferro-fibrous armor, giving the ninety-ton chassis substantial staying power in prolonged engagements. Its Consolidated 270-rated fusion engine deliberately sacrifices speed for reliability and ease of maintenance, propelling the 'Mech to a modest fifty-four kilometers per hour. This slow pace is offset by five improved jump jets that grant the Onager a hundred and fifty meters of jump capability, providing the mobility of a much lighter design and making it surprisingly effective in urban and broken terrain.</p><p>The Onager's primary long-range threat is a Type 0 Hyper-Assault Gauss 30 rifle mounted in the left arm, which delivers devastating cluster fire at extended ranges. As opponents close, the 'Mech brings a punishing array of short-range weapons to bear: twin Pattern J7 SRM-6 launchers exploit gaps torn open by the HAG, while a pair of Series 14a medium pulse lasers provide accurate energy fire. For anti-infantry work, two Raid micro pulse lasers and a Chi Series small pulse laser round out the arsenal. The design runs warm under sustained fire, as its twelve double heat sinks struggle to manage the full weapon suite simultaneously, forcing pilots to exercise fire discipline at close quarters.</p>
deployment: |-
  <p>Introduced in 3137, the Onager 2 is a significant reworking of the original design's weapons philosophy. Engineers replaced the medium and small pulse lasers with a pair of large pulse lasers, dramatically increasing the 'Mech's striking power at medium range while maintaining the HAG 30 and twin SRM-6 launchers from the base model. To accommodate this heavier energy loadout, the five improved jump jets were swapped for three standard jump jets, reducing jump capability to ninety meters but freeing critical weight and space. The most notable addition is HarJel II self-repair systems installed in both side torsos, giving the Onager 2 the ability to automatically seal breaches and stabilize internal damage during combat, significantly improving its survivability in sustained engagements.</p>
history: |-
  <p>The Onager's development was a direct consequence of the devastation wrought by the Jihad on Clan Jade Falcon's touman. By the end of the conflict, the Falcon garrison clusters were severely depleted and still reliant on captured Inner Sphere BattleMechs to fill their ranks. Khan Samantha Clees, determined to rebuild the Clan's defensive strength with proper Clan-technology platforms, ordered the engineering team fresh off the Flamberge project to design a new assault 'Mech prioritizing production volume and low maintenance costs over raw performance.</p><p>The most controversial aspect of the Onager's creation was the decision to upgrade and expand the Red Devil Industries facilities on Pandora for its production. The factory had long operated under Merchant Factor Daniel's policy of segregating different production plants, but the expansion signaled a relaxation of this approach. Red Devil Industries, originally a Lyran manufacturer with a checkered reputation for quality, had been pressed into Jade Falcon service after Pandora's capture during the FedCom Civil War. The facility had weathered labor unrest and Jihad-era production shortfalls but remained the largest producer of second-line 'Mechs in the Jade Falcon Occupation Zone.</p><p>The first production Onagers were dispatched to Iota Galaxy for operational testing against pirates and Periphery raiders along the Falcon border. Against such opponents the design performed admirably, earning positive reviews from warriors who appreciated having a genuine Clan assault platform rather than a salvaged Inner Sphere machine. The 'Mech was subsequently allocated more broadly to fill out second-line formations, and many garrison warriors were grateful to replace their aging equipment with a purpose-built Clan design, even though it lacked the flexibility of an OmniMech.</p><p>By the Dark Age, the Onager had become a mainstay of Jade Falcon garrison forces. Reports indicated that Khan Clees had considered deploying Onager-equipped units on raids against rival Clans to further test the design against more capable opponents, though such operations had not materialized by the time Pandora's political situation shifted again. The introduction of the Onager 2 variant in 3137 demonstrated continued investment in the chassis, adapting it with heavier energy weapons and self-repair capability for the evolving battlefields of the Dark Age.</p>
