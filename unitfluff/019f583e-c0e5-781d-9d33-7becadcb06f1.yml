chassis: "Magellan JumpShip"
model: "(2960)"
overview: |-
  <p>Commissioned by Primus Adrienne Sims and in service since 2960, the Magellan-class has become a mainstay of the ComStar fleet. Produced at the O'Neil yards at Terra, it is specifically designed for impressive long-range missions, true to the naming of the class. Until the dissemination of HPG technology following Operation Scorpion, the security of these vessels was so vital that ComStar preferred the loss of a ship and crew over its technology falling into non-ComStar hands.</p>
capabilities: |-
  <p>Massive fuel tanks allow the Magellan-Class to operate for over 600 days and travel 2,500 light-years before requiring refueling. The class is one of the most well-armored JumpShips in existence, carrying 75 tons of armor and a formidable array of lasers, LRM missile racks (nose and stern), and anti-missile guns in every arc. The command section houses an advanced medical facility with an operating theater and isolation ward, utilizing technology not seen outside ComStar since the fall of the Star League. The ship accommodates 20 crew members in luxurious quarters and an additional 28 staterooms for a marine platoon. The Magellan-class is notable as one of the few JumpShips designed with a Lithium-Fusion Battery as standard. Explorer Corps policy sees the Magellanreserve this charge for an "escape jump" in case of unexpected hostilities. The Magellan-class its most striking feature however is a sophisticated Hyperpulse Generator (HPG) for faster-than-light communications with any other HPG within 50 light-years. As downside the ship lacks a grav deck due to the necessary space being taken up by its other features. This requires the captain to use acceleration to generate gravity, necessitating a careful balance between crew health and fuel conservation.</p>
history: |-
  <p>Produced for ComStar at the O'Neil Yards in the Terran system, the Magellan-class was commissioned by Primus Adrienne Sims for the Explorer Corps. Becoming the backbone of the ComStar JumpShip fleet and Explorer Corps thanks to its impressive capacity for long-range missions.</p>
