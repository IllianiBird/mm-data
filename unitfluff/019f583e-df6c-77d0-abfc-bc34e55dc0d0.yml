chassis: "Arbiter"
model: "ARB-001 SecurityMech"
overview: |-
  <p>The Arbiter is a 35-ton armed IndustrialMech introduced in 3074 by Meridian Manufacturing on the remote Periphery world of New St. Andrews. Classified as a Corporate SecurityMech under the SecurityMech Treaty of 2613, the Arbiter was purpose-built to deter pirate raids on frontier worlds that could not afford true BattleMech garrisons. Meridian's genius lay not in the 'Mech's combat capability, which is negligible, but in its deliberate gothic aesthetic designed to make the light WorkMech appear as imposing and threatening as a heavy BattleMech. The Arbiter stands as evidence of the principle that on the Periphery, perception of strength can be as valuable as strength itself.</p>
capabilities: |-
  <p>The Arbiter's primary weapon is an ancient heavy rifle, a primitive weapon that predates the Age of War and is all but obsolete on the modern battlefield. The rifle's limited ammunition supply of just six rounds restricts the 'Mech to extremely brief engagements, and its ballistic performance is inferior to even a standard Class 5 autocannon. However, Meridian's engineers cosmetically enhanced the weapon's housing to emphasize its massive size, creating a silhouette that can easily be mistaken for a Gauss rifle or Class 20 autocannon at range. This visual deception is central to the Arbiter's tactical doctrine: the 'Mech's role is to intimidate and deter, not to destroy.</p><p>Powered by a Jones 175 fuel cell engine, the Arbiter achieves a respectable top speed of 86.4 kilometers per hour, adequate for patrolling and repositioning. Its industrial-grade chassis and five tons of Lexington Limited heavy industrial armor provide protection roughly comparable to a light BattleMech, though the frame is fundamentally not designed for sustained combat. An advanced fire control system and ejection seat round out the design, the latter being a prudent inclusion given the 'Mech's vulnerability to any opponent that calls its bluff. The Arbiter's low cost is its greatest practical asset, enabling Periphery worlds and mercenary commands to field entire companies for a fraction of what a single frontline BattleMech would cost.</p>
deployment: |-
  <p>The base ARB-001 serves primarily with frontier militias and corporate security forces across the deep Periphery, where its low procurement and maintenance costs make it the only armed 'Mech many worlds can afford to field. Meridian Manufacturing produces no factory variants, content to keep the production line simple and costs minimal. The design has proven popular with independent operators who replace the heavy rifle with a more modern Class 5 autocannon, significantly improving combat effectiveness at the cost of the original low-tech simplicity, though Meridian has made no effort to formalize this modification.</p>
history: |-
  <p>The Arbiter's origins are rooted in New St. Andrews' technological limitations. The remote Periphery world had long been restricted to producing copies of Scorpion light tanks and Vedette medium tanks, and even those were forced to mount pre-Age of War weapons such as machine guns and heavy rifles because local industry could not replicate modern autocannons. When Meridian Manufacturing was founded with the ambition of producing BattleMechs, the same limitation plagued their efforts, resulting in the armed IndustrialMech that would become the Arbiter rather than the true combat machine originally envisioned.</p><p>Meridian turned this limitation into a selling point. Development began around 3063 under Supervising Technician McAllister Sloughton III, and prototypes were reportedly seen as early as 3068 in the Rim Collection, Lyran Commonwealth, and Free Worlds League, though formal production is dated to 3074. The design's intimidating appearance and rock-bottom price generated immediate commercial success, with entire battalions ordered by worlds seeking an affordable deterrent against pirate incursions. Mercenary units in the region also adopted the Arbiter as a cheap security platform, valuing its ability to project strength without the expense of maintaining true BattleMechs.</p><p>The Jihad did not significantly disrupt Meridian's operations on New St. Andrews, and by 3081 the company had expanded its ambitions, purchasing licenses to manufacture Stinger and Wasp BattleMechs. The destruction of the Circinus Federation in the post-Jihad era created severe instability in the region, with pirate raids on New St. Andrews increasing dramatically through the 3090s until the world faced attacks twice monthly. This insecurity paradoxically boosted demand for the Arbiter, as neighboring systems sought any affordable defense they could acquire. Throughout the Dark Age and into the ilClan era, the Arbiter has remained in continuous production, a fixture of Periphery defense forces and a reminder that even the most primitive technology can find a market when applied with ingenuity.</p>
