chassis: "Foot Platoon (CCAF)"
model: "(SRM 2400+)"
overview: |-
  <p>Capellan infantry serve where BattleMechs and armor cannot be spared, which in the resource-constrained CCAF means nearly everywhere. The Xin Sheng movement revitalized the infantry arm alongside every other facet of the Capellan Confederation Armed Forces, giving foot soldiers better equipment and renewed purpose. CCAF foot platoons anchor the Confederation's garrison network, holding worlds that BattleMech forces cannot permanently occupy. Slow and vulnerable in open terrain, they depend on prepared positions and local knowledge to offset their lack of mobility. Heavy weapons sections carry man-portable short-range missile launchers that give the platoon an anti-armor punch well beyond what personal weapons can deliver, though the launchers are heavy and ammunition is limited.</p>
