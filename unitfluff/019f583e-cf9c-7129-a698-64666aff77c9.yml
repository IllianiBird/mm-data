chassis: "Fwltur"
model: "FWL-3R SalvageMech"
overview: |-
  <p>The Fwltur is a 35-ton light IndustrialMech introduced in 3081 by the New Earth Trading Company. Named after the Welsh word for vulture, one of the most notorious scavengers in Terra's animal kingdom, the Fwltur was purpose-built to reach salvageable material in locations that conventional recovery teams could not access. The design quickly established itself as the premier salvage platform for hazardous environment operations, earning a strong reputation among both corporate salvage firms and independent owner-operators across the Inner Sphere. Few competing designs match the Fwltur's combination of environmental sealing, underwater capability, and cargo handling, making it the default choice for operators who need a single platform capable of working in virtually any conditions.</p>
capabilities: |-
  <p>The defining feature of the Fwltur is its extraordinary environmental versatility. Full environmental sealing protects the pilot from hazardous atmospheres, vacuum conditions, and underwater pressures, correcting the vulnerabilities that plague most IndustrialMechs operating outside standard conditions. Three BattleMech-scale underwater maneuvering units allow the Fwltur to cross submerged chasms and scale underwater cliffs that would otherwise be impassable, making it one of the few IndustrialMechs capable of true underwater salvage operations.</p><p>A pair of StarCorps salvage arms mounted in each arm provide the primary recovery tools, while a rear-mounted NETC lift hoist handles heavier cargo transport. A Beagle active probe, typically found in military scouting units, assists in locating hidden or buried salvage, with a searchlight supplementing operations in low-visibility environments. Even when the pilot cannot retrieve everything in a single trip, the probe's data can be used to retrace routes back to salvageable material.</p><p>Powered by a Victory 105-rated fusion engine, the Fwltur manages a modest top speed of 54 km/h, adequate for reaching remote sites without urgency. Three and a half tons of BAR 5-grade commercial armor provides reasonable protection against environmental hazards and minor accidents, though a particle cannon or heavy autocannon would quickly disable this non-combatant design.</p>
deployment: |-
  <p>The base FWL-3R represents the full-capability Fwltur design, equipped for operations in virtually any environment. It has been widely adopted across the Republic of the Sphere and beyond, serving with government agencies, mercenary commands, corporate salvage firms, and independent operators alike. Its versatility ensures that operators can take contracts in environments ranging from irradiated wastelands to deep-sea wreck sites without requiring specialized modifications.</p>
history: |-
  <p>The Jihad left a trail of destruction across the Inner Sphere that took decades to fully assess, let alone recover from. While recovery teams quickly stripped accessible wreckage, vast quantities of valuable salvage remained in locations that were difficult or dangerous to reach. The New Earth Trading Company, recognizing the market opportunity, commissioned the Fwltur as a purpose-built solution for these challenging recovery operations.</p><p>Initial production began at the company's Terra facility during the early years of the Republic of the Sphere. The design proved commercially successful almost immediately, with sales extending to nearly all governments of the Inner Sphere and Periphery, as well as mercenary outfits and large salvage companies. Individual entrepreneurs looking to enter the IndustrialMech owner-operator salvage business also placed orders, and for those who could not justify the full purchase price, NETC maintained a private fleet of Fwlturs available for rent.</p><p>The Fwltur received some of its best publicity from operations conducted in NETC's own backyard on New Earth. Three of the new IndustrialMechs were used to recover the remains of a destroyed mercenary command from beneath the north polar ice cap, an operation that generated significant media attention and directly contributed to increased sales. The destroyed unit had been annihilated in 3073 after attempting to break contract with the Word of Blake, and NETC recovered ten of eleven 'Mechs along with the remains of eight MechWarriors from the site.</p><p>While no official factory variants were produced, NETC offered customization services for customers requiring specialized configurations. Common requests included additional lifting equipment, heavier armor, and jump boosters, with options limited only by the customer's budget and the engineering capabilities of the NETC staff. Production continued through the Republic era and beyond, with the New Earth facility coming online after 3090 to supplement the original Terra production line.</p>
