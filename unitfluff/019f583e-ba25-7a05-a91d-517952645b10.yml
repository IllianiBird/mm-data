chassis: "Mechanized Hover Level I (WOBM)"
model: "(LRM)"
overview: |-
  <p>Word of Blake Militia infantry served as the backbone of Protectorate garrison forces across dozens of conquered worlds, providing the manpower for territorial control that the Militia's BattleMech and armor assets could not sustain alone. Mechanized hover Level I formations gave the Word of Blake Militia its fastest ground-mobile infantry, capable of crossing water obstacles and open terrain at speeds that outpaced wheeled or tracked alternatives. Their speed made them effective pursuit forces when Protectorate populations attempted to flee contested areas. Carrying infantry-portable long-range missile systems that extend the platoon's engagement envelope well beyond personal weapon range, these troops provide indirect fire support that can suppress enemy positions from distances where return fire is difficult.</p>
