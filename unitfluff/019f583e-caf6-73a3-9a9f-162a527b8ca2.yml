overview: |-
  <p>The Strider was introduced in 3057 as one of the earliest Inner Sphere OmniMechs to reach the battlefield. Developed by Luthien Armor Works, the design was considered by many critics to be something of a disappointment, primarily due to LAW's decision to base the new OmniMech on the chassis of the venerable Cicada. Proponents of the original design noted that while the Strider sacrificed the Cicada's exceptional speed for improved armor and firepower, this loss meant the 'Mech could not escape without serious support if outmatched by heavier opponents.</p><p>Despite initial criticism, the Strider proved itself a capable platform for the Draconis Combine Mustered Soldiery. By the time of the Word of Blake Jihad, the design had become commonplace among elite Kuritan commands, often serving as a light lance command 'Mech or reconnaissance unit for heavier formations. Irian BattleMechs Unlimited secured a production license by 3067, expanding the Strider's availability to Free Worlds League forces as well.</p>
capabilities: |-
  <p>The Strider is built on an Alshain Type KR240 endo-steel chassis powered by a GM 240 fusion engine, reducing maximum speed to 97 kilometers per hour compared to the Cicada's 129. This trade-off provides seven and a half tons of StarSlab/4 armor with CASE protection, making the Strider considerably more durable than its progenitor. Twelve tons of pod space allow for significant weapons and equipment variety across different configurations.</p><p>A notable limitation stems from LAW's decision to employ standard heat sinks rather than double-capacity models, restricting the thermal efficiency of most configurations. Consequently, nearly every standardized loadout features arm-mounted missile pods supported by lasers or electronic equipment in the torso bays. The Prime configuration exemplifies this approach with twin Artemis-enhanced SRM-6 launchers, a Beagle active probe for reconnaissance duties, and a small laser for emergency defense. The F configuration, nicknamed the "Grand Jenner" by DCMS pilots for its similarity to that famous light 'Mech, combines Streak SRM-4 launchers with medium lasers and jump jets, and is widely considered the most effective standard configuration.</p>
deployment: |-
  <p>Alternate Configuration A transforms the Strider into a dedicated targeting and spotting platform for missile-heavy formations. Twin Narc missile beacon launchers allow the 'Mech to designate targets for allied indirect fire, while a TAG laser designator enables Arrow IV artillery and semi-guided LRM coordination. A Beagle active probe and C3 slave unit complete the electronics suite, sharing targeting data across the network. The single small laser represents the configuration's only true weapon, emphasizing its support role over direct combat capability.</p>
history: |-
  <p>Luthien Armor Works developed the Strider as part of the Draconis Combine's effort to field domestically-produced OmniMechs following the Clan Invasion. Rather than attempt a clean-sheet design, LAW engineers chose to adapt the proven Cicada chassis, accepting reduced speed in exchange for the flexibility inherent to OmniMech technology. The resulting design entered service in 3057, with the DCMS rushing several production runs to front-line units despite mixed initial reviews.</p><p>The Strider's reputation improved steadily as pilots learned to exploit its versatility rather than lamenting its reduced mobility. By the late 3050s, the design had found its niche as a light lance command platform and reconnaissance asset for heavier formations. Several production runs were sold to the Federated Commonwealth during the final months of that nation's existence, with deliveries continuing to both successor states for several years afterward.</p><p>Irian BattleMechs Unlimited began licensed production on Shiro III by 3067, expanding the Strider's reach to Free Worlds League commands. The design saw extensive service during the Jihad on multiple fronts, with some configurations adapted to incorporate captured Clan technology during Operation Bulldog. Post-Jihad production has introduced configurations utilizing advanced C3 networks and Clan-specification missile systems, ensuring the Strider remains relevant to modern combined-arms doctrine.</p>
