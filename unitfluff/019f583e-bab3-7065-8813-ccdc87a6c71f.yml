chassis: "Clan Field Artillery Point"
model: "(Wheeled Arrow IV)"
overview: |-
  <p>Conventional infantry within the Clan touman fills the garrison and screening roles that battle armor and BattleMech forces cannot efficiently sustain across dozens of occupied worlds. Field Artillery Points provide indirect fire support that allows infantry formations to engage targets beyond visual range. Operating from concealed positions behind the front line, these crews deliver area-effect fire that can disrupt enemy formations, destroy fixed positions, and support advancing friendly units without exposing themselves to direct engagement. The Point operates an Arrow IV guided missile artillery system capable of delivering precision indirect fire at extreme range, with homing munitions that can be guided onto targets designated by TAG spotters.</p>
