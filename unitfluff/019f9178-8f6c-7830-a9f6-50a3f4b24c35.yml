chassis: "Mechanized Wheeled Platoon (Generic)"
model: "(Recoilless Heavy 2315+)"
overview: |-
  <p>Mechanized wheeled platoons transport their infantry in wheeled armored personnel carriers optimized for speed on roads and improved surfaces. Wheeled APCs are cheaper to maintain and faster on pavement than tracked alternatives, making these platoons ideal for garrison rapid-response forces, highway patrol, and urban security operations. Their off-road capability is limited compared to tracked vehicles, restricting employment in rough terrain, but on developed worlds with good road networks, wheeled mechanized infantry offer the best balance of speed, protection, and operating cost.</p><p>Carrying heavy recoilless rifles that fire shaped-charge warheads, these platoons field crew-served weapons heavy enough to threaten armored vehicles at ranges beyond what personal arms can achieve. A rare few are equipped with heavier armor than is commonly found, allowing these teams to assault well protected objectives and hold critical positions as long as possible.</p>
