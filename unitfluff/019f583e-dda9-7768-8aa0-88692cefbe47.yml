chassis: "Harvester"
model: "HVR-199M-M AgroMech MOD"
overview: |-
  <p>The Harvester is a light IndustrialMech designed for large-scale agricultural operations across the Inner Sphere. Developed by Iroquois Machinery Limited on the Federated Suns world of Shawnee, the original HVR-99 entered full production in 3049 after engineers utilized Star League-era prototype schematics recovered from the Helm Memory Core. Capable of harvesting crops three times faster than conventional machinery, the design spread rapidly across food-producing worlds throughout the Federated Suns within a decade of its introduction.</p><p>The Harvester line was expanded significantly in the 3120s when Achernar IndustrialMechs and DiNapoli Industries licensed the design, producing the heavier forty-ton HVR-199 series to compete with newer AgroMechs such as the Demeter. The rugged Harvester chassis has since become one of the most widespread AgroMechs in the former Republic of the Sphere and the Federated Suns alike.</p>
capabilities: |-
  <p>The original HVR-99 mounts a Junkers 120 internal combustion engine that propels the thirty-ton AgroMech to a respectable top speed of sixty-four kilometers per hour, though the powerplant is notoriously high-maintenance and prone to breakdown if not serviced every thirty work-hours. A fifteen-ton capacity lift hoist occupies the right arm, enabling the Harvester to handle heavy loads and transfer harvested material to trailing cargo trucks, while a combine mounted in place of the left hand actuator allows the machine to cut and gather crops efficiently. A small half-ton cargo bay in the center torso rounds out its carrying capacity.</p><p>Protected by LaborHeavy/1 industrial armor, the HVR-99 is better armored than many IndustrialMechs of similar tonnage, a feature originally intended to protect it from large fauna on frontier agricultural worlds. The heavier HVR-199 series expands on this foundation with ten additional tons of mass, a more fuel-efficient engine, and significantly heavier armor capable of withstanding hazardous operating conditions. This robust construction proved fortuitous when operators began stripping the outer armor layer from HVR-199 frames to free sufficient weight for mounting military-grade weapons, creating the various MOD configurations that proliferated across the Dark Age battlefield.</p>
deployment: |-
  <p>A further field modification built on the HVR-199M platform, the 199M-M replaces the cargo bay with four vehicular mine dispensers. This conversion transforms the Harvester from a direct-fire combatant into an area denial platform, capable of seeding minefields to slow or channel enemy movement. The modification has been spotted in use among various irregular forces, leveraging the Harvester's agricultural origins to deploy mines across wide areas with a machine originally designed to work open fields.</p>
history: |-
  <p>The Harvester owes its existence to the discovery of the Helm Memory Core in 3028. When the New Avalon Institute of Science decoded the cache, a wealth of Star League-era knowledge became available to civilian industry, including prototype schematics for advanced compact IndustrialMechs. Iroquois Machinery Limited, a small firm on Shawnee specializing in harvesting and threshing equipment, seized on these designs to create the HVR-99. The Minette Farming Concern approved the design enthusiastically, and full production began in 3049. Within ten years, the Harvester could be found on almost every agrarian world in the Federated Suns.</p><p>The design might have remained a purely civilian workhorse had Achernar IndustrialMechs not licensed and expanded it in the late 3120s. Operating from the world of Achernar, the firm produced the heavier HVR-199 to compete with newer AgroMechs like the Demeter from Wunderland Enterprises. DiNapoli Industries on Ankaa soon followed with its own production line, and by the early 3130s the expanded Harvester had become one of the most common AgroMechs in Prefecture IV of the Republic of the Sphere.</p><p>The HPG Blackout of 3132 transformed the Harvester from agricultural tool to instrument of war. As factions scrambled to arm themselves, the HVR-199 chassis proved an ideal candidate for military conversion. Investor Jacob Bannson and Governor Aaron Sandoval fought fiercely for control of the Achernar IndustrialMechs facility, with Sandoval ultimately seizing the plant after the Blackout and using it to produce armed Harvesters for his private forces. Both Bannson's Band of Five and Sandoval's Prince's Men fielded substantial numbers of Harvester MODs, and clashes between these rival formations became a common feature of the fractured political sphere.</p><p>During the Liao Insurgency, the Ijori Dè Guāng resistance movement employed Harvesters and other IndustrialMechs against Republic of the Sphere military forces, further cementing the design's reputation as an accessible platform for irregular warfare. A notable engagement in November 3132 saw Harvester MODs from both the Band of Five and Prince's Men clash at a BelOuros scrapyard on Acamar, though analysts found the results inconclusive in determining which MOD configuration held a tactical advantage. The intelligence gathered from security devices at the site, however, proved valuable to Republic Armed Forces investigators.</p>
