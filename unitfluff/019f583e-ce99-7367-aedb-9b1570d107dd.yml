chassis: "Jabberwocky"
model: "JAW-66D ConstructionMech"
overview: |-
  <p>The Jabberwocky is a fifty-ton fusion-powered IndustrialMech originally developed by Jalastar Aerospace in 2549 as a general military support unit. The original JAW-65A design fell far short of expectations due to engineering limitations and was quickly relegated to menial tasks, with all production models scrapped within a few decades. Over five hundred years later, the devastation wrought by the Jihad created an acute shortage of engineering and support equipment across the Federated Suns. As one of the few manufacturers to emerge from the early fighting relatively unscathed, Jalastar seized the opportunity to revive the Jabberwocky concept.</p><p>In 3070, the company debuted the completely reworked JAW-66B, a versatile engineering IndustrialMech built around a semi-modular design philosophy that allows operators to swap limb and torso equipment packages for different mission profiles. This flexibility, combined with robust construction and a fusion power plant, has made the Jabberwocky one of the most sought-after support machines in the post-Jihad era.</p>
capabilities: |-
  <p>The JAW-66B's design philosophy centers on versatility and durability. Powered by a GM 200 fusion engine, the Jabberwocky achieves a top speed of sixty-four kilometers per hour while a pair of tracks supplements its bipedal locomotion for improved performance on paved surfaces. Three Panpour Special jump jets give the design an unusual degree of maneuverability for a machine of its class, enabling it to navigate the broken terrain of battlefield salvage zones and construction sites alike. Unlike most IndustrialMechs that rely on manual controls, the Jabberwocky utilizes neurohelmets drawn from Jalastar's existing stockpile, giving pilots more intuitive control of the fifty-ton chassis.</p><p>The 'Mech's primary working equipment consists of a StarCorps salvage arm and a JAI spot welder, backed by two JAI lift hoists mounted in the rear torso. Industrial Triple Strength Myomer allows the Jabberwocky to handle loads up to double its own tonnage, a critical advantage for battlefield recovery operations. Environmental sealing and a searchlight extend its operational envelope to hazardous environments including irradiated zones, underwater sites, and vacuum.</p><p>Perhaps the Jabberwocky's most notable feature is its semi-modular construction. Jalastar designed the torso and arm mounting points to accept interchangeable equipment packages, a concept later compared to the Mercury BattleMech's own semi-modular technology. This allows field technicians to reconfigure a single chassis for salvage, demolition, or construction duties with relatively minimal downtime. With components sourced almost entirely from Panpour-based suppliers, maintenance and parts acquisition remain straightforward even in disrupted supply chains.</p>
deployment: |-
  <p>The Construction variant trades the left lift hoist for a single-ton internal cargo bay and mounts a nail and rivet gun in each arm, supplied by one ton of fasteners. This configuration is purpose-built for reconstruction work, allowing a single Jabberwocky to carry building materials internally while performing structural joining and fabrication tasks on site. The combination of the remaining right-side lift hoist and the internal cargo capacity makes this variant largely self-sufficient for many construction operations, reducing the need for additional support equipment.</p>
history: |-
  <p>The Jabberwocky's story spans over five centuries, though for most of that time the design existed only as a footnote in Jalastar Aerospace's corporate history. When the original JAW-65A was introduced in 2549, the Age of War was driving demand for military support machines, but the Jabberwocky's fuel cell powerplant and limited capabilities left it poorly suited for the demanding pace of 'Mech-era warfare. The design was quietly abandoned, and all production units were eventually scrapped.</p><p>The Jabberwocky's resurrection came during one of the Inner Sphere's darkest hours. The Jihad, which erupted in 3067, devastated military and industrial infrastructure across every major nation. The Federated Suns, fighting on multiple fronts, found itself pulling every available armed machine from storage and support roles to plug gaps in the front lines. This wholesale stripping of rear-area assets left engineering and reconstruction units critically underequipped at precisely the moment when fortification and repair work was most desperately needed.</p><p>Jalastar Aerospace, based on the Federated Suns world of Panpour, emerged from the Jihad's early years as one of the few manufacturers with intact production capacity. Recognizing both the opportunity and the need, the company dusted off the old Jabberwocky concept and completely redesigned it, debuting the JAW-66B in 3070. The new design's semi-modular architecture and fusion powerplant proved immediately popular, and demand rapidly exceeded Jalastar's ability to deliver.</p><p>The Jabberwocky faced its greatest test when the Taurian Concordat launched a devastating raid against Panpour in 3076. The attack inflicted heavy damage on Jalastar's facilities, though the Jabberwocky production line itself survived largely intact. With the factory's Javelin BattleMech line as the only other production asset to escape serious damage, Jalastar quickly developed the JAW-67 MilitiaMech variant to help meet the Federated Suns' desperate need for combat-capable machines while generating revenue to fund facility repairs. The militarized Jabberwocky served as an effective, if unorthodox, stopgap during the war's final years.</p><p>Following the Jihad's end, the Jabberwocky's industrial variants have continued to see strong demand across the Federated Suns and beyond, supporting the massive reconstruction effort that has defined the post-war period. The MilitiaMech variant, rendered largely anachronistic by peacetime, has been the subject of Jalastar's ongoing campaign to reclassify it as a Corporate SecurityMech, ensuring continued production of the armed variant in a market no longer driven by wartime necessity.</p>
