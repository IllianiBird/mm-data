chassis: "Foot Squad"
model: "(Medic)"
overview: |-
  <p>Medic squads are small infantry elements carrying standard rifles alongside enhanced medical equipment and triage supplies. These squads provide battlefield casualty care and evacuation support to larger formations, treating wounded soldiers under fire and stabilizing casualties for transport to rear-area medical facilities. Their combat capability is limited by the need to carry medical gear in place of heavier weapons.</p>
