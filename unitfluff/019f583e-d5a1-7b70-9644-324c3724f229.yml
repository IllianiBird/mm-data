chassis: "Kodiak II"
model: "3"
overview: |-
  <p>The Kodiak II is a hundred-ton assault BattleMech developed by the Ghost Bear Dominion, based upon the fourth variant of the original Kodiak. Entering production in 3095 at the Alshain Weapons facility, the Kodiak II was engineered to serve dual roles as both a powerful frontline assault 'Mech and a dedicated command platform. Where the original Kodiak excelled as a close-combat brawler, the Kodiak II reoriented the design toward long-range missile warfare and sophisticated command capabilities, reflecting the evolving needs of the Rasalhague Dominion's military doctrine.</p><p>The enhanced Garret L20 communications system features twelve extra multifunction displays and simultaneous audio and video channels, providing commanding officers with unparalleled battlefield awareness while remaining in the thick of combat. The design quickly became a favored mount for Star Colonels and other senior officers within the Ghost Bear touman, its combination of firepower, survivability, and command functionality proving ideal for leaders who direct Trinary-level and larger formations from the front lines.</p>
capabilities: |-
  <p>The Kodiak II retains the hundred-ton mass and 400-rated extra-light engine of its predecessor, maintaining the same impressive sixty-four kilometer per hour top speed on an Alshain LXL Endo Steel chassis. The design fundamentally reoriented its combat philosophy from close-range brawling to long-range missile engagement. The primary armament consists of paired Type XX "Great Bow" LRM-20 launchers mounted in each arm, supplemented by a Type X "Short Bow" LRM-10 in the left torso, all guided by Artemis IV fire control systems for improved accuracy. A Clan Mk. XVII extended-range PPC in the right torso provides direct-fire long-range support.</p><p>For close-range defense, eight Series 1 extended-range small lasers are distributed across both arms, and all energy weapons feed through an integrated targeting computer for enhanced accuracy. The Kodiak II carries nineteen tons of Forging AD56 standard armor, providing robust protection. However, the RCA Instatrac targeting system has exhibited documented malfunctions when running near capacity, including false-positive missile lock readings and occasional failure-to-fire incidents. Alshain Weapons issued a service bulletin in 3105 to address these deficiencies, though a significant number of Kodiak IIs in the field have not received the update.</p>
deployment: |-
  <p>The most radical departure from the base Kodiak II, this variant focuses on overwhelming mid-to-short-range firepower and especially incorporates Inner Sphere weaponry, an unusual choice for a Dominion design. Each arm mounts a massive MRM-40 launcher with Apollo fire control system, delivering devastating salvos at medium engagement ranges. An LB 20-X autocannon spread between the right and center torso provides close-range lethality with both cluster and slug ammunition options. Like its predecessor, this variant employs the fragile XXL engine, and four tons of MRM ammunition are protected by CASE II in the left torso. The use of Inner Sphere missile technology has been linked to experiments within Omega Galaxy, where hybrid weapons configurations have been observed in an effort to surprise opponents accustomed to standard Clan armaments.</p>
history: |-
  <p>The Kodiak II emerged in 3095 as the Rasalhague Dominion sought to modernize its assault 'Mech roster while preserving the legacy of the original Kodiak. Based specifically on the Kodiak 4 variant's weapons philosophy of combining long-range missile capability with close-range hitting power, the new design shifted the primary emphasis from pure close-combat brawling to long-range engagement and battlefield command. Produced at the Alshain Weapons facility (the same Alshain complex where the original Kodiak had been built for decades) the Kodiak II benefited from established manufacturing infrastructure and deep institutional knowledge of the chassis.</p><p>The design quickly proved its worth in combat. During a border skirmish on Jabuka in 3140, elements of Clan Jade Falcon's Fifty-third Battle Cluster engaged the Second Bear Regulars. The Kodiak II's sophisticated command capabilities proved essential as the engagement devolved into a running battle through rugged terrain surrounding Squaw Bay. When Jade Falcon artillery found its mark and engulfed the command Star, the Kodiak II weathered the bombardment better than its companions. Despite losing two 'Mechs to artillery fire during the approach, the surviving Star reached firing range and drove off the Falcon forces within minutes.</p><p>The Kodiak II 2 appeared in the early thirty-second century, introducing HarJel III self-repair technology and Streak LRM launchers at the cost of the more resilient XL engine. More recently, Kodiak IIs operating with Omega Galaxy have been observed with experimental hybrid loadouts incorporating Inner Sphere MRM launchers and Apollo fire control systems, marking an unusual willingness to adopt non-Clan weapons technology. The Kodiak II continues to serve as the preferred command assault platform of the Rasalhague Dominion, maintaining the proud lineage of the Ghost Bear's iconic totem design while adapting to the demands of a new era of warfare.</p>
