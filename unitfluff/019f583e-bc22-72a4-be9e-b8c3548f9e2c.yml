chassis: "Mechanized Wheeled Platoon (DCMS)"
model: "(LRM 3065+)"
overview: |-
  <p>The Draconis Combine Mustered Soldiery assigns conventional infantry to garrison roles across its military districts, with district regulars often fielding extra platoons to secure worlds that BattleMech forces cannot permanently garrison. Wheeled mechanized infantry ride armored personnel carriers that offer speed on roads and enough protection to survive initial contact. The DCMS assigns these platoons where garrison duty demands both rapid response and the ability to dismount under fire, a combination that foot and motorized troops cannot reliably deliver. Their support troops operate man-portable long-range missile launchers capable of reaching targets well beyond personal weapon range. The ability to engage vehicles and fortified positions from a distance that keeps the crew out of direct fire makes LRM teams among the most valued assets in any infantry formation.</p>
