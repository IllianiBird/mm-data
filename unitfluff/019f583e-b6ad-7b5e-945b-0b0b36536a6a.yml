chassis: "Field Gun Platoon (AFFS)"
model: "(Motorized RAC5 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing rotary autocannon that pour out streams of high-velocity shells, these field gun crews saturate target areas with enough fire to threaten even well-armored vehicles through sheer volume.</p>
