chassis: "Owens"
model: "OW-1F"
overview: |-
  <p>The Owens is intended to be an OmniMech upgrade of the Jenner BattleMech, with the primary role being that of a cavalry 'Mech that can move along enemy lines and designate targets for bombardment with Arrow IV artillery and semi-guided LRM attacks. Following the lessons learned from the proof-of-concept Raptor, the DCMS authorized Luthien Armor Works to produce a full line of OmniMechs.</p><p>In a surprising move, the DCMS broke with tradition and christened this new OmniMech the Owens, after an ancient Terran drinking song long associated with cavalry units. Inner Sphere intelligence agencies were mystified by this radical departure from expected behavior, and great effort was expended only to discover that the name came from an old Terran drinking song. The confusion this caused among enemy analysts was considered an unexpected bonus.</p>
capabilities: |-
  <p>The Owens' primary mission is that of a cavalry 'Mech, screening and reconnaissance. The lessons from the Raptor are reflected in the design. The modular weapon containers were standardized and perfected to allow weapons to operate with all future OmniMech designs. Of special note is the quantity of fixed electronics the Owens carries: a C3 network slave, Beagle active probe, and TAG gear.</p><p>With this array, the Owens can find and fix the enemy with indirect fire from supporting elements while the main body moves against the enemy's flank. The Owens rarely engages and destroys the enemy directly; instead, it uses its targeting and communications systems to assist heavier units in performing that task. The seven tons of available pod space allow commanders to tailor the configuration to specific mission requirements.</p><p>The Owens has a top speed of 129.6 km/h and is protected with seven tons of armor. The 'Mech's unique mix of speed, armor, and electronic warfare equipment make the Owens a valuable asset in urban and dense woods or jungle environments where it can find an enemy unit that is hidden, designate them for an artillery strike, and then leave the area at high speeds.</p>
deployment: |-
  <p>Introduced during the Jihad, Alternate Configuration F marries a light PPC and two ER small lasers to a targeting computer for enhanced accuracy at range. To interfere with Blakist advanced computers and networked combat systems, it carries a Guardian ECM suite, while a single A-Pod provides protection against swarming infantry. This configuration was developed specifically to counter Word of Blake electronic warfare capabilities encountered during the liberation campaigns.</p>
history: |-
  <p>The DCMS deployed the Owens in 3056, and by the outbreak of the Word of Blake Jihad most frontline regiments could boast between a lance and a company of these versatile machines. The design has proven invaluable for coordinating fire support and providing tactical intelligence to command elements in real-time.</p><p>Outside of the Draconis Combine, the Owens also appeared among the ranks of the Com Guards and the reborn Star League Defense Force. During the détente of the Second Star League, most of the other Successor States were able to purchase examples of the design, spreading this capable reconnaissance platform across the Inner Sphere.</p><p>Following a reverse-engineered copy of the Black Hawk designated the Black Hawk-KU, the Owens was the next 'Mech in LAW's OmniMech line. The design focused on classic cavalry roles of screening and reconnaissance rather than direct combat, filling a critical gap in DCMS force structure that had previously relied on aging conventional designs.</p>
