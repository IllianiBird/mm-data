chassis: "Jump Duplus Contubernium (MHAF)"
model: "(MG)"
overview: |-
  <p>Caesar's ongoing program to modernize the Legiones Marianes has extended to conventional infantry formations, with improved equipment and weapons gradually replacing older stockpiles across the Hegemony's auxiliary legions. A duplus contubernium, or double tent-group, fields two squads of ten soldiers. Jump-equipped duplus contubernia provide the Legiones Marianes with mobile infantry capable of seizing elevated positions and conducting rapid flanking maneuvers that exploit terrain inaccessible to foot troops. Support squads operate portable machine guns that deliver sustained automatic fire, providing suppression capability against enemy infantry and light vehicles.</p>
