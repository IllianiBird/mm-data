chassis: "Clint"
model: "CLNT-2-4T"
overview: |-
  <p>The Clint was commissioned in 2607 by the Star League Defense Force from Andoran Industries Limited, a minor BattleMech firm on Bell that secured the contract under the Star League Armaments Act by undercutting competitors with cost-cutting design features. Mass production of the CLNT-2-3T began in 2608, with over 300 units built before the fall of the Star League and the destruction of Andoran's factories during fighting between House Davion and House Liao.</p><p>Designed primarily as an inexpensive reconnaissance unit with the capabilities of a well-armed, low-end medium 'Mech, the Clint fulfilled its intended role admirably despite significant maintenance challenges. The design's non-standard components and shoddy construction made it a technician's nightmare, but its combination of speed, firepower, and an exceptional targeting system ensured its continued service across the Inner Sphere and Periphery for centuries.</p>
capabilities: |-
  <p>The original Clint prototypes mounted a heavier Armstrong Buster-class autocannon, but chassis stress problems during testing forced Andoran to downgrade to the lighter Armstrong J11 autocannon/5. This weapon provides reliable medium-range firepower, complemented by a pair of Martell medium lasers that give the Clint effective close-range punch. The design's limited ammunition supply can force pilots to rely entirely on their lasers during prolonged engagements.</p><p>The Clint's Pitban 240 fusion engine propels the 'Mech to speeds approaching 100 kilometers per hour, while Andoran Model JJII jump jets provide 180 meters of jumping capability, allowing it to keep pace with other reconnaissance elements and maneuver effectively through broken terrain. This mobility, combined with the exceptional Sloane 220 Lockover targeting system, compensates significantly for the design's maintenance difficulties.</p><p>The Clint exemplifies the adage that one's ride was built by the lowest bidder. Its non-standard components require specific replacements that cannot be easily exchanged with other BattleMech types, and parts rarely lasted a year under normal use. The gyroscope became particularly notorious, with replacement units commanding prices literally worth their weight in gold during the Succession Wars. Despite these flaws, engineers who can look past the poor-quality parts generally agree that the overall design is steady and reliable.</p>
deployment: |-
  <p>This variant mounts a pair of AC/2s in place of the single AC/5, providing one of the longest effective ranges available on a chassis of this size. A single medium laser serves as backup armament for close-range engagements. Like the original prototype, the 2-4T lacks jump jets, trading mobility for the weight savings needed to mount the twin autocannons and their ammunition. The configuration's origins remain uncertain, representing either an official factory variant or a widespread field modification that predates the destruction of Andoran's records.</p>
history: |-
  <p>The destruction of Andoran Industries during the First Succession War was comprehensive, eliminating not only the original Clint blueprints but also all records of production numbers and official variants. Houses Davion and Liao took possession of the lion's share of surviving Clints, shipping most to remote locations for garrison duty, though the Capellans maintained several in front-line units. The design proved popular in the Periphery, and Clints could be found throughout the Inner Sphere, though the origins of many machines and whether their differing loadouts represented factory variants or field refits remained unknown.</p><p>During the First Succession War, Davion and Liao forces clashed on Bell, with bombing attacks reducing the planet's cities to rubble. House Liao deployed ten Clints in urban centers where they proved their worth. Liao subsequently sent several to the Marik front, where they participated in battles on Pella and Ingersoll against the Free Worlds League's Protectorate Guard. The Arcturan Guard of House Steiner acquired a Clint during a raid on Alula Australis, using it effectively in urban combat on Alexandria and Ryde.</p><p>An estimated 200 Clints remained in service through the Clan Invasion, mostly with Capellan forces or scattered along the Federated Suns' border regions. The Capellan Confederation introduced the 2-3U upgrade variant, which was subsequently adopted by the Federated Commonwealth after Bell Refit Yards established operations on the ruins of the original Andoran complex. Using all-new tooling painstakingly reverse-engineered by Defiance Industries from captured examples, the design's blueprints eventually reached Defiance's Furillo facility, which began producing new Clints in 3055 following repeated CCAF raids on Bell.</p><p>The FedCom Civil War and Jihad prompted further development, with Defiance releasing the 5U model during the Civil War and the 6S following the fall of Hesperus II to Blakist forces. Word of Blake assistance enabled the Taurian Concordat to establish Clint production at Pinard Protectorates Limited on MacLeod's Land, introducing the 3-3T variant. Production continued into the ilClan era with the 3-4T, a sensible upgrade that shares components with the Cadaver and finally addresses many of the design's troublesome non-standard features.</p>
