chassis: "Mechanized Tracked Platoon (FWLM)"
model: "(Combat Engineers 3035+)"
overview: |-
  <p>Conventional infantry within the FWLM serve as the backbone of provincial defense across a patchwork of semi-autonomous states, each maintaining its own military traditions and equipment preferences. Tracked mechanized platoons sacrifice road speed for all-terrain capability, carrying their infantry across ground that would halt wheeled vehicles. The FWLM assigns these formations to worlds where rough terrain or poor infrastructure demands mobility that wheels cannot provide. Trained as combat engineers, these troops carry specialized equipment for rapid construction of field fortifications, obstacle emplacement, and demolition operations, providing commanders with the ability to reshape terrain to tactical advantage.</p>
