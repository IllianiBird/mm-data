chassis: "Mechanized Hover Platoon (AFFS)"
model: "(Laser 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Mechanized hover platoons ride hovercraft that provide the fastest ground transport available to conventional infantry, capable of crossing water obstacles and covering open terrain at speeds that allow them to screen for heavier formations or exploit gaps in enemy lines. Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these platoons field one of the most effective personal arms available to conventional infantry, though the weapons are significantly more expensive and require soldiers to carry additional power packs.</p>
