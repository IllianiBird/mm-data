chassis: "Centurion"
model: "CN10-J"
overview: |-
  <p>The CN10-B Centurion was developed by Corean Enterprises in 3057 as a heavier, more resilient version of the venerable fifty-ton Centurion. Weighing in at fifty-five tons, the design was created alongside heavier variants of the Hollander and JagerMech to field more durable BattleMechs in the fight against the Clans. The CN10 was constructed almost entirely from surplus CN9-D components, with even the endo steel frame being a modified version of its progenitor's chassis, enabling rapid production while keeping costs low.</p><p>Engineers deliberately designed the CN10 to appear virtually identical to the CN9-D, hoping the resulting confusion would provide a tactical advantage against Clan sensors. Lacking the fragile extralight engine of its lighter cousin and mounting over twenty percent more armor, the CN10-B quickly earned the informal designation of "armor variant." Following the Great Refusal and the reduction of the Clan threat, interest in the CN10 waned, though Corean Enterprises continued sporadic production using surplus shared parts.</p>
capabilities: |-
  <p>The CN10 is in essence a slower but better-armed and more heavily armored evolution of the CN9-D. The additional five tons of mass are devoted primarily to enhanced survivability, with eleven and a half tons of StarGuard III armor providing substantially greater protection than the standard fifty-ton Centurion. A DAV 220 standard fusion engine maintains the same ground speed as the original CN9-A at sixty-four kilometers per hour, trading the CN9-D's superior mobility for the reliability and durability of a standard power plant.</p><p>The primary armament mirrors the CN9-D's proven loadout, with a Mydron Excel LB 10-X autocannon and Luxor 3R LRM-10 enhanced by an Artemis IV fire control system providing effective firepower at multiple range brackets. A Photech 806c medium laser and a rear-facing Sutel Precision Line medium pulse laser complete the weapons array. The medium pulse laser gives the CN10 improved accuracy against flanking threats compared to the CN9-D's standard rear-mounted laser, representing the primary offensive distinction between the two designs.</p>
deployment: |-
  <p>Produced alongside the original CN10-B, this variant trades two tons of armor for four jump jets, granting the heavier Centurion a mobility dimension that the base model lacks. All other specifications remain identical to the CN10-B, retaining the LB 10-X autocannon, Artemis IV-enhanced LRM-10, medium laser, and medium pulse laser. The reduced armor makes this variant somewhat more vulnerable than the "armor variant" from which it derives, but the tactical flexibility provided by jump capability was considered a worthwhile compromise for units operating in difficult terrain or urban environments.</p>
history: |-
  <p>The CN10's trial by fire came in May 3059 during Operations Bird Dog and Bulldog. An ad hoc company of the First FedSuns Armored Cavalry landed on Virentofta as part of the Bird Dog attacks, where their CN10s proved a key factor in survival during a guerrilla campaign against the Smoke Jaguars' 151st Garrison Cluster. The heavier Centurions tested Jaguar defenses, provided intelligence for the main assault force, and raided stockpiles, forcing Clan commanders to spread their forces across a wide front, though the scattered Omega Galaxy warriors fought fiercely when relief troops arrived, marking a costly end to the battle.</p><p>On Port Arthur, the CN10 likewise performed admirably against overwhelming odds. A battalion of the First Davion Guards encountered the Jaguars' entire 168th Garrison Cluster, but a well-orchestrated campaign systematically disrupted supply and communication lines. The fight culminated with a single company holding the starport long enough for reinforcements to land and shatter the 168th, a battle hailed as a textbook action demonstrating the CN10's versatility.</p><p>Following the Great Refusal, interest in the CN10 waned considerably as the Clan threat receded. Corean Enterprises continued sporadic production, typically when surplus shared parts were available. The Omni-Centurion's dominance of New Avalon's production output further marginalized the CN10 line until Corean undertook a long-overdue revamp, sharing components from the CN11-O including its compact gyro and producing the CN10-D as a durable workhorse for second-line forces.</p>
