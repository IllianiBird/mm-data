chassis: "Field Gun Century (MHAF)"
model: "(Motorized LAC2)"
overview: |-
  <p>The Marian military tradition places infantry at the foundation of its legionary system, with conventional soldiers organized into units bearing Latin designations that reflect the Hegemony's deliberate cultivation of Roman imperial identity. Marian field gun centuries tow crew-served weapons on wheeled, tracked, or motorized carriages, providing direct-fire anti-armor capability that supplements the Legiones Marianes' limited BattleMech strength. The century tows a light autocannon, a smaller-caliber weapon that provides long-range harassment fire against armored targets.</p>
