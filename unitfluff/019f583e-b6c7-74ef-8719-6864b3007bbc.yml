chassis: "Field Gun Platoon (AFFS)"
model: "(Tracked RAC5 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing rotary autocannon that pour out streams of high-velocity shells, these field gun crews saturate target areas with enough fire to threaten even well-armored vehicles through sheer volume.</p>
