chassis: "Mechanized Wheeled Platoon (LCAF)"
model: "(Flamer 3058+)"
overview: |-
  <p>The LCAF fields conventional infantry that benefit from the Commonwealth's deep industrial base, equipping even garrison formations with reliable, well-maintained weapons and transport. Mechanized wheeled platoons use wheeled APCs that offer a balance between the speed of hover transport and the protection of tracked vehicles, well-suited to operations on developed road networks. Armed with standard assault rifles and supplemented by man-portable flamers, these platoons can both engage enemy personnel at range and deny terrain or flush defenders from cover with incendiary fire.</p>
