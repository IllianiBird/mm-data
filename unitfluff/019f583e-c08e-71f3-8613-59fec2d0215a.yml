chassis: "Mechanized Hover Platoon (Taurian 3047+)"
model: "(Laser)"
overview: |-
  <p>The Taurian Defense Force assigns conventional infantry to garrison and planetary defense roles across the Concordat, where citizen-soldiers serve out of patriotic duty rather than mere obligation. Mechanized hover platoons are among the fastest ground infantry in the TDF, riding hovercraft that can traverse both land and water at speeds that let them cover the vast distances between Taurian population centers. The Concordat has historically favored hovercraft for its armor forces, and that preference extends to mechanized infantry as well.</p><p>Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these platoons field one of the most effective personal arms available to conventional infantry, though the weapons are significantly more expensive and require soldiers to carry additional power packs.</p>
