chassis: "Mechanized Hover Platoon (AFFS)"
model: "(Gauss 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Mechanized hover platoons ride hovercraft that provide the fastest ground transport available to conventional infantry, capable of crossing water obstacles and covering open terrain at speeds that allow them to screen for heavier formations or exploit gaps in enemy lines. Carrying infantry-scale gauss rifles that use magnetic acceleration to propel projectiles at extreme velocities, these platoons field the longest-ranged and hardest-hitting personal ballistic weapon available to conventional soldiers.</p>
