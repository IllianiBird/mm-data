chassis: "Comitatus JumpShip"
model: "(2995)"
overview: |-
  <p>Designed in the late 30th century by Clan Snow Raven, the Comitatus-class JumpShip originally served as a straightforward if well armed, transport vessel. Over sixty years of service, it underwent a radical transformation from a cargo-hauler into one of the most effective mobile fighter carriers in existence. Despite its utility, the ship is notorious for its cramped living conditions and a lack of adequate space for technical support staff, making long-term maintenance of its fighter complement difficult.</p>
capabilities: |-
  <p>While the original design supported four DropShips, the modern Comitatus has had its capacity reduced to a single DropShip hardpoint to maximize its internal bay space. Its primary strength lies in its massive small-craft complement, which has been increased to 25. The standard deployment includes: two Stars of OmniFighters, providing significant aerospace superiority, one Star of Elementals, and for boarding actions five Assault Shuttles housed in a dedicated small-craft bay.</p>
history: |-
  <p>The transition to a carrier role was born out of necessity. A serious flaw in the ship's hydraulics system forced Clan engineers to remove two of its aft DropShip hardpoints, initially using the vacant space for cargo. In 3035, Jade Falcon pilot Vishnu Folkner proposed converting this space into fighter bays, a move supported by Khan Elias Critchell. The first modified Comitatus entered service in 3036 and proved its lethality in 3038 when the Bright Katama destroyed a Dark Caste vessel near Tokasha. Following this success, the other Clans quickly adopted the configuration. Ironically, while the Jade Falcons pioneered the design, they currently field the fewest and none within the Inner Sphere, while their rivals, the Steel Vipers, use them extensively to defend their occupation zone.</p>
