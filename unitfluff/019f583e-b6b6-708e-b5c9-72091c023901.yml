chassis: "Field Gun Platoon (AFFS)"
model: "(Tracked AC10 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing heavy autocannon capable of threatening medium-weight armored targets, these field gun crews deliver direct fire support that gives infantry formations organic anti-vehicle punch.</p>
