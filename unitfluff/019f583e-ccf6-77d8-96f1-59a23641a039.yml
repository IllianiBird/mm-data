chassis: "Blood Kite"
overview: |-
  <p>The Blood Kite is an eighty-five-ton assault BattleMech developed by Clan Blood Spirit, entering production around 2907 at the York BattleMech Y3 Facility on York. Conceived as a deliberate rejection of expensive technologies in favor of proven, cost-effective systems, the Blood Kite became the signature assault 'Mech of the Blood Spirits, embodying their pragmatic approach to warfare born from limited resources and fierce independence. In an era when rival Clans pursued ever more sophisticated OmniMech designs, the Blood Kite stood as proof of the enduring value of rugged simplicity. The design's emphasis on durability, sustained firepower, and ease of maintenance earned it a central place in the Blood Spirit touman for over a century and a half.</p>
capabilities: |-
  <p>The Blood Kite’s design philosophy prioritizes practical lethality over technological sophistication. A standard 255-rated engine provides a modest top speed of fifty-four kilometers per hour, supplemented by jump jets capable of propelling the eighty-five-ton frame up to ninety meters. Maximum standard armor protection ensures the chassis can absorb sustained punishment, while CASE-protected ammunition bins mitigate the risk of catastrophic magazine detonation. An Endo Steel internal structure is the only weight-saving concession, freeing tonnage for weapons and armor rather than expensive engine or structural upgrades.</p><p>The weapons array reflects Khan Boques’ mandate for sustained firepower. Three Series 7K Extended Range Large Lasers deliver devastating long-range striking power without ammunition dependency, while three Type XV LRM-15 launchers provide heavy indirect fire support with generous ammunition stores sufficient for protracted engagements. At close range, three SEP Class SRM-4 launchers exploit breaches in enemy armor. Twenty-one double heat sinks manage the substantial thermal load, though simultaneous fire from all weapons exceeds the chassis’ dissipation capacity, demanding disciplined fire management.</p><p>The Blood Kite sacrifices speed and advanced electronics for raw durability and firepower volume, making it particularly well-suited to the grinding attritional engagements that characterize Blood Spirit operations, where reliability and staying power outweigh technological elegance.</p>
deployment: |-
  <p>The baseline Blood Kite configuration represents the purest expression of the design's founding principles. Mounting three Extended Range Large Lasers for ammunition-independent striking power, three LRM-15 launchers for heavy indirect fire, and three SRM-4 launchers for exploiting breaches at close range, this configuration balances energy and missile weaponry to maximize combat endurance. Generous ammunition stores for both missile systems allow the baseline Blood Kite to sustain fire well beyond the capacity of most contemporary assault designs, making it the backbone of Blood Spirit assault formations from its introduction through the Civil War era.</p>
history: |-
  <p>The Blood Kite emerged from a decisive moment in Clan Blood Spirit history. When Clan Coyote unveiled the OmniMech in 2854, the Blood Spirits found themselves at a critical disadvantage. With only three undersized Galaxies in their touman, the Clan lacked the military strength to compete in Trials of Possession for the new technology. Khan Ceana Boques recognized that the Blood Spirits could not match the larger Clans in OmniMech acquisition and instead ordered a fundamental rethinking of conventional BattleMech design philosophy.</p><p>The development process spanned several decades as Blood Spirit scientists refined their approach under Boques’ four mandates: low cost, survivability, sustained firepower, and maximum efficiency. The irony was not lost on observers that these seemingly obvious principles had been routinely violated by prior Blood Spirit designs. The Blood Kite finally entered production around 2907 at the York BattleMech Y3 Facility on York and quickly became the most recognizable assault ’Mech in the Blood Spirit touman.</p><p>Throughout the Late Succession Wars and into the Clan Invasion era, the Blood Kite served as a cornerstone of Blood Spirit assault operations in the Clan Homeworlds. The design’s emphasis on durability and sustained firepower proved well-matched to the Spirits’ strategic situation, isolated from most Clan trade networks and frequently embroiled in conflicts with neighboring Clans over limited enclaves and resources. The Blood Kite’s ease of maintenance and reliance on proven components meant the resource-strapped Blood Spirits could keep their assault ’Mechs operational through extended campaigns. The design appeared in every Galaxy and nearly every Cluster within the Blood Spirit touman, evidence of its ubiquity within the Clan.</p><p>The introduction of the Blood Kite 2 around 3066 signaled a shift in Blood Spirit military thinking. Developed as the Spirits forged closer ties with Clan Fire Mandrill, the variant incorporated expensive technologies that Khan Boques had specifically rejected over a century earlier. The new variant saw its combat debut during operations to retake the Blood Spirit enclave on Arcadia, where its powerful ER PPC armament proved devastating. However, the Blood Spirits’ perpetually limited industrial capacity raised serious doubts about whether this expensive design could ever be fielded in significant numbers.</p><p>The fate of the Blood Kite was ultimately tied to that of Clan Blood Spirit itself. As the Wars of Reaving consumed the Clan Homeworlds during the Jihad era, the Blood Spirits’ already precarious position deteriorated catastrophically. The destruction of Clan Blood Spirit brought an end to Blood Kite production at the York facility, leaving surviving machines as increasingly rare relics of a Clan that refused to compromise its independence even in the face of overwhelming odds.</p>
