chassis: "Jump Platoon (AFFS)"
model: "(SRM 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Jump-capable infantry provide the vertical mobility that AFFS commanders prize in urban combat and rough terrain, able to bypass obstacles and seize elevated positions that ground-bound platoons cannot reach. Supplementing their primary arms with shoulder-launched short-range missile systems, these platoons carry enough anti-armor punch to threaten light vehicles and damage exposed BattleMech components at close range.</p>
