chassis: "Spider"
model: "SDR-9M"
overview: |-
  <p>The Spider was developed by Newhart Interstellar Industries in 2650 for the Star League Defense Force's elite Special Operations units, including the Blackhearts. Newhart had designed the chassis before the SLDF even issued its request for proposals, allowing the company to win the contract and begin production immediately. The Spider's combination of exceptional mobility, reliable components, and energy-only weapons made it ideal for extended reconnaissance missions deep behind enemy lines.</p><p>Its distinctive appearance comes from a spiderweb-pattern armor alignment on the front torso, emphasized by bright red fiberglass sealant in the seams between armor plates. While never produced in large numbers, the Spider's rapid manufacturing process kept SLDF special forces well-equipped until the fall of the Star League. Following the destruction of Newhart's New Earth factory in 2776, the design nearly disappeared until Nimakachi Fusion Products Limited resumed production for the Free Worlds League.</p>
capabilities: |-
  <p>The Spider's primary asset is speed, both on the ground and through the air. With a top speed matching the Locust and a jump capacity exceeding both the Wasp and Stinger, the Spider can outmaneuver virtually any BattleMech on flat terrain. The jump jet system was designed not just for standard leaps but for mid-flight course corrections, allowing the pilot to pivot while maintaining their original landing point. Enemy pilots refer to this unpredictable "twitchiness" as a significant challenge for targeting systems.</p><p>The 'Mech mounts two center torso-mounted Aberdovey Mk III medium lasers. While more expensive than common Martell models, these weapons require minimal maintenance and draw directly from the fusion reactor, eliminating ammunition concerns during extended operations. Three and a half tons of Durallex Light armor offers modest protection, though most pilots consider speed their primary defense.</p><p>The fully integrated O/P communications and targeting system transmits both voice communications and sensor readings simultaneously. However, this sophisticated electronics package, combined with the head armor configuration, leaves no room for a proper ejection system, a flaw that persists across most Spider variants.</p>
deployment: |-
  <p>Manufactured at Nimakachi's rebuilt Tematagi facility, this variant replaces pulse lasers with variable speed medium lasers. Nimakachi's marketing emphasizes the increased short-range firepower, though industry observers note the weaponry doubles in mass for no significant range improvement. The continued absence of an ejection system has drawn criticism, particularly given that competing designs offer this basic safety feature.</p>
history: |-
  <p>Newhart Interstellar Industries produced the Spider alongside AeroSpace Fighters and the Hussar BattleMech from their facility on New Earth until Amaris's forces destroyed the factory in 2776. Very few Spiders reached the Successor States when the Star League dissolved, and their numbers dwindled rapidly during the Succession Wars as spare parts became scarce. Offensive operations were launched simply to secure components for these valued reconnaissance 'Mechs.</p><p>The Spider's rarity made certain units notable for possessing them. Wolf's Dragoons reportedly operated an entire lance of Spiders, split among their various regiments, an impressive concentration of such scarce machines. The 2934 Battle of Styk saw Marik Militia units and Warrior House Fujita employ Spiders against Deneb Light Cavalry forces defending Devonshire. Using close-combat assault tactics and their exceptional jumping ability, the Spiders penetrated Davion's outer defenses and enabled Marik forces to hold the city for several hours.</p><p>The Free Worlds League eventually secured the Spider's technical schematics from the Terran Hegemony ruins and struck a deal with Nimakachi Fusion Products Limited. In exchange for exclusive control of the design, Nimakachi began producing Spiders at their Tematagi facility and later expanded to Lapida II. By the late Succession Wars, the Free Worlds League and Draconis Combine possessed the greatest numbers of active Spiders.</p><p>The Clan Invasion's devastating losses prompted Nimakachi to upgrade their Spider designs and develop the heavier Venom. The Word of Blake purchased significant numbers of Spiders beginning in 3058, using them during their conquest of Terra and later equipping their Protectorate Militia. Nimakachi's 3067 redesign finally incorporated an ejection system in the SDR-7K series. Following the Jihad, both Krupp Armament Works on Terra and Nimakachi's rebuilt Tematagi plant have continued Spider production, with variants appearing in service with the Republic of the Sphere, the Draconis Combine's Sword of Light, and even Clan Ghost Bear's second-line Clusters.</p>
