chassis: "Foot Platoon (Taurian)"
model: "(LRM)"
overview: |-
  <p>Every Concordat world maintains infantry formations as the first line of planetary defense, drawn from a population whose fierce independence and hatred of foreign aggression run deep. Foot platoons form the garrison backbone of the TDF's infantry arm, cheap to equip and maintain on worlds where the Concordat's limited resources must stretch across dozens of systems. Since infantry regiments rarely rotate offworld, many battalions train as specialists in local terrain, and anti-BattleMech training is standard for all formations at battalion strength or greater.</p><p>Support troops operate man-portable long-range missile launchers capable of engaging targets at distances well beyond personal weapon range, providing the platoon with indirect fire capability against vehicles and fortified positions.</p>
