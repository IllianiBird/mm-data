chassis: "Jump Platoon (AFFS)"
model: "(MG 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Jump-capable infantry provide the vertical mobility that AFFS commanders prize in urban combat and rough terrain, able to bypass obstacles and seize elevated positions that ground-bound platoons cannot reach. Supplementing their rifles with portable machine guns that provide sustained automatic fire, these platoons anchor defensive positions with suppressive capability that pins attacking infantry and discourages unarmored vehicles from closing.</p>
