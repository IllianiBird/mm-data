chassis: "Foot Platoon (AFFS)"
model: "(Laser Paratrooper 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Foot infantry remain the backbone of AFFS planetary garrisons, cheap enough to deploy in numbers across the Federated Suns' vast territory and reliable enough to hold ground that BattleMech forces cannot permanently occupy. These paratroopers are specialized infantry trained and equipped to deploy via parachute or parafoil from aerospace craft, seizing objectives behind enemy lines with laser weapons that provide reliable firepower without the ammunition resupply constraints of ballistic arms.</p>
