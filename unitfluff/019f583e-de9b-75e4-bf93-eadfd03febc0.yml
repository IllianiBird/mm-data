overview: |-
  <p>The Gargoyle is an eighty-ton Clan assault OmniMech introduced in 2945 by Clan Wolf as a successor to the aging Woodsman. Developed alongside the Timber Wolf and Naga, the Gargoyle was designed to fill a mechanized cavalry role that emphasized speed and flexibility over raw firepower. Its oversized engine makes the Gargoyle one of the fastest assault-class BattleMechs ever produced, capable of matching many medium 'Mechs stride for stride. During the Clan Invasion, Inner Sphere forces designated the design the Man O' War in recognition of its battlefield effectiveness.</p><p>Originally produced at Clan Wolf facilities on Tokasha and Strana Mechty, the Gargoyle proved so successful that production eventually spread to multiple Clans, ensuring the design remains widely available across the Clans well into the ilClan era.</p>
capabilities: |-
  <p>The Gargoyle's defining characteristic is its extraordinary speed for an assault-class chassis. The 400 Model SF-3 XL engine propels the eighty-ton 'Mech to a top speed of eighty-six kilometers per hour, a velocity that shocks Inner Sphere MechWarriors accustomed to ponderous assault machines. This emphasis on mobility comes at a significant cost, however, as the oversized engine restricts usable pod space to just twenty-one and a half tons. While this limits the weight of weaponry any single configuration can carry, Clan weapons technology packs considerable firepower into that modest allocation.</p><p>Built on a Clan Series Assault SXC standard structure, the Gargoyle mounts eleven tons of Forging C629/j ferro-fibrous armor, providing protection roughly equivalent to most heavy 'Mechs rather than true assault-class coverage. Sixteen fixed double heat sinks manage thermal output effectively across most configurations. The design philosophy places weaponry almost exclusively in the arms, reducing reconfiguration time between deployments but creating a vulnerability to targeted strikes. Inner Sphere forces quickly learned that destroying a Gargoyle's arms effectively neutralizes the threat, prompting Clan technicians to develop configurations with weapons distributed more broadly across the chassis.</p><p>In its Primary configuration, the Gargoyle carries a pair of LB 5-X autocannons capable of firing both solid and cluster ammunition, supported by twin SRM-6 launchers and an ER small laser for close defense. This loadout provides flexible engagement options at multiple ranges, though it lacks the concentrated alpha strike capability of heavier assault designs.</p>
deployment: |-
  <p>This custom configuration was designed for a commander of the Thirty-first Wolf Solahma Cluster, optimized for independent operations requiring both direct combat and force coordination capabilities. Twin ER PPCs in the right arm provide long-range firepower, while paired Streak SRM-6 launchers in the left torso handle close engagements. An ECM suite disrupts enemy electronics and targeting systems, and a light TAG unit enables artillery coordination. Anti-personnel pods mounted on each leg provide protection against infantry swarming tactics. This combination of direct firepower, electronic warfare, and artillery spotting capability makes the configuration unusually self-sufficient for a single chassis.</p>
history: |-
  <p>The Gargoyle emerged in 2945 as part of Clan Wolf's ambitious program to replace the first-generation Woodsman OmniMech with more capable successors. The project yielded three distinct designs: the Timber Wolf as a versatile heavy combatant, the Naga as a dedicated fire-support platform, and the Gargoyle as a fast assault cavalry chassis. Of the three, the Gargoyle filled the most unconventional role, trading the firepower expected of an assault 'Mech for the speed to dictate engagements on its own terms.</p><p>As a staple of Clan Wolf for over a century, the Gargoyle became deeply integrated into Wolf doctrine, where its speed complemented the aggressive maneuvering warfare the Clan favored. The design saw widespread deployment during the Clan Invasion, where it earned the Inner Sphere designation Man O' War. Inner Sphere forces were initially unprepared for an eighty-ton 'Mech moving at medium 'Mech speeds, and the Gargoyle's ability to rapidly reposition and exploit gaps in defensive lines proved devastating in the opening campaigns.</p><p>The design spread beyond Clan Wolf over the centuries. Clan Diamond Shark recognized the Gargoyle's commercial potential and established production on Priori, while Clan Ice Hellion and Clan Steel Viper both developed their own manufacturing capabilities on Hector and New Kent respectively. The Wars of Reaving disrupted some of these production lines, but the design's proliferation ensured its survival across multiple Clans.</p><p>Clan Hell's Horses became particularly invested in the Gargoyle after capturing Tamar during the Jihad era. The Horses rebuilt the former Wolf Clan Site OZ-1 as the Tamar HH Industriplex Alpha, establishing their own production of new Gargoyle configurations suited to their combined-arms doctrine. The Horses' cavalry units found the Gargoyle's speed ideal for augmenting their mixed 'Mech and vehicle formations, and they wasted no time developing new configurations that expanded the chassis's tactical repertoire.</p><p>By the ilClan era, the Gargoyle remained a common sight across multiple Clan toumans. Recognition Guide updates introduced a wave of new configurations leveraging modern technologies, ensuring the Gargoyle continued to evolve with changing battlefield requirements, maintaining its relevance nearly two centuries after its introduction.</p>
