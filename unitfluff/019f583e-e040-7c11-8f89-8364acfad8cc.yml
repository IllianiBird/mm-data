chassis: "Orca"
model: "OC-1X"
overview: |-
  <p>The Orca is a 200-ton superheavy BattleMech prototype developed in secret by the Republic of the Sphere on Terra around 3091. Representing the Republic's first attempt to push BattleMech construction beyond established weight limits, the Orca was assembled by hand at a partially restored superheavy manufacturing facility originally used by the Word of Blake. When its existence was finally confirmed through a data dump from Sheratan, the Orca was revealed as likely the largest BattleMech ever constructed. The program was ultimately suspended around 3105, with the design never achieving operational status, though the data it generated proved invaluable for subsequent superheavy development programs.</p>
capabilities: |-
  <p>The Orca's most defining characteristic is its staggering mass. At 200 tons, the design required a conventional reinforced internal structure weighing forty tons, as much as an entire Republic Armed Forces Targe assault 'Mech. Without access to endo steel production, designers were forced to work with standard materials, imposing enormous weight penalties from the outset. A 400-rated extra-light engine provides minimal mobility, moving the Orca at a walking speed of just over thirty-two kilometers per hour. This glacial pace, combined with the overwhelming mass, made the 'Mech exceptionally difficult to control, with even momentary lapses in pilot concentration risking costly damage.</p><p>The Orca carries a diverse arsenal headlined by a Sniper Artillery Cannon, enabling it to function as a mobile artillery platform. Twin extended-range particle projector cannons and an extended-range large laser provide heavy direct-fire capability at range, while a Gauss rifle adds long-range ballistic punch. An LRM-20 launcher and SRM-6 round out the missile armament, with a small X-pulse laser providing point defense. Thirty-six tons of standard armor with CASE II protection offer substantial coverage across the superheavy frame, and nineteen double heat sinks manage the considerable thermal load. Despite this impressive firepower, the design's haphazard construction and severe control difficulties demonstrated that superheavy 'Mech engineering demands far more than simply scaling up existing technology.</p>
deployment: |-
  <p>This variant is the sole configuration of the Orca ever produced, serving as an experimental testbed rather than a combat-ready platform. Built to validate the concept of superheavy BattleMech construction for the Republic Armed Forces, the prototype explored the feasibility of fielding a chassis of unprecedented mass rather than refining a finalized combat design. Despite its failure to achieve operational status, data generated by this variant program proved invaluable, with lessons learned contributing directly to the Republic's later development of the Poseidon, its first production superheavy BattleMech.</p>
history: |-
  <p>The Orca program traces its origins to approximately 3091, when a Republic of the Sphere technical advisor within the Department of Research and Development oversaw the partial restoration of a superheavy 'Mech manufacturing facility on Terra. The facility had been severely damaged during Operation SCOUR in the closing stages of the Jihad. The Word of Blake's Skobel MechWorks had previously produced the 150-ton Omega superheavy 'Mech at this location, but the orbital plant containing the Omega's structural molds was destroyed during the battle for Terra. Without access to those specialized molds, designers were forced to employ conventional materials for the Orca's skeleton, imposing enormous weight penalties that would define the program's limitations. With enough infrastructure restored to permit experimentation, several Orca test chassis were painstakingly assembled by hand using components sourced through an elaborate network of shell companies operating under fictitious product names.</p><p>Security surrounding the program was brutally enforced. At least one civilian who inadvertently documented a live-fire test was detained for five years before release. When reports of the Orca surfaced on 1 April 3103, the convenient timing led most observers to dismiss the claims as an elaborate prank timed to coincide with the historical Day of Fools. More ardent conspiracy theorists proclaimed the design as evidence of Clan Wolverine's return. The Sheratan data dump ultimately confirmed the Orca's existence, but also revealed the program's significant shortcomings and the extraordinary lengths taken to preserve its secrecy.</p><p>The prototype's control systems proved inadequate for managing a chassis of such unprecedented mass, and the haphazard construction methods introduced additional flaws that compounded the inherent challenges of superheavy engineering. All prototypes were ultimately mothballed at classified locations and the project was reportedly suspended around 3105. The program's lead technical advisor subsequently departed Republic space, reportedly settling in a hidden location beyond the Fortress Republic's walls.</p><p>Despite the Orca's failure to achieve operational status, the program generated critical data on superheavy BattleMech construction. These lessons proved instrumental in the Republic's later development of the Poseidon, which successfully addressed many of the Orca's shortcomings through tripodal locomotion, purpose-built structural engineering, and a multi-person cockpit to manage the workload that had overwhelmed the Orca's single pilot.</p>
