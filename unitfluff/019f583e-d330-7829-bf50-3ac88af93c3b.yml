chassis: "Scarecrow"
model: "UCU-F4"
overview: |-
  <p>The Scarecrow is a rare, mixed-technology medium BattleMech introduced in 3099 by Corean Enterprises at their Augusta facility. Designed exclusively for the Armed Forces of the Federated Suns, the Scarecrow was purpose-built for a single grim mission: the eradication of enemy infantry. Combining advanced technology from multiple sources, including Clan-specification weapons manufactured under license, the design is a deliberate and controversial approach to anti-infantry warfare that has drawn both praise from military planners and condemnation from humanitarian organizations. Few Scarecrows are known to exist, and the design has never been observed outside Federated Suns service.</p>
capabilities: |-
  <p>Built on a Corean Model 000 endo-composite chassis and powered by a GM 200 XL engine, the Scarecrow achieves a top speed of 86 kph, supplemented by three Rawlings 80 jump jets providing 90 meters of jump capability. While not fast by medium BattleMech standards, the Scarecrow is more than quick enough to run down any conventional infantry formation. A compact gyroscope frees internal volume for the design's extensive weapons suite and electronic warfare systems.</p><p>The Scarecrow carries an impressive anti-infantry arsenal. Three ExoStar Pinnacle Clan-specification extended-range medium lasers provide accurate fire at range, while two Omicron 950 medium pulse lasers deliver punishing close-range salvos. Eight GM Ultralight Clan light machine guns, paired in two Corean Bulletstorm machine gun arrays, shred unarmored infantry with devastating efficiency. Two Zippo Longtorch extended-range flamers flush entrenched troops from cover, and two Federated Mantrap anti-battle armor pods ensure even armored infantry cannot safely close. Eight tons of StarGuard III armor with CASE II protection provides adequate survivability, while a Chameleon Light Polarization Shield and Bloodhound Active Probe allow the Scarecrow to hunt its prey undetected.</p><p>The Scarecrow's extreme specialization is also its greatest weakness. The design carries no weapons effective against hardened targets, leaving it dangerously vulnerable in any engagement against other BattleMechs or combat vehicles. Its armor, sufficient to shrug off small arms fire, offers little protection against autocannon or PPC fire, and the reliance on an XL engine means that a single unlucky torso hit can end the engagement. Pilots assigned to the Scarecrow must rely entirely on stealth and mobility to avoid enemy heavy assets, and any breakdown in situational awareness can prove fatal.</p>
deployment: |-
  <p>The base UCU-F4 Scarecrow is fielded exclusively by specialized AFFS anti-infantry formations, typically operating in pairs or lances attached to larger combined-arms task forces. These units are deployed to contested worlds where enemy infantry concentrations threaten supply lines, forward bases, or civilian populations. The Scarecrow's stealth systems allow it to operate ahead of friendly lines, identifying and eliminating infantry formations before they can entrench or disperse. Field commanders value the design for its ability to clear urban districts and dense terrain that would otherwise require costly infantry-on-infantry operations, though its complete dependence on friendly units for protection against armored threats limits its independent operational range.</p>
history: |-
  <p>The Scarecrow emerged from a classified Corean Enterprises program in the late thirty-first century, entering production in 3099. Incorporating both Clan and Inner Sphere technology, including Clan-specification weapons manufactured under license by Corean and General Motors, the design pushed the boundaries of what the AFFS was willing to field. The AFFS deliberately kept the design secret, officially denying its existence for over four decades. This secrecy reflected the political sensitivity surrounding a BattleMech designed explicitly to kill infantry, a role that attracted criticism from humanitarian organizations and foreign governments alike.</p><p>The most storied, if unverified, deployment of the Scarecrow took place on McComb over a fifteen-year period. Draconis Combine Mustered Soldiery infantrymen deployed to raid the world propagated the legend of the Dragon of Gorman Heights, a spectral figure of fire and steel said to appear and annihilate entire platoons of foot soldiers. While never officially confirmed, most analysts believe repeated Scarecrow deployments designed to attack DCMS infantry on a psychological scale reinforced this legend.</p><p>When the AFFS finally acknowledged the Scarecrow in the 3140s, humanitarian agencies condemned its deployment, arguing that a BattleMech designed solely to kill infantry crossed ethical boundaries. The AFFS largely dismissed these complaints, with defenders of the program citing the long history of anti-infantry designs stretching back to machines like the Piranha and the Stinger. Reports place Scarecrows along the Periphery March border, suggesting the AFFS intends to use them to dissuade pirate attacks, though the pressures of Capellan and Combine incursions make broader deployment likely only a matter of time.</p>
