chassis: "Field Gun Platoon (AFFS)"
model: "(Motorized UAC10 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing heavy ultra autocannon capable of double-rate fire, these field gun crews deliver punishing direct fire that can overwhelm the armor of medium vehicles and threaten BattleMech limbs.</p>
