chassis: "Shadow Cat"
model: "C"
overview: |-
  <p>The Shadow Cat is a medium-weight Clan OmniMech developed by Clan Nova Cat at the beginning of the thirty-first century as a direct replacement for the Ice Ferret. Designed during preparations for Operation Revival, the Shadow Cat was intended to provide greater firepower and flexibility than its predecessor while maintaining comparable mobility. The design proved so successful that it quickly spread beyond the Nova Cats to become a staple of multiple Clan toumans, seeing adoption by Clans Cloud Cobra, Diamond Shark, Fire Mandrill, Smoke Jaguar, Steel Viper, and Wolf.</p><p>Originally produced by Clan Nova Cat, the Shadow Cat has remained in continuous production for over a century, with multiple manufacturers ensuring a steady supply across both Clan and Inner Sphere markets. The design holds the unusual distinction of being one of few Clan Invasion-era OmniMechs to lack a separate Inner Sphere reporting name.</p>
capabilities: |-
  <p>The Shadow Cat achieves its versatility through aggressive use of weight-saving technologies. A Type 79-45 endo steel internal structure and RFUM 270 XL extralight engine provide the structural foundation, while seven tons of Compound H17 ferro-fibrous armor delivers respectable protection for its mass. These technologies free up seventeen tons of pod space, significantly more than the Ice Ferret it replaced, allowing commanders tremendous flexibility in configuring the design for specific mission profiles.</p><p>Fixed jump jets grant a 180-meter jump capability, providing excellent tactical mobility across varied terrain. The inclusion of myomer accelerator signal circuitry enables burst speeds approaching 130 kilometers per hour, making the Shadow Cat one of the fastest medium OmniMechs in service. This combination of jumping ability and straight-line speed makes the design exceptionally difficult to pin down in combat.</p><p>The Prime configuration epitomizes the Shadow Cat's philosophy of punching above its weight class. An arm-mounted Gauss rifle delivers devastating long-range firepower capable of threatening much heavier opponents, while paired ER medium lasers provide backup at closer ranges. An active probe rounds out the electronics suite, enabling the Prime to serve effectively in a scouting role while retaining significant combat punch.</p>
deployment: |-
  <p>Introduced as a more recent configuration, the Charlie variant leverages the flexibility of advanced tactical missile technology. Paired ATM 6 launchers can engage targets across multiple range brackets using extended-range, standard, or high-explosive munitions, supported by three ER medium lasers for consistent close-range firepower. A Narc missile beacon complements the missile-heavy loadout by designating targets for allied missile platforms, making the Shadow Cat C a valuable force multiplier in combined-arms operations.</p>
history: |-
  <p>The Shadow Cat first tasted combat against Inner Sphere forces during the Battle of Luthien in 3052, where Clan Smoke Jaguar forces deployed the design alongside other frontline Clan 'Mechs. The design subsequently saw action during the Battle of Tukayyid, where its speed and firepower made it a valuable asset in the fast-moving engagements that characterized the campaign. The lack of any captured specimens prior to Tukayyid meant ComStar had no opportunity to assign the 'Mech a separate reporting name, resulting in both sides referring to it by its original Clan designation.</p><p>Following the Great Refusal and the fracturing of the Clan political theater, production of the Shadow Cat in the Homeworlds gradually declined. The design's strong association with the exiled Clan Nova Cat likely contributed to its eventual phase-out from Homeworld production lines during the Wars of Reaving. The Barcella factory on Barcella changed hands multiple times, passing from Clan Nova Cat to Clan Diamond Shark during the Civil War era and later to Clan Coyote during the Jihad, though active production had largely ceased by that point.</p><p>In the Inner Sphere, the design thrived. Clan Nova Cat's Barcella Beta facility on Irece maintained active production through the Jihad and into the early Dark Age, supporting the Clan's integration with the Draconis Combine. Following the Nova Cat Annihilation, the Draconis Combine continued operating the Irece facility at reduced capacity. The Shadow Cat gained a new lease on life when Clan Protectorate Arms on Asellus Australis began production in the late Dark Age era, initially under independent operation before the Free Worlds League reasserted control.</p><p>Clan Sea Fox merchants have distributed Shadow Cats widely, ensuring the design remains common among Clan and Inner Sphere militaries alike. The Shadow Cat's enduring popularity, spanning over a century of continuous service, is a reflection of the fundamental soundness of its design philosophy.</p>
