chassis: "Foot Platoon"
model: "(Light Scout)"
overview: |-
  <p>Light scout platoons carry only auto-pistols, sacrificing firepower for reduced weight and a low profile suited to extended reconnaissance patrols. These formations prioritize observation and reporting over combat engagement, moving quietly through terrain to gather intelligence on enemy positions and movements. Their minimal armament means they avoid contact whenever possible, relying on stealth and evasion rather than firepower.</p>
