chassis: "Dragon II"
model: "DRG-11K"
overview: |-
  <p>The Dragon II emerged from Luthien Armor Works' post-Jihad efforts to revitalize iconic DCMS designs using advanced technology developed during the devastating conflict. After losing substantial production capacity to Word of Blake attacks, LAW sought to prove the company's continued value through ambitious new designs. The result was a comprehensive reimagining of the Dragon concept, transforming the traditional brawler into an artillery support platform.</p><p>Introduced in 3099, the Dragon II represented the DCMS's commitment to technological self-sufficiency under the mandates of Coordinator Urizen II. Every component was manufactured within Combine borders, making it a statement of industrial capability as much as a weapons system. The design found immediate favor among ISF operatives and politically connected officers, who claimed early production runs before regular DCMS units received allocations.</p>
capabilities: |-
  <p>The Dragon II's combat role differs substantially from its predecessors, emphasizing fire support over close assault. The centerpiece of its armament is the Shigunga Arrow IV Artillery System, capable of delivering precision strikes at extreme ranges or providing area suppression with various ammunition types. Three tons of ammunition storage allows flexibility in loadout selection. The Lord's Light 2 Extended-Range PPC inherited from the Grand Dragon provides all-range direct fire capability, while a Diverse Optics Type 25PX Medium X-Pulse Laser offers close defense.</p><p>The shift to artillery support necessitated design compromises in other areas. The Magna 260 engine produces a maximum speed of only 64 kilometers per hour, significantly slower than both the Dragon and Grand Dragon. LAW's engineers compensated through enhanced durability, incorporating a Nykvarn Type 58-66SH Endo Steel chassis and compact gyro. The 12.5 tons of Durallex Guardian II Light Ferro-Fibrous armor provides excellent protection, while CASE II shielding ensures ammunition detonation won't prove immediately catastrophic.</p>
deployment: |-
  <p>The standard Dragon II configuration centers on the Shigunga Arrow IV Artillery System, providing fire support capability unprecedented in the Dragon lineage. The Lord's Light 2 ER PPC inherited from the Grand Dragon ensures direct engagement capability at all ranges, while the Diverse Optics Type 25PX Medium X-Pulse Laser handles close defense. Three tons of Arrow IV ammunition allow loadout flexibility, from standard high-explosive rounds to specialized homing or smoke munitions. The Nykvarn Type 58-66SH Endo Steel chassis and compact gyro maximize internal volume, while CASE II shielding ensures ammunition detonation won't prove immediately catastrophic.</p>
history: |-
  <p>The Dragon II entered DCMS service during a period of significant political and military transformation within the Draconis Combine. The Republic of the Sphere's formation and subsequent Gray Monday crisis reshaped the strategic landscape, creating both opportunities and challenges for Combine expansion. The Dragon II proved well-suited to this new era of warfare, where combined arms operations and long-range precision strikes often determined battle outcomes.</p><p>Early combat deployments demonstrated the Dragon II's effectiveness in coordinated operations. On Palmyra, Dragon IIs of the Seventh New Samarkand Cadre blocked a Davion counterattack outside Sawle, using their Arrow IV systems to break up armored formations while their PPCs engaged survivors. Similar successes on Raman saw Dragon IIs of the Forty-fifth Benjamin Regulars shelling enemy positions across difficult terrain, allowing conventional forces to advance through previously impassable ground.</p><p>The Dragon II's association with political appointees and ISF operatives has colored its reputation within the regular DCMS. Veteran MechWarriors often express skepticism toward pilots assigned these machines, viewing their technological advantages as compensation for inferior skill. Despite this tension, the Dragon II has proven its worth repeatedly, earning grudging respect from critics. The experimental DRG-11R variant, equipped with Clan-grade weapons, remains restricted to nobles and the politically connected.</p>
