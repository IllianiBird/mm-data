chassis: "Arbalest"
overview: |-
  <p>The Arbalest is a 25-ton Clan light BattleMech developed by Clan Nova Cat in 3077 as part of a broader effort to expand their second-line forces during the Word of Blake Jihad. Following the successful Ocelot program, Nova Cat engineers designed the Arbalest with an emphasis on reducing the drain on the Clan's limited supply of advanced technology, allowing production to proceed quickly and inexpensively at the Irece Alpha facility on Irece within the Draconis Combine.</p><p>This minimalist approach allowed the Nova Cats to field the Arbalest in significant numbers, filling a critical gap in their second-line formations at a time when resources were being consumed by the Jihad. The design's emphasis on ease of manufacture and maintenance has ensured its continued production and widespread distribution well beyond the Jihad era.</p>
capabilities: |-
  <p>Quite slow for a light BattleMech, the Arbalest's Vlar 125 engine provides a top speed of only 86 kilometers per hour, making it one of the more ponderous designs in its weight class. The chassis compensates for this lack of speed by concentrating its Clan technology where it matters most: firepower. Two Mk. 46 Type II LRM-10 launchers provide respectable long-range fire support capability, allowing the Arbalest to contribute meaningful indirect fire from behind the main battle line. At shorter ranges, a pair of Series 2a Mk. 5 extended-range medium lasers effectively double the 'Mech's throw weight, giving it a credible close-range punch unusual for a dedicated missile platform.</p><p>The Arbalest's head-mounted ECM suite represents its most tactically significant system, enabling it to disrupt enemy fire control networks, a capability that proved invaluable against Word of Blake C³i-equipped formations. However, this weaponry and electronic warfare capability comes at a steep cost in survivability. With only three and a half tons of standard armor, the Arbalest is acutely vulnerable in prolonged engagements, forcing MechWarriors to adopt hit-and-run tactics that sit poorly with traditional Clan combat doctrine. The design's primary virtue beyond its firepower is its ease of maintenance, making it popular with the technician caste members responsible for keeping second-line formations operational.</p>
deployment: |-
  <p>Introduced in 3077 as part of Clan Nova Cat's initiative to strengthen Omicron Galaxy from a provisional formation to a fully operational second-line Galaxy, the base Arbalest was designed to be quick and inexpensive to produce. Its combination of long-range missile firepower and electronic warfare capability made it well-suited for disrupting enemy command networks while providing fire support from behind the main line of engagement. The design saw widespread adoption across multiple Nova Cat second-line Clusters and has since been sold to mercenary commands and the Republic of the Sphere through Clan Diamond Shark trade agreements.</p>
history: |-
  <p>The Arbalest emerged from Clan Nova Cat's urgent need to bolster their second-line forces during the Word of Blake Jihad. The Nova Cats had committed heavily to the coalition opposing the Word of Blake, and their frontline formations were suffering significant attrition. The decision to develop a new light BattleMech using primarily Inner Sphere components was driven by pragmatism, the Clan's limited supply of advanced technology was better reserved for frontline OmniMechs while second-line formations could be equipped with designs that were cheaper and faster to produce.</p><p>The Arbalest saw its combat debut in early 3077, deployed alongside Pack Hunters and Ha Otokos in Omicron Galaxy as the Nova Cats promoted it from a provisional formation to a fully operational second-line Galaxy. Nova Cat MechWarriors quickly discovered the value of the Arbalest's ECM suite in disrupting the C³ networks employed by Blakist forces, though many of the new 'Mechs were destroyed in the fierce fighting that followed. In late 3077, Arbalests of the Nova Cats' Delta Galaxy engaged Word of Blake forces on Sheratan, where the design demonstrated its effectiveness in neutralizing enemy electronic warfare networks.</p><p>Further combat on Epsilon Eridani in 3078 saw Blakist forces adapt their tactics, deploying fast hovercraft and battle armor specifically to hunt down Arbalests and other ECM-equipped units. The Blakist Protectorate Militia learned from previous encounters and prioritized eliminating the Nova Cats' electronic warfare capability early in engagements, costing the Clan heavier casualties in exchange for eventual victory.</p><p>Clan Diamond Shark recognized the Arbalest's commercial potential and traded much-needed Clan technology to the Nova Cats in exchange for limited production runs. These Diamond Shark-procured Arbalests were subsequently sold to mercenary commands and the Republic of the Sphere, significantly expanding the design's distribution beyond Clan Nova Cat's own forces. The Irece Alpha factory continued production through the post-Jihad era, though the facility was destroyed during the Second Combine-Dominion War and was not reconstructed until 3129. Despite this interruption, the Arbalest remains a common sight in second-line and mercenary formations across the Inner Sphere.</p>
