chassis: "Yinghuochong"
model: "YHC-3Y"
overview: |-
  <p>The Yinghuochong is a thirty-five-ton light BattleMech designed by Hellespont 'Mech Works as a modern successor to the Capellan Confederation's first BattleMech, the Firebee. Entering production in 3137 on Betelgeuse, the design was built on a heavily modified Firebee chassis, tying it directly to the Confederation's earliest martial heritage. The name, translating to "Firefly" in Mandarin, reflects both its speed and the national pride the Capellan people invest in the machine.</p><p>Conceived as a mixed-technology scout killer, the Yinghuochong leverages advanced systems to engage and destroy lighter opponents while providing battlefield reconnaissance support through integrated sensor equipment. Its combination of Clan-sourced weaponry and Inner Sphere engineering makes it a distinctive product of the Confederation's pragmatic approach to military procurement during the Dark Age.</p>
capabilities: |-
  <p>The Yinghuochong is built around a single Type DDS "Kingston" Extended-Range Particle Projection Cannon, a Clan Sea Fox-produced weapon that gives the light 'Mech firepower well above its weight class. An accidental but brilliant cooling jacket design integrated during the weapon's adaptation to the Inner Sphere chassis reduces heat output by seven percent compared to standard models while maintaining full range and damage potential, an engineering anomaly that Hellespont technicians have been unable to deliberately replicate.</p><p>A Hermes 210 XL engine drives the Yinghuochong to a top speed of ninety-seven kilometers per hour, while eight Anderson High Propulsion 12s improved jump jets provide an impressive two hundred forty meters of jump capability. Seven tons of Hellespont Lite light ferro-fibrous armor offer reasonable protection for a machine of its tonnage, though the use of an XL engine and XL gyro means that torso damage can prove catastrophic. A remote sensor dispenser mounted in the head carries thirty sensors for area surveillance, and a TAG unit in the right arm allows the Yinghuochong to designate targets for artillery and guided munitions, rounding out its scout-killer and reconnaissance role.</p>
deployment: |-
  <p>This variant was developed in response to persistent supply difficulties with the Sea Fox-manufactured extended-range particle cannon. Replacing the Clan weapon with a TSEMP cannon, the 3Y trades raw firepower for the ability to disable enemy electronics and shut down opposing 'Mechs entirely. The TSEMP's growing popularity within the CCAF made it a natural choice, and the variant has found favor among Capellan commanders who value its ability to neutralize targets without destroying them, preserving salvageable equipment for Confederation use.</p>
history: |-
  <p>The Yinghuochong emerged from the Hellespont 'Mech Works facility on Betelgeuse, a plant that had been reactivated during the Jihad to produce UrbanMechs and primitive retrotech designs for Capellan garrison forces. As the Confederation secretly expanded its military under Chancellor Daoshen Liao's Hidden Lion initiative, the Betelgeuse facility was retooled and expanded, with the Yinghuochong replacing Firebee production on the line. The new design represented a significant modernization of Hellespont's Betelgeuse operations and a deliberate effort to connect the Confederation's martial past to its resurgent future.</p><p>The design's reliance on imported Sea Fox extended-range particle cannons tied its production tempo to ongoing trade relationships with the Clan merchants. This dependency would prove a persistent vulnerability, eventually prompting the development of an alternative configuration to mitigate supply disruptions.</p><p>The Yinghuochong saw its baptism of fire during the Capellan Confederation's invasion of the Federated Suns' Capellan March in 3144. Mixed units of Yinghuochongs and Agroteras served as screening forces during the assault on Cumberland, where CCAF forces pushed through the hostile Sarasota Flats badlands against Davion defenders. The extreme temperatures and electromagnetic interference of the Flats proved advantageous to the mobile Capellan light 'Mechs, which used hit-and-run tactics to disable heavier Davion assets over four days of running engagements.</p><p>Yinghuochongs also participated in the invasion of New Syrtis, where a pair was dispatched as a hunter-killer unit to locate and disrupt a Davion mobile headquarters six hundred kilometers behind the front lines. After five days of infiltration through enemy territory, the Capellan machines engaged pursuing Davion 'Mechs and exploited their range advantage to damage their pursuers before escaping. The disruption of command and control operations contributed to Capellan success at the Battle of Brandon's Crossroads.</p>
