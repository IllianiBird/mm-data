chassis: "Marco"
model: "MR-8C ExplorerMech"
overview: |-
  <p>The Marco holds the distinction of being the first purpose-built ExplorerMech, developed by StarCorps Industries on Menke in the Capellan Confederation. Entering production in 2712 after a long and troubled development program, the thirty-ton IndustrialMech was conceived as a customizable frame mating civilian exploration needs with military-grade technology. Despite sound engineering, the design proved a commercial disappointment, with the specialized exploration market far too small to sustain production costs. StarCorps discontinued production in 2720 after just eight years on the line. A small number accompanied General Kerensky on the Exodus, where they found an unexpected second life as the basis for armed field refits among the Pentagon Powers.</p>
capabilities: |-
  <p>The Marco's design philosophy prioritized versatility and environmental resilience over combat capability. Built on a StarCorps HD-5 industrial chassis powered by a GM 120 Fusion engine, the design achieves a respectable top speed of sixty-four kilometers per hour for its weight class. The final MR-8C production model added three HildCo L5 jump jets providing ninety meters of jump capability, significantly enhancing the 'Mech's ability to traverse broken terrain during exploration missions. Environmental sealing across all locations allows operations in hazardous atmospheres, vacuum, and underwater environments.</p><p>The Marco's standard equipment package includes a StarCorps salvage system in the right arm for specimen collection and light recovery work, a searchlight for low-visibility operations, and a single Harmon small laser mounted in the left arm as a minimal self-defense weapon. A collapsible two-man cabin on the rear torso provides shelter when the 'Mech is stationary, while a small observation platform spans the shoulders. Four tons of ArcShield CHIL heavy industrial armor offer adequate protection against environmental hazards and wildlife, though the Marco remains extremely vulnerable in any genuine combat situation. The Astar 5 communications system handles expedition coordination, while the design especially lacks any dedicated targeting and tracking system, an understandable omission for a machine never intended to fight.</p>
deployment: |-
  <p>The MR-8C was the final and most capable production variant, entering the line in 2719, just a year before production ceased entirely. This model replaced the heavy communications suite of earlier versions with three HildCo L5 jump jets providing ninety meters of jump capability, dramatically improving terrain-crossing ability for deep wilderness exploration. A two-and-a-half-ton cargo bay in the right torso provided storage for specimens and supplies. Despite being the most technically refined Marco, the MR-8C was produced in the smallest numbers due to its late introduction and the line's imminent closure. It was this variant that accompanied Kerensky's Exodus fleet, where it would later serve as the basis for Pentagon Powers combat refits.</p>
history: |-
  <p>The Marco's history is inextricably tied to StarCorps Industries' ambitious but ultimately misguided ExplorerMech program. Beginning in 2666 on Menke, the program consumed decades of development effort and produced a series of spectacular failures before yielding a functional design. The Amundsen prototypes of 2666 were agile but structurally unsound, collapsing after minimal field use. The DaGama-series irradiated test pilots through inadequately shielded cockpit systems. The Burton suffered chronic gyroscopic instability, and the Cook was dismissed as comically ungainly. Only the intervention of wealthy investors with connections to StarCorps' board kept the program alive long enough to reach the successful "M" designation.</p><p>When the Marco finally entered production in 2712, StarCorps discovered that the market for dedicated ExplorerMechs was essentially nonexistent. Previously, explorers had simply retrofitted surplus BattleMechs, and few saw reason to purchase a specialized (and weaponless) platform at comparable cost. StarCorps managed to sell two full production runs of predominantly MR-6 and MR-7 series machines to the Star League Defense Force in what contemporary accounts describe as a questionable procurement deal. These SLDF-specification models featured integrated satellite uplinks, remote-controlled floodlights, and modular tool-mounts not found on civilian models. Production ceased entirely in 2720, just eight years after the line opened.</p><p>The Marco found an unexpected second chapter following the Exodus. General Kerensky's fleet carried a number of Marcos into the Pentagon Cluster, where they served their intended exploration role during the initial colonization period. After Kerensky's death and the fragmentation of the colonies into the Pentagon Powers, the desperate need for combat-capable machines led to the Marco's conversion into makeshift fighting vehicles. The most common armed refit, designated MR-8D, and the less prevalent MR-8E appeared around 2801 as Pentagon factions stripped the exploration equipment and installed weapons systems. These refits saw action during the conflicts that preceded Nicholas Kerensky's Operation Klondike.</p><p>Back in the Inner Sphere, the Marco faded into near-total obscurity. By 3070, only a handful of operational examples were known to exist, all of the earlier MR-6 and MR-7 series. The later MR-8C production model (the only version equipped with jump jets) appears to have been produced in the smallest numbers and is considered effectively extinct in the Inner Sphere. The Clan-held refits likely did not survive the consolidation wars that followed Operation Klondike in significant numbers, though scattered reports suggest at least a few remained operational in Clan space as late as 3050.</p>
