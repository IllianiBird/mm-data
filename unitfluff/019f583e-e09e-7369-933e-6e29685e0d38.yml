chassis: "Super-Griffin"
model: "GRF-2N-X"
overview: |-
  <p>The GRF-2N-X Super Griffin represents the pinnacle (and the limits) of early Succession Wars experimental engineering. Developed in 3020 as part of a New Avalon Institute of Science initiative at the Friden Aerospace Park on Hoff, the Super Griffin was a custom sixty-ton chassis deliberately designed to resemble the lighter production Griffin in order to confuse battlefield observers. The project was paired with a companion Super Wasp effort, and together they represented the Federated Suns' first fully redesigned BattleMechs in four decades. The Super Griffin served as a testbed for two revolutionary prototype technologies: experimental double heat sinks using volatile liquid-metal coolants, and prototype improved jump jets offering unprecedented mobility. Only a single prototype was constructed before its destruction in combat in 3022, making the Super Griffin one of the rarest and most significant experimental designs of the early Succession Wars period</p>
capabilities: |-
  <p>The Super Griffin's designers packed ambitious experimental technology into a deceptively familiar package. The chassis mounted a standard PPC in the right arm and an LRM-10 launcher with two tons of ammunition in the right torso, retaining the classic Griffin weapons profile, while adding a medium laser on the left arm and a small laser in the center torso for close-range defense that the standard Griffin lacked. Ten tons of Starshield A armor provided meaningful protection for a design of its weight class.</p> <p>The experimental systems defined the Super Griffin's tactical profile. Prototype improved jump jets granted extraordinary mobility, allowing leaps far beyond what conventional jump-capable 'Mechs could achieve. The experimental freezer double heat sinks used volatile liquid-metal coolants to achieve double the heat dissipation of standard models, though their dangerous composition gave them a notoriously short operational lifespan. The engine was downgraded to a 240-rated Pitban to accommodate these prototype systems, reducing ground speed to sixty-four kilometers per hour, a significant trade-off that made the design reliant on its jump capability for tactical positioning. The prototype jump jets generated extreme heat and were prone to violent explosions when damaged, a critical vulnerability that would ultimately prove fatal for the sole prototype in its first and only combat engagement.</p>
deployment: |-
  <p>The sole prototype of this variant Super Griffin was constructed in 3020 at the Friden Aerospace Park on Hoff as part of a paired project with the Super Wasp. The sixty-ton chassis was deliberately designed to resemble the lighter production Griffin to confuse battlefield observers, with the additional mass devoted to experimental systems and close-range weapons. The prototype mounted a PPC and LRM-10 in the traditional Griffin configuration, supplemented by a medium laser on the left arm and small laser in the center torso. Experimental freezer double heat sinks using volatile liquid-metal coolants provided enhanced thermal management, while prototype improved jump jets offered unprecedented mobility. Deployed on 13 May 3022 during a Draconis Combine attack on Hoff, the Super Griffin was destroyed in its first and only engagement when return fire struck a prototype jump jet, triggering an explosion that ignited the LRM ammunition and completely destroyed the machine. Research into freezer heat sinks continued, but improved jump jet development was cancelled, with nearly fifty years passing before production-grade improved jump jets appeared.</p>
history: |-
  <p>The Super Griffin project began in 3020 at the Friden Aerospace Park research facility on Hoff, part of the Federated Suns' broader effort to reverse the technological decline of the Succession Wars. Working alongside the companion Super Wasp project, NAIS researchers sought to integrate two breakthrough technologies into a proven combat chassis. The experimental freezer double heat sinks offered dramatically improved thermal management through volatile liquid-metal coolant systems, while prototype improved jump jets promised to restore a degree of battlefield mobility not seen since the fall of the Star League.</p></p><p><p>The sole Super Griffin prototype was pressed into combat on 13 May 3022 when the Black Widow Company attacked Hoff. Deployed alongside two Super Wasps, the Super Griffin exploited its exceptional jump range to land behind a Rifleman, striking from an unexpected angle. However, return fire from both the Rifleman and a Phoenix Hawk struck the right torso, hitting one of the volatile prototype jump jets. The resulting uncontrolled ignition triggered a chain reaction that detonated the LRM ammunition stores, and the Super Griffin was completely destroyed in the ensuing explosion.</p></p><p><p>The destruction of the sole prototype had divergent consequences for its two experimental technologies. Research into the freezer double heat sink concept continued, eventually contributing to the broader recovery of double heat sink technology across the Inner Sphere. The prototype improved jump jet program, however, was canceled outright. Nearly fifty years would pass before production-grade improved jump jets appeared, and when they did, the technology originated not from Inner Sphere research but from Clan Wolf-in-Exile. The Super Griffin's brief and violent career thus stands as both proof of early Succession Wars ingenuity and a cautionary example of the risks inherent in fielding unproven prototype systems in combat.</p>
