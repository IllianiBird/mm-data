chassis: "Poseidon"
model: "PSD-V2"
overview: |-
  <p>The Poseidon is a 125-ton superheavy tripod BattleMech developed in secret by the Republic of the Sphere as part of the classified Rhodes Project. Produced exclusively at Rhodes Foundry on Devil's Rock, the PSD-V2 entered limited production around 3136 as the Republic's first viable superheavy design. Rather than following the conventional bipedal or quadrupedal configurations that had frustrated previous superheavy efforts, the Poseidon adopted a revolutionary tripod layout that distributes its enormous mass across three legs, earning the informal designation "Colossal" from observers awed by its sheer scale. The design served as the foundation for the subsequent Ares superheavy OmniMech program.</p>
capabilities: |-
  <p>Built around a Rhodes-P Endo Steel frame and powered by a PlasmaStar 375 XL engine, the Poseidon propels its massive bulk to a respectable 54 km/h. The tripod configuration distributes the immense tonnage more efficiently than biped or quadruped alternatives, providing superior stability and the ability to change direction without sacrificing speed. Twenty-four tons of Maximillian 320 armor with CASE II protection in both side torsos gives the design exceptional survivability, though the extra-light engine remains a critical vulnerability if torso armor is breached. The three-man cockpit, splitting responsibilities between a dedicated pilot, gunner, and technician, allows the Poseidon to function as a command platform capable of engaging multiple targets simultaneously, though it demands a larger trained crew complement than any other BattleMech in the Republic's arsenal.</p><p>The Poseidon's armament covers all engagement ranges with a mixed-technology loadout. A pair of Clan-specification Hyperion Titan Bolt extended-range PPCs anchors the long-range arsenal, supplemented by twin LongFire Light LRM-5 launchers. At intermediate distances, a Skobel Drotnik MRM-20 launcher guided by an Apollo fire control system delivers devastating cluster fire, while a Brontios Tight-Stream TSEMP cannon can disable enemy electronics entirely. Close-range defense falls to paired Hyperion Lance ER medium lasers, three Hyperion Ray ER small lasers, and three Harvester 2K SRM-2 launchers, with six Titan's Tread A-Pods providing anti-infantry coverage across all three legs. While the breadth of weaponry provides flexibility, the sheer number of disparate systems creates a significant logistical burden, and the relatively modest long-range punch for a 125-ton machine means the Poseidon relies more on sustained presence than devastating alpha strikes.</p>
deployment: |-
  <p>No factory variants of the Poseidon have been produced beyond this variant production model. The V2 designation reflects the extensive refinements made following the prototype phase, and all operational Poseidons are PSD-V2 models assigned exclusively to the Republic Armed Forces' most trusted formations. The design sees service primarily in defensive roles within the Fortress Republic, where its combination of firepower, command capability, and sheer intimidation value makes it a cornerstone of prepared defensive positions.</p>
history: |-
  <p>The origins of the Poseidon trace back to humanity's long and largely unsuccessful history of attempting to build viable BattleMechs exceeding 100 tons. From the Star League era through the catastrophic failure of Stefan Amaris's Matar, the so-called "100-ton barrier" proved a stubborn engineering challenge. It was not until the closing years of the Jihad that viable superheavy technology emerged from Word of Blake research, but the devastation inflicted on Terra and the taint of Blakist origins led to a moratorium on further development for decades.</p><p>The Republic of the Sphere quietly resumed superheavy research in the early thirty-first century, first producing the Orca, a lumbering biped derived from captured Blakist Omega project data. The Orca was deemed a failure and mothballed after producing only a handful of prototypes, but the engineering lessons it yielded proved invaluable. When Gray Monday shattered the HPG network in 3132 and the Fortress Republic walls rose to seal off the Republic's core worlds, the secret Rhodes Project shifted into high gear, channeling everything learned from the Orca into a revolutionary tripod configuration.</p><p>Two PSD-X1 prototypes first saw combat in 3135 when rebel senatorial forces attempted to seize the Serbian proving grounds on Terra where the machines were being tested. Operating under a communications blackout with faulty targeting systems and incomplete cockpit integration, the prototypes nonetheless drove off the rebels through sheer intimidation and overwhelming firepower. The engagement was subsequently classified under orders from the Exarch, but performance data from the action directly shaped the refinements incorporated into the production PSD-V2 model, most particularly the shift from a single-pilot cockpit to the three-man crew configuration.</p><p>By 3145, all Poseidon and Ares-class superheavy tripods were being deployed exclusively by the Republic Armed Forces' most reliable commands, assigned primarily to defensive roles within the Fortress Republic. The Poseidon served as the foundation upon which the more advanced Ares OmniMech superheavy tripod was developed, cementing its legacy as the design that finally broke the 100-ton barrier in a practical and sustainable way. Some Poseidons saw combat during the Battle of Terra in 3151 as part of Operation Four Horsemen, representing the Republic's last stand against Clan Wolf's forces.</p>
