chassis: "Field Gun Platoon (AFFS)"
model: "(Tracked LAC5 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing light autocannon that balance range and hitting power at reduced weight, these field gun crews provide mobile direct fire support from positions that heavier weapons cannot reach.</p>
