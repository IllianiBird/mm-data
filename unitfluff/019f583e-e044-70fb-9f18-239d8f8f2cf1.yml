chassis: "Prefect"
model: "PRF-1C"
overview: |-
  <p>The Prefect is a 75-ton Republic of the Sphere BattleMech commissioned by Exarch Devlin Stone in the aftermath of the Jihad. With the Republic's military-industrial complex devastated by Operation SCOUR and corporate lawsuits threatening to further disrupt military production, Stone sought a design that would simultaneously create jobs and strengthen his armed forces. Irian BattleMechs Unlimited secured the production contract through undisclosed negotiations, taking the GLT-5M Guillotine chassis as a starting point and modifying it into a purpose-built guerrilla warfare platform. Production began in 3083 on Irian.</p><p>Stone mandated a simple, ammunition-independent design optimized for long-term solo deployments behind enemy lines. While considered underarmed for its tonnage class, the Prefect's exceptional speed for a heavy 'Mech and all-energy weapons loadout made it nearly unmatched as a heavy striker and guerrilla unit.</p>
capabilities: |-
  <p>The Prefect is built on a Crucis-III Deluxe Endo Steel chassis powered by a PlasmaStar 375 Light engine, granting a top speed of 86 kilometers per hour. This is exceptional for a 75-ton design and central to its guerrilla mission profile. Durallex ferro-fibrous armor provides solid protection, while an XL gyro saves weight at the cost of increased vulnerability to torso hits.</p><p>The all-energy armament eliminates ammunition dependency, a deliberate choice suited to long-duration independent operations. A Lord's Light 3 Heavy Particle Projector Cannon serves as the primary weapon, delivering devastating damage at medium to long range. A Lord's Light 5 Snub-Nose PPC provides additional punch at closer engagement distances, while twin Diverse Optics Extended Range Medium Lasers round out the loadout. While critics note the design is underarmed for its weight class, the combination of speed, energy independence, and respectable armor protection makes the Prefect highly effective in the extended independent operations it was designed to conduct.</p>
deployment: |-
  <p>Entering service in 3133, this field refit was born from desperation as the Republic Armed Forces scrambled to bolster their eroding defensive front following the HPG collapse. An inventive technician among Stone's Liberators developed the conversion, replacing the Heavy PPC with an ER PPC and adding an Angel ECM Suite and Emergency C3 Master system. RAF Command seized upon the design and ordered hundreds of field refit kits produced and distributed across numerous commands. The Angel ECM provides critical protection against the boosted C3 networks that neighboring states had spent decades integrating, while the Emergency C3 Master offers targeting telemetry sharing that has proven decisive in several engagements. The disruption of refit kit supply from Terra following the rise of Levin's Wall limited further distribution, though enough conversions reached the field to demonstrate their considerable tactical value.</p>
history: |-
  <p>The Prefect's origins trace to late 3082, when Exarch Devlin Stone's information network revealed that multiple corporations were preparing lawsuits against entities involved in the Jihad's military campaigns. When Krupp Armaments filed suit against Stone and the Republic of the Sphere in 3084 for lost profits stemming from the destruction of their Budapest facility during the Terran invasion, the pressure on the fledgling Republic's military procurement intensified considerably. Stone commissioned the Prefect both to strengthen his forces and to generate economic activity across the Republic's battered industrial base.</p><p>Irian BattleMechs Unlimited on Irian, hosting the largest military manufacturing center within the Republic outside of Terra, secured the production contract. Stone directed significant investment into Holly Industries, a StarCorps subsidiary in Kuala Lumpur, and brokered deals with multiple suppliers including Independence Weaponry on Quentin for armor specifications and Luthien Armor Works for PPC design data. The XL gyro deal with Krupp Armaments was an attempted olive branch that ultimately failed when the lawsuits proceeded regardless, a personal betrayal that poisoned relations between the Republic and Krupp for years afterward.</p><p>Production began in 3083, with initial deployments going to the Republic's Triarii Protectors. Distribution remained limited during the early Republic period, and the discrepancy between production numbers and Triarii deployment figures fueled persistent speculation about diversion to Exarch Stone's covert operations forces. The Republic allegedly took the Irian production line offline during the 3090s, though considerable evidence suggests manufacturing secretly continued throughout the Late Republic era.</p><p>The collapse of the HPG network in 3132 and the subsequent fracturing of the Republic dramatically altered the Prefect's strategic role. RAF Command rushed every available asset to its crumbling defensive lines, and the PRF-1C field refit program converted existing Prefects into C3-capable force multipliers to counter the boosted networks proliferating among neighboring states. The rise of Levin's Wall eventually cut off the flow of refit kits from Terra, though enough PRF-1C conversions reached the field to prove their worth in several decisive engagements.</p><p>By the Dark Age, the Irian factory operated independently before eventually returning to Free Worlds League control, ensuring continued production of the Prefect and its variants well into the ilClan era. The design's simplicity and energy independence have kept it relevant across multiple conflicts, fulfilling Stone's original vision of a durable, self-sufficient heavy striker.</p>
