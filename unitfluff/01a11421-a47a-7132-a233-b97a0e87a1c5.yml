chassis: "Raxx Platoon (Generic)"
model: "(Riot Police 2400+)"
overview: |-
  <p>The Odessan raxx is a massive six-legged reptile native to the Lyran world of Odessa, rivaling a Terran elephant in size. Despite their imposing bulk, raxx are remarkably docile and highly intelligent, traits that made them ideal pack animals and riding beasts. Their most extraordinary quality is endurance: a raxx can survive without food or water for up to two weeks, making them invaluable on worlds with scarce resources or harsh conditions. These qualities led to their export across countless Inner Sphere worlds, where they serve as mounts, draft animals, and military beasts of burden. Raxx-mounted infantry benefit from their animals' durability and calm temperament under fire, though the creatures become fiercely aggressive when defending their young. Military formations mounted on raxx can operate far from supply lines for extended periods, a significant advantage on the frontier worlds where they are most commonly employed.</p><p>Configured for civil disturbance management rather than conventional military combat, these riot control troops are trained in crowd suppression, population control, and non-lethal enforcement operations on garrison worlds during periods of unrest or political transition.</p>
