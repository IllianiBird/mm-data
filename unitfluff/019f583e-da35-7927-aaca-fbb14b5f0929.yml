chassis: "Mastodon"
model: "B"
overview: |-
  <p>The Mastodon is a 95-ton Clan assault OmniMech introduced in 3148 by Jotunn BattleWorx for the Rasalhague Dominion. Its creation was a direct response to the devastating Clan Hell's Horses invasion during Operation Noyan in 3147, which exposed critical vulnerabilities in the Dominion's traditionally speed-focused combat doctrine. Where the Rasalhague Dominion and its Clan Ghost Bear forebears had long favored swift, agile attackers, the Mastodon represented a deliberate and surprising doctrinal shift toward resilient heavy assault platforms capable of anchoring defensive formations and spearheading offensive operations. The design filled a gap that the Dominion's existing touman could not address, providing a durable anchor for formations that had previously relied on mobility alone for survival.</p>
capabilities: |-
  <p>The Mastodon is built around a heavily reinforced internal structure, a technology rarely seen in Clan designs and one that makes the chassis extraordinarily resistant to catastrophic damage. While this choice renders the OmniMech notoriously difficult to maintain and repair, the trade-off provides a level of structural resilience that frequently surprises opponents unfamiliar with the design. Mastodon MechWarriors have become adept at exploiting this durability, deliberately exaggerating battle damage to lure overconfident enemies into overcommitting against a still-functional war machine. The pronounced sensor arrays mounted on the chassis, which earned the design its name due to their resemblance to tusks, provide enhanced long-range targeting capability.</p><p>A RUFM XL 285 fusion engine propels the Mastodon at a modest 54 kilometers per hour, sufficient for its intended role as a front-line combatant rather than a flanking or pursuit platform. Fifteen and a half tons of IceSheet ferro-fibrous armor provide exceptional protection while saving enough weight to allow a generous 45 tons of pod space for mission-specific loadouts. Nineteen double heat sinks ensure the design runs cool even under sustained fire, while CASE II-protected ammunition bins across multiple configurations guard against catastrophic internal explosions.</p>
deployment: |-
  <p>Alternate Configuration B transforms the Mastodon into a close-range brawler, built around a left-arm LB 20-X autocannon capable of delivering either concentrated slugs or devastating cluster munitions. Paired Streak SRM-4 launchers and four medium pulse lasers in the right arm provide additional short-range firepower, while a right-torso Streak LRM-20 offers the ability to soften targets during the approach. Three tons of CASE II-protected autocannon ammunition and supplementary missile stores sustain the design through prolonged engagements. This configuration proved particularly effective during urban operations, where its short-range firepower could be brought to bear quickly.</p>
history: |-
  <p>The Mastodon's genesis lies in the traumatic events of 3147, when Clan Hell's Horses Clusters spilled across the Dominion border during Operation Noyan. The continued effectiveness of the Horses' Mongol doctrine formations demonstrated that the Dominion's reliance on mobile, agile formations was insufficient against determined assault-weight opposition. The Dominion Council's response was swift, issuing specifications for a powerful, resilient OmniMech that could anchor defensive lines and lead counteroffensives.</p><p>Jötunn BattleWorx, a relatively new manufacturer on Goito, outbid more established competitors for the contract. Drawing heavily on their experience with the Grizzly rebuild program and the Rime Otter, Jötunn engineers reused and scaled up proven subsystems to accelerate development. The first Mastodons walked off the Goito production lines in 3148, entering service with Dominion frontline formations almost immediately.</p><p>The design received its baptism of fire during operations on Lambrecht, where Omega Galaxy's Fifth Bear Guards deployed a Star of Mastodons against defending Draconis Combine militia and mercenary forces. During an engagement outside Middle Park, an earthquake disrupted the assault, and a coordinated artillery barrage caught the Guards off-balance. The Mastodon Star weathered the bombardment and held firm, their reinforced structures absorbing punishment that would have crippled lighter designs. The Star's overwhelming return fire broke the militia's morale, ultimately enabling the total destruction of the defending forces and the retreat of their mercenary allies from the system.</p><p>Subsequent combat on Dyev during the Second Combine-Dominion War demonstrated the Mastodon's versatility in less favorable circumstances. Deployed in the D configuration alongside Narc-equipped Rime Otters, a pair of Mastodons used coordinated missile fire to devastating effect against planetary militia forces near Trogport. However, the engagement also drew controversy when the Mastodons continued firing after the militia retreated into urban areas, destroying infrastructure and civilian structures. This event deepened tensions between the Dominion's Freeminder faction and their more traditional brethren, recalling Omega Galaxy's earlier distasteful actions during the conflict.</p><p>Despite these controversies, the Mastodon has firmly established itself within Dominion military doctrine. Its presence in frontline Galaxies continues to grow as production at Goito ramps up, and the design's performance has validated the Dominion Council's decision to invest in heavier, more resilient assault platforms. The availability of multiple configurations ensures the Mastodon remains adaptable to evolving battlefield requirements across the Dominion's various theaters of operation.</p>
