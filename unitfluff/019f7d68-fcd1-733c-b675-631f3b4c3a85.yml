chassis: "Mechanized Wheeled Platoon (Generic)"
model: "(Flamer 2200+)"
overview: |-
  <p>Mechanized wheeled platoons transport their infantry in wheeled armored personnel carriers optimized for speed on roads and improved surfaces. Wheeled APCs are cheaper to maintain and faster on pavement than tracked alternatives, making these platoons ideal for garrison rapid-response forces, highway patrol, and urban security operations. Their off-road capability is limited compared to tracked vehicles, restricting employment in rough terrain, but on developed worlds with good road networks, wheeled mechanized infantry offer the best balance of speed, protection, and operating cost.</p><p>Flamer sections carry man-portable incendiary weapons that are devastating in close quarters and against fortified positions, though the short range and hazardous fuel supply make flamer duty one of the most dangerous assignments in the platoon.</p>
