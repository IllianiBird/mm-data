chassis: "Wasp LAM Mk I"
model: "WSP-100b"
overview: |-
  <p>The Wasp LAM Mark I was developed by Harvard Company, Inc. beginning in the late twenty-seventh century as a Land-Air 'Mech variant of the successful Wasp reconnaissance platform. While Harvard collaborated with LexaTech Industries on standard LAM conversion technology, chief designer Katherine Piscalla pursued a more ambitious vision: a hybrid aerospace fighter-bomber capable of delivering ordnance that no conventional light fighter could carry. The WSP-100 entered service around 2690, becoming one of the three primary LAM designs fielded by the Star League Defense Force.</p><p>Unlike its Stinger LAM counterpart, the Wasp LAM Mark I sacrificed some speed and jump capability in BattleMech mode to accommodate a five-ton bomb bay that could carry weapons up to and including Arrow IV artillery missiles. This unique capability made it invaluable for precision strike missions where conventional aerospace assets could not operate.</p>
capabilities: |-
  <p>Harvard Company's approach to the Wasp LAM differed significantly from standard conversion philosophy. By reducing the size of the original Wasp's engine and eliminating ammunition-dependent weapons, engineers created space for an internal bomb bay unprecedented in a design of this weight class. The thirty-ton airframe could deliver ordnance loads that would severely compromise the performance of conventional light fighters, giving SLDF commanders a unique tactical asset.</p><p>In BattleMech mode, the Wasp LAM Mark I proves slower than its parent design, with a maximum speed of 86 kilometers per hour and jump capability reduced to 120 meters. The standard armament consists of a single medium laser and a rear-mounted one-shot SRM-2 for self-defense. However, the true utility of the design lies in its aerospace and AirMech modes, where it can rapidly insert into contested areas, deliver its payload, and extract before heavier defensive assets can respond.</p><p>Like its older sibling the Stinger LAM, the Wasp LAM suffers from the same "jack of all trades" weaknesses. As the Wasp LAM offered a performance profile little different from the Stinger LAM, many questioned the wisdom of producing a second light LAM, especially as it meant maintaining two fragile platforms.</p>
deployment: |-
  <p>Developed for SLDF special operations units known as the "Blackhearts," this variant replaced the medium laser and bomb bay with an additional jump jet, medium pulse laser, Streak SRM-2, and Guardian ECM suite. Slightly more armor than the standard model enhanced survivability during covert operations. This variant optimized the Wasp LAM for infiltration and reconnaissance missions where the bomb bay's strike capability was less valuable than electronic warfare systems and improved mobility.</p>
history: |-
  <p>The Wasp LAM's first operational deployment occurred around 2690 when SLDF special operations forces used the new design to destroy a nuclear weapons facility hidden in the Terran Oort Cloud. This mission demonstrated the unique capabilities Harvard Company had engineered into the platform, validating years of development work. Full-scale production began at Harvard's facilities on Epsilon Eridani.</p><p>Throughout the Star League era, the Wasp LAM was distributed in large numbers alongside Stinger and Phoenix Hawk LAMs to SLDF formations, with the greatest concentration serving in the Terran Hegemony's Royal Divisions. Standard deployment doctrine called for homogeneous Wasp LAM companies transported by pairs of Leopard-class DropShips, allowing rapid insertion into combat zones across varied terrain. Star League ground troops bestowed upon LAM pilots the highest honor available: calling them "angels on our shoulders" for their close support capabilities.</p><p>Unlike the Stinger LAM, production of the Wasp LAM ended during the First Succession War when the lone factory on Epsilon Eridani was obliterated. The 'Mech grew increasingly scarce as the only source of spare Wasp LAM parts became another Wasp LAM. By the thirty-first century, operational Wasp LAMs had become exceptionally rare, with the last confirmed combat-worthy examples lost during the chaos following the Clan Invasion.</p>
