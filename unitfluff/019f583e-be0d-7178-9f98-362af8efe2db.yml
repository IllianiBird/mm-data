chassis: "Field Artillery Century (MHAF)"
model: "(Motorized Thumper 3049+)"
overview: |-
  <p>Infantry within the Legiones Marianes form the backbone of planetary garrison and territorial defense, freeing the Hegemony's limited BattleMech assets for offensive operations and prestige assignments. Marian field artillery centuries operate indirect fire weapons that deliver area bombardment at ranges measured in kilometers, providing the Legiones Marianes with fire support capability independent of their scarce aerospace assets. The century operates a Thumper artillery piece, the lightest class of field artillery, capable of delivering area-effect rounds at ranges measured in kilometers.</p>
