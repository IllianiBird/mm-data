chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled RAC5 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing rotary autocannon that pour out streams of high-velocity shells, these field gun crews saturate target areas with enough fire to threaten even well-armored vehicles through sheer volume.</p>
