chassis: "Mechanized Hover Platoon (AFFS)"
model: "(Laser Heavy 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Mechanized hover platoons ride hovercraft that provide the fastest ground transport available to conventional infantry, capable of crossing water obstacles and covering open terrain at speeds that allow them to screen for heavier formations or exploit gaps in enemy lines. Equipped with a mix of standard and heavy laser rifles, these platoons deliver concentrated energy fire at ranges that outmatch most ballistic infantry, with the heavier weapons providing additional penetration against hardened targets.</p>
