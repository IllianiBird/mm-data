chassis: "Star Crusader"
model: "Prime"
overview: |-
  <p>The Star Crusader is an 80-ton Clan assault OmniMech developed by the Scorpion Empire, representing the culmination of Blakist engineering ambitions realized by entirely different hands. Scorpion engineers discovered a cache of Word of Blake technology containing plans for a proposed Grand Crusader OmniMech that the Blakists had never completed before the Jihad. Modified and rebuilt using exclusively Clan technology, the Star Crusader entered production at Imperial BattleMechs on Antwerp in approximately 3146 as the Empire's first new OmniMech since the Hanseatic Crusade. Its adoption alongside the Nexus-derived Star Python demonstrates the Scorpion Empire's pragmatic willingness to exploit any available resource against existential threats.</p>
capabilities: |-
  <p>While the Star Crusader retains the distinctive external appearance of its Inner Sphere progenitor, its technological foundation is entirely Clan-manufactured. Built on an Imperial 4a Endo Steel chassis and powered by an Antwerp 320 XL engine, the Star Crusader achieves a respectable 64 kilometers per hour, matching the speed of the later Grand Crusader II variants rather than the sluggish original. The cavernous torso bays that once housed the Grand Crusader's slide-up missile launchers now serve as expansive pod space, providing an impressive 42.5 tons of reconfigurable capacity that gives the design tremendous tactical flexibility.</p><p>Forging SE09B Ferro-Fibrous armor provides robust protection, while CASE II technology safeguards against catastrophic ammunition detonation. The Scorpion engineers deliberately selected durable, proven components rather than cutting-edge experimental technology, prioritizing supply chain compatibility over marginal performance gains. The CGS-Comm-4 communications system and CGS-TTS-VIIa targeting and tracking system provide reliable sensor performance. In its Primary configuration, the Star Crusader mounts twin extended-range large lasers augmented by an advanced targeting computer alongside twin Streak LRM-20 racks, giving it devastating and accurate long-range firepower supplemented by an anti-missile system for defensive protection.</p>
deployment: |-
  <p>The Primary configuration of the Star Crusader emphasizes accurate long-range firepower. Twin extended-range large lasers are paired with an advanced targeting computer that dramatically improves hit probability, while twin Streak LRM-20 racks provide devastating missile barrages that only fire when a solid lock is achieved, conserving ammunition. Two extended-range medium lasers offer backup weaponry at shorter ranges, and an anti-missile system provides active defense against incoming missiles. CASE II protects the ammunition bays. Jump jets allow this configuration to exploit terrain for advantageous firing positions, making the Primary configuration a formidable ranged combatant.</p>
history: |-
  <p>The origins of the Star Crusader are steeped in intrigue. The Word of Blake invested significant resources during the 3060s into developing an OmniMech variant of the Grand Crusader, research that was ultimately abandoned in favor of the Celestial series as the Jihad consumed Blakist attention and resources. How complete schematics for this never-produced design ended up in a supply cache on Braunschweig, deep in Hanseatic League territory, remains a matter of speculation. Some intelligence analysts theorize that fleeing Blakist loyalists carried the plans as they scattered after their faction's defeat, while others suggest the cache predated the Jihad entirely, perhaps established as a contingency by forward-thinking Blakist operatives.</p><p>Clan Goliath Scorpion, having absorbed remnants of the Hanseatic League during the Hanseatic Crusade, discovered these schematics when they conquered Braunschweig. Their engineers recognized the potential immediately, adapting the incomplete Blakist OmniMech plans into a fully functional Clan design. Production began at Imperial BattleMechs on Antwerp, a facility that had previously served the Hanseatic League before falling under Scorpion Empire control. The Star Crusader's first confirmed combat action came against rogue Hanseatic Defense Force holdouts who had established a base on a habitable moon in the Visby system in 3146. A patrol from Tau Galaxy's Seventy-First Scorpion Uhlans Cluster detected the insurgents and deployed Star Crusaders at the center of their battle line, where the OmniMechs absorbed enemy fire while advancing under their own covering weapons. The holdouts were swiftly overwhelmed.</p><p>The existence of the Star Crusader initially raised concerns in the Inner Sphere, where intelligence services feared that the design's obvious Blakist lineage might signal a resurgence of Word of Blake influence. These fears were eventually allayed when the Scorpion Empire's non-Blakist origins for the design were confirmed, though the 'Mech's distinctive silhouette continues to provoke unease among those who remember the Jihad. Very few Grand Crusaders survive in the Inner Sphere, and the appearance of their ClanTech descendant on distant battlefields serves as an unsettling reminder that the Word of Blake's technological legacy persists in unexpected places.</p>
