chassis: "Field Gun Platoon (ComStar)"
model: "(Tracked AC5)"
overview: |-
  <p>ComStar organized its military forces around a combined-arms doctrine that valued infantry as an essential element of the Level I through Level VI command structure, with conventional platoons serving alongside BattleMechs, armor, and aerospace assets at every echelon. Crewing medium-caliber field autocannon, these gunners provide direct fire support with enough hitting power to threaten light armor while remaining mobile enough to reposition as the tactical situation evolves.</p>
