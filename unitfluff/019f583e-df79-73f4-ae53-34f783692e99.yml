chassis: "Pendragon"
model: "PDG-1X MUSE RED"
overview: |-
  <p>The Pendragon is a ninety-five-ton assault BattleMech developed by General Motors at their New Valencia facility for the Armed Forces of the Federated Suns. Conceived in 3072 under the Operation MUSE RED program, the design was loosely inspired by the successful Templar OmniMech and sought to fill the role of a dedicated long-range fire support platform. Following a protracted development cycle, the production Pendragon entered limited service in the early 3080s.</p><p>The Pendragon fills a specialized niche as a stand-off bombardment 'Mech, capable of engaging targets at extreme ranges that most opponents cannot match. Production has been exclusive to General Motors, serving the Federated Suns' military forces.</p>
capabilities: |-
  <p>The Pendragon is designed as an extended-range hitter, built to operate behind the main battle line and strike targets at distances most 'Mechs cannot reach. The production PDG-1R mounts a pair of Holly EX Extended LRM-15 launchers in its arms, providing devastating long-range indirect fire capability enhanced by the 'Mech's head-mounted C³ slave unit, which allows it to share targeting data with lancemates for pinpoint accuracy at extreme distances. A Johnston High Speed Extended Range PPC with an attached PPC Capacitor provides direct-fire punch at long range, while three Bright-Bloom Extended Range Medium Lasers offer adequate protection against enemies that close to shorter distances.</p><p>The design's composite internal structure saves weight but leaves the Pendragon vulnerable to penetrating hits, making close combat inadvisable. The lack of lower arm actuators further limits its melee options. StarGuard CIV armor with CASE II protection in both arms provides solid overall coverage and ammunition safety, while the GM 380 XL engine delivers a respectable top speed of sixty-four kilometers per hour, fast enough to maintain distance from most heavy and assault 'Mechs.</p><p>The Pendragon's extreme missile range and C³ integration allow it to influence battles well before enemy units can effectively return fire, though pilots must carefully manage their limited ammunition supply of twelve reloads per launcher.</p>
deployment: |-
  <p>The original MUSE RED prototype represented the cutting edge of Federated Suns weapons development when the first six units were constructed by 3078. Utilizing Clan-grade ferro-fibrous armor, Clan double heat sinks, and prototype Holly Extended LRM-20 launchers alongside a 285-rated XL engine, the design pushed the boundaries of mixed-technology integration. A trio of Clan-specification Extended Range medium lasers custom-manufactured by the Department of Military Communications and Research supplemented the Johnston High Speed Extended Range PPC and PPC Capacitor. Despite promising performance in extended demonstration trials, the prototypes suffered from persistent electrical and mechanical subsystem glitches, and at least three of the original six units were damaged or destroyed in accidents, including one lost to a catastrophic CASE II failure.</p>
history: |-
  <p>The Pendragon's origins trace to 3072, when the Armed Forces of the Federated Suns initiated Operation MUSE RED at General Motors' New Valencia plant. The program aimed to leverage both Inner Sphere and Clan technologies to produce a next-generation fire support assault 'Mech, drawing inspiration from the Templar OmniMech's proven design philosophy. Progress was slow from the outset. The Jihad-era destruction of much of the Federated Suns' military and civilian industrial infrastructure created severe supply shortages, and the AFFS prioritized restoring existing production lines over funding new experimental programs.</p><p>By 3078, six MUSE RED prototypes had been completed, but testing revealed significant problems. The chassis proved more fragile than expected under sustained fire, leading to the addition of heavier armor protection and improved ammunition safeguards. Despite these improvements, persistent software glitches in the targeting and tracking systems plagued all prototypes, and mechanical failures claimed at least three of the initial batch. A second group of four additional prototypes was authorized, but the design remained far from operational readiness.</p><p>The transition from prototype to production required further compromises. Recognizing that dependence on Clan-sourced components was untenable for sustained production, the design team replaced Clan armor, heat sinks, and energy weapons with Inner Sphere equivalents. The heavy missile launchers were downgraded to lighter models, and a larger engine was fitted to compensate for the weight changes. The production PDG-1R finally entered limited service in the early 3080s, with the first units deployed to the Davion Guards.</p><p>Production has continued at a modest pace through the Dark Age, with the PDG-3R variant appearing around 3134 as an evolution of the design toward direct-fire support roles. The Pendragon remains an exclusively Federated Suns design, produced solely at General Motors' New Valencia facility.</p>
