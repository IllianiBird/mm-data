chassis: "Phoenix Hawk"
model: "PXH-1T"
overview: |-
  <p>Terre Noire's answer to the "Hammer Hawk," the PXH-1T is known as the "Sword Hawk" for its signature melee weapon. Particularly, it uses Star League-era endo steel internal structure, one of the few technological edges left in the UniStar Ascendency's arsenal. It retains the original Phoenix Hawk's mobility while trading the trademark large laser rifle for additional forearm-mounted medium lasers and a centerline SRM system.</p>
capabilities: |-
  <p>Retains the full speed and agility of the original Phoenix Hawk, making it effective in running engagements and flanking maneuvers. The medium lasers and SRM rack favor close-range brawling over the original's stand-off style. Pilots should use mobility to close distance quickly, deliver a sword strike, and disengage before the enemy can respond. The endo steel frame keeps weight in check despite the added melee weapon.</p>
