chassis: "Grand Dragon"
model: "DRG-1G"
overview: |-
  <p>The Grand Dragon emerged from Luthien Armor Works' efforts to modernize the venerable Dragon chassis using newly recovered Star League technology. What began as a simple field modification replacing the autocannon with a particle projection cannon evolved into a full production model by 3040. Over the following fifteen years, LAW systematically converted Dragon production lines at Luthien, Dieron, Saffel, and Yorii to Grand Dragon manufacture, completely phasing out the original by 3055.</p><p>The Grand Dragon represented the Combine's technological renaissance following the recovery of the Helm Memory Core. The design incorporated an extralight engine, double heat sinks, and extended-range energy weapons while maintaining the Dragon's characteristic speed and versatility. Production continued until the Word of Blake's devastating 3068 attacks on LAW facilities, though rapid establishment of new factories on Nykvarn, Abiy Adi, and Savinsville ensured the Grand Dragon's continued service.</p>
capabilities: |-
  <p>The Grand Dragon's combat effectiveness stems from its successful integration of advanced technology without sacrificing the original Dragon's core strengths. The Hermes 360 XL engine pushes the sixty-ton chassis to a maximum speed of 97 kilometers per hour, making it one of the faster heavy 'Mechs in DCMS service. This mobility combines with the Lord's Light 2 Extended-Range PPC to create a highly effective skirmisher capable of dictating engagement ranges. The Telos DecaCluster LRM-10 provides supplementary firepower, while three Victory 23R medium lasers handle close defense.</p><p>Thirteen double heat sinks manage the thermal load efficiently, allowing sustained fire with the primary weapons. CASE-protected ammunition storage demonstrates LAW's attention to survivability. Most significantly, the Nykvarn facility's engineering team developed an enhanced hip and torso assembly that increased torso rotation from 250 degrees to nearly 300 degrees, substantially improving the 'Mech's ability to engage targets across wider firing arcs. This modification became standard on all Grand Dragons produced after the Jihad.</p>
deployment: |-
  <p>The original Grand Dragon configuration emerged from field modifications during the late Third Succession War, replacing the standard Dragon's autocannon with a particle projection cannon. Two additional heat sinks manage the PPC's thermal output, while a third medium laser augments close-range firepower. Though lacking the advanced technology of later variants, the 1G established the Grand Dragon's core identity as a mobile PPC platform. Production began in 3024, and the design proved popular enough that LAW formalized it for mass manufacture in 3040. While superseded by more advanced variants, the 1G remains in service with garrison units.</p>
history: |-
  <p>The Grand Dragon's development traces back to the waning years of the Fourth Succession War, when DCMS commanders began experimenting with field modifications to their Dragon 'Mechs. The most successful of these swapped the autocannon for a particle projection cannon, creating what would become the DRG-1G configuration. Initial reception proved enthusiastic enough that LAW formalized the design for production in 3040.</p><p>Acceptance within the DCMS came rapidly as the Grand Dragon reached line units throughout the 3040s and 3050s. The 'Mech's effective combination of speed, firepower, and heat management made it popular with MechWarriors who appreciated its versatility. Nearly every DCMS line unit eventually fielded a company of Dragons or Grand Dragons. The Grand Dragon also saw extensive use during the Clan Invasion, where its mobility proved valuable against technologically superior Clan opponents.</p><p>The Jihad brought severe disruption when Word of Blake forces struck LAW's primary facilities between 3068 and 3070. LAW's resilience proved equal to the challenge, as the company established new manufacturing capacity within two years. The Nykvarn facility earned the honor of restarting Grand Dragon production, followed by rebuilt facilities on Abiy Adi and Savinsville. Post-Jihad variants continued the chassis's evolution, incorporating C3 networks, improved missiles, and eventually Clan-grade technology.</p>
