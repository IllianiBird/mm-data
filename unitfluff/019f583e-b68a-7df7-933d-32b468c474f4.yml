chassis: "Field Artillery Platoon (AFFS)"
model: "(Motorized Sniper 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing Sniper artillery pieces, these platoons deliver medium indirect fire that can breach field fortifications and scatter infantry concentrations at ranges measured in kilometers.</p>
