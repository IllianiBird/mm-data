chassis: "Field Gun Platoon (AFFS)"
model: "(Tracked LBX2 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing LB-X autocannon that can fire cluster munitions to spread damage across a wider area, these field gun crews provide flexible direct fire that adapts to both concentrated and dispersed targets.</p>
