chassis: "Field Gun demi-I (ComGuards)"
model: "(Motorized Gauss)"
overview: |-
  <p>Under the reforms of Precentor Martial Anastasius Focht, Com Guard infantry train extensively in combined-arms cooperation, conducting regular exercises alongside heavier elements to ensure seamless coordination across all branches when battle demands it. Operating infantry-scale gauss rifles that use magnetic acceleration to propel projectiles at extreme velocities, these field gun crews deliver the longest-ranged and hardest-hitting direct fire available to conventional infantry formations.</p>
