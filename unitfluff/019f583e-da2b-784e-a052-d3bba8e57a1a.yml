overview: |-
  <p>The Warhawk, designated Masakari by Inner Sphere forces after a Japanese battle-axe of medieval Terra, is an 85-ton Clan assault OmniMech introduced by Clan Smoke Jaguar in 2999. Developed at the Phan Industriplex on Huntress, the design was conceived as part of the Jaguars' military buildup in anticipation of the long-awaited return to the Inner Sphere. When the Dragoon Compromise temporarily shelved invasion plans, the Smoke Jaguars instead turned the Warhawk against their Warden rivals, demonstrating its devastating firepower in inter-Clan conflicts. The design achieved its greatest notoriety during the Clan Invasion, where it became a symbol of Jaguar frontline power and was frequently deployed alongside the Dire Wolf in devastating assault formations. Production remained a jealously guarded Jaguar monopoly until the Clan's annihilation, after which manufacturing knowledge spread to the Fire Mandrills, Diamond Sharks, and Goliath Scorpions.</p>
capabilities: |-
  <p>The Warhawk is built around a General Systems 340 XL engine providing a top speed of 64 km/h, adequate for an assault platform but unremarkable for its weight class. The chassis mounts thirteen and a half tons of Forging X85 ferro-fibrous armor, providing substantial protection while freeing weight for the design's impressive thirty-two and a half tons of pod space. Twenty fixed double heat sinks represent an over-engineered cooling system that enables the Warhawk to mount energy-heavy configurations without crippling heat buildup. The design lacks jump jets entirely, committing fully to the direct-fire assault role.</p><p>A distinctive feature of the Warhawk is the incorporation of an advanced Targeting Computer into virtually every configuration, granting exceptional accuracy to its direct-fire weapons. This combination of targeting precision and generous pod space makes the ER PPC the signature weapon across many loadouts. Space constraints imposed by the targeting computer and cooling infrastructure mean that large-bore autocannons are infrequently mounted, as the complex routing of ammunition feeds proves impractical within the remaining volume. Where the Warhawk excels is in delivering accurate direct-energy barrages that leave enemy 'Mechs crippled but salvageable, a quality prized by Clan warriors who value the spoils of combat.</p>
deployment: |-
  <p>Alternate Configuration F takes a measured approach to the Warhawk's persistent heat challenges by building around a balanced mix of energy and missile weapons. Each arm mounts a single ER PPC, providing the signature long-range accuracy, while an LRM-20 and LRM-10 deliver substantial missile volleys at range. A torso-mounted Ultra AC/2 adds sustained suppressive fire. This combination allows the pilot to maintain continuous pressure on targets at long range without the severe heat spikes associated with massed PPC fire, making the F configuration well-suited for prolonged engagements and defensive operations.</p>
history: |-
  <p>The Warhawk's history is inextricably linked to Clan Smoke Jaguar. Created in 2999 as the Jaguars prepared for the anticipated return to the Inner Sphere, the design was one of the most powerful OmniMechs of its era. The Dragoon Compromise of 3000 delayed those plans, and the Jaguars instead deployed their new weapon against Warden Clans to devastating effect. All examples of the Warhawk outside Jaguar toumans during this period were exclusively battlefield salvage, as the Jaguars maintained absolute control over the Phan Industriplex production line on Huntress.</p><p>The Warhawk truly came into its own during the Clan Invasion of 3049, where DCMS warriors of the Draconis Combine bestowed the codename Masakari upon the fearsome assault 'Mech. Deployed extensively along the Jaguar Invasion Corridor and frequently paired with the Dire Wolf, the Warhawk became the iconic symbol of Smoke Jaguar military dominance. Though other Clans such as the Ghost Bears and Jade Falcons fielded captured examples, the Jaguars' production monopoly held firm throughout the Invasion era.</p><p>The annihilation of Clan Smoke Jaguar during Operation Serpent and the Great Refusal fundamentally altered the Warhawk's production arena. Inner Sphere forces made a cursory effort to raze the Phan Industriplex during the assault on Huntress, but enough of the complex survived that Clan Fire Mandrill's Kindraa Kline, which had maintained a separate production facility on Dagda, seized control and rebuilt one Warhawk production line. The Fire Mandrills subsequently traded the design to the Diamond Sharks, who established their own production at Manufacturing Plant DSF-94 on Vinton. The Goliath Scorpions also acquired production capability during this period.</p><p>The Jihad severed contact between the Inner Sphere Clans and the Homeworlds, cutting off any possibility of resupply. Warhawks among the Jade Falcons, Ghost Bears, and Wolves-in-Exile became increasingly rare, their numbers reduced by attrition as patchwork repairs and mismatched components became the norm for surviving examples. By the ilClan era, the once-powerful symbol of Smoke Jaguar dominance had become a rarity in the Inner Sphere.</p><p>In the Deep Periphery, the Goliath Scorpions took extraordinary measures to preserve their Warhawks following their Abjurement, cannibalizing severely damaged chassis to keep others operational. Cherishing the design for its pinpoint accuracy, the Scorpions revived production prior to the Hanseatic Crusade, where the Warhawk played a key role in the Escorpión Imperio's conquest of the Hanseatic League. The wealth of resources captured during the Crusade allowed the new Scorpion Empire to retool the factory on Antwerp at Imperial BattleMechs, fully resurrecting the Warhawk production line. Clan Sea Fox has expressed interest in purchasing the design, but the Scorpions have thus far refused all outside sales, prioritizing their own internal needs.</p>
