chassis: "Mechanized Hover Level I (WOBM)"
model: "(MG)"
overview: |-
  <p>The Word of Blake Militia inherited ComStar's combined-arms organizational philosophy and its Star League-era equipment stocks, fielding infantry formations that ranked among the best equipped in the Inner Sphere during the Jihad. Mechanized hover Level I formations gave the Word of Blake Militia its fastest ground-mobile infantry, capable of crossing water obstacles and open terrain at speeds that outpaced wheeled or tracked alternatives. Their speed made them effective pursuit forces when Protectorate populations attempted to flee contested areas. Carrying infantry-portable machine guns that provide sustained suppressive fire, these troops anchor defensive positions with a volume of fire that discourages enemy movement in the open.</p>
