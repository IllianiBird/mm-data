chassis: "Mercury II"
model: "MCY-100"
overview: |-
  <p>The Mercury II was designed by Clan Wolverine in 2823 during the formative years of Clan society, representing one of the very first new BattleMech designs produced by the fledgling Clans. Built as an enlarged and extensively upgraded successor to the Star League-era Mercury, the Mercury II doubled the original's weight to forty tons while incorporating the most advanced technologies available to the self-exiled Star League Defense Force. The Wolverines spared no expense in its construction, utilizing an extra-light fusion engine, ferro-fibrous armor, and double-strength heat sinks to create a fast, well-protected scout with genuine combat capability.</p><p>The Mercury II's existence is known primarily through fragmentary records that survived the annihilation of Clan Wolverine. When the Not-Named Clan was destroyed, Clan Coyote claimed their battlefield losses had been acceptable because they captured at least one Mercury II in the process. This captured example is believed to have directly inspired the Coyotl, the first OmniMech, which shares a similar tonnage, engine rating, and visual profile with the Mercury II. The design thus occupies a critical link in the evolutionary chain from the original Mercury's modular weapon system to the full OmniMech technology that would transform warfare across the Kerensky Cluster and beyond.</p>
capabilities: |-
  <p>The Mercury II serves as a comprehensive redesign rather than a simple upgrade of its lighter ancestor. Powered by a 280-rated XL engine, the forty-ton design achieves a top speed of 119 kilometers per hour, trading the original Mercury's raw sprint capability for greater mass and durability. Seven jump jets provide 210 meters of leaping distance, addressing one of the original Mercury's most criticized shortcomings and greatly enhancing the 'Mech's ability to navigate difficult terrain during reconnaissance operations. Seven and a half tons of ferro-fibrous armor offer superior protection for a medium scout, allowing the Mercury II to absorb significantly more punishment than its twenty-ton predecessor.</p><p>The Mercury II's weapon array balances long-range striking power with close-quarters lethality. An ER large laser serves as the primary armament, providing a credible ranged threat against targets well beyond typical scout engagement distances. Paired medium lasers and small lasers echo the original Mercury's all-energy philosophy, ensuring unlimited endurance on extended patrols. The inclusion of both a Beagle active probe and Guardian ECM suite makes the Mercury II an exceptionally capable electronic warfare platform, able to detect hidden enemy units while simultaneously disrupting opposing sensor networks. This combination of speed, electronics, and firepower made the Mercury II the ideal scout and hunter-killer for Clan Wolverine's forces during the early Clan period.</p>
deployment: |-
  <p>The sole known production model of the Mercury II, this variant was designed and manufactured by Clan Wolverine beginning in 2823. This variant represents the full expression of the Wolverines' design philosophy, pairing a 280-rated XL engine with seven jump jets for exceptional mobility in a forty-ton frame. The all-energy weapon array of an ER large laser, two medium lasers, and two small lasers ensures unlimited endurance during extended reconnaissance operations, while the combination of a Beagle active probe and Guardian ECM suite provides comprehensive electronic warfare capability. Built entirely with Star League-era technology rather than the distinctly Clan manufacturing processes that would develop later, the Mercury II reflects the transitional period of early Clan society. No factory variants of the Mercury II are known to have been produced before Clan Wolverine's destruction.</p>
history: |-
  <p>The Mercury II emerged from the intense arms race that characterized the early years of Clan society, as the newly formed Clans competed to develop superior military technology from the Star League-era equipment they had carried into exile. Clan Wolverine, drawing on their technical expertise and the SLDF's industrial legacy, produced the Mercury II as one of their first indigenous designs. Unlike the later Clan-produced equipment that would use distinctly Clan technology, the Mercury II was built entirely with Star League-grade components, reflecting the transitional period before uniquely Clan manufacturing processes had fully matured.</p><p>The Mercury II's operational history was cut brutally short by the annihilation of Clan Wolverine. When the combined might of the other Clans fell upon the Not-Named Clan, the Mercury II fought and died alongside its creators. Clan Coyote, which participated in the destruction of Clan Wolverine, specifically noted that their losses during the campaign had been justified by the capture of at least one intact Mercury II. This captured specimen would prove to have consequences far beyond its individual combat value, as Clan Coyote scientists studied its design extensively.</p><p>The Mercury II's influence on subsequent military technology cannot be overstated. The captured example provided Clan Coyote engineers with critical insights into advanced 'Mech construction, and the design's visual profile and general arrangement are believed to have directly inspired the Coyotl, the first OmniMech, which was fielded just thirty-one years later in 2854. Through this lineage, the Mercury II serves as a bridge between the original Mercury's pioneering modular systems and the revolutionary OmniMech technology that would reshape warfare for centuries to come. Despite its association with the reviled Not-Named Clan, the Mercury II's legacy lives on in every OmniMech that has ever walked a battlefield.</p>
