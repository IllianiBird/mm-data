chassis: "Volkh"
model: "VKH-1"
overview: |-
  <p>The Volkh was introduced in 3063 by the Vining Engineering and Salvage Team (VEST) as an advanced technology test bed built on Solaris VII. Renowned for pushing the boundaries of 'Mech design both on the battlefield and in the arena, VEST created the VKH-1 to explore unconventional engineering concepts that would later inform designs such as the Great Turtle. The Volkh fills an unusual niche as a medium-weight close-combat design that prioritizes survivability over firepower, devoting nearly half its tonnage to hardened armor protection rivaling that of assault-class machines.</p><p>Initially an in-house project, the Volkh's success in Solaris gladiatorial matches raised significant interest among top stables and attracted attention from military procurement offices. Each Volkh is hand-built in VEST's Solaris VII workshop, making it one of the rarest production 'Mechs in the Inner Sphere, with only a handful of units in existence at any given time.</p>
capabilities: |-
  <p>The Volkh's design philosophy centers on an almost unprecedented level of protection for a 45-ton chassis. VEST engineers devoted nearly eighteen tons to Durallex hardened armor, giving the Volkh survivability that rivals assault-class 'Mechs such as the Atlas. The inclusion of a torso-mounted cockpit eliminates the risk of a lucky headshot disabling the MechWarrior, further reinforcing the design's reputation as extremely difficult to kill.</p><p>To achieve this level of protection at medium weight, VEST employed an Edasich Motors 225 XXL engine, one of the lightest powerplants available for the chassis's speed class. A supercharger provides brief speed bursts up to 97 kilometers per hour, allowing the Volkh to close distance rapidly with opponents or disengage when necessary. The trade-off for this combination is extreme vulnerability should the engine shielding be breached, a risk VEST accepts given the hardened armor's ability to prevent such penetration.</p><p>The Volkh's offensive armament is tailored for close-range engagements. Four Diverse Optics extended-range medium lasers mounted in the head provide consistent damage output, supported by a Hovertech SRM-4 launcher for additional punch. At point-blank range, two 'Mech-scale lances deliver devastating melee strikes, making the Volkh a terrifying opponent in the confined spaces of Solaris arenas.</p>
deployment: |-
  <p>This variant represents the baseline Volkh configuration as conceived by VEST for arena combat. Combining energy weapons and a missile launcher for ranged engagements with paired lance weapons for devastating melee strikes, the design leverages its supercharger to close distance rapidly with opponents. VEST lacks the capability to mass-produce the design, instead hand-building each unit in their Solaris VII workshop. As a result, only a handful of VKH-1 models exist, with most serving VEST directly as experimental platforms and test beds for emerging technologies.</p>
history: |-
  <p>The Volkh's history is inextricably tied to the Solaris VII fighting circuit and the Vining Engineering and Salvage Team's reputation as one of the game world's most innovative small manufacturers. VEST has operated on Solaris VII since the 3050s, using the gladiatorial circuit as both a testing ground and marketing platform for experimental technologies.</p><p>The VKH-1 debuted publicly in the Solaris arenas during the Civil War era, where its combination of extraordinary armor protection and melee capability made it an immediate crowd favorite. The 'Mech's ability to absorb punishment that would destroy machines twice its size, then close to deliver crippling lance strikes, thrilled audiences and confounded opponents alike. The design proved particularly effective against larger, slower 'Mechs that could not maintain sufficient range to exploit their firepower advantage.</p><p>VEST's small-scale production model limited the Volkh's broader military impact. Lacking the industrial capacity for mass production, VEST hand-built each unit in their workshop, relying on the Inner Sphere's military-industrial complex for components. Only a handful of Volkh chassis existed at any time, with most serving as experimental platforms for VEST's engineering team. The VKH-7 variant represented one of the few instances of a Volkh operating outside VEST's direct control, seeing service with the Skye Tigers stable on Solaris VII.</p><p>During the early Dark Age, the growing instability following the HPG Blackout prompted VEST to explore military contracts. In 3133, the company developed the VKH-68 prototype specifically for Republic Armed Forces procurement, featuring enhanced X-pulse lasers, MASC, and a targeting computer. However, an arena demonstration intended to showcase the design was disrupted when Victory Conditions Industries of Mizar debuted its NSR-K3 Night Stalker, a design bearing suspicious similarities to the Volkh. The Night Stalker's superior speed and range advantage proved decisive in the competition, and VEST ultimately abandoned the VKH-68 project, instead pursuing legal action against Victory Conditions Industries over suspected design infringement.</p><p>Despite its limited numbers, the Volkh remains an iconic Solaris design, embodying VEST's philosophy of pushing technological boundaries through arena combat. The change of Solaris VII's ownership to Clan Wolf during the ilClan era has added uncertainty to VEST's future operations, though the company's reputation for innovation ensures continued interest in its products.</p>
