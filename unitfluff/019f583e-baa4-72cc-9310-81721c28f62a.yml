chassis: "Mechanized Wheeled Level I (WOBM)"
model: "(Rifle)"
overview: |-
  <p>Word of Blake Militia infantry served as the backbone of Protectorate garrison forces across dozens of conquered worlds, providing the manpower for territorial control that the Militia's BattleMech and armor assets could not sustain alone. Mechanized wheeled Level I formations used wheeled APCs for efficient patrol and garrison operations on developed worlds within the Protectorate. Their lower maintenance burden compared to tracked or hover transports made them the most common mechanized infantry type in the Word of Blake Militia's order of battle. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon in the Inner Sphere, these troops deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
