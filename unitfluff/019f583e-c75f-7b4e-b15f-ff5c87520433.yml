chassis: "Bombard"
model: "BMB-1X"
overview: |-
  <p>Solaris Arms' Bombard debuted in 3054 as a purpose-built arena 'Mech for the Game World of Solaris VII. The fifty-ton design embraced an all-or-nothing philosophy, mounting devastating firepower at the cost of nearly all mobility. Little more than a walking turret, the Bombard attracted only a niche following among arena pilots willing to accept its extreme tradeoffs, and the design never achieved the commercial success Solaris Arms had hoped for.</p><p>A substantially redesigned model introduced in 3063 corrected early engineering deficiencies while retaining the core philosophy of disproportionate firepower for its weight class. Despite these improvements, the Bombard's reputation has remained that of an underperforming curiosity, produced in limited numbers and found primarily in minor arena stables and small private security outfits.</p>
capabilities: |-
  <p>The redesigned Bombard centers its firepower around twin Solaris Arms XT-15 Thunderbolt missile launchers, replacing the massive autocannons of the original model. These launchers deliver devastating concentrated warhead impacts at medium to long ranges, with six tons of CASE-protected ammunition providing reasonable endurance across prolonged engagements. A pair of Diverse Optics extended-range medium lasers supplement the primary armament, offering backup firepower independent of ammunition supply. Reinforced leg-mounted spikes provide a last-ditch close combat deterrent, though any Bombard pilot forced into a brawl has likely already lost the tactical initiative.</p><p>The design's most glaring weakness remains its mobility. The Hermes 100 XL engine propels the fifty-ton chassis to a maximum speed of just thirty-two kilometers per hour, making the Bombard one of the slowest medium 'Mechs ever fielded. ArcShield Heavy armor with CASE protection in both side torsos provides respectable survivability, but the lack of speed means pilots cannot disengage from unfavorable engagements. Standard heat sinks keep the thermal profile manageable, though critics note that addressing the heat management solved only one of the design's problems while leaving the fundamental mobility deficit untouched.</p>
deployment: |-
  <p>A radical mixed-technology variant reportedly produced on special commission, this Bombard replaces the Thunderbolt launchers with a pair of Clan-specification Gauss rifles while swapping the close-range lasers for three torso-mounted M-Pods. A supercharged XXL engine pushes the design to speeds approaching ninety kilometers per hour, finally addressing the chronic mobility deficit that plagued earlier models. The extreme rarity and expense of its Clan-tech components ensured that production remained extremely limited, making this Solaris Arms' most ambitious yet least accessible attempt to salvage the Bombard's reputation.</p>
history: |-
  <p>The Bombard's history is inextricably linked to the volatile arena circuit of Solaris VII. Solaris Arms developed the design in the early 3050s as a purpose-built gladiatorial 'Mech, betting that overwhelming close-range firepower would compensate for minimal mobility in the confined spaces of the Game World's arenas. The original BMB-010 debuted in 3054, and its twin autocannon armament did indeed produce spectacular early results in the hands of capable pilots who could exploit its devastating alpha strike potential.</p><p>However, the Bombard's competitive success proved short-lived. Engineering shortcuts taken during the original design manifested as serious structural problems under combat stress, exacerbated by the experimental War of 3039-vintage double heat sinks whose corrosive coolant gradually degraded the 'Mech's internal framework. A decisive defeat in the Davion Arena in 3060 exposed these flaws before a wide audience, destroying whatever market momentum the design had built. Solaris Arms was forced to acknowledge the problems and undertook a comprehensive redesign.</p><p>The resulting BMB-013, introduced in 3063, addressed the structural integrity concerns and replaced the problematic heat sinks, while transitioning from autocannons to Thunderbolt missile launchers. Despite these improvements, commercial reception remained tepid. Sales were largely confined to minor arena stables and small private security outfits, with the largest known order coming from the Blue Fists, a pro-Steiner Reaches stable that purchased two units.</p><p>By the late 3060s, Solaris Arms reportedly received a special commission to produce a limited run of mixed-technology variants incorporating Clan-specification weaponry and experimental engine technology, a radical approach suggesting the manufacturer was willing to pursue any avenue to make the design commercially viable. The Bombard's reputation for unreliability and non-standard parts continued to haunt its sales prospects even decades later. During the Dark Age, field refit variants appeared using salvaged components from other 'Mech production lines, demonstrating that despite its troubled history, the Bombard chassis continued to attract the attention of resourceful technicians willing to experiment with unconventional approaches.</p>
