chassis: "Wulfen"
model: "C"
overview: |-
  <p>The Wulfen is a Clan Wolf light OmniMech designed in 3137 at the W-7 Facilities on Tamar as the Clan prepared to abandon its original Occupation Zone. Intended as a signature platform for ristar MechWarriors fighting Trials over contested resources and territory, the thirty-ton design fills the role of an exceptionally fast stealth combatant capable of dictating the terms of any engagement. The Wulfen leverages a blend of advanced Clan and Inner Sphere technologies, an unusual combination that reflects Clan Wolf's pragmatic approach to military procurement during a period of rapid territorial upheaval.</p><p>Despite early controversy within the warrior caste over its mixed-technology construction, the Wulfen quickly proved itself in combat and earned a reputation as a premier light OmniMech reserved for the Clan's most promising warriors.</p>
capabilities: |-
  <p>The Wulfen's defining characteristic is its combination of extraordinary speed and battlefield invisibility. A Model 39b 300-rated extra-extralight engine propels the thirty-ton chassis to speeds exceeding 160 kilometers per hour, while six and a half tons of Imstar V-Stealth armor and an integrated ECM suite allow it to dictate engagements on its own terms. The use of mixed Clan and Inner Sphere technology (including an Inner Sphere XL gyro and Process 12 endo steel internals) frees ten tons of pod space for mission-specific loadouts, a generous allocation for a light design.</p><p>The Prime configuration pairs an Ultra Autocannon/2 with an ATM-3 system, providing flexible engagement options across multiple range brackets. Both weapons carry CASE II-protected ammunition, and a half-ton cargo pod offers modest logistical utility. Standard configurations emphasize the Wulfen's strengths as a long-range harasser and reconnaissance platform, though close-in variants mounting heavy lasers demonstrate the chassis's adaptability.</p><p>The Wulfen's principal vulnerability lies in its reliance on the extra-extralight engine, which makes the design exceptionally fragile if stealth protection is compromised. A single critical hit to either side torso can destroy the engine, making the Wulfen's survival dependent on maintaining its electronic and physical concealment.</p>
deployment: |-
  <p>The C configuration recasts the Wulfen as a light brawler, mounting three ER medium lasers tied into a targeting computer for devastating accuracy at close range. Ten jump jets give this configuration unmatched maneuverability in urban terrain and broken ground, allowing it to close rapidly on targets and exploit angles that heavier 'Mechs cannot reach. While sacrificing the standoff range that most Wulfen configurations favor, the C trades reach for overwhelming close-quarters lethality and the ability to outmaneuver virtually any opponent in confined environments.</p>
history: |-
  <p>The Wulfen's introduction was marked by controversy within Clan Wolf's warrior caste. Star Colonel Josiah Ward publicly denounced the design as tainted by Spheroid dishonor shortly after the first prototypes emerged from the W-7 Facilities, a statement widely interpreted as a political attack on Khan Seth Ward. SaKhan Garner Kerensky answered the challenge by forcing Ward to a Trial of Grievance, personally piloting a Wulfen prototype against Ward's Loki on the trial grounds outside Krefeld. Despite expectations that Ward's superior firepower would prevail, Kerensky used the Wulfen's mobility to control range and systematically dismantled the heavier 'Mech with precise long-range fire. The configuration Kerensky employed became the basis of the B configuration, and open complaints about the unit ceased.</p><p>Muted acceptance became admiration as the prototype Wulfen proved itself in combat during the Wolf Empire's invasions of the Republic of the Sphere, Free Worlds League, and Lyran Commonwealth. The few prototypes available when Clan Wolf uprooted itself demonstrated devastating effectiveness against the Silver Hawk Irregulars across half a dozen worlds during the invasion of the Marik-Stewart Commonwealth. The design further distinguished itself by outflanking the First Covenant Guards on New Olympia, an engagement that contributed to the death of former Paladin Thaddeus Marik.</p><p>Success in the field bred demand that far outstripped supply, prompting Clan Wolf to invest heavily in expanding production capacity and taking considerable measures to prevent Wulfens from being claimed as salvage or isorla. By the time the Wolves turned on their erstwhile Lyran allies, the Wulfen had cemented its status as the symbol of the ristar within the Wolf Empire's touman, reserved for frontline Galaxies and the Clan's most promising warriors.</p>
