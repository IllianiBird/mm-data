chassis: "Mechanized Tracked Platoon (DCMS)"
model: "(SRM 2620+)"
overview: |-
  <p>The Combine's martial traditions extend beyond the BattleMech cockpit, and the Dictum Honorium demands that all citizens contribute their talents to the defense of House Kurita. Infantry soldiers of the DCMS embody that expectation on garrison worlds across the realm. Tracked mechanized infantry ride armored carriers that can cross rough ground where wheeled vehicles cannot follow. The DCMS values these platoons for operations on worlds with poor road infrastructure, where the broken terrain that stops lighter transport is simply another day's march for tracked APCs and the soldiers they carry. Support elements carry man-portable short-range missile launchers that fire the same warheads used by BattleMechs and combat vehicles. At close range, a well-aimed SRM can crack vehicle armor that personal weapons cannot scratch, giving the platoon a meaningful anti-armor capability.</p>
