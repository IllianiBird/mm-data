chassis: "Mad Cat Mk IV"
model: "(Prime)"
overview: |-
  <p>The Savage Wolf, marketed to the Inner Sphere as the Mad Cat Mk IV, represents the fourth generation of the legendary Mad Cat lineage produced by Clan Sea Fox. Introduced in 3136, the design traces its origins to an illicit collaboration between Clan Jade Falcon and Clan Sea Fox's Spina Khanate Beta Aimag. When this unauthorized partnership came to light, Clan Sea Fox severed all ties with the Falcons, though the Jade Falcons managed to retain an unspecified number of non-OmniMech prototypes. OvKhan Petr Kalasa of Spina Khanate's Delta Aimag was subsequently granted the right to continue development, bringing the design to full production at Manufacturing Plant SFF-TU1 on Tukayyid, a former ComGuard facility refurbished by Clan Sea Fox. Christened the Savage Wolf to honor both the innovations of its creators and the formidable legacy of its Timber Wolf progenitors, the design quickly became one of the most sought-after heavy OmniMechs available for purchase.</p>
capabilities: |-
  <p>The Mad Cat Mk IV is built around a Type W4 endo steel chassis mounting a powerful Model 49b 375-rated XXL engine, propelling the seventy-five-ton OmniMech to speeds of 86 kilometers per hour. The design's most distinctive protective feature is its sixteen tons of Composite Alpha-V1 ferro-lamellor armor, which absorbs and dissipates kinetic energy far more effectively than standard ferro-fibrous compounds. The hip assemblies were repositioned to lower the 'Mech's center of gravity, improving stability and agility while giving the chassis a distinctive predatory profile. The gyroscope assembly is cocooned in a secondary armor layer, and the hip actuator assemblies are heavily shielded to deny adversaries a traditionally vulnerable target.</p><p>With twenty-eight tons of pod space available, the Savage Wolf accommodates a wide range of weapon configurations. The arm assemblies rotate nearly 180 degrees independently, granting arm-mounted weapons an unprecedented field of fire, a feature that particularly favors energy-based weapons given the limited internal ammunition capacity. Fifteen integrated double heat sinks manage baseline thermal loads, though most configurations require supplementary sinks to maintain optimal performance. The Khan Series communications suite and Series XIV OPT targeting system provide reliable battlefield awareness across all engagement conditions.</p>
deployment: |-
  <p>The Prime configuration deliberately evokes the Timber Wolf's renowned Alternate Configuration D, mounting twin ER PPCs for devastating long-range firepower alongside four Streak SRM-6 launchers, two forward-facing and two covering the rear arc. This arrangement grants the Savage Wolf a complete 360-degree fire envelope, making it exceptionally dangerous to approach from any angle. The combination of precision long-range energy weapons with the efficient Streak missile system creates a versatile combatant capable of dominating engagements across multiple range brackets, though the ER PPCs generate significant heat that demands disciplined fire management.</p>
history: |-
  <p>The genesis of the Mad Cat Mk IV lies in the complex politics of Clan Sea Fox's Khanate structure. The illicit partnership between ovKhan Sha Clarke's Beta Aimag and Clan Jade Falcon's researchers produced early prototype frames that blended Falcon weapons technology with Sea Fox engineering expertise. When this collaboration was exposed and repudiated by the Sea Fox Clan Council, the political fallout was significant, the Falcons retained several non-OmniMech prototype chassis while the project's future within Clan Sea Fox was uncertain until ovKhan Petr Kalasa secured development rights for Delta Aimag.</p><p>The first confirmed sighting of a production Mad Cat Mk IV occurred on Irian in 3139, where the design's combat performance generated immediate attention. Combat recordings showing the Savage Wolf engaging and defeating opponents in head-to-head engagements circulated widely, generating dozens of orders from major Houses, Clans, and larger mercenary commands alike. Clan Sea Fox's merchants leveraged the storied Mad Cat name recognition to drive sales across the Inner Sphere and Clan occupation zones, making the Savage Wolf a prestige acquisition.</p><p>There are unconfirmed rumors of field tests conducted by Republic of the Sphere forces immediately prior to the establishment of Fortress Republic, allegedly involving esoteric and previously unknown weaponry. No recordings have surfaced and no confirmed Mad Cat Mk IVs appeared in Remnant forces, though the rumors persist among the conspiracy-minded. The design became particularly associated with Clan Wolf, where its adoption by prominent warriors made the Savage Wolf one of that faction's most favored heavy 'Mechs, bringing the venerable Timber Wolf legacy full circle as a symbol of Clan Wolf martial prowess.</p>
