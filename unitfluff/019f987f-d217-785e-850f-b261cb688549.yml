chassis: "Motorized Platoon (Generic)"
model: "(Riot Police 2400+)"
overview: |-
  <p>Motorized infantry platoons use light ground vehicles, typically motorcycles or utility trucks, for rapid movement between positions. Faster than foot infantry and cheaper than fully mechanized formations, motorized platoons fill the gap between static garrison troops and armored combat units. They excel at road-bound patrol routes, rapid redeployment along prepared axes, and screening operations where speed matters more than protection. Off-road performance depends heavily on terrain and vehicle type, and the troops must dismount to fight, leaving their transport vulnerable. Configured for civil disturbance management rather than conventional military combat, these riot control troops are trained in crowd suppression, population control, and non-lethal enforcement operations on garrison worlds during periods of unrest or political transition.</p>
