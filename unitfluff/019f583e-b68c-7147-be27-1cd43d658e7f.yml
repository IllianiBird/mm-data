chassis: "Field Artillery Platoon (AFFS)"
model: "(Motorized Sniper Cannon 3079+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing Sniper cannon, a direct-fire variant of the standard Sniper artillery piece, these platoons engage targets with heavy-caliber shells that can breach reinforced positions.</p>
