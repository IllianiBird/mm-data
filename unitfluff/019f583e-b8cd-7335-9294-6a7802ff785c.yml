chassis: "Mechanized Tracked Platoon (CCAF)"
model: "(Recoilless 2367+)"
overview: |-
  <p>The Capellan Confederation has always relied on its infantry to compensate for the CCAF's chronic shortage of heavier assets. Conventional foot soldiers, drawn from the citizens' militia system that defines Capellan military service, form the backbone of garrison forces across the Confederation's commonalities. Mechanized tracked platoons give Capellan commanders infantry that can keep pace with armored formations across rough terrain. The tracked transports provide better cross-country mobility than wheeled vehicles, allowing these platoons to operate alongside the tanks and combat vehicles that form the CCAF's armored reserve. Heavy weapons teams carry recoilless rifles that provide a portable anti-armor capability, allowing infantry to engage vehicles and hardened positions that would otherwise require dedicated support weapons.</p>
