overview: |-
  <p>The Com Guards field conventional infantry as a core component of their combined-arms formations, with Level I infantry units integrated into the same command structure alongside BattleMech, armor, and aerospace elements at every organizational level. Operating heavy field autocannon, these crews deliver punishing direct fire capable of damaging medium-weight combat vehicles, providing organic heavy weapons support that reduces a formation's dependence on armor assets.</p>
