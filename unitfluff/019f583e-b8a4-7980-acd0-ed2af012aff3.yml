chassis: "Mechanized Hover Platoon (CCAF)"
model: "(Flamer 3045+)"
overview: |-
  <p>The CCAF fields conventional infantry in larger numbers than its limited industrial base might suggest, drawing on the Confederation's deep tradition of citizens' militia service. Capellan soldiers learn to fight with fewer resources and less support than their counterparts in wealthier states, compensating with resourcefulness and ideological commitment. Hover-mechanized platoons are the fastest infantry formation in the CCAF, using hovercraft transports capable of crossing water and open ground at speeds that tracked and wheeled vehicles cannot match. Their speed makes them effective scouts and flanking elements, though the hover transports themselves are fragile. Flamer sections carry man-portable incendiary weapons that are devastating in close quarters and against fortified positions, though the short range and hazardous fuel supply make flamer duty one of the most dangerous assignments in the platoon.</p>
