overview: |-
  <p>The Coyotl holds the singular distinction of being the first OmniMech ever created. Developed by Clan Coyote scientists with assistance from Clan Sea Fox, the Coyotl was first fielded in 2854, taking the modular weapon replacement concept pioneered by the Star League-era Mercury and evolving it into a fully interchangeable hot-swapping system. Inspired in part by the Mercury II design captured during the annihilation of Clan Wolverine, the Coyotl represented a revolutionary leap in battlefield flexibility that would reshape warfare across the Kerensky Cluster and eventually the entire Inner Sphere.</p><p>Despite its historical significance, the Coyotl's fortunes were inextricably tied to those of Clan Coyote. As the Coyotes' territorial holdings contracted and resources dwindled, production became increasingly difficult to sustain. The original line at the Drennan Industriplex on Tamaron was shut down in 2943, and the design all but disappeared from the Homeworlds by the 3050s as newer, more capable OmniMechs from other Clans rendered it obsolete. It was not until the mid-3140s that Clan Sea Fox, sensing a commercial opportunity, revived the ancient design at Manufacturing Plant SFF-TU1 on Tukayyid for sale on the modern battlefield.</p>
capabilities: |-
  <p>Built on a Coyotl-pattern endo steel chassis and powered by a Pitban 280 XL engine, the Coyotl achieves a top speed of 119 kilometers per hour, making it exceptionally fast for a forty-ton design. These lightweight structural technologies freed fifteen and a half tons of pod space for mission-configurable weaponry and equipment, establishing the template that all subsequent OmniMechs would follow. Eight and a half tons of CI Standard armor provide adequate protection for a medium striker, though the design relies more on speed than raw durability to survive on the battlefield.</p><p>In its Primary configuration, the Coyotl carries an ER PPC and LRM-10 for long-range engagement, supplemented by a medium pulse laser and Streak SRM-4 for close-quarters fighting. The original engineers intended to build every configuration around the PPC, but this approach proved too limiting given the weapon's high heat output, and later configurations explored radically different loadouts. During its heyday, the Coyotl set the benchmark for light OmniMechs, particularly after engineering issues involving the chassis skeleton and electronics were resolved. The design's greatest limitation was never technical but political, as its close association with Clan Coyote meant that the Coyotl's reputation declined in parallel with its patron Clan's diminishing influence among the homeworld powers.</p>
deployment: |-
  <p>The second Clan Sea Fox configuration represents the most technologically advanced Coyotl loadout available. An improved heavy large laser linked to a targeting computer provides devastating precision fire, while an AP Gauss rifle handles lighter targets and infantry. A Streak LRM-10 offers long-range missile support, and a TAG designator allows the Coyotl to call in artillery strikes from supporting units. The configuration's most distinctive feature is an engine supercharger that allows the pilot to push the Coyotl to speeds approaching 150 kilometers per hour in short bursts, enabling rapid engagement and disengagement tactics that proved decisive during encounters with Clan Wolf raiders in the late 3140s.</p>
history: |-
  <p>The Coyotl's development was the culmination of six years of intensive research by Clan Coyote scientists, who worked closely with Clan Sea Fox colleagues to solve the formidable engineering challenges of creating a truly modular weapons platform. The breakthrough built upon the plug-and-fight technology of the original Mercury BattleMech, but extended the concept to allow complete reconfiguration of an entire 'Mech's weapons complement in a matter of hours rather than simply replacing individual damaged components. An additional eighteen months of combat trials followed before the Coyotl entered full service in 2854.</p><p>The first recorded combat deployment of the Coyotl took place during a Trial of Possession against Clan Cloud Cobra over the mining town of Roenich on Babylon. Cloud Cobra defenders initially scouted the new design and catalogued its weapons loadout, only to discover during the main engagement that the Coyotl's armament had been completely reconfigured between encounters, adding jump capability where none had existed hours before. This demonstration of tactical flexibility sent shockwaves through the Clan Council and prompted immediate demands from Clan Jade Falcon and its allies that OmniMech technology be shared among all Clans by 2858.</p><p>Armed with OmniMech superiority, Clan Coyote expanded rapidly within the Kerensky Cluster, equipping their entire Alpha Galaxy with OmniMechs by 2859. However, as other Clans developed their own OmniMech designs, the Coyotl was gradually outclassed by newer forty-ton platforms offering superior performance. Combined with Clan Coyote's declining political and military fortunes, the Coyotl's production at the Drennan Industriplex on Tamaron became increasingly unsustainable, and the line was finally shuttered in 2943.</p><p>The Coyotl languished in obscurity for centuries until Clan Sea Fox identified it as a viable commercial product during the Dark Age era. Reviving production at their Manufacturing Plant SFF-TU1 on Tukayyid by the mid-3140s, Sea Fox merchants developed two new configurations featuring advanced weaponry including plasma cannons, improved heavy lasers, and engine superchargers. A notable engagement in late 3149 demonstrated the revived Coyotl's effectiveness when a Star of the OmniMechs helped defend a Sea Fox weapons shipment to the Republic of the Sphere against Clan Wolf raiders in the New Dallas system. The Coyotls' supercharger-enhanced speed allowed them to close range rapidly, overwhelming the Wolf forces with heavy laser fire against their thin rear armor and driving them from the field.</p>
