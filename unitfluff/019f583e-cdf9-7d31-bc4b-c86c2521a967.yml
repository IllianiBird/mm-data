chassis: "Razorback"
model: "RZK-10T"
overview: |-
  <p>The Razorback is a thirty-ton light BattleMech introduced by Bowie Industries in 3063, representing the massive defense corporation's first foray into light 'Mech design after generations of producing exclusively heavy chassis. Built at the company's Carlisle manufacturing facility, the Razorback was developed to compete in an Inner Sphere market that had shifted decisively toward newer designs incorporating recovered Star League technology.</p><p>The design debuted in prototype form in mid-3063 and entered final production just months later, its full testing period cut short by the eruption of the FedCom Civil War. The Razorback has since proven itself a reliable and versatile light combatant, seeing widespread service across the Lyran Commonwealth and beyond.</p>
capabilities: |-
  <p>The Razorback fills a middle ground in light BattleMech design, combining long-range firepower with effective short-range punch. Its primary weapon, a Defiance Model 6 extended-range large laser, provides accurate fire at considerable distances, while a Defiance Trak-Shot II Streak SRM-4 launcher delivers reliable close-range damage. Four Coventry Light Autogun machine guns round out the armament, making the design particularly lethal against conventional infantry and useful for exploiting breaches in enemy armor.</p><p>While the Razorback is far from the fastest light 'Mech in existence, its Defiance 180 light fusion engine propels the design at speeds sufficient to keep pace with most light combat elements. This allows MechWarriors to provide ranged covering fire while faster units close with the enemy or withdraw. The use of a light engine rather than an extra-light model gives the Razorback a notable survivability advantage, as a side torso breach will not result in catastrophic engine failure.</p><p>Durallex Super Medium ferro-fibrous armor provides solid protection for a 'Mech of its tonnage, and the inclusion of CASE ensures that an ammunition explosion in the missile or machine gun bins will not destroy the entire machine. The Razorback's general reliance on ballistic and missile weaponry means it rarely encounters overheating issues under normal combat conditions, though this comes at the cost of ammunition dependency.</p>
deployment: |-
  <p>Developed in 3071 during the Jihad, this variant stands as a complete rebuild of the Razorback from the ground up. An extra-light fusion engine replaces the original light engine, boosting top speed to over one hundred and ten kilometers per hour. Endo steel internal structure and standard ferro-fibrous armor maintain protection levels while freeing the weight needed for the dramatic speed increase. Armed with a heavy PPC and four extended-range small lasers, this variant sacrifices the versatility of earlier models for raw speed and striking power, making it an effective raider and harasser on the modern battlefield.</p>
history: |-
  <p>The Razorback's development was driven by economic necessity rather than military doctrine. Throughout the Succession Wars and beyond, Bowie Industries had built its reputation on heavy BattleMechs like the Archer and Marauder, produced at facilities on Alarion, Carlisle, and Wyatt. The post-Clan Invasion era saw a surge in military procurement that temporarily sustained these legacy production lines, but by the late 3050s the market had shifted decisively toward newer designs incorporating recovered Star League technology.</p><p>Bowie's decision to develop a light BattleMech in 3060 represented a fundamental strategic pivot for the centuries-old corporation. The Razorback entered service just as the FedCom Civil War erupted, creating immediate demand for combat replacements on all sides of the conflict. The Carlisle production facility ran at capacity throughout the war, with Bowie shipping 'Mechs directly to the LAAF Quartermaster Corps. Several shipments were diverted by officers loyal to Victor Steiner-Davion, though nearly all Razorbacks remained within Lyran Alliance territory. The first production run particularly found its way into Katherine-loyal units stationed in the Federated Suns.</p><p>The Jihad proved both devastating and transformative for the Razorback program. Word of Blake attacks destroyed the Bowie facility on Alarion entirely and nuclear strikes devastated the Wyatt plant in 3068, leaving Carlisle as Bowie's primary surviving manufacturing center. The fall of Hesperus II cut off Bowie's main weapons supplier, directly spawning the all-energy RZK-9T variant and forcing the company to become more self-sufficient in component sourcing. Despite operating at reduced capacity, the Carlisle plant continued production throughout the conflict.</p><p>Following the Jihad, the Razorback saw wider distribution across the Inner Sphere. The design found service with the Federated Suns, Free Worlds League successor states, the Free Rasalhague Republic, the Marian Hegemony, and the Republic of the Sphere, in addition to numerous mercenary commands. Continued production through the Dark Age and into the ilClan era, particularly of the proven RZK-9T and the newer tenth-series variants, ensured a steady supply to Lyran forces and their trading partners.</p>
