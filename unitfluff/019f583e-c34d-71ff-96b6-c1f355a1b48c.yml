chassis: "Assassin"
model: "ASN-23"
overview: |-
  <p>The Assassin was introduced in 2676 as the product of corporate ambition rather than military necessity. Maltex Corporation successfully lobbied the Star League to purchase the design as a replacement for the lighter Wasp and Stinger reconnaissance 'Mechs, achieving this through over-hyped performance statistics, fudged budget approximations, and political maneuvering. Despite this inauspicious origin, the forty-ton Assassin proved itself a capable light 'Mech hunter with impressive speed and jumping capability, and its modular design and ease of maintenance allowed it to persist through centuries of warfare long after Maltex's own fortunes had faded. Hellespont 'Mech Works revived the chassis in the late Jihad era, ensuring the Assassin remains a common sight in Capellan and Periphery forces.</p>
capabilities: |-
  <p>The Assassin combines respectable mobility with adequate firepower for its intended role as a reconnaissance platform and light 'Mech hunter. Its VOX 280 fusion engine propels the forty-ton chassis to speeds of 118 kilometers per hour, while seven Lox Lift Series 1 jump jets provide an impressive 210-meter jumping distance that allows pilots to exploit terrain advantages against heavier opponents.</p><p>The weapons suite centers on a Holly-5 LRM-5 launcher for long-range harassment, supplemented by a Holly-2 SRM-2 rack and arm-mounted Martell medium laser for close engagements. This combination provides flexibility across engagement ranges, though the design's limited ammunition capacity of just seventy-four total rounds restricts extended operations without resupply. The SRM launcher's ammunition feed system is also prone to jamming in high-heat situations, a persistent concern that has led many operators to adopt conservative firing disciplines during sustained engagements.</p><p>The Assassin's most significant weakness lies in its cockpit design. Maltex's cost-cutting measures produced one of the most cramped cockpits in the Inner Sphere, limiting pilot endurance to half that of comparable designs and causing many veterans to develop chronic back problems. Despite numerous redesign attempts over four centuries, this fundamental flaw has never been adequately addressed in standard production models.</p>
deployment: |-
  <p>When Hellespont 'Mech Works began mass production in 3067, this variant became the new standard Assassin variant. Originally developed as a standardized field modification, this upgrade removes the SRM-2 to mount a Magna 400P medium pulse laser and adds an Artemis IV fire control system to the LRM-5 launcher. Within the Capellan Confederation Armed Forces, Taurian Defense Force, and Magistracy Armed Forces, this variant serves primarily in green and reserve formations as an economical means to rebuild shattered units. Capellan commanders frequently employ the variant in fire-support roles for pursuit and strike lances, though chronic shortages of Artemis-compatible ammunition force many pilots to rely on mine-delivery missiles instead.</p>
history: |-
  <p>The Assassin's troubled history began when Maltex Corporation secured Star League Defense Force contracts through aggressive lobbying rather than superior design. Only several hundred units were produced before quality control investigations slowed production to a crawl, and the design was quietly shuffled to Periphery garrisons and militia markets. The primary manufacturing facility on Errai was destroyed in 2835 during the Second Succession War, further limiting the chassis's availability.</p><p>House Marik became the Assassin's most enthusiastic user during the Third Succession War. The 'Mech's impressive performance during the Battle of Rochelle in 2980, where it excelled in muddy conditions that hampered heavier designs, led to widespread adoption in Free Worlds League garrison forces. Marik commanders frequently assigned Assassins to rear-area raiding parties, where their speed and jump capability proved invaluable for hit-and-run operations.</p><p>The Capellan Confederation exhausted its Assassin inventory by 3025, and spare parts shortages plagued operators across the Inner Sphere. By 3058, most surviving Assassins had been phased out of frontline service, with the remaining examples typically serving as family heirlooms passed down through MechWarrior dynasties, often sporting extensive field modifications.</p><p>The Assassin's fortunes reversed dramatically in late 3067 when Hellespont 'Mech Works acquired the design from Maltex Corporation. Distracted by Jihad-era chaos, tax evasion charges, and suspected Word of Blake connections, Maltex readily surrendered control. Hellespont began producing upgraded variants for the Capellan Confederation Armed Forces, Taurian Defense Force, and Magistracy Armed Forces, using the chassis as an economical means to rebuild shattered formations. The design's shared components with the Raven II further simplified logistics for Capellan operators.</p><p>Defiance Industries' attempt to produce the ASN-30 variant for Lyran forces during the FedCom Civil War proved largely unsuccessful, with the radical redesign failing to win acceptance. However, Hellespont's more conservative upgrades have ensured the Assassin remains a common sight in Capellan and Periphery forces well into the thirty-second century.</p>
