chassis: "Field Gun Platoon (FWLM)"
model: "(Wheeled Light Gauss 3056+)"
overview: |-
  <p>The Free Worlds League Military has long fielded some of the largest infantry formations in the Inner Sphere, with regiments numbering nearly 1,800 soldiers compared to roughly 750 in the Combine and just over 1,000 in the Federated Suns. Towing crew-served light gauss rifles, these platoons trade the raw stopping power of full-size gauss weapons for improved mobility and a lighter logistics footprint, while still delivering magnetically accelerated rounds at ranges that exceed conventional autocannon.</p>
