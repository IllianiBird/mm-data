chassis: "Amarok"
model: "3"
overview: |-
  <p>The Amarok is a 100-ton Clan assault BattleMech introduced in 3149, designed specifically to counteract the Death From Above tactics increasingly employed by Clan Jade Falcon. Conceived by a Clan Wolf scientist who turned to Clan Sea Fox for manufacturing assistance, the Amarok was built at Manufacturing Plant SFF-TU1 on Tukayyid, representing an unusual collaborative effort between the two Clans. At the heaviest weight class available, the Amarok combines devastating close-quarters firepower with surprising bursts of speed, making it a formidable opponent in any engagement where physical combat is likely. The design's reputation within the Clan Wolf touman is exceptional, with the Amarok regarded as one of the most desirable assault chassis assignments available to Wolf warriors.</p>
capabilities: |-
  <p>The Amarok mounts twenty and a half tons of hardened armor, providing exceptional physical protection that reflects its intended role as a close-combat anti-DFA platform. A Type 79 400-rated XL fusion engine provides a base speed of 54 kph, supplemented by a supercharger that pushes the assault 'Mech to 75 kph in short bursts, speed unusual for its weight class. The primary armament is entirely torso-mounted: an extended-range PPC fitted with a capacitor delivers a devastating long-range punch capable of disrupting the flight path of incoming 'Mechs, while a rotary autocannon/5 and large pulse laser sustain damage at medium ranges. Paired Streak SRM-6 launchers handle close engagements with reliable accuracy.</p><p>The Amarok's most distinctive feature is a pre-programmed defensive routine designed to lock the arms together above the cockpit, shielding the pilot from DFA impacts. Based on Solaris VII combat data and the Hammerhead's physical layout, this system suffered from severe reliability issues ranging from simple activation failures to catastrophic arm collisions with the 'Mech's own upper torso and cockpit. Most MechWarriors permanently disable the feature, and it is scheduled for removal from future production runs. The Amarok's Battlefist-equipped arms and inherent stability compensate effectively, providing devastating melee capability even without the automated defense system.</p>
deployment: |-
  <p>Also introduced in 3150, the Amarok 3 doubles down on the chassis's anti-DFA philosophy through mixed Clan and Inner Sphere technology. An additional nine and a half tons of hardened armor and physical spikes dramatically increase survivability against charging 'Mechs. The extended-range PPC gives way to an Inner Sphere LRM 20 with Artemis V fire control, and the rotary autocannon is replaced by a Hyper-Assault Gauss Rifle 20, both weapons carrying two tons of ammunition and protected by CASE II. Seven small pulse lasers (three in each arm and one in the center torso) provide close-in disruptive fire against incoming enemies, while the remaining weaponry is optimized to deliver covering fire when allied units are threatened by Death From Above attacks.</p>
history: |-
  <p>The Amarok emerged from the political dynamics of the post-Gray Monday ilClan era. With the ilKhanate's standing diminished among the other Khanates, a special order from Clan Wolf initiated a collaboration with Clan Sea Fox to reverse the Wolves' declining military fortunes. The arrangement granted Clan Wolf extensive access to Sea Fox industrial resources on Tukayyid, though it provoked dissent between the Khanates when it became clear how heavily the new design drew upon the Hammerhead. Trials of Possession and Refusal waged by the Wolves over various design elements and the initial production run were defeated, allowing Manufacturing Plant SFF-TU1 to supply significant numbers of the new assault 'Mech in record time.</p><p>Clan Wolf's leadership intended to distribute Amaroks across multiple Clusters as specialist anti-DFA platforms, particularly to counter major Jade Falcon threats. In practice, production limitations restricted deployment to a handful of Clusters, primarily within Alpha and Beta Galaxies. The design saw its first major combat test during the battle for Skye, where both its strengths and its flaws were prominently displayed.</p><p>The Nineteenth Wolf Striker Cluster's Amaroks performed effectively during fighting around the Sanglamore Academy campus, operating in groups to pull down Shrikes, Turkinas, and Jade Hawks attempting Death From Above attacks. When confronted by the concentrated firepower of the Turkina Keshik, however, the Amaroks were overwhelmed by sheer volume of fire. The Ninth Wolf Guard fared considerably better, using their Amaroks to ambush the Turkina Keshik. Leveraging the 'Mech's supercharged speed to engage without hindrance, they routed the Keshik and eliminated stragglers one by one.</p><p>The Sea Foxes ultimately waged a series of Trials over design element theft from the Hammerhead, though all proved unsuccessful. Despite the political friction surrounding its creation, the Amarok remains one of the most sought-after assault 'Mechs in the Clan Wolf touman, with warriors eagerly competing for the privilege of piloting one.</p>
