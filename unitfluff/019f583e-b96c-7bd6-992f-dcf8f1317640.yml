overview: |-
  <p>Under the reforms of Precentor Martial Anastasius Focht, Com Guard infantry train extensively in combined-arms cooperation, conducting regular exercises alongside heavier elements to ensure seamless coordination across all branches when battle demands it. Manning heavy cluster-munition autocannon capable of firing both standard and shotgun-pattern ammunition, these crews provide heavy direct fire support with the flexibility to engage both armored and soft targets effectively.</p>
