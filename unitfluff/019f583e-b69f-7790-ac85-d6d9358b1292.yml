chassis: "Field Gun Platoon (AFFS)"
model: "(Motorized AC10 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing heavy autocannon capable of threatening medium-weight armored targets, these field gun crews deliver direct fire support that gives infantry formations organic anti-vehicle punch.</p>
