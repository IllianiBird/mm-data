chassis: "Mechanized Tracked Platoon (DCMS)"
model: "(LRM 3065+)"
overview: |-
  <p>The Combine's martial traditions extend beyond the BattleMech cockpit, and the Dictum Honorium demands that all citizens contribute their talents to the defense of House Kurita. Infantry soldiers of the DCMS embody that expectation on garrison worlds across the realm. Tracked mechanized infantry ride armored carriers that can cross rough ground where wheeled vehicles cannot follow. The DCMS values these platoons for operations on worlds with poor road infrastructure, where the broken terrain that stops lighter transport is simply another day's march for tracked APCs and the soldiers they carry. Their support troops operate man-portable long-range missile launchers capable of reaching targets well beyond personal weapon range. The ability to engage vehicles and fortified positions from a distance that keeps the crew out of direct fire makes LRM teams among the most valued assets in any infantry formation.</p>
