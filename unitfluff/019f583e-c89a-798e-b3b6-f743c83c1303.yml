chassis: "Raijin II"
model: "RJN-200-B"
overview: |-
  <p>The Raijin II emerged in 3066 as the Word of Blake's comprehensive upgrade of the original Raijin. Under the direction of Precentor Martial Cameron St. Jamais, the RJN-200 program delivered both field refit packages for existing units and new-production models incorporating advanced Blakist technology. The upgrade program bore similarities to the Draconis Combine's Project Phoenix approach, providing simplified installation requirements to minimize downtime.</p><p>Krupp Armament Works on Terra and Martinson Armaments served as primary production sites, with the most elite Blakist militia divisions receiving variants equipped with stealth armor. The Raijin II represented a significant evolution of the original platform, transforming it from a capable generalist into a more lethal and survivable combatant designed for the complex battlefields of the Jihad era.</p>
capabilities: |-
  <p>The Raijin II retains the Vlar 300 XL engine and Rawlings 60 jump jets of its predecessor, maintaining the same impressive mobility profile. The most significant structural change is the adoption of a Krupp 200-ES endo steel chassis, which saves weight for additional armor and equipment. Eleven tons of Krupp Standard Plate armor with CASE protection dramatically improves survivability over the original Raijin's ferro-fibrous plating, giving the design a visually distinct and more robust appearance.</p><p>The primary armament centers on a Blankenburg 200 ER PPC paired with three Diverse Optics Sunbeam ER medium lasers, replacing the original's pulse lasers with extended-range models for greater engagement flexibility. A Holly Streak SRM-4 provides efficient close-range missile support while reducing ammunition dependency compared to the original's dual launcher configuration. Triple Strength Myomers allow the 'Mech to reach speeds of up to 119 kilometers per hour when running hot, adding a significant tactical dimension.</p><p>The incorporation of an improved C3 computer enables the Raijin II to function as part of networked combat formations, sharing targeting data with allied units. This combination of enhanced armor, improved weapons, electronic warfare capability, and conditional speed boost made the Raijin II a considerably more dangerous opponent than its predecessor.</p>
deployment: |-
  <p>Intended as a heavy reconnaissance platform, this variant builds on the 200-A chassis but replaces the XL engine with a light fusion engine for improved survivability and mounts Capellan-developed stealth armor with an integrated ECM suite. The weaponry is streamlined to four ER medium lasers and an ER small laser, but the addition of TAG, a Beagle active probe, and an improved C3 computer make it an exceptional intelligence-gathering platform. A notable tactical limitation exists in that the stealth armor's active mode disrupts the C3 network, forcing pilots to choose between electronic concealment and networked targeting. Produced at both Krupp's Australian facility on Terra and Martinson Armaments on Caph, the 200-B was allocated primarily to the First and Sixth Militia divisions.</p>
history: |-
  <p>The Raijin II program began as both a field refit initiative and a new production line in early June 3066, with upgrade packages shipping to Word of Blake Militia units across the Blake Protectorate. Production halted at Krupp Armament Works on Terra to incorporate the new specifications, while Martinson Armaments established auxiliary production lines on both Terra and Caph for the stealth armor-equipped variants. The First and Sixth Militia divisions received the bulk of the advanced 200-B and 200-C variants, while standard 200-A refits were distributed more widely.</p><p>During the Jihad, the Raijin II served as a mainstay of Blakist medium 'Mech formations, with its improved C3 integration making it particularly effective in coordinated Level II operations. The design saw extensive combat throughout the Blake Protectorate's defense and various Blakist offensive operations, with Com Guard and Blakist Raijins frequently clashing against one another during the bitter internecine fighting that characterized the conflict.</p><p>The fall of the Word of Blake brought production to a complete halt. With Krupp's facilities on Terra coming under Republic of the Sphere control and Martinson's Caph facility similarly changing hands, no faction retained both the manufacturing capability and doctrinal interest to continue Raijin II production. The remaining units gradually attrited through combat losses and parts shortages, becoming increasingly rare on the battlefields of the Dark Age and ilClan eras.</p>
