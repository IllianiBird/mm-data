chassis: "Mechanized Wheeled Platoon (LCAF)"
model: "(MG 3058+)"
overview: |-
  <p>The LCAF fields conventional infantry that benefit from the Commonwealth's deep industrial base, equipping even garrison formations with reliable, well-maintained weapons and transport. Mechanized wheeled platoons use wheeled APCs that offer a balance between the speed of hover transport and the protection of tracked vehicles, well-suited to operations on developed road networks. Armed with assault rifles backed by portable machine guns, these platoons combine individual marksmanship with sustained suppressive fire from crew-served weapons that can pin down opposing formations.</p>
