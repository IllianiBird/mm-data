chassis: "Mechanized Wheeled Level I (ComGuards)"
model: "(LRM)"
overview: |-
  <p>Under the reforms of Precentor Martial Anastasius Focht, Com Guard infantry train extensively in combined-arms cooperation, conducting regular exercises alongside heavier elements to ensure seamless coordination across all branches when battle demands it. Mechanized wheeled Level I formations use wheeled APCs that provide a balance of road speed, infantry protection, and maintenance economy. The Com Guards deploy wheeled mechanized infantry extensively for garrison and patrol duties on worlds with developed transportation networks. Carrying infantry-portable long-range missile systems that extend the platoon's engagement envelope well beyond personal weapon range, these troops provide indirect fire support that can suppress enemy positions from distances where return fire is difficult.</p>
