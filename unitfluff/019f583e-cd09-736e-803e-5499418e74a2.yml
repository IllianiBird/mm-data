chassis: "Crimson Langur"
model: "A"
overview: |-
  <p>The Crimson Langur is a 50-ton Clan OmniMech jointly developed by Clan Blood Spirit and Kindraa Mick-Kreese of Clan Fire Mandrill, entering production in 3065. Following the Blood Spirits' devastating losses during their interference in the Absorption conflict between Clan Burrock and Clan Star Adder, the Blood Spirit Khan initiated several new military programs to rebuild the Clan's shattered forces. With the Spirits' chronically limited resources, the Clan approached the strongly Crusader-aligned Kindraa Mick-Kreese to share development costs. The resulting period of co-development and co-production yielded a capable medium OmniMech named to honor the unprecedented cooperation between the two Clans. Produced at the York Y2 Facility on York and at the Kindraa Mick-Kreese Primary Production Facility on Atreus, the Crimson Langur serves as a rare example of inter-Clan industrial collaboration during an era of increasing isolationism among the Homeworld Clans.</p>
capabilities: |-
  <p>The Crimson Langur is remarkably fast for a 50-ton OmniMech, achieving a top speed of nearly 120 kilometers per hour through the use of a 350-rated extralight fusion engine. Weight savings from an endo steel chassis frame allow the design to carry ten and a half tons of standard armor (the maximum the chassis can support) ensuring exceptional survivability for its weight class. This emphasis on speed and protection comes at a cost, however, as the Crimson Langur offers only fifteen tons of pod space for modular equipment, forcing MechWarriors to make difficult choices about offensive capability. A Full Head Ejection System provides an additional measure of crew survivability, reflecting the Blood Spirits' acute need to preserve their limited warrior cadre.</p><p>The limited pod space demands that each configuration carefully balance firepower against mobility and electronic warfare capability. Most configurations leverage the Crimson Langur's exceptional speed to dictate engagement range, pairing energy-heavy weapons suites with jump jets to maintain positional superiority. The chassis supports both long-range fire support and close-quarters brawling loadouts, though the tight tonnage constraints mean that no single configuration can excel at both simultaneously.</p>
deployment: |-
  <p>Alternate Configuration A serves as a long-range fire support platform favoring weapons popular with Clan Blood Spirit forces. The configuration retains the Prime's extended-range large laser while replacing close-range weapons with a pair of LRM-15 launchers backed by four tons of ammunition. This missile-heavy loadout provides sustained indirect fire capability at the cost of jump mobility, which is entirely sacrificed to accommodate the increased weapons payload. The A configuration is well-suited to supporting advancing formations from behind the main battle line.</p>
history: |-
  <p>The Crimson Langur emerged from one of the most turbulent periods in Home Clan politics. When Clan Star Adder moved to absorb Clan Burrock in the late 3050s, the Blood Spirits intervened in an ill-fated attempt to claim some of Burrock's assets for themselves. The resulting conflict left the Spirits badly bloodied, and the Star Adders escalated their raids against Blood Spirit holdings, threatening even the security of York itself. Desperate to rebuild, the Blood Spirit Khan launched several military modernization programs, including the development of new OmniMechs.</p><p>The partnership with Kindraa Mick-Kreese proved mutually beneficial. The Fire Mandrill Kindraa gained access to Blood Spirit manufacturing infrastructure while the Spirits received the engineering expertise and raw materials they lacked. Production began simultaneously at the York Y2 Facility and at Kindraa Mick-Kreese's primary facility on Atreus, ensuring neither Clan held exclusive control over the design.</p><p>Since entering service in 3065, the Crimson Langur rapidly proliferated through Blood Spirit and Fire Mandrill forces. By 3067, every Cluster within Kindraa Mick-Kreese and every Galaxy of the Blood Spirits fielded the design. The Crimson Langur's spread beyond these two Clans proved more surprising, the Blood Spirit Khan formed a Cloud Cobra ilChi post and presented the unit with a Star of Crimson Langurs, a diplomatic overture that shocked many observers given the Cloud Cobra's close dealings with the Star Adders. Crimson Langurs were also spotted in the Fourth Scorpion Uhlans of Clan Goliath Scorpion, though whether these were obtained through trade, trial, or isorla remains unclear.</p><p>The design's association with the ill-fated Blood Spirits and Fire Mandrills lent it a certain poignancy following the Wars of Reaving. Both Clans were ultimately destroyed during that devastating conflict, and surviving Crimson Langurs became prized trophies among the victorious Home Clans. Some evidence suggests production may have briefly continued at a facility on Haven before the Spirits' final destruction, though details remain scarce. The Crimson Langur stands as proof of what the smaller Home Clans could achieve through cooperation, even as the broader political currents of Clan society ultimately consumed them.</p>
