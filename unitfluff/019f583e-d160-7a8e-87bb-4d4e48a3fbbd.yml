chassis: "Goliath"
model: "GOL-4S"
overview: |-
  <p>The Goliath is an eighty-ton quad assault BattleMech introduced in 2652 by Brigadier Corporation. Designed as a larger, more capable successor to the troubled Scorpion, the Goliath overcame the engineering challenges that had plagued earlier four-legged designs to become a quality fire-support platform. Despite its proven performance, the Goliath struggled to find buyers during the Star League era, as the stigma of earlier quad designs made it a hard sell to procurement officers accustomed to bipedal chassis. Production remained limited for over a century before the design earned renewed respect, with multiple manufacturers producing updated variants from the late 3060s onward.</p>
capabilities: |-
  <p>The Goliath is a steady fire-support unit, with a PPC and dual LRM racks providing good ranged firepower. At 64 kph, it can keep up with heavy units and some lighter 'Mechs, while almost fifteen tons of armor let it take quite a beating. One of the strongest points of the Goliath is the number of heat sinks that allows it to keep up almost a constant rate of fire. Up close, the Goliath suffers. Dual machine guns might be good at fending off infantry, but against armored units they are almost useless, while the long-ranged weaponry is inaccurate.</p><p>The quad chassis provides superior stability when firing on the move, reducing the accuracy penalties that plague bipedal designs traversing rough terrain. This makes the Goliath an exceptional platform for sustained bombardment from elevated positions, where its wide stance keeps the weapons array level even on uneven ground. However, the quad layout limits the design's ability to mount arm-based weapons, forcing engineers to concentrate firepower in the torso and head locations. The lack of hands also means the Goliath cannot engage in melee combat or manipulate objects, a significant limitation during urban operations where versatility is prized.</p>
deployment: |-
  <p>The 3067 4S Goliath is built using a Pitban 320 Light Fusion Engine to save weight. The saved weight is used to mount a Defiance Hammerfist Heavy Gauss Rifle. The 4S also carries a Light Crossbow LRM-10 launcher for long-range support and for closer ranges the 'Mech carries two RAMTech 1500Z ER Medium Lasers. This arsenal makes the 4S extremely deadly at close ranges.</p>
history: |-
  <p>Brigadier Corporation developed the Goliath in 2652 as the second of their quad BattleMech designs, building on lessons learned from the unsuccessful Scorpion and the Xanthos. While the Scorpion was not a good design, it also had to contend with the fundamental challenges of a four-legged chassis. By learning from their failures, Brigadier's engineers were not only able to overcome many of the problems that the Scorpion suffered from but also to produce a quality design. The questionable reputation of the Scorpion made the Goliath a hard sell, however, and the Star League passed on the design. After over a century of good but limited service in the Periphery and House armies, the League inquired about purchasing some Goliaths, but the deal fell through as the Amaris Coup and the dissolution of the Star League occurred.</p><p>The Goliath weighs in at 80 tons, allowing it to carry a much heavier weapons payload and armor than the Scorpion at the cost of mobility. Very few Goliaths remain from the original production run, and most of those are split between Lyran units and the Free Worlds League. The Lyran Commonwealth put a priority on maintaining their Goliaths while Corean manufactures a few new Goliaths each year. Defiance Industries makes spare parts for the Goliath and has discussed manufacturing it, but held out for an upgraded design before beginning production.</p><p>Despite the rarity of the 'Mech, it has been involved in many important battles. In a 2901 battle for Sirius, a Marik Goliath was the centerpiece in their attack on a Liao position, disabling a BattleMaster and a pair of Shadow Hawks and pushing the Capellan line back forty kilometers. During the Fourth Succession War, Captain Andrew Redburn's Delta Company annihilated the Fifth Capellan Chargers - 'Cochraine's Goliaths' - on St. Andre.</p><p>In the late 3060s the Goliath saw renewed production and renewed popularity and has since become a powerful and respected assault 'Mech. In 3143, the Corean Enterprises - MacAdams-Suharno plant on Stewart was captured by Clan Wolf, and its GOL-6M variant production line was converted to produce a Clan version of the 'Mech.</p>
