chassis: "Hitman"
model: "HM-2"
overview: |-
  <p>The Hitman is a thirty-ton light BattleMech introduced in 3055 by Diplan 'Mechyards for the Draconis Combine Mustered Soldiery. Designed as a dedicated spotter for Arrow IV artillery systems, the Hitman fills a specialized niche that few other light 'Mechs can match. DCMS analysts identified the need for a fast scout capable of carrying Target Acquisition Gear after observing the Clans' minimal reliance on artillery, recognizing that precision-guided munitions could help offset the enemy's technological superiority in direct engagements.</p><p>Once famous for their Jenner and Mongoose designs, Diplan 'Mechyards had fallen on hard times during the Succession Wars but returned to full-scale BattleMech production with the Hitman. The design gave the DCMS a purpose-built artillery coordination platform at a time when few manufacturers were producing dedicated spotter chassis.</p>
capabilities: |-
  <p>The Hitman is built around speed and electronic warfare rather than raw firepower. Its GM 210 XL engine propels the thirty-ton chassis to a top speed of nearly 119 kilometers per hour, while an integrated MASC system enables bursts exceeding 151 kilometers per hour when the situation demands it. This exceptional mobility allows the Hitman to close rapidly to effective TAG range, designate targets for Arrow IV artillery batteries and semi-guided LRM fire, and withdraw before enemy forces can effectively respond.</p><p>The Hitman's electronic warfare suite is comprehensive for its weight class. An Apple Churchill Guardian ECM suite provides concealment from enemy sensors, while a Wunderland Beagle active probe detects hidden units that might threaten the 'Mech during its approach runs. Should the Hitman encounter a foe it cannot outpace, three Argra 3L medium lasers provide solid defensive firepower, and a Thunderstroke-L LRM-5 launcher linked to an Artemis IV fire control system offers engagement capability at longer ranges.</p><p>Five tons of Starshield A armor provide reasonable protection for a light 'Mech, though the fragile XL engine makes concentrated fire a serious threat. The Hitman's designers clearly prioritized its spotter role over survivability in a stand-up fight, a trade-off that makes the design far more valuable when properly paired with Arrow IV-equipped support elements than its modest armament might suggest.</p>
deployment: |-
  <p>This variant is a field modification created by the DCMS for units that lack substantial artillery assets but operate C3-networked lances. The TAG system is replaced with a C3 slave unit and the LRM-5 launcher gives way to a NARC missile beacon, transforming the Hitman into the ideal point element for light and medium C3 formations. The NARC beacon allows this variant to mark targets for enhanced missile accuracy across the entire lance, while the C3 slave shares targeting data to improve the firepower of every networked unit. This variant proved popular enough that Diplan 'Mechyards eventually added it to their production line alongside the original HM-1.</p>
history: |-
  <p>Diplan 'Mechyards had been reduced to little more than a holding company during the Succession Wars as their manufacturing plants were destroyed. Following the Clan Invasion, Diplan secured financial backing from Hachiman Taro Electronics Limited and upgraded their component manufacturing plant on Aix-la-Chapelle into a full BattleMech production facility. After extensive testing on the training grounds of New Samarkand's Sun Zhang Academy, the Hitman entered widespread deployment with the DCMS for the drive against Clan Smoke Jaguar.</p><p>With large numbers of Arrow IV-equipped vehicles and 'Mechs finally reaching front-line units, the DCMS began teaming them with Hitman scouts to devastating effect during Operation Bulldog. The Ryuken regiments used this new equipment combination against the Jaguars, and the perfected artillery coordination tactics served the DCMS well when Clan Ghost Bear later launched their own assault on the Combine.</p><p>The DCMS initially limited Hitman deployment to formations possessing the necessary artillery missile systems to fully exploit the design's TAG capability. Not wishing to waste the 'Mech's other considerable capabilities, the DCMS created the HM-2 field modification for units lacking artillery assets but fielding C3-equipped lances. The Seventeenth Recon Regiment, better known as Camacho's Caballeros, particularly deployed Hitman scouts on Luzerne during the Ghost Bear incursion. When the First Bear Regulars crossed the border, the regiment's scout elements called in a withering artillery barrage that gutted an entire Ghost Bear Cluster.</p><p>Production continued at Diplan 'Mechyards on Aix-la-Chapelle through the Jihad era, which saw the introduction of the HM-1r variant as a more versatile direct-combat platform. The Hitman also served as the foundation for Diplan's later Kabuto light 'Mech, which adapted the successful chassis into a close-range striker role. From the Clan Invasion through the ilClan era, the Hitman has remained in continuous production, a reflection of both the design's enduring utility and Diplan 'Mechyards' successful return to full-scale BattleMech manufacturing.</p>
