chassis: "Awesome"
model: "AWS-8Q"
overview: |-
  <p>Introduced in 2665 by the Technicron Manufacturing Conglomerate for the Star League Defense Force, the Awesome was designed as a replacement for the aging STR-2C Striker. An eighty-ton assault 'Mech built around a punishing PPC-based armament, the Awesome earned a fearsome reputation as a durable fire-support platform capable of anchoring any battle line. Its near-total independence from ammunition resupply and notoriously difficult-to-kill design have made it one of the most valued assault 'Mechs among logistics officers and field commanders alike. Sought after by every Great House and mercenary command with the means to acquire one, the design has remained a mainstay of assault lances for over four centuries.</p>
capabilities: |-
  <p>The standard AWS-8Q carries three Kreuss PPCs as its primary armament: one mounted in the right arm and two split between the left and right torsos. This battery delivers devastating firepower at ranges exceeding five hundred meters, enough to cripple most targets with a single concentrated volley. A Diverse Optics Type 10 Small Laser mounted in the head provides a token close-range weapon, while the left arm terminates in a battlefist for hand-to-hand engagements. A Pitban 240 fusion engine gives the Awesome a top speed of 64.8 kilometers per hour, adequate for an assault 'Mech but insufficient to dictate engagement range against faster opponents.</p><p>Twenty-eight standard heat sinks give the Awesome remarkable staying power in prolonged engagements, allowing MechWarriors to maintain a steady two-three-two firing cycle without significant heat buildup. The design carries fifteen tons of standard armor, exceeding even the BattleMaster in total protection, and the placement of critical systems away from explosive components makes the Awesome notoriously difficult to achieve a kill against. Rear armor coverage is among the heaviest found on any assault 'Mech, frustrating attempts by flanking units to exploit the typical weak point.</p><p>The Awesome is not without significant drawbacks, however. Its PPCs suffer from the minimum range limitations inherent to the weapon type, making close-quarters combat a serious vulnerability. With only the small laser and a single fist to fall back on at short range, the design is poorly equipped to handle opponents that close inside its effective engagement envelope. The lack of any weapon mount on the left arm further limits its options. The 'Mech's modest ground speed leaves it vulnerable to flanking maneuvers by faster opponents seeking to bypass the forward PPC arc, and commanders who fail to account for these limitations often find their Awesomes isolated and overwhelmed.</p>
deployment: |-
  <p>This variant is the standard production model and the most widely encountered variant across the Inner Sphere. Originally fielded by Star League Defense Force line regiments, the base Awesome saw service in every major theater of the Reunification War's aftermath and the early Succession Wars. Its straightforward all-energy loadout made it a natural choice for garrison commands and defensive formations where ammunition resupply was uncertain. SLDF units frequently deployed Awesomes in pairs or lances to create overlapping fields of PPC fire, a tactic adopted by the Successor States and still employed by assault formations to this day.</p><p>The Free Worlds League maintained the highest concentration of AWS-8Qs due to its control of the Savannah production lines, and League commanders came to treat the design as the backbone of their heavy assault formations. Other Houses acquired their Awesomes through battlefield salvage, trade, and the occasional raid on League supply depots, ensuring that the 8Q could be found in virtually every major military force across the Inner Sphere.</p>
history: |-
  <p>Technicron Manufacturing developed the Awesome on Savannah in the Free Worlds League, delivering the first production units to the SLDF in 2665 as a direct replacement for the aging Striker. The design proved itself quickly, and by the time of the Amaris Coup the Awesome had secured a place in front-line regiments across the Star League. When the SLDF departed on the Exodus, significant numbers of Awesomes remained behind with the Successor State militaries, setting the stage for the design's long career in the wars to come.</p><p>The Succession Wars placed enormous strain on Awesome production. Technicron's factory complex on Savannah survived the early conflicts largely intact, making it the sole remaining source of new Awesomes by the end of the Second Succession War. This gave the Free Worlds League a decisive advantage in fielding the design, and League diplomats occasionally leveraged Awesome sales as a bargaining tool with other Houses. The loss of advanced manufacturing knowledge during the wars had little effect on the base AWS-8Q, whose reliance on standard components and lack of advanced technology made it one of the easier assault 'Mechs to maintain and produce. Field technicians valued the design for its repairability, and many Awesomes accumulated centuries of continuous service through careful maintenance and component swaps.</p><p>The recovery of Star League technology in the 3040s opened new possibilities for the Awesome chassis. Technicron introduced the AWS-9M in 3049, incorporating an XL engine, double heat sinks, and ER PPCs to bring the venerable design into the modern era. The Clan Invasion further accelerated development, and the following decades saw a steady stream of new variants incorporating increasingly advanced technology. Irian BattleMechs Unlimited eventually partnered with other manufacturers on several later models, broadening the Awesome's production base beyond Savannah for the first time in centuries. Through the Jihad and the Dark Age, the Awesome continued to evolve, with Technicron's Savannah facility remaining the primary production center even as new factories on other worlds began contributing their own specialized variants.</p>
