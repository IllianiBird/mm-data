overview: |-
  <p>The Mad Dog was designed by Clan Smoke Jaguar in 2963 as a second-generation OmniMech, built to replace the earlier Lupus heavy OmniMech originally produced by Clan Coyote. Sharing design molds and structural elements with the Timber Wolf, the Smoke Jaguars deliberately named their creation as an insult to Clans Wolf and Coyote. The sixty-ton design filled the role of a versatile heavy fire support platform, utilizing its generous twenty-eight tons of pod space to mount devastating long-range weaponry across a variety of configurations. When Inner Sphere forces first encountered the design during the Clan Invasion, its hunched shoulders, protruding head, and reverse-jointed legs immediately earned it the code-name Vulture (or Hagetaka in Japanese) a name that also captured its perceived battlefield role as a patient predator watching the field from elevated positions. Mass production across virtually all Clans made the Mad Dog one of the most ubiquitous OmniMechs in Clan toumans, with Clan Ghost Bear and Clan Hell's Horses maintaining particularly large inventories.</p>
capabilities: |-
  <p>The Mad Dog's defining feature is its distinctive torso and arm pod arrangement. The side torso modules, angled high above the cockpit, serve as ideal mounting points for missile systems, while the elongated arm pods function as extended turrets for direct-fire energy or ballistic weapons. This configuration gives the design excellent fields of fire and allows it to maintain constant pressure on opponents from multiple angles simultaneously. In its Primary configuration, the Mad Dog carries paired LRM-20 racks in the shoulder-mounted torso pods, providing devastating long-range fire support, while twin large and medium pulse lasers (one of each per arm) deliver accurate close-range firepower for finishing crippled opponents.</p><p>Powered by a 300-rated XL engine, the Mad Dog achieves a respectable maximum speed of eighty-six kilometers per hour, granting sufficient mobility for repositioning between engagements. Eight and a half tons of ferro-fibrous armor provide adequate but not exceptional protection, making sustained close combat inadvisable against heavier designs. The pulse laser armament partially compensates for this vulnerability, allowing pilots to maintain effective fire while maneuvering at high speed. Rather than serving as a passive support platform (a role that would violate zellbrigen dueling conventions) the Mad Dog's configurations are universally designed to take the fight directly to the enemy at all ranges.</p>
deployment: |-
  <p>Alternate Configuration G pairs an ER PPC in the left arm with a trio of ER medium pulse lasers in the right, supported by a Streak LRM-15 and twin Streak SRM-6 launchers in the torsos. The streak-equipped missile systems ensure efficient ammunition usage by guaranteeing target locks before firing, while the ER PPC provides a reliable long-range punch. The combination of guaranteed-hit missiles and direct-fire energy weapons makes this a consistently effective configuration at medium to long ranges.</p>
history: |-
  <p>The Mad Dog's origins trace to 2963 during the Golden Century, when Clan Smoke Jaguar scientists sought to improve upon the Lupus heavy OmniMech first developed by Clan Coyote. Drawing upon shared design molds with the increasingly successful Timber Wolf, the Jaguars created a lighter and more versatile fire support platform. The naming of the Mad Dog was a deliberate provocation, an insult directed at both the Wolf and Coyote Clans whose designs it built upon.</p><p>The design's combination of generous pod space, decent speed, and proven components led to rapid proliferation across the Clan homeworlds. Production facilities spanning multiple Clan territories ensured a steady supply, with factories on Huntress, Tokasha, Babylon, Homer, Lum, and Arcadia all contributing to the Mad Dog's growing numbers. By the time of Operation Revival in 3049, the Mad Dog had become one of the most common heavy OmniMechs in virtually every Clan touman.</p><p>During the Clan Invasion, the Mad Dog proved its worth across dozens of engagements in the Inner Sphere. Inner Sphere analysts initially misidentified the design's role as purely fire support, but Clan MechWarriors demonstrated its full versatility through aggressive offensive operations. The Battle of Tukayyid in 3052 saw the Mad Dog employed in particularly innovative fashion, with Clan Ghost Bear technicians hastily reconfiguring their Mad Dogs into the close-combat S variant overnight to meet the demands of urban warfare against the Com Guards.</p><p>Following the Smoke Jaguars' annihilation in 3060, their production facilities on Huntress were eventually absorbed by Clan Fire Mandrill and later Clan Goliath Scorpion. Clan Ghost Bear's Bergan Industries facility on Alshain began producing a locally manufactured variant (sometimes called the Mk II) with minor cosmetic differences resulting from Spheroid factory tooling, though these machines remained functionally identical to their homeworld counterparts.</p><p>In the ilClan era, the Mad Dog's production has consolidated significantly. Clan Hell's Horses established a dedicated factory at the Svarstaad Industriplex Beta, making them the primary Inner Sphere producer. With over twenty new worlds to garrison, the Hell's Horses chose the Mad Dog specifically because it represented a safe, well-known, and thoroughly proven design. New configurations including the T, G, I, and V variants emerged from this period, reflecting the evolving tactical requirements of garrison duty and ongoing border conflicts.</p>
