chassis: "Merchant JumpShip"
model: "(2602)(Passenger)"
overview: |-
  <p>The Merchant-class JumpShip is the smallest JumpShip commonly utilized by independent traders, corporations, and mercenary units, and stands as the second smallest JumpShip still in active service. Originally designed with its name reflecting its intended commercial market, the vessel masses 120,000 tons and measures just over 320 meters in length.</p>
capabilities: |-
  <p>The Merchant-Class is designed to carry up to two DropShips via docking hard points located midway along a reinforced cylindrical cargo section. The cargo section itself is split into independent sections totalling over 600 tons of capacity, flanked by two small craft bays. The original design features a 40-meter diameter centrifugal grav deck functioning as a recreation center and lounge. As this class is mostly privately owned and operated, the actual onboard facilities are highly diverse. Common variations include airtight modules (20 to 100 tons) fitted into cargo bays to serve as extra living quarters, lounges, or controlled environments with independent life-support and power. This common variation has dedicated passenger capacity, at the cost of reduced cargo space. The vessel features a spacious, dome-shaped bridge with large viewports and a raised central command platform. While originally designed for a larger crew of six, over the centuries the bridge design has shifted to be operated by just two people. A persistent issue since the First Succession War is a lack of replacement parts for power converters, which increases the average recharge time by 10 to 20 percent compared to other JumpShips.</p>
history: |-
  <p>The Merchant-class, designed in 2503, is one of the oldest JumpShip designs still in common use this day. In its 550 years of service it has operated throughout the Successor States, though the greatest concentration is found within the Lyran Commonwealth, where an estimated 40 percent of all Merchant ships currently operate.</p>
