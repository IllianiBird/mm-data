chassis: "Mechanized Tracked Platoon (AFFS)"
model: "(Rifle Heavy 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Mechanized tracked platoons ride armored personnel carriers that provide both protection and all-terrain mobility, allowing these troops to keep pace with armored advances across open ground and survive the indirect fire that scatters lighter formations. Carrying heavy assault rifles alongside their standard arms, these platoons pack a harder punch than standard rifle formations, trading some logistical simplicity for increased stopping power against armored targets.</p>
