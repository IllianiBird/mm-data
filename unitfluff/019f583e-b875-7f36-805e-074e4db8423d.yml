chassis: "Foot Platoon (CCAF)"
model: "(SRM 3055+)"
overview: |-
  <p>The Capellan Confederation has always relied on its infantry to compensate for the CCAF's chronic shortage of heavier assets. Conventional foot soldiers, drawn from the citizens' militia system that defines Capellan military service, form the backbone of garrison forces across the Confederation's commonalities. CCAF foot platoons anchor the Confederation's garrison network, holding worlds that BattleMech forces cannot permanently occupy. Slow and vulnerable in open terrain, they depend on prepared positions and local knowledge to offset their lack of mobility. Heavy weapons sections carry man-portable short-range missile launchers that give the platoon an anti-armor punch well beyond what personal weapons can deliver, though the launchers are heavy and ammunition is limited.</p>
