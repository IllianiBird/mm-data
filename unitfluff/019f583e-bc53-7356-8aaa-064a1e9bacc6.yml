chassis: "Field Gun Platoon (FWLM)"
model: "(Motorized AC5 3035+)"
overview: |-
  <p>The Free Worlds League Military has long fielded some of the largest infantry formations in the Inner Sphere, with regiments numbering nearly 1,800 soldiers compared to roughly 750 in the Combine and just over 1,000 in the Federated Suns. Towing crew-served autocannon/5 field guns, these platoons deliver direct fire support that balances range, accuracy, and hitting power. The AC/5 is the workhorse caliber for field gun formations, effective against light vehicles and infantry positions alike.</p>
