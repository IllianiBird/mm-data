chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled LAC5 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing light autocannon that balance range and hitting power at reduced weight, these field gun crews provide mobile direct fire support from positions that heavier weapons cannot reach.</p>
