chassis: "Copperhead"
model: "CPR-HD-003"
overview: |-
  <p>Introduced in late 3054, the Copperhead is a light BattleMech purpose-built for the arena combat circuits of Solaris VII. Designed and manufactured by Solaris Arms, the thirty-ton 'Mech was conceived to excel in the short-duration, close-quarters engagements that define Solaris arena matches. The design quickly gained prominence after a Silver Dragons Stable pilot elevated it into the prestigious Solaris Top Twenty, establishing the Copperhead as a serious contender despite its light weight class. Following this success, the Silver Dragons commissioned Solaris Arms to develop an advanced variant incorporating experimental weaponry, though the prohibitive cost forced the stable to allow outside sales to recoup development expenses. While primarily an arena machine, the Copperhead attracted limited military interest, with the Draconis Combine Mustered Soldiery acquiring a number of the original production models for battlefield evaluation. The design's specialized nature and single-factory production on Solaris VII have kept overall numbers relatively low compared to mainstream military designs.</p>
capabilities: |-
  <p>The Copperhead's design philosophy centers on maximizing lethality within a thirty-ton frame optimized for arena combat. Built on a Castelli 211CTC chassis and powered by a GM 180 XL engine fitted with a supercharger, the design can achieve burst speeds of one hundred thirty kilometers per hour, allowing pilots to rapidly close distance or disengage in tight arena terrain. A pair of Luxor 2/Q-EX jump jets provide a modest sixty meters of vertical mobility, enough for tactical repositioning over obstacles but criticized by some as insufficient for a light 'Mech. ArcShield reflective armor provides exceptional protection against the energy weapons prevalent in arena combat, though at only four and a half tons the coverage remains thin by military standards. A cramped small cockpit accommodates the design's tight internal space requirements but reduces pilot comfort during prolonged engagements.</p><p>The Copperhead's firepower centers on a Sutel Precision Line medium X-pulse laser in the left arm, incorporating Bethel Labs X-pulse technology for devastating accuracy at close range. Three torso-mounted Diverse Optics extended-range medium lasers provide the primary damage output at medium distances, while a Holly Streak SRM-4 rack and head-mounted Poland Main Model C Magshot deliver punishing close-range surprises. Thirteen double heat sinks struggle to manage the heat generated by sustained fire from this advanced laser array, forcing pilots to carefully manage their engagement tempo to avoid potentially catastrophic overheating.</p>
deployment: |-
  <p>The definitive Copperhead variant, this variant entered production around 3065 as a comprehensive upgrade commissioned by the Silver Dragons Stable. Solaris Arms replaced the original ferro-fibrous armor with ArcShield reflective plating to counter the energy-weapon-heavy arena environment, added a supercharger for burst speed capability, and installed advanced X-pulse and extended-range laser technology. A thirteenth double heat sink was added to partially offset the increased thermal load, while a small cockpit freed internal space for these upgrades. A Poland Main Model C Magshot gauss weapon and Holly Streak SRM-4 replaced the original's conventional missile systems. The development costs proved so substantial that the Silver Dragons were forced to allow sales to other stables, spreading the advanced Copperhead design across the Solaris VII arena circuit.</p>
history: |-
  <p>The Copperhead traces its origins to the competitive arena circuits of Solaris VII, where Solaris Arms first produced the design in late 3054. Purpose-built for the gladiatorial combat that defined the Game World's entertainment industry, the original CPR-HD-002 quickly proved itself in Solaris stables. A Silver Dragons Stable pilot drove the design into the prestigious Top Twenty rankings, earning recognition for both the stable and the Copperhead itself. This high-profile success prompted the Silver Dragons to commission a comprehensive upgrade incorporating the latest experimental technologies.</p><p>The resulting CPR-HD-003 variant entered production around 3065, featuring advanced weaponry and improved defensive systems. However, the development costs proved so substantial that the Silver Dragons were forced to allow sales to other interested parties, spreading the upgraded Copperhead across multiple Solaris stables. A simplified CPR-HD-004 variant followed shortly after in 3066, trading jump capability for increased armor protection to suit pilots who preferred durability over mobility.</p><p>The Clan Invasion's arrival in 3049 had dramatically shifted the Inner Sphere's military priorities, diminishing the role of light BattleMechs in conventional warfare. Despite this trend, the Draconis Combine recognized potential in the original Copperhead and purchased a number of CPR-HD-002 models for battlefield service, representing the design's most significant military adoption. The Combine's interest likely stemmed from the Copperhead's energy-weapon-heavy loadout and arena-proven maneuverability, qualities that translated reasonably well to reconnaissance and harassment duties.</p><p>Solaris VII's political control shifted several times over the Copperhead's production history. Originally within Free Worlds League territory during the Star League era, the planet passed through Federated Commonwealth control during the Clan Invasion before falling under Lyran Alliance jurisdiction. These political changes affected but did not halt production, as Solaris Arms continued to operate under successive governments. Production of all Copperhead variants appears to have peaked during the Civil War era before ceasing entirely, likely due to the broader disruptions of the Jihad and the design's inherently limited market appeal beyond the arena circuit. The Copperhead's notoriously high maintenance requirements further constrained its adoption outside the well-equipped workshops of Solaris VII's gaming stables.</p>
