chassis: "ForestryMech"
model: "ED-X3"
overview: |-
  <p>The ForestryMech ED-X3 is a stripped-down variant of the Crosscut LoggerMech produced during the Succession Wars, when the escalating loss of advanced technology forced manufacturers to prioritize simplicity and speed over capability. Built as a bare-bones alternative to the earlier ED-X2, the ED-X3 eliminated the lift hoist and cargo capacity entirely, reducing the design to its most fundamental role: cutting timber. What it lost in versatility it gained in speed, with an uprated internal combustion engine pushing the thirty-ton chassis to over eighty-six kilometers per hour, fast enough to outrun most threats an unarmed IndustrialMech might encounter in the lawless border regions where it found its greatest market.</p>
capabilities: |-
  <p>The ED-X3 retains only the essential chainsaw of the Crosscut family, mounted in the right arm actuator in the standard configuration. The lift hoist, cargo bay, and all auxiliary systems of the ED-X2 are removed, freeing mass for the uprated 150-rated internal combustion engine that defines this variant. The resulting top speed of over eighty-six kilometers per hour makes the ED-X3 one of the fastest IndustrialMechs in its weight class, a critical advantage for operators working in areas where pirates and raiders pose a constant threat.</p><p>The trade-off for this speed is severe. The ED-X3 carries the absolute minimum of commercial armor, offering negligible protection against any weapon heavier than small arms fire. Without a lift hoist or cargo capacity, the 'Mech is limited to felling operations and must rely on separate vehicles for timber transport. This specialization made the ED-X3 less popular with independent operators who preferred the self-contained capability of the ED-X4, but logging companies with dedicated transport fleets found the ED-X3's speed and low cost attractive for large-scale clear-cutting operations where the felling machine needed to cover ground quickly between work sites.</p>
deployment: |-
  <p>This variant is the only ForestryMech variant in the Crosscut lineage, representing the most austere production configuration of the chassis. Stripped of the lift hoist and cargo bay that characterize other Crosscut models, this variant relies solely on its chainsaw and exceptional speed. The uprated engine matches the original ED-X1's velocity despite using an internal combustion powerplant rather than a fusion reactor, giving operators the ability to flee from danger at speeds few IndustrialMechs can match. The minimal commercial armor provides almost no protection, but for operators who prioritize escape over resistance, this variant's speed is its best defense.</p>
history: |-
  <p>The ED-X3 emerged during the Succession Wars as a pragmatic response to the deteriorating industrial base of the Inner Sphere. With fusion engines becoming irreplaceable luxuries, manufacturers adapted the Crosscut design around increasingly simple powerplants. The ED-X3 took this philosophy to its logical conclusion, stripping away everything except the chainsaw and investing the freed mass in a more powerful internal combustion engine. The result was a fast, cheap, and minimally capable forestry platform that could be produced by virtually any facility with basic IndustrialMech manufacturing capability.</p><p>The ED-X3's production run overlapped with the introduction of the ED-X4 LoggerMech in the late twenty-eighth century. Where the ED-X3 prioritized speed and simplicity, the ED-X4 restored the lift hoist and cargo bay at the cost of a slower engine, proving more popular with the independent operators who formed the bulk of the forestry market. The ED-X3 gradually fell out of widespread production as the ED-X4 became the dominant Crosscut variant, though it never disappeared entirely from the market.</p><p>Despite its limited combat utility (or perhaps because of it) the ED-X3's speed made it a surprisingly effective scout and messenger platform for planetary militias too poor to afford proper military vehicles. Its ability to outrun most ground threats gave unarmed ED-X3 pilots a reasonable chance of surviving encounters that would destroy slower IndustrialMechs, and more than a few Periphery courier services operated modified ED-X3 models well into the Dark Age.</p>
