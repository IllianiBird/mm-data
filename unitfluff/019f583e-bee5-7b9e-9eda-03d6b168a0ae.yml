chassis: "Mechanized Wheeled Century (MHAF)"
model: "(MG)"
overview: |-
  <p>Caesar's ongoing program to modernize the Legiones Marianes has extended to conventional infantry formations, with improved equipment and weapons gradually replacing older stockpiles across the Hegemony's auxiliary legions. A centuria, or century, is the Marian equivalent of a company-sized formation. Mechanized wheeled centuries use wheeled transports that offer good road speed and lower maintenance costs than tracked vehicles, well suited to the Hegemony's infrastructure-limited Periphery worlds where supply lines stretch thin. Support squads operate portable machine guns that deliver sustained automatic fire, providing suppression capability against enemy infantry and light vehicles.</p>
