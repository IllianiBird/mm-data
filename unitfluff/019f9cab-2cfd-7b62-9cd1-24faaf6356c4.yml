chassis: "Jump Platoon (Generic)"
model: "(Laser TAG 3051+)"
overview: |-
  <p>Jump infantry platoons equip their troops with personal jump packs that allow short powered hops across broken terrain, over walls, and onto rooftops. This vertical mobility gives jump platoons access to positions that foot and motorized infantry cannot reach, making them particularly effective in urban combat, mountainous terrain, and defensive operations where elevation matters. The trade-off is cost and logistics: jump packs require fuel, maintenance, and trained operators, limiting the number of jump platoons a garrison command can field compared to standard foot formations.</p><p>Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these platoons field one of the most effective personal arms available to conventional infantry, though the weapons are significantly more expensive and require soldiers to carry additional power packs. These TAG specialists carry Target Acquisition Gear that designates targets with a laser for guided munitions delivered by artillery, aerospace assets, or missile units, providing precision strike capability far beyond the platoon's organic firepower.</p>
