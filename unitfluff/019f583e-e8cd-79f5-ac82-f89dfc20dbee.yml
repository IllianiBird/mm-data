chassis: "Hoodling Sensor HoverJeep"
overview: |-
  <p>The sealed Hoodling is a vehicle of extremely high quality that has been continuously manufactured on Terra since the twenty-ninth century. With its high speed, excellent communication and sensor suite, and comfortable crew accommodations, it is the premier covert operations vehicle for ComStar and its Explorer Corps. On a battlefield, there are few better eyes and ears than those of the Hoodling.</p>
