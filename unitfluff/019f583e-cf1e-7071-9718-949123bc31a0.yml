chassis: "Seraph"
model: "C-SRP-OE Eminus"
overview: |-
  <p>The Seraph is the assault-weight workhorse of the Word of Blake's Celestial series, an eighty-five-ton OmniMech that became the most widely recognized design in the family. Named after the highest order of angels in Christian theology, the Seraph lives up to its imposing title through a combination of heavy firepower and an unusual triple-strength myomer system that transforms it from a plodding assault platform into a surprisingly mobile threat. Manufactured by Gibson Federated BattleMechs and Martinson Armaments from 3069, the Seraph served as the primary frontline assault unit in Manei Domini formations and became the Celestial most commonly featured in Coalition intelligence briefings.</p>
capabilities: |-
  <p>The Seraph is built on a Celestial Series SP1 standard chassis powered by a GM 255 light fusion engine. At base output, its walking speed of thirty-two kilometers per hour is modest for the weight class. However, the design incorporates triple-strength myomer throughout the musculature. When the 'Mech runs hot, the TSM activates and significantly increases ground speed, reaching up to sixty-four kilometers per hour at a full run. Durallex Divine Guardian standard armor provides heavy protection, and forty-three tons of pod space give the Seraph extraordinary configuration flexibility. A small cockpit and fixed C3i computer maintain the series' standard Manei Domini integration.</p><p>The Invictus configuration emphasizes sustained firepower with an Ultra AC/10, dual MML-5 launchers, and a Streak SRM-6, supported by ER medium lasers and a retractable blade. The heavy ammunition dependency is partially offset by the design's ability to close range rapidly once TSM engages, delivering devastating close-range salvos.</p>
deployment: |-
  <p>The Eminus configuration emphasizes sustained ranged firepower. The loadout combines extended-range energy weapons with experimental systems that exploit the Seraph's enormous forty-three-ton pod capacity. Additional heat sinks allow sustained fire at ranges where the triple-strength myomer remains dormant, prioritizing firepower over the enhanced speed and melee capability that other configurations leverage. The Eminus variant serves formations requiring a durable fire support anchor that can absorb punishment while delivering consistent long-range damage.</p>
history: |-
  <p>No Celestial design inflicted greater psychological damage on Coalition forces than the Seraph. The eighty-five-ton OmniMech's TSM system was its most devastating feature, not merely for the tactical advantage it provided, but for the terror it induced. Standard engagement doctrine for assault 'Mechs assumed predictable closing speeds. The Seraph violated that assumption catastrophically. Coalition MechWarriors who maintained what they believed was a safe standoff distance found themselves suddenly facing an eighty-five-ton assault 'Mech bearing down on them at medium 'Mech speeds, closing the gap before they could reposition. After-action interviews consistently described Seraph encounters as among the most frightening experiences of the Jihad, and more than one seasoned MechWarrior reported hesitating at a critical moment when TSM activation turned what appeared to be a controlled engagement into a desperate brawl.</p><p>Coalition intelligence services eventually identified the thermal threshold at which TSM activation occurred, and tactical briefings were updated accordingly. Revised doctrine called for maintaining extreme standoff ranges and concentrating long-range fire to strip armor before the Seraph could close. Dedicated anti-Seraph tactics emerged, including coordinated "heat denial" approaches where units would deliberately avoid inflicting the kind of concentrated energy damage that might push the 'Mech's heat levels into TSM activation range. These countermeasures reduced the Seraph's shock value in later engagements, though experienced Manei Domini pilots learned to deliberately run hot by alpha-striking at range, triggering their own TSM before closing to deliver devastating melee attacks with myomer-enhanced strength. Some pilots reportedly used jump-capable configurations to close distance before TSM engaged, then switched to energy-heavy alpha strikes that simultaneously heated the 'Mech and devastated the target, triggering TSM for the follow-up assault.</p><p>The Seraph's reach extended beyond the Shadow Divisions. Warrior House Rakshasa, a nominally Capellan Confederation unit that had been infiltrated by the Manei Domini, fielded Celestial OmniMechs including Seraphs. Precentor Ravana, the house master, piloted a custom Seraph configuration incorporating a Thunderbolt 20 launcher and large variable speed laser. The presence of Celestial OmniMechs within a Capellan military unit was one of several intelligence indicators that eventually revealed the depth of Blakist infiltration into Confederation military structures. The Rakshasa connection demonstrated that the Word of Blake's influence networks extended further than most intelligence agencies had suspected, and prompted extensive counter-intelligence reviews across multiple successor states. The revelation that Celestial OmniMechs had been deployed through proxy forces raised uncomfortable questions about what other military units might harbor concealed Blakist operatives.</p><p>Phantom Precentor Sigma Sabnock of the Fiftieth Shadow Division piloted one of the more feared Seraphs in service, employing the design's TSM system with particular ruthlessness during engagements. Ghost Precentor Havalah operated another custom Seraph during operations with the Shadow Divisions, and the Caelestis configuration mounted captured Clan Streak LRM launchers and pulse lasers that gave the assault 'Mech an overwhelming combination of accuracy and sustained firepower.</p><p>In the post-Jihad era, confirmed Seraph sightings are treated as high-priority intelligence events. The design's TSM system and assault-weight firepower make even a single Seraph a formidable threat, requiring a disproportionate response from any force tasked with neutralizing the machine and its fanatical pilot.</p>
