chassis: "Clan Mechanized Hover Point"
model: "(Flamer Advanced)"
overview: |-
  <p>Clan doctrine generally treats conventional infantry as a necessary evil, though Clans like Hell's Horses have demonstrated that properly supported infantry can be an effective component of combined-arms operations. Mechanized Hover Points ride hovercraft that provide the fastest ground speed of any infantry transport, with the added capability of crossing water obstacles. This speed comes at the cost of durability, as hovercraft are fragile compared to tracked or wheeled vehicles, but in open terrain or coastal environments, few formations can match their ability to reposition quickly. Support troops carry man-portable flamers that project streams of burning chemicals, providing devastating area-effect capability against infantry and structures at the cost of short range and the vulnerability of the operator's fuel tank.</p>
