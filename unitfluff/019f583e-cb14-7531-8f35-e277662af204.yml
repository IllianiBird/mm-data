chassis: "Sunder"
model: "SD1-OA"
overview: |-
  <p>The Sunder is a ninety-ton Inner Sphere OmniMech developed by the Draconis Combine as the assault class component of the DCMS first generation of domestically produced OmniMechs. Introduced in 3056, the design was born from the intensive study of captured Clan Hellbringer and Summoner chassis following the Battle of Luthien in 3052. Draconis Combine engineers at Luthien Armor Works determined the leg assemblies of both progenitor designs could support twenty additional tons of mass, though overcoming catastrophic actuator burnout in prototypes and resolving caustic exhaust fouling from torso-mounted pod bays delayed the Sunder's entry into service, making it among the last of the first-generation DCMS OmniMechs to reach full production.</p><p>Though initially a Combine-exclusive design, the Sunder's proven chassis attracted interest from multiple successor states, and licensed production eventually spread the assault OmniMech to militaries across the Inner Sphere. This broad manufacturing base has kept the Sunder in continuous service from the Clan Invasion era through the ilClan period.</p>
capabilities: |-
  <p>The Sunder is built around a Hermes 360 XL engine that propels the ninety-ton chassis to a top speed of sixty-four kilometers per hour. The bulky engine forced designers to relocate the torso OmniPod bays above the cockpit, an arrangement that contributed to early exhaust fouling problems but provides thirty-six tons of available pod space. Sixteen and a half tons of Mitchell Argon armor give the Sunder respectable protection for an assault 'Mech, while fifteen fixed double heat sinks manage the thermal load across most configurations.</p><p>In its Prime configuration, the Sunder is built for devastating close-range engagements. An Autocannon/20 forms the core of its firepower, supported by two large lasers for medium-range engagement, a trio of SRM-4 launchers, and two medium lasers. This loadout makes the Prime variant most lethal at short ranges, though the large lasers provide adequate reach to engage enemies closing on its position.</p><p>While thirty-six tons of pod space theoretically make the Sunder a powerful combatant, its reduced ground speed and reliance on less efficient Inner Sphere weaponry leave it at a disadvantage compared to many Clan assault OmniMechs. The widespread use of salvaged Clan OmniPods during Operation Bulldog finally allowed the Sunder to compete on more equal footing with designs such as the Warhawk and Executioner.</p>
deployment: |-
  <p>Alternate Configuration A is built for long-range fire support, pairing a Gauss rifle with an ER PPC for powerful direct-fire engagements at extended range. Three LRM-5 launchers provide supplementary indirect fire capability in support of allied units. Two medium pulse lasers offer adequate close-range self-defense against lighter opponents. The Alpha and Prime configurations often deploy together in pairs, with the Alpha providing sustained long-range support while the Prime closes for decisive short-range engagements.</p>
history: |-
  <p>The Sunder's origins lie in the aftermath of the Battle of Luthien in 3052, when Draconis Combine forces captured examples of the Clan Hellbringer and Summoner OmniMechs. Combine engineers at Luthien Armor Works began an ambitious program to reverse-engineer these designs for domestic manufacture, selecting the assault weight class as one of several parallel development efforts alongside the Avatar and other first-generation OmniMechs. Prototype Sunders suffered from catastrophic actuator failure as the heavier chassis overstressed components designed for lighter Clan machines, and additional problems with caustic exhaust residue from torso-mounted weapons fouling the cockpit canopy and sensor arrays required extensive rework before full production could begin in 3056.</p><p>Initial deployment saw Sunders assigned to assault lances stationed along the Clan border, where they played a significant role during Operation Bulldog. The DCMS authorization for widespread use of salvaged Clan weaponry in OmniPods proved transformative, as Sunders equipped with Clan-grade weapons could finally compete favorably against Clan Warhawk and Executioner OmniMechs. Many Sunders also served as the anchor point of DCMS command networks, with dedicated C3 configurations enabling lance and company-level coordination that proved its effectiveness during the conflict.</p><p>StarCorps Industries recognized the Sunder's potential and licensed production from Luthien Armor Works in the early 3060s, establishing manufacturing lines at their plants on Crofton, Loburg, Son Hoa, and St. Ives. This licensing arrangement proved fortuitous when the Word of Blake Jihad devastated the DCMS's industrial base. Luthien Armor Works' OmniMech production facility was destroyed during the opening stages of the Jihad, cutting off the Combine's primary source of Sunders. StarCorps continued production for the Federated Suns, Lyran Alliance, and Capellan Confederation, ensuring the design survived even as the DCMS lost access to new production.</p><p>The Sunder continued to see combat during the tensions surrounding the Lyons Thumb and throughout the First Combine-Dominion War, where its role as a C3 network anchor proved particularly valuable. In the Dark Age era, new configurations incorporating Clan-spec weaponry and advanced electronics such as C3 boosted slave units and TSEMP cannons demonstrated the chassis's continued relevance. StarCorps facilities on Crofton and Loburg maintained production into the ilClan era, keeping the Sunder in service across multiple successor states long after its original Combine-only production had ended.</p>
