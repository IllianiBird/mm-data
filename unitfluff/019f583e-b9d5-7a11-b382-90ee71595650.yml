chassis: "Field Gun Platoon (ComStar)"
model: "(Wheeled UAC5)"
overview: |-
  <p>ComStar's infantry served across the Inner Sphere in garrison and security roles, stationed on HPG compound worlds where they provided protection for the Order's most critical infrastructure while maintaining the facade of a purely defensive force. Operating medium-caliber ultra autocannon that can fire at double the normal rate, these crews deliver concentrated salvos that overwhelm light armor and suppress infantry positions, accepting increased jam risk for burst damage.</p>
