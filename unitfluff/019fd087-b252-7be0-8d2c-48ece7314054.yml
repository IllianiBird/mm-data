chassis: "Camel Platoon (Generic)"
model: "(Laser 2230+)"
overview: |-
  <p>The Terran camel has accompanied humanity across the stars, thriving on arid and desert worlds where vehicles break down and water is scarce. Camels require minimal sustenance, can endure extreme heat, and traverse soft sand and broken ground that would strand wheeled or tracked transports. On Periphery worlds and underdeveloped colonies where mechanized logistics are unreliable, military commanders have turned to camel-mounted infantry as a practical alternative. These formations trade speed and protection for self-sufficiency, capable of operating far from supply lines for extended periods. While no match for armored forces in a direct engagement, camel-mounted troops excel at patrolling vast frontier territories, screening flanks, and conducting raiding operations across inhospitable terrain.</p><p>Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these platoons field one of the most effective personal arms available to conventional infantry, though the weapons are significantly more expensive and require soldiers to carry additional power packs.</p>
