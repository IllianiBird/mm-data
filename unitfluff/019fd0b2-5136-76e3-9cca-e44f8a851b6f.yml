chassis: "Tariq Squad (Generic)"
model: "(Rifle 2200+)"
overview: |-
  <p>The tariq (plural tariqim) is a large bipedal lizard native to the Outworlds Alliance world of Brasha. Standing just under two meters tall at the shoulder, tariqim are swift, durable, and highly intelligent. Fleshy nutrient deposits near the base of their tails sustain the animals for days in harsh conditions, while a tough, wrinkled hide and transparent inner eyelids protect against sand, grit, and desert exposure. Tariqim rival some BattleMechs and combat vehicles in overland speed, making them exceptional mounts for fast-moving infantry.</p>
