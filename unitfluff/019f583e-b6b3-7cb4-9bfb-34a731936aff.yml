chassis: "Field Gun Platoon (AFFS)"
model: "(Motorized UAC20 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing assault-class ultra autocannon capable of double-rate fire, these field gun crews field the most devastating rapid-fire direct weapons available to conventional ground forces.</p>
