chassis: "Hector"
model: "HOR-1C"
overview: |-
  <p>The Hector was introduced in 2471 as the second original BattleMech developed by the Free Worlds League, entering service just one year after the pioneering Icarus. Designed by Corean Enterprises at their MacAdams-Suharno facility on Stewart, the Hector was engineered for simplicity and ease of mass production, quickly becoming the workhorse of the Free Worlds League Military's growing 'Mech regiments. Despite fielding the design in substantial numbers, the FWLM remained unenthusiastic about the Hector throughout its service life, viewing it as a necessary but underwhelming heavy combatant. The Hector is nonetheless notable as one of the earliest dedicated heavy BattleMech designs and a significant milestone in the Free Worlds League's early military industrialization.</p>
capabilities: |-
  <p>The Hector's lackluster performance is directly attributable to its primitive components. The Pitban 340 Primitive engine enables a respectable top speed of sixty-four kilometers per hour for a seventy-ton chassis, but the oversized powerplant consumes an inordinate proportion of the 'Mech's available tonnage, severely limiting its combat payload. The StarSlab/2 primitive armor provides protection inferior to most contemporary tanks, leaving the Hector vulnerable in sustained engagements against peer-weight opponents.</p><p>The 'Mech's primary armament consists of a pair of I.W.W. Large Lasers mounted in the arms, providing adequate striking power at medium ranges but generating more heat than the thirteen installed heat sinks can effectively dissipate. This chronic heat management problem forces MechWarriors to exercise fire discipline, unable to sustain continuous salvos without risking shutdown. A unique arrangement of leg-mounted SperryBrowning Machine Guns was intended to provide anti-infantry capability, but this design choice proved counterproductive. Each machine gun carried its own ammunition bin in the legs, creating a critical vulnerability that savvy infantry quickly learned to exploit by deliberately targeting the Hector's lower extremities to trigger ammunition explosions.</p>
deployment: |-
  <p>Introduced in 2476, this variant was developed specifically to address the notorious vulnerability of the original Hector's leg-mounted ammunition bins. The two SperryBrowning Machine Guns and their problematic ammunition storage were removed and replaced with a pair of small lasers, eliminating the critical ammunition exposure that had crippled so many HOR-1B units. An additional heat sink was also fitted, slightly improving the 'Mech's marginal thermal management. While these modifications produced a more durable combatant overall, they could not overcome the fundamental limitations of the primitive chassis, and this variant shared the same fate as its predecessor when the design was retired in the 2520s.</p>
history: |-
  <p>The Hector's service history is inextricably tied to the earliest era of BattleMech warfare. Entering production in 2471 at Corean Enterprises' MacAdams-Suharno facility on Stewart, the design was the Free Worlds League's second attempt at fielding an indigenous BattleMech after the Icarus. The simple, mass-producible design allowed the League to rapidly expand its 'Mech forces, and the Hector soon became the most numerous 'Mech in the FWLM's inventory during the border conflicts of the late twenty-fifth century.</p><p>The Hector's combat record was decidedly mixed. While moderately effective against lighter opponents and early-generation designs, it struggled badly against the heavier Mackies of the Lyran Commonwealth. The Free Worlds League Military never warmed to the design, but alternatives were scarce. The diminutive Trooper project had ended in failure, and contemporary League designs like the Flea could supplement but not replace the Hector's role as a heavy combatant. The massive Longbow served an entirely different purpose as a missile support platform, leaving the Hector as the League's only viable heavy 'Mech for decades.</p><p>By the 2520s, the rapid proliferation of Hegemony-designed BattleMechs and continued advances in 'Mech technology left the Hector hopelessly outclassed. Unable to compete with the next generation of machines, the remaining Hectors were stripped of usable components and consigned to the scrapheap. No combat-capable examples survived into the Star League era, and the design was effectively lost to history for centuries.</p><p>The Hector experienced a brief and unexpected revival during the Jihad. Harmony MetalWorks, a Free Worlds League facility on the planet Harmony, returned the design to limited production beginning in approximately 3075 using retrotech manufacturing techniques. This facility produced small numbers of HOR-1B units alongside the equally ancient Mackie, continuing until production ceased around 3081. This late resurrection demonstrated the enduring appeal of proven designs during a period when advanced manufacturing capacity across the Inner Sphere was under severe strain from the Word of Blake's campaign of destruction.</p>
