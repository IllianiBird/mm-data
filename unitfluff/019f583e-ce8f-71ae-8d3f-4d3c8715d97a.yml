chassis: "Hyena"
model: "HYN-4B SalvageMech"
overview: |-
  <p>The Hyena was developed by Vining Engineering and Salvage Team (VEST) on Solaris VII as a purpose-built SalvageMech, first offered for sale in 3066. The design addressed a persistent problem in battlefield recovery: accessing wrecked BattleMechs in terrain too rough for conventional salvage vehicles. VEST, already well-regarded as masters of BattleMech innovation on the Game World, designed the Hyena to be fast enough to keep pace with combat elements while carrying the equipment necessary to recover even the heaviest downed BattleMechs.</p><p>The design quickly became the standard by which other SalvageMechs were measured, with buyers ranging from mercenary groups and Great House militaries to Periphery nations. Surviving Hyenas remain highly prized assets, and the design's reputation for effective battlefield recovery is unmatched among purpose-built salvage platforms.</p>
capabilities: |-
  <p>Built on a 55-ton IndustrialMech chassis, the Hyena's defining feature is its comprehensive salvage equipment suite. A pair of rear-mounted lift hoists give the design the ability to lift over 100 tons when working in concert with the chassis's industrial triple-strength myomer, enabling it to handle even assault-class BattleMechs without assistance. The sophisticated salvage arm mounted in the right arm provides the fine manipulation needed for delicate component extraction and precision work that lift hoists alone cannot accomplish.</p><p>The CoreTek 275 fusion engine provides a top speed of 84 kilometers per hour, comparable to medium-class BattleMechs and fast enough that the design does not require a support escort to keep pace with combat formations. Environmental sealing protects the crew in hazardous conditions ranging from chemical contamination to hard vacuum, allowing recovery operations in environments that would sideline unprotected salvage vehicles.</p><p>Seven and a half tons of Corning 84 industrial-grade armor provides reasonable protection for a non-combat design, while a single Defiance B3S small laser mounted in the center torso offers minimal self-defense against infantry and opportunistic scavengers. The Hyena trades offensive capability almost entirely for recovery utility, a compromise that has proven highly effective on battlefields across the Inner Sphere.</p>
deployment: |-
  <p>After the destruction of VEST's primary production facilities in Xolara during 3072, engineers working from makeshift workshops managed to construct three units powered by internal combustion engines for the Solaris Home Defense League. The switch to an ICE powerplant reduced the maximum speed to 64 kilometers per hour, and the original small laser was replaced with a machine gun and one ton of ammunition, providing more practical anti-infantry capability for the planetary defense role. These units represented VEST's determination to continue supporting Solaris VII's defenders even after losing their primary manufacturing infrastructure.</p>
history: |-
  <p>The Hyena's origins trace to the arena culture of Solaris VII, where VEST founder Dr. David Vining recognized that recovering damaged BattleMechs from the Game World's varied combat environments demanded a purpose-built machine rather than adapted construction equipment. Founded in 3047, VEST quickly earned a reputation for engineering innovation in BattleMech salvage and repair, and the Hyena represented their most ambitious project.</p><p>The first Hyena prototypes were converted from surplus Kintaro BattleMechs, retaining much of the donor chassis's structure while replacing all weapons systems with specialized salvage equipment. These two prototypes demonstrated that a BattleMech-based salvage platform could access terrain conventional recovery vehicles could not, and could do so at speeds that kept pace with combat formations. The concept proved so successful that VEST developed a dedicated production chassis, the HYN-4A, which entered the market in 3066.</p><p>The Hyena's commercial success was immediate but tragically brief. Every unit from VEST's first and only production run sold quickly, going to mercenary commands, Great House militaries, and Periphery nations. VEST provided a unit at reduced cost to Skibinski's Salvage, a specialized recovery team, as a traveling demonstration of the design's capabilities. During the Jihad, Hyena-equipped salvage teams frequently outpaced competing recovery crews to battle sites, stripping valuable components from destroyed machines before more cumbersome vehicles could even reach the area.</p><p>The Word of Blake's occupation of Solaris VII proved devastating for VEST's production capacity. In 3072, Blakist forces destroyed both surviving Kintaro-based prototypes and VEST's primary production facilities in the city of Xolara. Undeterred, VEST engineers working from improvised workshops managed to produce three ICE-powered variants for the Solaris Home Defense League, demonstrating remarkable adaptability under wartime conditions. With the Hyena unavailable through normal channels, competitors such as the Jabberwocky began attracting former prospective customers.</p><p>Following the Jihad, VEST pursued recovery rather than capitulation. The company issued an initial public offering on the Lyran Alliance Stock Exchange in 3079, raising an estimated 600 million kroner to rebuild facilities and recruit new staff. Several major corporations, including Earthwerks, approached VEST with offers to license or produce the Hyena design, though Dr. Vining and his team repeatedly declined these overtures, preferring to rebuild on their own terms rather than sell from a position of weakness.</p>
