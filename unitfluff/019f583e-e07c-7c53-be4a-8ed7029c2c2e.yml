chassis: "Hunchback"
model: "HBK-LGN-Pin 'Anastasia'"
overview: |-
  <p>The HBK-LGN-Pin Ugly Stepsister Anastasia is a fifty-ton mixed-technology BattleMech fielded by the Solaris dueling stable Team Godmother during the Dark Age. Like its twin, it was not designed so much as assembled, pieced together from the salvaged remains of three unrelated 'Mechs into a single hybrid frame. The team presented it as one half of a matched pair of arena brawlers, cast in the role of a wicked stepsister to fit the stable's Cinderella theme.</p><p>Anastasia took the slower and heavier of the two roles. It is a deliberate close-range bruiser, trading speed and finesse for raw stopping power, and trusts thick protection to carry it into knife-fighting range against flashier opponents.</p>
capabilities: |-
  <p>Anastasia is built around a single overwhelming alpha strike. A heavy large laser pairs with an autocannon/20 to deliver a punishing volume of damage at close range, and a targeting computer tightens the accuracy of both weapons so that those hits land where the pilot intends. Ten double heat sinks comfortably manage the energy weapon's heat, leaving the machine free to fire on the move without risk of shutdown.</p><p>The trade-offs are severe and deliberate. A standard two-hundred-rated fusion engine limits the 'Mech to a walking pace, making it one of the slower mediums in any arena and easy for nimbler opponents to circle. The autocannon carries only a single ton of ammunition, so its heaviest punch is exhausted quickly. Standard armor over the salvaged hybrid frame is generous for the tonnage but offers no special protection, leaving Anastasia reliant on closing the distance before its limited speed and ammunition become liabilities.</p>
deployment: |-
  <p>Within Team Godmother, Anastasia filled the anchor role, the heavy that opponents had to respect before committing. In the close confines of a Solaris arena its lack of speed mattered less, and its ability to cripple or kill with a single exchange made it dangerous to any duelist drawn into a brawl. Crowds knew it as the brute of the pair.</p>
history: |-
  <p>The two machines that became the Ugly Stepsisters began as scrap. Around 3138, technicians working for what would later be organized as Team Godmother cannibalized three very different donor 'Mechs, a Hunchback dating to the early 3050s, an early-production Legionnaire, and a Clan-built Pinion, and recombined their salvageable sections into a matched pair of fifty-ton hybrids. The result honored none of the original designs and instead followed the team's theatrical conceit, a Solaris dueling stable themed around the Cinderella story, with the two brawlers cast as the wicked stepsisters Anastasia and Drizella.</p><p>Team Godmother was a newcomer to the Solaris VII circuit, assembled and trained for the 3146 Royal Fantasy Tournament after several quieter years of preparation. The stable carried no permanent owner of record and was widely understood to be backed by the Federated Suns, fielding three contracted independent gladiators rather than a roster of house pilots. On a world where reputation is won in the arena rather than on the battlefield, the Stepsisters provided the team's heavy muscle, deliberately unlovely machines built to punish opponents who underestimated cobbled-together salvage.</p>
