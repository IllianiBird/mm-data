chassis: "Motorized Duplus Contubernium (MHAF)"
model: "(Flamer 3049+)"
overview: |-
  <p>The Marian Hegemony Armed Forces organize their conventional infantry along Roman legionary lines, with formations structured into contubernia, centuries, and cohorts rather than the squads and platoons used by Inner Sphere armies. A duplus contubernium, or double tent-group, fields two squads of ten soldiers. Motorized duplus contubernia use light vehicles for rapid deployment across Hegemony worlds, trading the staying power of heavier mechanized transport for speed and operational reach on patrol and screening duties. Support troops carry man-portable flamers that project streams of burning chemicals, providing devastating area-effect capability against infantry and structures at the cost of short range and the vulnerability of the operator's fuel tank.</p>
