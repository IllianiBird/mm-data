chassis: "Field Gun Platoon (AFFS)"
model: "(Motorized AC20 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing assault-class autocannon that can crack the armor of any vehicle and threaten even BattleMech limbs, these field gun crews field the heaviest direct-fire weapons available to conventional infantry.</p>
