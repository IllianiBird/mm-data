chassis: "Motorized Platoon (AFFS)"
model: "(LRM 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Motorized platoons ride light vehicles that give them the speed to screen advancing columns, patrol supply routes, and respond to threats faster than foot infantry, though they sacrifice protection for that mobility. Carrying man-portable long-range missile launchers alongside their primary weapons, these platoons can engage armored targets at distances well beyond normal infantry range, providing organic fire support that reduces dependence on dedicated armor or artillery assets.</p>
