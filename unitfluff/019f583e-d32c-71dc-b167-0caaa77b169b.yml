chassis: "Hollander III"
model: "BZK-D3"
overview: |-
  <p>The Hollander III is a thirty-second-century reimagining of the Hollander concept, developed by General Motors at their Kathil facility and entering production in 3114. Rather than a direct evolution of Coventry Metal Works' original design, the Hollander III represents an independent effort to recapture the Hollander's signature combination of outsized firepower on a lightweight, affordable chassis. General Motors' engineers adopted a fundamentally different technical approach, creating a fast-striking light combatant that trades the original's long-range sniping role for aggressive hit-and-run tactics. First adopted by the Armed Forces of the Federated Suns, the design attracted interest from the Lyran Commonwealth Armed Forces and the mercenary market, spawning two additional variants to serve different tactical doctrines.</p>
capabilities: |-
  <p>The Hollander III returns to the original Hollander's thirty-five-ton weight class but takes a dramatically different design approach. Built on a GM BZK-III endo-steel chassis and powered by a GM 175 XL engine, the design incorporates a supercharger that allows brief bursts of speed up to one hundred and eight kilometers per hour, far exceeding the original Hollander's pedestrian pace. A compact gyro frees internal space for the supercharger system, while six tons of StarGuard Reflec armor with CASE II provides meaningful protection against energy weapons, the most common threat in the Dark Age battlefield environment.</p><p>The primary armament, a GM Nova-10 Ultra Class 10 autocannon with three tons of ammunition, trades the original Hollander's extreme range for a higher rate of fire and sustained combat capability. The ultra-class weapon's double-tap capability gives the pilot significant burst damage potential, particularly effective during the high-speed attack runs the supercharger enables. A full-head ejection system on the base model provides an additional margin of safety, acknowledging the risks inherent in combining an XL engine with light armor. The overall design philosophy prioritizes aggressive mobility over the original Hollander's patient, standoff approach.</p>
deployment: |-
  <p>Manufactured for the mercenary sales market from 3118, this variant represents the most radical departure from the Hollander lineage. The entire weapons payload is replaced with an energy-focused suite comprising an ER PPC, two medium lasers, and a small laser, supported by a targeting computer and an Angel ECM suite. This configuration eliminates ammunition dependency entirely while the ECM suite provides electronic warfare capability rare in light 'Mechs. Like the BZK-D2, this variant lacks the full-head ejection system of the base model.</p>
history: |-
  <p>The Hollander III emerged from General Motors' initiative to revive the Hollander concept for a new era. By the early thirty-second century, the original Hollander line had been out of production for decades, its Coventry factories never having fully recovered from the Jihad. General Motors, recognizing the enduring demand for an affordable light 'Mech with heavy firepower, developed the Hollander III at their established Kathil facility, leveraging existing production infrastructure rather than attempting to rebuild Coventry's manufacturing capability.</p><p>Production began in 3114, with the Armed Forces of the Federated Suns receiving the first BZK-D1 models. The design quickly found favor in Periphery March garrisons, where its firepower and speed made it an effective deterrent against pirate raids. Hollander IIIs became common throughout the Capellan March as well, frequently serving as ambush elements against raiders attempting to exploit the region's long borders.</p><p>The Lyran Commonwealth Armed Forces expressed interest almost immediately, leading to the BZK-D2 variant in 3115, while General Motors expanded their market by offering the energy-focused BZK-D3 to mercenary buyers beginning in 3118. The design's versatility and General Motors' reputation for reliable production ensured steady sales across multiple factions.</p><p>Hollander IIIs gained broader notoriety through several high-profile engagements, including the defense against pirate raids on Bastille and the ill-fated defense of Abruzzi in 3145, where a mercenary company of Hollander IIIs was overwhelmed by a Capellan Hussars task force in a brutally one-sided engagement that illustrated both the design's firepower and its vulnerability when employed as a line combat unit rather than in its intended hit-and-run role.</p>
