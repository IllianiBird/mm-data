chassis: "Quasit"
model: "QUA-51M MilitiaMech"
overview: |-
  <p>The Quasit is a forty-five-ton IndustrialMech created in 2517 by the partnership of Concordat Telecom and the TransStellar Company, collectively known as CT&T. Originally armed with military-grade weaponry and marketed under questionable pretenses, the design eventually found a legitimate niche as a MilitiaMech supporting planetary militia forces throughout the Taurian Concordat and the wider Periphery.</p><p>The Quasit's fusion engine and heavy industrial armor give it capabilities that overlap with lighter BattleMechs, though its industrial-grade cockpit lacks an ejection seat. Production has continued at CT&T's New Vandenberg facility for over five centuries, making it one of the longest-running IndustrialMech production lines in the Periphery.</p>
capabilities: |-
  <p>The Quasit's combat effectiveness stems from a surprisingly capable weapons loadout for an IndustrialMech. A Fairway 5 LRM launcher provides limited long-range fire support, allowing the Quasit to soften targets before closing to effective range. At shorter distances, a Chipshot SRM 4 rack and Diverse Optics Type II medium laser deliver respectable firepower, while a Pepper machine gun handles anti-infantry duties. This layered weapons approach gives militia forces a credible fire support platform that can engage at multiple range bands.</p><p>The VOX 225 fusion engine propels the forty-five-ton chassis to a respectable eighty-six kilometers per hour, granting mobility comparable to many medium BattleMechs. Seven and a half tons of Lexington Limited Heavy Industrial armor provides better protection than most IndustrialMechs, though it remains particularly inferior to standard BattleMech-grade plating. Environmental sealing allows the Quasit to operate in vacuum, underwater, and contaminated atmospheres, partially compensating for the design's fundamental industrial-grade limitations.</p><p>The most significant drawback remains the undersized cockpit, which leaves no room for an ejection seat. MilitiaMech pilots must accept this risk, making the Quasit a commitment that demands careful employment by commanders who value their personnel.</p>
deployment: |-
  <p>Introduced in 3073 during the Jihad, the QUA-51M streamlines the original Quasit's missile armament by replacing the separate LRM-5 and SRM-4 launchers with a single MML-5 system. Two tons of ammunition provide flexibility to carry both long-range and short-range missile loads, maintaining comparable firepower with a more versatile delivery system. The weight savings allowed CT&T to mount a second medium laser, significantly improving the Quasit's direct-fire capability. This variant saw distribution to worlds along both edges of the Word of Blake Protectorate during the Jihad, extending the Quasit's reach beyond its traditional Taurian markets.</p>
history: |-
  <p>The Quasit's origins are intertwined with the early history of Periphery arms dealing. When Concordat Telecom partnered with the TransStellar Company in the early twenty-sixth century, BattleMechs were barely known outside the Great Houses. CT&T exploited this ignorance, creating an IndustrialMech with military-grade weapons and selling it as a genuine BattleMech to remote settlements. The Newton brothers became notorious practitioners of this scheme, traveling to isolated worlds and staging dramatic demonstrations before selling lances of the machines at inflated prices.</p><p>The scam unraveled on Brixtana when the Newtons were ambushed during a demonstration by locals who had purchased Quasits from Lynn's World and discovered their true limitations. The Taurian Concordat intervened, and CT&T's fraudulent marketing practices were brought to an end. Despite this ignominious beginning, the company found legitimate success once they repositioned the Quasit as a MilitiaMech, filling a genuine need for affordable armed platforms among Periphery planetary militias that could not obtain or maintain true BattleMechs.</p><p>Production continued at New Vandenberg throughout the Succession Wars, though at reduced levels as the broader economic decline affected even the Periphery arms trade. Demand for the Quasit diminished as genuine BattleMechs gradually became more accessible in the Periphery, but never disappeared entirely. Cash-strapped planetary governments continued to purchase the design when nothing else was available or affordable.</p><p>The Jihad era brought renewed interest in the Quasit. As the Word of Blake's campaign disrupted supply chains across the Inner Sphere, demand for any available armed platform surged. CT&T responded with modernized variants incorporating advanced weapon systems like multi-missile launchers and plasma rifles. These Jihad-era models found buyers on worlds along both flanks of the Blake Protectorate, significantly expanding the Quasit's traditional Taurian market for the first time in centuries. Production has continued into the post-Jihad era, with CT&T maintaining the design as one of the most affordable armed platforms available in the Periphery.</p>
