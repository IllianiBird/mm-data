overview: |-
  <p>Under the reforms of Precentor Martial Anastasius Focht, Com Guard infantry train extensively in combined-arms cooperation, conducting regular exercises alongside heavier elements to ensure seamless coordination across all branches when battle demands it. Towing crew-served autocannon rated for light suppressive fire, these field gun crews deliver sustained ballistic firepower at ranges well beyond personal weapons, providing area denial capability against infantry and light vehicles.</p>
