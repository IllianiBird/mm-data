chassis: "Mechanized Hover Level I (ComGuards)"
model: "(Flamer)"
overview: |-
  <p>The Com Guards field conventional infantry as a core component of their combined-arms formations, with Level I infantry units integrated into the same command structure alongside BattleMech, armor, and aerospace elements at every organizational level. Mechanized hover Level I formations are the fastest ground-mobile infantry in the Com Guards, using hovercraft APCs that can cross water obstacles and open terrain at speeds no wheeled or tracked transport can match. Their speed makes them valuable for flanking maneuvers and rapid exploitation of breakthroughs. Armed with man-portable flamers that project streams of ignited fuel, these troops carry one of the most psychologically devastating weapons available to conventional infantry, effective at clearing fortified positions and enclosed spaces at the cost of extreme danger to the operator.</p>
