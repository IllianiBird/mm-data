overview: |-
  <p>Word of Blake Militia infantry served as the backbone of Protectorate garrison forces across dozens of conquered worlds, providing the manpower for territorial control that the Militia's BattleMech and armor assets could not sustain alone. Operating medium-caliber rotary autocannon capable of sustained high-rate fire, these crews can shred infantry formations and strip armor from light vehicles through continuous bombardment, though ammunition consumption is extreme.</p>
