chassis: "Field Gun Platoon (AFFS)"
model: "(Tracked RAC2 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing rotary autocannon that fire in rapid bursts, these field gun crews deliver a volume of sustained fire that suppresses enemy positions more effectively than single-shot weapons of comparable caliber.</p>
