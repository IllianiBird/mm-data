overview: |-
  <p>Under the reforms of Precentor Martial Anastasius Focht, Com Guard infantry train extensively in combined-arms cooperation, conducting regular exercises alongside heavier elements to ensure seamless coordination across all branches when battle demands it. Crewing medium cluster-munition autocannon, these gunners can switch between solid shot for armor penetration and cluster rounds for anti-personnel saturation, giving the formation tactical flexibility in a single weapon system.</p>
