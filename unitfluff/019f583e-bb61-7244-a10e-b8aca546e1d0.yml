chassis: "Clan Mechanized Tracked Point"
model: "(Mauser 960 Basic)"
overview: |-
  <p>Most Clan infantry are solahma warriors at the end of their careers or who have failed their Trials, assigned to duties the warrior caste considers beneath notice. Mechanized Tracked Points travel in tracked armored personnel carriers that offer all-terrain capability at the cost of speed. Tracked vehicles handle rough ground, mud, and snow better than wheeled alternatives, making these Points reliable in difficult terrain where faster formations would bog down. Equipped with Mauser 960 laser systems, a respected Inner Sphere-manufactured weapon that provides solid energy weapon capability at a fraction of the cost of Clan-produced equivalents.</p>
