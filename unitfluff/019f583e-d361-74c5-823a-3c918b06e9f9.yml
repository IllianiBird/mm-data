chassis: "Wendigo"
model: "(Prime)"
overview: |-
  <p>The Wendigo is a 50-ton Clan OmniMech introduced in 3135, designed and produced by Clan Nova Cat scientists at the LAW-Avon Alpha facility on Avon in cooperation with the Draconis Combine's Luthien Armor Works. The design emerged from the Clan's dissatisfaction with the Avalanche, a joint Combine-Nova Cat OmniMech that failed to meet the warrior caste's expectations. Using the Avalanche as a foundation, Nova Cat technicians employed exclusively Clan technology to produce a faster, more capable medium brawler that better reflected their warriors' aggressive fighting doctrine.</p><p>The Wendigo entered service just as the Draconis Combine launched its invasion of the Republic of the Sphere, and quickly proved itself as Clan Nova Cat's premier frontline OmniMech. Production at LAW-Avon Alpha was severely damaged during the Nova Cat Rebellion in 3143, and following the Clan's destruction, surviving Wendigos were dispersed among the Draconis Combine and Clan Sea Fox.</p>
capabilities: |-
  <p>The Wendigo is a significant improvement over its Avalanche predecessor through the exclusive use of Clan technology. Built on a Mynx Type Medium Endo Steel chassis and powered by a Consolidated 300-rated XL fusion engine, the design achieves a top speed of 97 kph, giving it excellent mobility for a medium OmniMech. A torso-mounted cockpit provides additional protection for the MechWarrior, relocating this critical component away from the easily targeted head. The 9.5 tons of Gamma Special Reflective armor offer specialized defense against energy weapons, a design choice that reflects the increasing prevalence of laser-heavy configurations across the battlefields of the thirty-second century.</p><p>With 19.5 tons of pod space and twelve double heat sinks, the Wendigo supports a wide variety of combat loadouts. The Primary configuration balances engagement ranges with an Ultra Autocannon/2 and LRM-10 for long-range fire, four ER medium lasers for punishing medium-range volleys, and a Streak SRM-6 for close-quarters work. This versatile armament allows the Wendigo to contribute effectively at virtually any range band, though the reflective armor's vulnerability to ballistic and missile weapons means pilots must remain aware of the threat environment.</p><p>The chassis's principal limitation is its reliance on reflective armor, which provides diminished protection against autocannon and missile fire compared to standard plating of equivalent weight. Against energy-heavy opponents the Wendigo is exceptionally resilient, but combined-arms formations can exploit this weakness if the pilot is not careful to manage engagement angles.</p>
deployment: |-
  <p>The Primary configuration of the Wendigo provides balanced firepower across all engagement ranges. An Ultra Autocannon/2 and LRM-10 deliver sustained long-range harassment, while four ER medium lasers form the design's primary striking power at intermediate distances. A Streak SRM-6 rounds out the armament for close-quarters engagements, ensuring no wasted ammunition with its lock-on-only firing mechanism. This versatile loadout made this variant the standard combat configuration throughout Clan Nova Cat's invasion of the Republic of the Sphere, and it remains the most commonly encountered Wendigo configuration in Draconis Combine service.</p>
history: |-
  <p>The Wendigo's origins trace to the long and frustrating collaboration between Clan Nova Cat and the Draconis Combine's Luthien Armor Works during the early thirty-second century. The Avalanche OmniMech, the product of that partnership, was intended to modernize the Nova Cat touman but proved to be a Combine design wearing a Clan badge rather than a true Clan machine. Nova Cat scientists, still recovering from the devastation of the Second Combine-Dominion War, took the Avalanche's basic chassis concept and rebuilt it entirely with Clan technology, producing the Wendigo at the LAW-Avon Alpha facility on Avon.</p><p>The design entered service in 3135, coinciding with the Draconis Combine's invasion of the Republic of the Sphere. Every Clan Galaxy deployed Wendigos during the campaign, with early prototype models seeing combat alongside the refined production version. The Wendigo quickly became the backbone of the Nova Cat frontline touman, earning a reputation for aggressive close-range engagements that suited the Clan's warrior culture.</p><p>The Nova Cat Rebellion of 3143 proved catastrophic for both the Clan and its signature OmniMech. When the First and Second Amphigean Light Assault Groups arrived at Avon to crush the rebellious Nova Cats, they encountered Clan Nova Cat's Gamma Galaxy defending the production facilities. The fighting was brutal, with Gamma Galaxy's Wendigos clashing with Combine forces in and around the LAW-Avon facility. The engagement left both light assault groups gutted and the factory partially demolished. Following the rebellion's conclusion and the effective destruction of Clan Nova Cat, the Draconis Combine assumed full control of the damaged facility.</p><p>In the aftermath, Clan Sea Fox moved to acquire Nova Cat assets. The Combine offered Sea Fox traders the opportunity to purchase some of the dead Clan's equipment, and in exchange the Sea Foxes provided industrial assistance in dismantling and relocating portions of the Nova Cat production infrastructure. Sea Fox warriors conducted Trials of Possession for remaining Wendigo stocks, gaining several Stars of the OmniMech along with parts and supplies. The Wendigo continues to serve in both Combine and Sea Fox forces, though production remains limited by the damage sustained during the rebellion.</p>
