chassis: "Ostscout"
model: "OTT-8J"
overview: |-
  <p>The Ostscout was designed for one purpose: scouting. Introduced in 2600 by Ostmann Industries, this 35-ton light 'Mech was built entirely around gathering intelligence and escaping danger. Its exceptional speed and maneuverability allow it to avoid trouble easily, though its minimal armament means it can only engage the lightest opponents with any hope of success. Enhanced sensor arrays and a high-resolution targeting and tracking system supply the Ostscout with a constant stream of data about its surroundings, while powerful narrow-band communications equipment allows it to report from deep inside enemy territory.</p><p>As demand for the design grew beyond Ostmann's production capacity, the company licensed Kong Interstellar Corporation to begin manufacturing in 2700, following a similar arrangement previously established for the Ostsol. The Ostscout became so valuable during the Succession Wars that commanders hoarded them like treasures, deploying them only for the most critical reconnaissance missions.</p>
capabilities: |-
  <p>The Ostscout's primary feature is pure speed. Its VOX 280 fusion engine, typically mounted on designs twice its size, propels the 'Mech to a maximum speed of 129.6 kilometers per hour. Combined with a 240-meter jump capability provided by eight Ostmann Sct-A jump jets, only the Spider can match its maneuverability. This agility serves as the 'Mech's true protection, as the four-and-a-half tons of Durallex Light armor offers only modest defense against concentrated fire.</p><p>The Ostscout's combat capability is severely limited by design. A single Tronel II medium laser represents its entire offensive armament, mounted only after test pilots aggressively protested the original weaponless configuration. Ten heat sinks easily manage this minimal heat load, allowing the 'Mech to jump and fire simultaneously without overheating.</p><p>The true centerpiece of the design is its advanced sensor suite. The arm-mounted sensor arrays were installed outside the main chassis to avoid magnetohydrodynamic interference, with the 'Mech using its actuator systems to aim them. During maximum-intensity scanning, the Ostscout must move slowly while waving its arrays in seemingly random patterns, making it briefly vulnerable. However, if the first enemy salvo fails to cripple it, the 'Mech will almost certainly escape.</p>
deployment: |-
  <p>Produced by the Combine-controlled Robinson Standard BattleWorks, the 8J shares many components with the facility's Ostsol line while upgrading the Ostscout's electronics to modern standards. A GM 280-rated XL engine frees weight for an Angel ECM suite and Bloodhound active probe, while the original medium laser gives way to a Martell-X medium X-pulse laser supported by double heat sinks. Six tons of StarGuard ferro-fibrous armor provides substantially improved protection. Highly prized by the Draconis Combine, the first units produced were gifted to the Seventh Sword of Light.</p>
history: |-
  <p>Ostmann Industries built and sold the Ostscout starting in 2600 to fulfill many armies' need for a swift reconnaissance 'Mech. When demand outstripped their production capacity, rather than sacrifice their popular Ostroc line, Ostmann licensed Kong Interstellar to begin production in 2700. Kong continued building Ostscouts for a century until the destruction of their factory on Connaught in 2802 at the outset of the Succession Wars. Deprived of replacements, commanders began hoarding their Ostscouts, parceling them out only for special missions, and most pilots would not even attempt to engage enemy 'Mechs given the irreplaceable nature of the advanced sensor systems.</p><p>The Ostscout's battle history reads as a series of daring missions deep behind enemy lines. During the Rebellion of 3010, Janos Marik used Ostscouts extensively to gather information on rebel movements and strengths. In early September 3021, four Ostscouts were dropped over New Ivaarsen by Draconis Combine DropShips to scout landing sites for a Kurita invasion force, spending five weeks evading Davion patrols while accumulating critical intelligence. The most famous exploit came in 3024 during the "Thousand Kilometer Chase," when a Capellan Ostscout pilot evaded Smithson's Chinese Bandits for ten hours, accumulating enough intelligence to enable a successful Confederation counter-attack.</p><p>ComStar also utilized the Ostscout, and following the Clan Invasion and ComStar Schism, developed a new variant maintaining the original's capabilities while improving offensive and defensive profiles. Debuting successfully in 3064, nearly half of all Com Guard Ostscouts were upgraded within three years. However, it was soon discovered that both the Lyran Alliance and Word of Blake were fielding identical variants. The intelligence leak was traced to Dag Kesselring, former Precentor of the Sixty-sixth Division, who had passed information to both the Lyrans and Blakists.</p><p>Following the Jihad, the newborn Republic of the Sphere maintained production of upgraded Ostscout models from former Word of Blake factories on Terra, selling them to the Federated Suns and Lyran Commonwealth. During the Dark Age era, Kong Interstellar reestablished production and formed an alliance with Clan Sea Fox to produce variants incorporating stealth technology and Clan weaponry, while Robinson Standard BattleWorks began manufacturing models highly prized by the Draconis Combine.</p>
