chassis: "Zeus"
model: "ZEU-5T"
overview: |-
  <p>The Zeus is an eighty-ton assault BattleMech first built by Defiance Industries on Hesperus II for the Lyran Commonwealth in 2787, just as the First Succession War began. Built at the request of Lyran Commonwealth Armed Forces commanders for a new light-assault 'Mech designed to engage the enemy at long range and perform hit-and-run attacks, the Zeus filled a critical gap in the Lyran arsenal. The design quickly became the pride of the LCAF, serving as the quintessential Lyran assault platform for over three centuries. Defiance Industries' exclusive production at Hesperus II ensured a steady supply, though it also made the design's availability dependent on the security of that single vital world. The Zeus earned a reputation for rugged dependability and versatile combat performance that few assault designs of any era have matched.</p>
capabilities: |-
  <p>The Zeus is fast enough to keep up with most heavy 'Mechs, and with a sturdy frame, eleven and a half tons of standard armor and a versatile weapons array, is equally capable of defeating them. Its use of reliable, low-maintenance and easily modified systems at a time when most 'Mechs were built with cutting-edge technology also proved fortuitous, allowing the Zeus to be produced long after those advanced components had become Lostech.</p><p>The standard Zeus carries a mix of ballistic, missile, and energy weapons covering all engagement ranges. A primary weapon in the left arm provides long-range striking power, backed by a missile launcher in the right arm for sustained indirect or direct fire support. A large laser in the left torso handles intermediate engagements, while paired medium lasers address close-range threats and rear-arc defense. This combination ensures the Zeus remains dangerous at any distance, though pilots must manage heat carefully during sustained engagements. The design's eighty-ton chassis achieves a maximum speed of sixty-four kilometers per hour, unusually fast for an assault platform and a deliberate choice by Defiance's engineers to support the hit-and-run doctrine Lyran commanders envisioned.</p>
deployment: |-
  <p>One of the two original models of the Zeus, it was similar to the 5S with an LRM-15/Artemis IV combination and an extended range large laser, but was equipped with an ER PPC. The use of ferro-fibrous armor increased the 'Mech's protection and seventeen double heat sinks kept the entire machine cool.</p>
history: |-
  <p>Three years before its release, the first two prototypes of the Zeus would have their first "test run" when they were forced to repel an attack on the Hesperus II factory by the Draconis Combine Mustered Soldiery. As the enemy pushed through Lyran lines, the two 'Mechs were summoned to aid, and through sheer novelty and long-range firepower, the Kuritans were forced to pause. This enabled more reinforcements to push back DCMS forces. While these prototypes were effective in repelling the attack, they were considerably more advanced than the commercial model and armed with a PPC, which proved unpredictable and unreliable during the combat. Inadequate shielding caused wild magnetic interactions between the weapon and the Zeus' engine, which was later revealed to be the source of this behavior. To guarantee that the Zeus arrived at the front lines as soon as possible, the complex energy weapon was replaced with a basic autocannon. The 'Mech initially appeared in substantial numbers after the 15th Lyran Guards regained the planet Sakhalin, and the Zeus had a long and storied history within the Commonwealth during the Succession Wars, becoming a well-respected assault 'Mech. Engineers were able to put a PPC on the Zeus again after the end of the Third Succession War, with the resulting ZEU-6T variant being the standard during the Fourth Succession War and later the War of 3039. The design was also well received by mercenary units, particularly the Zeta Battalion of Wolf's Dragoons.</p><p>During the formation of the Federated Commonwealth, the Zeus would meet opposition from some former AFFS troops, whose "Davion pride" barred them from using the 'Mech despite its superiority to many of their own machines. Similarly, as the FedCom military began to take on a Davion character, many Lyran commanders insisted that their pride and joy was too vital to give up, and so urged Defiance Industries to build new models that included freshly recovered Star League Lostech. With the introduction of the ZEU-9S Zeus, production of the earlier variations would be halted, and samples of this hallmark Lyran 'Mech would be distributed throughout the Commonwealth as a symbol of the new partnership. However, at the time of the FedCom Civil War, the majority of Zeus 'Mechs were in Lyran hands, with many of those assigned to Davion units relegated to rear-guard duty or sold to mercenaries. The LAAF and, following their takeover of Hesperus II in 3070, the Word of Blake Militia would continue to receive new variations.</p>
