chassis: "Yurei"
model: "S-YR-1LAM"
overview: |-
  <p>The Yurei is a forty-ton medium Land-Air BattleMech and the middleweight member of the Word of Blake's Spectral LAM series. Designed by Master's Wings Aerospace on Gibson and entering service in 3077, the Yurei drew its name from vengeful spirits of ancient Japanese folklore. Intended to serve as the workhorse of the three-design series alongside the lighter Pwwka and heavier Waneta, the Yurei was built exclusively for the elite Manei Domini and produced in very limited numbers. Like its stablemates, it represented a brief, final revival of LAM technology on the modern battlefield, a concept most military analysts had long considered extinct.</p>
capabilities: |-
  <p>The Yurei is built on a Spectral-L Series YR1L chassis and powered by a Nissan 200 standard fusion engine, giving it a maximum ground speed of eighty-six kilometers per hour. Five GM ATO 100 jump jets provide a jumping range of one hundred fifty meters, with performance in aerospace fighter and AirMech modes supplemented by a single ton of fuel. A small cockpit paired with a VDNI interface allows Manei Domini pilots to manage the demanding requirements of LAM conversion, though it renders the machine effectively unusable by conventional MechWarriors.</p><p>The Yurei's armament consists entirely of Clan-grade energy weapons whose exact source remains unknown. A single Clan ER large laser serves as the primary weapon, supported by two Clan ER medium lasers. A one-ton internal bomb bay protected by CASE II provides limited ordnance delivery capability and gives the airframe a chance of surviving catastrophic internal hits. Ten double heat sinks manage the thermal load efficiently. Eight tons of Durallex Divine Protector standard armor provide solid protection for the weight class, falling just half a ton short of maximum coverage.</p><p>Despite these technologies, the Yurei remains an unremarkable performer in either BattleMech or aerospace fighter roles. Most dedicated medium designs can outrun and outgun it. Its true advantages lie in the shock value of its transformation capability, the quality of Clan weaponry squeezed into a tight frame, and the exceptional skills of its Manei Domini pilots.</p>
deployment: |-
  <p>The sole production model, this variant was deployed exclusively by Word of Blake Manei Domini formations during the final years of the Jihad. It was observed in combat only against forces from the Principality of Regulus and the Duchy of Oriente, and no variants were identified as of 3081. Given the limited engagements in which the Yurei appeared, it is possible that other configurations existed but were never encountered by coalition forces.</p>
history: |-
  <p>The Yurei emerged from a secret Word of Blake program to revive Land-Air BattleMech technology, a field of military engineering that had been considered dead since the destruction of the last LAM factory on Irece during the Clan Invasion of 3050. The Spectral LAM series, comprising the thirty-ton Pwwka, the forty-ton Yurei, and the fifty-five-ton Waneta, were designed and built at facilities on both Gibson and Terra. The Yurei was produced at Master's Wings Aerospace on Gibson, a facility that had previously operated as the Brigadier Corporation's DropShip repair yard before the Word of Blake seized control of the planet and converted the lines for military aerospace production.</p><p>The Spectral LAM series first emerged around 3075, with the Yurei entering service approximately 3077. It enjoyed roughly a year as the most advanced design in the series before the heavier Waneta began rolling off assembly lines on Gibson and Terra. The appearance of the Spectral LAMs came as a genuine shock to both the allied coalition and the Principality of Regulus, as conventional wisdom held that LAM technology was an extinct relic of the Star League era. However, the surprise proved short-lived, and the fundamental limitations that had plagued earlier LAM designs continued to constrain the Spectral series despite its use of advanced technology and pilot augmentation.</p><p>The Yurei's production run was brutally short. In late 3078, forces from the Principality of Regulus launched a devastating assault on Gibson, conducting orbital bombardment on a planetary scale that targeted every major population center and industrial site. The Master's Wings Aerospace facility was destroyed along with virtually all other manufacturing infrastructure on the planet. With no known alternate production sites and the Word of Blake's final defeat in the Liberation of Terra, the Yurei became an effectively extinct design by 3081. What little is known about its specifications comes almost entirely from studying salvage recovered after combat engagements.</p>
