chassis: "Albatross"
model: "ALB-3U"
overview: |-
  <p>The Albatross was born from Project Omega, a Free Worlds League Military initiative launched in late 3052 to develop an assault 'Mech capable of confronting Clan OmniMechs. Irian BattleMechs Unlimited delivered the design after a remarkably swift development cycle, and at 95 tons, the Albatross filled the role of a generalist assault 'Mech intended to engage threats at all ranges. The initial production run was reserved for the Knights of the Inner Sphere, cementing the design's early reputation as a prestige platform rather than a frontline workhorse. Despite a troubled legacy following the Jihad, the Albatross has endured across multiple eras, serving the Free Worlds League, the Marik-Stewart Commonwealth, and eventually the Wolf Empire in successive incarnations.</p>
capabilities: |-
  <p>The Albatross employs a GM 380 XL engine to achieve a top speed of 65 kph, making it one of the faster assault 'Mechs in the Inner Sphere's inventory, though this speed comes at a significant cost in structural resilience. The extralight engine's vulnerability to side torso damage has earned the design a reputation for fragility unusual among 95-ton platforms, a perception reinforced by the relatively modest thirteen tons of StarSlab/3 armor protecting the original chassis. CASE protection for the ammunition bays mitigates the risk of catastrophic explosion but does little to address the fundamental survivability concern.</p><p>The weapon loadout reflects a deliberate generalist philosophy, eschewing specialization in favor of versatility. An Oriente Model O LB 10-X autocannon and Diverse Optics Sunbeam extended-range large laser anchor the long-range engagement envelope, supported by an Irian Weapons Works V7 LRM-15 rack for indirect fire capability. A Tronel PPL-20 large pulse laser bridges the gap to medium range, while an Irian Weapons Works 60mm SRM-6 launcher and twin Super 6 medium lasers provide close-range firepower. Fourteen double heat sinks manage the thermal load, though sustained fire across all weapon systems quickly overwhelms the cooling capacity and forces MechWarriors to exercise strict fire discipline.</p>
deployment: |-
  <p>The original Albatross emerged from Project Omega in 3053, fielding a diverse all-range weapons suite built around an LB 10-X autocannon, extended-range large laser, LRM-15 rack, large pulse laser, SRM-6, and twin medium lasers. This eclectic armament allows the 'Mech to contribute meaningfully at any engagement distance, though the reliance on a GM 380 XL engine and just thirteen tons of standard armor leaves the design more vulnerable than many assault commanders would prefer. CASE provides some protection against ammunition detonation. Initially restricted to the Knights of the Inner Sphere, this variant gradually saw wider distribution among Free Worlds League Military prestige formations following Operations Guerrero and Bulldog.</p>
history: |-
  <p>Project Omega represented a turning point in Free Worlds League military doctrine. While the League had profited handsomely from selling arms to the other Great Houses during the Clan Invasion, League strategists recognized that this advantage was temporary. If the Clans defeated the Federated Commonwealth, the Free Worlds League would be next. The urgency of this realization drove Irian BattleMechs Unlimited to compress what would normally be a years-long development program into mere months, delivering the first Albatross in 3053.</p><p>The first Albatrosses never reached FWLM line units. Captain-General Thomas Marik directed the entire initial production run to his Knights of the Inner Sphere, the neo-chivalric order he had established to embody League ideals. For nearly a decade, the Albatross remained the exclusive province of these elite formations. Only after Operations Guerrero and Bulldog demonstrated the 'Mech's combat effectiveness did the design begin filtering to other prestige FWLM commands, with limited exports to the League's closest allies.</p><p>The Jihad shattered both the Knights and the Albatross's reputation. The idealism that the Knights represented died in the carnage of the Word of Blake's campaign, and the Albatross became inextricably linked with the shame of the united Free Worlds League's collapse. The Word of Blake's seizure of the Irian production facility and development of the radical ALB-5W variant only deepened the stain on the design's legacy.</p><p>Post-Jihad, the Albatross found new purpose at Irian BattleMechs Unlimited's Washburn facility, where a succession of variants entered production for the Army of the Marik-Stewart Commonwealth. The ALB-6U became the signature assault 'Mech of the AMSC, seeing its first major combat during the Commonwealth Secession Crisis of 3119 when Albatrosses fought on both sides of the clashes on Midkiff. Operation Hammerfall landed squarely on the Thirteenth Atrean Dragoons during the Battle of Uhuru, where the Albatross's solid performance in the AMSC's doomed defense helped rehabilitate the design's reputation.</p><p>The re-formed Free Worlds League's forced cession of the Washburn factory to the Wolf Empire opened the final chapter in the Albatross's history. Clan Wolf's desperate need for a replacement for the lost Night Wolf led to a crash retooling of the production line with Clan technology. The resulting Albatross C, derisively dubbed the "Sooty Albatross" by Wolf warriors, was considered a pale imitation of the Night Wolf. Plans to mass-produce the design were shelved until Star Colonel Othar's desperate rearmament program forced the issue, and even then, assignment to the Sooty Albatross was thought to be an ill omen within the Wolf Empire's touman.</p>
