chassis: "Talos"
model: "TLS-1B"
overview: |-
  <p>The Talos was conceived in 2521 when the Taurian Defense Force solicited requirements for a new domestically-produced BattleMech to counter the increasingly advanced designs fielded by the Capellan Confederation and Federated Suns. Vandenberg Heavy Industries, one of the Taurian Concordat's largest IndustrialMech manufacturers, formed its Vandenberg MilTech division specifically to answer this call. After nearly a decade of development, Vandenberg MilTech delivered the TLS-1B Talos to the TDF in 2532.</p><p>A fifty-ton medium 'Mech emphasizing ease of production and simplified logistics, the Talos proved immediately popular with Taurian MechWarriors and became the backbone trooper 'Mech of the TDF through the 2540s. Its financial success and reputation for reliability led to strong export sales across the Periphery, ensuring the design remained in continuous production for nearly five decades.</p>
capabilities: |-
  <p>The Talos was designed first and foremost around heat management, a direct response to TDF MechWarriors' persistent complaints about the poor thermal performance of contemporary designs. As a medium BattleMech, the Talos required less maintenance than the heavier designs favored by the Federated Suns and Terran Hegemony, while its compact stature simplified DropShip loading and transport logistics. The design achieves a top speed of 64 kph, matching or exceeding the average speed of most 'Mech designs of its era, though it lacks jump jet capability entirely.</p><p>The Talos relies on a proven combination of autocannon and missile systems arranged for layered fire to optimize heat dissipation. The Westen Heavy Autocannon class-10, mounted in the lower right arm, serves as the primary weapon and earned widespread praise among Taurian armor crews for its accuracy and stopping power. This is supplemented by a pair of shoulder-mounted Delta Dart long-range missile racks and a Delta Bolt short-range missile system, giving the Talos engagement capability across all range brackets. Eight and a half tons of Hoyt StarPlate armor provide solid protection for a design of its tonnage, allowing the Talos to absorb considerable punishment while closing to effective engagement range. The trade-off for this thermally efficient loadout is complete ammunition dependency; once its magazines run dry, the Talos is effectively defenseless.</p>
deployment: |-
  <p>This variant represents the sole production model of the Talos, entering service with the Taurian Defense Force in 2532. No official factory variants were ever produced by Vandenberg MilTech or the TDF, though the design's widespread service across multiple Periphery nations led to extensive field customization, making the Talos one of the most individually modified designs during the Reunification War.</p>
history: |-
  <p>The Taurian Defense Force accepted its first Talos BattleMechs in the spring of 2532, and by the end of the decade the design had been distributed to every Taurian BattleMech regiment, rapidly displacing older and less capable designs still in frontline service.</p><p>Vandenberg MilTech continued full production of the Talos for nearly five decades, proving the design a considerable financial success. Just over half of total production was exported beyond the Concordat's borders, with significant sales to the militaries of the Rim Worlds Republic, the Magistracy of Canopus, and even the Outworlds Alliance. The Talos also found buyers among less-developed Inner Sphere powers seeking affordable, proven medium BattleMechs for their nascent military forces.</p><p>As military technology and doctrine matured through the mid-twenty-sixth century, the TDF found itself requiring ever more capable designs to meet emerging threats. Vandenberg MilTech was prompted to rotate the Talos out of production shortly after the start of the Reunification War in 2575, as technological advances had rendered the design increasingly obsolete against Star League Defense Force equipment.</p><p>Despite the cessation of manufacturing, the sheer number of Talos BattleMechs already produced ensured the design's continued presence on battlefields for generations. The hardy 'Mechs remained in active service within Periphery armies and as second-line assets for Inner Sphere formations well into the early Succession War era, a sign of the rugged simplicity that had defined the design from its inception. The Talos's role in the Reunification War was particularly notable, as its widespread availability led to the design being one of the most customized BattleMechs of the conflict, with individual units and garrisons applying a dizzying array of field modifications to adapt the venerable chassis to rapidly evolving battlefield conditions.</p>
