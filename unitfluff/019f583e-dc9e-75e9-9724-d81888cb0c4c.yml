chassis: "Phoenix Hawk 'Hammer Hawk'"
model: "PXH-1S"
overview: |-
  Debuted by the Ironclad Alliance, the PXH-1S was designed as an arena duelist and close-quarters ambusher for urban environments. Central to this concept is its five-ton, hammer-shaped mace, earning the variant its "Hammer Hawk" nickname. A smaller engine and the replacement of medium lasers and machine guns with a pair of light blazers accommodate the melee weapon without sacrificing too much firepower.
capabilities: |-
  An ambush fighter built for dense terrain where jump jets allow rapid closing to melee range. Ranged firepower keeps opponents honest during the approach, but the real threat comes at arm's length. Pilots who overcommit in open ground will find the reduced top speed leaves them exposed during withdrawal. Works best operating in pairs with a conventional fire-support lance mate.
