overview: |-
  <p>The Beowulf is a forty-five-ton medium BattleMech introduced in 3059 by Odin Manufacturing as a ComStar initiative to replace the aging Mongoose reconnaissance platform. Nearly twice the mass of its predecessor, the Beowulf represented a deliberate shift toward a heavier, more capable scout that could address the older design's chronic shortcomings in firepower and survivability. Designed for extended independent operations behind enemy lines, the Beowulf filled a critical gap in ComStar's force structure at a time when the organization was rebuilding its military capabilities following the loss of Terra. First entering service with the Com Guards, the Beowulf proved successful enough that its chassis eventually formed the basis for several variants and the Clan-technology Beowulf IIC produced for the Ghost Bear Dominion.</p>
capabilities: |-
  <p>The Beowulf achieves its reconnaissance mission through a combination of speed, advanced electronics, and sufficient firepower to fight its way out of contact. A GM 270 XL engine drives the chassis to speeds approaching one hundred kilometers per hour, while a MASC system can push that to nearly one hundred and thirty in short bursts, allowing the Beowulf to keep pace with most light 'Mechs. Six Odin Type II jump jets provide one hundred and eighty meters of jump capability for navigating rough terrain, giving the design excellent tactical flexibility.</p><p>The Beowulf's electronics suite is particularly noteworthy for a medium scout. A Beagle active probe detects hidden units while a TAG system allows the 'Mech to designate targets for Arrow IV artillery strikes, making it as much a force multiplier as a direct combatant. Primary armament consists of a Blankenburg large pulse laser supported by two Diverse Optics extended-range medium lasers, providing accurate firepower at medium ranges. Eight and a half tons of Wall Type 6 ferro-fibrous armor offer respectable protection for a medium scout, though the XL engine remains the design's most significant vulnerability, concentrated torso damage can disable the 'Mech far more quickly than its armor coverage might suggest.</p>
deployment: |-
  <p>The original production model entered service in 3059 as ComStar's direct replacement for the Mongoose. Combining a Blankenburg large pulse laser with two Diverse Optics extended-range medium lasers, this variant was designed from the ground up as a heavy scout capable of both independent reconnaissance and artillery target designation through its integrated TAG system. The MASC-equipped chassis provided the speed to operate alongside lighter 'Mechs while carrying significantly more firepower and armor than the platform it replaced.</p>
history: |-
  <p>The Beowulf's origins trace directly to ComStar's loss of Terra in 3058. When the Word of Blake seized humanity's homeworld, ComStar's entire inventory of Mongoose reconnaissance 'Mechs was either destroyed or captured. The Precentor Martial's decision to commission a purpose-built replacement rather than source existing designs reflected both the urgency of the need and ComStar's confidence in its growing manufacturing capability within the Free Rasalhague Republic.</p><p>Odin Manufacturing's facility on Orestes had been among several small production sites that ComStar began upgrading into full 'Mech factories after the Clan defeat on Tukayyid. The Beowulf was the first new 'Mech design to emerge from this investment. Initial production was split between the Com Guards and the Rasalhague KungsArmé, with the 321st Division of the Com Guards and the Fourth Kavalleri of the KungsArmé among the first units to receive the new 'Mech.</p><p>The Jihad and its aftermath dramatically altered the Beowulf's trajectory. As Clan Ghost Bear absorbed the Free Rasalhague Republic to form the Ghost Bear Dominion, Odin Manufacturing's relationship with the Clan deepened. This led to increasingly ambitious Clan-technology refits of the Beowulf chassis during the 3070s, though persistent electronics incompatibilities between Inner Sphere and Clan systems plagued these early hybrid designs. Meanwhile, Lyran interests produced the BEO-14 melee variant through the Arcturan Arms Refit Facility on Arcturus, while ComStar pursued the experimental BEO-X-7a stealth prototype using partially assembled Odin chassis. Odin's increasing focus on Clan-technology production ultimately culminated in the purpose-built Beowulf IIC, effectively superseding the original Inner Sphere design within the Dominion's touman.</p>
