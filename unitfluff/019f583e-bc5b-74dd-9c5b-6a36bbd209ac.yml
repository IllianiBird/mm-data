chassis: "Field Gun Platoon (FWLM)"
model: "(Tracked AC5 3035+)"
overview: |-
  <p>The Free Worlds League's fractious politics have always made centralized BattleMech procurement difficult, pushing the FWLM toward heavy investment in conventional infantry to fill the gaps. Towing crew-served autocannon/5 field guns, these platoons deliver direct fire support that balances range, accuracy, and hitting power. The AC/5 is the workhorse caliber for field gun formations, effective against light vehicles and infantry positions alike.</p>
