chassis: "Pandarus"
model: "LFA-1A"
overview: |-
  <p>The Pandarus is a seventy-five-ton heavy BattleMech developed by Kali Yama Weapons Industries on Kendall as a specialized extended-range missile platform. Named for the legendary archer of the mythical Battle of Troy, the design entered prototype testing as the LFA-1X in 3078 during the final years of the Jihad, with the production LFA-1A following in 3083.</p><p>Built on a foundation shared with the venerable Orion chassis, the Pandarus fills a niche as a dedicated fire support asset capable of engaging targets at extreme distances. Its specialist nature has limited its appeal to commands that can support a pure artillery platform, but those that field the Pandarus value its unmatched engagement range.</p>
capabilities: |-
  <p>The Pandarus is a dedicated missile boat built around a triplet of Kali Yama Weapons Industries Type IIIE Extended LRM 10 launchers, giving the 'Mech an engagement envelope that nearly doubles the range of conventional LRM systems. This extraordinary reach allows the Pandarus to engage targets at distances most other weapons platforms cannot hope to match, making it an exceptionally effective artillery asset when deployed behind friendly lines. The three launchers are fed by six tons of ammunition, providing eighteen volleys per launcher before exhausting its stores.</p><p>This extreme-range capability comes with significant trade-offs. The ELRM launchers are heavy and bulky, restricting the Pandarus to the throw weight of lighter missile platforms despite its seventy-five-ton frame. More critically, the launchers are almost completely unable to engage targets at close range, leaving the 'Mech dangerously vulnerable if enemies close inside two hundred meters. A single Diverse Optics extended-range medium laser provides only token defense against such threats. Kali Yama representatives strongly recommend treating the Pandarus as a specialist artillery unit that must be supported by other 'Mechs to cover its weaknesses.</p><p>The standard Vlar 300 engine provides a moderate cruising speed of forty-three kilometers per hour, and thirteen tons of Valiant Lamellor armor give the Pandarus respectable protection for its weight class. Effective CASE II systems in each torso ammunition bin provide critical protection against catastrophic ammunition detonations, a welcome feature given the substantial missile stores carried aboard.</p>
deployment: |-
  <p>This variant is the production model of the Pandarus, entering service in 3083 after Kali Yama completed construction of an endo steel refinery in Kendall orbit. The composite internal structure of the experimental prototype was replaced with a proper LFA-Endo Steel skeleton, dramatically improving structural durability without altering any other aspect of the design. The production framework could be assembled by local civilian aerospace contractors on Kendall rather than requiring imported endo steel components, keeping costs manageable. Kali Yama marketed this variant alongside its Orion variants, emphasizing the extensive parts commonality between the two designs and the logistical advantages of mixed Pandarus-Orion formations. The design earned a reputation for ease of maintenance, though its specialist nature as a pure artillery platform limited its appeal to commands that could afford dedicated fire support assets.</p>
history: |-
  <p>The Pandarus traces its origins to testing conducted on the ON3-MX Orion variant during the Jihad era. Kali Yama engineers working with the Extended LRM technology that had become available since 3050 recognized an opportunity to create a purpose-built ELRM platform. the Kali Yama design team initially proposed an OmniMech concept capable of deploying a wealth of missile systems, but Kali Yama's management balked at the cost of building an entirely new OmniMech chassis with custom omnipods. The strained budgets of the Jihad era forced the team to scale back to a non-Omni prototype built on spare ON1-K chassis frames that had been collecting dust in Kendall warehouses.</p><p>The resulting LFA-1X prototype faced an immediate engineering challenge: without access to endo steel, the design team was forced to painstakingly rebuild the Orion's GM Marauder chassis frame using fragile composite internal structure to free sufficient mass for the heavy ELRM payload. Despite this compromise, the prototype performed well enough during live-fire demonstrations at Kali Yama's proving grounds to sustain interest from prospective investors and military buyers.</p><p>Kali Yama's investment in an endo steel refinery in Kendall orbit in 3081 proved the turning point for the Pandarus program, enabling the production LFA-1A to replace the fragile composite frame with proper endo steel construction. Sales started well in the early 3080s, with the Pandarus frequently sold in combination with Orion variants to create mixed fire support formations that simplified logistics through shared components. The commonality of parts between the Pandarus and the ON3-M Orion eased quartermaster duties considerably.</p><p>However, contracts declined in the latter part of the decade as government spending across the former Free Worlds League shifted toward post-Jihad civilian reconstruction and debt repayment. The dissolution of the Free Worlds League into independent states during the early Republic era further complicated Kali Yama's market access, with the Kendall facility operating independently for a period before the League's eventual reconstitution. The oft-promised OmniMech variant, designated the LFA-2OX, was ultimately shelved when outside investment could not be secured, though by 3090 Kali Yama's successful aerospace ventures had encouraged the company to explore diversification beyond traditional BattleMech production.</p>
