overview: |-
  <p>The Arctic Cheetah was originally designed by Clan Ice Hellion in 3037 as a replacement for the aging Mist Lynx OmniMech. Manufactured at a plant on Foster, the design was captured by Clan Smoke Jaguar mere months after full-scale production had begun, enabling the Jaguars to field a light OmniMech superior to the Mist Lynx in virtually every measurable category. First encountered by Inner Sphere forces during the Battle of Luthien in 3052, the design received the reporting name "Hankyu" (meaning "Short Bow") for its characteristic long-range missile armament. Despite its origins with the Ice Hellions, the Arctic Cheetah has been produced by multiple Clans across several worlds, including Foster, Brim, New Kent, and Coudoux. The thirty-ton scout OmniMech has demonstrated remarkable longevity, continuing to serve in frontline formations well into the thirty-second century.</p>
capabilities: |-
  <p>The Arctic Cheetah takes full advantage of Clan weight-saving technologies available during the late 3030s, incorporating an endo steel internal structure, an extra-light fusion engine, and four tons of ferro-fibrous armor. These material choices allow the thirty-ton chassis to achieve a top speed of 129 kilometers per hour while retaining jump capability out to 180 meters, providing exceptional tactical mobility for a 'Mech of its class. The base chassis reserves nine and a half tons of pod space for mission-specific equipment, a generous allocation that has enabled a wide variety of configurations over the design's long service life.</p><p>The most commonly encountered configuration pairs twin LRM-5 launchers with a pair of extended-range medium lasers, allowing the Arctic Cheetah to engage targets at range before closing to finish them with direct-fire weapons. The addition of an active probe, electronic countermeasures suite, and target acquisition gear in the Prime configuration makes it an exceptionally capable scout platform. Nearly every configuration mounts a modular flamer for anti-infantry operations, reflecting Clan doctrine regarding light 'Mech employment against conventional forces.</p>
deployment: |-
  <p>A popular deployment configuration centered on heavy laser technology, Alternate Configuration H utilizes the Arctic Cheetah's speed to bring its weapons into effective range. An extended-range large laser provides ranged firepower, while a heavy medium laser and pair of heavy small lasers deliver devastating close-range damage. Three additional double heat sinks manage the significant thermal load generated by this energy-intensive weapons suite.</p>
history: |-
  <p>The Arctic Cheetah's history is intertwined with the turbulent politics of the Clans. Designed by Clan Ice Hellion scientists to replace the aging Mist Lynx, the design entered production on Foster in 3037. Clan Smoke Jaguar's capture of Foster MechWorks Facility Beta that same year gave the Jaguars access to a light OmniMech that quickly proved its worth, and by the time the Smoke Jaguars dropped on Tukayyid, most of their light 'Mech Stars contained at least one Arctic Cheetah.</p><p>The Ice Hellions eventually recovered the Foster facility, but by then most of their MechWarriors had come to prefer the Hellion OmniMech, limiting the Arctic Cheetah's role within its creator Clan. Clan Steel Viper and Clan Nova Cat both adopted the design in significant numbers, while Clan Diamond Shark's embrace of the Arctic Cheetah ensured the design would outlast its original creators. Nova Cat production at the Mualang Alpha facility on Coudoux supplemented existing output until that Clan's annihilation during the Draconis Combine Civil War.</p><p>Following the Nova Cat destruction, Clan Sea Fox negotiated with the Draconis Combine to maintain operations at the Coudoux facility, receiving a portion of the factory's output in exchange for technical assistance. By the mid-thirty-second century, the Arctic Cheetah had been fielded by three absorbed or annihilated Clans, yet the design continued to see widespread service. During the DCMS assault on Irece in 3142, Arctic Cheetahs were employed against Clan Nova Cat remnants, a pointed irony given the Clan's long association with the design. Newer configurations inspired by Inner Sphere designs such as the Gyrfalcon and Rifleman have continued to improve the OmniMech's reputation and expand its tactical flexibility across multiple adopting factions.</p>
