chassis: "Tenshi"
model: "TN-10-OR"
overview: |-
  <p>The Tenshi, whose name translates to "Angel" in Japanese, is a 95-ton assault OmniMech introduced in 3101 by Luthien Armor Works for the Draconis Combine Mustered Soldiery. Designed to be manufactured entirely from Combine-sourced technologies and materials, the Tenshi represented LAW's first foray into OmniMech production for the DCMS. Conceived during a period of covert rearmament following the Jihad, the design answered the Combine's need for a domestically produced assault-weight platform that did not rely on foreign supply chains. A common sight among the Dragon's assault formations, the Tenshi fills the heavy end of the weight spectrum with a flexible platform capable of adapting to multiple battlefield roles through its substantial modular pod system.</p>
capabilities: |-
  <p>The Tenshi was Luthien Armor Works' first OmniMech platform to incorporate several advanced technologies that had entered production in the decades preceding the Jihad. Built on an Endo-Composite internal structure and powered by a Hermes 285 Light fusion engine, the design achieves a remarkable 48 tons of pod capacity, roughly half its total weight. This impressive payload comes at the cost of speed, with a maximum velocity of only 54 kilometers per hour, particularly slower than many comparable assault designs of the era. A Compact Gyro saves additional internal volume, while 18.5 tons of Mitchell Argon Standard armor provides exceptional protection across all locations.</p><p>The Tenshi is somewhat labor-intensive to reconfigure due to its complex pod linkage system, making rapid battlefield swaps impractical during time-sensitive operations. This logistical burden is the design's most significant drawback, requiring dedicated technical teams and extended maintenance windows that can strain a formation's operational tempo during fast-moving campaigns.</p>
deployment: |-
  <p>The R configuration employs a mix of Inner Sphere and Clan technologies to create a long-range indirect fire support platform. Twin Extended Long-Range Missile 20 launchers backed by six tons of ammunition can saturate targets at extreme distances well beyond the reach of most conventional weapons. Five Clan-manufactured ER Medium Lasers provide accurate backup firepower at closer ranges, giving this variant some protection against units that manage to close the distance. This configuration transforms the Tenshi from a direct-combat assault 'Mech into a bombardment platform best employed behind friendly lines.</p>
history: |-
  <p>The Tenshi emerged from Luthien Armor Works as part of a deliberate and covert program to reconstitute the Draconis Combine's shattered military in the aftermath of the Jihad. While publicly adhering to Devlin Stone's disarmament agreements, the Combine quietly pursued new BattleMech projects that would achieve two purposes: manufacture designs using Combine-centric technologies, and rapidly rebuild its decimated 'Mech regiments. Older machines were cycled down to planetary militias to maintain the appearance of compliance while new hardware flowed to frontline units.</p><p>The DCMS initially assigned the first Tenshis to the Ghost Regiments, a deliberate choice rooted in both pragmatism and politics. The Ghost Regiments' lower profile within the DCMS meant that should the Tenshi prove a tactical failure, much as the Daboku had nearly a century earlier, the embarrassment would be contained within less prestigious formations. Ghost pilots, however, quickly embraced the new OmniMech and realized its battlefield potential.</p><p>In 3103, the Tenshi saw one of its earliest significant engagements when the First Ghost dropped two lances of the assault 'Mechs on the Ghost Bear Dominion world of Grumium. The raiding force struck directly at a weapons stockpile, blasting through a Striker Star before encountering heavier resistance from a Dominion Nova of the First Freemen Cluster. When the Bear commander refused a Trial of Possession, the Ghosts employed massed firepower to devastating effect, cutting down Clan 'Mechs while absorbing heavy return fire. Six of the eight Tenshis survived the engagement and returned to the Combine along with several hundred tons of captured Clan technology, a significant haul that validated the design's combat worthiness.</p><p>By the mid-thirty-second century, the Tenshi had become a common sight among the Dragon's frontline 'Mech regiments. At least one full assault company within the Sixteenth Galedon Regulars fielded the type exclusively, demonstrating growing production numbers and the DCMS' deepening confidence in the design. The Tenshi's combination of heavy armor, massive pod capacity, and the flexibility inherent to OmniMech technology ensured its continued prominence within Combine formations as tensions escalated across the Inner Sphere.</p>
