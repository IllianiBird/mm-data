chassis: "Mechanized Wheeled Level I (ComGuards)"
model: "(Rifle)"
overview: |-
  <p>Under the reforms of Precentor Martial Anastasius Focht, Com Guard infantry train extensively in combined-arms cooperation, conducting regular exercises alongside heavier elements to ensure seamless coordination across all branches when battle demands it. Mechanized wheeled Level I formations use wheeled APCs that provide a balance of road speed, infantry protection, and maintenance economy. The Com Guards deploy wheeled mechanized infantry extensively for garrison and patrol duties on worlds with developed transportation networks. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon in the Inner Sphere, these troops deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
