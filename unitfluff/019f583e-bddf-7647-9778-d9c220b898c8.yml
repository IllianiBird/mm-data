chassis: "Mechanized Tracked Platoon (LCAF)"
model: "(SRM 3058+)"
overview: |-
  <p>Lyran infantry draw confidence from knowing their equipment is first-rate, even when assigned to garrison duty on worlds far from the front lines. Mechanized tracked platoons deploy from armored personnel carriers that provide protection during movement and allow the formation to keep pace with heavier combat vehicles in offensive operations. Armed with assault rifles and infantry-portable short-range missile launchers, these platoons carry enough anti-armor punch to threaten light vehicles and BattleMechs at close range.</p>
