chassis: "Motorized demi-I (WOBM)"
model: "(MG)"
overview: |-
  <p>The Word of Blake Militia inherited ComStar's combined-arms organizational philosophy and its Star League-era equipment stocks, fielding infantry formations that ranked among the best equipped in the Inner Sphere during the Jihad. Motorized Level I formations used light vehicles for rapid movement between garrison posts, providing the speed needed to respond to civil unrest or insurgent attacks faster than foot infantry could march. Their mobility made them a preferred choice for patrol duties across the Word's Protectorate holdings. Carrying infantry-portable machine guns that provide sustained suppressive fire, these troops anchor defensive positions with a volume of fire that discourages enemy movement in the open.</p>
