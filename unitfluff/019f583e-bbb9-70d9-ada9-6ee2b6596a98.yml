chassis: "Field Gun Platoon (DCMS)"
model: "(Tracked UAC5 3040+)"
overview: |-
  <p>Conventional infantry within the DCMS serve as the foundation of planetary defense, providing the manpower essential to territorial control while freeing BattleMech and armored assets for offensive operations. The platoon tows a light ultra autocannon that can double its rate of fire when the situation demands it, though the mechanism risks jamming under sustained rapid fire. The gamble is usually worth it when targets are in the open.</p>
