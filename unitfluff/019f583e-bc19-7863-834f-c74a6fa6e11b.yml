chassis: "Mechanized Tracked Platoon (DCMS)"
model: "(SRM Support 3053+)"
overview: |-
  <p>The Combine's martial traditions extend beyond the BattleMech cockpit, and the Dictum Honorium demands that all citizens contribute their talents to the defense of House Kurita. Infantry soldiers of the DCMS embody that expectation on garrison worlds across the realm. Tracked mechanized infantry ride armored carriers that can cross rough ground where wheeled vehicles cannot follow. The DCMS values these platoons for operations on worlds with poor road infrastructure, where the broken terrain that stops lighter transport is simply another day's march for tracked APCs and the soldiers they carry. These support weapons specialists operate crew-served short-range missile systems mounted on heavier tripods or vehicle pintles. The additional stability and ammunition capacity allow faster rates of fire and better accuracy than shoulder-launched variants. These support weapons specialists operate heavier crew-served weapons that anchor the platoon's defensive positions. When the standard-issue rifles are not enough to hold a line, the support teams provide the sustained firepower that keeps attackers at bay.</p>
