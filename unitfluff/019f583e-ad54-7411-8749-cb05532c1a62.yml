chassis: "Shilone"
model: "SL-17R"
overview: |-
  <p>The SL-17 Shilone is Wakazashi Enterprises' signature medium aerospace fighter, designed to meet the Draconis Combine's urgent need for a capable and resilient interceptor at the dawn of the Succession Wars. Built at Chatham, the Shilone quickly earned a reputation as a genuine overperformer in its weight class, fielding heavy firepower and substantial armor coverage more typical of fighters in heavier tonnage brackets. Nicknamed "The Boomerang" by its pilots for its remarkable habit of returning from even heavily contested engagements, it became a mainstay of the Draconis Combine Aerospace Force, eventually spreading through licensing agreements to the Outworlds Alliance and the Taurian Concordat. Pilots from every nation who have had occasion to fly the Shilone typically come away with a high regard for its combat reliability and well-balanced design.</p>
capabilities: |-
  <p>The Shilone carries a weapons loadout weighted toward long-range engagement. Its nose-mounted Shigunga LRM rack allows pilots to pound targets before closing to visual range, while a Diverse Optics large laser provides a heat-efficient complement to the missile barrage. Two wing-mounted medium lasers extend the fighter's effectiveness once inside effective missile range, and a rear-facing NCK short-range missile launcher discourages pursuit. The combination yields a fighter capable of effective engagement across nearly every range band, though the Shilone performs best when pilots leverage its long-range punch to wear down enemies before transitioning to close-quarters fire.</p><p>Mass tactics are common among Shilone squadrons, with entire flights coordinating concentrated missile salvos onto a single target before breaking into individual engagements. Against other aerospace fighters this approach is moderately effective, but against DropShips or orbital installations the concentrated fire can be devastating. The Shilone carries heavier armor than most fighters of comparable mass, lending it staying power that lighter designs lack. Its pilot entry hatch is unconventionally located on the belly rather than the canopy, a quirk that has not affected operational effectiveness but frequently surprises new crew. Twenty single heat sinks handle the energy load adequately, though sustained simultaneous use of the full weapon suite generates heat levels that demand pilot discipline.</p>
deployment: |-
  <p>The SL-17R represents the standard upgrade path for Shilone operators, replacing the original heat dissipation system with double-strength units that substantially improve sustained fire tolerance. Chatham began producing this variant during the Clan Invasion era, and the Ramora facility added its own SL-17R line during the Jihad. The variant has largely supplanted the base SL-17 in frontline Combine service and represents the most commonly encountered Shilone configuration in the post-Invasion period. Taurian Concordat forces have not adopted the SL-17R and continue to rely on the base model supplied through Pinard.</p>
history: |-
  <p>The Shilone's origins trace to the chaos of the First Succession War, when Wakazashi Enterprises found itself facing a critical choice. As the Inner Sphere tore itself apart, Wakazashi's leadership announced plans to relocate operations to the relative safety of the Periphery. Coordinator Minoru Kurita moved quickly to prevent this, offering the company a substantial defense contract to stay and design a new medium fighter. The result was the Shilone, purpose-built to give the Combine a decisive edge in aerospace superiority battles.</p><p>The new fighter entered service during the First Succession War, with an early and little-publicized engagement at Barlow's Folly in 2786 marking its actual battlefield debut. That action ended without distinction, and later official accounts quietly omitted the date; the system's prior name of Cussar was likewise dropped from revised records. The Shilone's public reputation instead took shape at Kentares IV in 2796, where concentrated missile salvos from entire Shilone squadrons disrupted Davion aerospace formations before they could mount effective interception screens, allowing Combine DropShips to reach orbit and land their ground forces with minimal interference. That success established the massed long-range strike as the type's defining tactic.</p><p>The early production run was not without problems. In 2799, engineers discovered a structural defect in the wing joint assemblies of the original SL-17 models, a flaw responsible for several fatal crashes. Wakazashi moved aggressively to address the problem, and by 2802 all operational Shilones had been rebuilt with improved wing joints. The redesigned structure eliminated the issue entirely, and no structural failures have been reported since.</p><p>By the late Succession Wars period the Shilone's reputation was firmly established, and demand extended well beyond Combine borders. Wakazashi licensed production to the Outworlds Alliance in the 3020s, with the United Outworlders Corporation on Ramora taking up manufacture for Alliance aerospace forces. Both the Chatham and Ramora facilities subsequently entered long-term supply agreements with the Taurian Concordat, giving that state access to one of the Inner Sphere's most respected medium fighters. Pilots across every operating nation called the Shilone "a queen among aerospace fighters" and took personal pride in flying a machine that consistently outperformed its weight class.</p><p>The Ronin War of 3034 put Shilone squadrons in the skies over the newly independent Free Rasalhague Republic, where the fighter saw heavy use in the aerospace engagements that characterized that conflict. It was during this period that the type became closely identified with the Flying Drakøns, the aerospace wing of the First Rasalhague Drakøns, whose crews flew Shilones with exceptional skill and dedication. When the Clan Invasion began in 3050, those same pilots would write the Shilone's most defining chapter.</p><p>On 31 October 3050, the invasion reached a turning point above Radstadt. Elected Prince Haakon Magnusson and his escort, fleeing ahead of advancing Clan forces, jumped into the Radstadt system unaware that Clan Wolf had just completed its conquest of the planet. Aboard the Wolf flagship Dire Wolf, ilKhan Leo Showers had convened a Grand Kurultai to censure Clan Wolf's rapid advance. The Flying Drakøns immediately deployed to buy the Elected Prince time to escape, making repeated attack runs on the massive WarShip while Clan fighters scrambled to respond. The Drakøns took heavy losses in the exchange, and as the Prince's JumpShip finally broke free of the system, many of the surviving fighters were badly damaged. Kapten Tyra Miraborg found herself at the controls of a stricken Shilone, bleeding from multiple wounds, her fighter barely responding. Rather than withdraw, she disengaged all engine restraints and guided the crippled machine directly into the bridge of the Dire Wolf. The impact killed ilKhan Showers and devastated the flagship, ending the Grand Kurultai and leaving the Clans without a unifying leader at a critical moment in the invasion. Miraborg's sacrifice bought the Inner Sphere a year's lull in hostilities, time that proved decisive in organizing the defense that would ultimately stop the Clan advance at Tukayyid. Both the KungsArmé and the Clans honored her in their own ways: the Remembrance was amended with a passage in her memory, a new class of carrier DropShip was renamed in her honor, and the Tyra Miraborg Memorial Academy was later founded on Gunzburg to train the next generation of Rasalhague aerospace pilots.</p><p>In the years following the Clan Invasion, Wakazashi introduced the SL-17R, a modernization replacing the original single heat sinks with double-strength units that substantially improved sustained fire tolerance. Chatham production shifted toward the SL-17R as the standard Combine configuration, with the Ramora facility adding its own SL-17R line during the Jihad. As the Word of Blake's war reshaped the Inner Sphere, Wakazashi introduced the substantially redesigned SL-18, fitted with a lighter powerplant and updated weapons suite suited to that conflict's demands. A parallel experimental program produced a single prototype exploring oversized ballistic integration, an impressive technical demonstration that proved impractical for mass production.</p>
