chassis: "Foot Platoon (ComStar)"
model: "(Laser)"
overview: |-
  <p>The Blessed Order maintained conventional infantry formations equipped with preserved Star League-era weapons and personal armor, fielding platoons that were better armed than most Successor State infantry throughout the late Succession Wars. Foot platoons provide the most basic garrison capability, assigned to secure HPG compounds and ComStar facilities on worlds where heavier forces are not available or not required. What they lack in mobility they compensate for with low logistical overhead and the ability to operate indefinitely in static defensive positions. Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these troops field one of the most effective personal arms available to conventional infantry, though the weapons are significantly more expensive and require soldiers to carry additional power packs.</p>
