chassis: "Buccaneer"
model: "BCN-6W"
overview: |-
  <p>The Buccaneer emerged from the Word of Blake's urgent need for BattleMechs following its schism from ComStar in 3052. Originally a prototype ComStar design that had never entered production on Terra, the fifty-five-ton Buccaneer was swiftly adapted by Precentor Martial Trent Arian to use materials produced in the Free Worlds League, where the nascent order had established its base of operations. Gibson Federated BattleMechs, a division of Free Worlds Defense Industries, rushed the modified design through an accelerated trial program, and the Buccaneer entered production in late 3055.</p><p>Filling a medium-weight close combat role, the Buccaneer was purpose-built to close with opponents and overwhelm them at short range. This emphasis on melee engagement distinguished the design from most contemporary 'Mechs and earned it a fearsome reputation among opponents forced to face it within arm's reach.</p>
capabilities: |-
  <p>Built around a compact VOX 330 XL engine, the Buccaneer achieves above-average maneuverability for its weight class, reaching speeds of ninety-seven kilometers per hour. Faced with weight restrictions that forced a choice between jump jets and additional weapons and armor, Gibson's engineers chose the latter approach, creating a sturdy opponent on the battlefield. The chassis mounts an impressive ten tons of Kallon FWL Special ferro-fibrous armor, the maximum the frame can carry, providing excellent protection for a medium 'Mech intended for close-quarters fighting.</p><p>The Buccaneer's most fearsome weapon is its four-ton hatchet, built around an ultra-dense core of depleted uranium that allows it to inflict devastating damage on opponents within arm's reach. Supporting this primary melee weapon at medium to close ranges are four Diverse Optics Type 18 medium lasers and a highly accurate Starflash medium pulse laser, while an Irian Weapon Works 60mm SRM-6 launcher equipped with an Artemis IV fire control system provides additional close-in firepower with enhanced missile accuracy. A single Diverse Optics Sunbeam extended-range large laser serves as the Buccaneer's only long-range striking capability, though its demanding heat output makes overheating a concern during prolonged engagements at speed.</p>
deployment: |-
  <p>Emerging around 3073 as a Jihad-era field refit, this variant fundamentally reimagines the Buccaneer as a missile boat. Mercenary units working with salvaged Word of Blake chassis stripped virtually all original weaponry except the signature hatchet, replacing the close-combat loadout with three MML-5 launchers fed by two tons of ammunition. This configuration grants flexibility to switch between long-range and short-range missile modes depending on tactical conditions, though the ammunition storage directly forward of the cockpit raises survivability concerns. Like the BCN-5W, this variant includes seven improved jump jets and a C3i computer, maintaining tactical mobility and network integration capabilities despite its radically different combat role.</p>
history: |-
  <p>The Buccaneer's combat debut came during Operation Odysseus in 3058, when Word of Blake forces used the newly produced 'Mechs during the seizure of Nestor, the home base of the 21st Centauri Lancers. Blake Militia forces disguised as the Lancers deployed the Buccaneer in their first confirmed engagement, defeating the real Lancers in a campaign that marked the beginning of the Word of Blake's takeover of Terra. The design would see its most significant early testing during the subsequent Terra campaign, where several Buccaneers were deployed across multiple task forces during the intensive fighting that secured the Terran system for the Word of Blake.</p><p>Through the late 3050s and 3060s, the Buccaneer remained primarily a Word of Blake design, produced exclusively at Gibson Federated BattleMechs' facilities on Gibson. The Word of Blake also provided several Buccaneers to the Free Worlds League as part of ongoing technology exchanges, though the majority remained in Blakist service. Gibson Federated continued developing new variants as the Word of Blake's tactical doctrine evolved, introducing the radically redesigned BCN-5W around 3069 to serve as a dedicated urban combatant incorporating advanced Blakist networking technology.</p><p>The onset of the Jihad cemented the Buccaneer's association with the Word of Blake. As Blake forces spread across the Inner Sphere, captured or salvaged Buccaneers began appearing in the hands of opposing forces. Mercenary units working with salvaged Word of Blake chassis created their own field refits, most particularly the BCN-6W missile boat variant that emerged around 3073, fundamentally reimagining the design for indirect fire support rather than the close-combat role it was originally intended for.</p><p>Following the destruction of the Word of Blake during the Coalition campaigns, production at Gibson ceased entirely. The Buccaneer survived in limited numbers with various successor state forces and mercenary commands who had acquired the design during the Jihad, with field refits continuing to appear in service well into the Dark Age. The chassis even found an unlikely second life on the Solaris VII arena circuit, where custom variants exploited the design's sturdy frame and inherent ruggedness for entertainment combat.</p>
