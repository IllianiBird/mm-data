chassis: "Jengiz"
model: "C"
overview: |-
  <p>The Jengiz is one of the heaviest and most capable OmniFighters in Clan service, developed in 3032 by Clan Ghost Bear as a dedicated near-space combat platform. Where most fighters balance firepower against maneuverability, the Jengiz inverts this philosophy, sacrificing atmospheric agility for an extraordinary combination of armor and weapons capacity. The design attracted immediate and widespread interest across all Clans, but only Clan Wolf succeeded in the Trials of Possession required to secure the design through legitimate means. All other Clans that field the Jengiz have done so through battlefield capture, earning it a gradual but steady presence across Clan aerospace inventories far beyond its original Ghost Bear origins.</p>
capabilities: |-
  <p>The Jengiz earns its fearsome reputation through a combination of base chassis features that persist across all configurations. Thirteen and a half tons of Bruin Heavy ferro-aluminum armor provide protection comparable to many assault BattleMechs, and twenty double heat sinks on the base chassis deliver exceptional thermal dissipation capacity before a single weapon pod is loaded. With forty-three and a half tons of available pod space, the Jengiz can mount weapons suites competitive with designs considerably heavier than its eighty-ton airframe. A permanently integrated ECM suite degrades enemy fire-control computers in both atmospheric and space combat, complicating targeting solutions for any opponent attempting to coordinate fire against it.</p><p>Poor atmospheric maneuverability is the design's primary limitation, restricting its combat effectiveness in high-density atmospheric engagements where agility determines survival. In near-space and orbital environments, however, the Jengiz excels, where the ability to absorb punishment and deliver sustained firepower outweighs the value of raw speed. The primary configuration demonstrates this philosophy with a mixed loadout of a cluster-capable autocannon, ER PPC, large and medium pulse lasers, and short-range missile launchers, capable of engaging targets across all combat ranges while the ECM suite complicates enemy targeting solutions. Subsequent configurations leverage the design's enormous pod capacity to deliver specialized armament packages ranging from long-range Gauss and missile combinations to close-range ballistic and Streak missile loadouts that can strip the armor from even the most heavily protected targets.</p>
deployment: |-
  <p>The C configuration delivers devastating short-range firepower at the cost of near-total ammunition dependence. Triple Streak SRM-6 launchers in the nose and massive autocannons under each wing can shred even heavily armored aerospace targets in a single close pass, while the aft Streak SRM-4 discourages pursuit. Pilots must carefully manage multiple ammunition feeds to maintain offensive effectiveness. The C is believed to have evolved from Clan Goliath Scorpion's aggressive close-range combat doctrine and is most commonly found in the aerospace Stars of that Clan and those units that have captured examples from them.</p>
history: |-
  <p>Bear's Den began producing the Jengiz at its Strana Mechty facility in 3032, fulfilling a Ghost Bear requirement for a heavy near-space superiority fighter that combined the tactical flexibility of OmniPod technology with the raw destructive potential to dominate orbital engagements. The design's capability generated immediate demand across Clan space, with multiple Clans initiating Trials of Possession almost as soon as field reports reached the Grand Council. Only Clan Wolf possessed the combination of warrior skill and negotiating leverage to win the design through legitimate means, securing the Jengiz through hard-fought Trials that underscored Ghost Bear's determination to limit access to their most capable aerospace asset. Clans unable to win formal Trials began accumulating captured examples from Wolf and Ghost Bear engagements, seeding the type across aerospace inventories that would otherwise never have fielded it.</p><p>The Clan Invasion of the Inner Sphere altered the Jengiz's production and distribution calculus considerably. As Ghost Bear aerospace units pressed deep into the Rasalhague Occupation Zone, the Strana Mechty production line continued supplying front-line warriors, but the logistical demands of sustaining an occupation force thousands of light years from the homeworlds created pressure to establish nearer supply sources. Ghost Bear's distinctive migration pattern, gradually relocating its entire population and touman to the Occupation Zone, eventually produced a second Jengiz production requirement in the Inner Sphere. The Tseng Facility on Alshain was brought online during the Civil War era to manufacture Jengiz airframes closer to the front, reducing Ghost Bear's dependence on homeworld supply chains and providing a more responsive production base for the rapidly evolving Dominion. Production at Strana Mechty continued under Ghost Bear ownership throughout the Invasion and Civil War periods, eventually transferring to Clan Stone Lion during the Wars of Reaving as that conflict consumed the homeworlds and reshaped their political sphere.</p><p>The Alshain line proved its value during the Jihad, when Ghost Bear's aerospace forces played a significant role in the coalition campaign against the Word of Blake Protectorate. Jengiz fighters were paired with more maneuverable designs from the Ghost Bear touman, using their heavy armor and sustained firepower to anchor engagements while faster wingmates handled the flanking work that the Jengiz's atmospheric performance could not. The Tseng Facility transitioned to Rasalhague Dominion control as Ghost Bear completed its political transformation in the post-Jihad era, continuing to supply the Dominion's aerospace forces through the Dark Age under its new national designation. The Wolf Armor Works facility on Eden, maintained by Clan Wolf throughout the Civil War and Jihad periods, provided a third production source that supplemented Wolf aerospace requirements before disappearing from available records as the Wars of Reaving disrupted homeworld manufacturing infrastructure.</p><p>New configurations continued to emerge throughout the design's service life. The E configuration, introduced during the Jihad, reflected growing Clan awareness of the electronic warfare threat posed by the Blakists and created a specialist variant focused on disrupting enemy command and control. The experimental X configuration tested rotary autocannon and next-generation electronics that informed later Ghost Bear aerospace design work. The Dark Age F configuration, combining a Long Tom cannon with heavy ultraclass ballistics under a targeting computer, reflected the Rasalhague Dominion's preference for maximizing alpha-strike damage potential in an era defined by shorter, more decisive engagements.</p>
