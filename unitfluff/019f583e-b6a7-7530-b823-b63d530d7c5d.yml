chassis: "Field Gun Platoon (AFFS)"
model: "(Motorized LAC5 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing light autocannon that balance range and hitting power at reduced weight, these field gun crews provide mobile direct fire support from positions that heavier weapons cannot reach.</p>
