chassis: "Field Gun Level I (ComGuards)"
model: "(Tracked RAC5)"
overview: |-
  <p>Under the reforms of Precentor Martial Anastasius Focht, Com Guard infantry train extensively in combined-arms cooperation, conducting regular exercises alongside heavier elements to ensure seamless coordination across all branches when battle demands it. Operating medium-caliber rotary autocannon capable of sustained high-rate fire, these crews can shred infantry formations and strip armor from light vehicles through continuous bombardment, though ammunition consumption is extreme.</p>
