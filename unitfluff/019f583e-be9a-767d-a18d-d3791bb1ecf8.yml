chassis: "Jump Duplus Contubernium (MHAF)"
model: "(Laser)"
overview: |-
  <p>Caesar's ongoing program to modernize the Legiones Marianes has extended to conventional infantry formations, with improved equipment and weapons gradually replacing older stockpiles across the Hegemony's auxiliary legions. A duplus contubernium, or double tent-group, fields two squads of ten soldiers. Jump-equipped duplus contubernia provide the Legiones Marianes with mobile infantry capable of seizing elevated positions and conducting rapid flanking maneuvers that exploit terrain inaccessible to foot troops. Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these formations field one of the most effective personal arms available to conventional infantry, though the weapons require soldiers to carry additional power packs.</p>
