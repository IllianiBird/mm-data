chassis: "Rifleman"
model: "C 3"
overview: |-
  <p>The Rifleman C serves as a practical solution to the challenge of maintaining garrison forces with limited resources. When Clan warriors captured Inner Sphere Riflemen during the initial invasion, technicians recognized the chassis's fundamental soundness and began retrofitting captured units with Clan technology. These field conversions retained the original SLDF-vintage frames while replacing outdated weapons and electronics with superior Clan equivalents, creating effective second-line defenders at minimal cost.</p><p>The modern Rifleman C 3 takes this concept further with purpose-built production rather than battlefield salvage. Trellshire Heavy Industries manufactures these units at their Twycross facility, integrating cutting-edge Clan technology with classic styling. The result is a garrison 'Mech that significantly outperforms its Inner Sphere ancestor while maintaining the familiar silhouette and handling characteristics that pilots appreciate. These designs appear throughout Clan garrison clusters in the Inner Sphere occupation zones, providing capable anti-aircraft coverage without consuming resources needed for front-line OmniMechs.</p>
capabilities: |-
  <p>The original Rifleman C conversion replaced the Inner Sphere weaponry of captured RFL-3N chassis with Clan Large Pulse Lasers and LB 5-X autocannons, dramatically improving accuracy and flexibility. The weight savings from more efficient Clan weapons allowed technicians to add heat sinks, partially addressing one of the original design's most persistent shortcomings. These conversions retained the Garret electronics suite, whose targeting capabilities remained competitive even against Clan systems designed specifically for anti-aircraft work.</p><p>The purpose-built Rifleman C 3 mounts Type DL Ultra Autocannon/5s paired with Series 7K Extended-Range Large Lasers, giving pilots the ability to maintain pressure on targets at extreme distances. Series 6b ER Medium Lasers provide backup at closer ranges. Trellshire Royalstar ferro-fibrous armor and an SFo-A Endo Steel frame maximize protection within the sixty-ton weight limit. While lacking jump capability, the C 3 maintains the standard ground speed and retains the arm-flip capability that makes the Rifleman design so effective at defending its own flanks. The combination of Clan firepower with proven Inner Sphere ergonomics produces a garrison 'Mech that punches well above its weight class.</p>
deployment: |-
  <p>Clan Sea Fox introduced the Rifleman C 3 in 3132 as a commercially available modernization of the original Twycross garrison refit. Built on an Endo Steel chassis with Clan Ferro-Fibrous armor, each arm mounts a Series 7K ER Large Laser paired with a Type DL Ultra AC/5 and its ton of ammunition. Torso-mounted Series 6b ER Medium Lasers provide backup firepower while fourteen Clan double heat sinks finally give the configuration adequate thermal management. AC/20-proof armor across most locations makes the C 3 suitable for sustained combat operations. The matching range brackets of the primary weapons and manageable heat profile allow MechWarriors to maintain continuous fire without the discipline constraints that plagued earlier C variants.</p>
history: |-
  <p>Clan Jade Falcon pioneered the Rifleman C concept during the initial occupation of the Inner Sphere, converting captured chassis to supplement their garrison forces. The relatively simple nature of these conversions (essentially swapping weapon systems while retaining the fundamental structure) meant that even field technicians could perform the work with available supplies. As the occupation stabilized, other Clans adopted similar practices, and the Rifleman C became a common sight in second-line formations throughout the occupation zones.</p><p>Red Devil Industries on Pandora began producing the Rifleman C 2 variant for Clan Jade Falcon in 3083, marking the transition from field conversion to proper manufacturing. This version utilized experimental technology including an XXL engine and Improved Jump Jets, representing a significant departure from the conservative approach of earlier conversions. The design provided mobility that previous Rifleman variants lacked, though the experimental powerplant raised concerns about long-term reliability in garrison service.</p><p>Clan Sea Fox recognized the commercial potential of the design and worked with Trellshire Heavy Industries to develop the Rifleman C 3 as a production model specifically for export. Unlike the salvage-based conversions or experimental Jade Falcon variants, the C 3 was designed from the start for reliable garrison duty. The combination of proven technology, reasonable cost, and familiar handling made it attractive to multiple customers. Both the Draconis Combine and Duchy of Oriente have acquired the design in small numbers, while Clan garrison forces continue deploying earlier conversion variants alongside the newer production models.</p>
