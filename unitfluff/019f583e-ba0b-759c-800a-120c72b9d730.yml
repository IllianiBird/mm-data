chassis: "Foot demi-I (ComGuards)"
model: "(MG)"
overview: |-
  <p>The Com Guards field conventional infantry as a core component of their combined-arms formations, with Level I infantry units integrated into the same command structure alongside BattleMech, armor, and aerospace elements at every organizational level. Foot infantry Level I formations anchor defensive positions and garrison critical installations, providing the persistent ground presence that BattleMech and armor units cannot maintain indefinitely. Com Guard foot infantry train alongside heavier elements and understand their role within the larger combined-arms framework. Carrying infantry-portable machine guns that provide sustained suppressive fire, these troops anchor defensive positions with a volume of fire that discourages enemy movement in the open.</p>
