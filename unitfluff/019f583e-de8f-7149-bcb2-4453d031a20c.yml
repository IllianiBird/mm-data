chassis: "Cazador"
overview: |-
  <p>The Cazador is a thirty-five-ton Clan BattleMech produced by Quixote Industries for the Escorpion Imperio, entering frontline service around 3102. Developed as a true combat evolution of the earlier Reptar MilitiaMech, the Cazador represented a critical milestone in the Imperio's transition from improvised garrison equipment to proper Clan-grade military hardware. Where the Reptar had been little more than an armed IndustrialMech, the Cazador was a proper BattleMech in every respect, built to Clan manufacturing standards. Filling the light striker role within the Imperio's expanding touman, the Cazador quickly established itself as a reliable and versatile light combatant well suited to the vast operational distances and limited support infrastructure of the Deep Periphery.</p>
capabilities: |-
  <p>The Cazador's designers focused on creating a versatile light combatant by building around a 175-rated fusion engine that provides a base top speed of 86 km/h. A supercharger attached to the engine allows the 'Mech to push to 108 km/h in short bursts, giving its pilot the ability to rapidly close with or disengage from threats, a critical advantage for a light design operating in the Deep Periphery where support may be distant.</p><p>The primary armament centers on a single LB 10-X autocannon mounted in the right arm, a weapon that provides impressive firepower for a thirty-five-ton chassis. The LB 10-X's ability to fire both standard slugs and cluster munitions gives the Cazador tactical flexibility, allowing it to engage armored targets at range or pepper faster opponents with scatter shot. Two tons of ammunition stored in a CASE-protected right torso bay ensure adequate endurance in extended engagements. A pair of small pulse lasers mounted in each side torso provide close-range defensive firepower with enhanced accuracy.</p><p>The endo steel chassis allows the design to carry six tons of armor, providing reasonable protection for its weight class, though MechWarriors are advised to rely on speed and the supercharger rather than absorb sustained fire.</p>
deployment: |-
  <p>No factory variants of the Cazador have been identified as of the mid-thirty-second century. The base configuration's combination of ballistic and energy weapons appears to satisfy the Imperio's doctrinal requirements for its light BattleMech forces without the need for specialized refits. Field reports suggest the design's versatility in its standard loadout has made variant development a low priority for Quixote Industries.</p>
history: |-
  <p>The Cazador's history is inseparable from the broader industrial development of the Escorpión Imperio. When Clan Goliath Scorpion was Abjured from the Clan Homeworlds in 3078, the displaced Clan conquered Nueva Castile and the Umayyad Caliphate to establish the Escorpión Imperio in 3080. The conquered territories possessed only a primitive industrial base, and the Scorpions' efforts to develop Clan-level manufacturing capabilities proved slow and difficult.</p><p>By 3086, Quixote Industries began producing the Reptar and Araña MilitiaMechs (designs that were closer to IndustrialMechs than true BattleMechs) to arm the Imperio's garrison caste drawn from native Castilian and Umayyad populations. These crude but functional machines served as an interim measure while the Scorpions worked to elevate their adopted territories' industrial capacity to Clan standards.</p><p>Over the following decades, sustained investment in industrial development gradually bore fruit. Quixote Industries' facilities on Aragon and Navarre, which had initially produced only the rudimentary Reptar, were upgraded as the Imperio's technological base approached Clan standards. By approximately 3102, these factories began producing the Cazador, a complete redesign that transformed the Reptar's basic chassis into a proper Clan-tech BattleMech. The transition from Reptar to Cazador production represented a significant milestone in the Imperio's industrial maturation.</p><p>The Cazador entered service as tensions between the Escorpión Imperio and the neighboring Hanseatic League continued to escalate. When the Imperio launched its invasion of the League in 3141 (the Hanseatic Crusade) the Cazador was among the designs fielded by the Imperio's integrated Galaxies of Goliath Scorpion, Umayyad, and Castilian troops. The brutal campaign concluded with a Scorpion victory and the formation of the Scorpion Empire from the conquered Hansa territories.</p><p>Under the reorganized Scorpion Empire, Quixote Industries' Aragon and Navarre facilities continued Cazador production, providing light BattleMech assets for the Empire's expanded garrison and security requirements across its growing domain in the Deep Periphery.</p>
