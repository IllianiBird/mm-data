chassis: "Pinion"
overview: |-
  <p>The Pinion is a forty-five-ton Clan Jade Falcon second-line BattleMech introduced in 3065, the second Clan design to roll off the production line at the refurbished Olivetti Weapons facility on Sudeten. Designed primarily for patrol and guard duty within the Jade Falcon Touman, the Pinion fills an unusual dual role as both a garrison 'Mech and a testbed for experimental heavy laser technology. The design also incorporates surplus components from the recently canceled ProtoMech program, making it as much a repository for available materiel as it is a deliberate combat platform.</p><p>Though firmly a second-line garrison design, the Pinion's all-energy weapons loadout and jump capability have proven well-suited to the extended patrol missions and defensive actions expected of its assigned formations.</p>
capabilities: |-
  <p>The Pinion carries an all-energy weapons loadout centered on a single Witherer heavy large laser, which serves as the 'Mech's primary striking weapon. While the heavy laser delivers considerable damage for its weight, it suffers from targeting difficulties inherent to the weapon class, a tradeoff the Jade Falcon leadership deemed acceptable for a second-line platform. Two Series 14a medium pulse lasers provide reliable mid-range firepower with improved accuracy, while four Raid micro pulse lasers mounted in the torso offer devastating close-range effectiveness against conventional infantry.</p><p>The all-energy configuration eliminates concerns about ammunition supply and the risk of catastrophic ammunition explosions, allowing the Pinion to operate on extended patrol missions without logistical support. A standard 225-rated fusion engine provides a cruising speed of 54 kph, supplemented by Clan Standard Type A1 jump jets granting 150 meters of jump capability, essential for navigating varied terrain on patrol duty. Fourteen double heat sinks manage thermal output adequately under normal conditions, though an alpha strike generates significant heat buildup without forcing a shutdown. The Raydient Series 2 armor provides reasonable protection for a 45-ton garrison design, though the Pinion is not intended to withstand sustained front-line combat.</p>
deployment: |-
  <p>The base Pinion entered service in 3065 as a second-line garrison 'Mech armed with a Witherer heavy large laser, two Series 14a medium pulse lasers, and four Raid micro pulse lasers. The micro pulse laser armament was always intended as a temporary measure, utilizing surplus weapons from the canceled ProtoMech program. Pinion pilots were required to attend weekly medical examinations and submit cockpit battle ROMs for study after any engagement involving the heavy laser, as part of the Jade Falcons' ongoing evaluation of heavy laser technology's effects on MechWarriors. Production of this configuration ceased in 3069 when micro pulse laser supplies were exhausted, and the line was converted to produce the Pinion 2.</p>
history: |-
  <p>The Pinion emerged from Olivetti Weapons on Sudeten in 3065, during the turbulent period of the FedCom Civil War. The facility, originally a Lyran Commonwealth weapons manufacturer founded by Michael Olivetti in 2990, had been captured by Clan Jade Falcon during the initial Clan Invasion and subsequently refurbished to produce Clan-tech designs. The Pinion was the second such design to enter production, following the Spirit which began rolling off the lines in 3063.</p><p>The circumstances of the Pinion's creation were shaped by Khan Marthe Pryde's controversial decision to halt all ProtoMech research and production within the Jade Falcon Touman in 3064. Pryde viewed the ProtoMech program as a failure, citing both the destruction of Clan Smoke Jaguar (the technology's primary proponent) and the reportedly poor performance of ProtoMechs during the Falcons' own combat operations against the Lyran Alliance. This decision left the Clan with a stockpile of micro pulse lasers and other ProtoMech-scale weapons that needed to be utilized rather than wasted.</p><p>Pinions were deployed primarily to Provisional Garrison Clusters throughout the Jade Falcon Touman, with the majority remaining within the Occupation Zone as replacements for BattleMechs lost during the incursion of 3064-65. Some units were allocated to Solahma Clusters, though typically only to pilots ranked Star Commander and above. Several Pinions saw action against the New Belt Pirates during this period and performed adequately in combat. The heavy laser testing program also continued, with pilots required to undergo weekly medical examinations and submit cockpit battle ROMs after any engagement in which the heavy laser was fired.</p><p>Production of the base Pinion ceased in 3069 in favor of the upgraded Pinion 2, which replaced the micro pulse lasers with more readily available small pulse laser technology. The Olivetti Weaponry facility continued producing the Pinion 2 until the factory was destroyed during the Wars of Reaving, ending all dedicated Pinion production. Despite this loss, field-refit Pinion 3 variants continued to appear throughout the Jihad and into the Dark Age, equipped with paired heavy large lasers that doubled down on the weapon technology the original design had been created to evaluate.</p>
