chassis: "Jump Platoon (CCAF)"
model: "(ER Laser 3052+)"
overview: |-
  <p>Capellan infantry serve where BattleMechs and armor cannot be spared, which in the resource-constrained CCAF means nearly everywhere. The Xin Sheng movement revitalized the infantry arm alongside every other facet of the Capellan Confederation Armed Forces, giving foot soldiers better equipment and renewed purpose. Jump-capable infantry give CCAF commanders a vertical mobility option for urban combat and rough terrain operations. The added cost of jump equipment limits their numbers compared to foot formations, but their ability to bypass obstacles and reach elevated positions makes them valuable in the defensive fighting the Confederation often faces. Armed with extended-range laser rifles that push the engagement envelope well beyond standard infantry weapons, these platoons can threaten targets at distances normally reserved for vehicle-mounted systems.</p>
