chassis: "Mechanized Hover Platoon (Taurian 3047+)"
model: "(SRM)"
overview: |-
  <p>The Taurian Defense Force assigns conventional infantry to garrison and planetary defense roles across the Concordat, where citizen-soldiers serve out of patriotic duty rather than mere obligation. Mechanized hover platoons are among the fastest ground infantry in the TDF, riding hovercraft that can traverse both land and water at speeds that let them cover the vast distances between Taurian population centers. The Concordat has historically favored hovercraft for its armor forces, and that preference extends to mechanized infantry as well.</p><p>Support elements carry man-portable short-range missile launchers firing the same warheads used by BattleMechs and combat vehicles, giving the platoon a potent anti-armor punch at close range.</p>
