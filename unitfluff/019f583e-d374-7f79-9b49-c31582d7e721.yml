chassis: "Calliope"
model: "CAL-1MAF"
overview: |-
  <p>The Calliope is a forty-ton garrison BattleMech introduced in 3127 by Majesty Metals and Manufacturing for the Magistracy Armed Forces. Named after the ancient Greek muse of poetry, the design was conceived in 3124 to address the Magistracy's need for a purpose-built anti-infantry and anti-vehicle platform, replacing the aging Snake BattleMech that had long served both the Magistracy of Canopus and the Capellan Confederation in that capacity. Focused on rugged reliability and ease of maintenance, the Calliope has proven effective in its intended garrison role and earned a solid reputation among Periphery operators. Majesty Metals has successfully marketed the design beyond its original patron, securing sales to the Capellan Confederation, the Duchy of Andurien, and several mercenary commands.</p>
capabilities: |-
  <p>The Calliope's armament centers on a Ceres Arms plasma rifle mounted in the right arm, a weapon devastating against infantry and battle armor formations capable of incinerating entire squads in a single volley. The plasma rifle's intense thermal output also serves to overheat opposing BattleMechs, degrading their combat effectiveness even when direct damage is modest. Complementing this is a Spencer Selectable nine-tube multi-missile launcher in the left torso, providing flexible engagement options at both long and short ranges depending on the ammunition loaded. CASE protection in the left torso mitigates the risk inherent in carrying missile ammunition.</p><p>The design's primary limitation is its complete ammunition dependency, carrying only two tons of plasma rifle rounds and two tons of missile ammunition. Once expended, the Calliope is reduced to physical attacks. The forty-ton chassis manages a modest top speed of eighty-six kilometers per hour with no jump capability, making it reliant on favorable terrain and lancemate support. Maximillian ferro-fibrous armor provides solid protection for its weight class, while the endo steel frame and compact gyro free internal tonnage for the weapons payload and double heat sinks necessary to manage the plasma rifle's thermal signature.</p>
deployment: |-
  <p>The standard production model fields the combination of plasma rifle and multi-missile launcher that defines the Calliope's anti-infantry doctrine. Majesty Metals allocated a percentage of the initial production run to the mercenary market, and mercenary-operated units across the Periphery quickly proved the design's effectiveness against conventional forces. The base configuration remains the most common variant in service, forming the backbone of Magistracy garrison lances on worlds where pirate raids and insurgent activity demand a reliable anti-infantry platform rather than a dedicated BattleMech duellist.</p>
history: |-
  <p>The Calliope first saw combat in 3129 on the world of Afarsin, where a pair of the BattleMechs engaged pirate forces in an equatorial desert. The engagement demonstrated both the design's strengths and limitations, as the two Calliopes used their primary weapons to overheat and slow two lances of medium and light pirate BattleMechs before eventually causing an enemy Crusader's ammunition to detonate, turning the tide of battle. The victory came at a cost, however, as subsequent destruction of several Calliopes on more temperate worlds revealed that MechWarriors engaging heavier opponents found themselves outmatched without the desert's heat amplification working in their favor.</p><p>Magistracy Armed Forces commanders quickly adapted their tactical doctrine, pairing inexperienced Calliope pilots with more seasoned lancemates to ensure the slow, lightly armored BattleMech was employed in its intended anti-infantry role rather than pressed into direct BattleMech combat. Mercenary units operating Calliopes during the invasion of Logan Prime further refined this approach, holding the machines in reserve for counter-attacks against infantry formations rather than committing them to front-line engagements against opposing 'Mechs.</p><p>The Calliope's garrison role has driven its adoption across the broader Capellan-Canopian alliance. Capellan Armed Forces units have deployed the design against Federated Suns infantry and militia during border operations, where its devastating effect against conventional troops has proven as effective as Magistracy combat doctrine predicted. The design's rugged, easily serviced construction has made it particularly popular among Periphery garrison commands and mercenary units operating far from established supply networks, where simplified field maintenance keeps operational readiness high even with limited technical support.</p>
