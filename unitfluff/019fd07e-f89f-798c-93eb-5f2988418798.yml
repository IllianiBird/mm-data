chassis: "Field Artillery Platoon (Generic)"
model: "(Motorized Sniper 2200+)"
overview: |-
  <p>Motorized infantry platoons use light ground vehicles, typically motorcycles or utility trucks, for rapid movement between positions. Faster than foot infantry and cheaper than fully mechanized formations, motorized platoons fill the gap between static garrison troops and armored combat units. They excel at road-bound patrol routes, rapid redeployment along prepared axes, and screening operations where speed matters more than protection. Off-road performance depends heavily on terrain and vehicle type, and the troops must dismount to fight, leaving their transport vulnerable.</p><p>Towing Sniper artillery pieces, these platoons deliver medium indirect fire that can breach field fortifications and scatter infantry concentrations at ranges measured in kilometers.</p>
