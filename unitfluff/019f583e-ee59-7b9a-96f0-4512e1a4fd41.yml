chassis: "Stefan Amaris Battleship"
overview: |-
  <p>The Stefan Amaris-class battleship was the Rim Worlds Republic's crowning naval achievement and the only battleship ever produced by a Periphery nation. Commissioned by President Stefan Amaris and constructed at the Rockwell-Vasquez Starcraft facility on Zertarum, the class entered service in 2764 as the culmination of longstanding Republic ambitions for a modern capital WarShip. Designed as a heavily armored battlewagon capable of anchoring a fleet engagement, the Stefan Amaris carried a formidable broadside arsenal and extensive support facilities for fighters and DropShips. Though unable to match the sheer mass of the Hegemony's premier designs, the class earned respect for its protective qualities and the reach of its capital weaponry. The class bore its creator's name with pride, regarded within the Republic as a symbol of national accomplishment and naval resurgence.</p>
capabilities: |-
  <p>Displacing 1,040,000 tons across 1,605 meters of hull, the Stefan Amaris holds the distinction of being the longest WarShip ever built, though at roughly half the mass of a McKenna it carries correspondingly less firepower. The class compensates with superior armor protection: nearly 1,900 tons of ferro-carbide plating provide better coverage than even the Hegemony's flagship class. Nine Heavy Naval PPCs form the primary capital battery, with three mounted in the nose and three on each broadside. Eight NAC/30 and eight NAC/25 naval autocannons provide devastating broadside fire across the forward, broadside, and aft quarter arcs, while eight Killer Whale capital missile launchers in the forward and aft quarters deliver long-range striking power. A single NAC/40 and two NL45 naval lasers defend the stern. Every arc carries identical conventional batteries of three Gauss rifles, four LRM-20 racks, four medium lasers, and four small pulse lasers for anti-fighter defense.</p><p>Lithium-fusion batteries allow rapid successive jumps, dramatically enhancing the class's strategic mobility. Four docking collars, thirty-six fighters across two bays, six small craft, and over 111,000 tons of cargo capacity provide substantial operational flexibility. The combination of heavy armor and long-range capital weaponry makes the Stefan Amaris a dangerous opponent at range, though its comparatively modest mass limits the volume of fire it can sustain against heavier battleship designs.</p>
deployment: |-
  <p>The first three completed hulls received their lithium-fusion battery upgrades at Hegemony shipyards and were conducting shakedown cruises when the Usurper murdered First Lord Richard Cameron on 27 December 2766. All three immediately played major roles in securing the Hegemony and eliminating SLDF naval forces. The RWS Stefan Amaris herself, the class flagship, was destroyed that same day over the Pacific Ocean by the SLS Enterprise, a McKenna-class battleship, during the fierce eighteen-hour orbital battle above Terra.</p><p>The fourth and fifth hulls, the RWRS Gregory Amaris and RWRS Terens Amaris, were still under construction when the SLDF conquered the Rim Worlds Republic. General Kerensky ordered both vessels completed and renamed: the SLS Vengeance and SLS Chieftain. The Vengeance served with Admiral Akkayev-Cameron's Fourth Fleet and was destroyed during the assault on New Home in early 2775. The Chieftain met a more celebrated end, leading Task Force Leonidas during Operation LIBERATION in January 2777. That forty-vessel suicide mission destroyed 106 Caspar drone WarShips over forty-two hours of continuous combat before every vessel in the task force was annihilated. Fewer than thirty of the roughly eight thousand personnel assigned to the task force chose to leave when offered the chance before the mission launched.</p>
history: |-
  <p>The Stefan Amaris-class battleship emerged from centuries of frustrated Rim Worlds Republic naval ambition. The Republic had been among the first Periphery nations to develop true capital WarShips, but the devastating Reunification War forced them to abandon those efforts. When Stefan Amaris ascended to the presidency, he brought renewed focus to his admirals' long-standing desire for a modern fleet. While the Republic initially contented itself with purchasing mothballed Star League designs and producing copies of existing vessels, most of which proved less efficient and more problematic than their originals, Amaris demanded something grander: the Human Sphere's premier battleship.</p><p>Rockwell-Vasquez Starcraft at Zertarum could not deliver the most massive WarShip ever built as Amaris had hoped, but they designed an effective battlewagon that claimed the record for sheer length. Smaller than the Hegemony's McKenna, the Stefan Amaris was well protected but outgunned by that king of all WarShips. Amaris achieved his greatest coup prior to the assassination of Richard Cameron by manipulating the young First Lord into selling advanced jump drive technology for the new battleships, a capability that dramatically enhanced their strategic mobility.</p><p>Only five hulls were laid down. The first three were completed and sent to Hegemony shipyards for final upgrades, placing them in position for immediate use when Amaris launched his coup on 27 December 2766. All three participated in seizing the Terran Hegemony and destroying SLDF naval forces, though the class flagship was lost that same day in the orbital battle above Terra. Two incomplete hulls remained in the Rim Worlds; after the SLDF conquered the Republic, General Kerensky ordered both completed and pressed into service under new names. One served with the Fourth Fleet and was destroyed during Operation CHIEFTAIN. The other earned a heroic legacy by leading a deliberate suicide mission against Caspar drone WarShips defending the Sol system, clearing nearly forty percent of those automated defenders before being annihilated with her entire task force. None of the five Stefan Amaris-class battleships survived the liberation of the Terran Hegemony, and the class passed into history bearing both the Usurper's stigma and the heroism of the crews who turned his weapons against his legacy.</p>
