chassis: "Foot Platoon (AFFS)"
model: "(Rifle Heavy 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Foot infantry remain the backbone of AFFS planetary garrisons, cheap enough to deploy in numbers across the Federated Suns' vast territory and reliable enough to hold ground that BattleMech forces cannot permanently occupy. Carrying heavy assault rifles alongside their standard arms, these platoons pack a harder punch than standard rifle formations, trading some logistical simplicity for increased stopping power against armored targets.</p>
