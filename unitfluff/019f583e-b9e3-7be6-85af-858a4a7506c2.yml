chassis: "Field Gun demi-I (ComGuards)"
model: "(Motorized Light Gauss)"
overview: |-
  <p>Com Guard conventional infantry benefit from ComStar's access to preserved Star League technology, fielding weapons and equipment that match or exceed the standard issue of any Inner Sphere military, backed by the institutional discipline of the secular Order's professional military culture. Crewing compact gauss field pieces that trade maximum hitting power for reduced weight and improved portability, these gunners provide magnetically accelerated fire support that can be repositioned more readily than full-scale gauss weapons.</p>
