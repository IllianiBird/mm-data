chassis: "Scourge"
model: "SCG-WF1"
overview: |-
  <p>The Scourge is a 65-ton heavy BattleMech designed by Kaiser Systems on the Lyran world of Herzberg, first reaching production lines in 3131 using proven, readily available technology. An improved model incorporating advanced components followed two years later, enhancing combat performance while maintaining the same proven chassis. Conceived as a versatile general-purpose combatant equally capable of operating as a heavy scout, the Scourge fills a valuable niche between dedicated reconnaissance platforms and frontline assault units. Kaiser Systems licensed production to StarCorps Industries, significantly expanding availability beyond Lyran space. The relatively recent introduction of the Scourge means many opponents encounter it without prior knowledge of its capabilities, granting pilots a notable tactical advantage through unfamiliarity.</p>
capabilities: |-
  <p>Built on Kaiser's Quadriga I endo steel frame and powered by a VOX 325 XL engine, the Scourge achieves a top speed of 86 kilometers per hour, well above average for a 65-ton heavy 'Mech. Four Dynamo jump jets provide 120 meters of jump capability, granting the design exceptional tactical flexibility for its weight class. The 'Mech's combat profile draws comparisons to venerable designs like the Shadow Hawk and Vindicator in its ability to serve multiple battlefield functions.</p><p>The Scourge's primary armament centers on an Eisen Gauss rifle mounted in the left arm, delivering devastating long-range firepower. A quartet of Diverse Optics extended range medium lasers in the right arm provides potent close-range punch, enhanced in the WF1 model by an actuator enhancement system that yields exceptional accuracy. A single medium pulse laser in the left arm rounds out the weapons loadout. Durallex super light ferro-fibrous armor on the advanced model provides solid protection while keeping tonnage available for the weapons payload.</p><p>The design's principal limitation lies in its Gauss rifle ammunition supply. With only sixteen rounds available, sustained engagements can quickly deplete the Scourge's primary weapon, forcing pilots to rely on their laser array for continued combat effectiveness.</p>
deployment: |-
  <p>Entering production in 3133, this variant represents the fully realized Scourge design incorporating advanced technology. Durallex super light ferro-fibrous armor provides equivalent protection to the WD1's standard plating while saving critical tonnage, enabling the inclusion of an actuator enhancement system in the right arm. This system dramatically improves the accuracy of the four extended range medium lasers housed alongside it, transforming the Scourge's close-range engagement capability. The WF1 remains primarily in Lyran Commonwealth and Free Worlds League service, with its dependence on advanced manufacturing processes limiting broader distribution.</p>
history: |-
  <p>The Scourge emerged during a period of considerable upheaval in the Inner Sphere, entering service as the Blackout severed HPG communications across human-occupied space. Kaiser Systems, an established manufacturer on Herzberg, developed the design to meet the Lyran Commonwealth's growing need for versatile heavy BattleMechs capable of independent operations. The initial SCG-WD1 model reached production in 3131, using proven components that could be sourced reliably despite disrupted supply chains.</p><p>Recognizing the design's potential, Kaiser Systems licensed production to StarCorps Industries, which brought its facilities on Emris IV and Loburg online to produce the Scourge. This arrangement significantly increased production capacity and, through the Emris IV plant's location within the former Free Worlds League, expanded the design's reach beyond Lyran space. The advanced SCG-WF1 entered production in 3133, offering enhanced combat performance through advanced armor and improved targeting systems, though its reliance on advanced components restricted production volume compared to the more accessible WD1.</p><p>Kaiser Systems also explored more radical modifications during this period. An experimental prototype designated SCG-WX1 attempted to integrate Clan-specification weaponry and reflective armor into the Scourge chassis beginning in 3132. Persistent technical difficulties kept the prototype confined to Kaiser's test hangar. The sole WX1 was ultimately destroyed defending the factory complex during an Eighth Free Worlds Guards raid on Herzberg in 3134, ending the experimental program.</p><p>By 3136, the Scourge had established itself in Lyran service, seeing action against raiding forces throughout the Commonwealth's border regions. A militia garrison on Wiltshire employed a Scourge to devastating effect against raiding elements of Able's Aces that year, demonstrating the design's effectiveness in defensive operations against numerically superior light forces. The pirate-hunting mercenary Wrathful Privateers adopted Scourges as lance leaders in their scout company by 3140, successfully tracking raiders across Lyran worlds. These engagements underscored the Scourge's suitability for independent scouting operations, where its combination of speed, firepower, and durability allowed it to operate effectively ahead of supporting forces.</p><p>Export sales of the SCG-WD1 have spread the design to mercenary commands and smaller realms throughout the Inner Sphere and Periphery, though the advanced WF1 remains concentrated in Lyran and Free Worlds League service. The Scourge continues to see expanding adoption as commanders recognize its versatility in an era defined by disrupted communications and decentralized operations.</p>
