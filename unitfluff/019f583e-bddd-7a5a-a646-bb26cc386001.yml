chassis: "Mechanized Tracked Platoon (LCAF)"
model: "(Rifle 3058+)"
overview: |-
  <p>Reforms begun under Alessandro Steiner and reinforced by Federated Suns influence have integrated Lyran infantry into combined-arms operations more effectively than at any point in the Commonwealth's history. Mechanized tracked platoons deploy from armored personnel carriers that provide protection during movement and allow the formation to keep pace with heavier combat vehicles in offensive operations. Armed with standard ballistic assault rifles, these platoons deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
