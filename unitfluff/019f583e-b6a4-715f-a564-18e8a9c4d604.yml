chassis: "Field Gun Platoon (AFFS)"
model: "(Motorized Gauss 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing infantry-scale gauss cannon that propel slugs at hypersonic velocities, these field gun crews deliver the longest-ranged and most accurate direct fire available to conventional ground forces.</p>
