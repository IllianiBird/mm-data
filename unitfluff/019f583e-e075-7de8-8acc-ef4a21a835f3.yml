chassis: "Clint IIC"
model: "2L 'Leia'"
overview: |-
  <p>When the Star League Defense Force departed the Inner Sphere in 2784, they brought several prototype Clints in the original configuration mounting the Armstrong Buster autocannon. These prototypes were placed in a Brian Cache on Circe, where they languished throughout the Exodus Civil War until Clan Snow Raven claimed them following the annihilation of Clan Wolverine and the nuclear attack on their capital of Dehra Dun.</p><p>Snow Raven scientists worked to correct the stress problems on the 'Mech's frame caused by the heavier autocannon, and by 2830 had transformed the poorly regarded prototype into a well-armed reconnaissance 'Mech. The design was formally introduced in 2842 and became known as the Clint IIC, serving the Ravens through the Golden Century before production ceased in 2917.</p>
capabilities: |-
  <p>The Ravens' key modification was replacing the large Pitban 240 fusion plant with a locally produced Type 81 XL engine. While offering the same output as the Pitban, the Type 81 was much lighter, allowing technicians to reinforce the arm and shoulder skeleton that repeatedly failed on the prototypes. Additional spare mass was used to increase armor protection to seven tons and expand ammunition capacity to four tons.</p><p>During the Golden Century, the design was further modified, replacing the Armstrong Buster cannon with a Type KOV LB 10-X autocannon that allowed selectable ammunition loads, and upgrading the lasers to Series 2d extended-range medium variants. All other systems remained as in the original Andoran Industries model, and many retained their SLDF designations. Ironically, the Clint IIC still uses the original Sloane 220 Lockover targeting system, evidence of that component's exceptional quality.</p><p>The Clint IIC serves as an effective light 'Mech hunter, capable of ranging far beyond supply lines thanks to its generous ammunition reserves. However, the design retains only ten single heat sinks, limiting sustained fire capability, and its seven tons of standard armor provide adequate but not exceptional protection for a medium 'Mech of its era.</p>
deployment: |-
  <p>Debuting in 3128 on Noisiel in the Solaris VII arena circuit, this custom variant reverses the typical trend of Clan-modified Inner Sphere machines by starting from a Clan-built frame and incorporating Inner Sphere experimental technology. The designers removed the armor, jump jets, and autocannon from the original Clint IIC chassis, mounting instead a large variable-speed pulse laser and medium re-engineered laser alongside two retained Clan ER medium lasers, all linked to a Clan targeting computer for enhanced accuracy. Ballistic-reinforced armor provides specialized protection against autocannons and missiles commonly encountered in arena combat, though the cramped cockpit and lack of jump capability limit the design's tactical flexibility outside dueling scenarios.</p>
history: |-
  <p>Clan Snow Raven used the Clint IIC extensively during the Golden Century, deploying it in many clashes with other Clans. The most notable engagement was the defense of the Hellgate agrodomes in 2897, where the speed and maneuverability of the Clint IIC provided the Ravens with a significant advantage. However, battlefield inexperience cost them the fight, prompting the Clan to abandon the mining colony to the Steel Vipers only two years later.</p><p>With the Ravens' acquisition of OmniMech technology, many of their second-line 'Mechs were relegated to rear-echelon duty, including the Clint IIC. Following a policy of quality rather than quantity, by the late thirtieth century the Ravens faced the choice of decommissioning or mothballing the venerable design. The Blood Spirits' offer in 2977 to trade several of their WarShips for Snow Raven 'Mech surplus came at an opportune time, and most Clint IICs were transferred to the Spirits, becoming part of their Omicron Galaxy.</p><p>Following the destruction of several Blood Spirit Galaxies in their battles with Clan Star Adder and Clan Burrock, few Clints remained in Spirit service. The waning fortunes of the Clint IIC were reversed in 3052, when the Snow Ravens built the first new units since production ceased in 2917, seeking to exploit the invading Clans' need for equipment to replace their war losses. Clans Wolf and Ghost Bear acquired the largest numbers of the design, trading resources from the Inner Sphere for manufacturing output. The Ravens have refused to trade the design to either the Steel Vipers or Jade Falcons due to ongoing feuds with those Clans.</p>
