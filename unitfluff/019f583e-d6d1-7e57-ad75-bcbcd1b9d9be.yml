chassis: "Bakeneko"
model: "BKN-1K"
overview: |-
  <p>Before the Second Combine-Dominion War, cooperation between the DCMS and Clan Nova Cat allowed factories in the Irece Prefecture to rebuild and expand rapidly. The DCMS proposed a mid-sized BattleMech for long-range fire support and flanker roles, and engineers from Luthien Armor Works and Clan Nova Cat were given only six months to design and begin production. Using the Phoenix Hawk 3K chassis as a base, the fifty-five-ton Bakeneko began rolling off Irece Alpha's assembly lines in early 3100.</p><p>A large number of Bakeneko were produced in the year before the Ghost Bear invasion of 3100 destroyed the Irece Alpha plant, with the majority finding their way into DCMS formations. The Fifth Sword of Light and Eleventh Ghost regiment received particular concentrations of the design.</p>
capabilities: |-
  <p>Heavier and bulkier than the Phoenix Hawk it was derived from, the Bakeneko matches its ancestor's nimbleness through a combination of a Fusion 330 XL engine providing a top speed of 129 kilometers per hour and experimental Icarus 99 TurboProp jump jets offering 180 meters of jump capability. The turboprop pods mounted on the rear armor provide enhanced flight path control, and creative pilots have exploited them to generate obscuring dust clouds at speed before striking and fading from engagement.</p><p>The weapons suite combines a Blinding Vision-Mk2 large pulse laser and a Lord Light 4 light PPC with PPC capacitor for potent ranged firepower, supplemented by a Victory Heartbeat ER medium laser and twin Shigunga light MML-3 launchers for flexible munition support. StarSlab/5X armor with Clan CASE provides solid protection on the Alshain Type N endo steel chassis, while the JNE Integrated communications system and Build 3 Cat TTS targeting computer ensure adequate battlefield awareness.</p><p>The combination of long-range energy weapons and variable-munitions missile systems makes the Bakeneko a dangerous opponent at any range, though heat management demands careful fire discipline during sustained engagements.</p>
deployment: |-
  <p>The sole production variant, this variant combines Inner Sphere and Clan technologies on a fifty-five-ton endo steel chassis. The Fusion 330 XL engine enables top speeds of 129 kilometers per hour, while experimental TurboProp jump jets provide enhanced aerial control during 180-meter jumps. Primary armament consists of a large pulse laser and a light PPC with PPC capacitor for devastating alpha strikes, supported by an ER medium laser and twin light MML-3 launchers. StarSlab/5X armor with Clan CASE protects the chassis, and a full suite of JNE Integrated communications and Build 3 Cat targeting systems provide battlefield coordination capability. Produced exclusively at Irece Alpha before the facility's destruction in the Ghost Bear invasion of 3100, surviving Bakeneko serve primarily with the Fifth Sword of Light and Eleventh Ghost regiment.</p>
history: |-
  <p>The Bakeneko's rushed development reflected the urgency of the DCMS's rearmament program following the Second Combine-Dominion War. Engineers leveraged the proven Phoenix Hawk 3K chassis to accelerate production, incorporating Clan Nova Cat technology into a design intended for DCMS line regiments. The Irece Alpha factory produced a substantial number before the Ghost Bear invasion of 3100 destroyed the facility, ending production.</p><p>The DCMS paired Bakeneko with slower heavy and assault 'Mechs, using the design's speed to herd smaller enemy formations toward larger units. The Eleventh Ghost regiment perfected this tactic during the combat drop onto the Second Rasalhague Bears' muster point at the Battle of Trondheim in March 3100. With the Second Rasalhague outnumbered and scattered, the Eleventh used flanking Bakeneko to herd and entrap Dominion BattleMech Stars. Of the seven Stars destroyed by the Second Battalion of the Eleventh Ghost, Bakeneko were credited with nearly twenty-five percent of confirmed kills.</p><p>The design's desirability was demonstrated by at least one instance of a Rasalhague Dominion Watch operative stealing a factory-new unit from Irece before the plant's destruction. Nova Cat warriors also employed the Bakeneko in covert headhunting operations against suspected Black Dragon Society strongholds, leveraging the design's electronic warfare capabilities to prevent targets from calling for reinforcements.</p>
