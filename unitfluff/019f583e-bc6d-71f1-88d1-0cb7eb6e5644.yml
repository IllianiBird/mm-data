chassis: "Field Gun Platoon (FWLM)"
model: "(Wheeled Gauss 3040+)"
overview: |-
  <p>New technology and creative tactical thinking have long featured in FWLM infantry deployment, with varied unit types and specialized formations treated as the norm rather than the exception. Towing crew-served gauss rifles, these platoons field the most advanced ballistic direct-fire weapon available to conventional infantry. Magnetic acceleration delivers projectiles at extreme velocities with no recoil signature, though the weapon's power requirements and fragility demand careful handling.</p>
