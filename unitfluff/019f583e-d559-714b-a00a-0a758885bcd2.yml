chassis: "Malice"
model: "MAL-YZ"
overview: |-
  <p>The Malice was born from an unusual partnership between Eris Enterprises Design Group on Capolla and Dynamic Ordnance and Ammunition on Galatea, entering service around 3132 just before the devastating HPG Blackout plunged the Inner Sphere into isolation. Conceived as a fast assault 'Mech for the mercenary and Republic Armed Forces markets, the hundred-ton design immediately turned heads with its remarkable speed, unusual for its weight class. Despite disruptions to its manufacturing partnership caused by the political upheavals of the Dark Age, the Malice proliferated rapidly among mercenary commands and the Galatean Defense Force, earning a formidable battlefield reputation in a remarkably short period for such a young design.</p>
capabilities: |-
  <p>The defining characteristic of the Malice is speed that belies its hundred-ton frame. An LTV 400 XL engine propels the assault 'Mech to sixty-four kilometers per hour, making it one of the fastest designs in its weight class. To protect the vulnerable knee actuators at these speeds, Dynamic developed their signature "demon leg" double knee joint, a feature that has proven remarkably resilient in combat and earned the design its Protected Actuators reputation.</p><p>The primary armament of four Mydron Excel LB 5-X autocannons provides flexible engagement options, with cluster and slug ammunition allowing pilots to tailor their fire against targets ranging from battle armor to heavy vehicles. Four Diverse Optics Sunfire extended-range medium lasers supplement the autocannon battery at closer ranges. More than nineteen tons of Durallex Heavy armor plate gives the Malice excellent staying power for sustained engagements.</p><p>The design trades raw striking power for sustained volume of fire. The LB 5-X autocannons lack the devastating punch of heavier weapons, but their combined output across four barrels creates a withering hail that few opponents can comfortably endure. Twelve double heat sinks manage the thermal load adequately, allowing the pilot to maintain fire as long as ammunition holds out.</p>
deployment: |-
  <p>The rarest standard variant, this Eris-exclusive mixed-technology design serves as a fundamental rethinking of the Malice platform. An XXL engine and Clan-specification Endo Steel chassis reduce the top speed to fifty-four kilometers per hour but free tremendous weight for advanced systems. Ferro-Lamellor armor supplemented by Modular Armor panels across the torso, arms, and legs provides exceptional protection, while armored engine, gyro, and hip components enhance survivability against critical hits. The offensive loadout shifts entirely to energy weapons with Clan Large Pulse Lasers and extended-range large lasers, eliminating ammunition dependency. An Angel ECM Suite, Clan TAG, C3 slave, and dual Remote Sensor Dispensers create a sophisticated electronic warfare capability, while twin Clan Laser Anti-Missile Systems provide point defense. Coolant Pods offer emergency heat management when the twelve double heat sinks are overwhelmed.</p>
history: |-
  <p>The Malice emerged from one of the more unusual manufacturing partnerships of the Dark Age era. Eris Enterprises Design Group, a Capolla-based firm with access to Clan technology through its trade connections, joined forces with Dynamic Ordnance and Ammunition on Galatea to create a fast assault 'Mech targeting the mercenary market. The design proved immediately popular, with Republic Armed Forces units on Capolla and mercenary commands based on and around Galatea acquiring production runs as fast as both factories could deliver.</p><p>The HPG Blackout of 3132 and subsequent formation of Fortress Republic in 3135 dramatically altered the Malice's production arena. Eris found itself sealed within the Fortress walls, its Capolla facility continuing to serve Republic military needs while cut off from its partner. Dynamic, operating independently on Galatea, pivoted entirely to mercenary sales, feeding the insatiable demand for heavy combat machines among the Galatean Defense Force and independent military contractors.</p><p>This separation inadvertently spurred variant development. Dynamic focused on practical modifications suited to mercenary needs, while Eris leveraged its Clan technology access to develop the sophisticated MAL-YZ mixed-technology variant exclusively at the Capolla plant. The Malice saw extensive action across the fractured Inner Sphere, particularly in mercenary operations near the Lyran Commonwealth and Republic border regions. In 3144, a mercenary company called the Whiskey Tangos employed their Malices in a raid on the Lyran world of Vindemiatrix, demonstrating the design's effectiveness in combined-arms operations against defended positions.</p><p>Following the fall of Fortress Republic and the subsequent ilClan era upheavals, ownership of the Capolla facility transitioned through several hands. The Republic Institute of Strategic Combat's experimental superheavy variant, developed beginning in 3146, demonstrated the platform's continued potential for evolution even as the Republic collapsed around it. A salvaged RISC Malice recovered after the fighting on Terra eventually passed into Sea Fox possession, while the Capolla facility itself returned to Capellan Confederation control. On Galatea, Dynamic continued independent production, ensuring the Malice's ongoing presence in mercenary forces across the Inner Sphere.</p>
