chassis: "Dragoon"
model: "AEM-01"
overview: |-
  <p>The Dragoon was born from Stefan Amaris's ambitious vision to standardize the Amaris Empire Armed Forces around a family of modular, multi-mission combat platforms. Following the Amaris Coup in 2767, the self-proclaimed Emperor directed Terra's military contractors to develop a heavy BattleMech capable of replacing dozens of models through rapid reconfiguration. Krupp Stellar Technologies, builders of the Lancelot and a long-established producer of heavy machinery, won the contract over two competitors. Entering production in 2771 as Krupp's second BattleMech design, the seventy-ton Dragoon was designed around modular weapon subsystems that allowed depot-level reconfiguration for mission-specific loadouts, a concept that foreshadowed the later development of OmniMech technology. Though produced in strictly limited numbers, the Dragoon earned a fearsome reputation among those few formations that fielded it.</p>
capabilities: |-
  <p>The standard Dragoon mounts a potent armament of a Blankenburg Technologies 200 extended-range particle projection cannon supported by paired Krupp 120 KgK 78 L/66 LB 10-X autocannons, all carried in the arms. This loadout delivers excellent versatility at medium to long range, with the autocannons' dual-ammunition capability adding tactical flexibility against both hardened and dispersed targets. The absence of lower arm actuators prevents the design from delivering effective punches, though its seventy-ton mass makes its kicks devastating in close quarters.</p><p>A Nissan 280 XL fusion engine drives the Dragoon at a respectable sixty-four kilometers per hour, while Corwin Consolidated Model 3H jump jets provide a ninety-meter jump capability. Eleven and a half tons of PanzerFerro Type 7F ferro-fibrous armor offer solid protection for a heavy 'Mech, though the extralight engine creates inherent vulnerability to side torso penetration. A Guardian ECM Suite provides valuable electronic warfare coverage against advanced targeting systems.</p><p>The Dragoon's most notable engineering achievement is its modular subsystem architecture. Weapon and equipment housings mount to the chassis through universal attachment points, enabling rapid depot-level reconfiguration between mission profiles. While falling well short of true field reconfiguration, this design philosophy (inspired by the Mercury BattleMech) represented a significant logistics advantage and a conceptual stepping stone toward the OmniMech technology that would emerge centuries later.</p>
deployment: |-
  <p>The base AEM-01 configuration represents the Dragoon's standard frontline combat loadout, pairing a single extended-range particle projection cannon with twin LB 10-X autocannons for a versatile medium-to-long range engagement profile. Three jump jets and a Guardian ECM Suite enhance the design's tactical flexibility, allowing the Dragoon to exploit terrain and degrade enemy targeting systems. The first production models entered service in 2771, assigned exclusively to the elite of Amaris's military forces during the final years of the Star League Civil War.</p>
history: |-
  <p>The Dragoon's origins are inseparable from the ambitions of Stefan Amaris. Following his seizure of the Terran Hegemony in 2767, Amaris directed Terra's military-industrial complex to realize his long-held vision of standardized, reconfigurable combat platforms. Krupp Stellar Technologies submitted their winning proposal within months, and prototypes were presented to Amaris by early 2769. Full production commenced in 2771, with the first units delivered to the Fourth Amaris Dragoons.</p><p>Krupp opened two dedicated production lines for the Dragoon and its configurations but never matched the output levels the firm had achieved with the Lancelot. The 'Mechs were assigned primarily to Amaris's elite Dragoon and Guards regiments, with a handful gifted to mercenary units that had demonstrated skill and unwavering loyalty, often through acts later prosecuted as war crimes.</p><p>During the Liberation of Terra, the Star League Defense Force encountered the Dragoon with increasing frequency as Kerensky's forces pushed toward the Terran Hegemony's core worlds. While SLDF units made use of captured and salvaged specimens, the design never gained widespread adoption among Regular Army formations. Following the final liberation of Terra, General Kerensky ordered all surviving Dragoons scrapped and directed Krupp to retool its production lines for other purposes, reflecting the General's desire to erase the material legacy of the Amaris regime.</p><p>A relative handful of Dragoons survived the post-Liberation purge, scattered among peripheral garrisons and minor powers. These remnants did not survive the devastation of the first two Succession Wars, rendering the design functionally extinct well before the Third Succession War. Centuries later, a single remarkable example resurfaced in the hands of ComStar's Blessed Order, fitted with advanced Clan-derived technology and fielded during fighting on Epsilon Eridani, evidence of both the design's engineering durability and the resourcefulness of its inheritors.</p>
