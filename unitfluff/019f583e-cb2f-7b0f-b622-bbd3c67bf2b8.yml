chassis: "Talon"
model: "TLN-5V"
overview: |-
  <p>The Talon was first deployed in 2670 to provide light BattleMech companies with much-needed long-range firepower. Star League High Command was so impressed by the design during combat trials in 2669 that they immediately ordered full production, and sales to the SLDF quickly surpassed all other light BattleMechs. Commonly paired with the lighter Mongoose, the Talon provided covering fire should the reconnaissance unit encounter something it could not handle on its own.</p><p>Rendered extinct during the Succession Wars, the Talon was absent from the battlefield for over two centuries before Blackstone BattleMechs restarted production on Inarcs in 3056. The once-popular design quickly reestablished itself as a valued asset in light formations, earning renewed respect for its combination of speed and long-range hitting power.</p>
capabilities: |-
  <p>The Talon combines impressive speed with heavy long-range firepower, a rare combination in the light weight class. An Edasich Motors 280-rated extra-light engine propels the thirty-five ton machine to a maximum speed of nearly 130 kilometers per hour, allowing it to keep pace with virtually any reconnaissance unit. Blackstone markets the design as being able to outrun anything it cannot outgun.</p><p>The primary weapon is a Lord's Light-2 extended-range PPC, giving the Talon an engagement range approaching 700 meters. For close-range defense, a pair of ChisComp 39 medium lasers mounted on the left arm provide adequate firepower against other light 'Mechs. Seven and a half tons of Kallon Light Shield A standard armor give the Talon excellent protection for its weight class, enough durability to weather return fire while withdrawing from unfavorable engagements.</p><p>The design sacrifices jump capability entirely, relying on raw speed for maneuverability. The absence of jump jets can leave the Talon vulnerable in rough terrain, but on open ground its combination of speed, reach, and staying power make it a formidable opponent for anything in its weight class.</p>
deployment: |-
  <p>The original Talon introduced in 2670, this variant mounts a standard PPC rather than the extended-range model found on later variants. While lacking the reach of the TLN-5W, the standard particle projector cannon still provides formidable long-range firepower for a light 'Mech. The simpler weapon system produces slightly less heat, allowing the MechWarrior to fire all weapons while running without significant overheating concerns. Produced at the Briden BattleMechs Unlimited facility on Errai during the Star League era, this variant was distributed widely among regular SLDF formations and saw extensive service during the Amaris Civil War before attrition and the destruction of its production facility ended its run.</p>
history: |-
  <p>The Talon first saw action shortly after its introduction in 2670 and quickly proved itself invaluable to light 'Mech companies across the Star League Defense Force. Its long-range firepower filled a critical gap that had long plagued light formations, which traditionally relied on speed and numbers rather than hitting power. By the late Star League era, the Talon was among the most ordered light BattleMechs in SLDF service.</p><p>The TLN-5W upgrade in 2760 initially saw distribution restricted to Royal units. The Amaris Civil War changed this, with the TLN-5V distributed widely among regular SLDF formations and the upgraded TLN-5W seeing frontline service for the first time. Following the Exodus, every Successor State sought to acquire Talons as fast as they could be manufactured. Commanders attempted to replicate the original SLDF lance tactic of deploying three Talons alongside a Mongoose for headhunting and supply disruption behind enemy lines, substituting a Spector to flush out enemy commanders when Mongooses were unavailable.</p><p>The harshness of the Succession Wars proved too great for the design's survival. Production at the Briden BattleMechs Unlimited facility on Errai never kept pace with losses during the First Succession War. When several tactical nuclear strikes destroyed the factory in 2815, the Talon's fate was sealed. The last operational example was stripped for parts around 2830 to keep a House Kurita light lance functional.</p><p>The Inner Sphere would not see another Talon for over two centuries. In 3056, Blackstone BattleMechs announced they had secured production rights and restarted manufacturing at their facility on Inarcs. Sent to the Clan occupation zone border, the reborn Talon first saw combat during the Jade Falcon invasion of Coventry, where reports of its performance were highly favorable. During the FedCom Civil War, elements of the Seventh Crucis Lancers damaged Blackstone's production lines on Inarcs in 3065, though they returned to full capacity by late 3066.</p><p>Following the Civil War, the Lyran Alliance opened the Talon for export, recognizing that most Lyran units preferred traditional heavier formations. The Federated Suns and mercenary units absorbed much of the demand, while ComStar, the Free Rasalhague Republic, and the Draconis Combine acquired lances for evaluation. A few of these combined-arms lances have been spotted along the Jade Falcon border, though no command has fielded Talons in the numbers the original SLDF once did. Blackstone continued developing new variants through the Jihad and into the Dark Age, keeping the venerable design relevant with successive technological improvements.</p>
