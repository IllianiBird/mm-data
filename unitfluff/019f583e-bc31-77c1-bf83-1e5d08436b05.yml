chassis: "Motorized Platoon (DCMS)"
model: "(MG 2620+)"
overview: |-
  <p>Conventional infantry within the DCMS serve as the foundation of planetary defense, providing the manpower essential to territorial control while freeing BattleMech and armored assets for offensive operations. Motorized infantry travel on light unarmored vehicles that allow them to cover ground faster than the foot platoons that make up the bulk of DCMS garrison forces. District regulars rely on motorized platoons for security patrols across large garrison zones, forward observation, and the rapid response that foot troops cannot provide when trouble arises between widely separated posts. Their support squads operate portable machine guns that deliver sustained automatic fire at ranges well beyond personal weapons. A single well-placed machine gun team can suppress an entire enemy platoon and threaten light vehicles that would otherwise ignore conventional infantry.</p>
