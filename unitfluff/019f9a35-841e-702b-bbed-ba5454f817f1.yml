chassis: "Mechanized Wheeled Platoon (Generic)"
model: "(Rifle AA 2590+)"
overview: |-
  <p>Mechanized wheeled platoons transport their infantry in wheeled armored personnel carriers optimized for speed on roads and improved surfaces. Wheeled APCs are cheaper to maintain and faster on pavement than tracked alternatives, making these platoons ideal for garrison rapid-response forces, highway patrol, and urban security operations. Their off-road capability is limited compared to tracked vehicles, restricting employment in rough terrain, but on developed worlds with good road networks, wheeled mechanized infantry offer the best balance of speed, protection, and operating cost. Armed with assault rifles and man-portable anti-aircraft weapons, these platoons provide mobile air defense capability that can accompany mechanized formations on the move.</p>
