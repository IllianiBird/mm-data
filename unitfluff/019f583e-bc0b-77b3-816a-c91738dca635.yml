chassis: "Mechanized Tracked Platoon (DCMS)"
model: "(Gauss 3053+)"
overview: |-
  <p>The Combine's martial traditions extend beyond the BattleMech cockpit, and the Dictum Honorium demands that all citizens contribute their talents to the defense of House Kurita. Infantry soldiers of the DCMS embody that expectation on garrison worlds across the realm. Tracked mechanized infantry ride armored carriers that can cross rough ground where wheeled vehicles cannot follow. The DCMS values these platoons for operations on worlds with poor road infrastructure, where the broken terrain that stops lighter transport is simply another day's march for tracked APCs and the soldiers they carry. Armed with infantry-scale gauss rifles that use magnetic acceleration to hurl projectiles at extreme velocities. The longest-ranged and hardest-hitting personal ballistic weapon available to conventional soldiers, though the weapons are expensive and maintenance-intensive enough that most commands reserve them for their best marksmen.</p>
