chassis: "Battle Cobra"
model: "H"
overview: |-
  <p>The Battle Cobra emerged from Clan Steel Viper's early experiments with OmniMech technology during the Golden Century. When the Vipers successfully introduced their first OmniMech, the Crossbow, in 2870, engineers quickly recognized that an existing prototype could be adapted to incorporate the new arm-mounted weapon pod system. This redesign proved remarkably swift, and the Battle Cobra entered service in 2873 as a forty-ton medium OmniMech optimized for versatility and ease of maintenance. The design's relative simplicity and low production cost made it attractive beyond the Steel Vipers, drawing the interest of resource-strapped Clan Blood Spirit and eventually ComStar, which selected it as the basis for their own reverse-engineering efforts following the Battle of Tukayyid.</p><p>Originally produced by Clan Steel Viper, the Battle Cobra survived the destruction of its original manufacturer and has since been restored to production by Clan Jade Falcon, ensuring the venerable design continues to serve on the modern battlefield.</p>
capabilities: |-
  <p>The Battle Cobra was never intended to compete with heavier or faster OmniMechs for raw combat power. Its strength lies in its longevity, simplicity, and the ease with which technicians can service its exclusively arm-mounted weapon pods. The chassis employs endo steel internal structure and ferro-fibrous armor for weight savings, paired with a standard New Kent Type 240 fusion engine that provides a top speed of ninety-seven kilometers per hour while offering superior survivability compared to more fragile extralight designs. These choices leave fourteen tons of available pod space, all concentrated in the arms.</p><p>The primary configuration exemplifies the design's laser-centric philosophy, mounting a large pulse laser and small pulse laser in each arm for accurate fire at multiple engagement ranges. Advances in laser technology over the centuries have expanded the Battle Cobra's options considerably, but its limited pod tonnage means that most configurations run hot under sustained combat conditions. Attempts to deviate from the traditional energy weapon formula with heavier ammunition-dependent systems have generally produced mediocre results, as the restricted pod capacity cannot support adequate ammunition stores alongside the weapons themselves.</p>
deployment: |-
  <p>Alternate Configuration H abandons the pulse laser technology common to most Battle Cobra loadouts in favor of paired ER large lasers and heavy medium lasers. Four additional double heat sinks help manage the considerable heat generated by sustained fire, giving this Civil War-era configuration better thermal endurance than many of its contemporaries. The combination of long-range precision from the ER large lasers and punishing close-range damage from the heavy mediums provides effective coverage across multiple engagement brackets.</p>
history: |-
  <p>The Battle Cobra first saw widespread deployment with Clan Steel Viper's front-line Clusters during the late Golden Century, establishing itself as the premier medium OmniMech of the Viper Touman. Its combination of speed, durability, and reconfigurable firepower allowed it to serve effectively across the full spectrum of Clan warfare, from formal Trials to garrison duty. The design's low cost and straightforward maintenance requirements also made it attractive to Clan Blood Spirit, whose perpetually strained resources demanded efficient military hardware.</p><p>During the Clan Invasion of the Inner Sphere, Steel Viper Battle Cobras participated in operations across multiple worlds. The design's presence on Tukayyid during the crucial battle against ComStar proved fateful for its long-term legacy, ComStar recovered a significant number of largely intact Battle Cobras from the brutal fighting in the Devil's Bath, selecting the chassis as the centerpiece of their own OmniMech reverse-engineering program.</p><p>The Wars of Reaving brought catastrophe for the original production line. When the combined Clan assault annihilated Clan Steel Viper in 3075, the Novy Minsky Armaments Plant on New Kent was destroyed along with the rest of the Viper's industrial infrastructure. The Battle Cobra faded from Clan Space entirely, its production seemingly ended.</p><p>Ironically, the design's salvation came from one of the Steel Vipers' most bitter rivals. Following Clan Jade Falcon's conquest of Arc-Royal during the Dark Age, Falcon engineers discovered the deteriorating remains of the ComStar Battle Cobra production line at Arc-Royal MechWorks. Recognizing both the design's utility and the delicious irony of the situation, the Falcons restored and upgraded the facility to full Clan specifications. The Jade Falcons now field a design originally created by a destroyed enemy, reinterpreted by a second foe, and manufactured in a factory seized from a third, a fact they find endlessly amusing.</p><p>Pockets of resistance on Arc-Royal, typically anchored by battered Arc-Royal Militia 'Mechs, continue to harass Falcon forces. Raids around the city of Denton have become legendary for their unpredictability, though Falcon Battle Cobra pilots have proven adept at exploiting the design's maneuverability to counter these guerrilla tactics.</p>
