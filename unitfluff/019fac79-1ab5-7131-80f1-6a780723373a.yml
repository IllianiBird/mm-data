chassis: "Field Gun Platoon (Generic)"
model: "(Motorized Light Gauss 3065+)"
overview: |-
  <p>Motorized infantry platoons use light ground vehicles, typically motorcycles or utility trucks, for rapid movement between positions. Faster than foot infantry and cheaper than fully mechanized formations, motorized platoons fill the gap between static garrison troops and armored combat units. They excel at road-bound patrol routes, rapid redeployment along prepared axes, and screening operations where speed matters more than protection. Off-road performance depends heavily on terrain and vehicle type, and the troops must dismount to fight, leaving their transport vulnerable.</p><p>Towing crew-served light gauss rifles, these platoons trade the raw stopping power of full-size gauss weapons for improved mobility and a lighter logistics footprint, while still delivering magnetically accelerated rounds at ranges that exceed conventional autocannon.</p>
