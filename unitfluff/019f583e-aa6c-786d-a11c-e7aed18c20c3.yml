chassis: "Lee"
model: "(BattleMech Carrier)"
overview: |-
  <p>The Lee class DropShip was one of the last major military transports produced for the Star League Defense Force before the fall of the Star League. Entering production in 2756, this massive 17,000-ton Spheroid was conceived as part of an ambitious effort to streamline the SLDF's military transport fleet by fielding a single heavily armed and armored vessel capable of delivering large formations faster than any existing design. At twice the size of the standard Overlord, the Lee represented a new generation of military transport that emphasized speed, protection, and payload capacity in equal measure.</p><p>The Lee was produced in four distinct configurations to serve different roles within SLDF combined-arms doctrine. Its primary design carried a reinforced battalion of BattleMechs supported by aerospace fighters, while alternate configurations served as dedicated fighter carriers, armored vehicle transports, and fast cargo runners. This versatility made the Lee a cornerstone of late Star League military logistics, though the class would prove tragically vulnerable to the automated defense systems that guarded the Terran Hegemony during its darkest hours.</p>
capabilities: |-
  <p>The BattleMech Carrier is the primary configuration of the Lee class, designed to deliver a reinforced battalion of forty BattleMechs into combat. The massive Spheroid hull accommodates forty individual 'Mech cubicles with full maintenance facilities, supported by a squadron of six aerospace fighters for escort and close air support. Two small craft bays provide utility transport capability, and 957.5 tons of cargo capacity ensures adequate ammunition, spare parts, and supplies for sustained operations.</p><p>The Lee mounts ninety tons of ferro-aluminum armor providing 1,511 points of protection, making it one of the most heavily armored transports of its era. The drive system delivers a safe thrust of 2.5 gravities with a maximum of four gravities, exceptional speed for a vessel of its tonnage and well above the acceleration profiles of comparable transports like the Overlord. Two hundred three double heat sinks manage the thermal load from a comprehensive weapons array spanning all firing arcs. Structural integrity of 25 gives the hull exceptional resistance to critical damage, allowing the Lee to absorb punishment that would cripple lesser vessels.</p>
deployment: |-
  <p>The BattleMech Carrier was the most widely produced Lee variant and served as the backbone of SLDF heavy assault formations from 2756 onward. These vessels led planetary assaults during the Periphery Uprising, delivering reinforced BattleMech battalions with unprecedented speed. During the Liberation of Terra, the BattleMech Carrier suffered the heaviest losses of any variant to the Caspar drone fleets, and surviving vessels were held in reserve until the final landings on Terra where they deployed in large numbers for the decisive ground campaign.</p>
history: |-
  <p>The Lee class DropShip originated from a proposal presented to SLDF Commanding General Aleksandr Kerensky in 2749 by a consortium of three major naval yards in the Terran Hegemony. Kerensky's vision was to reduce the proliferation of military DropShip classes by creating a single design capable of carrying large payloads of SLDF troops into battle faster than anything currently in service. The development process was far from smooth, as political entanglements and boondoggles similar to those that had plagued the earlier Colossus class DropShip threatened to derail the program entirely.</p><p>Ironically, Star Lord Richard Cameron's attempts to block the Lee's production proved counterproductive. His opposition galvanized support among the Star League Council members who were increasingly wary of Cameron's erratic governance, and their collective approval pushed the design into production in 2756. The SLDF quickly ordered all four configurations, though the cargo transport variant saw the most limited production run with only three vessels completed before the program's priorities shifted to combat variants.</p><p>The Lee first saw major combat during the Periphery Uprising, where its ability to rapidly move large troop formations proved invaluable to the SLDF's suppression campaigns. The class's generous payload capacity allowed commanders to concentrate forces quickly at trouble spots, and the Lee's heavy armament meant it could contribute directly to orbital combat rather than relying entirely on escorts. These early engagements validated Kerensky's original vision of a fast, versatile military transport.</p><p>The Amaris Coup and subsequent Liberation of Terra transformed the Lee's role from triumphant to tragic. When the SLDF fought to reclaim the Hegemony, the Space Defense System's Caspar drone fleets proved devastatingly effective against the large, relatively slow transports. The Lee's substantial carrying capacity, once its greatest asset, became a catastrophic liability as each vessel destroyed took an enormous number of troops with it. Losses mounted so rapidly that surviving Lee transports were held in reserve until the final landings on Terra itself, where they deployed in large numbers for the climactic assault.</p><p>Few Lee class vessels survived the Liberation of Terra in operational condition, and those that did joined Kerensky's Exodus Fleet on its journey to the deep Periphery. The remaining ships were subsequently lost during the fierce fighting of the Pentagon Civil War, and no examples of the class are known to have survived into the modern era. The Lee stands as both a sign of late Star League engineering ambition and a cautionary example of how concentrated transport capacity can become a strategic vulnerability.</p>
