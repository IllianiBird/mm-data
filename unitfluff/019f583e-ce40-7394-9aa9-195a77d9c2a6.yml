chassis: "Crimson Hawk"
overview: |-
  <p>The Crimson Hawk is a twenty-five-ton Clan light BattleMech originally conceived by Clan Blood Spirit scientists on York around 3069, during the darkest period of their Clan's slow decline under Star Adder blockade. A Diamond Shark merchant commander discovered the partially completed prototype and won it through a Trial of Possession, transferring the design and its technical team to the Diamond Shark facility on Itabaiana by 3070. Under Diamond Shark stewardship, the light 'Mech was refined into a production model emphasizing firepower and armor protection over raw speed, filling a niche as a light striker suited for difficult terrain and swarm tactics.</p>
capabilities: |-
  <p>The Crimson Hawk is a 'Mech built on contradictions and deliberate deception. Its primary armament consists of two Clan extended-range large lasers, but the weapons are intentionally mismatched models, a design choice that reflects Diamond Shark cunning rather than Blood Spirit engineering. The Series 7J laser is mounted atop the torso on a distinctive hinge mount reminiscent of the venerable Shadow Hawk's "stow and go" autocannon, complete with an oversized cooling sleeve. The Series 7K in the right arm, by contrast, has been stripped to its essential mountings so that it visually resembles the much smaller Series 3K extended-range medium laser.</p><p>This deliberate confusion serves a tactical purpose: the mounting plates and connections can accommodate a Series 3K, allowing mission-specific weapon swaps that keep opponents guessing about the 'Mech's true capabilities. Built on the York II XT chassis with a 125-rated York XL engine, the Crimson Hawk achieves a respectable top speed of 86 kph while five Clan Series Type I Light jump jets provide 150 meters of jumping distance. The Compound 6A ferro-fibrous armor provides excellent protection for a twenty-five-ton design, though the commitment to heavy energy weaponry leaves the 'Mech reliant entirely on its power plant for sustained combat operations.</p>
deployment: |-
  <p>The base Crimson Hawk mounts paired extended-range large lasers in an unconventional arrangement designed to mislead opponents about its true firepower. The deliberately mismatched mounting configurations invite underestimation, a tactical advantage that experienced warriors exploit through ambush tactics. Five light jump jets provide excellent maneuverability across broken terrain, complementing the design's intended role as a light strike 'Mech capable of engaging heavier opponents at range before repositioning. The combination of heavy firepower, strong armor protection, and jump capability makes the Crimson Hawk a formidable ambush platform despite its modest tonnage.</p>
history: |-
  <p>The Crimson Hawk's history is inseparable from the tragic decline of Clan Blood Spirit. By the late 3060s, the Star Adders had established a slow, methodical blockade of the Blood Spirits on York, constricting their resources and morale while deliberately avoiding a full Annihilation, the Spirits served as a convenient crucible for Adder warriors seeking combat experience. It was during this period that Blood Spirit scientists quietly began work on the Crimson Hawk, though chronic shortages plagued the project from inception.</p><p>The design's fate changed dramatically in 3069 when a Diamond Shark merchant commander spotted the partially assembled prototype in an obscure hangar on York. The resulting Trial of Possession was fought in the Morgrave Swamplands by a Spirit Binary; the Sharks won decisively, with only two Spirit defenders surviving. The victorious Sharks transferred the entire design team and prototype to their facility on Itabaiana, where production development continued in secrecy through 3070.</p><p>By 3073, Draconis Combine intelligence agents observed Diamond Shark merchants loading Crimson Hawks aboard eight Overlord-C DropShips, which subsequently disappeared aboard the WarShip Titanic. The significance of this shipment became clear only later, when a Ghost Bear Watch intercept revealed that the Titanic had run the Star Adder blockade and escorted several DropShips to the surface of York before being destroyed, split in half by a large WarShip suspected to be the Adder vessel Sovereign Right or Absolute Truth. In 3074, an Overlord-C carrying ten Crimson Hawks as cargo was shot down over York, sparking a salvage battle between the Star Adder Tenth Armored Cavalry Cluster and the Blood Spirit Fifty-fifth Red Vanguard Cluster. Diamond Shark merchant caste records suggest that at the insistence of influential traders, over a Cluster's worth of Crimson Hawks was ultimately shipped to the beleaguered Blood Spirits, even as that Clan's extinction drew nearer.</p><p>The Crimson Hawk quickly attracted interest beyond its original patrons. Jade Falcon merchants eagerly acquired examples, likely driven by the severe internal conflicts devastating the Falcon Touman within their Occupation Zone during the Jihad. Clan Wolf-in-Exile opened negotiations with the Diamond Sharks for both the design and possible production rights, eventually establishing refit capabilities on Arc-Royal. A separate Clan Wolf refit program operated from facilities on Weingarten. As the Diamond Sharks (later renamed Clan Sea Fox) expanded their commercial network through the Dark Age and into the ilClan era, the Crimson Hawk remained in steady production at both the Itabaiana plant and Trellshire Heavy Industries on Twycross, ensuring continued availability across the Inner Sphere and Clan markets alike.</p>
