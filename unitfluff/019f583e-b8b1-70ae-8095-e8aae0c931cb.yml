chassis: "Mechanized Hover Platoon (CCAF)"
model: "(Plasma 3063+)"
overview: |-
  <p>The CCAF fields conventional infantry in larger numbers than its limited industrial base might suggest, drawing on the Confederation's deep tradition of citizens' militia service. Capellan soldiers learn to fight with fewer resources and less support than their counterparts in wealthier states, compensating with resourcefulness and ideological commitment. Hover-mechanized platoons are the fastest infantry formation in the CCAF, using hovercraft transports capable of crossing water and open ground at speeds that tracked and wheeled vehicles cannot match. Their speed makes them effective scouts and flanking elements, though the hover transports themselves are fragile. Plasma rifle sections carry one of the most advanced man-portable energy weapons available, delivering devastating thermal damage that can threaten light vehicles and battle armor at close range.</p>
