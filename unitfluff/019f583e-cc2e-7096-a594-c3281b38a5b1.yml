chassis: "Jinggau"
model: "JN-G7L"
overview: |-
  <p>The Jinggau emerged from the Shengli Arms facility on Victoria in early 3059, a product of the Capellan Confederation's Xin Sheng revitalization movement and the unlikely assistance of the Word of Blake's Toyama faction. The sixty-five-ton heavy cavalry design was one of several BattleMechs developed using the old Star League-era production infrastructure on Victoria, with Blake technicians helping to refurbish the facility as repayment of a personal debt owed to Chancellor Sun-Tzu Liao. The name Jinggau, reportedly meaning "siren," proved apt, the design was built to announce its presence on the battlefield with devastating force rather than operate from the shadows. Despite early complications during development, the Jinggau would prove itself a formidable combatant and a cornerstone of the modern Capellan Confederation Armed Forces.</p>
capabilities: |-
  <p>The Jinggau is designed to wade into the thick of combat rather than skulk at the edges of an engagement. Built on a lightweight Chariot Type II Endo Steel chassis and powered by a VOX 325 XL engine, the design achieves a top speed exceeding eighty-six kilometers per hour while five Hellespont Leaper jump jets provide one hundred and fifty meters of jump capability, allowing it to close rapidly across almost any terrain. Over eleven tons of armor give the Jinggau excellent survivability for its weight class, ensuring it can absorb punishment while pressing the attack.</p><p>The primary weapon is the formidable Zhi-tong-yao Gauss rifle, capable of striking targets at extreme range and delivering punishing kinetic impacts that can stagger even assault-class machines. Sixteen rounds of ammunition allow the Jinggau to sustain fire through several engagements before requiring resupply. As the range closes, four Diverse Optics extended-range medium lasers and a precise Raker-IV medium pulse laser provide withering close-range firepower that exploits any weakened armor the Gauss rifle has already compromised.</p><p>The reliance on an XL engine represents the design's primary vulnerability, a penetrating hit to the side torso can prove catastrophic. Additionally, the two-ton ammunition bay for the Gauss rifle presents an explosion risk if the internal structure is breached, though the weapon itself does not generate waste heat. Thirteen double heat sinks manage the thermal load effectively under normal combat conditions.</p>
deployment: |-
  <p>Introduced during the Jihad in 3068, this variant applies advanced Capellan weapons technology to the proven Jinggau chassis. The Gauss rifle and laser array are replaced with a pair of plasma rifles mounted in the right arm and six standard medium lasers in the left arm, creating a devastating close-range combatant capable of inflicting severe thermal damage on enemy machines while maintaining respectable direct-fire capability. The heat sink count is increased to fifteen double heat sinks to cope with the substantially higher thermal output, though aggressive use of both plasma rifles simultaneously can still overwhelm the cooling system.</p>
history: |-
  <p>The Jinggau's origins are inextricably linked to the Capellan Confederation's Xin Sheng movement and the restoration of the Star League-era production facility on Victoria that became Shengli Arms. Toward the end of 3058, the Word of Blake's Toyama faction began providing Chancellor Sun-Tzu Liao with technicians and material resources to finish overhauling the facility, reportedly as repayment of a personal debt. This assistance accelerated the development of several new designs, with the Jinggau walking off the assembly line in early 3059. Production was halted for over a year after the initial run revealed that both arm sections required extensive redesign, but by 3060 the line had resumed in limited numbers.</p><p>The Jinggau quickly proved its worth during the Capellan-St. Ives War, where its combination of speed, firepower, and armor made it an ideal spearhead for Capellan offensive operations. As production increased, the design saw service with elite units including the Tau Ceti Rangers, Warrior Houses, and the Death Commandos. The Shengli Arms facility continued to develop variants through the Civil War period, introducing the plasma rifle-armed JN-G7L and the stealth-capable JN-G9CC during the Jihad. However, the Word of Blake Jihad inflicted devastating damage on Shengli Arms when renegade elements attacked in late 3068, crippling production lines and causing an estimated eighty-four percent loss of capital and personnel. The facility eventually restored Jinggau production to limited capacity, operating at roughly sixty-three percent output by 3079.</p><p>The design's fortunes shifted dramatically during the Victoria War when the Federated Suns invaded Victoria in 3103. The Fifth Capellan Defense Force, unwilling to let Shengli Arms fall to the enemy, razed the facility entirely. The Federated Suns subsequently sold the gutted plant to Kallon Industries, which refurbished it to produce Davion designs instead. For over four decades, no new Jinggaus left the Victoria production lines, though significant numbers remained in service across multiple nations through salvage, battlefield capture, and the Clan Hell's Horses refit programs that emerged after Operation SCOUR in 3078.</p><p>The Jinggau's renaissance came in 3145 when the CCAF recaptured Victoria. Shengli's engineers initially presented a modernized design under the "Jinggau II" designation, but Capellan officials quashed the name in favor of continuity, preferring to frame the return to Jinggau production as a restoration of normalcy rather than a new beginning. The resulting JN-G9B incorporated Clan Sea Fox-supplied technology alongside domestic innovations, producing a formidable modern combatant that surprised Republic Armed Forces defenders during Operation Clarity with its triple-strength myomer-enhanced speed and increased survivability. By the ilClan era, the Jinggau had become a truly multi-national design, with original Capellan production models, Clan-technology refits, and mixed-tech conversions serving across the Inner Sphere in the forces of the Confederation, Federated Suns, Free Worlds League, Republic remnants, and Clan Hell's Horses alike.</p>
