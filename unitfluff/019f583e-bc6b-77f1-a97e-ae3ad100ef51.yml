chassis: "Field Gun Platoon (FWLM)"
model: "(Wheeled AC2 3035+)"
overview: |-
  <p>New technology and creative tactical thinking have long featured in FWLM infantry deployment, with varied unit types and specialized formations treated as the norm rather than the exception. Towing crew-served autocannon/2 field guns, these platoons provide long-range direct fire support that supplements a formation's organic firepower. The light caliber offers sustained suppressive fire at extended range, though stopping power against armored targets is limited.</p>
