chassis: "Wasp LAM"
model: "WSP-110"
overview: |-
  <p>The Wasp LAM represents the refined second-generation development of Harvard Company's Land-Air 'Mech concept. The WSP-105 Mark II emerged in 2701 after seven years of operational experience with the original WSP-100 series revealed opportunities for significant improvement. Engineers eliminated the bomb bay in favor of a larger engine, additional maneuvering thrusters, and improved armor protection, creating a more versatile platform better suited to the varied demands of combined-arms warfare.</p><p>The Mark II proved more survivable than its predecessor and served throughout the final decades of the Star League. However, production ceased with the destruction of Harvard Company's Epsilon Eridani facilities during the First Succession War, and the technological regression of the Succession Wars meant surviving examples could not be replaced or properly maintained.</p>
capabilities: |-
  <p>The WSP-105 addressed the Mark I's most significant limitations by trading the bomb bay for enhanced overall performance. A larger engine improved speed and responsiveness in all modes, while additional maneuvering thrusters enhanced the airframe's agility during aerospace operations. The standard armament of medium laser and SRM-2 with ammunition provided more consistent firepower than the Mark I's one-shot missile system.</p><p>In BattleMech mode, the Mark II offers improved protection over the original Wasp LAM, though it remains lightly armored by contemporary standards. The design excels in the reconnaissance and raiding roles for which LAMs were intended, using its conversion capability to bypass terrain obstacles and air defenses that would impede conventional forces.</p><p>The lack of variant models is surprising, numbering only the classic SLDF variants and the obscure Liao versions. Limited payload space provides limited options for significant modification, constraining the customization possibilities that other chassis enjoy. The fragility of the LAM conversion system also discourages extensive field modification.</p>
deployment: |-
  <p>This variant emerged during the Word of Blake Jihad as a testbed for revived LAM technology, incorporating advanced materials including composite internal structure. The design mounted double heat sinks and replaced the One-Shot SRM-2 with a medium variable-speed pulse laser while retaining the bomb bay capability. Developed around 3075, this experimental variant never entered mass production, and its current status remains uncertain following the Jihad's conclusion.</p>
history: |-
  <p>The WSP-105 entered production in 2701 at Harvard Company's Epsilon Eridani facilities, supplementing and eventually replacing the Mark I series in SLDF service. The improved design proved popular with LAM pilots who appreciated its enhanced survivability and more consistent weapons loadout compared to the bomb-bay-equipped original.</p><p>The collapse of the Star League proved catastrophic for LAM production. Harvard Company's Epsilon Eridani facilities were destroyed early in the First Succession War, eliminating the primary source of new Wasp LAMs and spare parts. The 'Mech grew increasingly scarce as the only source of spare parts became another Wasp LAM. The technological regression of the Succession Wars meant surviving examples could not be replaced, and attrition steadily reduced their numbers.</p><p>Tai-i Mandrake Matherson of the Twelfth Dieron Regulars' Special Air Lance achieved notoriety commanding a four-LAM force that discovered an SLDF-grade armor cache on Galtor. Reports of subsequently refurbishing the unit's WSP-105 armor proved exaggerated, in truth, Matherson merely managed to restore a 100-series Wasp LAM along with minor weapon modifications, concealing this fact for a decade until his death during the War of 3039. The Word of Blake's Jihad-era efforts to revive LAM technology produced the experimental WSP-110 testbed, but this design never entered mass production.</p>
