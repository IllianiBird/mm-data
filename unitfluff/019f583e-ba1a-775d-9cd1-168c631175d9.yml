chassis: "Foot demi-I (WOBM)"
model: "(MG)"
overview: |-
  <p>The Word of Blake Militia inherited ComStar's combined-arms organizational philosophy and its Star League-era equipment stocks, fielding infantry formations that ranked among the best equipped in the Inner Sphere during the Jihad. Foot infantry Level I formations provided the bulk of Protectorate garrison manpower, assigned to hold ground that the Militia's BattleMech forces had already taken. On occupied worlds, these platoons maintained checkpoints, patrolled population centers, and enforced curfews as the visible face of Blakist territorial control. Carrying infantry-portable machine guns that provide sustained suppressive fire, these troops anchor defensive positions with a volume of fire that discourages enemy movement in the open.</p>
