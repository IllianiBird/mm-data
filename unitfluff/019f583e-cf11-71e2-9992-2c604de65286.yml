chassis: "Rifleman II"
model: "RFL-3N-2"
overview: |-
  <p>The Rifleman II emerged from the Star League Defense Force's Royal program in 2773, representing a dramatic reimagining of Kallon Industries' venerable anti-aircraft platform. By adding twenty tons to the chassis weight and incorporating the most advanced technologies available, SLDF engineers transformed a capable fire-support 'Mech into a devastating assault-weight weapons platform. The design served exclusively with Royal units, never seeing widespread distribution before the Exodus.</p><p>When General Kerensky led the SLDF into exile, the Rifleman II accompanied them, disappearing from the Inner Sphere entirely. Rumors persisted throughout the Succession Wars of advanced Rifleman variants hidden in Periphery caches or carried by fortunate mercenary commands, but no confirmed sightings occurred for centuries. The most persistent legend involved the infamous Gray Noton, whose "Legend-Killer" Rifleman dominated the Solaris VII arenas, whispers suggested he had discovered an abandoned Rifleman II during his Periphery mercenary days and disguised it as a standard model to maintain his competitive advantage.</p>
capabilities: |-
  <p>The Rifleman II builds upon its predecessor's anti-aircraft excellence while addressing nearly every weakness that plagued the original design. An Endo Steel internal structure and Extralight fusion engine free sufficient weight for twelve tons of standard armor, a sixty percent improvement over the RFL-3N. The weapons array replaces the original's mixed armament with paired LB 10-X autocannons and Large Pulse Lasers, one of each mounted in the distinctive arm assemblies. This combination provides devastating firepower against both aerial and ground targets, with the cluster ammunition option offering particular effectiveness against fast-moving aircraft.</p><p>Fourteen double heat sinks manage the thermal load far more effectively than the original's ten single units, enabling sustained fire that the RFL-3N could never achieve. A Beagle Active Probe enhances the already-exceptional sensor capabilities, allowing pilots to detect hidden enemies and coordinate with friendly forces. Torso-mounted medium lasers provide close-range backup. The only significant drawback is the XL engine's vulnerability to side torso damage, a trade-off the Royal engineers deemed acceptable given the design's intended role engaging enemies at range rather than brawling in close quarters.</p>
deployment: |-
  <p>This variant emerged in 2773 as part of the SLDF Royal Command's equipment upgrade program, representing the ultimate expression of the Rifleman's anti-aircraft design philosophy. Twenty additional tons allowed comprehensive modernization: Endo Steel construction supported a Pitban 320 XL engine, while twelve tons of Kallon Royalstar armor finally gave the chassis adequate battlefield protection. Each arm mounted an LB 10-X autocannon paired with a Large Pulse Laser, devastatingly effective against aerospace assets and ground targets alike. Torso-mounted medium lasers and a Beagle Active Probe rounded out the configuration. Fourteen double heat sinks managed the thermal load effectively. The design saw limited service during the Amaris Civil War before being lost with the Exodus fleet, remaining unknown to the Inner Sphere until rediscovery in the post-Jihad era.</p>
history: |-
  <p>The Rifleman II served exclusively with SLDF Royal regiments during its brief Inner Sphere deployment, participating in the final campaigns against Stefan Amaris's forces on Terra. These elite units employed the design's superior firepower and sensor capabilities to devastating effect during the liberation, though the chaos of the conflict left few detailed records of specific engagements. When Kerensky called the Exodus, virtually every Rifleman II accompanied the departing fleet.</p><p>For three centuries, the Rifleman II existed only in fragmentary records and persistent rumors. The legend of Gray Noton's "Legend-Killer" kept speculation alive, with theories ranging from a lucky cache discovery to secret ComStar assistance. Noton himself never confirmed or denied piloting anything other than a standard Rifleman, and his unsolved murder in 3027 ensured the truth died with him. Various record sheets have attempted to reconstruct possible configurations, but whether any accurately represent the actual "Legend-Killer" remains unknown.</p><p>Technical Readout data recovered after the Clan Invasion finally confirmed the Rifleman II's specifications, though the design remains extraordinarily rare in the Inner Sphere. The Clans presumably retained some examples during their centuries of isolation, potentially incorporating the design into their touman or using it as a basis for the Rifleman IIC development. Any surviving Inner Sphere examples would be priceless relics of the Star League era, though none have been definitively authenticated since the rediscovery of the design's technical specifications.</p>
