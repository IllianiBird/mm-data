chassis: "Tiburon"
model: "2"
overview: |-
  <p>The Tiburon is a 35-ton Clan light BattleMech produced by Trellshire Heavy Industries on Twycross for Clan Sea Fox. Named for a large Terran shark found in the Caribbean, the design evokes the Clan's predatory heritage dating back to their Diamond Shark identity. First entering service in 3099, the Tiburon was developed during a period when the Clan was transforming from a decimated, centralized military power into a nomadic, spacefaring society of warrior-merchants. Unlike most Sea Fox military hardware, the Tiburon was not offered for sale to other factions, remaining exclusively in the hands of Sea Fox warriors. Fast and well-armed for its weight class, the design fills both scout and attack roles within Sea Fox light Stars across the Khanates.</p>
capabilities: |-
  <p>The Tiburon packs considerable firepower into a compact frame. Four Series 6b extended-range medium lasers provide its primary striking power, split between both arms, while a pair of Series 6c extended-range small lasers and two Pattern Alpha SRM-2 launchers offer additional close-range punch. All lasers are linked to the Multi-Spread 9 targeting computer, significantly improving accuracy and making the Tiburon a dangerous opponent in any engagement. In keeping with Clan Sea Fox's mercantile tendencies, most of the Tiburon's weapons are concealed behind retractable panels, giving the design a deceptively nonaggressive appearance until the moment of engagement.</p><p>A Watchdog CEWS integrated with the Able-Seven Sensor Suite gives the Tiburon powerful electronic warfare capabilities, disrupting enemy targeting and communications while extending the pilot's detection range. Built on an NCIA Type N endo steel frame and powered by a Standard 245 XL engine, the Tiburon reaches speeds near 120 km/h, outrunning most BattleMechs it encounters. Alpha Compound ferro-fibrous armor provides solid protection for a light design, and a CASE II system ensures that an ammunition explosion from the SRM reloads will not destroy the BattleMech outright. The design trades jump capability for raw speed and firepower, leaving it vulnerable if terrain prevents it from using its mobility advantage.</p>
deployment: |-
  <p>Introduced in 3113, this variant replaces the four extended-range medium lasers with improved heavy medium lasers. The heavier weapons deliver greater damage at the cost of increased heat generation and reduced effective range, making the Tiburon 2 better suited for aggressive close-quarters engagements where a single devastating exchange can decide a fight. All other systems remain unchanged from the base model.</p>
history: |-
  <p>The Tiburon emerged from Clan Sea Fox's transformation during the early thirty-second century. As the Clan abandoned fixed territorial holdings in favor of a nomadic, trade-based existence among the stars, new military hardware was needed to reflect this shift in doctrine. The former Diamond Sharks, recently renamed Clan Sea Fox, commissioned Trellshire Heavy Industries on Twycross to develop a fast, lethal BattleMech suited for the hit-and-run engagements that would characterize their new way of life.</p><p>The Twycross facility had a long and turbulent history before the Tiburon entered production. Originally a Lyran Commonwealth factory producing Stalkers, BattleMasters, and Riflemen, the plant passed through the hands of the Federated Commonwealth, Clan Steel Viper, and Clan Jade Falcon before the Diamond Sharks secured control during the Civil War era. The factory suffered significant damage during the Bloody Tricentennial attacks of late 3080, but the Clan invested heavily in rebuilding the facility. By the time production began in 3099, the refurbished plant had become a key asset in the Clan's military-industrial portfolio.</p><p>The Tiburon's exclusivity to Sea Fox warriors was unusual for a Clan that made its fortune selling military goods to any willing buyer. This policy reflected the Clan's desire to maintain a technological edge over its trading partners and potential adversaries. In an era when most Sea Fox military encounters involved Trials of Possession with other Clans seeking to take goods by force rather than commerce, the Tiburon's combination of speed, electronic warfare capability, and concentrated firepower proved invaluable. The design saw widespread deployment across all five Khanates, becoming a staple of light formations. By the ilClan era, the Alyina Mercantile League had assumed oversight of the Twycross production line, continuing to supply Sea Fox forces with this exclusive design.</p>
