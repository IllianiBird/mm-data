chassis: "Whitworth"
model: "WTH-0"
overview: |-
  <p>The Whitworth was first manufactured in 2610 as a medium BattleMech intended to fill the weight gap between the lighter Wasp and heavier Phoenix Hawk designs. Originally conceived as a missile support platform for scout and strike lances, the Whitworth emerged from the Whitworth Company's design bureau on Dieron as a competent if unremarkable machine. Known colloquially as the "Tin Woodsman" among both critics and admirers, the design offered respectable firepower and adequate armor protection for its intended fire support role.</p><p>Despite an enduring reputation for mechanical unreliability in its lower actuator systems, the Whitworth proved serviceable enough to see widespread deployment across the Star League and its successor states, earning a place as a rugged if ungainly workhorse in armies throughout the Inner Sphere.</p>
capabilities: |-
  <p>The Whitworth's primary armament consists of two Longbow-10 LRM launchers mounted in the torsos, providing substantial long-range firepower for a medium 'Mech. These weapons are slaved to the Garret D2J targeting system (the same anti-aircraft tracking system employed by the Rifleman and Quickdraw) giving respectable accuracy against aerial and ground targets alike. Three Intek medium lasers provide adequate close-range defense when enemies close the distance.</p><p>The design's most significant limitation is its slow maximum speed of 64 km/h, over 30 km/h slower than the Wasps and Phoenix Hawks it was designed to support. Four Whitworth Jetlift jump jets split between the legs partially compensate for this deficiency. Eight tons of Durallex Light armor provide reasonable protection, distributed heavily around the legs to protect the design's notorious weak point, a faulty actuator system in the hips and legs that can cause limbs to tear loose during aggressive maneuvering. Houses have been known to replace failed legs with those salvaged from other 'Mech designs, creating bizarre but functional hybrids.</p>
deployment: |-
  <p>Only twenty-four of these terror variants were ever constructed by the Whitworth Company's Rim Worlds Republic branch on a now-forgotten world, exclusively for the Amaris Dragoons in 2754. Replacing one medium laser with a Fleur-Static Flamer and mounting dual Harpoon-6 SRM launchers loaded with inferno rounds, this variant was designed as a terror weapon. Painted matte black, these Whitworths became infamous for their systematic razing of entire cities during the Amaris Civil War, their pilots showing little discrimination between military and civilian targets.</p>
history: |-
  <p>The Whitworth's origins trace to the Reunification War era, when the Whitworth Company on Dieron sought to create a medium fire support platform for Star League forces. The original WTH-1S model carried Harpoon-6 SRM launchers that encouraged pilots to engage in close-range combat for which the design was poorly suited, resulting in heavy losses. By 2689, Star League defense planners mandated the replacement of these weapons with Longbow-10 LRM launchers, creating the WTH-1 that would become the standard production model.</p><p>During the Star League era, the Whitworth served in both SLDF scout units and mobile strike lances, often deployed alongside Wolverines and Phoenix Hawks for reconnaissance-in-force missions, or providing fire support to heavier formations of Riflemen and Warhammers. The Rim Worlds Republic also fielded Whitworths, including the infamous WTH-0 variant used to devastating effect during the Amaris Civil War, where Republic forces employed inferno missiles and flamers to raze entire cities.</p><p>The destruction of the Whitworth Company's Dieron facility in 2776 during the Amaris Crisis eliminated the primary source of spare parts, condemning surviving Whitworths to gradual attrition throughout the Succession Wars. By the end of this era, fewer than three hundred remained operational, mostly in the hands of MechWarrior families who had passed the machines down through generations. The design earned the unflattering nickname "Worthless" among Federated Suns and Draconis Combine pilots, though the 'Mechs themselves continued to serve their units well.</p><p>The situation changed in 3035 when Whitworth Specialty Manufacturing was incorporated on Benjamin, reportedly with ComStar assistance as part of aid offered to Theodore Kurita. This company began producing spare parts and later developed upgrade kits following the Clan Invasion. Despite these efforts, most Whitworths were decommissioned from Great House militaries by the mid-3050s, finding new homes among mercenary companies and Periphery nations like the Taurian Concordat and Outworlds Alliance.</p><p>The Jihad prompted renewed interest in the platform, with both the Federated Suns and Draconis Combine developing C3-equipped variants to counter Blakist improved C3 technology. More recently, Marian Arms Inc. on Alphard has begun producing an improved variant that has spread throughout the Inner Sphere via salvage and Draconis Combine contracts, ensuring the Whitworth's continued presence on battlefields across known space.</p>
