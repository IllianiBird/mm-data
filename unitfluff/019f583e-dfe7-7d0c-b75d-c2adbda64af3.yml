overview: |-
  <p>The Icarus was the Free Worlds League's first attempt at an independently designed BattleMech. Developed by Corean Enterprises at their Stewart facility, the prototype emerged in 2470 after the League's acquisition of BattleMech technology in 2462. Intended as a mid-weight design to complement both the heavy Mackie and conventional armor formations, the Icarus represented an ambitious leap for a nation still mastering the fundamentals of 'Mech construction.</p><p>Corean fielded two competing design teams for the Free Worlds League Military's first native BattleMech contract. The Icarus reached prototype status first, but its rival (the Hector) proved far more successful and entered mass production. Only six Icarus prototypes were ever built, serving primarily as research and technology demonstration platforms. Though the original machines are long since extinct, several manufacturers produced RetroTech reproductions during the Jihad era to meet desperate wartime demand for any available military hardware.</p>
capabilities: |-
  <p>Built with the primitive technology available in the mid-twenty-fifth century, the Icarus was a forty-ton design that relied on brute simplicity. A primitive fusion engine drove the 'Mech to a maximum speed of sixty-four kilometers per hour (respectable for its era) though the absence of jump jets limited its tactical flexibility compared to later designs.</p><p>The primary weapon was a large laser mounted on the left arm, providing reliable firepower without ammunition dependency. Twin SRM-2 launchers offered close-range punch, while a pair of machine guns proved devastating against the conventional infantry formations that still dominated Age of War battlefields. A single small laser supplemented these weapons. The Icarus carried ten and a half tons of primitive armor, offering reasonable protection for its weight class but reflecting the manufacturing limitations of the period.</p><p>The design suffered from numerous engineering flaws inherited from its rushed development timeline, including chronic maintenance difficulties and poor overall performance relative to its mass. These shortcomings would later be addressed in the much-improved Icarus II.</p>
deployment: |-
  <p>The original Icarus prototype utilized a primitive cockpit, engines, and armor that reflected the technological limitations of the Age of War. Lacking jump jets entirely, the design relied solely on its ground speed for tactical positioning. The weaponry combined a large and small laser with twin SRM-2 packs and a pair of machine guns, creating a versatile if unsophisticated weapons package suited to engaging both 'Mech and conventional forces. Four of the six prototypes saw limited but favorable service with the Free Worlds League Military, providing Corean engineers with invaluable field data that would eventually inform the development of the Icarus II decades later.</p>
history: |-
  <p>The Icarus project began when Corean Enterprises, one of a handful of Free Worlds League manufacturers entrusted with BattleMech technology after 2462, set out to design the League's first native 'Mech. The Free Worlds League Military was intent on winning this competition, and Corean tasked two separate development teams with creating the new standard design for the FWLM.</p><p>The Icarus, a medium-weight striker intended to support heavy Mackie lances and conventional armor formations, was the first to reach prototype status in 2470. However, the rushed nature of the project produced numerous design flaws. While Corean's Icarus team worked furiously to correct these issues, the rival team unveiled the Hector, a year after the first Icarus walked out of the lab. Utilizing lessons learned from the Icarus's problems, the Hector team presented an operational BattleMech that was quickly accepted for production.</p><p>Corean naturally shifted resources to the Hector, but a handful of engineers remained on the Icarus project, fixing design flaws and upgrading the six prototypes with refinements made possible by the Hector's development. Four of the six machines saw limited but favorable service during the Age of War, providing enough data and support to keep the Icarus project alive as a research testbed. These prototypes served Corean well for years, ultimately prompting the company to revisit the design in the twenty-sixth century, producing the substantially upgraded Icarus II.</p><p>Centuries later, the Icarus experienced an unexpected revival. During the Jihad, the desperate demand for any available military hardware led several manufacturers across the Inner Sphere and Periphery to begin RetroTech production of the primitive design. Facilities operated by Ceres Metals Industries on Lockton, Gienah BattleMechs on Gienah, Hellespont Industrials on Betelgeuse, Marian Arms on Alphard, Oriente Weapon Works on Oriente, and the Venkateswara BattleMech Refit Facility on Tamarind all produced limited numbers of RetroTech Icarus units during the Jihad. Most of these lines ceased production by the early 3080s as the crisis abated and more capable designs became available again.</p>
