chassis: "Foot Duplus Contubernium (MHAF)"
model: "(Flamer)"
overview: |-
  <p>The Marian Hegemony Armed Forces organize their conventional infantry along Roman legionary lines, with formations structured into contubernia, centuries, and cohorts rather than the squads and platoons used by Inner Sphere armies. A duplus contubernium, or double tent-group, fields two squads of ten soldiers and serves as the standard patrol and security element within Marian garrison forces. Foot duplus contubernia hold ground, man defensive positions, and conduct area security operations across Hegemony worlds. Support troops carry man-portable flamers that project streams of burning chemicals, providing devastating area-effect capability against infantry and structures at the cost of short range and the vulnerability of the operator's fuel tank.</p>
