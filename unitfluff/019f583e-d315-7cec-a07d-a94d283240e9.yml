chassis: "Atlas III"
model: "AS7-D3"
overview: |-
  <p>The Atlas is perhaps the most recognizable BattleMech in the Inner Sphere. It appears on more recruiting posters, more propaganda films, and in the boxes of more children's toys than any other 'Mech. More than a dozen variants have appeared over the centuries, and Robinson's Atlas III, introduced in 3100, is only the most recent to join the lineage. Rebuilt with cutting-edge technology by Robinson Standard BattleWorks and General Motors, the Atlas III stands as the AFFS' premier assault 'Mech, integrating advanced Clan-specification components into the proven hundred-ton chassis. It serves as a reflection of the enduring dominance of the Death's Head design.</p>
capabilities: |-
  <p>The Atlas III represents the most advanced weapons integration ever fitted to an Atlas chassis. A Mydron rotary AC/2 provides sustained suppressive fire at range, while a Clan-specification Streak LRM-20 and Streak SRM-6 ensure that every missile fired finds its target, eliminating the wasteful volleys that plague conventional launchers. Four medium X-pulse lasers deliver punishing close-range damage with improved accuracy, and the entire weapons suite is managed by a radical heat sink flush system that allows the pilot to rapidly shed accumulated heat in controlled bursts.</p><p>An Angel ECM suite disrupts enemy targeting and communications, while an armored cockpit provides the pilot with additional survivability befitting the design's intended role as a senior officer's command platform. Custom small shields mounted on each arm offer supplemental protection during close-quarters engagements.</p><p>These advantages come at a cost. The rotary AC/2, while versatile, lacks the raw destructive power of the autocannons mounted on earlier Atlas models, forcing pilots to rely on sustained volume of fire rather than single devastating strikes. The radical heat sink flush system, though effective, is mechanically complex and difficult to service in the field. Units operating far from Robinson or El Dorado have reported extended downtime when the flush system requires maintenance. The Atlas III also retains the family's characteristic lack of speed, and the design's heavy reliance on advanced Clan-specification components makes it exceptionally expensive to produce and maintain.</p>
deployment: |-
  <p>Produced jointly by General Motors on El Dorado and Robinson Standard BattleWorks on Robinson, this variant remains a rare machine reserved for senior commanders. Atlas IIIs are assigned to battalion and regimental commanders in the AFFS and RAF, with Exarch Jonah Levin's personal machine among the most prominent examples. Production numbers remain low due to the design's reliance on advanced Clan-specification components and the proprietary radical heat sink system. When the Capellan Confederation attacked Tikonov in force, several Atlas IIIs were among the defenders, and each was specifically targeted by the Capellans for capture, reflecting their desperation to reverse-engineer the flush system for their own use.</p>
history: |-
  <p>The Atlas III entered service as the most technologically advanced member of the Atlas family, incorporating cutting-edge equipment that pushed the boundaries of what an assault 'Mech could carry. Robinson Standard BattleWorks and General Motors collaborated on the design, producing it at their Robinson and El Dorado facilities respectively. Still rare, Atlas IIIs were reserved for battalion and regimental commanders in the AFFS and RAF, including the personal 'Mech of Exarch Jonah Levin.</p><p>The Atlas III earned its reputation in blood during the Capellan assault on Tikonov. Several Atlas IIIs were among the Davion defenders on-planet, and each was targeted by the Capellans for capture, desperate to acquire the design's advanced heat management technology. One of these machines, piloted by Leftenant Nathan Marlowe, fought its way into legend. Attacked outside the city of Salat by a reinforced lance of Capellan 'Mechs, Marlowe called for reinforcements and went on the defensive, engaging at long range with his ballistic weapons. As the Capellans flanked him with their swifter machines, he added his missile systems to the fight, disabling two Anubises and crippling an Agrotera before they could close to effective range. Marlowe continued his fighting retreat, alternating laser fire with heat flushes until only a Vandal and a Lu Wei Bing remained. When the Lu Wei Bing's autocannon disabled his primary ballistic weapon, Marlowe jettisoned the ruined system. Capellan battleROMs clearly show the young warrior flexing the Atlas' great hands and advancing, steam issuing from almost every seam in the 'Mech's armor.</p><p>By the time relief arrived from Salat, all the 'Mechs were destroyed. The corpse of Leftenant Marlowe's Atlas was found draped across the broken body of the Capellan Vandal, the Lu Wei Bing lying nearby with its head crushed by the Atlas' fists. Marlowe was found inside his cockpit, killed by an autocannon submunition. He received the Medal Excalibur posthumously, and his name was inscribed on the wall of honor in the hall of the Order of Davion. Marlowe's last stand at Tikonov became an instant recruiting legend for the AFFS and cemented the Atlas III's place in the storied lineage of the Death's Head.</p>
