chassis: "Clan Field Gun Point"
model: "(Wheeled UAC5 Basic)"
overview: |-
  <p>Most Clan infantry are solahma warriors at the end of their careers or who have failed their Trials, assigned to duties the warrior caste considers beneath notice. Field Gun Points are crew-served weapon teams that bring heavier firepower to the infantry level, towing weapons too large for individual soldiers to carry. The gun itself defines the Point's role, with lighter autocannons providing anti-infantry and anti-vehicle fire while heavier weapons can threaten even armored targets. The Point tows a medium-caliber ultra autocannon capable of firing at twice the normal rate, delivering sustained suppressive fire at the risk of jamming.</p>
