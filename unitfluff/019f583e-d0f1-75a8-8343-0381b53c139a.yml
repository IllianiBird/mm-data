chassis: "Naginata"
model: "NG-C3Ar"
overview: |-
  <p>The Naginata is a ninety-five-ton assault BattleMech introduced in 3055 by Independence Weaponry of Quentin for the Draconis Combine Mustered Soldiery. Named after the traditional Japanese pole arm, the design was purpose-built around the revolutionary command/control/communications computer system that the Combine had perfected in 3050. While the C3 network offered unprecedented coordination and targeting advantages that outstripped even Clan technology, expensive and time-consuming refit programs had left the system largely unused for five years. Independence Weaponry resolved this impasse by designing a dedicated platform that integrated the C3 computer from the ground up, establishing the Naginata as the DCMS's premier command fire-support unit.</p>
capabilities: |-
  <p>The heart of the Naginata is its C3 master computer, which allows the 'Mech to coordinate targeting data across an entire lance, dramatically improving the accuracy of its formidable weapons suite. Independence Weaponry built the rest of the design around this core system. Three Coventry Star Fire LRM-15 racks, each linked to an Artemis IV fire control system, provide devastating long-range missile salvos with exceptional accuracy. A Lord's Light 2 extended-range PPC mounted in the left arm delivers reliable direct-fire support at extended distances.</p><p>The Naginata's survivability is remarkable for a command platform. Fifteen tons of Durallex Heavy Special armor blanket the chassis, while CASE protects against catastrophic ammunition detonation. The use of a standard Pitban 285 fusion engine rather than an extralight design ensures the 'Mech can absorb punishing damage to the side torsos without suffering catastrophic shutdown, earning it a reputation as a zombie 'Mech that can continue fighting long after lesser designs would have fallen. Two additional double heat sinks flanking the PPC's arm mounting help manage heat buildup, though sustained fire from the full arsenal still demands careful thermal discipline from the MechWarrior.</p>
deployment: |-
  <p>Emerging in 3076 during the Jihad, this variant is a battlefield refit that incorporates captured Word of Blake technology. The variant guts the entire left torso to mount a Boosted C3 master computer alongside a large variable-speed pulse laser salvaged from Blakist forces. The Boosted C3 system extends the effective networking range beyond that of the standard master computer, while the variable-speed pulse laser provides flexible direct-fire capability at multiple ranges. The reliance on captured equipment limits widespread production, with refits performed at various field facilities rather than any single manufacturer's production line.</p>
history: |-
  <p>The Naginata entered service in 3055 with priority distribution to frontline formations, including the Twelfth Dieron Regulars, Eleventh Benjamin Regulars, Seventeenth Galedon Regulars, and several Ghost Regiments. Despite this aggressive fielding, the design alone did not immediately shift the DCMS's attitude toward C3 technology. That transformation unfolded across several years through a confluence of factors.</p><p>First, the Naginata's appearance as a dedicated C3 master platform spurred a wave of field refits across the DCMS, adding C3 slave systems to proven designs like the Panther, Grand Dragon, and Atlas, and master systems to command 'Mechs such as the Hatamoto-Hi and Katana. With this groundwork in place, the DCMS committed to the first large-scale employment of C3 networks during Operation Bulldog in 3059. Against Clan Smoke Jaguar, the linked targeting data proved devastating, graphically demonstrating the system's potential on the battlefield.</p><p>The final catalyst came from Hohiro Kurita and the Genyosha, whose C3-equipped command lances from company level upward achieved spectacular victories on Kiamba and the killing fields of Schuyler. By the time of the Ghost Bear-Combine War beginning in 3062, Naginatas were deployed in nearly every regiment committed to that conflict, cementing the design's role as the backbone of DCMS command lances.</p><p>The Jihad brought upheaval to Quentin when Word of Blake forces seized the world, disrupting Independence Weaponry's production lines. Control of the facility passed to the Republic of the Sphere in the post-Jihad reorganization before eventually returning to Draconis Combine sovereignty. Despite these disruptions, the Naginata's robust standard-engine design ensured that existing frames remained serviceable across decades of conflict, and the chassis continued to serve in DCMS formations well into the thirty-second century.</p>
