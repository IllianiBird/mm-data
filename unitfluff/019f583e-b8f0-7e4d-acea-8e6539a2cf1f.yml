chassis: "Mechanized Wheeled Platoon (CCAF)"
model: "(Recoilless 2367+)"
overview: |-
  <p>Capellan infantry serve where BattleMechs and armor cannot be spared, which in the resource-constrained CCAF means nearly everywhere. The Xin Sheng movement revitalized the infantry arm alongside every other facet of the Capellan Confederation Armed Forces, giving foot soldiers better equipment and renewed purpose. Mechanized wheeled platoons balance speed and infantry presence, using armored wheeled transports to move troops quickly along the Confederation's road networks. They sacrifice the cross-country capability of tracked vehicles for faster transit between defensive positions. Heavy weapons teams carry recoilless rifles that provide a portable anti-armor capability, allowing infantry to engage vehicles and hardened positions that would otherwise require dedicated support weapons.</p>
