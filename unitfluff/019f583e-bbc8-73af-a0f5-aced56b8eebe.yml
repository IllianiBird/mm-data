chassis: "Field Gun Platoon (DCMS)"
model: "(Wheeled UAC2 3060+)"
overview: |-
  <p>Conventional infantry within the DCMS serve as the foundation of planetary defense, providing the manpower essential to territorial control while freeing BattleMech and armored assets for offensive operations. The platoon tows a light ultra autocannon that can double its rate of fire at the risk of jamming the mechanism. When it works, the sustained volume of long-range suppressive fire is unmatched by any standard autocannon of similar weight.</p>
