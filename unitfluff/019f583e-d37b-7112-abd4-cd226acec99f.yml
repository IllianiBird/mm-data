overview: |-
  <p>The Gùn is a twenty-ton light OmniMech introduced in 3134 by Ceres Metals Industries for the Capellan Confederation Armed Forces. Named for the gùn, one of the four traditional Chinese fighting weapons representing the staff, the design was conceived as a dedicated infantry support platform for garrison forces. As one of the lightest OmniMechs ever produced, the Gùn prioritizes tactical flexibility over raw combat power, earning a reputation as an indispensable asset for commanders tasked with holding territory against insurgents and light raiding forces. Production at Ceres facilities on both Capella and Lockton ensures a steady supply for CCAF and allied Magistracy formations throughout the Capellan March.</p>
capabilities: |-
  <p>Built on a Ceresplex Light Omni endo steel frame powered by a Rawlings 100 fusion engine, the Gùn achieves a respectable top speed of 86 kilometers per hour. The use of a small cockpit and XL gyro frees critical tonnage, granting the chassis ten tons of pod space, an impressive allocation for a design weighing only twenty tons. This flexibility allows garrison commanders to rapidly reconfigure the Gùn based on developing threats, a significant advantage for defensive forces that must counter diverse enemy compositions with limited assets.</p><p>The trade-off for this adaptability is protection. Only three and a half tons of Ceres Standard armor shield the chassis, leaving MechWarriors dangerously exposed to anything heavier than small arms fire. The Gùn is emphatically not designed for stand-up engagements with conventional BattleMechs or heavy vehicles. Instead, it excels when operating alongside infantry and battle armor formations, using its speed and firepower to suppress enemy foot soldiers while its own supporting troops close to effective range.</p><p>The design's enhanced short-range targeting accuracy further reinforces this close-support doctrine, making the Gùn a lethal threat to infantry at the ranges where engagements against foot troops typically occur.</p>
deployment: |-
  <p>Alternate Configuration B recasts the Gùn as an electronic warfare and target designation platform. A Bloodhound active probe allows it to detect hidden enemies and concealed units, while an Angel ECM suite provides electronic protection for accompanying formations. TAG designator equipment enables the Gùn to call in Arrow IV artillery or semi-guided missile strikes with precision. An ER large laser provides the configuration's sole direct-fire armament. Garrison commanders favor this variant when operating in terrain that conceals enemy movement, pairing it with artillery assets for devastating combined-arms effect.</p>
history: |-
  <p>The Gùn entered service with the Capellan Confederation Armed Forces in 3134, arriving just as Chancellor Daoshen Liao launched his invasion of the crumbling Republic of the Sphere. Ceres Metals Industries began production at their Capella facility first, with the Lockton plant bringing additional lines online to meet growing demand from both the CCAF and Magistracy Armed Forces.</p><p>The design's most notable early deployment came during the Capellan conquest of New Hessen in 3144. A lance of Gùns from the Second McCarron's Armored Cavalry was tasked with establishing a field outpost in a remote mining area following the planet's surrender. When local miners revolted against the new Capellan overseers, the Gùn lance, supported by a company of infantry and a platoon of Arrow IV assault vehicles, suppressed the uprising with devastating efficiency. The combined firepower of the Prime and alternate configurations left the rebel miners with nowhere to hide, with electronic warfare variants flushing insurgents from concealment while their lancemates delivered punishing fire. Two-thirds of the attacking force fell before the remainder scattered.</p><p>The Gùn has since seen deployment across CCAF garrison formations, the Magistracy Armed Forces, and the forces of Andurien. Despite years of cooperation between the CCAF and MAF, doctrinal differences remain visible in how each force employs the design. The Confederation primarily deploys the Gùn in support or garrison formations, pairing it with infantry and battle armor for perimeter defense. The MAF, by contrast, values the design as a frontline battle armor transport and combat unit.</p><p>Infantry commanders have learned to drill their forces to quickly identify the Gùn's active configuration, as its weapons loadout drastically changes the tactical calculus of any engagement. The presence of an electronic warfare variant in particular frequently indicates supporting artillery assets within range, a combination that has proven devastating to unprepared ground forces.</p>
