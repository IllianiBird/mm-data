chassis: "Ursus"
model: "3"
overview: |-
  <p>The Ursus was a landmark in Clan Ghost Bear history, the first Clan BattleMech designed and manufactured entirely within the Inner Sphere. Introduced in 3059, the design was conceived by Khan Bjorn Jorgensson as a solution to the logistical challenges of maintaining Clan forces far from the Kerensky Cluster. After capturing Alshain and its Bergan Industries facilities in December 3051, Ghost Bear technicians spent over seven years overcoming the fundamental incompatibilities between Clan and Inner Sphere manufacturing systems. The resulting 50-ton medium 'Mech combined Inner Sphere components manufactured locally with advanced Clan weapons shipped from Clan space.</p><p>Intended as a second-line garrison 'Mech, the Ursus was built to defend the Ghost Bear occupation zone against Draconis Combine counterattacks along their extensive shared border. Though slow for a Clan medium chassis, its robust construction and diverse weapons array made it a capable defensive platform that compared favorably to the Inner Sphere heavy 'Mechs it was expected to face.</p>
capabilities: |-
  <p>The Ursus fulfills its defensive mission with a versatile array of weapon systems designed to engage targets at multiple ranges. A Series 7K extended-range large laser and Type X LRM-10 launcher provide respectable long-range fire, while the 'Mech's true strength emerges at closer distances. Two Series 2a extended-range medium lasers, two Kolibri Delta Series medium pulse lasers, and a Type VI SRM-6 launcher deliver a withering volume of fire that can overwhelm most opponents inside 300 meters.</p><p>The design philosophy deliberately sacrifices speed for firepower and protection. A standard 200-rated engine limits the Ursus to a maximum speed of 65 kilometers per hour, making it one of the slowest Clan medium 'Mechs in service. This trade-off allows eight and a half tons of Compound A2F ferro-fibrous armor to be mounted, providing protection approaching that of many Inner Sphere heavy designs. An integrated ECM suite further enhances survivability by disrupting enemy targeting systems.</p><p>Sixteen double heat sinks manage the considerable waste heat generated by the laser-heavy weapons array, though sustained fire with all systems can still challenge heat dissipation. The Ursus was engineered for reliability above all else, using a standard chassis and engine rather than weight-saving extralight or endo steel alternatives.</p>
deployment: |-
  <p>Entering production in 3079, the Ursus 3 was developed directly from the Ursus-PR prototype in response to the Omni-Paradise Bombing that rocked the Ghost Bear Dominion. The design replaced the PR's Improved C3 Computer with a Watchdog combined electronic warfare system and added an extra ton of ProtoMech autocannon ammunition. Produced specifically for Watch and Mimir operatives conducting counterinsurgency operations against the Motstand resistance movement, the Ursus 3 mounts a weapons array optimized for engaging hardened positions and suppressing infantry, including twin ProtoMech autocannons, improved heavy medium lasers, anti-personnel Gauss rifles, and an extended-range flamer. By 3085, full production supplied every world in the Dominion with its complement, though the 'Mech's sinister reputation meant few MechWarriors volunteered to pilot one.</p>
history: |-
  <p>The Ursus was born from necessity. When Clan Ghost Bear captured Alshain during the initial Clan Invasion, they acquired the Bergan Industries facilities and their experienced workforce. Khan Bjorn Jorgensson recognized that the vast distance between the Ghost Bear occupation zone and the Clan homeworlds made it impractical to rely solely on supply lines stretching back to the Kerensky Cluster. Shortly after the Truce of Tukayyid in 3052, Jorgensson ordered the Bergan plant reconfigured to produce a new second-line 'Mech that would combine locally manufactured Inner Sphere components with Clan weapons imported from the homeworlds.</p><p>The project proved far more challenging than anticipated. The fundamental incompatibility between Clan and Inner Sphere manufacturing standards required years of engineering work to overcome, with Ghost Bear scientists and Rasalhagian technicians collaborating to bridge the gap. By 3059, the revamped Bergan factory finally began producing the Ursus, marking a watershed moment as the first Clan BattleMech designed and built entirely within the Inner Sphere.</p><p>Initial deployment focused on garrison Clusters along the Ghost Bear-Draconis Combine border, where the 'Mech quickly proved its worth as a defensive asset. The fall of Clan Smoke Jaguar left the Ghost Bears with an even longer border to defend, and the Ursus filled this need admirably. The design gained a reputation as a dependable companion for slower heavy and assault 'Mechs, providing close-range protection while larger machines engaged at distance.</p><p>The Jihad era saw significant evolution of the Ursus line. Bergan Industries' growing technical capabilities led to the Ursus 2 upgrade in 3074, incorporating endo steel structure and an extralight engine to dramatically improve performance. The Ursus-PR prototype refit, also appearing in 3074, marked a shift toward counterinsurgency operations as political tensions within the Ghost Bear Dominion escalated. The Omni-Paradise Bombing of 3078 catalyzed the Ursus 3, a production version of the PR designed specifically for the Watch and Mimir intelligence services to combat the Motstand resistance movement. That same year, the Ursus II emerged as a complete redesign jointly developed with Arc-Royal MechWorks, with early production units participating in the liberation of Terra.</p><p>The Rasalhague Dominion continued producing the Ursus line through the Dark Age and into the ilClan era, with Bergan Industries remaining the primary manufacturer throughout the design's long service history.</p>
