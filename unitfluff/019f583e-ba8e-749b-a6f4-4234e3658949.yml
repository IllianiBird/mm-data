chassis: "Mechanized Wheeled Level I (ComGuards)"
model: "(Flamer)"
overview: |-
  <p>The Com Guards field conventional infantry as a core component of their combined-arms formations, with Level I infantry units integrated into the same command structure alongside BattleMech, armor, and aerospace elements at every organizational level. Mechanized wheeled Level I formations use wheeled APCs that provide a balance of road speed, infantry protection, and maintenance economy. The Com Guards deploy wheeled mechanized infantry extensively for garrison and patrol duties on worlds with developed transportation networks. Armed with man-portable flamers that project streams of ignited fuel, these troops carry one of the most psychologically devastating weapons available to conventional infantry, effective at clearing fortified positions and enclosed spaces at the cost of extreme danger to the operator.</p>
