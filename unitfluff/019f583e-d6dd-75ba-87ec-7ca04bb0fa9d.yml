overview: |-
  <p>The Grand Summoner is a seventy-ton Clan OmniMech introduced in 3093 by Clan Jade Falcon as a direct replacement for the venerable Summoner. Produced by the Eagle Craft Group at their facility on Erewhon, the Grand Summoner was designed to address the aging Summoner's limitations while preserving the proven mobility and firepower balance that had made its predecessor a mainstay of Clan heavy cavalry formations for over two centuries. The design quickly spread beyond its Jade Falcon origins through inter-Clan trade, finding particular favor among the Inner Sphere Clans' warrior castes. Known to Inner Sphere intelligence services by the reporting name Thor II, the Grand Summoner has established itself as a reliable and versatile frontline OmniMech favored by junior grade officers for independent operations.</p>
capabilities: |-
  <p>The Grand Summoner retains the same Magna 350 XL engine as its predecessor, maintaining the same top speed of eighty-six kilometers per hour that made the original Summoner effective in fast-moving engagements. The critical improvement lies in the adoption of an Olivetti T4 Endo Steel internal structure combined with the conversion of the Summoner's fixed jump jets to pod-mounted equipment, freeing thirty and a half tons of pod space compared to the original's twenty-two and a half. Compound Beta ferro-fibrous armor provides marginally better protection than the original Summoner, adding half a ton of additional coverage across the design.</p><p>The Grand Summoner's Model J-D 067 communications system is a standout feature that has elevated the design beyond a simple heavy cavalry platform. Capable of supporting three times the number of simultaneous connections compared to competing systems such as the Alpha-com, the 067 can also cut through standard ECM interference when operating at maximum power, making the Grand Summoner a natural command platform despite not being originally intended for that role. The Hawkeye 58 targeting and tracking system, while highly accurate, requires recalibration whenever the OmniMech's pod configuration is changed, briefly leaving the 'Mech unable to employ its weapons during the process.</p>
deployment: |-
  <p>Alternate Configuration E exploits the Grand Summoner's generous pod space to mount eight improved jump jets, granting a remarkable two-hundred-forty-meter jump radius that rivals many light 'Mechs. This extraordinary mobility is paired with a straightforward all-energy weapons loadout consisting of an ER PPC in each arm and an ER small laser in the center torso, ensuring the E configuration is never dependent on ammunition supplies. Two additional double heat sinks help manage the thermal load from sustained PPC fire. The E configuration is ideally suited for reconnaissance-in-force missions and flanking maneuvers across broken terrain where its jump capability allows it to reach positions that heavier opponents cannot follow.</p>
history: |-
  <p>The Grand Summoner emerged from Clan Jade Falcon's recognition that the Summoner, while still serviceable, was showing its age after more than two centuries of continuous production. The Eagle Craft Group's Erewhon facility began production in 3093, and the Jade Falcons treated the new design as a symbol of Clan pride from its very first chassis. The inaugural Grand Summoner, bearing serial number JF000-01A, was mounted on a ceremonial dais at the Erewhon factory complex gate rather than being deployed to a frontline unit. Each year, the Jade Falcon Khan selects one Cluster to be honored for distinguished service, and JF000-01A is repainted in that Cluster's parade colors. The Third Falcon Talon Cluster holds the distinction of being selected five times, more than any other formation.</p><p>The design's proliferation beyond Clan Jade Falcon came through the inter-Clan trade networks that characterized the post-Jihad era. Other Inner Sphere Clans readily adopted the Grand Summoner, recognizing its advantages over the original Summoner design. Though the largest concentrations of Grand Summoners remained within the Jade Falcon touman, the design became a common sight in the formations of allied and rival Clans alike.</p><p>One of the Grand Summoner's most celebrated engagements occurred on Feltre in 3097, when Clan Wolf Star Colonel Jess Calvert challenged Clan Diamond Shark's Swimmer Khanate to a Trial of Possession for the entire Beta Aimag. Aggressive bidding reduced each side's forces to a single Cluster. The Diamond Sharks selected the Swordtooth Canyons as the trial grounds, a labyrinth of ravines, dead ends, and heavy electromagnetic interference that degraded communications and tracking systems. The fighting quickly devolved into small-unit actions where the Grand Summoner's superior communications suite proved decisive, allowing Diamond Shark Stars to maintain coordination while Wolf forces struggled with disrupted signals. The Diamond Sharks' victory in this trial cemented the Grand Summoner's reputation as a design that could turn difficult terrain from a liability into an advantage.</p>
