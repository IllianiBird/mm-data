chassis: "Mechanized Wheeled Platoon (DCMS)"
model: "(SRM 2620+)"
overview: |-
  <p>The Draconis Combine Mustered Soldiery assigns conventional infantry to garrison roles across its military districts, with district regulars often fielding extra platoons to secure worlds that BattleMech forces cannot permanently garrison. Wheeled mechanized infantry ride armored personnel carriers that offer speed on roads and enough protection to survive initial contact. The DCMS assigns these platoons where garrison duty demands both rapid response and the ability to dismount under fire, a combination that foot and motorized troops cannot reliably deliver. Support elements carry man-portable short-range missile launchers that fire the same warheads used by BattleMechs and combat vehicles. At close range, a well-aimed SRM can crack vehicle armor that personal weapons cannot scratch, giving the platoon a meaningful anti-armor capability.</p>
