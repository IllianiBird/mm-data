chassis: "Jump Triplus Contubernium (MHAF)"
model: "(Flamer 3049+)"
overview: |-
  <p>The Marian Hegemony Armed Forces organize their conventional infantry along Roman legionary lines, with formations structured into contubernia, centuries, and cohorts rather than the squads and platoons used by Inner Sphere armies. A triplus contubernium, or triple tent-group, combines three squads of ten. Jump-capable triplus contubernia are among the more capable light infantry formations in the MHAF, able to conduct company-scale airborne insertions and rapid seizure of key terrain features. Support troops carry man-portable flamers that project streams of burning chemicals, providing devastating area-effect capability against infantry and structures at the cost of short range and the vulnerability of the operator's fuel tank.</p>
