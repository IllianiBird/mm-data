chassis: "Field Gun Platoon (FWLM)"
model: "(Tracked UAC10 3057+)"
overview: |-
  <p>Conventional infantry within the FWLM serve as the backbone of provincial defense across a patchwork of semi-autonomous states, each maintaining its own military traditions and equipment preferences. Towing crew-served Ultra autocannon/10, these platoons bring heavy rapid-fire capability to the field gun role, doubling their rate of fire when the tactical situation demands it at the cost of increased mechanical stress on the weapon.</p>
