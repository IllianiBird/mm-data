chassis: "Wasp"
model: "WSP-3M"
overview: |-
  <p>The Wasp was introduced in 2471 as the first BattleMech to mount jump jets, a revolutionary advancement that redefined battlefield mobility. Developed by General Mechanics under the direction of engineer Soren Iishi, the design emerged from an ambitious Terran Hegemony Armed Forces requirement for a highly mobile fast reconnaissance platform. The Wasp's ability to leap over obstacles and rough terrain gave it unmatched flexibility for scouting operations, setting a paradigm that would influence light 'Mech doctrine for centuries.</p><p>Mass-produced in staggering numbers throughout the Age of War and Star League eras, the Wasp became the most numerous BattleMech in the Inner Sphere. Better quality control made the Wasp more respected than the similar Stinger. Its combination of speed, jump capability, and low production cost made it the quintessential reconnaissance platform, with centuries-old Wasps existing in vast numbers, a testament not to durability but to prodigious production.</p>
capabilities: |-
  <p>General Mechanics designed the Wasp with an emphasis on low cost, simplicity of maintenance, and expendability. All major systems were engineered for rugged durability and ease of replacement in forward operating conditions. The standard armament of a single medium laser and SRM-2 launcher provides adequate firepower for reconnaissance engagements while minimizing logistical demands, allowing extended operations without resupply.</p><p>The Wasp's Hermes 120 fusion engine propels the twenty-ton chassis to speeds exceeding ninety kilometers per hour, while its Rawlings 52 jump jets enable leaps of up to 180 meters. This mobility allows MechWarriors to rapidly disengage from superior forces or exploit terrain features inaccessible to heavier units. The arm-mounted medium laser serves as the primary weapon, offering reliable performance across most combat conditions.</p><p>However, the design's light armor protection serves as a significant vulnerability. The Wasp cannot sustain concentrated fire from heavier opponents, and early production models suffered from catastrophic leg actuator failures when pilots employed jump-kick maneuvers. This flaw was corrected by 2610 with the universal retrofit of MMSR actuator bars following the infamous Battle of Electra in 2580. Chronic finger myomer issues on some models led MechWarriors to remove the right hand of their 'Mechs and wrist-mount the laser instead.</p>
deployment: |-
  <p>Irian BattleMechs Unlimited introduced this variant in 3051 as one of their upgraded designs produced at the Shiro III and Kalidasa facilities. Though eclipsed by the faster WSP-5A, the -3M remains a rugged and dependable variant that IBMU continues to support through refurbishment programs. The company actively purchases existing models to restore and resell to customers who cannot afford top-tier variants, ensuring the -3M's continued presence on battlefields across the Inner Sphere.</p>
history: |-
  <p>Development of the Wasp began in the mid-twenty-fifth century when General Mechanics sought to expand beyond its role as a subcontractor for the Mackie and Banshee programs. Engineer Soren Iishi, known as "Dr. Hive," led a team tasked with creating a 'Mech capable of unprecedented mobility. While the team's ultimate vision of a flying BattleMech would require decades more advancement to realize as the Land-Air 'Mech, their work on jump jet integration proved revolutionary. When the WSP-1X-02 prototype demonstrated its capabilities by leaping over a hangar during trials before HAF High Command, the competition was effectively over.</p><p>Production of the WSP-1A began in 2471, and General Mechanics constructed thousands of Wasps for the Hegemony and later the Star League. The design's widespread adoption led to the development of combined Wasp and Stinger swarm tactics that became legendary during the Star League era. However, the popularity of jump-kick maneuvers revealed a critical flaw in the leg actuators, resulting in numerous catastrophic failures during the Battle of Electra in 2580. By 2610, nearly all operational Wasps had been retrofitted with strengthened MMSR actuator bars.</p><p>The Succession Wars saw the Wasp deployed extensively by all Great Houses. The second battle of Ravannion in 3022 demonstrated the continued viability of light 'Mech swarm tactics when a Combine battalion assembled a full battalion's worth of Wasps and Stingers against Davion defenders. Everything went wrong for the attackers, freezing temperatures wreaked havoc with light 'Mechs overdue for maintenance, and Davion MechWarriors used their much-maligned Blackjacks' autocannons to devastating effect at ranges far exceeding the light 'Mechs' weapons. The engagement ultimately ended in disaster for the Combine forces.</p><p>The Phoenix programs of the 3060s returned the Wasp to prominence with upgraded variants incorporating recovered Star League technology and new innovations like stealth armor. The Word of Blake Jihad disrupted production across the Inner Sphere, though many factories eventually resumed operations under new management. Following the formation of the Wolf Empire, conquest of Kalidasa led to ramped-up Wasp production, ensuring the design remains one of the most common light 'Mechs in service. Wolf Empire's Theta Galaxy equipped with new Wasp Cs raided into the Lyran Commonwealth, striking the Eighth Donegal Guards on Caledonia, where the arm-mounted large laser proved decisive in cutting through the Guards' light screening units.</p>
