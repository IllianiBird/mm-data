chassis: "Cave Lion"
overview: |-
  <p>The Cave Lion is a 75-ton heavy BattleMech introduced in 3122 by Irece Alpha, the first new Clan Nova Cat design produced since the Second Combine-Dominion War shattered the Clan's industrial base nearly two decades earlier. Conceived as a symbol of renewed Nova Cat pride and self-sufficiency, the Cave Lion was championed by Khan Jacali Nostra as a design that could be manufactured without dependence on Draconis Combine supply chains. A manufacturing partnership with Clan Sea Fox's Tiburon Khanate made production possible but forced compromises that altered the original design vision. Despite these concessions, the Cave Lion quickly became a favorite among Cat warriors upon entering service.</p>
capabilities: |-
  <p>The Cave Lion's design was driven by two primary directives: logistical independence and freedom from Combine supply dependencies. This philosophy produced a predominantly energy-based weapon loadout centered on twin Extended-Range Particle Projector Cannons mounted in the side torsos, delivering devastating long-range firepower without ammunition concerns. Four Medium Pulse Lasers distributed across the arms and torsos provide accurate close-range damage. The sole concession to ammunition-dependent weaponry is a 3-tube Advanced Tactical Missile launcher in the center torso, a Sea Fox addition that broadened the design's tactical flexibility. The launcher carries double the standard ammunition complement, extending field endurance and minimizing resupply dependence.</p><p>Twelve tons of laser reflective armor provide exceptional protection against the energy weapons that dominate Clan warfare, while an Angel ECM Suite disrupts enemy electronics and targeting systems. A Clan-rated 375 XL engine propels the chassis to a respectable 86 kph, though the absence of jump jets limits tactical flexibility in broken terrain. The reflective armor's brittleness forced the abandonment of originally planned battle claws intended to embody the Nova Cat's feline nature, though cosmetic claw features were sculpted onto the hands as a nod to the lost design element. Seventeen double heat sinks manage the considerable thermal output of the energy-heavy armament, though sustained fire from both PPCs still demands careful heat discipline.</p>
deployment: |-
  <p>No factory variants of the Cave Lion have been produced as of 3145. Following its debut, the Cave Lion spread throughout the Nova Cat touman with mixed reception; some warriors embraced its totemic aspects wholeheartedly while others found the design's compromised origins difficult to accept. The Tiburon Khanate received their contractual share of production beginning in 3131 and offered the design for sale throughout their territory, though sales remained modest, primarily reaching mid-sized mercenary units and Nova Cat militia clusters within the Republic of the Sphere. Following Clan Nova Cat's destruction in 3143, the Cave Lion became an increasingly rare sight on the battlefield. The Spirit Cats of the Clan Protectorate field the largest remaining concentration, having acquired their machines through trade deals brokered by their Spina Khanate allies.</p>
history: |-
  <p>The Cave Lion's origins trace directly to the devastation inflicted on Clan Nova Cat during the Second Ghost Bear/Combine War. The conflict shattered not only the Nova Cats' military strength but also their industrial base, as Dominion forces systematically targeted manufacturing facilities to eliminate the Clan's long-term threat potential. For nearly two decades following the war, the battered Nova Cats relied solely on pre-war materiel and battlefield salvage to maintain their forces, while the Combine leadership refused repeated requests to assist in rebuilding the Cats' shattered industrial capacity.</p><p>By 3120, relations with the Dragon had thawed sufficiently for Khan Jacali Nostra to petition the DCMS for permission to begin production on a new BattleMech design. Permission was warily granted, but the neutered factory complexes the Combine had permitted left Irece Alpha incapable of producing the design in meaningful numbers. Nostra turned to Clan Sea Fox's Tiburon Khanate, whose warrior-merchants offered to upgrade the Nova Cat factories, expand production capacity, and provide favorable raw material import rates. In exchange, the Tiburons required the factories to incorporate specific Sea Fox weapon systems and armor technology, with a percentage of output delivered at bargain prices over a nine-year period. The deal necessitated significant design changes, but the Nova Cat leadership felt they had little alternative to continued dependence on the Combine. Khan Nostra countered Tiburon demands by delaying delivery of completed machines to the Khanate for nine years rather than surrendering a percentage of each production run immediately.</p><p>Production commenced in 3122, and the Cave Lion quickly became a mainstay of Nova Cat formations across the touman. Beginning in 3131, the Tiburon Khanate began receiving their contractual share and offered the design for sale across Combine and Republic markets. Sales proved modest, as the Sea Foxes found limited demand outside mid-sized mercenary commands and scattered Nova Cat militia clusters. The design gained an unexpected measure of notoriety on Solaris VII, where it featured prominently in gladiatorial combat following the failed Nova Cat rebellion of 3143, when the Silver Dragon Stables launched a vendetta to eradicate all gladiators using Nova Cat equipment from the games.</p><p>The destruction of Clan Nova Cat in 3143 fundamentally altered the Cave Lion's trajectory. The Tiburon Khanate became the sole holder of production rights, freed from the original contract's prohibition on introducing variants. As of 3145, the Sea Foxes were reevaluating the design with an eye toward addressing its shortcomings and potentially rebranding it for broader markets. On the battlefield, the Cave Lion has become an increasingly rare sight, a poignant reminder of the fall of a once-great Clan. Scattered examples persist in mercenary and militia service across the Inner Sphere.</p>
