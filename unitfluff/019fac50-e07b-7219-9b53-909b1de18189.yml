chassis: "Field Gun Platoon (Generic)"
model: "(Tracked UAC20 3061+)"
overview: |-
  <p>Mechanized tracked platoons move their infantry in armored personnel carriers fitted with tracks for reliable all-terrain performance. Tracked APCs handle mud, snow, rubble, and rough ground better than any wheeled or hover alternative, making these platoons the preferred mechanized infantry for operations where terrain is uncertain or hostile. They sacrifice road speed compared to wheeled formations but gain the ability to keep pace with armored vehicles across broken ground. The APCs provide meaningful ballistic protection during transit, though troops must still dismount to fight effectively.</p><p>Towing assault-class ultra autocannon capable of double-rate fire, these field gun crews field the most devastating rapid-fire direct weapons available to conventional ground forces. The presence of assault-class autocannon typically draws heavy counter-fire, with improved body armor helping the crews survive contact long enough to inflict considerable damage with their limited ammunition supply.</p>
