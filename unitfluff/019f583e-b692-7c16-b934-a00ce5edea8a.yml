chassis: "Field Artillery Platoon (AFFS)"
model: "(Tracked Sniper 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing Sniper artillery pieces, these platoons deliver medium indirect fire that can breach field fortifications and scatter infantry concentrations at ranges measured in kilometers.</p>
