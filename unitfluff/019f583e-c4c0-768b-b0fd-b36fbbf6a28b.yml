chassis: "Flea"
model: "FLE-17"
overview: |-
  <p>The Flea began life as the Trooper, a dedicated reconnaissance BattleMech designed by Toddlette Industries for the Free Worlds League Military. When the prototype first hit test fields in 2475, it was riddled with so many flaws that it took twenty-five years of additional development before the design could pass a proper field combat test. Rather than saddle a redesigned machine with the bad reputation its predecessor had earned, the Free Worlds League rechristened the upgraded model the FLE-4 Flea in 2501, making it the very first FWLM BattleMech to incorporate modern technology.</p><p>Focused on speed and firepower at the expense of protection, the inexpensive Flea was easy to mass-produce during the early Succession Wars, but excessive losses led Earthwerks Incorporated to shut down production in favor of heavier designs. The Flea remained an exceedingly rare sight until the arrival of Wolf's Dragoons, whose effective use of the light chassis sparked a manufacturing revival that eventually spread production across several worlds and made the Flea a common militia and garrison design throughout the Inner Sphere and Periphery.</p>
capabilities: |-
  <p>The post-Helm Memory Core FLE-17 represents the modern standard for the Flea line. Built on an Earthwerk Trooper II endo steel chassis, it retains the original design's maximum speed of just under one hundred kilometers per hour while incorporating a MASC system that allows short bursts approaching one hundred thirty kilometers per hour. This extraordinary speed is the Flea's primary defense, as the chassis mounts only three tons of Livingston Ceramics armor plating, leaving little margin for error against even light weapons fire.</p><p>The FLE-17's primary armament consists of a pair of Martell medium pulse lasers that provide reliable hitting power at close to medium range, supplemented by an Olympian flamer for anti-infantry work and two rear-mounted Martell small lasers for point defense against pursuing threats. The simple construction and modular components make the Flea a favorite among technicians, with critical systems situated for easy repair and upgrades. This maintainability has proven as valuable as its speed, allowing garrison and militia forces to keep their Fleas operational with minimal logistical support.</p><p>The design philosophy deliberately sacrifices survivability for affordability and speed. A single well-placed hit from a medium-caliber weapon can penetrate most of the Flea's armor, and a large laser strike can shear off a limb entirely. Pilots who rely on the Flea's protection rather than its mobility rarely survive long.</p>
deployment: |-
  <p>The post-Helm Memory Core redesign introduced in 3049, this variant incorporates an endo steel chassis and MASC system to push burst speeds approaching one hundred thirty kilometers per hour. Twin Martell medium pulse lasers replace the earlier standard models, improving accuracy during the high-speed engagements the Flea was designed for. Originally produced almost exclusively for the Capellan Confederation until 3053, the variant spread to mercenary markets and garrison forces across the Inner Sphere as Earthwerks expanded production to Victoria and eventually Tematagi. The FLE-17's simple construction and affordable price have made it a staple of militia forces and budget-conscious mercenary commands alike.</p>
history: |-
  <p>The Flea's origins trace to the Age of War, when Colonel J. Marcus Llewelyn-Jaymes led a team at Toddlette Industries to create the Free Worlds League's first dedicated reconnaissance BattleMech. The resulting Trooper prototype of 2475 was plagued by fundamental design flaws, including legs that could not withstand combat stress and a complete lack of ejection mechanisms. Despite these shortcomings, political connections and rumored bribery kept the program alive until a comprehensive redesign produced the FLE-4 in 2501. Earthwerks Incorporated acquired Toddlette Industries in 2581, establishing Flea production lines on multiple worlds throughout Free Worlds League space.</p><p>Production continued through the Star League era and into the early Succession Wars, where the Flea's low cost made it attractive to desperate commands. However, the design's paper-thin armor led to staggering attrition rates, and one by one the production lines switched to heavier, more survivable designs. By the late Succession Wars, the Flea had virtually vanished from military inventories outside the Free Worlds League. This changed dramatically with the arrival of Wolf's Dragoons, who fielded a half-dozen Fleas to devastating effect. When the Dragoons were reduced to just a pair of operational Fleas after the Fourth Succession War, they reached an exclusive contract with Earthwerks to reopen production on Asuncion and Bernardo.</p><p>The Capellan Confederation acquired the Flea's blueprints through a Maskirovka operation during the mid-3040s. After the Dragoons' exclusivity clause lapsed, Earthwerks began producing the advanced FLE-17 almost exclusively for the Confederation until 3053, while also selling to any interested parties at affordable prices. The Confederation's Earthwerks Ltd. facility on Victoria added a third major production center, and the Flea found immediate use among the Confederation's numerous militia and garrison forces. Sales among mercenary units between 3067 and 3068 set profit records for the company, with many of the newer urban warfare variants flying off production lines.</p><p>The Jihad disrupted production significantly. The Word of Blake seized Asuncion, and fighting damaged facilities across multiple worlds. The Victoria factory was destroyed by retreating Capellan forces during the Victoria War. In the aftermath, Nimakachi Fusion Products Ltd. rebuilt a factory on Tematagi by 3084, adding new production capacity within Regulan Centralist Movement territory. The Republic of the Sphere controlled several former Earthwerks worlds during the early Dark Age period, though production patterns shifted as political boundaries changed.</p><p>By the ilClan era, Flea production had consolidated around Earthwerks-FWL, Inc. facilities on Asuncion and Bernardo under Free Worlds League control, with Earthwerks Ltd. on Grand Base providing Capellan Confederation production and Nimakachi continuing output on Tematagi. The FLE-21 model demonstrated continued interest in the design, with Wolf's Dragoons placing significant orders in an effort to revive the Flea's traditional role as a fast hunter-killer against other light BattleMechs.</p>
