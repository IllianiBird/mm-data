chassis: "Field Artillery Platoon (AFFS)"
model: "(Wheeled Arrow IV 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing Arrow IV artillery systems, these platoons field the most sophisticated indirect fire capability available to conventional forces, launching guided missiles that can be directed onto targets by forward observers with TAG designators.</p>
