chassis: "Uziel"
model: "UZL-2S (Jacob)"
overview: |-
  <p>The Uziel is a fifty-ton medium BattleMech introduced in 3065 by Defiance Industries at their Furillo manufacturing plant. The design was commissioned by Duke Thelonius Gracchi, the general manager of the Furillo facility, who sought to elevate the reputation of his plant and boost morale among its workforce. Despite producing equipment every bit as capable as the prestigious Hesperus II factories, the Furillo division was widely considered second-rate within Defiance and the Lyran Alliance Armed Forces alike. Gracchi personally championed the Uziel, selling it directly to units within both the LAAF and the Armed Forces of the Federated Commonwealth.</p><p>Designed as a fast, mobile harassment platform that combines jump capability with a diverse weapons mix, the Uziel is not a groundbreaking design compared to other Hesperus-born creations, but it has nonetheless earned a solid combat reputation across multiple theaters of war.</p>
capabilities: |-
  <p>The Uziel is designed for harassment and skirmishing, using its top speed of 97 kilometers per hour and six Rawlings 50 jump jets to stay mobile on the battlefield. Its primary long-range weapon, the Defiance Shredder LB 2-X autocannon, allows it to reach out and engage targets at extreme distances. While the autocannon deals modest damage, it excels at hit-and-fade tactics, drawing enemy attention and herding opponents into unfavorable positions.</p><p>The Uziel is not primarily a ranged combatant, however. The bulk of its firepower is concentrated at shorter ranges, where a TharHes Thunderbolt 12 large pulse laser and a Defiance Model XII extended-range medium laser deliver accurate fire at medium distances. For close engagements, two Diverse Optics extended-range small lasers and a Harvester 20K SRM-6 launcher provide a punishing short-range barrage that is difficult for opponents of similar weight to match.</p><p>Protected by eight tons of Maximillian 100 armor and equipped with eleven double heat sinks, the Uziel carries adequate protection for its role, though prolonged engagements against heavier opponents will quickly expose its limitations. The design carries the Cowl quirk, offering some additional cockpit protection, but its exposed arm actuators remain a persistent vulnerability.</p>
deployment: |-
  <p>This custom modification of the UZL-2S emerged in 3070 as a personal refit by the executive officer of the reformed Black Widow Company of Wolf's Dragoons. Won in combat on Arc-Royal, the 'Mech was extensively reworked to suit its new pilot's preferences. The paired PPCs of the standard 2S are removed in favor of a rotary autocannon/5 in each arm, providing devastating sustained firepower at the cost of increased ammunition dependency. A lighter 250-rated XL engine reduces top speed but frees tonnage for eight and a half tons of light ferro-fibrous armor, actually improving protection over the stock design. The original extended-range small lasers and SRM-6 launcher are retained for backup firepower, with three tons of autocannon reloads and one ton of SRM ammunition keeping the weapons fed during extended engagements.</p>
history: |-
  <p>The Uziel emerged from the internal politics of Defiance Industries as much as from any military requirement. Duke Thelonius Gracchi, frustrated by the perception that his Furillo plant produced inferior equipment, commissioned the design in the early 3060s to prove that Furillo could compete with Hesperus II. The original prototype was completed in 3063, with the refined UZL-3S entering full production by 3065. Gracchi personally marketed the new design to LAAF and AFFC commanders, securing initial orders through sheer persistence and political connections rather than any organic demand from the military.</p><p>The Uziel received its baptism of fire during the FedCom Civil War, where the design proved far more capable than its detractors had predicted. The Fifteenth Battle for Hesperus proved particularly significant for the Uziel and its Furillo birthplace. With the fighting raging just two jumps from Furillo, forces on both sides of the conflict clamored for reinforcements. Defiance's board of directors pressured Gracchi to send as many newly built machines as possible to support the defense of their Hesperus facilities, and more than one newscast from the period featured Uziels standing guard at the entrances to Defiance's mountain fortresses. The irony of the overlooked Furillo plant rushing to defend its more prestigious sister facility was not lost on observers.</p><p>The Civil War's disruptions scattered Uziels far beyond their intended Lyran recipients. Like many BattleMechs produced during that turbulent period, the Uziel found its way into dozens of different units, many of which had never requested or expected to receive the design. Some units within the Lyran Regulars also acquired Uziels, though this was attributed more to the chaos of wartime logistics than any deliberate procurement decision.</p><p>Production of the primary UZL-3S model continued through the Civil War but appears to have tapered off in the years that followed, with the MUPL indicating limited ongoing production. The UZL-2S, based on the earlier prototype configuration, maintained steady production through the Jihad and into the Dark Age. The Jihad also prompted development of the UZL-8S, a more specialized variant that entered production around 3075 and has continued alongside the 2S into the ilClan era, ensuring the Uziel's continued presence on battlefields across the Inner Sphere.</p>
