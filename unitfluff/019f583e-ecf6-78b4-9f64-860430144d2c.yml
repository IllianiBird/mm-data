chassis: "Kimagure Pursuit Cruiser"
model: "(2582)"
overview: |-
  <p>The Kimagure-class pursuit cruiser was designed by Krester Ship Construction on Terra as a proof of concept demonstrating that a cruiser-weight WarShip could achieve corvette-like speed and agility while carrying substantially heavier armament and armor. The design so impressed the Star League Defense Force naval command that they placed significant orders for the class, establishing Krester as a capable builder of fast capital vessels. The name Kimagure, meaning capricious in Japanese, reflected the vessel's unpredictable nature in combat, where its exceptional speed allowed commanders to choose engagements on favorable terms and withdraw before an enemy could concentrate forces against it. The class's distinctive forward prow, extending prominently below the main hull, gave it an immediately recognizable silhouette that earned the vessel the lasting nickname hatchetface among its crews, a designation carried with quiet pride throughout its long service life.</p>
capabilities: |-
  <p>At 780,000 tons, the Kimagure was one of the fastest cruiser-weight WarShips ever fielded by the Star League, capable of sustaining five thrust points safely with a maximum of eight, giving it acceleration comparable to many corvettes. A lithium-fusion battery system allowed rapid successive jumps, enhancing the vessel's strategic mobility. The class carried over a thousand tons of ferro-carbide armor, providing impressive protection for a vessel of its speed, while 2,500 double heat sinks managed the tremendous thermal output of its predominantly energy-based armament. The primary weapons suite centered on banks of heavy and medium naval particle projection cannons distributed across nearly every firing arc, with the nose mounting four of each type for devastating approach salvos. Broadside bays each carried eight heavy and four medium naval PPCs, giving the vessel tremendous sustained engagement firepower. Twenty-four LB 10-X autocannons in the fore and aft quarter arcs provided flexible short-range defense, while small pulse lasers throughout the vessel served as point defense against fighters and missiles. The vessel's greatest tactical vulnerability lay in its heat management when engaged from multiple directions simultaneously, as each broadside bay alone required nearly half the ship's total heat dissipation capacity, meaning a surrounded Kimagure could not effectively bring all weapons to bear. The class accommodated fifty officers, one hundred and fifty-five enlisted crew, seventy gunners, and twenty-four bay personnel, with thirty marines aboard for boarding operations. Four-person bunkrooms for enlisted crew reflected reasonable attention to habitability, and two grav decks provided comfortable living conditions during extended deployments.</p>
deployment: |-
  <p>The Kimagure-class served primarily as fast pursuit and interdiction vessels within the SLDF navy, a role for which their exceptional acceleration made them ideally suited. Fleet commanders routinely assigned Kimagures to hunt down raiders, escort high-value convoys through contested space, and serve as the fast screening wing of larger battle groups. The class excelled at choosing when and where to engage, using its speed advantage to dictate the terms of battle and withdraw before heavier enemy forces could close to effective range. During extended patrol deployments, the vessel's two gravity decks and reasonable crew accommodations helped maintain operational readiness across long cruises.</p>
history: |-
  <p>The Kimagure program began in the mid-twenty-sixth century when the Star League Defense Force identified a tactical gap in its naval order of battle for a fast, heavily-armed pursuit vessel. Krester Ship Construction on Terra, then a relatively unproven shipyard, submitted a bold proposal for a cruiser-weight WarShip capable of corvette-like speed while maintaining the firepower and protection expected of a much larger vessel. The SLDF was sufficiently impressed with the initial design that they ordered a dozen hulls, the first entering service in 2582. Krester's successful execution of the Kimagure program established the firm's reputation and directly led to their being awarded the prestigious contract for the Texas-class battleship in 2618, a vessel that would share several design philosophies with its smaller predecessor.</p><p>Throughout its service life, the Kimagure proved itself an effective combat platform, though it was not without significant weaknesses. Commanders who allowed their vessels to be flanked or surrounded found that tactical limitations could quickly turn engagements against them, a lesson learned at the cost of several hulls during the Periphery campaigns. The class's speed and firepower made it a valuable screening asset in larger fleet formations, but isolated Kimagures operating without support proved far more vulnerable than their impressive armament suggested. Despite these concerns, the class remained a valued component of SLDF fleet operations throughout the Star League era, with its fast pursuit capability filling a role that few other cruiser-weight vessels could match.</p><p>The Amaris Civil War devastated the Kimagure fleet. Of the twelve vessels originally constructed, only five survived the fighting. One hull undergoing experimental weapons modification was scuttled at the Titan Yards rather than risk capture by Rim Worlds Republic forces. All five surviving vessels departed the Inner Sphere with General Aleksandr Kerensky during the Exodus, passing into Clan service where the class continued to serve for centuries. In the mid-thirty-first century, Clan Snow Raven selected two of the surviving hulls for conversion into the Conqueror-class battlecruiser and carrier, conceived as escort vessels for the massive Leviathan-class battleships. At least one additional hull was reactivated by the Society and ultimately fell into the hands of the Bandit Caste associated with the remnants of Clan Burrock.</p>
