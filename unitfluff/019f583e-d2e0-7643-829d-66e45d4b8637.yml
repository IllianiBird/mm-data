chassis: "Loki Mk II"
model: "A"
overview: |-
  <p>The Hel is a 65-ton Clan Heavy OmniMech introduced in 3121, developed by Clan Jade Falcon as a successor to the venerable Hellbringer originally designed by Clan Hell's Horses scientists in 2926. Known to the Inner Sphere as the Loki Mk II, the Hel was created in the years preceding Gray Monday to address the aging Hellbringer's longstanding deficiencies in armor protection and equipment capacity. Manufactured jointly by Olivetti Weaponry on Sudeten and Csesztreg Industriplex Alpha on Csesztreg, the design has become most common in the Jade Falcon and Hell's Horses toumans, where it serves as a versatile heavy fire platform capable of fulfilling roles ranging from long-range sniping to close-quarters brawling.</p>
capabilities: |-
  <p>The Hel achieves its remarkable forty tons of pod space through a combination of engineering trade-offs that fundamentally distinguish it from its predecessor. A 260-rated XL fusion engine provides a maximum speed of only 64 kilometers per hour, a significant reduction from the Hellbringer's 86 kph top speed that has earned the design the unflattering nickname "Slowki" among Spheroid detractors. This sacrifice in mobility is offset by the installation of a small cockpit and Compound H17 ferro-fibrous armor, which together provide approximately fifty percent more protection than the notoriously thin-skinned original Hellbringer. The T-E H65 Omni chassis utilizes an endo steel internal structure to maximize available tonnage.</p><p>The Prime configuration exemplifies the design's long-range philosophy, mounting paired Gauss rifles and ER large lasers in its arms for devastating firepower at extended distances. A torso-mounted Streak SRM-4 provides limited close-range defense when engagement distances collapse. The Multi-Trac targeting system allows MechWarriors to effectively track multiple targets simultaneously, a critical advantage when exploiting the Hel's enormous weapon loadouts. While the small cockpit limits pilot comfort during extended operations, the sheer volume of pod space available ensures that configurations can be tailored to virtually any tactical requirement.</p>
deployment: |-
  <p>Alternate Configuration A presents a more balanced weapons mix designed to handle both armored vehicles and infantry formations. Each arm carries an ER PPC paired with a medium pulse laser, while the right torso houses twin improved heavy medium lasers and a pair of AP Gauss rifles for anti-infantry work. An LB 10-X autocannon in the left torso provides flexible direct fire capability with both slug and cluster ammunition options. An Angel ECM suite mounted in the right torso enhances survivability by disrupting enemy targeting systems. With fourteen double heat sinks managing the substantial energy weapon load, the A configuration operates effectively at medium ranges where its diverse weapon systems can be brought to bear simultaneously.</p>
history: |-
  <p>The Hel emerged from Clan Jade Falcon's recognition that the original Hellbringer, despite its iconic status as a Clan Invasion-era heavy OmniMech, suffered from fundamental design limitations that no amount of reconfiguration could overcome. Development began prior to Gray Monday in 3132, with Olivetti Weaponry on Sudeten and Csesztreg Industriplex Alpha collaborating on a design that would retain the Hellbringer's flexibility while dramatically improving survivability. The resulting chassis entered production in 3121 and spread quickly through both the Jade Falcon and Hell's Horses toumans.</p><p>The Hel saw significant combat during the Clan invasions of the Republic of the Sphere and Lyran Commonwealth in the 3140s. A notable early deployment occurred on Sargasso in July 3142, when the Ninth Talon Cluster of Clan Jade Falcon deployed a Binary of Hels fitted with B configurations to suppress resistance in the city of Salicastrum on the southern continent of Perusalem. The Long Tom cannons proved devastatingly effective against rebel positions, though a subsequent ambush by a Nova of Wolf-in-Exile forces destroyed half the Binary. The surviving Star regrouped and ultimately forced a Clan Wolf retreat, preventing the world from falling back into Commonwealth hands.</p><p>The divergence between Hell's Horses and Jade Falcon tactical philosophies became apparent during Operation Noyan on Biota in 3142, where the Eighty-Second Mechanized Cavalry under Star Colonel Waylon Mehta overran the Falcons' Fifth Mixed Cluster. Both Clans fielded Hels extensively during the engagement, with kinsmen from opposing forces dueling in extended single combat that highlighted the chassis's versatility in different doctrinal approaches.</p><p>As combat experience accumulated, the two primary operators developed the Hel along divergent paths. The Hell's Horses focused on leveraging the massive pod space for long-range firepower delivery, producing configurations emphasizing Gauss rifles, missile systems, and energy weapons optimized for standoff engagement. The Jade Falcons, meanwhile, worked to address the "Slowki" reputation by developing configurations incorporating improved jump jets and superchargers to enhance battlefield mobility. This dual development philosophy has produced a diverse stable of configurations that ensure the Hel remains a cornerstone of both toumans well into the ilClan era.</p>
