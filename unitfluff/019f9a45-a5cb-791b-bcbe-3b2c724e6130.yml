chassis: "Mechanized Hover Platoon (Generic)"
model: "(MRM 3065+)"
overview: |-
  <p>Mechanized hover platoons transport their infantry in hovercraft capable of crossing water, swamps, and open terrain at high speed. The fastest conventional mechanized formation available, hover platoons trade the all-terrain reliability of tracked vehicles for raw speed and amphibious capability. They are well suited to coastal defense, riverine operations, and rapid flanking maneuvers on open ground. Rough terrain and dense forests limit hovercraft effectiveness, and the vehicles offer less protection than heavier tracked or wheeled transports. Support elements carry disposable medium-range missile launchers that split the difference between the close-range punch of SRM systems and the reach of LRM launchers. The volume of fire compensates for the lack of guidance systems.</p>
