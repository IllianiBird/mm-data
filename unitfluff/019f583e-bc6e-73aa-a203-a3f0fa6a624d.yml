chassis: "Field Gun Platoon (FWLM)"
model: "(Wheeled LBX10 3040+)"
overview: |-
  <p>New technology and creative tactical thinking have long featured in FWLM infantry deployment, with varied unit types and specialized formations treated as the norm rather than the exception. Towing crew-served LB 10-X autocannon, these platoons deploy one of the most tactically flexible field guns available, switching between armor-piercing slugs and cluster munitions depending on the target.</p>
