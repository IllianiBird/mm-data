chassis: "Axman"
model: "AXM-3S"
overview: |-
  <p>The Axman was introduced in 3048 as the heavy counterpart to the successful Hatchetman, developed by Team Banzai as a dedicated close-combat BattleMech for the newly formed Federated Commonwealth. Weighing sixty-five tons, the design was conceived from the outset as a 'Mech killer, built around a massive five-ton hatchet capable of cleaving through even the thickest armor plating. Johnston Industries on New Syrtis and Defiance Industries on Furillo shared production responsibilities, deliberately sourcing components from across the Federated Suns, Lyran Commonwealth, and former Capellan space as a symbol of the alliance's unity.</p><p>This deliberate supply chain strategy proved to be the Axman's greatest vulnerability when the Federated Commonwealth fractured in 3057, nearly rendering the design extinct as cross-border component shipments ceased. Both manufacturers were forced to develop new variants using locally sourced parts, ultimately splitting the Axman line into distinct Davion and Lyran branches that have continued to evolve independently.</p>
capabilities: |-
  <p>The original AXM-1N centers its combat doctrine around devastating close-range engagements. Its primary armament pairs the iconic five-ton hatchet with a Luxor Devastator-20 autocannon, giving the Axman the ability to strip over a ton of armor from an opponent with a single volley before closing to deliver punishing melee strikes. A Sutel Precision Line large pulse laser and three Intek medium lasers provide accurate supporting fire at short to intermediate ranges, ensuring targets that evade the hatchet's reach still face withering energy fire.</p><p>The chassis rides on a Magna 260 XL engine providing a respectable top speed of sixty-four kilometers per hour, augmented by HildCo Model 12 jump jets that grant the Axman the ability to exploit urban terrain and close on opponents who attempt to maintain distance. Ten tons of Kallon Unity Weave ferro-fibrous armor provides substantial protection for a 'Mech of its weight class, while ten double heat sinks manage the considerable thermal load of its combined weapons systems.</p><p>Like the Hatchetman before it, the Axman incorporates a full-head ejection system to protect its MechWarrior during the high-risk close-quarters engagements the design was built to pursue. This safety feature has proven invaluable given the violent nature of hatchet combat, though the XL engine remains a significant vulnerability that later variants have sought to address through alternative powerplant configurations.</p>
deployment: |-
  <p>Emerging from Defiance Industries' Furillo production lines in 3060, the AXM-3S was developed as a distinctly Lyran variant following the secession of the Lyran Alliance. The 3S replaces the original XL engine with a light fusion engine, significantly improving survivability at the cost of some internal space. Its primary armament upgrades the standard autocannon to an LB 20-X capable of firing both solid slugs and cluster munitions, while the large pulse laser gives way to a Guardian ECM suite for electronic warfare protection. Three extended-range medium lasers replace the standard models, extending the 'Mech's effective engagement envelope. These changes collectively make the 3S a more resilient and versatile combatant suited to Lyran combined-arms doctrine.</p>
history: |-
  <p>The Axman emerged during a period of intense military cooperation between the Federated Suns and Lyran Commonwealth following the formation of the Federated Commonwealth. Team Banzai's design was deliberately conceived as both a weapon system and a political statement, with its component supply chain spanning both halves of the realm and drawing from former Capellan territory as well. Johnston Industries on New Syrtis and Defiance Industries on Furillo established parallel production lines, with Defiance adding a specialized AXM-2N variant line in the late 3050s.</p><p>The FedCom Civil War and the preceding secession of the Lyran Alliance in 3057 devastated Axman production. With component contracts spread across the fragmenting nation, both factories were reduced to working off surplus stores while their engineers scrambled to develop locally sourced alternatives. This crisis ultimately proved transformative, as each manufacturer developed distinct variant lines tailored to their respective nation's doctrine and industrial capabilities. Defiance Industries produced the LB 20-X armed AXM-3S as a purely Lyran machine, while Johnston Industries developed the AXM-4D to reduce reliance on foreign suppliers for the Federated Suns.</p><p>During the Jihad era, Defiance Industries pursued an ambitious experimental program on Furillo, developing the AXM-6X prototype beginning in 3074. This technology demonstrator explored handheld modular weapons systems as a cost-effective alternative to true OmniMech technology, earning the nickname "poor man's OmniMech." Although only six prototypes were constructed by 3080, the concept proved viable enough for Defiance to develop the production-grade AXM-6T, which entered service in 3083 with an Inner Sphere XL engine replacing the costly Clan-specification powerplant of the prototype.</p><p>Johnston Industries' facilities on New Syrtis weathered the Capellan occupation and subsequent Davion reconquest, expanding production to support the Federated Suns military with the AXM-5N beginning around 3148. This variant represented a significant technological leap, incorporating Clan Sea Fox supplied weapons systems and triple-strength myomers that transformed the Axman from a simple brawler into a sophisticated multi-range combatant. The Axman's continued evolution on both sides of the former Federated Commonwealth demonstrates the enduring value of the original Team Banzai concept, even as the political alliance that inspired it has long since dissolved.</p>
