chassis: "MuckRaker"
model: "GMMM-2M-B MiningMech MOD"
overview: |-
  <p>The MuckRaker is a 70-ton IndustrialMech introduced in 2737 by General Motors during the height of the Star League era. Designed as a "walking dump truck" capable of reaching terrain inaccessible to conventional hauling vehicles, the MuckRaker was built around a large truck bed mounted on a slow but exceptionally stable chassis. Originally intended for deployment at remote mining sites, the design's eminent usefulness and rugged simplicity ensured its survival through the Succession Wars when many other IndustrialMech classes disappeared entirely.</p><p>The MuckRaker has since spread to virtually every corner of the Inner Sphere and Periphery, finding employment in roles far beyond basic mining, from construction and archaeology to salvage and waste collection. Its reputation as the finest platform for ad-hoc weapon modifications has made it a favorite among irregular forces and civilian militias, with armed MuckRaker MODs becoming an increasingly common sight across the Republic and beyond.</p>
capabilities: |-
  <p>The standard MuckRaker is built on the GM Specialheavy Industrial chassis and powered by a GM 140 Turbine internal combustion engine, giving it a top speed of just 32 kilometers per hour. What the design sacrifices in mobility it compensates for with exceptional stability, courtesy of a reinforced gyro system that keeps the platform steady even over rough terrain. The truck bed can carry and dump up to twenty-two tons of cargo, while a backhoe arm provides basic excavation capability. Durallex Heavy Industrial armor offers reasonable protection for a civilian machine.</p><p>The most commonly encountered MuckRaker MOD replaces the backhoe arm with a Mydron Tornado Rotary Autocannon/5, while a Sian/Ceres Puma MRM 20 launcher occupies the truck bed alongside banks of ammunition. This combination provides effective medium-range firepower, though the rotary autocannon's vibrations can create stress fractures in the industrial-grade internal structure over prolonged firing. The MuckRaker's slow speed and heavy industrial armor make it a poor choice for open-field engagements, but in confined spaces such as urban areas, mining tunnels, or mountain passes, modified MuckRakers have proven to be formidable opponents capable of ambushing and pinning down even dedicated combat units.</p>
deployment: |-
  <p>The GMMM-2M-B serves as a more elaborate field modification of the MuckRaker that trades the rotary autocannon for a broader array of weapons. This variant mounts two heavy machine guns and three MML 7 launchers, requiring more extensive reworking of the targeting system to accommodate the diverse weapon types. The multi-missile launchers provide both long-range and short-range engagement options, while the heavy machine guns offer effective anti-infantry capability. Among splinter factions operating during the Dark Age, the GMMM-2M-B has proven popular for its flexibility, increasing both the reach and close-range firepower of the platform compared to the standard MOD configuration.</p>
history: |-
  <p>General Motors introduced the MuckRaker in 2737 as part of a broader initiative to develop specialized IndustrialMechs for resource extraction in difficult terrain. The design drew heavily from the earlier Dig Lord concept, adapting the walking heavy-equipment philosophy for a dedicated hauling role. Production was established at GM facilities on El Dorado, New Valencia, and Talcott, all within Federated Suns space, and the design quickly found customers across the Inner Sphere.</p><p>The Succession Wars devastated IndustrialMech production lines across known space, but the MuckRaker's simple construction and use of widely available components ensured continued manufacture when more sophisticated designs were lost. By the Late Succession Wars era, MuckRakers had become ubiquitous on industrial worlds throughout the Inner Sphere and Periphery, performing an enormous variety of civilian tasks far beyond their original mining role.</p><p>The trend toward militarizing civilian IndustrialMechs accelerated dramatically during the Dark Age following the collapse of the HPG network in 3132. While General Motors bears some responsibility for on-site military modifications at its own facilities, third-party conversion shops and independent operators have been particularly active in producing armed MuckRaker MODs. The discovery of a Zhanzheng de Guang Terrorist Handbook recommending the MuckRaker above all other IndustrialMechs for weaponization confirms the design's unfortunate reputation as the platform of choice for irregular forces.</p><p>The most celebrated engagement involving MuckRakers occurred on Addicks, when miners from the town of Marlinspike hastily modified their MiningMechs to repel a raid by Wyld's Jokers. Armed with homemade rocket launchers and harpoon guns fashioned from industrial air hammers, four MuckRakers managed to surprise and pin down the Bannson forces in the town's central square until the local Standing Guard arrived. The incident demonstrated both the versatility of the MuckRaker platform and the resourcefulness of civilian operators when faced with the chaos of the Dark Age.</p>
