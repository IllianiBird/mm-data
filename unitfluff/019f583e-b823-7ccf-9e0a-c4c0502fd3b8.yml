chassis: "Field Gun Platoon (CCAF)"
model: "(Tracked LBX5 3060+)"
overview: |-
  <p>The Capellan Confederation has always relied on its infantry to compensate for the CCAF's chronic shortage of heavier assets. Conventional foot soldiers, drawn from the citizens' militia system that defines Capellan military service, form the backbone of garrison forces across the Confederation's commonalities. Field gun platoons provide Capellan infantry with organic direct-fire heavy weapons, towing crew-served autocannons or other heavy guns to prepared positions. The weapon crew operates the gun while the remaining troopers provide local security with personal arms. Their LB 5-X autocannon can switch between solid and cluster ammunition, giving the crew tactical flexibility against both armored and dispersed targets.</p>
