chassis: "Cadaver"
model: "CVR-T1"
overview: |-
  <p>The Cadaver is a thirty-ton light BattleMech introduced in 3094 by the Taurian Concordat. Designed primarily as a fast cavalry raider and electronic warfare platform for Periphery operations, the Cadaver was developed with significant technical assistance from Clan Snow Raven. Vandenberg Mechanized Industries on New Vandenberg serves as the primary production facility, with Alliance Defenders Limited on Alpheratz operating a second line for the Raven Alliance. Notable for its emphasis on pilot survivability in a weight class where crews are often considered expendable, the design has earned a reputation as the Concordat's most visible military export, finding its way into service with a surprising variety of operators across the Periphery and beyond.</p>
capabilities: |-
  <p>The Cadaver is well armored for its weight class but deliberately sacrifices long-range firepower in favor of speed and electronic warfare capability. A VOX 240 XL engine drives the thirty-ton chassis to a top speed of 129 kilometers per hour, placing it among the faster light BattleMechs operating in the Periphery. The primary armament consists of two Diverse Optics extended-range medium lasers and a Shannon Ten-Pin MRM 10 launcher, providing effective striking power at close to medium ranges. A Flameshot flamer rounds out the weapons suite, useful for anti-infantry operations and forcing shutdowns on overheated opponents.</p><p>The Cadaver's greatest tactical asset is its integrated Lynx-Shur communications system paired with a Guardian ECM suite, allowing the design to disrupt enemy targeting and communications networks. This electronic warfare capability makes the Cadaver highly effective in reconnaissance and screening roles, where most commanders prefer to employ it rather than risk direct confrontation. Durallex ferro-fibrous armor with CASE II provides respectable protection, while the Corean endo steel chassis and a full-head ejection system (reminiscent of the venerable Hatchetman) demonstrate a notable commitment to pilot survivability even in harsh operational environments.</p>
deployment: |-
  <p>Introduced in 3097, this variant is a substantially reworked variant produced for the Taurian Defense Force that strips out the entire standard weapons suite in favor of a completely new loadout. A light particle projector cannon on the right arm provides the ranged punch the CVR-A1 lacks, supported by an extended-range medium laser and ER flamer on the left arm. A Rocket Launcher 10 mounted in the right torso offers a devastating one-shot alpha strike option. The electronic warfare suite is upgraded from the Guardian ECM to an Angel ECM suite, providing even more comprehensive disruption of enemy targeting networks. Most significantly, this variant replaces the standard ferro-fibrous armor with reflective armor to better resist energy weapons, and incorporates a MASC system that pushes the design to bursts of 160 kilometers per hour, fast enough to run down hovercraft and VTOLs. This combination of enhanced firepower, superior electronic warfare capability, and burst speed transforms the Cadaver into a highly effective pursuit and interdiction platform well suited to the TDF's aggressive border defense doctrine.</p>
history: |-
  <p>The Cadaver's development began in the late 3070s when the Taurian Defense Force identified a need for a fast, domestically produced light BattleMech capable of filling reconnaissance and raiding roles along the Concordat's borders. The design was conceived during a period of significant upheaval in the Periphery, but the resource constraints imposed by ongoing conflicts meant that the Concordat was unable to move the project beyond the planning stages for nearly a decade.</p><p>It was not until the ceasefire following 3080 that Vandenberg Mechanized Industries was able to muster the industrial capacity to finalize the Cadaver. Crucially, the Concordat turned to its allies in Clan Snow Raven for technical assistance, a collaboration that proved essential to completing the design. The Snow Ravens' expertise in electronics and advanced materials helped shape the Cadaver's distinctive combination of advanced armor, lightweight construction, and integrated electronic warfare capability, features that would have been difficult for Taurian industry to implement independently.</p><p>The Cadaver first appeared on the battlefield in 3094, and Alliance Defenders Limited on Alpheratz soon established a second production line for the Raven Alliance, ensuring steady supply to both the TDF and Alliance forces. Despite official sales being restricted to these two states, the Cadaver rapidly proliferated through secondary markets. Mercenary units and pirate bands across the Periphery acquired the design through intermediaries, while the Alliance cultivated a profitable sideline selling surplus units to Clan Sea Fox, who resold them to customers unable to afford their own higher-end products.</p><p>The Cadaver has seen its most visible non-military deployment in the arenas of Solaris VII, where its speed and maneuverability have made it a crowd favorite in lighter weight classes. In more conventional operations, the design has proven itself in scouting and screening roles across the Periphery, though its limited ranged firepower restricts its effectiveness in sustained engagements. The introduction of the more capable CVR-T1 variant in 3097 addressed some of these limitations for TDF forces, while the original CVR-A1 continues to serve as the primary export model.</p>
