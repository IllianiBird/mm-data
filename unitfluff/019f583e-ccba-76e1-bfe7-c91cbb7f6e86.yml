chassis: "Toyama"
model: "TYM-1C"
overview: |-
  <p>The Toyama is a seventy-five-ton heavy BattleMech produced for the Word of Blake at the Gibson Federated BattleMechs facilities beginning in 3057. Named for Conrad Toyama, the founder of the Blakist religion and successor to Jerome Blake as Primus of ComStar, the design carried strong ideological significance for its operators. Intended as a multi-purpose 'Mech capable of operating independently of supply lines for extended periods, the Toyama became one of the most recognizable heavy designs fielded by the Blakist Militia. A second production line at the Lantren Corporation on Bryant supplemented Gibson's output during the Jihad. Its strong association with the Word of Blake has left the design with a lasting stigma in the post-Jihad era, and no faction has attempted to resume production.</p>
capabilities: |-
  <p>Designed for versatility and endurance, the Toyama carries an impressive mix of weapons systems covering all engagement ranges. A pair of Diverse Optics Sunbeam extended-range large lasers mounted in the right arm provide devastating long-range firepower, while an Imperator Code Red LB 10-X autocannon in the left arm offers flexibility through both standard and cluster munitions. A Doombud LRM-20 launcher in the torso adds indirect fire capability, with two full tons of ammunition allowing the pilot to carry a mix of warhead types tailored to the mission at hand. Three Magna Mark II medium lasers clustered in the torso provide additional close-range firepower, though their effective range is limited.</p><p>The Toyama is built on a lightweight Endo Steel chassis powered by a Vlar 300 XL engine, giving it a top speed of sixty-five kilometers per hour, adequate for keeping pace with most heavy 'Mech formations. Twelve tons of Durallex Heavy armor provide substantial protection for its weight class. A Guardian ECM suite mounted in the right torso disrupts enemy electronic warfare systems, though the original design's planned anti-missile system was ultimately sacrificed to accommodate the larger LRM launcher.</p>
deployment: |-
  <p>Emerging in 3072, this variant reconfigures the Toyama as a dedicated fire support platform. The most dramatic change is the replacement of the LB 10-X autocannon with a devastating M-2 Gauss rifle, giving the 'Mech tremendous long-range striking power. The large lasers are removed in favor of two Blankenburg medium variable-speed pulse lasers, which offer flexible accuracy at shorter ranges. The Doombud LRM-20 is retained but enhanced with an Artemis IV fire control system for improved missile accuracy, with ammunition bins now protected by CASE equipment. An XL gyro and upgraded Durallex Guardian heavy ferro-fibrous armor round out the extensive modifications, while a C3i computer links this variant into Blakist tactical networks.</p>
history: |-
  <p>The Toyama was the product of an unusual collaboration. Unlike many Word of Blake designs produced in-house, the 'Mech was the work of a military technology consultant at the Free Worlds League's Heliopolis design labs. As part of an arrangement with Captain-General Thomas Marik, the design was passed to the Word of Blake, who named it for Conrad Toyama, the successor to Jerome Blake as Primus of ComStar and the acknowledged founder of the Blakist religion. Gibson Federated BattleMechs put the design into production in early 3057.</p><p>The Toyama first saw combat with the Word of Blake Militia during the late 3050s. Plans to deploy several Toyamas to the Atrean Dragoons were postponed when the Word of Blake launched Operation Odysseus in 3058, during which Blakist Militia troops masquerading as the mercenary 21st Centauri Lancers infiltrated and sabotaged ComStar's defenses on Terra. At least four Toyamas were used during that operation, marking the design's baptism of fire.</p><p>Following the seizure of Terra, the Toyama became increasingly common among Blakist forces. Gibson Federated BattleMechs, a division of Free Worlds Defense Industries, ramped up production at their facilities on Gibson throughout the Civil War era. By the time of the Jihad, the Word of Blake had established a second production line at the Lantren Corporation facility on Bryant, which intelligence analysts had long suspected based on the volume of new Toyamas appearing in combat zones far exceeding projected output from Gibson alone.</p><p>During the Jihad, both factories operated at full capacity producing the original TYM-1A along with newly developed variants incorporating advanced technologies. The Gibson facility produced all three known variants, while the Bryant line focused on the TYM-1A and the advanced TYM-1C. Word of Blake engineers on Gibson continued refining the design throughout the conflict, producing machines that combined increased durability with devastating firepower.</p><p>The destruction wrought during the Jihad brought Toyama production to a permanent halt. Both the Gibson and Bryant facilities ceased operations during or shortly after the conflict, and no faction has resumed manufacturing of the design. Surviving Toyamas remain in service with various successor states and mercenary commands that captured them during the Jihad, but the 'Mech's strong association with the Word of Blake has discouraged any attempts to revive production.</p>
