chassis: "Field Gun demi-I (ComGuards)"
model: "(Motorized RAC2)"
overview: |-
  <p>The Com Guards field conventional infantry as a core component of their combined-arms formations, with Level I infantry units integrated into the same command structure alongside BattleMech, armor, and aerospace elements at every organizational level. Crewing rotary autocannon that can sustain extraordinary rates of fire, these gunners lay down suppressive barrages that saturate an area with projectiles, trading accuracy and weapon longevity for sheer volume of fire.</p>
