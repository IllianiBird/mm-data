chassis: "Morrigan"
model: "3"
overview: |-
  <p>The Morrigan is a 35-ton light BattleMech born from an unusual post-Jihad collaboration between Clan Nova Cat and the Draconis Combine. Introduced in 3083, the design emerged from the Nova Cats' need for a new scout 'Mech following the devastation of the Jihad. The Draconis Combine provided resources and manpower through the Mualang Alpha facility on Coudoux, while the Nova Cats contributed their technical expertise and access to Clan technology. The resulting design blends Clan construction techniques with a practical battlefield philosophy, producing an effective if unspectacular scout platform. Despite production numbers that remained lower than desired, the Morrigan established itself as a reliable reconnaissance asset in both Nova Cat and Combine service.</p>
capabilities: |-
  <p>The Morrigan prioritizes speed and information-gathering over raw firepower. Its Consolidated 280 XL engine propels the thirty-five-ton chassis to speeds of 129 kilometers per hour, making it one of the faster light 'Mechs in either the Nova Cat touman or the DCMS inventory. An integrated active probe within the Cat's Eyes 7 targeting and tracking system allows pilots to detect hidden units and electronic emissions, fulfilling the design's primary scouting mission.</p><p>The offensive armament centers on a Model X heavy large laser backed by three Type 3 Series ATM-3 launchers sharing three tons of ammunition. The advanced tactical missiles provide exceptional versatility, with extended-range munitions allowing the Morrigan to engage targets well before closing to effective range, while high-explosive rounds deliver devastating damage at close quarters. The heavy large laser adds serious hitting power for a light 'Mech, though its inherent inaccuracy at speed and substantial heat generation force pilots to carefully manage their fire. With only ten double heat sinks, firing the laser effectively prevents simultaneous missile use until temperatures drop.</p><p>The chassis employs Clan-grade endo steel construction and ferro-fibrous armor to maximize protection within its weight class, with integral CASE protecting each torso from ammunition detonation. Despite these advantages, the Morrigan suffers from a known structural weakness in its leg actuators, and its complete lack of jump jets limits tactical flexibility in broken or urban terrain.</p>
deployment: |-
  <p>Introduced in 3085 as a specialized variant for Combine special operations units, this configuration builds on the Morrigan 2's energy weapon platform. The heavy large laser and targeting computer are replaced with an experimental BattleMech taser, providing the ability to temporarily disable enemy 'Mechs and vehicles without destroying them. The remainder of the Morrigan 2's armament (extended-range medium lasers and small pulse lasers) is retained, giving the design adequate conventional firepower to support its electronic warfare capability.</p>
history: |-
  <p>The Morrigan emerged from the complex political relationship between Clan Nova Cat and the Draconis Combine in the aftermath of the Jihad. Following their relocation to the Inner Sphere and absorption into the Combine's military structure, the Nova Cats sought to rebuild their diminished touman with new designs suited to their changed circumstances. The Combine, eager to access Clan technology for their own forces, offered material support and factory resources through the Mualang Alpha facility on Coudoux, a plant operating under the Luthien Armor Works corporate umbrella, though particularly without full LAW authorization for the partnership.</p><p>Production began in 3083, but the collaboration proved contentious from the start. The Nova Cats resented what they saw as the Combine's attempts to limit Nova Cat access to the completed 'Mechs, while the Combine accused the Nova Cats of shorting raw material shipments. This mutual suspicion kept production volumes well below the facility's capacity, ensuring that neither faction received as many Morrigans as they desired.</p><p>The divergence in deployment philosophy between the two partners was equally telling. The Nova Cats assigned their Morrigans primarily to second-line garrison units, viewing the design as competent but lacking the prestige of a true OmniMech. The Combine, by contrast, distributed the 'Mech exclusively to its most elite formations (the Sword of Light, Ryuken, and Genyosha brigades) along with granting DEST access. This difference highlighted the fundamental cultural gap between Clan and Inner Sphere military thinking regarding equipment allocation.</p><p>Beginning in 3084, the Combine pushed for variants tailored to their specific doctrinal needs, resulting in the energy-focused Morrigan 2 and the taser-equipped Morrigan 3 for special operations. These variants reduced dependence on Clan-specific ammunition supplies and better aligned with DCMS tactical preferences. As the Dark Age progressed and TSEMP technology became available, the Morrigan line evolved further with the introduction of the Morrigan 4 in 3111 and the long-range Morrigan 5 in 3124, demonstrating the Combine's continued investment in the platform well beyond the original Nova Cat partnership.</p>
