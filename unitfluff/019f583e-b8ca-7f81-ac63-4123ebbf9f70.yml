chassis: "Mechanized Tracked Platoon (CCAF)"
model: "(Mortar 2367+)"
overview: |-
  <p>The CCAF fields conventional infantry in larger numbers than its limited industrial base might suggest, drawing on the Confederation's deep tradition of citizens' militia service. Capellan soldiers learn to fight with fewer resources and less support than their counterparts in wealthier states, compensating with resourcefulness and ideological commitment. Mechanized tracked platoons give Capellan commanders infantry that can keep pace with armored formations across rough terrain. The tracked transports provide better cross-country mobility than wheeled vehicles, allowing these platoons to operate alongside the tanks and combat vehicles that form the CCAF's armored reserve. Mortar sections provide the platoon with organic indirect fire capability, lobbing explosive rounds over obstacles and into defilade positions that direct-fire weapons cannot reach.</p>
