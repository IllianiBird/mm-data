chassis: "Gambit"
model: "GBT-1L"
overview: |-
  <p>The Gambit is a twenty-five-ton light BattleMech introduced in 3136 by Adam Tech Industries, a startup manufacturer based on Abadan in Free Worlds League space. The second original design from Adam Tech following the Havoc, the Gambit was purpose-built for long-range combat and quickly distinguished itself in the crowded Dark Age BattleMech market. Built around widely available components, the chassis earned a reputation for straightforward maintenance that made it particularly appealing to mercenary commands and independent operators. Produced exclusively at Adam Tech's Abadan facility, the Gambit established itself as a reliable and popular choice among light BattleMech buyers across the Inner Sphere.</p>
capabilities: |-
  <p>The Gambit's primary armament consists of a pair of Fusigon Shorttooth light particle projection cannons mounted in each arm, providing consistent long-range firepower without ammunition dependency. A Holly 3-Tube multi-missile launcher in the right torso supplements the energy weapons with flexible missile capability, though the single ton of ammunition limits sustained use. CASE protection around the missile storage mitigates the risk of catastrophic ammunition explosion.</p><p>Mounted on an X-G266 endo steel frame, the Gambit achieves respectable performance from its Omni 175 light fusion engine, reaching a top speed of 118 kilometers per hour. The light engine provides survivability advantages over extralight designs, as the loss of a single side torso will not disable the 'Mech. An XL gyro frees additional tonnage for equipment, though at the cost of reduced gyro durability. Five tons of Kallon Royalstar armor provide adequate protection for a twenty-five-ton design, though concentrated fire from heavier units will overwhelm the plating quickly.</p><p>The Garret T20-C communications system paired with the Dynatec 1122 targeting and tracking system gives the Gambit reliable battlefield electronics. MechWarriors particularly value the Dynatec's fully customizable heads-up display, and the cockpit ingress port is armored to withstand battle armor-scale weapons for a full ten seconds. The hyper-extending actuators in both arms allow the pilot to rotate the light PPCs to engage targets in the rear arc, a significant tactical advantage for a design expected to operate independently at range.</p>
deployment: |-
  <p>This variant eliminates all ammunition dependency by replacing the missile launcher with enhanced targeting and spotting equipment, transforming the Gambit into a purely energy-based weapons platform. This modification has made this variant extremely popular with units operating in combined-arms formations where artillery support is readily available, as the pilot can designate targets for friendly indirect fire assets while maintaining accurate long-range energy fire. Free Worlds League commands that regularly train alongside artillery batteries have shown particular interest in the variant, and it has seen growing adoption among coalition forces that value its forward observation capability.</p>
history: |-
  <p>The Gambit emerged from Adam Tech Industries, a startup manufacturer that established itself on Abadan by purchasing and expanding a small Irian BattleMechs Unlimited component manufacturing center into a full 'Mech production facility. As the Free Worlds League fractured during the early Dark Age, smaller manufacturers like Adam Tech seized the opportunity to fill gaps in the BattleMech market previously dominated by larger corporations. Building on the company's experience with its first design, the Havoc, the Gambit entered production in 3136 as Adam Tech's second offering to the light 'Mech market.</p><p>Adam Tech's facility on Abadan weathered the political upheavals of the era. During the Republic of the Sphere's existence, Abadan fell under Republic jurisdiction, though the factory was not yet producing the Gambit during this period. As the Republic contracted and Fortress Republic sealed its borders, Abadan briefly operated as an independent world before being reabsorbed into the reconstituted Free Worlds League. Under renewed League patronage, Adam Tech ramped up Gambit production to meet demand from both League regulars and independent commands seeking reliable light 'Mechs.</p><p>The Gambit saw its first significant combat during mercenary operations in the mid-3130s, where independent commands employed the design in garrison and defensive roles. The 'Mech's long-range firepower and easy maintenance made it particularly attractive to mercenary units operating far from established supply lines. Combat reports from engagements on Lyons in 3136 demonstrated both the Gambit's strengths and limitations. Its energy armament proved effective at range, but the design struggled when forced into close-quarters engagements against heavier opposition, particularly when cornered without room to maneuver.</p><p>As the ilClan era dawned and the political environment of the Inner Sphere shifted once more, the Gambit remained in steady production on Abadan. Adam Tech Industries continued to supply the Free Worlds League Military and independent buyers across the Inner Sphere, with the design's reputation for reliability and ease of maintenance ensuring continued demand well into the thirty-second century.</p>
