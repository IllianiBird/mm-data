chassis: "Mechanized Wheeled Platoon (Generic)"
model: "(Mortar 2200+)"
overview: |-
  <p>Mechanized wheeled platoons transport their infantry in wheeled armored personnel carriers optimized for speed on roads and improved surfaces. Wheeled APCs are cheaper to maintain and faster on pavement than tracked alternatives, making these platoons ideal for garrison rapid-response forces, highway patrol, and urban security operations. Their off-road capability is limited compared to tracked vehicles, restricting employment in rough terrain, but on developed worlds with good road networks, wheeled mechanized infantry offer the best balance of speed, protection, and operating cost.</p>><p>Mortar sections provide the platoon with organic indirect fire capability, lobbing explosive rounds over obstacles and into defilade positions that direct-fire weapons cannot reach. The  heavier mortars and their ammunition are easily moved around by the mechanized carriers.<p>
