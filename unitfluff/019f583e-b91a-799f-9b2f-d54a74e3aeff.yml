chassis: "Motorized Platoon (CCAF)"
model: "(Plasma 3063+)"
overview: |-
  <p>The CCAF fields conventional infantry in larger numbers than its limited industrial base might suggest, drawing on the Confederation's deep tradition of citizens' militia service. Capellan soldiers learn to fight with fewer resources and less support than their counterparts in wealthier states, compensating with resourcefulness and ideological commitment. Motorized platoons provide the CCAF with faster-moving infantry that can reposition between garrison posts or screen advancing forces along road networks. Their motorcycle and light vehicle transports sacrifice protection for speed, making them best suited to patrol and rapid-response roles. Plasma rifle sections carry one of the most advanced man-portable energy weapons available, delivering devastating thermal damage that can threaten light vehicles and battle armor at close range.</p>
