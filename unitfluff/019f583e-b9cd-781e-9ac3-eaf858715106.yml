chassis: "Field Gun Platoon (ComStar)"
model: "(Wheeled AC2)"
overview: |-
  <p>The Blessed Order maintained conventional infantry formations equipped with preserved Star League-era weapons and personal armor, fielding platoons that were better armed than most Successor State infantry throughout the late Succession Wars. Towing crew-served autocannon rated for light suppressive fire, these field gun crews deliver sustained ballistic firepower at ranges well beyond personal weapons, providing area denial capability against infantry and light vehicles.</p>
