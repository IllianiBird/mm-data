chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled LAC2 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing light autocannon that provide sustained long-range direct fire, these field gun crews deliver suppressive capability that pins enemy formations at distances beyond personal weapons range.</p>
