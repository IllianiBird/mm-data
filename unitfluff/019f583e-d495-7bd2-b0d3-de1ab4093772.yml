chassis: "Sphinx"
model: "3"
overview: |-
  <p>Clan Nova Cat developed the Sphinx in the closing years of the Jihad as a heavy cavalry design with extended endurance and minimal dependence on supply lines. Introduced in 3078, the seventy-five ton BattleMech was originally intended to serve as an OmniMech, but the pressing need to combat the Word of Blake forced Nova Cat technicians to rush the design into production as a conventional chassis. Envisioned as a heavier companion to the Black Hawk OmniMech, the Sphinx fills the role of a fast-strike heavy combatant with an all-energy weapons loadout.</p><p>The design's rushed development is evident in its appearance, with a blocky, unfinished look reminiscent of the venerable Highlander assault 'Mech. Despite its rough exterior, the Sphinx incorporates a simple and rugged chassis with low maintenance requirements, an unintended benefit of its OmniMech heritage that leaves many primary assemblies and components readily replaceable. Production has been constrained by engine supply shortages, as the powerplant remains in high demand for other Clan designs.</p>
capabilities: |-
  <p>The Sphinx is built around an impressive all-energy weapon battery designed for extended operations without ammunition dependency. A pair of arm-mounted Series 6b extended range large lasers provide effective striking power at long ranges, while ten Series 2f extended range medium lasers distributed across the side torsos deliver devastating firepower at closer distances. The Starfire 375 XL engine drives the seventy-five ton chassis to a respectable top speed of eighty-six kilometers per hour, allowing the Sphinx to close rapidly with opponents and bring its medium-range lasers to bear.</p><p>The design's principal weakness is its prodigious heat generation. Although the Sphinx mounts twenty-three double heat sinks, an inexperienced MechWarrior firing all weapons simultaneously can easily push the 'Mech into shutdown. Successful pilots learn to manage their weapons fire carefully, typically engaging with the large lasers at range before switching to the medium laser battery as they close. The Sphinx carries more than thirteen tons of Compound 12A2 armor, providing solid protection for a heavy 'Mech of its tonnage. The absence of jump jets limits tactical flexibility in rough terrain, but the design's speed partially compensates for this shortcoming.</p>
deployment: |-
  <p>Developed in 3091, this variant takes the opposite approach from the Sphinx 2. It removes the extended range large lasers entirely while retaining the original complement of ten extended range medium lasers. The addition of MASC and a targeting computer transforms the 'Mech into an aggressive close-range brawler, capable of rapidly closing to medium laser range and delivering precise, concentrated fire. An ECM suite disrupts enemy targeting and communications systems, providing an electronic warfare capability that enhances the variant's survivability during its approach.</p>
history: |-
  <p>The Sphinx traces its origins to 3078, when Clan Nova Cat's experience fighting the Word of Blake made clear the need for a heavy cavalry design that could operate independently for extended periods. The original design specifications called for an OmniMech, but the urgency of the Jihad forced Nova Cat engineers to abandon the modular pod configuration in favor of a fixed weapons layout that could be manufactured more quickly. Production began at the Avon Alpha facility on Avon, a Draconis Combine world jointly administered with the Nova Cats.</p><p>The Sphinx saw its first major deployments in the final years of the Jihad, where it quickly earned a reputation as a reliable and hard-hitting heavy 'Mech. In 3084, the 246th Battle Cluster dispatched its First Sword of Light to support operations against the Ghost Bear Dominion's Ninth Provisional Garrison Cluster on Mualang. The open terrain favored fast BattleMechs with superior ranged armament, and the Sphinx Star performed impressively against heavier Ghost Bear designs including the Kodiak, Arcas, and Grizzly. Though the battle was ultimately decided by the collapse of the Bears' logistical support rather than direct combat, the engagement demonstrated the Sphinx's ability to hold its own against larger opponents.</p><p>Production of the Sphinx has been maintained through a cooperative arrangement with Clan Sea Fox, who provide technical and material assistance in exchange for sales rights to a proportion of the output. This arrangement has helped offset the chronic shortages of the Starfire 375 XL engine that have plagued the design since its introduction. The Sphinx is also well suited to the Clan tradition of single combat and dueling, and has become a popular choice among ristars competing in Trials of Bloodright, where its combination of speed, firepower, and durability makes it an excellent one-on-one platform.</p><p>Following the annihilation of Clan Nova Cat in 3141, full control of the Avon production facility reverted to the Draconis Combine, which has continued manufacturing the Sphinx and its variants to serve in DCMS line formations. Later variants introduced during the Dark Age era, including the Sphinx 3 and Sphinx 4, reflect a shift toward specialized close-range configurations that leverage the chassis's speed and rugged construction for aggressive assault tactics.</p>
