chassis: "Phoenix Hawk IIC"
model: "3"
overview: |-
  <p>The Phoenix Hawk IIC represents the culmination of the Star League's long-standing interest in an assault BattleMech suited for Striker regiment operations, strengthening and hardening the quintessential scout and raider, the Phoenix Hawk, into an eighty-ton platform. The Star League never saw the dream fulfilled; it fell to Clan Steel Viper to complete the concept during the Clan Homeworld era.</p><p>Though its original creators are no longer present to receive recognition, the Phoenix Hawk IIC has become a remarkably successful commercial venture. Clan Diamond Shark recognized the design's market potential early, securing production rights that eventually passed to Trellshire Heavy Industries on Twycross. Steady shipments to other Clans and Inner Sphere customers transformed the Phoenix Hawk IIC into a bestseller, serving as a springboard for many other successful ventures in the cross-cultural BattleMech trade.</p>
capabilities: |-
  <p>Built around the largest conventional fusion engine available (the massive Type 70 400 XL) the Phoenix Hawk IIC achieves remarkable speed for an assault BattleMech, reaching 86 kilometers per hour at full stride. Grandthrust Mk. 5 jump jets provide 150 meters of surprising maneuverability for a chassis of this mass, enabling tactical repositioning that most assault 'Mechs cannot match. Forging AM15 ferro-fibrous armor with CASE provides solid protection without sacrificing the mobility that defines the design.</p><p>The baseline configuration mounts a pair of Type DL Ultra-10 autocannons as primary armament, supported by twin Series V machine guns. This loadout proved well-suited to the Steel Vipers' preferred dueling role, delivering devastating volleys at medium range. Other Clans have employed the chassis in its intended heavy cavalry role (chasing down fleeing enemies and eliminating stragglers) while some commanders use it as a headhunter against enemy command assets. Inner Sphere MechWarriors have adapted the design as mobile fire support for heavy lances, where its long-range firepower can be quickly repositioned to exploit breakthroughs.</p><p>The primary limitation remains ammunition dependency in the base configuration, a concern that has driven the development of numerous energy-focused and hybrid variants across multiple Clan production lines.</p>
deployment: |-
  <p>Manufactured by Clan Diamond Shark specifically for Clan Steel Viper's depleted formations, the Phoenix Hawk IIC 3 mounts twin heavy large lasers, twin small pulse lasers, and a medium pulse laser, all integrated through a sophisticated targeting computer. The all-energy loadout eliminates ammunition dependency, though twenty-two double heat sinks barely manage the thermal output of a full laser salvo. Many IIC 3 units were deployed to bolster the understrength Delta Galaxy during periods of intense inter-Clan competition.</p>
history: |-
  <p>The Phoenix Hawk IIC traces its lineage to unrealized Star League concepts for assault-weight reconnaissance platforms. Clan Steel Viper completed the design during the Homeworld era, fielding it as a versatile assault chassis capable of fulfilling roles from dueling to heavy cavalry. The Steel Vipers employed the IIC extensively, using its speed and jump capability to overwhelm opponents in Trials of Possession and garrison operations across the Clan Homeworlds.</p><p>The Battle of Tukayyid in 3052 marked one of the earliest Inner Sphere sightings of the Phoenix Hawk IIC. When Alpha and Beta Galaxies were repulsed by the Com Guards, Khan Zalman committed Zeta Galaxy to cover the Steel Viper retreat. A Star of Phoenix Hawk IICs smashed through pursuing Com Guard elements in a brief but violent assault. Though the IICs quickly exhausted their ammunition, the assault provided critical breathing room for the withdrawal and taught the Com Guards to exercise greater caution in pursuit.</p><p>Clan Diamond Shark secured production rights and established manufacturing at Trellshire Heavy Industries on Twycross, transforming the design into one of the most commercially successful Clan exports. The IIC's combat capabilities were demonstrated during pirate raids on Thule and Damian, where raiders dropped from orbit, struck targets, and dashed to extraction points before defenders could mass. Even when hits landed, the IIC's combination of speed and armor rendered them seemingly invulnerable to the garrison forces available.</p><p>In the ilClan era, the Phoenix Hawk IIC continues to see widespread adoption across both Clan and Inner Sphere militaries. Clan Sea Fox merchants have leveraged the platform into a thriving export market, with specialized variants tailored to customer requirements. The appearance of the hatchet-armed IIC 10 among pirates attacking the Rasalhague Dominion created unexpected demand (particularly from House Kurita) demonstrating the design's continued evolution and commercial viability centuries after its initial creation.</p>
