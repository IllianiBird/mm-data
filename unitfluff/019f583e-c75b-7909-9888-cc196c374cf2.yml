chassis: "Berserker"
model: "BRZ-C3"
overview: |-
  <p>The Berserker emerged from Defiance Industries' Hesperus II facility in 3056 as one of the most ambitious and expensive assault 'Mech designs ever produced. Conceived as a hundred-ton close-range brawler capable of devastating opponents at arm's reach, the design nearly perished on the drawing board due to massive cost overruns during its protracted research and development phase. Defiance Industries spared no expense in creating a state-of-the-art juggernaut that prioritized both engineering excellence and psychological intimidation, drawing inspiration from the classic Atlas in its approach to battlefield presence. With a price tag exceeding thirty-two million C-bills, the Berserker stands among the most expensive BattleMechs in production, a fact that has done little to diminish its popularity among those who can afford it.</p>
capabilities: |-
  <p>The Berserker's defining characteristic is its extraordinary speed for an assault 'Mech. The massive LTV 400 XL engine propels the hundred-ton chassis to speeds exceeding sixty-five kilometers per hour, while a sophisticated MASC system pushes that figure to an astonishing eighty-six kilometers per hour in short bursts. This combination makes the Berserker the fastest 'Mech in its weight class, allowing it to close with targets that would normally outrun an assault platform. The design's signature seven-ton hatchet and head-mounted Zippo flamer make it a terrifying presence on the battlefield, with few opponents able to forget the sight of a hundred tons of 'Mech belching flame while swinging a massive axe.</p><p>At range, the Berserker employs a Defiance 1001 extended-range PPC for long-distance engagement while closing the gap, supplemented by two Sutel Precision Line large pulse lasers that more than double its firepower at medium range. Eighteen and a half tons of Durallex Heavy Special armor provide substantial protection, augmented by a Guardian ECM suite and a MainFire Point Defense anti-missile system that offer electronic and point-defense countermeasures. Sixteen double heat sinks manage the considerable thermal load generated by the energy-heavy weapons array, though sustained fire at close range demands careful heat management from the MechWarrior.</p>
deployment: |-
  <p>Introduced during the FedCom Civil War era as a cost-conscious alternative, this variant addresses the A3's exorbitant price tag by replacing the 400-rated XL engine with a lighter LTV 400 light fusion engine, saving approximately six million C-bills. The MASC system is removed in favor of triple strength myomers, which provide comparable speed when operating at optimal heat levels while dramatically increasing the hatchet's destructive potential. The two large pulse lasers give way to six extended-range medium lasers, and one double heat sink is sacrificed to accommodate a C3 slave unit, integrating the Berserker into modern networked combat formations. When properly linked to a C3 lance, the C3 variant's enhanced targeting data and devastating melee capability make it an even more lethal close-combat platform than the original.</p>
history: |-
  <p>Plagued by design problems and massive budget overruns throughout its development, the Berserker finally entered full-scale production in 3056. With all of Defiance Industries' considerable marketing muscle behind it, the design became an instant commercial success despite its staggering cost. The Lyran military, with its long-standing affection for assault 'Mechs, proved the natural primary market, with Defiance executives correctly anticipating that the awe-inspiring prospect of a fast hundred-ton 'Mech would outweigh concerns about the price, equal to three AS7-S Atlases.</p><p>The Free Rasalhague Republic's KungsArmé became an early and enthusiastic adopter, drawn by the nation's traditional preference for hatchet-armed 'Mechs. Several Berserkers were purchased for service alongside the Axman and Hatchetman in front-line regiments, where the design's combination of speed and devastating melee capability proved well-suited to Rasalhague combat doctrine. The Berserker also found a devoted following in the Solaris VII arena circuit, where its dramatic appearance and close-combat prowess made it an unforgettable crowd-pleaser, with several major stables acquiring the design for their rosters.</p><p>The turmoil of the FedCom Civil War and its aftermath drove continued development at Defiance Industries. Faced with the Lyran military's need for rapid rebuilding and force modernization, Defiance responded with new variants that addressed the Berserker's exorbitant cost while incorporating emerging technologies such as triple strength myomers and C3 networking. Production has continued at Hesperus II through successive eras, with Defiance introducing progressively more advanced variants incorporating Clan-specification technology and innovative new armor systems, ensuring the Berserker remains a relevant and feared presence on battlefields well into the thirty-second century.</p>
