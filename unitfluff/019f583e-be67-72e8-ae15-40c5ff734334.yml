chassis: "Foot Contubernium (MHAF)"
model: "(Rifle)"
overview: |-
  <p>Caesar's ongoing program to modernize the Legiones Marianes has extended to conventional infantry formations, with improved equipment and weapons gradually replacing older stockpiles across the Hegemony's auxiliary legions. A contubernium is the smallest tactical unit in the Marian system, equivalent to a single reinforced squad of ten soldiers. Foot contubernia serve as sentries, checkpoint garrisons, and building-clearing teams in urban operations where larger formations cannot maneuver effectively. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon available, these formations deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
