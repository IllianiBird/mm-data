chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled LBX20 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing assault-class LB-X autocannon that can fire cluster rounds capable of shredding infantry in the open, these field gun crews deliver the heaviest area-effect direct fire available to ground forces.</p>
