chassis: "Jackal"
model: "JA-KL-55"
overview: |-
  <p>The Jackal is a thirty-ton light BattleMech introduced in 3052, designed by the Solaris VII-based Vining Engineering and Salvage Team and manufactured in quantity by Earthwerks BattleMechs at their Keystone facility in the Free Worlds League. Drawing on first-hand research of Clan engagements during the initial invasion, VEST set out to create an Inner Sphere light 'Mech capable of matching Clan designs of comparable tonnage on the battlefield.</p><p>The Jackal saw widespread service with Capellan and Free Worlds League forces as well as numerous mercenary commands throughout the Clan Invasion and Civil War eras. One of many casualties of the Word of Blake Jihad, all Jackal production ceased in 3079, leaving surviving chassis scattered among garrison and mercenary units across the Inner Sphere.</p>
capabilities: |-
  <p>The Jackal was built on a weight-saving Hollis Mark VI-Alpha endo steel chassis and powered by a GM 210 XL engine, enabling a top speed of nearly 120 kilometers per hour. This lightweight construction freed tonnage for armament and protection impressive for a thirty-ton design. Six tons of York Industries CTC-0 armor provide solid coverage for the weight class, though the lack of CASE remains a persistent vulnerability should ammunition storage be breached.</p><p>The Jackal's primary weapon is an Aberdovey Mark XXX extended-range particle cannon, giving the light 'Mech reach comparable to most Clan weaponry at just under 700 meters. A Holly Streak SRM-2 launcher provides efficient close-range backup, firing only when a solid target lock is achieved, while a head-mounted Burrow anti-missile system offers limited defense against incoming missiles. This combination of speed, firepower, and point defense enables the Jackal to operate as a highly mobile long-range sniper, engaging targets at distance while minimizing exposure to return fire.</p><p>The reliance on single heat sinks remains the design's most notable shortcoming, limiting sustained fire from the energy-hungry particle cannon and forcing pilots to carefully manage their rate of engagement.</p>
deployment: |-
  <p>Introduced around 3066, this variant refines the Jackal's role as a dedicated long-range sniper. The modification removes the Burrow anti-missile system and its ammunition in favor of an advanced targeting computer, dramatically improving accuracy at extended ranges and making the ER PPC even more lethal. The long-requested switch from standard to double heat sinks enhances the design's ability to sustain fire from its particle cannon, while the freed tonnage allowed engineers to add armor protection to the arms and legs. Produced exclusively at VEST's Solaris VII facility, this variant saw limited but enthusiastic adoption among arena combatants and specialist units favoring precision engagement over point defense.</p>
history: |-
  <p>The Jackal's story begins on Solaris VII, where VEST leveraged first-hand observations of Clan technology gathered during the initial invasion to design a light 'Mech capable of competing with Clan designs pound for pound. The prototype's successful demonstration in the Solaris arenas in 3052 caught the attention of Earthwerks Incorporated, who struck a deal with VEST for production rights at their Keystone plant in the Free Worlds League. Under the agreement, VEST retained limited production capacity on Solaris VII to supply arena stables and select buyers, while Earthwerks handled volume manufacturing for military customers.</p><p>The Jackal quickly found favor with the Capellan Confederation and Free Worlds League armed forces, as well as dozens of mercenary commands throughout the Inner Sphere. The design's combination of speed and long-range firepower made it particularly effective in the skirmishing and raiding operations that characterized the post-invasion era. During Operation Bulldog and the subsequent invasion of Huntress in 3060, the Jackal proved capable in direct engagements against Clan Smoke Jaguar forces, with pilots reporting success even against the then-novel ProtoMechs that accompanied Jaguar defensive formations.</p><p>The FedCom Civil War saw continued production at both facilities, but the Jihad proved devastating for the entire Jackal program. VEST's Solaris VII operations were heavily damaged during the fighting that engulfed the Game World, and while limited production resumed around 3074, the destruction of the planet's HPG severed communications between VEST and Earthwerks. By the late Jihad, Earthwerks was emphasizing its own engineering contributions to the Jackal program with no mention of VEST, and the partnership effectively dissolved.</p><p>The subsequent cessation of all Jackal production in 3079 left the remaining chassis scattered among mercenary and garrison units, maintained by field technicians but no longer supported by any manufacturer. Earthwerks' brief attempt to develop upgraded refit kits for the design came too late to save the program, and the Jackal joined the growing list of Jihad-era production casualties.</p>
