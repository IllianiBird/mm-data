chassis: "Omega"
model: "SHP-4X"
overview: |-
  <p>The Omega is the first truly viable superheavy BattleMech ever produced, introduced in 3076 by Skobel MechWorks on Terra under Word of Blake direction. Weighing an unprecedented 150 tons, the Omega represents the culmination of centuries of failed attempts at superheavy construction, from the Terran Hegemony's early experiments through the infamous Matar. Standing half again as tall as the hundred-ton King Crab, the design proved that the superheavy concept could succeed where all previous efforts had failed. Close to thirty were manufactured before the fall of the Word of Blake, earning a fearsome reputation during their brief operational service in the final battles of the Jihad on Terra.</p>
capabilities: |-
  <p>Powered by a Vlar 300 XL engine, the Omega achieves a maximum speed of just 32 kph, making it among the slowest 'Mechs to walk any battlefield. This deliberate sacrifice of mobility allows the design to carry twenty-seven tons of Aldis Plate armor reinforced with CASE II protection across the arms and torso sections, creating an extraordinarily resilient platform capable of absorbing tremendous punishment. The superheavy construction demanded a Heavy-Duty Gyro to manage the immense stresses placed on the chassis, adding weight but significantly improving the design's ability to remain standing under concentrated fire.</p><p>The Omega's primary armament consists of three M-7 Gauss Rifles distributed across the left torso, center torso, and right torso, a configuration made possible by the superheavy construction that allowed mounting a standard Inner Sphere Gauss Rifle with ammunition and CASE II in the center torso for the first time. Two Imperator Code Red LB 10-X Autocannons mounted in the arms provide flexible firepower through cluster or solid-shot ammunition selection. This weapons mix creates a devastating defensive emplacement and even a serviceable low-altitude anti-air platform.</p><p>Each Omega integrates an Improved C3 Computer into its communications suite, enabling the massive 'Mech to share targeting data across a network. Despite this technological sophistication, the Omega remains cumbersome and difficult to pilot, with the superheavy mass imposing severe limitations on tactical maneuverability.</p>
deployment: |-
  <p>This variant represents the original Omega superheavy prototype manufactured by Skobel MechWorks for the Word of Blake. Close to thirty of these machines were produced beginning in 3076, though the design never advanced beyond its prototype classification. The majority were deployed in defense of Terra during Operation SCOUR, concentrated around the Devils Peak command post and sighted at Hilton Head Island and in Cairo. Fighting alongside the Blakists' other unconventional assets during the fierce multi-front resistance of the Jihad's final days, all engaged SHP-4X units were publicly believed destroyed. At least one functional original survived on Solaris VII, however, maintained by the administrators of the Ishiyama arena and occasionally deployed as a special hazard during assault 'Mech bouts.</p>
history: |-
  <p>The quest to build a BattleMech exceeding one hundred tons stretches back to the late twenty-eighth century, when Terran Hegemony engineers first attempted superheavy construction. These early efforts met with repeated failure, and the concept was widely derided after Stefan Amaris commissioned the Matar during the Amaris Civil War. The Matar's engineering shortcomings earned it the lasting nickname "Amaris' Folly," though its underlying chassis and musculature research eventually found use in the Clans' Stone Rhino design. Despite these partial successes, no faction managed to produce a fully functional superheavy BattleMech until the Word of Blake turned its considerable resources toward the problem.</p><p>Working from Skobel MechWorks' facilities in Russia on Terra, Blakist engineers developed revolutionary solutions to the structural and mobility challenges that had defeated all previous designers. Their innovations in enhanced hybrid myomer fibers, oversized actuators, and a purpose-built superheavy endo-steel skeleton produced a chassis capable of supporting 150 tons of combat equipment. Close to thirty Omegas were manufactured beginning in 3076, though the design remained technically in its prototype phase throughout its operational life.</p><p>The majority of these machines were deployed in defense of Terra during Operation SCOUR, concentrated around the Devils Peak command post where Precentor Martial Cameron St. Jamais directed the Word of Blake's final resistance. Additional Omegas were sighted at Hilton Head Island and in Cairo. Combined with the Blakists' other unconventional assets (including drone 'Mechs, mobile defense platforms, and Land-Air 'Mechs) the Omegas contributed to fierce multi-front resistance during the last days of the Jihad. All engaged Omegas were publicly believed destroyed, and the superheavy manufacturing wing at Skobel was demolished during the liberation of Terra.</p><p>Unfinished Omega hulls however survived within the Skobel complex. Following the establishment of the Republic of the Sphere, rebuilding Skobel MechWorks was given high priority, and Republic engineers used these surviving hulls as the foundation for their superheavy research program. Several SHP-5R models were completed with modifications necessitated by the loss of certain Blakist manufacturing techniques. At least one functional original Omega also survived on Solaris VII, where it was maintained by the administrators of the Ishiyama arena and occasionally deployed as a special hazard during assault 'Mech bouts. The hard-won lessons from the Omega program (along with those from the subsequent and less successful Orca prototype) ultimately contributed to the Republic's development of colossal tripod designs such as the Poseidon and Ares.</p>
