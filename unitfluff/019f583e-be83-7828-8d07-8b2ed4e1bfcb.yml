chassis: "Foot Triplus Contubernium (MHAF)"
model: "(MG)"
overview: |-
  <p>Infantry within the Legiones Marianes form the backbone of planetary garrison and territorial defense, freeing the Hegemony's limited BattleMech assets for offensive operations and prestige assignments. A triplus contubernium, or triple tent-group, combines three squads of ten into the Marian equivalent of a standard Inner Sphere platoon. Foot triplus contubernia form the primary garrison infantry of the Hegemony, holding defensive lines and providing the manpower that auxiliary legions depend on for territorial control. Support squads operate portable machine guns that deliver sustained automatic fire, providing suppression capability against enemy infantry and light vehicles.</p>
