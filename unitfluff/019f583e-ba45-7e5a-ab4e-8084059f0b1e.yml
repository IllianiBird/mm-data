chassis: "Jump Level I (WOBM)"
model: "(SRM)"
overview: |-
  <p>Drawing veterans from the Com Guards, recruits from the Free Worlds League, and volunteers from Protectorate worlds, the Word of Blake Militia assembled infantry formations whose quality varied but whose equipment was consistently first-rate. Jump infantry Level I formations gave Militia commanders a vertical mobility option for operations in dense urban environments, where the ability to bypass barricades and reach elevated positions provided tactical flexibility against insurgent forces resisting Protectorate authority. Equipped with infantry-portable short-range missile launchers that provide anti-armor capability beyond what personal weapons can achieve, these troops can threaten light vehicles and battle armor at close range.</p>
