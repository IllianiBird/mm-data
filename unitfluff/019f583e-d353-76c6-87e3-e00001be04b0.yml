chassis: "Rokurokubi"
model: "RK-4X"
overview: |-
  <p>The Rokurokubi is a 35-ton light BattleMech introduced in 3135 by Luthien Armor Works for the Draconis Combine Mustered Soldiery. Named after a creature from Japanese mythology, the design was conceived as a fast light striker tailored to the bushido-inspired warrior culture of the Combine's young samurai class. Drawing aesthetic inspiration from ancient Japanese armor, the Rokurokubi was designed to close rapidly with enemy units, softening targets with ranged fire before delivering devastating melee strikes.</p><p>The design evokes the spirit of the iconic Panther, which instilled fear in the DCMS's enemies for centuries. Since its introduction following the Blackout, the Rokurokubi has become one of the most sought-after light chassis assignments in the DCMS, earning a reputation as a prestige posting for ambitious young MechWarriors.</p>
capabilities: |-
  <p>The Rokurokubi was designed from the ground up as an offensive platform tailored to the close-combat preferences of Combine MechWarriors. Built on a Luthien Class 41 endo steel frame, the 'Mech mounts a Magna 245 XL engine that propels it to a top speed of 108 kilometers per hour, fast enough to close with most targets before they can effectively disengage. The design's most distinctive feature is its 13.5 tons of New Samarkand Teppeki hardened armor, an unusual choice for a light 'Mech that sacrifices approximately ten kilometers per hour of speed in exchange for exceptional resistance to ballistic damage. This heavy protection allows the Rokurokubi to weather incoming fire during its approach, though pilots must remain aware that the XL engine and gyro leave the 'Mech vulnerable to concentrated torso hits.</p><p>The 'Mech's ranged armament consists of a single SarLon MiniCannon light autocannon mounted in the left arm, fed by dual ammunition bins that allow pilots to switch between different munition types as the tactical situation demands. Once within striking distance, the MechWarrior brings the Rokurokubi's four-meter katana-style sword to bear, a devastating melee weapon that has become the design's signature. The lack of an ejection mechanism highlights the samurai ethos built into the chassis.</p>
deployment: |-
  <p>A rarer and more powerful variant produced exclusively at Luthien Armor Works' facilities on Luthien, this variant stands as a significant departure from the base design. The hardened armor is replaced with ballistic-reinforced plating, and the standard sword gives way to a compact vibroblade. Most particularly, the ranged weapon is upgraded to a Clan-specification extended-range PPC, dramatically increasing firepower. A supercharger fitted to the already-potent XL engine grants brief bursts of additional speed, allowing this variant to close with targets even more rapidly. These enhancements make it a prized assignment among elite Combine MechWarriors.</p>
history: |-
  <p>The Rokurokubi entered service with the Draconis Combine Mustered Soldiery in 3135, appearing only after the HPG Blackout had isolated much of the Inner Sphere. Luthien Armor Works developed the design specifically to appeal to the rising generation of Kurita MechWarriors, many of whom embraced an aggressive, honor-driven warrior culture inspired by the Combine's samurai traditions. The 'Mech quickly became a status symbol among young officers eager to prove themselves in single combat, with aspiring pilots dueling for the honor of earning a Rokurokubi assignment.</p><p>The Rokurokubi saw its first major large-scale deployment during the Combine's invasion of the Republic of the Sphere, where its speed and melee capability proved well-suited to the chaotic urban and close-quarters engagements that characterized the campaign. Elements of the Sword of Light were among the earliest and most enthusiastic adopters of the design, incorporating lances of Rokurokubis into their assault formations as fast-striking screens and pursuit units.</p><p>As the Combine turned its attention to the Federated Suns in the 3140s, the Rokurokubi featured prominently in the invasion force. During the invasion of Gambier, elements of the Fifth Sword of Light used Rokurokubis to shatter the planetary militia in less than an hour of combat. The design proved equally effective during the assault on Robinson, where a lance of four RK-4X models formed the vanguard of an assault that disabled multiple Davion 'Mechs and armored vehicles in approximately two minutes of close combat, leveraging the variant's formidable firepower and melee capability to devastating effect.</p><p>Production has remained steady at Luthien Armor Works facilities on both Luthien and Kaznejoy, with the Combine's ongoing military campaigns ensuring consistent demand. The Rokurokubi's reputation as a prestige assignment continues to drive competition among young MechWarriors, and its effectiveness in the Combine's recent offensive operations has validated the design philosophy of combining modern technology with the warrior traditions of House Kurita.</p>
