chassis: "Liberty JumpShip"
overview: |-
  <p>The Liberty is perhaps the most significant vessel in naval history, serving as the prototype for the "modern" JumpShip. Developed by Blue Nose Interstellar Technologies, it moved away from the "hollowed-out cylinder" designs of the early 25th century, which carried ships internally. Instead, the Liberty introduced the needle-like hull and external docking collars we recognize today. This breakthrough made interstellar travel significantly cheaper, more resilient, and easier to maintain.</p>
capabilities: |-
  <p>The K-F Boom: The Liberty's primary innovation was the ability to extend its Kearny-Fuchida jump field to encompass externally docked vessels. This allowed the ship to be built with a thin, efficient hull rather than a massive, fragile internal bay. Docking Infrastructure: Blue Nose became the industry standard for the docking collars and K-F booms required for this new era of transport, licensing the technology to eighteen other manufacturers. Redesigned Habitation: While the original model had a grav deck that was too small for its 70-person crew, subsequent redesigns added essential long-term travel amenities that are now industry standards, such as expanded quarters and small hydroponic gardens. Automation: Throughout its hundred-year production run, advancements in technology allowed for a significant reduction in the required crew size and an increase in the quality of living spaces.</p>
history: |-
  <p>Before the Liberty, jump physics were limited; researchers could not figure out how to extend a jump field beyond a ship's hull. In 2458, the BNS Olympus successfully jumped with an externally coupled DropShip, proving the theory of the K-F boom. Following this success, the first twelve Liberty-class ships debuted in 2469. They were an overnight sensation, selling out ten years of production in a single month. The success of the Liberty allowed Blue Nose to expand into "Blue Nose Clipperships," becoming the exclusive supplier for the Terran Hegemony. The design remained in production for nearly a century, with the final vessel delivered in 2550. Over its life cycle, it underwent over two dozen major upgrades, eventually becoming the template for all subsequent JumpShip classes.</p>
manufacturer: "Blue Nose Interstellar Technologies"
