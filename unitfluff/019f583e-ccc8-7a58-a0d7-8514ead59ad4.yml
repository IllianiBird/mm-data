chassis: "Viking"
model: "VKG-3A"
overview: |-
  <p>The Viking is a 90-ton assault BattleMech introduced in 3059 as a joint development between ComStar and the Free Rasalhague Republic. Intended to replace the aging Bombardier in the fire support role, the design emerged from Grumium Creations, a small manufacturer on the Republic world of Grumium that ComStar had helped transform into a capable production facility. The Viking represented the second 'Mech co-produced by the two powers, following closely on the heels of the successful Beowulf program.</p><p>Built around massive long-range missile batteries guided by advanced fire control systems, the Viking was designed to deliver overwhelming firepower at range. Though its lack of an extralight engine limits its speed, the design's heavy armor and dual CASE ammunition protection give it exceptional staying power on the battlefield. The Viking has seen widespread service, transitioning through several political upheavals alongside its home world of Grumium.</p>
capabilities: |-
  <p>The Viking's primary mission is long-range missile fire support, and its designers built the entire 'Mech around that concept. Four Shigunga missile launchers, a pair of LRM-20s and a pair of LRM-15s, give the design an impressive volume of fire at range. Each launcher is linked to an Artemis IV fire control system for improved accuracy, allowing Viking formations to deliver concentrated and precise missile volleys against hardened targets.</p><p>The GC Type 1 Endo Steel chassis saves critical weight while supporting fifteen and a half tons of GC Slab armor, providing excellent protection for an assault 'Mech. Dual CASE systems guard against catastrophic ammunition detonations, a critical feature given the large stores of missile ordnance the design carries. For close defense, two ChisComp 32 small lasers and four SperryBrowning machine guns provide a modest but sufficient deterrent against infantry and light 'Mechs that breach the missile envelope.</p><p>The GM 270 engine limits the Viking to a top speed of 54 kilometers per hour, a modest pace for a design of its weight, but adequate for a rear-echelon fire support platform that need not close with the enemy. Ten double heat sinks manage the design's moderate thermal output with ease.</p>
deployment: |-
  <p>Developed during the Jihad as a ComGuard refit, this variant transforms the Viking into an artillery platform. An Arrow IV launcher replaces the right-arm missile systems, providing indirect fire capability at extreme range, while the left-side launchers give way to a pair of MML-7 racks with Artemis IV guidance for flexible direct fire. A compact fusion engine replaces the standard powerplant, offering better survivability against center torso penetrations at the cost of additional weight. Four medium pulse lasers and a small pulse laser provide close defense. The refit was performed at the Arcturan Arms facility on Arcturus, continuing into the early Republic era.</p>
history: |-
  <p>The Viking's origins trace to the late 3050s, when ComStar invested heavily in the Free Rasalhague Republic's military manufacturing infrastructure. Grumium Creations, a small parts and systems company on the Republic world of Grumium, was transformed through ComStar financing into a full-scale BattleMech production facility. The Viking was the second design to roll off the upgraded assembly lines, following the lighter Beowulf. ComStar officials had specifically requested a new fire support platform to replace the aging Bombardier, and Grumium obliged by building the Viking around readily available Draconis Combine-sourced Shigunga missile launchers.</p><p>Initial production was split between the Com Guards and the KungsArmé, with the Viking appearing in formations such as the 403rd Division and the Third Hussars. The design proved effective in its intended role, capable of delivering punishing volleys of missiles at range while its heavy armor allowed it to absorb return fire that would cripple lighter fire support platforms.</p><p>The Jihad brought significant upheaval to the Viking's production history. Grumium fell under Clan Ghost Bear control as the Bears absorbed the remnants of the Free Rasalhague Republic, and the factory continued production under new management. Meanwhile, the Word of Blake captured stockpiles of ComGuard Vikings and refitted them at facilities on Hall, producing the C3i-equipped VKG-3W variant. Loyalist ComGuard forces responded with their own refit program, producing the artillery-focused VKG-3A at the Arcturan Arms facility on Arcturus.</p><p>With the formation of the Rasalhague Dominion, the Grumium factory entered a period of declining activity. While the base VKG-2F and assault-oriented VKG-2G continued to see service in Dominion and garrison forces, production at the facility eventually wound down. The Viking nonetheless remains a recognizable fire support platform, with examples serving across multiple successor states and Clan territories well into the thirty-second century.</p>
