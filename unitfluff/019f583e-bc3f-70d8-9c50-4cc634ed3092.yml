chassis: "Field Artillery Platoon (FWLM)"
model: "(Motorized Thumper Cannon 3079+)"
overview: |-
  <p>New technology and creative tactical thinking have long featured in FWLM infantry deployment, with varied unit types and specialized formations treated as the norm rather than the exception. Deploying Thumper cannon, a direct-fire variant of the standard Thumper artillery piece, these platoons sacrifice the indirect fire arc for improved accuracy against visible targets, filling a niche between heavy field guns and true artillery.</p>
