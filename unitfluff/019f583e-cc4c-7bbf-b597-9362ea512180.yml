chassis: "Men Shen"
model: "MS1-OB"
overview: |-
  <p>The Men Shen holds the distinction of being the first OmniMech produced entirely within the Capellan Confederation, introduced in 3060 by Hellespont Industrials on Sian. As Inner Sphere OmniMechs rapidly proliferated following the Clan Invasion, the Confederation found itself largely shut out of domestic OmniMech production, relying on exported examples from Free Worlds League manufacturers. Hellespont, which also produced the successful Raven electronic warfare 'Mech, acquired the necessary OmniPod technology through trade agreements with Kali Yama Weapons Industries. Drawing heavily on the Raven as its design basis, the resulting fifty-five-ton OmniMech was named by Chancellor Sun-Tzu Liao himself at its unveiling, comparing it to the <i>men shen</i>, the divine guardian spirits of doors and gates in Chinese folk religion.</p><p>Considered a prestige design, the initial production run went exclusively to elite CCAF formations, with a lance delivered to each of the Capellan Warrior Houses and the remainder reaching the Death Commandos. Subsequent production expanded to border defense units, fulfilling the design's intended role as a guardian of Capellan territory.</p>
capabilities: |-
  <p>The Men Shen is built on a lightweight endo steel chassis powered by a 330-rated XL engine, giving the fifty-five-ton design a top speed exceeding ninety-seven kilometers per hour. A MASC system pushes this to nearly one hundred thirty kilometers per hour in short bursts, making it one of the fastest medium OmniMechs fielded by any Inner Sphere power. Eleven tons of standard armor provide respectable protection for its weight class, though the extralight engine leaves the design vulnerable to flanking attacks that breach either side torso.</p><p>A fixed Beagle Active Probe on the base chassis ensures the Men Shen excels in reconnaissance regardless of its pod configuration, a direct inheritance from its Raven lineage. With seventeen tons of available pod space, the chassis supports a wide range of mission profiles from long-range sniping to close-quarters brawling. In its Primary configuration, four medium pulse lasers deliver devastating close-range firepower with enhanced accuracy, complemented by an Artemis IV-guided LRM-15 for both direct and indirect fire support. Several Free Worlds League weapon systems appear across various configurations, reflecting the trade relationships that made the design possible, while the newer Capellan-made LB-X Type 2 autocannon debuted on this platform.</p>
deployment: |-
  <p>Alternate Configuration B serves as a long-range sniper, mounting a pair of LB 2-X autocannons that can fire both standard and cluster rounds. The dual autocannons also provide effective anti-aircraft capability, a role few medium OmniMechs can fill. Four extended-range medium lasers offer substantial close-range defensive firepower should faster opponents close the distance. The new Capellan-manufactured LB-X Type 2 autocannon debuted on this configuration, marking an important step in domestic weapons production for the Confederation.</p>
history: |-
  <p>The Men Shen emerged from the Capellan Confederation's determined effort to achieve parity with other Inner Sphere powers in OmniMech production during the late 3050s. While Ceres Metals Industries had manufactured the OmniMech Blackjack under license from Luthien Armor Works, only the St. Ives Compact branch possessed this capability, with production flowing to the St. Ives Military Command and the Armed Forces of the Federated Commonwealth rather than the CCAF. Reduced to fielding exported examples from Irian BattleMechs Unlimited, the Confederation's Strategios placed high priority on developing indigenous OmniMech production.</p><p>Hellespont Industrials, already one of the most advanced BattleMech manufacturers in the Capellan state thanks to its work on the Raven, secured trade agreements with Kali Yama Weapons Industries that provided access to OmniPod technology. The Men Shen entered service in 3060 as a symbol of Capellan technological resurgence under Chancellor Sun-Tzu Liao's Xin Sheng movement, and its initial deployment to Warrior Houses and the Death Commandos reinforced its prestige status.</p><p>The design truly proved its worth during the retaliatory invasion of the Federated Suns' Capellan March following George Hasek's abortive Operation Sovereign Justice. With supply lines in chaos, the Men Shen's OmniMech flexibility meant it was rarely out of service, and the fighting spawned two new configurations. The E configuration emerged as a devastating city-fighter, decimating AFFS infantry teams on Relevow and Taygeta with massed light machine guns and a plasma rifle. The F configuration proved equally effective as a hunter-killer, pairing dual snub-nose PPCs with a targeting computer for precision strikes against heavier opponents.</p><p>The Jihad inflicted significant damage on the Hellespont plant on Sian, reducing operating capacity to roughly eighty-two percent, though the facility survived intact, a fortunate outcome compared to many Inner Sphere industrial sites. Production continued through the Dark Age and into the ilClan era, with newer configurations incorporating advanced technologies such as the TSEMP cannon and underwater maneuvering units, ensuring the Men Shen remains a relevant and flexible asset in the CCAF's arsenal.</p>
