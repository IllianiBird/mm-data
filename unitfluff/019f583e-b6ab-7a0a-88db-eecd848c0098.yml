chassis: "Field Gun Platoon (AFFS)"
model: "(Motorized LBX5 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing LB-X autocannon that can switch between solid slugs and cluster rounds, these field gun crews adapt their fire to engage both armored point targets and dispersed infantry formations.</p>
