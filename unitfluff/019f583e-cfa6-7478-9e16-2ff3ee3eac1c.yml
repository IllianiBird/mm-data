chassis: "Goshawk II"
model: "2"
overview: |-
  <p>The Goshawk II is a forty-five-ton Clan medium BattleMech developed by Clan Snow Raven in the mid-3080s, drawing inspiration from the heavier Vapor Eagle that the Ravens had long operated. Produced at Snow Raven Industrial Complex Alpha on the Inner Sphere world of Dante, the Goshawk II was designed specifically as a second-line combat platform for exclusive use by Raven Alliance forces. Ten tons lighter than its progenitor, the Goshawk II compensates with significantly greater speed and agility, incorporating an ECM suite to counter the increasingly sophisticated electronic warfare capabilities encountered in Inner Sphere service. Clan Sea Fox later began producing their own variant at facilities in the Chain Cluster, expanding the design's availability beyond its original Raven Alliance exclusivity.</p>
capabilities: |-
  <p>Built on a weight-saving GS-2E endo steel chassis, the Goshawk II mounts a 315-rated extralight fusion engine that pushes the forty-five-ton 'Mech to an impressive 118.8 km/h, substantially faster than the Vapor Eagle it descends from. Seven jump jets provide an equally impressive leap capability of two hundred and ten meters, exceeding even its larger ancestor's mobility. Nine tons of standard armor offer adequate protection for a design intended to operate at high speed, and an integral ECM suite helps neutralize the electronic warfare advantages that Inner Sphere opponents increasingly bring to the battlefield.</p><p>The Goshawk II's armament centers on a right-arm ER large laser as its sole long-range weapon, capable of engaging targets at significant distances with precision. Close-range firepower comes from a pair of small pulse lasers and six micro pulse lasers distributed across the arms and head, all guided by a targeting computer that maximizes their effectiveness. This energy-only configuration eliminates ammunition dependency, granting extended operational endurance well suited to the Raven Alliance's expeditionary doctrine. The design excels in high-speed slashing attacks, closing rapidly to deliver precise fire before withdrawing beyond effective retaliation range.</p>
deployment: |-
  <p>Developed simultaneously with the base model in 3086, the Goshawk II 2 is configured for anti-infantry operations. It retains the ER large laser and targeting computer alongside two micro pulse lasers for precision work, while a pair of ER flamers provide devastating area-effect capability against soft targets. A single Streak SRM-2 launcher adds a guided missile option, giving this variant the tools to systematically clear infantry positions while maintaining the speed to avoid being pinned down by heavier opposition.</p>
history: |-
  <p>The Goshawk II's development reflects Clan Snow Raven's pragmatic approach to rebuilding their military strength following their relocation to the Outworlds Alliance. Having operated the larger Vapor Eagle since before the Clan Invasion, Raven engineers leveraged their deep familiarity with the design to produce a lighter, faster derivative better suited to their new operational reality as a Clan operating within the Inner Sphere. Production began at Snow Raven Industrial Complex Alpha on Dante in 3086, with the design designated exclusively for Raven second-line formations.</p><p>The Ravens' close commercial relationship with Clan Sea Fox eventually brought the design to wider distribution. Sea Fox merchants, recognizing the Goshawk II's export potential, began manufacturing their own variant at Manufacturing Plant SFF-AL1 on Alnabog in the Chain Cluster. This Sea Fox-produced Goshawk II 4 incorporated more advanced technology including an XXL engine, and was marketed to various buyers including the Republic of the Sphere.</p><p>The Republic's acquisition of Sea Fox-built Goshawk IIs led directly to the experimental RISC variant. In 3136, the Republic Institute of Strategic Combat at their Sandhurst proving grounds on Terra attempted to install an experimental emergency coolant system into the platform. The project yielded only four converted test units before disastrous field trials ended the program. Three of four test units were destroyed within three months, including two from catastrophic coolant system failures that went undetected due to falsely reassuring temperature readouts. RISC shelved the project permanently, and Sea Fox component codes found on recovered wreckage successfully deflected media scrutiny away from the Republic's covert involvement.</p>
