chassis: "Conquistador"
model: "(Avalon One)"
overview: |-
  <p>The Conquistador class command DropShip was developed to provide the Armed Forces of the Federated Commonwealth with a next-generation command platform capable of directing planet-wide assault operations. At 17,400 tons, this massive Aerodyne was designed to replace aging command vessels that had become outmoded in the face of evolving battlefield requirements. Built by one of the Inner Sphere's most established aerospace manufacturers, the Conquistador combines enormous transport capacity with sophisticated command and control facilities.</p><p>The vessel's highly automated systems allow a relatively small crew to operate what is effectively a mobile military headquarters. Its advanced combination drive system stands as a significant engineering achievement, vectoring thrust differently for maneuvering versus interplanetary transit. The Conquistador's versatility extends beyond its primary command role, as its cargo bays and troop quarters can be rapidly converted into field hospitals after delivering their primary cargo.</p>
capabilities: |-
  <p>The Avalon One variant reconfigures the Conquistador as a dedicated aerospace carrier and fleet command ship. BattleMech, vehicle, Battle Armor, and infantry bays are replaced with capacity for thirty-six aerospace fighters and four small craft, along with over one thousand tons of cargo. The crew drops from over eight hundred to three hundred three, reflecting the elimination of ground force support personnel.</p><p>The weapons array is modified to suit the carrier role. Screen launchers join the nose armament alongside Gauss rifles, Rotary AC/5s, LB-X AC/10s, ER PPCs, pulse lasers, and Artemis-equipped LRM-20s. Each broadside carries LB-X AC/20s in addition to the standard mix of Gauss rifles, Rotary AC/5s, ER PPCs, and pulse lasers. A naval communications scanner suite enhances fleet coordination. Armor protection increases to 1,794 points, providing additional survivability for the high-value carrier asset. Anti-missile system coverage is expanded across all arcs.</p>
deployment: |-
  <p>The Avalon One carrier variant was developed to provide dedicated aerospace superiority support to fleet operations. With capacity for thirty-six fighters and four small craft, these vessels served as the centerpiece of Federated Suns aerospace task groups, directing fighter operations through their enhanced communications suites while providing substantial organic firepower to the formation.</p>
history: |-
  <p>For years, the Armed Forces of the Federated Commonwealth had sought a more capable class of command DropShip to assign to their key Regimental Combat Teams. While vessels such as the Fortress and Command Overlord had served admirably in previous decades, advances in technology and changes in battlefield doctrine had rendered them increasingly outdated. The AFFC turned to Federated-Boeing, a company that had supplied DropShips to the Federated Suns for centuries, to develop a replacement.</p><p>The resulting Conquistador entered service in 3063, immediately becoming one of the most capable command platforms in the Inner Sphere. The design incorporated the latest available technologies, including an innovative combination drive system and extensive automation. Its ability to carry an entire RCT command group while simultaneously serving as a planetary assault coordination center made it invaluable to Federated Commonwealth military planners.</p><p>The class saw several specialized configurations developed to meet specific operational requirements. A carrier variant optimized for aerospace operations was produced, while the chaos of the Jihad era prompted development of a high-speed configuration designed to punch through hostile blockades. These variants demonstrated the fundamental soundness of the Conquistador platform and its adaptability to diverse mission profiles.</p>
