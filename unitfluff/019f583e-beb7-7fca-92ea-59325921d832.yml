chassis: "Mechanized Hover Century (MHAF)"
model: "(Flamer)"
overview: |-
  <p>Infantry within the Legiones Marianes form the backbone of planetary garrison and territorial defense, freeing the Hegemony's limited BattleMech assets for offensive operations and prestige assignments. A centuria, or century, is the Marian equivalent of a company-sized formation. Mechanized hover centuries mount their troops in hovercraft that provide the fastest ground transport available to Marian infantry, capable of crossing water obstacles and open ground at speeds that wheeled or tracked vehicles cannot match. Support troops carry man-portable flamers that project streams of burning chemicals, providing devastating area-effect capability against infantry and structures at the cost of short range and the vulnerability of the operator's fuel tank.</p>
