chassis: "Motorized demi-I (Domini)"
model: "(SRM)"
overview: |-
  <p>Manei Domini infantry squads operate in small, heavily augmented formations where every trooper carries cybernetic enhancements tailored to their combat role, from enhanced optics and communicator implants to dermal armor and prosthetic weapon mounts. Domini motorized formations use light vehicles to extend their operational reach while retaining the cybernetic advantages that make each trooper a force multiplier. The vehicles serve primarily as transport to deliver augmented soldiers where they are needed most. Equipped with infantry-portable short-range missile launchers that provide anti-armor capability beyond what personal weapons can achieve, these troops can threaten light vehicles and battle armor at close range.</p>
