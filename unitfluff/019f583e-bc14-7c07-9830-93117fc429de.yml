chassis: "Mechanized Tracked Platoon (DCMS)"
model: "(MRM 3063+)"
overview: |-
  <p>The Combine's martial traditions extend beyond the BattleMech cockpit, and the Dictum Honorium demands that all citizens contribute their talents to the defense of House Kurita. Infantry soldiers of the DCMS embody that expectation on garrison worlds across the realm. Tracked mechanized infantry ride armored carriers that can cross rough ground where wheeled vehicles cannot follow. The DCMS values these platoons for operations on worlds with poor road infrastructure, where the broken terrain that stops lighter transport is simply another day's march for tracked APCs and the soldiers they carry. Support elements carry disposable medium-range missile launchers that split the difference between the close-range punch of SRM systems and the reach of LRM launchers. The volume of fire compensates for the lack of guidance systems.</p>
