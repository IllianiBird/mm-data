chassis: "Night Chanter"
model: "A"
overview: |-
  <p>The Night Chanter stands as one of the earliest products of Clan Coyote's Pueblo Initiative, an ambitious program launched in the mid-twenty-ninth century to rapidly expand the Clan's OmniMech forces. When Clan Jade Falcon won a Trial of Possession for OmniMech technology in 2863, the secret the Coyotes had guarded for a decade spread rapidly throughout the Clans. Rather than accept diminished advantage, the Coyote leadership authorized a crash program to convert existing Star League designs into OmniMechs, trading optimal performance for speed of production.</p><p>The venerable Crab served as one of the first chassis modified under this initiative. Coyote scientists required two years to adapt the design for OmniPod compatibility, with the resulting Night Chanter entering widespread production in 2865. Five tons lighter than its progenitor at forty-five tons, the Night Chanter became the first and most widespread of the Pueblo Initiative OmniMechs.</p>
capabilities: |-
  <p>The Night Chanter's rapid development resulted in significant compromises to its modularity. OmniPods can only be equipped in the center torso and between the pincers on its arms, a limitation that precludes the use of most autocannons or Gauss rifles due to their bulk. The lower arm and hand actuators that give the Crab its distinctive claws remain fixed, further restricting weapons placement. This represented a deliberate trade-off between versatility and the speed of production that the Pueblo Initiative demanded.</p><p>Despite these limitations, the Night Chanter proved a capable medium OmniMech. The chassis retains good overland speed at 86 kilometers per hour, and thirteen tons of pod space allows for diverse loadouts within its physical constraints. CI Standard armor provides adequate protection for its weight class, while fourteen double heat sinks ensure most configurations can maintain sustained fire without overheating. The lack of jump capability remains the design's most significant tactical shortcoming, limiting its effectiveness in rough terrain where more agile competitors can easily outmaneuver it.</p>
deployment: |-
  <p>Alternate Configuration A transforms the Night Chanter into a long-range sniper platform. An extended-range PPC and LRM-10 launcher enable engagement at extreme distances, while a single extended-range medium laser provides backup firepower. Twin machine guns and paired A-Pods protect against infantry and battle armor threats. One ton each of LRM and machine gun ammunition, protected by CASE, ensures adequate endurance for most engagements.</p>
history: |-
  <p>Night Chanters first saw combat against Kindraa Smythe-Jewel forces during their Trial of Possession for OmniMech technology. Though the Coyotes lost the Trial, the Smythe-Jewels recognized the Night Chanter's value and quickly established their own production lines. The design disseminated throughout the Fire Mandrill kindraa at remarkable speed, with Night Chanters soon appearing in frontline formations across Clan space.</p><p>The joint Coyote-Hell's Horses assault on the Smythe-Jewel enclave on Foster in 2872 saw Night Chanters fighting on both sides of the conflict, a reflection of how quickly the design had proliferated. In these engagements, the Night Chanter was often outmatched by faster medium OmniMechs such as the Coyotl and Nova, its lack of jump capability proving a significant tactical disadvantage. Clan Hell's Horses forces reportedly dragged more than a dozen Night Chanters from the Welkin Woods during the Foster campaign.</p><p>Despite its limitations, the Night Chanter fulfilled its intended purpose of rapidly expanding Clan OmniMech forces during a critical period. The design remained in service with various Clans for centuries, valued for its ease of construction and maintenance even as more advanced OmniMechs entered production.</p>
