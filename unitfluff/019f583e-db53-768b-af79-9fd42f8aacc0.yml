chassis: "Shadow Cat III"
model: "C"
overview: |-
  <p>The Shadow Cat III is a forty-five-ton Clan OmniMech born from necessity in the aftermath of the Second Combine-Dominion War. With Clan Nova Cat's touman and industrial facilities on Irece severely damaged, Khan Ajax Drummond recognized that the Clan needed a new, more generalized machine to rebuild its military strength. Taking inspiration from Clan Jade Falcon's Thor II, Nova Cat scientists redesigned the Shadow Cat chassis by removing the fixed jump jets to free tonnage for additional pod space and enhanced armor protection.</p><p>Introduced in 3111, the Shadow Cat III was given distinctive feline-inspired aesthetics that evoked the Nova Cat totem, a deliberate choice to bolster warrior morale during a period of recovery. The look proved so popular that it would be carried over into future projects. Production is based at the Barcella Beta facility on Irece, where it replaced the original Shadow Cat production line.</p>
capabilities: |-
  <p>The Shadow Cat III sacrifices the original Shadow Cat's jump capability in exchange for nineteen tons of pod space and eight tons of ferro-fibrous armor, a substantial improvement over its predecessor's seven tons. The chassis retains the Type 79-45 endo steel internal structure and RFUM 270 XL extralight engine, maintaining the same ground speed profile. Critically, the myomer accelerator signal circuitry is preserved, enabling burst speeds approaching 130 kilometers per hour that partially compensate for the loss of jump jets.</p><p>The Prime configuration mirrors the original Shadow Cat's approach with a Gauss rifle as its primary weapon, allowing engagement at extreme range with devastating effect. Paired medium pulse lasers provide accurate close-range backup. Without jump jets, the Shadow Cat III Prime relies more heavily on speed and positioning than its predecessor, making terrain management crucial for MechWarriors transitioning from the original design.</p><p>The increased pod space allows alternate configurations to carry heavier weapon loads than any standard Shadow Cat configuration could accommodate, while several configurations restore jump capability through pod-mounted jump jets. This expanded flexibility makes the Shadow Cat III more adaptable to mission requirements, though the lack of fixed jump capability limits its baseline effectiveness in mountainous or heavily urbanized terrain.</p>
deployment: |-
  <p>The Charlie configuration represents the most aggressive approach to the Shadow Cat III's design philosophy, mounting an LB 20-X autocannon for devastating close-range firepower capable of shredding armor with cluster rounds or punching through with solid slugs. An improved heavy large laser provides supplementary ranged engagement capability. A supercharger augments the MASC system, granting exceptional burst speed that allows the Shadow Cat III C to rapidly close distance with targets before unleashing its autocannon. This brawler configuration is best suited for ambush tactics and breakthrough operations.</p>
history: |-
  <p>The Shadow Cat III entered service during a turbulent period for Clan Nova Cat. The Second Combine-Dominion War had devastated the Clan's military and industrial base on Irece, leaving the once-proud touman a shadow of its former strength. The new design represented both a practical military need and a symbolic commitment to rebuilding, with its distinctive feline aesthetics designed to invoke the Nova Cat spirit among warriors who had endured tremendous hardship.</p><p>Shadow Cat IIIs became prominent as the Nova Cats struggled to rebuild their depleted touman under the pressures of an obliterated industrial base and severe restrictions from their Combine overlords. Despite the urgent need for new BattleMechs, a few Shadow Cat IIIs reached Nova Cat enclaves within the Republic of the Sphere as a gesture from the Clan to their separated brethren. Popular in trials, the Shadow Cat III would not see true combat until the joint Combine/Nova Cat campaign into the Republic.</p><p>During the fighting on Pike IV, Alpha Galaxy forces engaged Republic defenders in what became a proving ground for the new design. A Nova of Shadow Cat IIIs and upgraded Thunderbird Battle Armor served as screening forces, detecting engine startups in close proximity before two lances of Manticore II tanks opened fire. The OmniMechs' MASC-enabled speed bursts made them difficult targets, and the Nova Cats responded with devastating arm-mounted weapons fire that left the Republic tanks as nothing more than charred scrap.</p><p>Following the Nova Cat Annihilation, the Draconis Combine absorbed the Irece production facilities and continued manufacturing the Shadow Cat III alongside other former Nova Cat designs. The DCMS assists in maintaining ClanTech equipment and production runs for usual fees and access to production. The design has found a niche among Combine warriors, though it has received only limited interest from the Rasalhague Dominion. The Jade Falcons actively shun the design due to its Nova Cat origins.</p>
