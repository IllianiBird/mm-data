chassis: "UrbanMech"
model: "UM-R60B"
overview: |-
  <p>The UM-R60B is designed to counter both unruly populations and Abominations. It replaces the standard heavy autocannon with a blazer capable of comparable firepower even in reduced-heat dazzle mode. A pair of heavy machine guns replaces the small laser, improving effectiveness against close-in infantry and smaller Abominations. An extra half-ton of armor reinforces the legs and flanks.</p>
capabilities: |-
  <p>Best deployed at intersections and chokepoints where its limited speed is less of a liability. The blazer handles armored targets at corridor ranges, while the machine guns clean up anything that slips through. Pilots should avoid open terrain where faster opponents can dictate engagement range. Its compact profile makes it surprisingly hard to hit in cluttered environments.</p>
