chassis: "Turkina"
model: "Prime"
overview: |-
  <p>The Turkina is a 95-ton Clan assault OmniMech introduced in 3052 by Clan Jade Falcon, named for the legendary jade falcon that inspired the Clan's founders. First deployed by the Turkina Keshik during the Battle of Tukayyid, the design entered general service following the conclusion of the Refusal War. Built to fill the heavy assault role, the Turkina quickly established itself as the Jade Falcons' principal assault OmniMech, occupying the same niche as the Dire Wolf but largely superseding that design within the Falcon touman. Manufactured at Complex Beta on Ironhold and Olivetti Weaponry on Sudeten, the Turkina was initially a closely guarded Jade Falcon asset, though slow dissemination through trade, conquest, and Trials of Possession has spread the design to several other Clans including the Cloud Cobras, Coyotes, Fire Mandrills, and Nova Cats. The chassis carries the notable design quirk of being exceptionally easy to pilot for its considerable mass.</p>
capabilities: |-
  <p>In an unusual design decision, the Turkina mounts six integral jump jets hardwired to the chassis frame rather than utilizing modular pod space for this capability. This allows the 95-ton assault 'Mech to vault up to ninety meters at a bound, offsetting the poor ground maneuverability inherent in its wide, squat design profile. While this consumes tonnage that could otherwise be devoted to weapons when jump capability is unnecessary, the standardization simplified field logistics across the Jade Falcon touman at a time when Clan resources were stretched thin following the invasion of the Inner Sphere.</p><p>Built with a standard internal structure and standard armor to maximize available pod space, the Turkina carries a generous forty-two tons of modular payload capacity. Fifteen double heat sinks (four more than the 285-rated extralight engine can accommodate internally) are fixed in the torso sections, providing a substantial heat management baseline for any configuration. The Prime configuration exemplifies the design's versatility, pairing extended-range PPCs and LB 5-X autocannons with LRM-15 launchers for effective engagement across all combat ranges. The Turkina's massive armor coverage allows it to absorb punishment that would cripple lighter designs, while its varied configurations reflect roles ranging from long-range fire support and urban combat to ammunition-independent energy warfare. This combination of resilience, flexibility, and integral jump capability gives the Turkina a significant tactical advantage over competing assault OmniMechs such as the Shrike.</p>
deployment: |-
  <p>The Primary configuration arms the Turkina for sustained long-range engagements with a pair of extended-range particle projector cannons complemented by twin LRM-15 launchers and a pair of LB 5-X autocannons. Four additional double heat sinks manage the considerable thermal output of the energy weapons, while ample ammunition stores allow the launcher and autocannon systems to sustain fire through extended operations. This balanced loadout makes this variant a versatile fire support platform capable of engaging targets effectively across all combat ranges.</p>
history: |-
  <p>Named for the first jade falcon tamed by Elizabeth Hazen, the founder of Clan Jade Falcon, the Turkina carries deep symbolic weight within the Clan. The design first saw limited service during the Battle of Tukayyid in 3052, where elements of the Turkina Keshik fielded the chassis against the Com Guard defenders. Following the conclusion of the Refusal War, the Turkina entered full production at two facilities, Complex Beta on Ironhold in the Clan Homeworlds and Olivetti Weaponry on Sudeten in the Inner Sphere Occupation Zone.</p><p>The Jade Falcons initially attempted to maintain exclusive control over Turkina production and deployment, but the demands of inter-Clan politics gradually eroded this monopoly. Clan Smoke Jaguar acquired a handful of the OmniMechs, which passed to the Star League Defense Force and subsequently the Nova Cats following the destruction of the Jaguar Clan. Other Clans including the Cloud Cobras, Coyotes, and Fire Mandrills obtained Turkinas through trade with the Falcons or seized them as spoils of war during the escalating Homeworld conflicts. A notable cultural division emerged between the two production lines, with a prejudice arising among Falcon trueborns against Sudeten-built models, which they considered inferior to Ironhold-manufactured chassis despite the two being functionally identical.</p><p>The Jihad and Wars of Reaving struck devastating blows to Turkina production. The loss of Ironhold eliminated Complex Beta entirely, while damage to Olivetti Weaponry's Sudeten facilities temporarily halted production there as well. The resulting manufacturing lull reduced the Turkina's numbers sufficiently for the similarly massed Shrike to gain popularity within the Falcon touman. Following Galaxy Commander Malvina Hazen's conquest of Skye in 3134, the Shrike became the de facto symbol of her brutal, total-warfare philosophy, while the Turkina remained a shining emblem of Khan Jana Pryde's traditionalist faction until her death in 3136.</p><p>With the eventual rebuilding of the Sudeten facility, Turkina production resumed in the Dark Age era. However, pilots in pro-Malvina Clusters who field the Turkina continue to suffer from the political stigma associated with the design's traditionalist symbolism, a reflection of how deeply the rivalry between Falcon factions has been woven into the identity of their assault OmniMechs.</p>
