chassis: "Spirit Walker"
model: "A"
overview: |-
  <p>The Spirit Walker is a seventy-five-ton heavy OmniMech introduced by Clan Coyote in 2866 as part of the Pueblo Initiative. Based on the venerable Black Knight chassis, the Spirit Walker was one of the earliest efforts to convert proven Star League-era BattleMechs into OmniMech platforms. With twenty-four tons of pod space and a robust sensor suite, the design served as a versatile heavy fire support platform throughout the Coyote touman. Production at the Picuris 'Mech Production Complex on Londerholm continued until the line was phased out in favor of the Savage Coyote, though the Spirit Walker's popularity led several rival Clans to pursue it through Trials of Possession.</p>
capabilities: |-
  <p>The Spirit Walker's design philosophy reflects the Coyote scientists' expectations of traditional Clan warfare under zellbrigen. Armor is concentrated heavily on the frontal arc using Clan Ferro-Fibrous plating, providing substantial protection for head-on dueling at the expense of significantly lighter rear coverage. This deliberate trade-off assumed that opponents would engage the 'Mech directly rather than employing hit-and-fade tactics, an assumption that would prove costly in less structured combat environments.</p><p>The chassis features a hardwired active probe inherited from its Black Knight ancestry, integrated into the CI-TransComm targeting system. This sensor package provides exceptional detection capabilities, particularly useful for identifying concealed enemies and neutralizing electronic warfare countermeasures. A single fixed Series 1 Extended-Range Small Laser supplements whatever pod-mounted weaponry commanders select, while sixteen double heat sinks manage thermal output across all configurations.</p><p>Driven by a Type 300 Standard Fusion engine, the Spirit Walker achieves a respectable cruising speed of roughly sixty-four kilometers per hour. The lack of jump jets limits tactical mobility, making the design reliant on its speed and firepower to maintain favorable positioning. The CI-Com 4 communications system provides reliable battlefield coordination, though the Spirit Walker's true tactical advantage lies in its sensor suite and the flexibility afforded by its generous pod capacity.</p>
deployment: |-
  <p>Alternate Configuration A shifts the Spirit Walker into a brawler role, mounting a Gauss Rifle as its primary weapon supported by three Extended-Range Medium Lasers, two Small Pulse Lasers, and two Machine Guns. A Targeting Computer enhances accuracy for the Gauss Rifle and energy weapons alike, while the standard hardwired Active Probe continues to provide superior battlefield awareness. Two tons of Gauss Rifle ammunition and a half-ton of machine gun rounds are protected by CASE, mitigating the risk of catastrophic ammunition explosion. This configuration trades the Prime's extreme range advantage for concentrated firepower at closer engagement distances, making it well-suited for aggressive assault operations where the Spirit Walker's heavy frontal armor can be leveraged most effectively.</p>
history: |-
  <p>The Spirit Walker emerged during the Golden Century, a period of intense technological development among the Clans. When Clan Jade Falcon won a Trial of Possession for OmniMech technology in the 2850s, the innovation that had given Clan Coyote a decisive military advantage rapidly proliferated across Clan space. In response, the Coyotes launched the Pueblo Initiative to rapidly develop new OmniMech designs by converting proven Star League-era chassis into OmniMech platforms.</p><p>The Spirit Walker was among the first products of this initiative, with Coyote scientists requiring approximately two years to adapt the Black Knight's frame to accept OmniPods. The standard chassis was retained rather than upgrading to endo steel, prioritizing speed of development and ease of production over weight optimization. This pragmatic approach allowed the Coyotes to field Spirit Walkers quickly, distributing them throughout their touman to Clusters that lacked OmniMech assets. The design was popular for its ruggedness and ease of construction, and its acceptance of standard weapons pods in most locations made it a versatile addition to the Coyote order of battle.</p><p>The Spirit Walker's combat reputation was forged during the campaign against Kindraa Smythe-Jewel on Foster in 2872. Coyote forces initially dominated, with the Spirit Walker's energy-heavy loadouts and active probe proving devastating against ammunition-starved Fire Mandrill warriors. However, as the battle devolved beyond the bounds of formal zellbrigen, Smythe-Jewel hit-and-fade tactics exploited the Spirit Walker's thin rear armor with lethal efficiency. The Foster campaign demonstrated both the design's formidable frontal combat power and its critical vulnerability when denied the structured dueling conditions its creators had anticipated.</p><p>Production at the Picuris 'Mech Production Complex on Londerholm served Clan Coyote from the Late Succession Wars era through the Clan Invasion period. The facility remained active through the second wave of the Invasion before production was eventually phased out in favor of the Savage Coyote, a more modern design that better suited evolving Clan doctrine. By the Civil War era, Spirit Walker production had ceased entirely, leaving remaining frames to serve as second-line assets or be gradually replaced within Coyote Clusters.</p><p>Despite its relatively limited production run compared to more widespread Clan OmniMechs, the Spirit Walker holds an important place in Clan military history as one of the earliest Pueblo Initiative designs. Its development demonstrated that converting existing Star League chassis into functional OmniMechs was both practical and militarily effective, establishing a precedent that influenced subsequent Clan engineering programs.</p>
