chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled UAC10 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing heavy ultra autocannon capable of double-rate fire, these field gun crews deliver punishing direct fire that can overwhelm the armor of medium vehicles and threaten BattleMech limbs.</p>
