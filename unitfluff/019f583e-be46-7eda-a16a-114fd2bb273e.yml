chassis: "Field Gun Century (MHAF)"
model: "(Tracked Light Gauss)"
overview: |-
  <p>The Marian military tradition places infantry at the foundation of its legionary system, with conventional soldiers organized into units bearing Latin designations that reflect the Hegemony's deliberate cultivation of Roman imperial identity. Marian field gun centuries tow crew-served weapons on wheeled, tracked, or motorized carriages, providing direct-fire anti-armor capability that supplements the Legiones Marianes' limited BattleMech strength. The century tows a light gauss rifle that uses magnetic acceleration to fire projectiles at extreme velocity, delivering exceptional range and penetration with no ammunition explosion risk.</p>
