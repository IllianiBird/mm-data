chassis: "Field Gun Level I (WOBM)"
model: "(Tracked Light Gauss)"
overview: |-
  <p>Drawing veterans from the Com Guards, recruits from the Free Worlds League, and volunteers from Protectorate worlds, the Word of Blake Militia assembled infantry formations whose quality varied but whose equipment was consistently first-rate. Crewing compact gauss field pieces that trade maximum hitting power for reduced weight and improved portability, these gunners provide magnetically accelerated fire support that can be repositioned more readily than full-scale gauss weapons.</p>
