chassis: "Field Artillery Platoon (AFFS)"
model: "(Motorized Arrow IV 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing Arrow IV artillery systems, these platoons field the most sophisticated indirect fire capability available to conventional forces, launching guided missiles that can be directed onto targets by forward observers with TAG designators.</p>
