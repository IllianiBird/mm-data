chassis: "Field Gun Century (MHAF)"
model: "(Tracked UAC5)"
overview: |-
  <p>The Marian military tradition places infantry at the foundation of its legionary system, with conventional soldiers organized into units bearing Latin designations that reflect the Hegemony's deliberate cultivation of Roman imperial identity. Marian field gun centuries tow crew-served weapons on wheeled, tracked, or motorized carriages, providing direct-fire anti-armor capability that supplements the Legiones Marianes' limited BattleMech strength. The century tows an ultra autocannon capable of firing at double the normal rate, delivering sustained suppressive fire at the risk of jamming under rapid fire.</p>
