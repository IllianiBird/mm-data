chassis: "Mechanized Hover Platoon (Generic)"
model: "(LRM 3065+)"
overview: |-
  <p>Mechanized hover platoons transport their infantry in hovercraft capable of crossing water, swamps, and open terrain at high speed. The fastest conventional mechanized formation available, hover platoons trade the all-terrain reliability of tracked vehicles for raw speed and amphibious capability. They are well suited to coastal defense, riverine operations, and rapid flanking maneuvers on open ground. Rough terrain and dense forests limit hovercraft effectiveness, and the vehicles offer less protection than heavier tracked or wheeled transports. Carrying man-portable long-range missile launchers alongside their primary weapons, these platoons can engage armored targets at distances well beyond normal infantry range, providing organic fire support that reduces dependence on dedicated armor or artillery assets.</p>
