chassis: "Mechanized Hover Platoon (FWLM)"
model: "(SRM 3035+)"
overview: |-
  <p>New technology and creative tactical thinking have long featured in FWLM infantry deployment, with varied unit types and specialized formations treated as the norm rather than the exception. Hover-mechanized platoons are the fastest infantry transport in FWLM service, carrying troops across water and open terrain at speeds that outpace any ground vehicle. Their vulnerability to ambush in confined terrain is offset by the tactical flexibility they offer on League worlds with extensive coastlines or open plains. Equipped with infantry-portable short-range missile launchers, these platoons pack anti-armor punch that standard rifle or laser formations cannot match, capable of threatening light vehicles and even damaging BattleMech leg actuators at close range.</p>
