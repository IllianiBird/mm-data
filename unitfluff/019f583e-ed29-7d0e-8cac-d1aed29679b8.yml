chassis: "Riga Frigate"
model: "(2440)"
overview: |-
  <p>The Riga-class frigate was Boeing Interstellar's solution to a critical gap in the Terran Hegemony's naval order of battle. Commissioned in 2440 after more than a decade of study and development, the class was designed to fill a role between destroyer and cruiser, combining the endurance for extended independent patrols with firepower well above its nominal weight class. Where existing frigates sacrificed either staying power or offensive capability, the Riga offered both, giving fleet commanders a single hull that could screen capital formations, escort convoys through contested space, or operate independently along frontier patrol routes. The design earned a reputation as a dependable workhorse of Hegemony naval operations, a vessel that punched well above its tonnage classification and could perform duties that would otherwise require a larger and more expensive warship.</p>
capabilities: |-
  <p>Displacing 750,000 tons across 693 meters of hull, the Riga carried firepower that many contemporary officers considered more fitting for a battlecruiser than a frigate. Three Heavy Naval PPCs and six NL55 naval lasers anchored the nose and broadside arcs, delivering capital-grade energy strikes at long range. Five Light Naval PPCs and six NL45 naval lasers provided secondary energy coverage across the forward quarter, aft quarter, and stern arcs. Six NAC/30 naval autocannons in the nose and broadsides and eight NAC/25 autocannons in the quarter arcs delivered punishing ballistic fire at closer ranges, with large magazine stores ensuring sustained engagements.</p><p>The emphasis on energy weapons was a deliberate choice to minimize ammunition dependency during extended independent operations, though Hegemony Naval Command insisted on the autocannon batteries for shorter-range punch. Two thousand one hundred single heat sinks managed the thermal load, while 443.5 tons of ferro-carbide armor provided protection rivaling contemporary battlecruisers. New maneuver drives maximized fuel efficiency without sacrificing speed. Two docking collars, twelve fighter bays housing two full squadrons, four small craft bays, and over 124,000 tons of cargo space rounded out a substantial logistics capacity. Two gravity decks at 140 and 65 meters served a crew of approximately 280.</p>
deployment: |-
  <p>The most infamous individual Rigas were the WoBS Red Angel and WoBS White Devil, former Star League-era hulls recovered and restored to service by the Word of Blake. The Red Angel deployed to New Avalon in October 3067 alongside the Essex-class Divine Forgiveness and Aegis-class Herald of Justice, forming the Blakist punitive fleet that would terrorize the Federated Suns capital for five years. The Red Angel and Divine Forgiveness conducted nuclear orbital bombardment of Avalon City, shattering the First Davion Guards and devastating much of the planetary capital. The Red Angel maintained orbital blockade over New Avalon until December 3072, when the Fifth FedCom RCT finally destroyed the vessel.</p><p>The White Devil met its end during Operation CASE WHITE in March 3068. In the Clan Homeworlds, the Hetherington, originally an SLDF vessel placed into storage by Clan Star Adder, was recovered by the Society and transferred to the resurrected Clan Burrock during the Wars of Reaving. After raiding a Diamond Shark convoy at Salonika in July 3072, the Hetherington returned with reinforcements but was destroyed by Diamond Shark forces in the ensuing battle.</p>
history: |-
  <p>The Riga-class frigate originated from a joint study initiated in 2426 by the Terran Hegemony's Center of Strategic Studies and Hegemony Naval Command, which conducted a decade-long analysis of naval deficiencies. The study identified a gap endemic to most nations of the era: insufficient assets to meet mission objectives. Specifically, the Hegemony needed a vessel capable of performing destroyer duties while fighting like a cruiser. The Navy was deeply skeptical of any new frigate proposal following the Quixote procurement debacle, but Boeing Interstellar's design proved compelling enough to win approval after two years of political maneuvering. Construction began in 2438 at Boeing's Terra facility, with the first vessel completing eighteen months later and commissioning in 2440.</p><p>The class proved its worth during the Reunification War, demonstrating excellent long-range operational capability while escorting Monsoon-class battleships and Aegis-class heavy cruisers during fleet deployments. Boeing Interstellar continued production for over a century until the Congress-class frigate entered service in 2542. Even after production ceased, Rigas remained in widespread service for nearly two more centuries. The Rim Worlds Republic became by far the largest operator, fielding sixty-five vessels designated as Riga I frigates by 2765, including the RWS Sagittarius, permanently assigned to the Fifth Amaris Regulars with a lithium-fusion battery upgrade.</p><p>The Hegemony began retiring the class in 2735 to make room for the new Sovetskii Soyuz-class heavy cruisers, with the last vessels mothballed by 2740. Boeing Interstellar later developed the Riga II destroyer-carrier in 2747, a separate successor class that would eventually evolve into the York-class in Clan service. Despite formal retirement, the Word of Blake recovered at least two mothballed hulls and restored them to operational condition before the Jihad. Their actions during that conflict, particularly the nuclear bombardment of Avalon City, numbered among the most devastating naval operations of the era. In the Clan Homeworlds, the destruction of the last known Riga at Salonika during the Wars of Reaving marked the final chapter of a class that had served for over three centuries.</p>
