chassis: "Cuirass"
model: "CDR-1X"
overview: |-
  <p>The Cuirass was developed by Robinson Standard BattleWorks and released in July 3086, continuing the Watchman chassis family lineage into the post-Jihad era. Inspired by the renewed interest in light cavalry 'Mechs driven by designs like the Legionnaire, Gurkha, and Mjolnir, the Cuirass is designed for the fast skirmisher role. At forty tons powered by a GM 240 XL engine, the design achieves a top speed of 97 km/h with an impressive 180-meter jump range, making it the most mobile member of the Enforcer derivative family. Initially released exclusively to Federated Suns formations including the Robinson Strikers and Davion Light Guard, the Cuirass received no authorized resale outside the AFFS at the time of its introduction.</p>
capabilities: |-
  <p>The Cuirass is built on the proven Dorwinion Hyperactive 3 endo steel chassis shared with the Sentry, powered by a GM 240 XL engine and equipped with six Robinson-Liberty Model 12 jump jets. While its 97 km/h ground speed trails true light cavalry designs, the 180-meter jump capability more than compensates, allowing the Cuirass to exploit terrain and execute flanking maneuvers that ground speed alone cannot achieve. Eight tons of StarGuard II armor provide adequate protection for hit-and-run engagements, though sustained exposure to heavy fire will quickly overwhelm the design's defenses, a risk amplified by the fragile XL engine.</p><p>The primary armament is a Mydron Model RC Rotary AC/5, the same weapon employed by the Legionnaire, fed by three tons of CASE-protected ammunition. This rotary autocannon can deliver rapid bursts capable of staggering lighter opponents, while an ER medium laser and a two-ton sword provide close-combat options. However, the Cuirass's most significant design flaw is its reliance on single heat sinks, an unusual choice for a post-Jihad design. The combination of a rotary autocannon, jump jets, and energy weapons generates substantial heat that the cooling system struggles to manage, forcing pilots to carefully balance their rate of fire against heat buildup. The AFFS requested an improved thermal management system, but the chassis proved too compact to accommodate a rebuild without fundamental redesign.</p>
deployment: |-
  <p>The baseline Cuirass mounts a Mydron Model RC Rotary AC/5 in the left arm with three tons of CASE-protected ammunition, an ER medium laser, and a two-ton sword in the right arm. Released in July 3086, the design achieves 97 km/h with 180-meter jump capability through its GM 240 XL engine and six Robinson-Liberty Model 12 jump jets. The decision to use single heat sinks (driven by cost considerations and chassis compactness) remains the design's most controversial aspect, as the cooling system is seriously taxed when the rotary autocannon fires at high rates while the pilot maintains jump mobility. Pilots quickly learned that heat discipline is essential, making the Cuirass best suited to experienced MechWarriors who can manage its thermal limitations.</p>
history: |-
  <p>The Cuirass emerged from the post-Jihad renaissance in light cavalry doctrine. The widespread destruction of the Jihad era, combined with the "build anything you can" mentality that dominated wartime procurement, had ironically revived interest in lighter, more mobile designs. Notable successes by formations fielding the Legionnaire and similar fast-moving designs demonstrated that agility and firepower could compensate for reduced armor in the right tactical context. Robinson Standard BattleWorks, having established itself as a capable manufacturer through the Watchman and Sentry programs, sought to capitalize on this trend.</p><p>Released in July 3086, the Cuirass was initially distributed to the Robinson Strikers and Davion Light Guard, with Delta Company assignments receiving priority. No resale outside the Federated Suns was announced at the time of introduction, reflecting the AFFS's desire to retain exclusive access to the design. The CDR-2BC variant emerged in 3119 with double heat sinks addressing the original's most criticized flaw, alongside a C3 boosted slave and revised weapons suite. The CDR-2X followed in 3134 with a heavy PPC configuration that shifted the design toward more sustained ranged engagement capability.</p><p>Despite the acknowledged heat management issues of the original CDR-1X, the Cuirass proved effective enough in its intended role that Robinson Standard BattleWorks continued to refine the design rather than abandon it. The chassis's compact dimensions, which prevented a simple heat sink upgrade, ultimately drove the development of entirely new variant configurations that worked within the thermal constraints rather than trying to overcome them. The Cuirass represents the latest evolution of the Enforcer derivative family, carrying the design DNA of the original 2777 Enforcer into the thirty-second century through four generations of Robinson-built designs.</p>
