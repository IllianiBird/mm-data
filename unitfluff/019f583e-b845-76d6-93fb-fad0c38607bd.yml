chassis: "Field Gun Platoon (CCAF)"
model: "(Wheeled LBX20 3060+)"
overview: |-
  <p>Capellan infantry serve where BattleMechs and armor cannot be spared, which in the resource-constrained CCAF means nearly everywhere. The Xin Sheng movement revitalized the infantry arm alongside every other facet of the Capellan Confederation Armed Forces, giving foot soldiers better equipment and renewed purpose. Field gun platoons provide Capellan infantry with organic direct-fire heavy weapons, towing crew-served autocannons or other heavy guns to prepared positions. The weapon crew operates the gun while the remaining troopers provide local security with personal arms. Their LB 20-X autocannon delivers devastating close-range fire with the versatility of cluster ammunition, though the weapon demands careful positioning due to its limited range.</p>
