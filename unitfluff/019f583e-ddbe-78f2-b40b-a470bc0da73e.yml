chassis: "St. Florian"
model: "FLN-366 FireMech"
overview: |-
  <p>The St. Florian is an advanced IndustrialMech created by StarCorps Industries in 3062 as a specialized firefighting platform. When the HGN-734 Highlander variant debuted, the production changeover left a surplus of single heat sink-equipped standard fusion engines. StarCorps developed a profitable secondary use for these and other surplus Highlander components, producing the St. Florian FireMech for the largest and most prosperous municipal buyers.</p><p>Built on repurposed Highlander components, the St. Florian towers over competing designs like the Pompier, fielding the firepower of a heavy combat unit in its firefighting role. Its environmental sealing and bank of heat sinks allow it to wade directly into blazing structures, combating fires from within rather than from the outside. However, its steep cost largely limits procurement to planetary capitals and major metropolitan areas, leaving smaller settlements to rely on lighter alternatives.</p>
capabilities: |-
  <p>The secret to the St. Florian's impressive firefighting performance lies in its pedigree. Many of its core components were adapted directly from the Highlander assault BattleMech, including the GM 270 standard fusion engine, environmental sealing systems, and a comprehensive bank of twelve heat sinks that allow the machine to operate in extreme thermal environments. The Industrial XT chassis provides a robust platform for the ninety-ton machine's demanding operational profile.</p><p>Lang Heavy Industrial armor provides adequate protection against structural collapse and incidental hazards, though it offers significantly less protection than military-grade plating. The lack of jump jets (understandable for a firefighting platform) limits the St. Florian's ability to navigate heavily damaged terrain, but its sheer mass and environmental sealing allow it to simply push through obstacles that would stop lighter firefighting machines. Communications and targeting systems inherited from the Highlander line give operators excellent situational awareness in smoke-filled environments where visibility is severely degraded.</p>
deployment: |-
  <p>The base St. Florian FLN-366 is a dedicated firefighting platform equipped with specialized fluid guns, liquid storage tanks, and environmental sealing that allow it to operate inside burning structures. Twelve heat sinks inherited from the Highlander production line provide exceptional thermal protection, while the GM 270 fusion engine gives the ninety-ton machine reliable power. Though designed purely for civilian emergency services, the St. Florian's robust construction and Highlander-derived components have made it an attractive candidate for military conversion during periods of conflict.</p>
history: |-
  <p>The St. Florian emerged from the practical economics of BattleMech production rather than any military requirement. When StarCorps Industries retooled its Son Hoa production line in 3062 to produce the new HGN-734 Highlander variant, the changeover generated a surplus of older-specification components. Rather than scrapping these assets, StarCorps engineers designed the St. Florian FireMech to put them to profitable civilian use, creating what quickly became recognized as the most advanced IndustrialMech introduced since the fall of the Star League.</p><p>The St. Florian became a bestseller among those who could afford it, though the qualifier was significant, as its cost proved prohibitive for most small to medium-sized communities. Consequently, the majority of operational St. Florians are found in planetary capitals and major metropolitan areas across the Inner Sphere, while smaller settlements continue to rely on the lighter Pompier or forego specialized firefighting 'Mechs entirely. The design's long service record has given rise to a significant secondary market, where used or slightly damaged examples remain perennial sellers.</p><p>The current scramble to militarize common IndustrialMechs during the Dark Age and ilClan era has not entirely passed the St. Florian by. The crucial role it plays in protecting civilian infrastructure means that comparatively fewer have been modified for combat use than other designs. However, such conversions have occurred, most commonly on Republic worlds recently claimed by Clan-based splinter factions. The very idea of converting firefighting machines into combat platforms remains controversial, but the deteriorating security situation across the Inner Sphere has made such pragmatism increasingly common.</p>
