chassis: "Anvil"
model: "ANV-6M"
overview: |-
  <p>The Anvil was introduced in 3055 by Free Worlds Defense Industries as a sixty-ton heavy BattleMech designed to serve as a close-combat brawler for the Free Worlds League Military. Originally conceived as an independent design codenamed the Stingray, the 'Mech's development trajectory shifted when engineers recognized its potential as a complementary partner to the Hammer light fire support 'Mech. The Free Worlds League merged elements of both designs and renamed the Stingray the Anvil, creating one of the more distinctive tactical pairings in modern Inner Sphere doctrine. Produced at the Gibson Federated BattleMechs facility on Gibson, the Anvil incorporated several advanced technologies at the cutting edge of Free Worlds League manufacturing capability during the Clan Invasion era.</p>
capabilities: |-
  <p>The Anvil leverages a Duralyte 314 Endo Steel internal structure to maximize available tonnage, paired with a Vlar 300 standard fusion engine that propels the sixty-ton chassis to a top speed of eighty-six kilometers per hour. Three Chilton 365 jump jets provide ninety meters of jump capability, granting enhanced maneuverability during the close-range engagements the design was built to dominate. The primary armament consists of two Sutel Precision Line Large Pulse Lasers delivering devastating accuracy at medium ranges, supported by a pair of Martell medium lasers for supplementary firepower. An integrated Guardian ECM Suite disrupts enemy targeting and electronic warfare systems, providing significant protection against advanced sensor technology.</p><p>The Anvil's armor protection and power plant employ conventional technologies predating the Fourth Succession War, representing a deliberate design compromise that prioritized weapons sophistication over defensive innovation. This approach keeps production costs manageable while fielding a lethal close-combat package. The 'Mech's principal limitation lies in its short-range-focused arsenal, making it heavily reliant on its Hammer partner to soften targets at distance before the Anvil can close to its optimal engagement envelope.</p>
deployment: |-
  <p>Introduced in 3058 as a popular field modification later adopted as a factory refit, this variant replaces one medium laser with a TAG target designation system mounted in the head. The modification transforms the Anvil into an artillery spotter capable of guiding both conventional and orbital bombardment strikes onto enemy positions. Frequently paired with the Arrow IV-equipped ANV-8M, the 6M creates one half of a self-contained fire support team. Several front-line FWLM formations maintain at least one 6M-equipped Anvil, with designated pilots receiving specialized training through the Free Worlds League navy in orbital fire coordination procedures.</p>
history: |-
  <p>Production of the Anvil began in 3055 at the Gibson Federated BattleMechs facility on Gibson, a division of Free Worlds Defense Industries. The design entered service during a period of rapid technological advancement within the Free Worlds League Military, which was investing heavily in new BattleMech designs incorporating recovered Star League-era technologies. The Anvil quickly found a home in numerous FWLM companies, with particularly heavy concentrations in formations associated with the Duchy of Andurien.</p><p>The Anvil-Hammer pairing proved its worth during Operation Guerrero in 3057, where the combination demonstrated devastating effectiveness during the FWLM's lightning assault into the Federated Commonwealth's Sarna March. The complementary doctrines of long-range suppression followed by aggressive close-quarters engagement became a hallmark of Free Worlds League combined-arms tactics during this period. The design also saw service during the multinational campaign against Clan Smoke Jaguar, where the Clans' technological superiority posed significant challenges. The Anvil's Guardian ECM systems proved critical in degrading Clan targeting advantages during these engagements.</p><p>Free Worlds Defense Industries continued investigating upgrades and modifications throughout the late 3050s and 3060s, producing both field kits and factory refits designed to extend the Anvil's service life. The development of specialized artillery-spotting and fire support variants reflected evolving FWLM tactical doctrine, including coordination with orbital bombardment assets through the Free Worlds League navy. The facility on Gibson fell under Word of Blake control during the Jihad, and production of the Anvil continued under new management. Following the liberation of Gibson, the production lines appear to have ceased operations, leaving surviving Anvils as increasingly rare artifacts of Free Worlds League military innovation.</p>
