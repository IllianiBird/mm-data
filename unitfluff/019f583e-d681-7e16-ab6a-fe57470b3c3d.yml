chassis: "Omni-Corvis"
model: "B"
overview: |-
  <p>The Omni-Corvis is a 50-ton prototype OmniMech developed by Clan Hell's Horses at Niles Industriplex Alpha in the early thirtieth century, building on the semi-modular weapon concept of the standard Corvis BattleMech. This experimental design demonstrated the viability of interchangeable weapon pod systems on a common chassis, proving the core engineering principles that would eventually transform Clan warfare. Though produced in limited numbers at Niles and later at Tokasha MechWorks, the Omni-Corvis's greatest legacy lies in its design principles, which Clan Snow Raven refined into the far more successful Stormcrow by 2930. The Omni-Corvis remains one of the most historically significant prototypes in Clan military development.</p>
capabilities: |-
  <p>Built on a Model MHXX endo steel chassis, an evolution of the Corvis's MH-24 frame, the Omni-Corvis is protected by Compound H17/1 ferro-fibrous armor and powered by a 250-rated fusion engine that provides a top speed of 86 km/h. This marks a significant improvement over the Corvis's modest 65 km/h, giving the Omni-Corvis the mobility expected of a Clan medium combatant. The heavier chassis also supports greater armor coverage and a more substantial weapons payload than its predecessor.</p><p>As a prototype OmniMech, the design carries inherent limitations reflected in its Prototype design quirk. Pod reconfiguration times are longer than production OmniMechs, and the weapon bay interfaces occasionally suffer from reliability issues that proper second-generation designs eliminated. The pod space allocation, while functional, is less efficient than the refined systems the Snow Ravens would later develop for the Stormcrow. Despite these shortcomings, the Omni-Corvis successfully demonstrated the core OmniMech concept of interchangeable weapon pods on a common chassis, providing the engineering foundation for an entire generation of Clan designs.</p>
deployment: |-
  <p>The B configuration serves as a long-range support platform, mounting dual LRM-20 launchers in each arm to deliver devastating missile barrages at extended range. A Narc missile beacon provides enhanced targeting for friendly missile-equipped units across the formation, while machine guns offer supplementary anti-infantry capability for close defense against conventional forces.</p>
history: |-
  <p>The Omni-Corvis was Clan Hell's Horses' ambitious attempt to push the Corvis's semi-modular weapon concept to its logical conclusion. Developed in the early thirtieth century at Niles Industriplex Alpha, this prototype represented one of the earliest OmniMech designs, adapting the Corvis's modular weapon ports into a true pod-based system on a heavier, faster chassis.</p><p>The Omni-Corvis debuted during the Battle of Tokasha in 2921, but its operational history was cut dramatically short when Clan Ghost Bear won the planet. Seeking to punish Clan Hell's Horses for the death of Khan Kilbourne Jorgensson during the battle, Ghost Bear released the Omni-Corvis blueprints on the Chatterweb network -- an act of deliberate technological proliferation that scattered the design across all of Clan space.</p><p>Despite the blueprints' availability, only Clan Snow Raven pursued the Omni-Corvis concept seriously. Raven scientists recognized the design's potential and undertook a series of refinements that culminated in the Stormcrow -- a faster, more refined 55-ton OmniMech that debuted in 2930 and would become one of the most widely fielded designs in Clan history. The Omni-Corvis itself, hampered by its prototype limitations, was never manufactured in significant numbers beyond initial production runs at Niles and Tokasha.</p>
