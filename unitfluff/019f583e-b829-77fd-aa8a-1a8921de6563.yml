chassis: "Field Gun Platoon (CCAF)"
model: "(Tracked UAC20 3061+)"
overview: |-
  <p>The Capellan Confederation has always relied on its infantry to compensate for the CCAF's chronic shortage of heavier assets. Conventional foot soldiers, drawn from the citizens' militia system that defines Capellan military service, form the backbone of garrison forces across the Confederation's commonalities. Field gun platoons provide Capellan infantry with organic direct-fire heavy weapons, towing crew-served autocannons or other heavy guns to prepared positions. The weapon crew operates the gun while the remaining troopers provide local security with personal arms. Their ultra autocannon/20 can unleash devastating rapid-fire bursts at close range, though crews must balance the weapon's fearsome output against its notorious tendency to jam.</p>
