chassis: "Inquisitor II"
model: "ITW-200"
overview: |-
  <p>The Inquisitor II is a 50-ton SecurityMech developed by Irian BattleMechs Unlimited as a heavier and more capable successor to the original 35-ton Inquisitor. Introduced during the Dark Age era, the design was created specifically to safeguard the megacorporation's production facilities against increasingly sophisticated threats that had outpaced the capabilities of the lighter Inquisitor.</p><p>Classified as an advanced IndustrialMech, the Inquisitor II blurs the line between civilian security platform and military hardware more dramatically than its predecessor. Unlike the original Inquisitor, which was widely sold on the open market, the Inquisitor II has been primarily retained as a proprietary asset, though a non-proprietary variant has been offered to interested customers.</p>
capabilities: |-
  <p>Built around an ITW 200 fusion engine, the Inquisitor II achieves a modest top speed of 64.8 kilometers per hour, slower than its lighter predecessor, but adequate for facility defense operations. Seven tons of Irian HardCase heavy industrial armor provide protection comparable to a light BattleMech, a significant consideration for a platform that may face militarized intruders. A Beagle active probe enhances the 'Mech's surveillance capabilities, allowing it to detect hidden units and concealed personnel throughout a facility's perimeter.</p><p>The Inquisitor II's primary armament serves as a dramatic upgrade over the original design. A Wildfire TSEMP cannon allows the pilot to use the 'Mech's fusion engine to generate a tight-stream electromagnetic pulse capable of disrupting enemy electronics and potentially shutting down hostile combat units entirely. An Imperator Napoleon light autocannon mounted in the right arm provides sustained ranged firepower with the flexibility of multiple ammunition types, while an Irian Weapon Works Class 4 SRM launcher handles close-range engagements. All weapons are managed through an advanced fire control system that grants accuracy on par with military-grade BattleMechs.</p><p>Learning from the original Inquisitor's most criticized flaw, the Inquisitor II incorporates CASE II protection for its ammunition stores, significantly improving pilot survivability in the event of an ammunition detonation.</p>
deployment: |-
  <p>The base ITW-200 model serves as Irian BattleMechs Unlimited's proprietary security platform, deployed exclusively to protect the corporation's extensive network of 'Mech and vehicle production facilities. Its TSEMP cannon gives facility security teams an anti-'Mech capability that the lighter Inquisitor could never match, allowing a single Inquisitor II to potentially neutralize a hostile BattleMech attempting to breach a factory perimeter. The McCall Home-20 CommoRig provides enhanced coordination capabilities befitting the design's role as a centerpiece of corporate security operations.</p>
history: |-
  <p>The Inquisitor II emerged from Irian BattleMechs Unlimited's assessment that evolving threats to corporate infrastructure demanded a more capable security platform than the original Inquisitor could provide. As raiding and piracy intensified during the Dark Age, particularly after the collapse of the HPG network and the subsequent breakdown of centralized authority, factory complexes became increasingly attractive targets for desperate military forces and organized banditry. The 35-ton Inquisitor, while effective against conventional criminal threats, lacked the firepower to deter or engage militarized opponents.</p><p>The introduction of the Inquisitor II during the Republic era represented a significant investment by Irian BattleMechs Unlimited in self-defense capability. The inclusion of a TSEMP cannon (technology typically reserved for military applications) signaled the megacorporation's willingness to push the boundaries of what constituted acceptable corporate security hardware. The weapon's ability to disable enemy 'Mechs without causing permanent structural damage aligned well with the corporate philosophy of neutralizing threats while minimizing collateral damage to valuable industrial infrastructure.</p><p>Production has remained centered on Irian throughout the design's operational history. The factory weathered political transitions from the Republic of the Sphere through the brief period of independence during the early Dark Age before returning to Free Worlds League control. Through each transition, the Inquisitor II has continued to serve its primary role as guardian of Irian Technologies' industrial assets, with the ITW-200 remaining a proprietary design while the Peacemaker variant has been offered to external customers seeking similar anti-'Mech security capability.</p>
