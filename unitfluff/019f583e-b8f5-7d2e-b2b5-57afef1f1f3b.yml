chassis: "Mechanized Wheeled Platoon (CCAF)"
model: "(Rifle 3055+)"
overview: |-
  <p>Capellan infantry serve where BattleMechs and armor cannot be spared, which in the resource-constrained CCAF means nearly everywhere. The Xin Sheng movement revitalized the infantry arm alongside every other facet of the Capellan Confederation Armed Forces, giving foot soldiers better equipment and renewed purpose. Mechanized wheeled platoons balance speed and infantry presence, using armored wheeled transports to move troops quickly along the Confederation's road networks. They sacrifice the cross-country capability of tracked vehicles for faster transit between defensive positions. Equipped with Striker carbines that offer improved accuracy and handling over older assault rifle designs, these platoons benefit from the Confederation's post-Xin Sheng modernization of personal arms.</p>
