chassis: "Carrion Crow"
model: "Prime"
overview: |-
  <p>The Carrion Crow is a forty-ton Clan OmniMech introduced in 3145 by the Snow Raven Industrial Complex Beta on Mitchella. Designed in tandem with the heavier War Crow, the Carrion Crow was conceived as part of Khan Sterling McKenna's initiative to rebuild and modernize the Clan Snow Raven touman in anticipation of future conflicts threatening the Raven Alliance. Deliberately concealed from Alliance Military Corps production-sharing agreements, the design was kept exclusively for the Raven touman from the outset. The Carrion Crow was intended to serve as the standard medium 'Mech for frontline formations, filling the role of a versatile striker capable of engaging targets well above its weight class.</p>
capabilities: |-
  <p>Built on a Raven WC2 endo steel chassis and powered by a Type 280 Extralight fusion engine, the Carrion Crow achieves a maximum speed of 118 kilometers per hour, making it one of the faster medium OmniMechs in Clan service. The design forgoes jump jets on the base chassis, relying instead on raw speed and advanced protection to fulfill its role. Nine and a half tons of Compound LZ-7 ferro-lamellor armor provide exceptional resistance to damage for a forty-ton 'Mech, with the advanced lamellor composition proving particularly effective at dispersing kinetic energy from ballistic impacts.</p><p>The generous 14.5 tons of pod space allows the Carrion Crow to mount firepower more commonly associated with heavier designs, punching well above its weight class in most configurations. In its Primary configuration, an ER PPC paired with a PPC capacitor delivers devastating alpha strikes, supplemented by improved heavy medium lasers in each side torso and an ER small laser for close defense. An engine supercharger pushes sprint speeds to approximately 140 kilometers per hour, giving pilots the ability to rapidly reposition or close to engagement range. The asymmetric weight distribution of the chassis can make handling unpredictable at speed, though this is partially offset by precise short-range targeting systems that enhance accuracy in close engagements.</p>
deployment: |-
  <p>The Primary configuration emphasizes ranged striking power with an ER PPC enhanced by a PPC capacitor as its centerpiece weapon. Improved heavy medium lasers in each side torso and a head-mounted ER small laser provide supplementary firepower at closer ranges. An engine supercharger allows the Carrion Crow to sprint at speeds approaching 140 kilometers per hour, enabling rapid flanking maneuvers and hit-and-run tactics. Four additional double heat sinks manage the considerable thermal load generated by the energy-heavy weapons suite, bringing the total to fourteen. This configuration embodies the Carrion Crow's designed role as a fast, hard-hitting striker that can deliver devastating fire and quickly withdraw before heavier opponents can respond.</p>
history: |-
  <p>The Carrion Crow emerged from Clan Snow Raven's extensive military modernization program initiated by Khan Sterling McKenna in the early 3140s. Recognizing that the Raven Alliance faced potential threats from both the Rasalhague Dominion and other regional powers, McKenna authorized the simultaneous development of two new OmniMechs at the Snow Raven Industrial Complex Beta on Mitchella. While the larger War Crow was presented to the Alliance Military Corps as a centerpiece of new military production sharing agreements, McKenna deliberately concealed the Carrion Crow's existence during negotiations, dismissing it as an insignificant secondary project.</p><p>This deception proved enormously beneficial to the Snow Raven touman. By keeping the Carrion Crow exclusively for Clan use and outside the production-sharing obligations with the Alliance Military Corps, the Snow Ravens were able to triple the design's projected production rate. The rapid buildup of Carrion Crow forces gave the touman a significant increase in fast medium OmniMech strength without drawing attention from Alliance oversight.</p><p>The design's shakedown trials took place in January 3146 during a strike against Rasalhague Dominion forces on Idlewind. The Ravens initially trialed for a supply depot, but the engagement escalated when Dominion commanders raised the stakes to include a Star of the new 'Mechs. Fighting in the Bostow Swamp against a mixed Dominion force of hovercraft and light BattleMechs, the Carrion Crows demonstrated their tactical versatility. Working in concert with War Crows, they employed what became known as the "murder of Crows" formation (a five-pointed star encirclement tactic with the enemy trapped in the center) to devastating effect. The engagement confirmed the viability of the paired OmniMech doctrine and led to the finalization of several standard configurations.</p><p>By 3150, individual Carrion Crow pilots had begun proving the design's worth in Trial combat, with the ferro-lamellor armor repeatedly demonstrating its ability to absorb punishment far beyond what opposing MechWarriors expected from a medium-weight frame. The design's resourceful deployment within the Snow Raven touman continues to strengthen the Raven Alliance's military position without alerting external observers to the full extent of its expanded production capabilities.</p>
