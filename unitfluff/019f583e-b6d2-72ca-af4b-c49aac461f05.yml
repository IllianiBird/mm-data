chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled AC5 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing medium autocannon that balance range and hitting power, these field gun crews provide flexible direct fire support effective against both infantry positions and light vehicles.</p>
