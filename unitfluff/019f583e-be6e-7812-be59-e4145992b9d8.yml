chassis: "Foot Duplus Contubernium (MHAF)"
model: "(Laser 3049+)"
overview: |-
  <p>The Marian Hegemony Armed Forces organize their conventional infantry along Roman legionary lines, with formations structured into contubernia, centuries, and cohorts rather than the squads and platoons used by Inner Sphere armies. A duplus contubernium, or double tent-group, fields two squads of ten soldiers and serves as the standard patrol and security element within Marian garrison forces. Foot duplus contubernia hold ground, man defensive positions, and conduct area security operations across Hegemony worlds. Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these formations field one of the most effective personal arms available to conventional infantry, though the weapons require soldiers to carry additional power packs.</p>
