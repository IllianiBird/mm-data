chassis: "Field Artillery Century (MHAF)"
model: "(Motorized Long Tom)"
overview: |-
  <p>Infantry within the Legiones Marianes form the backbone of planetary garrison and territorial defense, freeing the Hegemony's limited BattleMech assets for offensive operations and prestige assignments. Marian field artillery centuries operate indirect fire weapons that deliver area bombardment at ranges measured in kilometers, providing the Legiones Marianes with fire support capability independent of their scarce aerospace assets. The century operates a Long Tom artillery piece, the heaviest field artillery available to infantry formations, capable of devastating bombardment that can flatten structures and destroy vehicles across a wide impact area.</p>
