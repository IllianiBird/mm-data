chassis: "Field Artillery Platoon (AFFS)"
model: "(Motorized Thumper 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing Thumper artillery pieces, these platoons provide light indirect fire support that disrupts enemy formations and suppresses defensive positions at ranges well beyond direct-fire weapons.</p>
