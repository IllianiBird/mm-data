chassis: "Mechanized Hover Century (MHAF)"
model: "(SRM 3049+)"
overview: |-
  <p>Infantry within the Legiones Marianes form the backbone of planetary garrison and territorial defense, freeing the Hegemony's limited BattleMech assets for offensive operations and prestige assignments. A centuria, or century, is the Marian equivalent of a company-sized formation. Mechanized hover centuries mount their troops in hovercraft that provide the fastest ground transport available to Marian infantry, capable of crossing water obstacles and open ground at speeds that wheeled or tracked vehicles cannot match. Support elements carry man-portable short-range missile launchers firing the same warheads used by BattleMechs, giving the formation a potent anti-armor punch at close range.</p>
