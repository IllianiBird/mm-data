chassis: "Rifleman IIC"
model: "2"
overview: |-
  <p>The Rifleman IIC represents the culmination of nearly two centuries of Clan trial and error to perfect the venerable Rifleman chassis. Where the Inner Sphere design epitomized a "best compromise" of weapons and armor that never fully satisfied its critics, the Clans examined the problem from a fresh perspective and largely resolved the overheating and armor deficiencies inherent in the original. By adding five tons of mass and incorporating superior Clan technology, engineers created a platform that finally delivered on the Rifleman's anti-aircraft promise.</p><p>An ancient rebuild of an already ancient design, the Rifleman IIC has soldiered on throughout the centuries. The 'Mech serves with most Clans (a notable exception being Clan Wolf, which prefers the Glass Spider) and has found markets among several Inner Sphere powers. Mountain Wolf BattleMechs on Alpheratz recently began building the design for the Raven Alliance Military Corps, demonstrating the continued demand for this proven anti-aircraft platform. Its simplicity is matched only by its effectiveness, and new variants continue to debut as manufacturers explore different weapon configurations while maintaining the core air-denial mission.</p>
capabilities: |-
  <p>Visually, the Clan Rifleman looks nothing like the traditional outline Inner Sphere MechWarriors recognize. Like its smaller brother, it mounts a large rotating radar array over its head, but the IIC variant's sensor package is mounted much higher, with twin box-like appendages fitted on either side of the central support pylon. Close analysis of battlefield scans revealed this unusual configuration operates as a phased array acting in tandem with the main array, though the full benefits of this arrangement warrant further study. The sophisticated GH D5j targeting system with integrated Active Probe can switch rapidly between ground engagements and the fluid realm of aerospace combat, providing protection against fighter strikes without compromising offensive capability.</p><p>The standard configuration mounts four Kolibri Delta Series Large Pulse Lasers, offering simple, accurate firepower that requires no ammunition supply. MechWarriors who have faced the Rifleman IIC report that it is impossible to close quickly enough with this 'Mech, as it will often strip an opponent's armor before they can reach close-combat range. A single Series 1b ER Small Laser serves as a backup weapon. Nineteen double heat sinks keep heat mostly in check, though pilots should employ volley fire during sustained engagements. Three "Highlifter" 44 jump jets propel the sixty-five-ton chassis up to ninety meters per leap, providing tactical mobility the original Rifleman never possessed. Eleven tons of Forging Z5 ferro-fibrous armor on a CCo-B Endo Steel frame maximizes protection, and many garrison MechWarriors appreciate the extra cockpit protection provided by the well-armored sensor package that forms the design's distinctive "helmet."</p>
deployment: |-
  <p>The Rifleman IIC 2 stands as a radical departure from the base configuration, replacing all energy weapons with quad Ultra Autocannon/2s fed by six tons of ammunition. A larger engine increases top speed to sixty-four kilometers per hour, improving tactical flexibility. The ballistic-focused loadout excels at sustained harassment fire from extreme range, with the ultra-fire capability allowing pilots to double their output when opportunities present themselves. MechWarriors must remain vigilant about the vulnerable ammunition bays, however, as catastrophic detonation remains an ever-present concern with such deep magazine stores.</p>
history: |-
  <p>The Rifleman IIC was first observed as part of Clan Nova Cat forces during the initial invasion, but has since been seen in all the Clans with which the Inner Sphere has come into contact. The 'Mech forms a common sight in Clan garrison units, serving as the first line of defense against air attack. The main variant on the Rifleman IIC appeared first with the Smoke Jaguar Clan and has since been spotted among other garrison forces. Designated the IIC 2, this version takes a more conservative approach to the anti-aircraft role, using a larger 260-rated engine to retain standard Rifleman performance while eliminating the ferro-fibrous armor in favor of two additional tons of standard plating. Four Ultra Autocannon/2s with 135 rounds of ammunition stored in CASE-fitted torso sections provide formidable sustained firepower.</p><p>Clan Cloud Cobra upgraded their aging Rifleman IICs following the surprise invasion of Huntress, introducing the IIC 3 variant in early 3062 with Heavy Large Lasers that deliver a nasty surprise to enemies expecting the standard pulse configuration. Mountain Wolf BattleMechs' newly refurbished factory on Alpheratz began building the base design for the Alliance Military Corps, giving second-line units access to Clan technologies against pirates and border threats. When bandits struck Prinis Prime using local collaborators to disable AMC aerospace contingents, a lance of new Rifleman IICs appeared and rendered the pirate command lance to slag in moments. Similar actions on Suianheer and Risin have sent clear signals to opportunists along the Alliance border.</p><p>The Diamond Sharks collaborated with Federated Suns interests to develop the IIC 8, whose ECM capabilities and 86 kph speed proved troublesome for Inner Sphere defenders on New Earth during the Jihad. An unusual action occurred on Ballalaba, where Marian Hegemony forces fought to stave off a Canopian counterattack. One century of IV Prima, under Centurion Wozniak's command, held off repeated charges by the Second Canopian Light Horse for several days using archaic Rifleman IICs that were nonetheless cutting-edge for the tech-limited Marian forces. Wozniak's Stand became a heavily propagandized bright spot during an otherwise bleak period for the Hegemony, and a daring nighttime raid later freed the centurion from Canopian captors.</p><p>Clan Nova Cat introduced the IIC 7 in 3078 with heavy lasers and plasma cannons linked to a targeting computer, while Star Adder's IIC 6 mounting twin HAG-30s reportedly remained in the Clan Homeworlds and may be apocryphal. The Raven Alliance's recent IIC 9 variant uses coolant pods to handle alpha strike heat with reflective armor providing protection against energy weapons, while their IIC 10 mounts ProtoMech autocannons in a curious short-range configuration that analysts consider a conceptual failure. Both the Draconis Combine and Duchy of Oriente have acquired various Rifleman IIC models in small numbers, ensuring this ancient Clan design continues finding new markets throughout the Inner Sphere.</p>
