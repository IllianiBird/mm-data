chassis: "Mechanized Tracked Century (MHAF)"
model: "(SRM 3049+)"
overview: |-
  <p>The Marian military tradition places infantry at the foundation of its legionary system, with conventional soldiers organized into units bearing Latin designations that reflect the Hegemony's deliberate cultivation of Roman imperial identity. A centuria, or century, is the Marian equivalent of a company-sized formation. Mechanized tracked centuries ride armored personnel carriers that trade speed for all-terrain capability, providing reliable transport across the rough ground common to many Hegemony garrison worlds. Support elements carry man-portable short-range missile launchers firing the same warheads used by BattleMechs, giving the formation a potent anti-armor punch at close range.</p>
