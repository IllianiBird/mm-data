chassis: "Ryoken II"
model: "2"
overview: |-
  <p>The Ryoken II is a 75-ton heavy BattleMech produced by Bergan Industries on Alshain, first entering service in 3075. After the success of the Mad Cat Mk II design, which increased the tonnage and weaponry of the original Mad Cat, Clan Ghost Bear applied the same upscaling concept to the medium-weight Stormcrow. The result retains the Stormcrow's general configuration philosophy while adding twenty tons of additional mass for heavier weapons, greater armor protection, and increased ammunition capacity. Unlike its OmniMech ancestor, the Ryoken II is a standard BattleMech with fixed weapon configurations, a design choice that reduced manufacturing complexity during a period of severe industrial strain for the Ghost Bear Dominion.</p>
capabilities: |-
  <p>The Ryoken II is slower than its Stormcrow antecedent, reaching only 87 km/h, though the additional twenty tons of chassis weight provide substantially more capacity for equipment and weapons. Built on a DSAM ENDO 5 endo steel chassis and powered by a GM 375 XL engine, the design is protected by thirteen and a half tons of Forging ZK20 armor, offering a significant improvement in survivability over the lighter Stormcrow.</p><p>As a standard BattleMech rather than an OmniMech, the Ryoken II uses fixed weapon configurations that cannot be reconfigured in the field. This design choice reduced manufacturing complexity and allowed Bergan Industries to produce the design in greater numbers during the Jihad, when the Rasalhague Dominion's industrial capacity was under severe strain. The trade-off is a loss of the tactical flexibility that made the Stormcrow so effective, requiring commanders to select the appropriate variant for anticipated mission requirements before deployment. The XL engine also carries the same vulnerability to side torso penetration as the Stormcrow, a persistent weakness in this design lineage.</p>
deployment: |-
  <p>This variant is better suited to close range work and was introduced during the Jihad. It trades the autocannons for a pair of Ultra Autocannon/10s and four tons of ammunition for them. Though ammo stores are still limited, this variant is more likely to succeed in greatly damaging its opponent before the stores run out. This is also more imperative, as it mounts two tons less armor.</p>
history: |-
  <p>Following the success of Clan Diamond Shark's Mad Cat Mk II, which upscaled the 75-ton Mad Cat to an 85-ton assault chassis, Clan Ghost Bear applied the same concept to its widely fielded Stormcrow. The result was the Ryoken II, a 75-ton heavy BattleMech that first walked off the assembly line at Bergan Industries on Alshain in 3075, during the Word of Blake Jihad.</p><p>When the Ghost Bears later decided to sell some Ryoken IIs to the Republic of the Sphere, the decision provoked anger among several Clans. Clan Hell's Horses, the original creators of the Corvis and Omni-Corvis designs from which the entire Ryoken lineage descended, filed multiple Trials of Grievance over what they viewed as commercialization of their intellectual heritage. A Hell's Horses variant, the Ryoken II 3, was subsequently developed, mounting paired HAG/20s as a reflection of the Horses' preference for overwhelming ballistic firepower. The design has since become a mainstay of the Rasalhague Dominion's heavy BattleMech forces.</p>
