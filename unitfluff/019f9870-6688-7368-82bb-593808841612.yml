chassis: "Motorized Squad (Generic)"
model: "(Rifle Light 2200+)"
overview: |-
  <p>Motorized infantry platoons use light ground vehicles, typically motorcycles or utility trucks, for rapid movement between positions. Faster than foot infantry and cheaper than fully mechanized formations, motorized platoons fill the gap between static garrison troops and armored combat units. They excel at road-bound patrol routes, rapid redeployment along prepared axes, and screening operations where speed matters more than protection. Off-road performance depends heavily on terrain and vehicle type, and the troops must dismount to fight, leaving their transport vulnerable.</p><p>Ad-hoc armed forces, from pirate gangs to remote militias, often struggle to field the structured forces commonly found in the larger state commands. The worst equipped are armed with whatever long arms are on hand, posing a challenge in ensuring they are supplied with appropriate ammunition.</p>
