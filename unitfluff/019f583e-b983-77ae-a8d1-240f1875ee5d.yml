chassis: "Field Gun Level I (ComGuards)"
model: "(Wheeled LAC5)"
overview: |-
  <p>The Com Guards field conventional infantry as a core component of their combined-arms formations, with Level I infantry units integrated into the same command structure alongside BattleMech, armor, and aerospace elements at every organizational level. Crewing light-class medium autocannon that balance range, hitting power, and ammunition economy, these gunners provide reliable direct fire support across a wider engagement envelope than standard autocannon of comparable weight.</p>
