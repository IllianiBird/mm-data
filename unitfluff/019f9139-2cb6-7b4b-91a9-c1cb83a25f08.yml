chassis: "Mechanized Tracked Platoon (Generic)"
model: "(MG Heavy 2315+)"
overview: |-
  <p>Mechanized tracked platoons move their infantry in armored personnel carriers fitted with tracks for reliable all-terrain performance. Tracked APCs handle mud, snow, rubble, and rough ground better than any wheeled or hover alternative, making these platoons the preferred mechanized infantry for operations where terrain is uncertain or hostile. They sacrifice road speed compared to wheeled formations but gain the ability to keep pace with armored vehicles across broken ground. The APCs provide meaningful ballistic protection during transit, though troops must still dismount to fight effectively.</p><p>Taking full advantage of the carrying capacity of the fighting vehicles, these platoons carry support machine guns to provide heavy firepower against a variety of targets in both offensive and defensive roles. Some are equipped with up-armored vehicles and heavier body armor, allowing these teams to assault well protected objectives and hold critical positions as long as possible.<p>
