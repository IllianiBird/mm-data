chassis: "Foot demi-I (Domini)"
model: "(Flamer)"
overview: |-
  <p>The Manei Domini field cybernetically enhanced infantry whose augmentations place them well beyond the capability of any conventional soldier, blurring the line between human combatant and war machine. Domini foot infantry operate as small, self-contained kill teams whose cybernetic enhancements compensate for their reduced squad sizes. Each trooper carries augmentations that make them individually more dangerous than a full squad of conventional soldiers. Armed with man-portable flamers that project streams of ignited fuel, these troops carry one of the most psychologically devastating weapons available to conventional infantry, effective at clearing fortified positions and enclosed spaces at the cost of extreme danger to the operator.</p>
