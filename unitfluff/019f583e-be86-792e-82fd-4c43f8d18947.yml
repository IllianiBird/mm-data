chassis: "Foot Triplus Contubernium (MHAF)"
model: "(Rifle 3049+)"
overview: |-
  <p>Infantry within the Legiones Marianes form the backbone of planetary garrison and territorial defense, freeing the Hegemony's limited BattleMech assets for offensive operations and prestige assignments. A triplus contubernium, or triple tent-group, combines three squads of ten into the Marian equivalent of a standard Inner Sphere platoon. Foot triplus contubernia form the primary garrison infantry of the Hegemony, holding defensive lines and providing the manpower that auxiliary legions depend on for territorial control. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon available, these formations deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
