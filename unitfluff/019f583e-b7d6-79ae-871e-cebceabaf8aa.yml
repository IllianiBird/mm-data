chassis: "Field Artillery Platoon (CCAF)"
model: "(Tracked Arrow IV 3055+)"
overview: |-
  <p>The CCAF fields conventional infantry in larger numbers than its limited industrial base might suggest, drawing on the Confederation's deep tradition of citizens' militia service. Capellan soldiers learn to fight with fewer resources and less support than their counterparts in wealthier states, compensating with resourcefulness and ideological commitment. Field artillery platoons give CCAF ground commanders organic indirect fire support without requiring dedicated artillery vehicles. Operating crew-served tube or missile artillery pieces from mechanized transports, these platoons can displace and redeploy faster than vehicle-mounted artillery at the cost of lower rates of fire and less ammunition. Operating an Arrow IV missile artillery system, these platoons provide precision-guided indirect fire capable of engaging targets at extreme range, with the added capability of homing munitions when paired with TAG-equipped spotters.</p>
