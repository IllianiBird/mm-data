chassis: "Thanatos"
model: "TNS-7D"
overview: |-
  <p>The Thanatos was developed by StarCorps Industries as a seventy-five ton OmniMech intended to emulate the Clan Summoner. After years of producing licensed OmniMechs from Luthien Armor Works on four worlds in the Federated Commonwealth and St. Ives Compact, StarCorps had gained sufficient expertise to design their own Omni-technology platforms by 3060. When neither the LAAF nor the AFFS expressed interest in another OmniMech design, citing high costs and the availability of existing models, StarCorps converted the Thanatos into a standard BattleMech. This pragmatic decision won contracts from both militaries beginning in 3061.</p><p>Produced at StarCorps facilities on Crofton and Loburg, the Thanatos filled the role of a heavy cavalry platform, offering a blend of speed, firepower, and electronic warfare capability that kept it in production through the Jihad, Dark Age, and into the ilClan era.</p>
capabilities: |-
  <p>Taking design cues from the Clan Thor, the Thanatos is built on a StarFrame Heavy Endo Steel chassis and powered by a PlasmaStar 375 Extra Light engine, giving it a top speed of 86 kph, fast for a heavy BattleMech. Five Audi-Fokker Mark IV jump jets provide an additional 150 meters of jumping capability. The internal components and electronics systems are heavily reinforced and stabilized, giving the chassis excellent resistance to rough terrain and combat impacts. Thirteen tons of Durallex Heavy armor provide solid protection for its weight class, though the extra-light engine remains a vulnerability if either side torso is breached.</p><p>The weapons array is weighted toward medium and short range engagements. A Defiance Model 6 extended-range large laser provides long-range reach, while a Shigunga MRM-20 launcher and two Defiance Model XII extended-range medium lasers deliver punishing firepower at closer ranges. A RAMTech 800P medium pulse laser adds accurate close-range fire. A Guardian ECM suite disrupts enemy electronics, while a C3 slave unit dramatically improves accuracy when operating as part of a networked lance.</p>
deployment: |-
  <p>Developed in 3146 by Republic Armed Forces technicians during a stopover on Terra, this variant was subsequently put into production by StarCorps on Crofton for the AFFS. The variant retains the original's chassis, engine, and jump jets but replaces the entire weapons suite with Clan-specification equipment. Exostar Pinnacle lasers, including a large pulse laser, two extended-range medium lasers, and a medium pulse laser, are paired with a Type XX "Great Bow" LRM-20 launcher. The Guardian ECM suite and C3 slave are retained, and CASE II protects the missile ammunition. An advanced electronics package enhances weapon accuracy while shielding against enemy targeting systems.</p>
history: |-
  <p>The Thanatos traces its origins to StarCorps Industries' experience producing licensed OmniMechs from Luthien Armor Works. By 3060, StarCorps was manufacturing Black Hawk KUs, Avatars, and Sunders across four worlds, building the institutional knowledge necessary to design their own Omni-technology platforms. The Thanatos emerged alongside the Manteuffel OmniVehicle as the first fruits of this initiative. When neither the LAAF nor the AFFS expressed interest in the OmniMech version, StarCorps converted it into a standard BattleMech, a decision that proved shrewd, winning contracts from both militaries that carried production from 3061 into the next decade.</p><p>The Thanatos found its niche in heavy cavalry formations, operating alongside similarly fast designs like the Argus, Barghest, Falconer, and Rakshasa. It displaced aging Quickdraws in units such as the First Federated Suns Armored Cavalry and the Alliance Jaegers. StarCorps also marketed the design to mercenary commands, with buyers ranging from the prestigious Eridani Light Horse to smaller outfits.</p><p>Production survived the Jihad at both the Crofton and Loburg facilities. The Jihad era produced the TNS-6T refit, which replaced the original's missile and laser loadout with a snub-nose PPC and multi-missile launcher. Both factories began producing the -6T as a standard model during the 3080s, with Loburg also offering the CASE II-equipped TNS-6S2 subvariant.</p><p>During the Dark Age, the Thanatos continued to serve the Armed Forces of the Federated Suns and the Lyran Commonwealth Armed Forces. In 3146, Republic Armed Forces technicians developed an upgraded variant using Clan-specification weapons during a stopover on Terra. These specifications were passed to StarCorps on Crofton, which began producing the TNS-7D for the AFFS, featuring an all-ClanTech weapons suite that dramatically improved the design's reach and accuracy. StarCorps subsequently offered the TNS-7D2 subvariant, trading electronic warfare capability for an Artemis V fire-control system.</p><p>Though some observers considered the Thanatos as never quite fulfilling the potential StarCorps originally envisioned, the design proved durable and adaptable enough to remain in continuous production for nearly a century, a reflection of the soundness of its underlying chassis and the flexibility of its weapon bays.</p>
