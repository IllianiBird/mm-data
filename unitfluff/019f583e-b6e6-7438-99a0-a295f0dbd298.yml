chassis: "Foot Platoon (AFFS)"
model: "(Flamer 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Foot infantry remain the backbone of AFFS planetary garrisons, cheap enough to deploy in numbers across the Federated Suns' vast territory and reliable enough to hold ground that BattleMech forces cannot permanently occupy. Carrying man-portable flamers that project streams of burning accelerant, these platoons are equipped for area denial and anti-infantry work, able to clear defensive positions and flush enemies from fortified structures.</p>
