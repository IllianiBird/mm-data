chassis: "Ursus II"
overview: |-
  <p>The Ursus II is a Clan medium BattleMech jointly developed by Bergan Industries of Alshain and Arc-Royal MechWorks of Arc-Royal. First produced in 3078, the design grew from Bergan Industries' ambition to expand its influence as one of the few Inner Sphere facilities capable of producing Clan-technology 'Mechs. Based on the Ghost Bears' proven second-line Ursus, the Ursus II incorporated significant design changes to create a more versatile bodyguard platform.</p><p>Early production units were rushed to formations participating in the final liberation of Terra, establishing the design's reputation as a dependable escort for heavier, more valuable 'Mechs. The partnership with Arc-Royal MechWorks reflected the unique political relationship between Clan Ghost Bear and the Clan Wolf-in-Exile enclave on Arc-Royal, providing a second production source that broadened the design's availability beyond the Rasalhague Dominion.</p>
capabilities: |-
  <p>The Ursus II retains the original Ursus's 200-rated engine but replaces the standard model with a Firebox XL variant to save weight, accepting reduced survivability for improved payload capacity. Where the original Ursus sacrificed speed for raw protection, the Ursus II compensates with Leaper Model L5 improved jump jets that grant superior tactical mobility, allowing the 'Mech to navigate rough terrain and maintain escort positions effectively.</p><p>The weapons array balances long and short-range engagement options. A Series 7K extended-range large laser and Artemis IV-guided Type X LRM-10 provide accurate fire at distance, while two Kolibri Delta Series medium pulse lasers, a Smartshot Mk VI Streak SRM-6, and a pair of Series 1g extended-range small lasers handle close-range threats. Both missile systems carry a single ton of ammunition protected by CASE. An integrated ECM suite enhances the bodyguard role by disrupting enemy electronics targeting the 'Mech's charge.</p><p>The Ursus II's heat management requires careful attention, as its thirteen double heat sinks cannot sustain simultaneous fire from all weapons systems. Pilots must exercise discipline in weapons selection, choosing engagements carefully to avoid overheating. Ten and a half tons of Royal-7 standard armor provides solid protection, trading the original's ferro-fibrous for simplified logistics.</p>
deployment: |-
  <p>The base Ursus II entered service in 3078, with early production units assigned to formations participating in the final stages of the liberation of Terra from the Word of Blake. Jointly produced by Bergan Industries on Alshain and Arc-Royal MechWorks on Arc-Royal, the design was conceived as a dedicated bodyguard 'Mech. The Firebox 200 XL engine trades the durability of the original Ursus's standard engine for weight savings that enable improved jump jets and a comprehensive missile suite with Artemis IV and Streak guidance systems. An ECM suite enhances the escort role by shielding both the Ursus II and nearby assets from electronic targeting. No factory variants of the Ursus II are currently produced, reflecting operators' satisfaction with the base configuration for its intended escort mission.</p>
history: |-
  <p>The Ursus II emerged from the convergence of political ambition and military necessity during the closing stages of the Jihad. Bergan Industries, having established itself as a rare Inner Sphere producer of Clan-technology BattleMechs through the original Ursus program, sought to expand its market presence. The company partnered with Arc-Royal MechWorks, leveraging the Wolf-in-Exile enclave's own experience with Clan technology to co-develop a redesigned Ursus variant. This collaboration was notable for bridging two very different Clan-affiliated factions, the Ghost Bears and the exiled Wolves, through shared commercial interest.</p><p>The Ursus II entered production in 3078, with early units dispatched to forces participating in the liberation of Terra from the Word of Blake. The design was conceived as a bodyguard unit, filling an escort role alongside heavier, more valuable 'Mechs that needed close protection from flanking attacks and enemy light forces.</p><p>Production at both the Alshain and Arc-Royal facilities continued through the early Republic era and into the Dark Age. The dual production arrangement ensured the Ursus II reached formations beyond the traditional Ghost Bear sphere of influence, with Arc-Royal MechWorks supplying units to Lyran and Wolf-in-Exile commands. As the political environment shifted through the Republic era and the subsequent Dark Age, both factories maintained active production, with the Rasalhague Dominion and the Arc-Royal coalition continuing to field the design.</p><p>The Ursus II's lack of factory variants speaks to the satisfaction of its operators, who found the base design sufficient for its intended bodyguard role without requiring modification. By the ilClan era, both production lines remained active under their respective successor states, the Rasalhague Dominion and the Arc-Royal Liberty coalition.</p>
