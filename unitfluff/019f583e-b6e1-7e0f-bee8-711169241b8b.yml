chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled UAC2 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing ultra autocannon capable of double-rate fire, these field gun crews deliver rapid-fire direct support that doubles their effective output during critical engagements.</p>
