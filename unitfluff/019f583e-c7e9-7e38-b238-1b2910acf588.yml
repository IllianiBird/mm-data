chassis: "Hollander"
model: "BZK-G1"
overview: |-
  <p>The Hollander was introduced in 3054, born from Coventry Metal Works' response to a Federated Commonwealth commission seeking a light 'Mech capable of matching Clan firepower at range. The AFFC had evaluated numerous designs featuring PPCs and LRM systems, but Coventry's unorthodox proposal to mount a full-sized Gauss rifle on a thirty-five-ton chassis won the contract. Though the resulting design required significant compromises in armor, speed, and secondary armament, the Hollander delivered on its promise of providing Inner Sphere commanders with a light hunter-killer capable of destroying enemy light 'Mechs with a single devastating shot at extreme range. Cheap to produce and effective in its specialized role, the Hollander saw widespread adoption across Lyran and FedCom-employed units, with prominent mercenary commands also receiving shipments. The design's success spawned several variant lines attempting to address its inherent limitations while preserving its core philosophy.</p>
capabilities: |-
  <p>Essentially a walking cannon, the Hollander's design is as extreme as it is straightforward. The entire chassis and structure were developed expressly to carry a single Poland Main Model A Gauss rifle, with every other consideration subordinated to that goal. Coventry engineers employed an endo-steel internal structure and ferro-fibrous armor to maximize weight savings, though even these advanced materials forced painful compromises elsewhere. The seven-ton Omni 175 standard engine limits the 'Mech to a top speed of just eighty-six kilometers per hour (comparable to a Clan heavy 'Mech) while only four tons of Lexington Limited ferro-fibrous armor leave the design dangerously vulnerable to return fire.</p><p>The Hollander carries no secondary weapons whatsoever, and its two tons of Gauss ammunition provide only sixteen shots before the MechWarrior is left completely defenseless. These limitations are accepted because the design excels at its intended role: delivering crippling long-range fire from the battlefield's edge. Heavily reinforced legs fitted with recoil compensators and support hydraulics allow the 'Mech to fire accurately even at a full run. So long as ammunition holds out and the pilot maintains standoff distance, the Hollander poses a genuine threat to targets well above its weight class.</p>
deployment: |-
  <p>Introduced in 3056, this variant directly addresses the most persistent criticism of the original Hollander: its complete lack of secondary armament. The Gauss rifle is replaced with a lighter LB 10-X autocannon, freeing sufficient weight to mount two arm-mounted Defiance B3M medium lasers and an additional two tons of ferro-fibrous armor. While sacrificing the devastating single-shot punch of the original, this variant gains significant tactical flexibility, proving particularly effective in anti-vehicle and anti-aircraft roles where the LB-X's cluster ammunition can be employed to devastating effect.</p>
history: |-
  <p>The Hollander emerged from the crucible of the Clan Invasion, with Coventry Metal Works receiving the AFFC contract in the early 3050s to produce a light 'Mech capable of matching Clan firepower at range. The design drew direct inspiration from the Kit Fox OmniMech's Gauss-armed configuration, and Coventry's engineers sought to replicate that capability on an affordable Inner Sphere chassis. Production began in 3054 at Coventry Metal Works on the Lyran world of Coventry.</p><p>The first production runs went directly to frontline units facing Clan Jade Falcon, with the Seventeenth Skye Rangers deploying them on Barcelona and the First Kearny Highlanders fielding them on Mogyorod. The design proved effective enough that shipments quickly expanded to additional Lyran, FedCom, and mercenary commands throughout the Clan Invasion era. Despite its battlefield success, the Hollander's severe limitations drove continuous development, with the BZK-G1 appearing in 3056 offering improved versatility.</p><p>The Lyran Alliance's eventual frustration with the design's shortcomings led to the commission of the Blitzkrieg as a more capable successor, though the Hollander's low cost ensured its continued service with garrison and second-line units. The Jihad devastated Coventry's production capacity, with the factory falling under contested Lyran control and active Hollander production ceasing.</p><p>The design found renewed relevance in the Dark Age when field technicians began converting older Hollanders to the BZK-G2 configuration, inspired by General Motors' Hollander III program on Kathil. These refits extended the venerable chassis' service life well into the thirty-second century, ensuring that the Hollander's distinctive silhouette remained a presence on battlefields across the Inner Sphere.</p>
