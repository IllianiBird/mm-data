chassis: "Powerman"
model: "SC XVI HaulerMech"
overview: |-
  <p>The Powerman HaulerMech series was introduced in 2764 by Sitwell Corporation of Saiph. Designed as a direct competitor to Bluth Corporation's dominant Buster-class HaulerMechs, the thirty-five-ton Powerman took a fundamentally different approach to freight handling, employing a lighter and more agile chassis that could perform the same tasks faster and more reliably than the heavier Buster.</p><p>The Powerman's ability to unload a fully loaded Mule-class DropShip in a quarter less time than the Buster made it an instant favorite among freight companies and spaceport operators across the Inner Sphere. Produced by Sitwell Corporation on Saiph, the Powerman has remained in continuous service for over three centuries, outlasting not only its rival but the corporation that once dominated the industrial 'Mech market.</p>
capabilities: |-
  <p>The Powerman's competitive edge over the Buster stems from its durable nickel-steel alloy frame built on a PowerLift CXV chassis. Paired with the efficient Skobel 140 ICE power plant, the Powerman achieves a top speed of over sixty-four kilometers per hour, significantly faster than most industrial 'Mechs in its weight class. This combination of a lighter frame and a more responsive engine gives the Powerman the agility to maneuver through crowded cargo yards and DropShip bays with ease.</p><p>The standard SC XV configuration mounts two GripperTech lift hoists, one in each arm, allowing the 'Mech to handle cargo with precision and speed. Additional cargo capacity is provided by a pair of two-ton bays in the side torsos and a half-ton bay in the center torso. Two and a half tons of Hughes CommerWeave II commercial armor provide adequate protection against the routine hazards of heavy cargo work, though it offers minimal resistance to actual weapons fire. The Powerman carries no weapons and lacks a targeting system entirely, reflecting its purely civilian design philosophy. Its SineWave 5000 communications system provides sufficient coordination capability for cargo operations.</p>
deployment: |-
  <p>Introduced in 3068 on the eve of the Jihad, the SC XVI is Sitwell Corporation's latest factory modification package for the Powerman line. This variant replaces the left arm's lift hoist with a salvage arm apparatus, adapting the Powerman for use by salvage companies that need to handle damaged equipment and wreckage rather than standard cargo containers. The right arm retains its original lift hoist, giving the XVI a mixed-capability loadout suited to recovery operations. The modification proved immediately popular with salvage operators, representing a successful diversification of the Powerman platform beyond its traditional freight-hauling role.</p>
history: |-
  <p>The Powerman's origins lie in the bitter rivalry between Sitwell Corporation and Bluth Corporation. When Sitwell introduced the design in 2764, Bluth Corporation (which had dominated the HaulerMech market for over a century with its Buster class) immediately filed a massive lawsuit alleging theft of trade secrets and industrial espionage. The legal battle raged across thirteen star systems, clogging courts throughout the fall of the Star League and well into the First Succession War.</p><p>Sitwell ultimately prevailed after evidence surfaced of Bluth CEO George Bluth's involvement in treason, embezzlement, and a staggering number of safety violations. The resulting criminal proceedings destroyed Bluth Corporation as an interstellar entity, leaving only its Terran plant intact. Sitwell Corporation emerged as the dominant producer of freight-handling IndustrialMechs, with its Saiph facility continuing to produce the Powerman throughout the Succession Wars era.</p><p>During the upheaval of the Exodus and the Pentagon Civil Wars, militarized versions of the Powerman appeared on the Pentagon Worlds around 2801. Desperate factions armed every available platform, and technicians stripped the Powerman's cargo equipment to mount lasers, machine guns, or missile launchers. These crude modifications demonstrated the chassis's versatility, even if the results fell far short of true BattleMech performance.</p><p>Ownership of the Saiph production facility changed hands numerous times across the centuries, passing through Capellan Confederation, Federated Suns, and Federated Commonwealth control before falling under the Sarna March and then the Word of Blake during the Jihad. The Republic of the Sphere subsequently assumed control and leveraged its dominance of IndustrialMech production (including the Powerman line) as a diplomatic tool during the reconstruction era, distributing or withholding civilian equipment based on other states' willingness to support rebuilding efforts. The Powerman's proven chassis also served as the foundation for Sitwell Corporation's StrongArm ConstructionMech, introduced in 3094, demonstrating the enduring viability of the original design.</p>
