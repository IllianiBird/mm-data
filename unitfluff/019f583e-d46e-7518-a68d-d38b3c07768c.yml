chassis: "Omen"
model: "2"
overview: |-
  <p>The Omen is an 85-ton Clan assault BattleMech designed by Clan Snow Raven and first produced in 3087 at the Snow Raven Industrial Complex Alpha on Dante. Conceived in the aftermath of the Jihad, the Omen was developed as a conventional BattleMech that could be manufactured more quickly and in greater numbers than an OmniMech design, addressing the severe losses suffered during the Wars of Reaving and the Jihad itself. The Omen fills the role of an all-purpose garrison assault 'Mech within the Raven Alliance touman, earning a solid reputation as a dependable anchor for second-line formations tasked with defending the Alliance's vast territorial holdings.</p>
capabilities: |-
  <p>Built on a CSR Version 84.62 Standard chassis and powered by a Type 255 Extra-Light fusion engine, the Omen achieves a modest top speed of 54 km/h. While this makes it slow by Clan assault 'Mech standards, three Andoran Model JJ III jump jets compensate by providing 90 meters of tactical repositioning capability, allowing the 'Mech to exploit terrain advantages that would otherwise be inaccessible to a design of its weight class.</p><p>The Omen's weapon systems are designed for engagement across all range brackets. A Kolibri Delta Series Large Pulse Laser and a Type KOV LB 10-X Autocannon serve as the primary direct-fire weapons, capable of delivering accurate and sustained punishment at medium to long range. A Remer Series Alpha Deuce Advanced Tactical Missile-12 launcher provides exceptional tactical flexibility, with sufficient ammunition tonnage to carry a mix of warhead types suited to any combat situation. At closer ranges, paired Series 2d Extended Range Medium Lasers and 14a Medium Pulse Lasers give the Omen a devastating short-range punch. A head-mounted anti-missile system offers additional protection against incoming missile fire.</p><p>Defensively, the Omen carries sixteen and a half tons of Longanecker PlastiSteel standard armor with CASE-protected ammunition bins, making it exceptionally durable for a second-line design. The chief weakness lies in its limited heat dissipation, with only eighteen double heat sinks requiring MechWarriors to exercise careful fire discipline to avoid dangerous overheating.</p>
deployment: |-
  <p>Introduced in 3141, this variant trades raw firepower for improved survivability through the addition of HarJel III self-repair systems in each side torso. To accommodate this technology, engineers downgraded the primary missile launcher and reduced its ammunition supply, while removing some of the secondary laser armament and several heat sinks. This refit reflects the Raven Alliance's growing emphasis on keeping 'Mechs operational in sustained engagements far from established supply lines, a practical consideration given the Alliance's vast territorial holdings and limited repair infrastructure.</p>
history: |-
  <p>The Omen's development was driven by the Snow Ravens' precarious position following the Jihad. Having relocated the bulk of their forces to the Inner Sphere and merged politically with the Outworlds Alliance to form the Raven Alliance, the Clan found its ground forces stretched thin across a vast territory. The losses sustained during the Wars of Reaving and the Jihad itself had depleted the touman's BattleMech strength, particularly among the garrison and auxiliary Clusters responsible for defending Alliance space.</p><p>The Snow Raven scientist caste responded by developing a series of new second-line designs that could be built at the Clan's Dante production facilities without the extensive tooling and rare components demanded by OmniMech production. The Omen emerged alongside designs such as the Dark Crow and Goshawk II as part of this rebuilding effort. Production began in 3087, with the Twelfth Raven Garrison Cluster serving as the primary unit for field trials and operational testing of the new assault 'Mech.</p><p>Initial deliveries to auxiliary and garrison Clusters commenced in 3088, and production schedules projected that the Omen would reach sufficient numbers to restore full fighting strength to second-line formations by approximately 3095. The decision to restrict production exclusively to the Snow Raven Industrial Complex Alpha on Dante, rather than licensing the design to Outworlds Alliance manufacturers, reflected ongoing tensions within the Raven Alliance regarding the sharing of Clan military technology.</p><p>Through the Republic Era and into the Dark Age, the Omen became an increasingly common sight in Raven Alliance garrison forces. The introduction of the Omen 2 variant in 3141 demonstrated the Snow Ravens' continued investment in the design, adapting it with self-repair technology to improve battlefield survivability in the increasingly hostile strategic environment of the post-Blackout era. The Omen remains in active production as one of the Raven Alliance's principal second-line assault 'Mechs through the ilClan period.</p>
