chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled LBX10 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing heavy LB-X autocannon capable of firing cluster ammunition, these field gun crews deliver devastating anti-infantry capability at ranges that threaten light vehicles with solid shot.</p>
