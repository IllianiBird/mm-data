chassis: "Wolf Trap (Tora)"
model: "WFT-2"
overview: |-
  <p>The Wolf Trap, originally designated the Tora by its designers at Luthien Armor Works, is a 45-ton medium BattleMech introduced in 3051 as a direct counter to the Lyran Wolfhound. Making full use of recovered Star League technology, LAW's engineers designed the chassis to achieve respectable speed and payload capacity for its weight class. The Draconis Combine Mustered Soldiery intended the Wolf Trap to complement existing Dragon and Grand Dragon formations as a fast striker with long-range firepower.</p><p>Despite adequate performance on paper, the design quickly fell out of favor with Combine MechWarriors due to critical vulnerabilities that became apparent in combat. The DCMS formally ended procurement in 3061, and LAW sold remaining surplus on the mercenary market, though the Jihad would later force the design back into production out of sheer necessity.</p>
capabilities: |-
  <p>The Wolf Trap carries a weapons loadout comparable to the versatile Centurion, allowing it to engage across multiple range brackets. The Imperator Code Red LB 10-X autocannon serves as the primary weapon, offering selectable solid and cluster ammunition that makes the 'Mech effective against both conventional armor and airborne targets. A Shigunga LRM 10 rack provides supplementary fire at long range, useful for disrupting enemy formations and forcing opponents into disadvantageous positions. Two Victory 23R medium lasers round out the arsenal for close-range engagements.</p><p>Powered by its Hermes 270 XL engine, the Wolf Trap achieves a top speed of just over 97 kilometers per hour, keeping pace with many lighter designs. However, the design suffers from critical vulnerabilities that undermined its battlefield reputation. The extra-light engine occupies space in both side torsos alongside ammunition bins for the autocannon and missile system, and the standard Durallex Special Medium armor provides only modest protection for a 45-ton chassis.</p><p>Enemy warriors, particularly Clan Smoke Jaguar pilots, quickly learned to target the torso sections, where a single well-placed hit could detonate the ammunition stores and cripple the engine, often destroying the 'Mech outright. CASE protection mitigates some risk to the pilot but cannot save the powerplant from collateral damage.</p>
deployment: |-
  <p>Introduced during the Jihad at Luthien Armor Works' new Abiy Adi facility, this variant stands as a comprehensive modernization of the Wolf Trap chassis. The LB 10-X autocannon is replaced with a plasma rifle, and the LRM 10 gives way to an MML 9, significantly reducing ammunition dependency while increasing tactical flexibility. Three ER medium lasers and a trio of light machine guns linked in a machine gun array provide effective anti-infantry and close-range capability. The upgrade to double heat sinks accommodates the increased heat load, and the armor distribution has been optimized. Though the Wolf Trap remained unpopular, the hundreds of mothballed WFT-1 frames available from LAW storehouses made the upgrade program a cost-effective way to bolster depleted DCMS formations during the Combine's darkest hours.</p>
history: |-
  <p>The Wolf Trap's origins trace to the aftermath of the Fourth Succession War, when the DCMS suffered disproportionate losses to the Lyran Commonwealth's new Wolfhound light BattleMech. Stung by the effectiveness of these 30-ton machines against Combine Jenners and Panthers, Luthien Armor Works was tasked with developing a dedicated counter. Working with captured Wolfhound examples, LAW produced the Tora, a 45-ton design sharing the Wolfhound's speed profile but mounting heavier armament. Production began on Luthien in 3051, with the first units reaching frontline formations during the height of the Clan Invasion.</p><p>The Wolf Trap's combat debut proved disappointing. While technically capable, the design's reputation was poisoned by its ammunition vulnerability. Clan Smoke Jaguar warriors facing the new design on the Draconis Combine border quickly identified the weakness, targeting the 'Mech's torso-mounted ammunition bays at range and triggering catastrophic explosions. Word spread rapidly through the DCMS, and pilots began refusing assignments to Wolf Trap formations when possible. LAW executives continued marketing the Tora as the ideal complement to Dragon and Grand Dragon lances, but the stigma proved insurmountable. By 3061, the DCMS had formally ended Wolf Trap procurement, and LAW sold off remaining surplus stock on the Galatean and Fletcher mercenary markets.</p><p>The design might have faded into obscurity entirely had the Jihad not intervened. When the Word of Blake devastated the major LAW manufacturing complexes on Dieron, Luthien, Quentin, Al Na'ir, and Benjamin during the opening stages of the conflict, the Combine's production capacity collapsed virtually overnight. Desperate corporate executives struck clandestine deals with other Inner Sphere corporations to fund a new BattleMech factory on the quiet world of Abiy Adi in the Ningxia Prefecture. With the DCMS hemorrhaging 'Mechs faster than they could be replaced, LAW authorized the refitting and reintroduction of the hundreds of mothballed Wolf Traps languishing in storehouses across Combine space.</p><p>The Jihad-era WFT-2 upgrade program at Abiy Adi addressed many of the original design's flaws, replacing the ammunition-hungry autocannon with a plasma rifle and modernizing the weaponry. This pragmatic approach gave the Combine an upgraded medium 'Mech at minimal cost during a period of desperate need. Meanwhile, intelligence reports from the Dieron front indicated that the Word of Blake was producing its own Wolf Trap variant on captured LAW production lines, using the WFT-B as a networked combat platform with improved C3 integration.</p><p>Following the Jihad, Luthien Armor Works expanded operations to New Samarkand, where the WFT-2B variant entered production for DCMS cadre and garrison forces. The New Samarkand facility also served as a testbed for experimental technologies, with the prototype WFT-2X "Bear Trap" mounting a silver bullet Gauss rifle and medium X-pulse lasers during the mid-Jihad period. The production WFT-2B subsequently replaced the experimental weapons with standard logistics-friendly alternatives, ensuring the Wolf Trap's continued, if unglamorous, service in the Combine's second-line formations well into the Dark Age.</p>
