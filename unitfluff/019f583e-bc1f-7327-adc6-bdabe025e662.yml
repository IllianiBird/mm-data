chassis: "Mechanized Wheeled Platoon (DCMS)"
model: "(Flamer 2620+)"
overview: |-
  <p>The Draconis Combine Mustered Soldiery assigns conventional infantry to garrison roles across its military districts, with district regulars often fielding extra platoons to secure worlds that BattleMech forces cannot permanently garrison. Wheeled mechanized infantry ride armored personnel carriers that offer speed on roads and enough protection to survive initial contact. The DCMS assigns these platoons where garrison duty demands both rapid response and the ability to dismount under fire, a combination that foot and motorized troops cannot reliably deliver. Their support troops carry man-portable flamers that spray burning chemicals across several hundred square meters. Devastating against infantry in the open and effective at clearing structures, though the short range and the vulnerability of the operator's fuel tank make flamer duty one of the most dangerous assignments in the platoon.</p>
