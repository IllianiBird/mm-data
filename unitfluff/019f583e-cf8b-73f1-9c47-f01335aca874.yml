chassis: "Eisenfaust"
model: "EFT-4J"
overview: |-
  <p>The Eisenfaust (literally "iron fist" in German) is a forty-five-ton medium BattleMech that entered production during the Jihad, the successful realization of a concept that had eluded Lyran engineers since the earliest days of BattleMech production. Originally commissioned in 2469 as a medium-class siege engine, two separate prototype attempts over the following centuries failed to produce a viable design. It was not until Defiance Industries resurrected the concept with modern technologies that the Eisenfaust finally achieved the balance of firepower, protection, and mobility its designers had always envisioned.</p><p>Produced at the Defiance facility on Hesperus II beginning around 3076, the Eisenfaust serves as a capable defensive and urban combat platform for the Lyran Commonwealth. Its long and troubled development history has become a point of pride among Lyran engineers, who view the design as proof that persistence and technological progress can overcome even the most stubborn engineering challenges.</p>
capabilities: |-
  <p>The production Eisenfaust centers its firepower around a Defiance NovaShot Model 2 plasma rifle, a weapon that rivals particle projection cannons in raw damage potential while requiring no field inhibitors. Two tons of ammunition provide adequate supplies for extended engagements, and the weapon proves devastatingly effective against conventional infantry and battle armor formations. Supporting the plasma rifle at range, a Defiance Model 6 extended-range large laser allows the MechWarrior to conserve plasma ammunition for decisive moments.</p><p>Close-range defense relies on twin Defiance P5M medium pulse lasers and a Diverse Optics extended-range small laser, providing accurate fire against faster opponents attempting to exploit the Eisenfaust's modest top speed of sixty-four kilometers per hour. The adoption of the Edasich Motors 180 XL engine (the same powerplant mass-produced for the Hatchetman) proved critical to the design's viability, saving enough weight to mount fifteen double heat sinks that allow the Eisenfaust to fire its entire weapons suite without significant heat buildup. The Chariot Type II-B chassis and Durallex Medium armor provide solid protection for a forty-five-ton platform, though the reliance on an extralight engine means torso breaches carry catastrophic risk.</p>
deployment: |-
  <p>The second attempt at bringing the Eisenfaust concept to life, this variant emerged in 2515 using significantly improved construction techniques. The redesign achieved roughly fifty percent better armor protection and sixty percent greater top speed than the original EFT-2, addressing the most glaring deficiencies of the earlier prototype. Despite these improvements, extended combat trials with eight operational prototypes demonstrated that cheaper and more readily available conventional tanks could still fulfill the Eisenfaust's intended siege role more effectively. The design rights were sold to Defiance Industries, and the eight prototypes were relegated to the Coventry security garrison before eventually serving as testbed platforms for weapons and equipment configurations that would later inform the EFT-7X production model.</p>
history: |-
  <p>The Eisenfaust endured one of the longest and most troubled development histories of any BattleMech in Lyran service. The LCAF first commissioned a medium-class siege 'Mech in 2469, drawing on early experience with the Commando and Ymir. The Coventry Defense Conglomerate produced a single EFT-2 prototype in 2471 under the direction of engineer Ranomi Ndereba, but the machine's primitive engine could only manage a top speed of thirty-two kilometers per hour, and its thin armor left it hopelessly vulnerable to faster opponents. The LCAF quickly cancelled the project, though the concept continued to percolate through Lyran military planning circles for decades.</p><p>In 2512, the LCAF revisited the Eisenfaust concept using improved construction techniques. The resulting EFT-4J prototypes mounted fifty percent more armor and achieved significantly greater speed than the original, but extended combat trials with eight operational units proved that cheaper conventional tanks could still fill the siege role more effectively. The Eisenfaust project was shelved again, and the design rights were eventually transferred to Defiance Industries. The eight EFT-4J prototypes remained in service with the Coventry security garrison for several decades before being scrapped. Particularly, the Eisenfaust's original design concept would later see partial realization in the UrbanMech, which entered service roughly a century and a half later.</p><p>The Eisenfaust's resurrection came during the Jihad, when the revitalization of Lyran military production lines encouraged Defiance Industries to revisit previously abandoned designs. The availability of extralight engines, double heat sinks, and advanced weaponry transformed the Eisenfaust from a failed concept into a viable combat platform. After an expedited redesign and review process, the EFT-7X entered production at the Defiance facility on Hesperus II around 3076, making it one of the first new designs to reach Lyran forces in the wake of the Word of Blake's assault against the Lyran Alliance.</p><p>Initial production runs went primarily to the Seventh Donegal Guards, with smaller numbers distributed to Royal Guard and Lyrag Regulars formations. The Republic of the Sphere also exercised purchasing options for the design, acquiring Eisenfausts to fill defensive formations. As threats to Hesperus II mounted during the Dark Age (particularly from Clan Wolf and Clan Jade Falcon incursions in the 3140s) StarCorps Industries briefly produced the Eisenfaust under license at their Loburg facility to ensure continuity of supply.</p>
