chassis: "Ryoken III-XP"
model: "C"
overview: |-
  <p>The Ryoken III-XP is a 55-ton experimental OmniMech developed by Clan Wolf at the renovated Kali Yama Weapons Industries facility on Kalidasa during the mid-thirty-second century. Designated a Prototype Hybrid Chassis, the design served as a technology demonstrator that combined Inner Sphere and Clan experimental systems on a medium OmniMech platform derived from the proven Stormcrow lineage. Only a handful of prototypes were produced in multiple configurations before the program transitioned to the production Skinwalker, which replaced the most unreliable experimental components with proven alternatives suitable for mass manufacturing. The Ryoken III-XP remains classified as a high-priority intelligence target by former Republic analysts.</p>
capabilities: |-
  <p>Built with a mix of Inner Sphere and Clan technologies, the Ryoken III-XP is a powerful and swift design. Using a combination of a 330-rated Extra-Light Fusion Engine and Triple Strength Myomer, the 'Mech is able to achieve speeds up to 110 km/h when the myomer bundles reach operating temperature. Perhaps the most startling innovation included in this design is the Clan Interface Armor, which allows a MechWarrior to interface with their 'Mech while being completely armored should they be forced to eject. This combination interface allows the Ryoken III pilot a degree of control in combat unmatched by conventional cockpit systems, and removes the need to have a Gyro mounted in the 'Mech. This technology was thought to have been lost at the time of Ryoken III's baptism in combat by Inner Sphere powers. In addition to having its pilot encased in a power-armor interface, the Mech's hull is protected by 11.5 tons of Ferro-Lamellor Armor.</p>
deployment: |-
  <p>Designed for disabling and capturing enemy units, the C configuration centers on a TSEMP cannon mounted in the right arm. This weapon can shut down enemy electronics and BattleMech systems without destroying the target, making it valuable for intelligence-gathering operations. Six ER medium lasers tied to a targeting computer provide conventional firepower, while an ATM-9 launcher offers flexible missile support with multiple munition types.</p>
history: |-
  <p>The Ryoken III-XP emerged from Clan Wolf's renovation of the former Kali Yama Weapons Industries facility on Kalidasa, a planet seized during the Wolf occupation of the old Marik-Stewart Commonwealth. Clan Wolf scientists used the facility to experiment with a combination of Inner Sphere and Clan technologies that was rarely attempted in Clan design philosophy. The prototype incorporated fixed Triple Strength Myomer, an Interface Cockpit derived from technology the Word of Blake had deployed during the Jihad, and Ferro-Lamellor armor on a 55-ton chassis descended from the proven Stormcrow platform.</p><p>The design was first encountered in 3148, when Republic Remnant forces raided Kalidasa to test Clan Wolf's state of readiness. During the engagement, a heavy lance isolated what was believed to be a standard Skinwalker. The prototype's speed and advanced armor absorbed punishment that should have destroyed a conventional OmniMech, until a PPC strike crippled the engine. The armored pilot ejected and escaped before capture, but examination of recovered battleROM data confirmed the use of an Interface Cockpit system. The discovery alarmed Republic intelligence, who classified the Ryoken III-XP as a high-priority capture target. The lessons learned from the prototype program fed directly into the production Skinwalker, which replaced the experimental Triple Strength Myomer and other unreliable systems with proven alternatives suitable for mass production.</p>
