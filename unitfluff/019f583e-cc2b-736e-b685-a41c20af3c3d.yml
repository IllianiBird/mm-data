chassis: "JagerMech III"
model: "JM6-D4"
overview: |-
  <p>The JagerMech III was introduced in 3058 as part of Archon-Prince Victor Steiner-Davion's "Redesign for Davion Pride" initiative, a program intended to rebuild national confidence within the sundered Federated Commonwealth by modernizing iconic BattleMech designs. Kallon Industries took their venerable JagerMech and rebuilt it from the ground up, retaining the original's long-range fire support philosophy while incorporating extensive use of recovered Star League technology. The resulting sixty-five-ton design was faster, more sophisticated, and better protected than its predecessor, though it drew criticism for certain design compromises that left it vulnerable to catastrophic ammunition explosions. Produced by both Kallon Industries on Talon and Independence Weaponry on Quentin, the JagerMech III served primarily within the Armed Forces of the Federated Commonwealth and its successor states.</p>
capabilities: |-
  <p>The JagerMech III retains its predecessor's core doctrine of keeping enemies at range while incorporating significant technological upgrades to every major system. A massive VOX 325 XL engine propels the sixty-five-ton chassis to a top speed of 86.4 kilometers per hour, making it substantially faster than the original JagerMech and well-suited to the mobile warfare doctrine embraced by the AFFC. The Kallon Type XIV endo steel frame saves additional weight, while nine and a half tons of Kallon Unity Weave ferro-fibrous armor provide improved protection over the original's meager six tons of standard plating.</p><p>The primary armament consists of two Mydron Model D-rf Ultra autocannon/2s capable of reaching out to extreme distances with rapid-fire bursts, complemented by two Johnston Parti-Cannon PPCs for devastating intermediate-range firepower. Two Intek medium lasers provide close-range defense. Twelve double heat sinks manage the considerable thermal load generated by this weapons array. The upgraded Garret T12-S communications system and Garret T11fc targeting and tracking system represent significant improvements over the original JagerMech's electronics suite. However, the design has drawn persistent criticism for its lack of CASE protection for its ammunition bins, a puzzling omission given the extensive use of advanced technology throughout the rest of the chassis.</p>
deployment: |-
  <p>The D4 variant emerged in 3073 during the Jihad as a significant refinement of the JagerMech III platform. The ferro-fibrous armor was replaced with light ferro-fibrous plating, and the heat sink array was expanded to sixteen double-strength units to accommodate a substantially upgraded weapons suite. The Ultra autocannon/2s gave way to light PPCs in the arms, creating an all-energy primary armament when combined with the existing Johnston PPCs, while a second pair of medium lasers was added to the center torso for improved close-range defense. The elimination of ammunition dependency resolved the original D3's CASE criticism entirely, though the increased heat generation demanded careful thermal management from its pilots.</p>
history: |-
  <p>The JagerMech III emerged from one of the most politically charged military procurement programs of the post-Clan Invasion era. When Archon-Prince Victor Steiner-Davion launched his "Redesign for Davion Pride" initiative in the late 3050s, the goal was as much about national morale as military capability. The JagerMech, long associated with Federated Suns military tradition, was a natural candidate for the program, and Kallon Industries rose to the challenge with a comprehensive modernization that touched every aspect of the design.</p><p>Production was established at Kallon's Talon facility and at Independence Weaponry on Quentin, though the latter's status as a Draconis Combine-controlled world created an unusual situation. While there is no firm evidence that the JagerMech III was deployed to the Draconis Combine Mustered Soldiery, Independence Weaponry had previously received specifications for the JM6-DD through agreements between First Prince Hanse Davion and Coordinator Theodore Kurita at the Outreach Summit. The company's participation in joint Combine-FedCom projects, including development of the Gunslinger, suggests that JagerMech III specifications may have been shared through similar channels. It is equally possible that Independence Weaponry produced the design exclusively for export to the Federated Suns.</p><p>The JagerMech III saw active service through the FedCom Civil War and into the Jihad era, where the destruction of the Talon factory in 3069 impacted production capacity. Kallon's continued presence on Victoria and Wernke ensured that development of the JagerMech line continued, with the JM6-D4 Jihad-era variant demonstrating ongoing refinement of the platform well into the thirty-first century.</p>
