chassis: "Yeoman"
model: "YMN-6Y"
overview: |-
  <p>The Yeoman is a sixty-ton heavy BattleMech produced by Curtiss Militech on Paradise. Introduced in 3060, the design was conceived as a dedicated fire support platform intended to compete with established missile carriers in its weight class. Curtiss Militech, a military division formed by the water purification firm Curtiss Hydroponics, rushed the Yeoman into production alongside the Eagle following the commercial success of the Wraith. Within the Free Worlds League Military, the Yeoman earned a reputation as one of the most missile-heavy machines of its tonnage, though that singular focus would prove to be both its greatest strength and its most persistent liability. Following the destruction of Paradise in 3080, Graham-Davis Enterprises on Tamarind eventually acquired the production rights, ensuring the design's continued availability.</p>
capabilities: |-
  <p>The Yeoman's primary armament consists of two Zeus LRM-15 launchers and two Zeus LRM-10 launchers, providing a withering barrage of fifty long-range missiles per salvo. This loadout makes the Yeoman one of the most potent missile platforms in its weight class, capable of sustained bombardment with enough ammunition for roughly two minutes of continuous fire. Both side torsos are protected by CASE, allowing the 'Mech to survive an ammunition explosion without catastrophic loss.</p><p>The chassis employs a Curtiss Yeoman endo steel internal structure to save weight, while eight and a half tons of Kallon FWL Special ferro-fibrous armor provides respectable protection for a fire support design. A standard Pitban 240 fusion engine propels the Yeoman to a top speed of sixty-five kilometers per hour, a deliberate choice to avoid the expense and fragility of an extralight engine. The design mounts no jump jets and carries no secondary weapons of any kind, leaving the Yeoman entirely dependent on its missile launchers at all ranges. Any pilot who allows an enemy to close inside the minimum effective range of the LRM racks faces a dire situation with no fallback options.</p>
deployment: |-
  <p>The base YMN-6Y represents the original production model as it rolled off the Paradise assembly line. Within the Free Worlds League Military, this variant was most commonly assigned to dedicated fire support lances where screening forces could keep faster opponents at bay. Commanders quickly developed standard operating procedures that paired Yeoman-equipped lances with faster skirmishers, as the design's effectiveness dropped sharply when the formation's perimeter was breached.</p>
history: |-
  <p>Curtiss Militech was a relatively obscure military division formed around 3055 by Curtiss Hydroponics, a water purification company based on Paradise. After the Wraith proved a commercial success, the company rushed both the Eagle and Yeoman into production by 3060. Despite the speed of development, the Yeoman performed adequately in its intended role. The first shipments were distributed throughout the Free Worlds League Military, with the vast majority assigned to frontline Legionnaires regiments. Curtiss attempted to market the Yeoman as a natural companion to the Eagle, arguing that the latter's target acquisition gear could designate targets for semi-guided missile ammunition. The League Central Coordination and Command remained skeptical of the pairing, however, recalling the failed partnership between the Hammer and Anvil promoted by Free Worlds Defense Industries.</p><p>The Capellan Confederation showed little interest in the new design, preferring to rely on their own older Catapult variants for fire support. Within the League, enemy commanders quickly learned to send fast, close-combat 'Mechs beneath the Yeoman's missile umbrella, exploiting its complete lack of short-range armament. The Yeoman's distinctive boxy silhouette and minimal arm structures also made it easy to identify and prioritize on the battlefield, compounding the problem.</p><p>The Jihad proved devastating for the Yeoman's production history. After the Free Worlds League dissolved in 3079, Curtiss Militech's output briefly fell under the control of the Duchy of Graham-Marik. On February 26, 3080, forces from the Principality of Regulus bombarded Paradise with thousands of cobalt-laced nuclear weapons, obliterating the planet and the Curtiss Militech factory with it. Curtiss Hydroponics subsequently withdrew from the military market entirely and sold off its Curtiss Militech assets. By 3085, the Duchy of Tamarind-Abbey had moved to acquire the rights to both the Eagle and Yeoman designs. Graham-Davis Enterprises on Tamarind, previously an IndustrialMech manufacturer, licensed the Yeoman and eventually began production sometime in the mid-3090s, ensuring the design's survival into the Dark Age and beyond.</p>
