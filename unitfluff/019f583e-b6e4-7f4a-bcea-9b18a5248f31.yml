chassis: "Field Gun Platoon (AFFS)"
model: "(Wheeled UAC5 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing ultra autocannon that can fire at twice normal rate, these field gun crews provide burst-fire capability that increases their punch against armored targets at the cost of increased ammunition consumption.</p>
