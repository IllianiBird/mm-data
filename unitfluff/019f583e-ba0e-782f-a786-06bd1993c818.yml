chassis: "Foot demi-I (ComGuards)"
model: "(SRM)"
overview: |-
  <p>Com Guard conventional infantry benefit from ComStar's access to preserved Star League technology, fielding weapons and equipment that match or exceed the standard issue of any Inner Sphere military, backed by the institutional discipline of the secular Order's professional military culture. Foot infantry Level I formations anchor defensive positions and garrison critical installations, providing the persistent ground presence that BattleMech and armor units cannot maintain indefinitely. Com Guard foot infantry train alongside heavier elements and understand their role within the larger combined-arms framework. Equipped with infantry-portable short-range missile launchers that provide anti-armor capability beyond what personal weapons can achieve, these troops can threaten light vehicles and battle armor at close range.</p>
