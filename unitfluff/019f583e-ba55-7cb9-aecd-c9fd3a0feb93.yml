chassis: "Motorized demi-I (ComGuards)"
model: "(Laser)"
overview: |-
  <p>Com Guard conventional infantry benefit from ComStar's access to preserved Star League technology, fielding weapons and equipment that match or exceed the standard issue of any Inner Sphere military, backed by the institutional discipline of the secular Order's professional military culture. Motorized Level I formations use light vehicles to achieve rapid redeployment between positions, trading the armor protection of mechanized transports for greater speed and lower logistical burden. These formations excel at screening operations and can cover more ground than foot infantry during extended patrol assignments. Equipped with laser rifles that offer superior range and armor penetration compared to ballistic weapons, these troops field one of the most effective personal arms available to conventional infantry, though the weapons are significantly more expensive and require soldiers to carry additional power packs.</p>
