chassis: "Marauder II"
model: "MAD-4H"
overview: |-
  <p>With structural changes and modifications that add a full twenty-five tons to its total mass, the Marauder II is as much a variant of the original Marauder as it is an all-new BattleMech. Born from a 3010 partnership between Wolf's Dragoons and Blackwell Heavy Industries on New Valencia, the hundred-ton assault 'Mech was seen by some as a longshot, doubts fueled by the unlikely collaboration between a relatively minor manufacturer and the enigmatic mercenary command only recently known to the Inner Sphere. When the first Marauder II entered service in 3012, however, it silenced all critics with a combination of devastating firepower, heavy armor, and surprising mobility that made it one of the most feared assault platforms in the Inner Sphere.</p>
capabilities: |-
  <p>By basing its new design so closely on a machine still in active production around the Inner Sphere, Blackwell created a BattleMech that struck the same familiar silhouette and possessed similar fighting capabilities as the original, but on a much more durable frame. The original MAD-4A mounted two Magna Hellstar PPCs, a Magna Mk III large laser, and two medium lasers (enough to threaten even an Atlas) backed by twenty-nine heat sinks and nineteen tons of Valiant Lamellor armor. Three Chilton 600 jump jets provided ninety meters of jumping capability, giving the hundred-ton machine surprising tactical flexibility for its weight class. Quickly favored by Dragoons commanders, the sight of this ’Mech in combat often heralded a major assault that few enemies could withstand.</p><p>The MAD-5A upgrade leveraged recovered Star League technology, replacing the standard engine with a Vlar 300 XL and mounting Magna Firestar extended-range PPCs alongside a Mydron Excel LB 10-X autocannon. Like its lighter predecessor, the Marauder II has an impressive number of variant configurations produced in factories throughout the Inner Sphere, including General Motors on Kathil and New Valencia, Independence Weaponry on Quentin, and Irian Technologies on Irian. Each manufacturer has brought distinct design philosophies to the chassis, ensuring the Marauder II remains adaptable to the evolving needs of modern warfare.</p>
deployment: |-
  <p>A product of opportunity rather than design, this variant appeared in the Marian Hegemony after a shipment of Marauder II chassis bound for the Lyran Alliance was hijacked and diverted to Alphard. Marian Arms refitted the stolen machines, retaining the paired extended-range PPCs and lasers but replacing the primary weapon with a devastating array of rocket launchers, four Rocket Launcher 20s, six Rocket Launcher 15s, and a single Rocket Launcher 10. The resulting configuration delivers a catastrophic alpha strike capable of overwhelming most opponents in a single volley, though the one-shot nature of rocket launchers severely limits the variant’s sustained combat endurance.</p>
history: |-
  <p>The Marauder II’s history is inseparable from that of Wolf’s Dragoons. When the Dragoons first arrived in the Inner Sphere, they were surprised to see how far the House armies had fallen since the Star League era. Rather than risk exposing their origins by fielding Clan-era designs, the Dragoons needed superior versions of machines the Inner Sphere was still capable of building. The best candidate was upsizing the reliable and well-known Marauder. Blackwell Industries on New Valencia won the contract in 3010, and by 3012 the first Marauder IIs entered service with Zeta Battalion. For the next two decades, the design saw action in virtually every major Dragoons operation, from the fighting of the Marik Civil War to the Thirteenth Battle for Hesperus II to the bloody crucible of Misery in the Draconis Combine.</p><p>After the Fourth Succession War, the Dragoons authorized limited outside sales through Blackwell, though each buyer required Dragoons approval. The mercenary unit Miller’s Marauders became the largest outside buyer, forming an elite assault battalion of Marauders and Marauder IIs. The recovery of Star League technology in the late 3040s spurred the MAD-5A upgrade, and by the 3060s General Motors had licensed the design for broader production. The destruction of Barber’s Marauder IIs on Koniz in 3064 (overwhelmed by Jade Falcon Elementals) briefly dimmed the design’s reputation, but the introduction of the MAD-4S with its light fusion engine and heavy Gauss rifle quickly rekindled demand across the Inner Sphere.</p><p>The Jihad proved devastating for the Marauder II’s industrial base. The Word of Blake’s systematic destruction of anything associated with Wolf’s Dragoons eliminated the Blackwell factories on Outreach, scattering production capability. With so many Marauder IIs having survived and so many new weapons available, most nations launched refit programs to modernize their existing chassis, the Federated Suns developed the MAD-6D with Republic cooperation, the Word of Blake and ComStar fielded the C3i-equipped MAD-5W, and the Free Worlds League states created the fast-moving MAD-6M.</p><p>The post-Jihad era saw new manufacturers step in to fill the void. Irian BattleMechs Unlimited acquired production rights and began building the MAD-6S at Irian, replacing their Awesome line. Independence Weaponry on Quentin leveraged Jihad-era refit experience to start fresh production alongside their Atlas line, producing the MAD-6A, MAD-6C, and the Ballistic-Reinforced MAD-8K for the Draconis Combine. General Motors restarted production on Kathil with the technologically advanced MAD-10D, a joint venture with Blackwell that focused on above-average speed using hyper-advanced beam weaponry.</p><p>During the assault on Palmyra in 3144, a pair of MAD-10D Marauder IIs from the Davion Heavy Guard formed a wall of armor and coordinated firepower that nearly eliminated their Combine pursuers, buying time for surviving forces to withdraw into the Tower Mountains. The engagement illustrated both the design’s enduring strengths and its continued relevance on the modern battlefield. From Wolf’s Dragoons’ exclusive weapon to a mainstay of armies across the Inner Sphere, the Marauder II remains one of the most sought-after assault platforms in known space.</p>
