chassis: "Mechanized Wheeled Platoon (FWLM)"
model: "(Combat Engineers 3035+)"
overview: |-
  <p>The Free Worlds League's fractious politics have always made centralized BattleMech procurement difficult, pushing the FWLM toward heavy investment in conventional infantry to fill the gaps. Wheeled mechanized platoons in FWLM service ride armored personnel carriers that offer good road speed and reasonable protection, making them well-suited to the League's developed industrial worlds where paved infrastructure supports rapid deployment between population centers. Trained as combat engineers, these troops carry specialized equipment for rapid construction of field fortifications, obstacle emplacement, and demolition operations, providing commanders with the ability to reshape terrain to tactical advantage.</p>
