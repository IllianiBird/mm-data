chassis: "Mechanized Hover Level I (ComGuards)"
model: "(MG)"
overview: |-
  <p>The Com Guards field conventional infantry as a core component of their combined-arms formations, with Level I infantry units integrated into the same command structure alongside BattleMech, armor, and aerospace elements at every organizational level. Mechanized hover Level I formations are the fastest ground-mobile infantry in the Com Guards, using hovercraft APCs that can cross water obstacles and open terrain at speeds no wheeled or tracked transport can match. Their speed makes them valuable for flanking maneuvers and rapid exploitation of breakthroughs. Carrying infantry-portable machine guns that provide sustained suppressive fire, these troops anchor defensive positions with a volume of fire that discourages enemy movement in the open.</p>
