chassis: "Beowulf IIC"
overview: |-
  <p>The Beowulf IIC is a forty-five-ton medium Clan BattleMech introduced in the 3080s by Odin Manufacturing on Orestes as a clean-sheet Clan-technology rebuild of the original ComStar-designed Beowulf. Developed to fill the Ghost Bear Dominion's need for a fast medium scout to supplement the slower Ursus, the Beowulf IIC pushed the proven fifteen-year-old platform to new capability levels using Clan-grade weapons and equipment. Though the design's inflated cost generated significant controversy within the Dominion's merchant caste, the Beowulf IIC became one of the few Rasalhagian-manufactured Clan BattleMechs to see widespread deployment within the Dominion's touman, serving in both frontline and second-line formations.</p>
capabilities: |-
  <p>At its core, the Beowulf IIC is remarkably similar to its ComStar-designed progenitor, sharing virtually identical ground performance. The same 270-rated XL engine and MASC system provide matching speed, while Odin Type II jump jets deliver the same one-hundred-and-eighty-meter jump capability. The primary advantage of the Clan rebuild lies in the improved survivability of the Clan-rated XL engine, which can sustain side torso damage that would cripple the Inner Sphere original. Clan ferro-fibrous armor saves a modest half-ton over the Inner Sphere version.</p><p>The weapons loadout trades the Inner Sphere pulse and extended-range lasers for Clan equivalents, a Series PPS-XX extended-range large pulse laser and two Series PPS-XIX extended-range medium pulse lasers deliver more damage at nearly identical range brackets, though the 'Mech runs hotter as a result. The most controversial design choice was replacing the Beagle active probe and TAG with a Watchdog CEWS and light TAG. While technically offering the same detection and ECM capabilities at less weight, the significantly reduced sensor range forces the Beowulf IIC dangerously close to hostile units to fulfill its scouting role. Ironically, the retention of the original Dash-2 communications system and Blade 12 targeting computer (the very components that had caused incompatibility issues in earlier Clan-tech refits) continues to produce electronics glitches in the purpose-built IIC design.</p>
deployment: |-
  <p>The standard Beowulf IIC replaces all Inner Sphere weapons with Clan equivalents while retaining the original chassis layout and performance envelope. A Series PPS-XX extended-range large pulse laser and two Series PPS-XIX extended-range medium pulse lasers provide increased damage output, while the Clan-rated XL engine and ferro-fibrous armor improve survivability over the Inner Sphere original. The substitution of a Watchdog CEWS and light TAG for the original Beagle active probe and TAG trades sensor range for integrated ECM protection, a design choice that remains contentious among Dominion commanders, as it forces the 'Mech to close to dangerously short ranges to fulfill its reconnaissance role.</p>
history: |-
  <p>The Beowulf IIC was born from the political and commercial upheaval following the Jihad and Clan Ghost Bear's absorption of the Free Rasalhague Republic. Odin Manufacturing, relatively insulated from the Word of Blake's predations and buoyed by steady Dominion contracts, expanded aggressively into Clan technology production during the 3070s. Years of incremental Clan-tech refits to existing Beowulf chassis had produced mixed results, with persistent electronics incompatibilities plaguing the hybrid designs and prompting Odin to develop a clean-sheet Clan rebuild.</p><p>Odin undertook the IIC redesign on its own initiative following the commercial success of the Karhu OmniMech, aiming to push the Beowulf platform to a new price point. However, the Beowulf IIC's inflated cost and the perception of Rasalhagian profiteering severely strained relations between the Dominion's arms manufacturers and the Ghost Bear merchant caste. The resulting political fallout contributed to a wave of restrictions on the freewheeling defense industries that had flourished in the post-Jihad Dominion.</p><p>The Beowulf IIC entered production around 3084. Despite the politics surrounding its pricing, the design saw deployment with both frontline and second-line Clusters, filling roles previously held by Clint IICs and Shadow Hawk IICs. The most notable engagement involving the Beowulf IIC came in 3088, when a Rasalhagian pair led a Clan Wolf Binary into an artillery trap, using the 'Mechs' scouting systems to provide targeting data. The resulting furor over this tactic sparked six months of tit-for-tat Trials between the Dominion and Clan Wolf.</p><p>The experimental Beowulf IIC-PR variant, integrating Inner Sphere C3i technology into the Clan chassis, proved even more politically combustible. The Las Cabreas incident on Labrea in 3099, where Beowulf IIC-PRs and Ursus-PRs coordinated a devastating campaign against Clan Nova Cat, drew the attention of the Republic of the Sphere. The Republic leveraged the political fallout to force Ghost Bear inspectors to permit the extraction of critical C3i manufacturing equipment from the Bergan Industries facility on Alshain, effectively ending the program. The Odin Manufacturing facility on Orestes was itself destroyed in an attack by the 2nd Legion of Vega in 3099, ending production of the Beowulf IIC entirely.</p>
