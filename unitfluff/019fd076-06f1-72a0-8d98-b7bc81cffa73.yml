chassis: "Field Artillery Platoon (Generic)"
model: "(Wheeled Arrow IV 3045+)"
overview: |-
  <p>Mechanized wheeled platoons transport their infantry in wheeled armored personnel carriers optimized for speed on roads and improved surfaces. Wheeled APCs are cheaper to maintain and faster on pavement than tracked alternatives, making these platoons ideal for garrison rapid-response forces, highway patrol, and urban security operations. Their off-road capability is limited compared to tracked vehicles, restricting employment in rough terrain, but on developed worlds with good road networks, wheeled mechanized infantry offer the best balance of speed, protection, and operating cost.</p><p>Towing Arrow IV artillery systems, these platoons field the most sophisticated indirect fire capability available to conventional forces, launching guided missiles that can be directed onto targets by forward observers with TAG designators.</p>
