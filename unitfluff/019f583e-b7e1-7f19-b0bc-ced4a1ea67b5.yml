chassis: "Field Artillery Platoon (CCAF)"
model: "(Tracked Thumper Cannon 3079+)"
overview: |-
  <p>The Capellan Confederation has always relied on its infantry to compensate for the CCAF's chronic shortage of heavier assets. Conventional foot soldiers, drawn from the citizens' militia system that defines Capellan military service, form the backbone of garrison forces across the Confederation's commonalities. Field artillery platoons give CCAF ground commanders organic indirect fire support without requiring dedicated artillery vehicles. Operating crew-served tube or missile artillery pieces from mechanized transports, these platoons can displace and redeploy faster than vehicle-mounted artillery at the cost of lower rates of fire and less ammunition. Operating a Thumper Cannon, these platoons provide direct-fire light artillery support, combining the portability of a field gun with the explosive payload of tube artillery.</p>
