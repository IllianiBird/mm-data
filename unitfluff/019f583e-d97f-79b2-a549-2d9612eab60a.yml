chassis: "Jenner IIC"
model: "3"
overview: |-
  <p>Despite a somewhat enigmatic origin, the Jenner IIC is a powerful and fast light striker 'Mech. Serving with distinction during Operation Revival among the forces of Clan Nova Cat, the Jenner IIC caused confusion among Inner Sphere observers as the original Jenner was first fielded in September 2784, the same year the Exodus fleet left the Inner Sphere in November.</p><p>Pre-production Jenners were newly deployed when the SLDF left the Inner Sphere to the suffering of the Succession Wars. The Clans were only reintroduced to the BattleMech through isorla Jenners that Wolf's Dragoons returned with on their second supply run. Guided by visions of future doom, the Nova Cats claimed the Kuritan 'Mech as their own and turned what was one of the Inner Sphere's best light strikers into one of the fastest 'Mechs of its time.</p>
capabilities: |-
  <p>The Jenner IIC takes the original Jenner concept to the extreme, being fast and well-armed but ill-suited for prolonged engagements. While massing the same as its progenitor, the IIC mounts a more powerful extralight engine. It is ideal for fast striking, scouting, scout-hunting, and head-hunting operations. Jenner IICs are often some of the first 'Mechs off the DropShip, clearing out scouts and other threats early in a battle.</p><p>The base configuration mounts a Pattern C4 Streak SRM-4 in the center torso and a Pattern J7 SRM-6 launcher in each arm, carrying one ton of reloads for each missile rack. Though vulnerable to anti-missile systems and heavily dependent on supply lines, the hail of missiles the Jenner IIC can unleash makes it ideal for eliminating light threats such as scouts and combat vehicles.</p><p>To achieve this firepower on a light chassis, the Jenner IIC uses a 315-rated XL engine, endo steel structure, and three and a half tons of ferro-fibrous armor. It also carries enough jump jets to leap 210 meters, giving it exceptional mobility.</p>
deployment: |-
  <p>This variant mimics the original Jenner by carrying four small pulse lasers, which are devastating to infantry but still respectable against other units. A Narc missile beacon allows it to aid the targeting of other units' missiles, making it an excellent support platform for combined-arms operations where friendly forces carry guided munitions.</p>
history: |-
  <p>Though the original version is used by a number of Clans, the Nova Cats fielded multiple Jenner IIC variants as well as continuing its development after their Abjurement. Considerable resources were spent to bring new production online of visually refreshed versions at their Irece Alpha facility to help fill out their rebuilding touman.</p><p>Ultimately, the Jenner IIC outlasted the Clan that designed it. During the final battles for Irece in late 3142, Jenner IICs acted as sentries and early-warning scouts, protecting civilian and military transports evacuating before the Dragon's wrath fell upon them. Several Stars of factory-fresh Jenner IICs and Arbalests screened the spaceport near the Irece Alpha production facilities, but the Gunji-no-Kanrei's forces steamrolled the spaceport and only a handful of DropShips managed to reach orbit.</p><p>With the acquisition of Irece Alpha following the Nova Cats' fall, Clan Sea Fox took over production of the Jenner IIC, proliferating it throughout the Inner Sphere. Clan Wolf continues to be the largest customer, forcing mercenaries to pay a premium for this premiere striker. The agreement with the Draconis Combine has the Jenner IIC openly available to all purchasers willing to meet Sea Fox prices.</p>
