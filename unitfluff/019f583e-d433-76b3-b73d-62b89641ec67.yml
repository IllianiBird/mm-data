chassis: "Koschei"
model: "KSC-6L"
overview: |-
  <p>The Koschei was the second BattleMech produced in the Capellan Confederation, entering service in 2504 as the product of heavy government investment in Earthwerks Incorporated's Tikonov facility. With the Confederation Defense Company unwilling to assist, Regent Salindar directed funding to expand Earthwerks into full BattleMech production, though exclusivity agreements with the Terran Hegemony forced the Tikonov branch to rely on locally recruited engineers rather than shared technology. Named after an undying demon of Slavic mythology, the Koschei was designed as a fast heavy skirmisher capable of closing rapidly with heavier opponents while shrugging off punishment that would cripple lighter designs.</p><p>Production of the original model ceased in 2714 to make way for upgraded Star League-era variants, and the design largely disappeared from frontline service during the Succession Wars. The Koschei saw a dramatic revival after Tikonov returned to Capellan control in 3067, and the Magistracy of Canopus subsequently acquired production rights through the Trinity Alliance, establishing a second manufacturing line on Dunianshire.</p>
capabilities: |-
  <p>At sixty-five tons, the Koschei achieves a top speed of 86 kilometers per hour courtesy of its VOX 325 fusion engine, a remarkable pace for a heavy BattleMech that allows it to keep stride with many medium-weight designs. Twelve tons of Maximillian 40 armor provide substantial protection, giving MechWarriors confidence to engage heavier opponents at close quarters where the 'Mech's speed becomes a decisive advantage.</p><p>The primary armament centers on an Imperator-B autocannon, a reliable weapon that softens targets at medium range with manageable heat output. A pair of Magna Mk II medium lasers supplement the autocannon as the Koschei closes to shorter engagement distances. The overall heat burden remains low enough that pilots rarely face thermal management concerns unless the 'Mech has sustained significant damage to its cooling infrastructure.</p><p>The original design philosophy deliberately traded raw firepower for speed and survivability, a combination that served well in the Koschei's early decades but ultimately left it outgunned as competing heavy designs proliferated. The absence of jump jets on the base model further limits tactical flexibility in rough terrain, a shortcoming later variants would address with varying degrees of success.</p>
deployment: |-
  <p>Initially produced on Dunianshire and subsequently manufactured at Earthwerks' Tikonov line, this variant emerged around 3105 as a dedicated artillery platform. A Sniper artillery cannon serves as the primary weapon, capable of delivering devastating indirect fire, while four medium lasers provide close defense. A targeting computer enhances the accuracy of the laser battery, and CASE II protects the two tons of artillery ammunition from catastrophic detonation. The integration of triple strength myomer and a light fusion engine pushes the Koschei to speeds approaching 97 kilometers per hour when the myomer is fully activated, giving this artillery variant unexpected mobility. The Tikonov Guards have proven especially fond of the design, valuing its combination of long-range firepower and staying power.</p>
history: |-
  <p>The Koschei served with distinction among the Capellan Confederation Armed Forces for the first century of its existence, earning assignment to the Confederation's premier frontline formations. As the Age of War gave way to the Star League era and newer, more heavily armed designs entered service, the Koschei found itself progressively outclassed. Its combination of speed and armor remained valued, but insufficient firepower saw it gradually relegated to garrison duty and reserve formations. Earthwerks responded by shutting down the original production line and beginning work on an upgraded variant in 2714.</p><p>The Star League-era KSC-4I and KSC-4L upgrades incorporated advanced materials including endo steel and ferro-fibrous armor, but the improvements received a lukewarm reception from Capellan commanders who found the firepower increase insufficient to justify the increased maintenance complexity. Both variants saw limited frontline deployment before the Succession Wars disrupted production entirely. When Tikonov fell to the Federated Suns, the Koschei production lines were effectively abandoned, and the few remaining examples scattered across garrison posts and Periphery militias.</p><p>The return of Tikonov to Capellan sovereignty in early 3067 prompted Earthwerks to revive the Koschei line, but the timing proved awkward. The Xin Sheng cultural movement that had reinvigorated Capellan national identity left little appetite for a design rooted in Tikonov's Slavic heritage rather than the Confederation's preferred aesthetic. The reintroduced KSC-5I found its primary market among mercenary commands rather than Capellan regulars, though the 'Mech's combination of advanced weaponry and proven chassis appealed to pragmatic warriors unconcerned with cultural symbolism.</p><p>Meanwhile, the Magistracy of Canopus leveraged Trinity Alliance ties to acquire Koschei production plans. Majesty Metals and Manufacturing began producing their own variant on Dunianshire in 3068, creating the KSC-5MC with a distinctly Canopian weapons configuration. This second production source ensured the design survived the upheaval of the Jihad, during which Tikonov changed hands multiple times between the Word of Blake and Republic of the Sphere. By the Dark Age, Koschei production had stabilized at both facilities, with the KSC-6L variant featuring artillery weaponry proving particularly popular with the Tikonov Guards, who valued the 'Mech's combination of staying power and long-range fire support.</p>
