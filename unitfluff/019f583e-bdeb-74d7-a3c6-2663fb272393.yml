chassis: "Mechanized Wheeled Platoon (LCAF)"
model: "(Laser 3058+)"
overview: |-
  <p>The Lyran Commonwealth's industrial wealth ensures its infantry are among the best-equipped in the Inner Sphere, fielding hardware that most armies reserve for elite formations as standard issue. Mechanized wheeled platoons use wheeled APCs that offer a balance between the speed of hover transport and the protection of tracked vehicles, well-suited to operations on developed road networks. Equipped with Maxell PL-10 laser rifles that offer superior range and armor penetration compared to ballistic weapons, these platoons field one of the more effective personal arms available to conventional infantry, though the weapons are significantly more expensive and require soldiers to carry additional power packs.</p>
