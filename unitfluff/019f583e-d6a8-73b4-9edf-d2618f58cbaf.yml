chassis: "Woodsman"
model: "Prime"
overview: |-
  <p>The Woodsman was Clan Wolf's first heavy OmniMech, introduced in 2865 during the Golden Century as one of the most extensively tested weapons platforms ever produced by the Clan. Every detail of the design was scrutinized and refined before production began at Wolf Clan Site #2 on Strana Mechty, resulting in a chassis that served the Wolf Clan's front-line forces for nearly a century. Named after a literary character who progressively lost parts of his body yet continued to live, the Woodsman's robust design philosophy would prove prophetic, as its chassis would inspire three successor OmniMechs: the Timber Wolf, the Gargoyle, and the Naga.</p><p>Though eventually superseded by these newer designs and relegated to second-line service before being phased out entirely prior to Operation REVIVAL, the Woodsman was returned to production in 3149 by Alaric Wolf at Earthwerks Incorporated on Keystone, pressed into service to rapidly rebuild the Wolf Empire's touman. The venerable design once again earned the grudging respect of Clan and Inner Sphere forces alike.</p>
capabilities: |-
  <p>The Woodsman eschews the extra-light fusion engines common to later Clan assault OmniMechs in favor of a standard Wolf 300-rated powerplant, a conservative choice that dramatically improves battlefield survivability. While this limits the chassis to a base speed of 64 kph, a permanently installed MASC system allows pilots to briefly exceed 80 kph, providing the tactical flexibility to sprint to cover or exploit breaches in enemy formations. The endo steel internal structure saves critical weight, freeing 27.5 tons of pod space for mission-specific loadouts.</p><p>Clad in thirteen and a half tons of Durallex Heavy armor, the Woodsman offers excellent protection for its weight class, a marked contrast to the thinly armored descendants it would later inspire. This combination of durability and generous pod space made the Woodsman an ideal testbed for experimental weapons, including the dual Arrow IV launcher configuration that would eventually define the Naga. The Primary configuration mirrors what would become the iconic Timber Wolf loadout: paired ER large lasers and ER medium lasers in each arm supported by twin LRM-15 racks and a pair of machine guns for anti-infantry work, with seventeen double heat sinks managing the thermal load.</p><p>The Woodsman's principal weakness lies in its relatively modest speed compared to later designs. Without MASC engaged, the chassis is slower than most heavy OmniMechs, making sustained pursuit difficult and withdrawal risky against faster opponents.</p>
deployment: |-
  <p>The Primary configuration of the Woodsman established the loadout template that would later define the Timber Wolf. Paired ER large lasers and ER medium lasers in each arm provide devastating firepower at multiple range bands, while twin LRM-15 racks in the side torsos deliver sustained missile bombardment. A pair of center-torso mounted machine guns handles anti-infantry duties. Five additional pod-mounted double heat sinks bring the total to seventeen, allowing the Woodsman to fire most of its weapons simultaneously without significant heat concerns. This balanced loadout made this variant the standard against which all subsequent configurations were measured.</p>
history: |-
  <p>The Woodsman emerged during the Golden Century, a period of intense competition and Trials among the Clans for resources and territory. Clan Wolf suffered numerous raids during this era, and Wolf MechWarriors grew to rely on the capable and durable Woodsman to defend their holdings. The design's reputation was forged in the crucible of inter-Clan conflict, particularly during the resource trials of the early Golden Century where the chassis proved its worth repeatedly.</p><p>One of the Woodsman's most famous trials for resources came in 2912, when Clan Smoke Jaguar began exterminating their own lower castes due to a crop shortage. Several Clans conducted trials to gain new citizens before the Smoke Jaguars eliminated them. The Jaguars viewed these trials as affronts and interference in their internal affairs, leading to vicious fighting between the Jaguars and the Wolves. The largest engagement saw Wolves landing DropShips on Londerholm to evacuate an entire town, with the battle raging for nearly a full day as civilians loaded onto Wolf transports. A Star of Woodsmans elected to stay behind and hold the Jaguars long enough for the evacuation to succeed, fighting against nearly four times their number until all five warriors fell.</p><p>As OmniMech technology matured, the Woodsman's chassis inspired three distinct successor designs. The Timber Wolf served as a direct upgrade, the Gargoyle traded MASC for a larger engine to achieve comparable speed without the system's inherent risks, and the Naga repurposed the torso to mount fixed Arrow IV artillery systems. With these newer designs entering service, the Woodsman was progressively relegated to second-line units and eventually phased out completely before Operation REVIVAL. When the Wolves fell out of frontline use of the design, many Woodsmans were traded to Clan Snow Raven, who employed them through the Operation Revival trials era.</p><p>The Woodsman's story did not end with obsolescence. In 3149, Alaric Wolf's desperate need for equipment to flesh out his growing Wolf Empire led to the design's revival at Earthwerks Incorporated on Keystone. Returning to active duty, the Woodsman once again demonstrated its enduring utility, and the Raven Alliance has reportedly made inquiries about reacquiring the design for their own touman.</p>
