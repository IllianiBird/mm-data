chassis: "Flamberge"
model: "B"
overview: |-
  <p>The Flamberge is a seventy-ton Clan Jade Falcon OmniMech that entered service in 3077. Born from a repurposed experimental testbed, the design was developed during the Jihad when Clan Jade Falcon found itself cut off from the Homeworlds and in desperate need of new heavy platforms. Manufactured in the Inner Sphere Occupation Zone, the Flamberge was intended as a heavy striker to complement the Hellbringer and Summoner in the Falcon touman. Its distinctive birdlike silhouette and fixed shoulder-mounted missile launchers give it an imposing battlefield presence that quickly secured it a prominent position in the Jade Falcon force structure and helped define the Clan's Dark Age era design aesthetic.</p>
capabilities: |-
  <p>Built on a JF 7 Light Endo Steel frame and powered by a 280-rated XL fusion engine, the Flamberge trades raw speed for durability and firepower. Its maximum ground speed of sixty-four kilometers per hour makes it slower than most front-line OmniMechs in its weight class, but thirteen and a half tons of standard armor provide excellent protection for sustained engagements. The design's thirty-five tons of pod space offer considerable flexibility in weapons loadouts, and most configurations take advantage of jump jet capability that the chassis was specifically engineered to support.</p><p>The base frame mounts a fixed pair of Pattern J7 SRM-6 launchers in the shoulders, a legacy of the original Partial Wing prototype's configuration that was retained to avoid further development delays. While this reduces available pod space, the shoulder-mounted missiles provide a reliable close-range punch across all configurations. The Prime configuration exemplifies the Flamberge's intended role as a mobile striker, pairing twin ATM-6 launchers with four medium pulse lasers and Improved Jump Jets to deliver flexible, accurate firepower while maintaining battlefield mobility. Eleven fixed double heat sinks on the base frame provide a solid thermal foundation that most configurations supplement with additional sinks.</p>
deployment: |-
  <p>Configured as a mixed-range harasser, the B mounts three plasma cannons distributed across the center torso and both arms, each arm also carrying an ER medium laser alongside the cannon. An ER large laser in the right torso extends the engagement envelope, while a targeting computer enhances accuracy across all weapons. Standard jump jets provide adequate mobility, and six extra double heat sinks help manage the significant thermal load generated by the plasma weaponry. Six tons of plasma ammunition and two tons of SRM reloads ensure the configuration can sustain prolonged engagements, making it particularly effective at degrading enemy formations through heat transfer and armor ablation.</p>
history: |-
  <p>The Flamberge's entry into service in 3077 came at a critical juncture for Clan Jade Falcon. With supply lines to the Clan Homeworlds severed during the Jihad, the design represented the Falcons' determination to rebuild their touman using whatever resources remained available in the Inner Sphere Occupation Zone. The conversion of the failed Partial Wing testbed into a viable front-line OmniMech demonstrated the ingenuity of the Falcon scientist caste working under extreme pressure.</p><p>Upon entering service, the Flamberge was immediately assigned to premier Jade Falcon formations, including Epsilon's Fifth Battle Cluster and the First Falcon Strikers. The design proved popular among prominent warriors and ristar candidates, and Gamma Galaxy reportedly requested as many units as production could supply. Its combat debut validated the design philosophy, with Falcon MechWarriors exploiting the OmniMech's flexibility to adapt configurations for specific engagements.</p><p>A notable early engagement on Phecda saw a Flamberge pilot employ the B configuration's plasma cannons and infernos to devastating effect against a former Smoke Jaguar warrior, dampening return fire while closing to exploit the design's close-range missile armament. Such engagements helped establish the Flamberge's reputation and secured its acceptance even among traditionalist elements within the Clan who might otherwise have dismissed a design born from a failed experiment.</p><p>Following the Jihad's conclusion, an influx of Clan Wolf scientists to the Jade Falcon domain provided the expertise needed to finally resolve the Partial Wing integration problems that had plagued the original project. The Flamberge 2 and 3 variants, introduced in 3087, successfully incorporated the experimental technology, granting near-flight capability through improved jump jets working in concert with the restored wing surfaces. Whether these prototypes represent a restart of the original Partial Wing program or remain limited production curiosities continues to be debated among military analysts.</p><p>By the Dark Age era, the Flamberge had become firmly established in the Jade Falcon touman and had spread beyond Falcon exclusive use. Captured examples appeared in Lyran Commonwealth service, with at least one unit operated by a senior officer of the Second Donegal Guards. Mercenary commands with Clan heritage connections have also fielded the design, further expanding its battlefield presence across the Inner Sphere.</p>
