chassis: "Field Gun Platoon (AFFS)"
model: "(Motorized RAC2 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing rotary autocannon that fire in rapid bursts, these field gun crews deliver a volume of sustained fire that suppresses enemy positions more effectively than single-shot weapons of comparable caliber.</p>
