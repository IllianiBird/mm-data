chassis: "Chimeisho JumpShip"
model: "(3056)"
overview: "<p>The Chimeisho-class JumpShip is a product of the Draconis Combine\u0092s technological renaissance, marking the reactivation of the Izumi JumpShip yards at Altair by the Kurita Combine Munitions Corporation. Operated by a crew of thirty who live in cramped yet technologically advanced quarters, the Chimeisho was initially produced exclusively for the Draconis Combine Mustered Soldiery (DCMS) to bolster their strategic interstellar capabilities in the mid-3050s.</p>"
capabilities: |-
  <p>The Chimeisho-class has a traditional needle-like shape featurings a spherical command section at one end, a blocky drive at the other, with twin docking collars located midway along the body. Unlike most Inner Sphere JumpShips, it carries offensive weapons comparable to a middling aerospace fighter, primarily pulse lasers and extended-range lasers. Despite its weapons, it is lightly armored compared to a DropShip and cannot sustain heavy damage. The 30 crew members live in cramped, well-equipped dual-occupancy cabins located below the bridge. Only senior officers have private shower and toilet facilities. A spacious recreation area with modern entertainment systems is provided to compensate for the small cabins. A spacious hangar in the command section provides facilities for up to four small craft, typically two light aerospace fighters and two ST-46 shuttles. Technicians and pilots have staterooms directly above the hangar, on the same deck as the life-support system.</p>
history: |-
  <p>The Chimeisho is produced following the reactivation of the Izumi JumpShip yards at Altair, which had been derelict since the start of the Succession Wars. After the War of 3039, the Kurita Combine Munitions Corporation (KCMC) used state grants to reconstruct the yard. Only two have been produced to date, both purchased by the DCMS. The DCMS has also purchased all units scheduled through 3062, with KCMC taking new orders for 3063.</p>
