chassis: "Motorized Duplus Contubernium (MHAF)"
model: "(Rifle 3049+)"
overview: |-
  <p>The Marian Hegemony Armed Forces organize their conventional infantry along Roman legionary lines, with formations structured into contubernia, centuries, and cohorts rather than the squads and platoons used by Inner Sphere armies. A duplus contubernium, or double tent-group, fields two squads of ten soldiers. Motorized duplus contubernia use light vehicles for rapid deployment across Hegemony worlds, trading the staying power of heavier mechanized transport for speed and operational reach on patrol and screening duties. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon available, these formations deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
