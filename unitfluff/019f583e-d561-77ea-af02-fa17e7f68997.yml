chassis: "Night Stalker"
model: "NSR-KC"
overview: |-
  <p>The Night Stalker is a forty-ton medium BattleMech introduced in the mid-thirty-second century by Victory Conditions Industries of Mizar. As the company's first original BattleMech design, the Night Stalker was specifically built for fast reconnaissance and close-quarters combat. Victory Conditions unveiled the design in the arenas of Solaris VII, where its speed and unusual melee capabilities quickly captured the attention of arena crowds and military procurement officers alike. The Night Stalker's combination of high speed, electronic warfare capability, and close-combat specialization fills a niche that few contemporary designs can match, making it a popular choice for scout and pursuit lance commanders.</p>
capabilities: |-
  <p>Speed defines the Night Stalker's tactical doctrine. A Pitban 320 XL extralight engine pushes the forty-ton chassis to 129 kph, allowing it to keep pace with all but the lightest scout 'Mechs. This mobility serves the design's primary role as a reconnaissance and pursuit platform, supplemented by a Beagle active probe for detecting hidden units and TAG for designating targets for artillery support. A torso-mounted cockpit provides enhanced survivability for the MechWarrior, though at the cost of reduced visibility common to such configurations.</p><p>The Night Stalker's armament is optimized for intermediate and close-range engagements. A pair of Aggressor extended-range medium lasers in the right arm provides reliable striking power, while a Victory Conditions SRM-6 launcher delivers additional punch at shorter distances. An Aggressor ER small laser and Martell small pulse laser round out the weapons array for point-blank fighting. The design's most distinctive feature is the lance mounted on its unusually shaped left arm, which allows a skilled MechWarrior to exploit the 'Mech's speed for devastating charging attacks. Six and a half tons of Paulina ferro-fibrous armor provides reasonable protection for the chassis weight, though pilots must rely on speed rather than armor when facing heavier opponents. The lack of jump jets limits the Night Stalker's tactical flexibility in rough terrain.</p>
deployment: |-
  <p>This variant adapts the Night Stalker for network-centric warfare by incorporating a C3 slave unit. This variant retains the twin ER medium lasers, Beagle active probe, and lance from the K3 while upgrading the SRM-6 to a Streak SRM-6. The remaining secondary weapons are removed to accommodate the C3 computer. When operating within a C3 lance, the KC's high speed and active probe make it an ideal forward node, feeding precise targeting data to heavier lance mates while remaining fast enough to disengage before the enemy can pin it down.</p>
history: |-
  <p>Victory Conditions Industries established itself as a military manufacturer on Mizar during the Republic of the Sphere era, producing VTOLs and small arms before venturing into BattleMech design. The Night Stalker was the company's bold entry into the 'Mech market, and its debut in the Solaris VII arenas during the mid-3130s proved a masterstroke of marketing. Physical-combat 'Mechs armed with melee weapons had long been crowd favorites on Solaris, and the Night Stalker's distinctive curved lance and blistering speed made it an immediate sensation. Arena success translated directly into military contracts as procurement officers across the Inner Sphere took notice.</p><p>The Republic Armed Forces were among the first to field the Night Stalker in scout and pursuit formations, where its speed and electronic warfare suite proved particularly valuable. As the Republic contracted following the Gray Monday HPG blackout and the rise of Fortress Republic, Victory Conditions found eager buyers among the Federated Suns, Lyran Commonwealth, and mercenary commands throughout the Inner Sphere. The design's relatively uncomplicated construction and reliance on proven technologies made it accessible to a wide range of military customers, and the Night Stalker quickly earned a reputation as a capable pursuit 'Mech.</p><p>During the Dark Age conflicts, Night Stalkers saw action across numerous theaters. On Alcor in 3144, a Clan Wolf Binary tested the defenses of mercenary forces holding the planet for the Galatean Defense League. Night Stalker-equipped MechWarriors from the mercenary command known as the Nine Fingers engaged Wolf forces in running battles that demonstrated the design's effectiveness against Clan opponents in the pursuit and skirmish role. Republic elements of the XI Hastati also deployed Night Stalkers extensively, conducting raids from Imbros III against Rasalhague Dominion positions on Ko and Atria.</p><p>The Solaris VII arena circuit continued to serve as both a proving ground and marketing showcase throughout the Dark Age. Arena variants optimized for close-range physical combat became perennial crowd favorites, further cementing the Night Stalker's reputation. The shift in Mizar's political control (from Republic of the Sphere to independent status during the Dark Age, and eventually to the Galatean League) did not interrupt Victory Conditions' production, and the Night Stalker remained in active manufacture into the ilClan era.</p>
