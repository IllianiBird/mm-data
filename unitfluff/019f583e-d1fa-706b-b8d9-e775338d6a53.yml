chassis: "Ostsol"
model: "OTL-8M"
overview: |-
  <p>The Ostsol emerged in 2694 as Ostmann Industries' answer to demands for an ammunition-independent heavy 'Mech capable of extended independent operations. Rather than compete with their own successful Ostroc line, Ostmann licensed the new design to Kong Interstellar Corporation, whose production facilities on Connaught could meet Star League Defense Force requirements. The first Ostsols entered service with SLDF Hussar and Dragoon regiments, where their all-energy armament proved ideal for deep raids and extended deployments.</p><p>The Ostsol's design philosophy prioritized self-sufficiency over raw firepower. Armed exclusively with lasers and requiring no ammunition resupply, the 'Mech could operate behind enemy lines indefinitely, limited only by its pilot's endurance. This capability, combined with sophisticated sensor systems and respectable speed, made the Ostsol a natural choice for reconnaissance lance command positions despite its heavy weight classification.</p>
capabilities: |-
  <p>The Ostsol mounts two Tronel III Heavy large lasers in the side torsos as primary armament, delivering substantial damage at medium-to-long ranges. Four Tronel II medium lasers provide close-range firepower, with two mounted forward and two covering the rear arc. This rear-firing capability distinguishes the Ostsol from most heavy 'Mechs, allowing it to discourage pursuit and engage multiple opponents simultaneously, though it necessarily limits the firepower available against any single target.</p><p>The highly sensitive TRSS.2L3 targeting-tracking system represents one of the Ostsol's most valuable assets. Capable of detecting enemies at extended ranges even in difficult terrain, this electronics suite frequently led to Ostsols being assigned as lance command platforms despite the design's cavalry origins. Great care was invested in preserving these sensors during the technology-poor Succession Wars, as they could not be easily replaced.</p><p>A nineteen-ton Vlar 300 engine drives the Ostsol to 86 kilometers per hour, matching the Ostroc's speed while sixteen heat sinks manage the considerable thermal load of the all-laser armament. Nine tons of armor provide adequate protection, though like its sister design, the Ostsol suffers from weak rear armor that makes prolonged rear-arc engagements inadvisable despite the presence of rear-firing weapons. The 'Mech's fully functional hands make it particularly effective in physical combat, compensating somewhat for its inability to concentrate all weapons forward.</p>
deployment: |-
  <p>This variant represented Kong Interstellar's first Free Worlds League design to incorporate triple-strength myomer, pushing the boundaries of what an Ostsol could achieve. A massive 360-rated XL engine made it exceptionally fast for its weight class, while the TSM provided additional speed and devastating melee capability when the 'Mech ran hot. Armament centered on a PPC supplemented by large, medium, and small lasers in various configurations, ensuring the myomer would activate during sustained combat. The complexity of the design limited production numbers, but those that reached the field proved formidable opponents capable of both ranged harassment and close-quarters brutality.</p>
history: |-
  <p>Kong Interstellar's Ostsol production served the SLDF exclusively until 2752, when an amendment to Council Edict 2650 permitted sales to Member States. This wider distribution ensured the design's survival when Kong's Connaught facilities were destroyed during the First Succession War. Unable to manufacture complete 'Mechs, Kong continued producing spare parts that kept the widely-dispersed Ostsol fleet operational throughout the Succession Wars era.</p><p>The design's fortunes improved dramatically when Kong partnered with Free Worlds League engineers to produce the OTL-5M, incorporating recovered Star League technology just as the Clan Invasion began. This upgrade replaced the standard weapons with pulse laser variants and added an anti-missile system, though the use of an extralight engine made the refit controversial among traditionalists who valued the original's durability.</p><p>A second major revival occurred in 3064 when Duke James Sandoval's unsanctioned invasion of the Draconis Combine backfired catastrophically. With the FedCom Civil War consuming available military production, Robinson Standard BattleWorks received orders to identify older designs suitable for rapid modernization. The Ostsol proved an excellent candidate, and RSB's OTL-6D refit incorporated triple-strength myomer, advanced lasers sourced from the Outworlds Alliance, and a sophisticated targeting computer. These refits helped replenish Draconis March forces depleted by the failed invasion.</p><p>The Jihad saw Kong Interstellar's facilities damaged again during the liberation of Connaught, destroying their orbital endo steel production capability and XL engine stockpiles. Working with RAF specialist Rebecca O'Donaghue, Kong developed the OTL-9R as an assault-weight substitute using a standard engine and heavy-duty gyro. The Republic era brought further variants, and Clan Sea Fox's acquisition of Kong's design plans led to the Ostsol C, featuring Clan-grade weapons and reflective armor. Inner Sphere customers have eagerly purchased these advanced models despite their Clan origins.</p>
