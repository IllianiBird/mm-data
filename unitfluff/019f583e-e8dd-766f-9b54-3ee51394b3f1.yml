chassis: "Eagre Firefighting ATV"
overview: |-
  <p>The Eagre is truly an all-purpose vehicle. Nominally developed as a fire engine employed by specialized infantry in the Avalon Hussars, it is also a very sturdy, general-use all-terrain vehicle. Battery-powered, it eschews volatile fuels, and is generously armored to address its potential combat support duties, making it a true boon to the support elements of FedSuns RCTs.</p>
