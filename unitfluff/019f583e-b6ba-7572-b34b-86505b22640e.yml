chassis: "Field Gun Platoon (AFFS)"
model: "(Tracked AC20 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Towing assault-class autocannon that can crack the armor of any vehicle and threaten even BattleMech limbs, these field gun crews field the heaviest direct-fire weapons available to conventional infantry.</p>
