chassis: "Foot Platoon (LCAF)"
model: "(SRM 3058+)"
overview: |-
  <p>Lyran military budgets translate directly into infantry equipment quality, giving LCAF conventional forces a material edge that compensates for the uneven tactical leadership the social general tradition sometimes produces. Foot infantry platoons form the backbone of the LCAF's garrison forces, deploying on foot to hold positions, patrol perimeters, and secure urban areas where vehicles cannot easily operate. Armed with assault rifles and infantry-portable short-range missile launchers, these platoons carry enough anti-armor punch to threaten light vehicles and BattleMechs at close range.</p>
