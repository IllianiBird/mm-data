chassis: "Motorized Platoon (Generic)"
model: "(Firefighter 2200+)"
overview: |-
  <p>Firefighting platoons carry portable fire-suppression gear and breathing aparatus for responding to fires on the battlefield, on base, and in civilian areas. These engineers combat fires ignited by inferno munitions, fuel explosions, and energy weapon strikes that threaten friendly positions or civilian infrastructure. Motorized platoons use a variety of light off-road capable vehicles to rapidly respond to fires before they can beocme a major threat. Their lack of armament and non-combat focus mandates a security escort if hostilities are expected.</p>
