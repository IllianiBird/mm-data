chassis: "Icarus II"
model: "ICR-2X"
overview: |-
  <p>The Icarus II was the first homegrown BattleMech design to be mass-produced by the Free Worlds League. Introduced in 2518 by Corean Enterprises, the design represented a substantial upgrade of the earlier Icarus prototype, incorporating newly acquired jump jet technology that prompted Corean to add the "II" designation. Originally conceived as a light attack and cavalry 'Mech to complement the massive Mackie and support heavy Marik tanks, the Icarus II filled both support and strike roles within the Free Worlds League Military for centuries.</p><p>At its production peak, the design was manufactured on four separate worlds, and its low-cost simplicity earned it a loyal following among FWLM commanders. Though eventually overtaken by newer medium designs, the Icarus II has proven remarkably resilient, returning to production multiple times across its long service history and earning a reputation as one of the Inner Sphere's most enduring BattleMech lineages.</p>
capabilities: |-
  <p>At forty tons, the Icarus II occupied the lower end of the medium-weight classification. A DAV 160 fusion engine provided a top speed of sixty-four kilometers per hour, more than adequate when the design was introduced but increasingly outpaced as BattleMech technology matured. The Icarus 81 jump jets compensated for this limitation, allowing the 'Mech to leap up to one hundred and twenty meters and fight effectively in urban environments and broken terrain.</p><p>The primary weapon is an Imperator-B autocannon/10, a heavy main gun for a medium chassis that provided excellent range and hitting power. Two Diverse Optics Type 2 medium lasers and a single Diverse Optics Type 10 small laser supplemented the autocannon, giving the pilot options at multiple engagement ranges. Seven and a half tons of StarSlab armor provided adequate protection for the design's intended cavalry role, though the emphasis on firepower over armor became a liability as the Icarus II was increasingly pressed into strike and defensive assignments.</p><p>Late in its original service life, the Icarus II was typically paired with faster scouts in light attack lances. A fast scout would seek out the enemy, and then a trio of Icarus IIs would attack the designated target using concentrated autocannon fire. While effective, the 'Mech's limited speed meant it could not escape when overmatched.</p>
deployment: |-
  <p>This variant was developed by the Republic Institute of Strategic Combat beginning in 3135 at the RISC Proving Ground Fraternité on Terra. Built on the ICR-2S's endo-steel and XL engine platform rather than the original ICR-1S, the design replaces the twin TSEMPs of the ICR-2R with an experimental repeating TSEMP, one of the first 'Mechs to mount this weapon. Two medium pulse lasers linked to a targeting computer provide accurate backup firepower, supplemented by a small laser for close defense. Initial field trials saw the prototype deployed in covert operations, but engineering flaws in the repeating TSEMP proved impossible to correct on the Icarus platform. The RISC ultimately abandoned the design in favor of modular OmniMech configurations for further TSEMP development. The last surviving ICR-2X was pressed into service during the Clan invasion of Terra and saw action against Clan Jade Falcon forces, reportedly accounting for several disabled OmniMechs before the battle concluded.</p>
history: |-
  <p>The Icarus II entered production at Corean Enterprises on Stewart in 2518 and quickly became the standard BattleMech of the Free Worlds League for decades. As one of the first 'Mechs to use modern production technology, it cemented its place in the lore of the Free Worlds League Military. At the height of its prominence, the design was produced on four separate worlds, including Oriente where Oriente Weapon Works operated a second production line. The march of technology gradually rendered the Icarus II obsolete as faster, more capable medium designs entered service. Before the creation of the Star League, three of the four facilities were retooled for newer designs, with the Corean plant on Stewart continuing until it was destroyed in the First Succession War.</p><p>Despite the loss of all production capacity, a small number of ICR-1S models survived the Succession Wars, primarily serving with provincial militias where replacement equipment was scarce. These aging machines persisted through centuries of conflict, a quiet evidence of the fundamental soundness of Corean's engineering even if the design's combat relevance had long since faded.</p><p>The Icarus II experienced an unlikely renaissance during the Jihad. Gilmour Miltech, a small manufacturer on Talitha, began production of the modernized ICR-2S in 3073, producing only three units per year but representing the first new Icarus II models in over three centuries. Graham-Davis Enterprises on Tamarind soon followed with their own limited ICR-2S production, assisted by the government Venkateswara refit facility. These efforts met the desperate wartime demand for military hardware among forces cut off from larger manufacturers.</p><p>The Republic of the Sphere later recognized the Icarus II as a viable platform for advanced electronic warfare, with Gilmour Miltech producing the TSEMP-armed ICR-2R beginning in the Late Republic era. The Republic Institute of Strategic Combat pushed this concept further with the experimental ICR-2X mounting a repeating TSEMP, though the program was ultimately discontinued in favor of OmniMech-based TSEMP development.</p><p>In the ilClan era, Marian Arms on Alphard joined the ICR-1S and ICR-2S production network after upgrading from their earlier RetroTech Icarus lines with Graham-Davis assistance. A lone ICR-2X survived to see combat during the battle of Nagoya against Clan Jade Falcon forces, a fitting final chapter for one of the Inner Sphere's oldest BattleMech lineages.</p>
