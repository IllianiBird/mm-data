chassis: "Barghest"
model: "BGS-4T"
overview: |-
  <p>The Barghest was born from the personal ambition of Archon Katrina Steiner-Davion, who in the late 3050s directed TharHes Industries of Tharkad to create a new quadrupedal BattleMech designed to inspire dread on the battlefield, much as the venerable Atlas and Banshee had done for centuries. TharHes engineers drew heavily upon their experience with the Bushwacker, repositioning its forward-slung legs into a true quad configuration and increasing the chassis mass to seventy tons. Though TharHes executives initially resisted the quad layout due to the configuration's long-maligned reputation, the simultaneous appearance of new four-legged designs from the Draconis Combine and Free Worlds League convinced them of the concept's renewed viability.</p><p>Named after savage wolf-like creatures of Terran mythology, the Barghest entered full production in 3058 and quickly became one of the most recognizable quad designs in the Lyran arsenal, serving as a heavy fire support platform across multiple theaters of operation.</p>
capabilities: |-
  <p>Built around an Earthwerk BGS Quad chassis, the Barghest mounts a Magna 350 XL engine that propels the seventy-ton design to a respectable eighty-six kilometers per hour, impressive speed for a heavy 'Mech, though the extralight engine's vulnerability to side torso hits remains a persistent concern. Thirteen tons of Durallex Heavy armor provide solid protection against most threats, though the design's low-slung profile and quad stability partially compensate for the armor not reaching maximum coverage.</p><p>The primary configuration pairs two BlazeFire Sweetshot Extended Range Large Lasers with a devastating Defiance Disintegrator LB 20-X Autocannon, giving the Barghest a potent combination of long-range accuracy and close-range lethality. The LB-X's ability to fire cluster munitions provides tactical flexibility against lighter targets, while standard slugs can breach heavy armor at medium range. Ten double heat sinks manage the thermal load adequately under normal engagement conditions.</p><p>The design's simplicity is both strength and weakness. With only two energy weapons to fall back on should the autocannon run dry or jam, the Barghest becomes significantly less threatening at close range. However, the quad chassis provides exceptional stability for its weapons platform role, and the design's imposing, predatory silhouette achieves the Archon's original goal of psychological intimidation.</p>
deployment: |-
  <p>The production evolution of the experimental BGS-4X, this variant entered service in 3083 following extensive testing at TharHes's Gibbs research annex during the Jihad. Replacing the XL engine with a more compact GM 280 standard fusion engine, the design sacrifices the speed of earlier models for dramatically improved survivability. The centerpiece is a Defiance Annihilator Improved Heavy Gauss Rifle paired with a BlazeFire Sweetshot ER Large Laser and Defiance Model XII ER Medium Laser mounted in a quad turret, providing three-hundred-sixty-degree fire coverage. CASE II protects against catastrophic ammunition explosions, while a C3 slave unit integrates the design into networked lance formations. The small cockpit and reduced top speed of sixty-four kilometers per hour represent significant compromises, but the turret's ability to engage targets from any direction revolutionized quad 'Mech tactical doctrine. First assigned to the Royal Guard and Lyran Guard regiments, the design proved its worth in combined-arms operations where its networked targeting data amplified the effectiveness of its lancemates.</p>
history: |-
  <p>The Barghest entered service in 3058, with the first production models assigned to the five newly christened Alliance Jaegers, the Bolan, Skye, Donegal, Coventry, and Alarion Jaegers. These elite regiments, each drawing recruits exclusively from their namesake province, were intended to foster Lyran national pride under the Archon's political reforms. The Barghest's fearsome appearance made it an ideal symbol for these prestigious units.</p><p>Production continued at TharHes Industries on Tharkad through the FedCom Civil War, with TharHes developing several variant configurations to address different tactical needs. The BGS-2T and BGS-3T offered alternative weapons fits for commanders who preferred different engagement doctrines, while the core production line maintained steady output for Lyran Alliance forces.</p><p>The Jihad inflicted severe damage on TharHes's Tharkad facilities. Despite the destruction, the Barghest production line proved resilient enough to continue operating when other lines fell silent, and by the war's end it was one of the few 'Mech lines still running at the plant. During this period, TharHes's research annex on nearby Gibbs produced an experimental variant mounting an Improved Heavy Gauss Rifle in a revolutionary turret configuration, which eventually led to the production BGS-4T model entering service in 3083.</p><p>The design suffered another blow when Clan Wolf attacked Tharkad in 3142, destroying TharHes's BattleMech production lines entirely and leaving the factory capable of producing only battle armor at a fraction of its prior capacity. Though existing Barghests continue to serve throughout Lyran forces, new production has effectively ceased, making the remaining chassis increasingly valuable to their operators.</p>
