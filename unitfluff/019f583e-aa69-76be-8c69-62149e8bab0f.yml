chassis: "Lee"
model: "(Armor Carrier)"
overview: |-
  <p>The Lee class DropShip was one of the last major military transports produced for the Star League Defense Force before the fall of the Star League. Entering production in 2756, this massive 17,000-ton Spheroid was conceived as part of an ambitious effort to streamline the SLDF's military transport fleet by fielding a single heavily armed and armored vessel capable of delivering large formations faster than any existing design. At twice the size of the standard Overlord, the Lee represented a new generation of military transport that emphasized speed, protection, and payload capacity in equal measure.</p><p>The Lee was produced in four distinct configurations to serve different roles within SLDF combined-arms doctrine. Its primary design carried a reinforced battalion of BattleMechs supported by aerospace fighters, while alternate configurations served as dedicated fighter carriers, armored vehicle transports, and fast cargo runners. This versatility made the Lee a cornerstone of late Star League military logistics, though the class would prove tragically vulnerable to the automated defense systems that guarded the Terran Hegemony during its darkest hours.</p>
capabilities: |-
  <p>The Armor Carrier variant was configured to transport a full battalion of forty heavy combat vehicles alongside a regiment of mechanized infantry comprising twenty-seven platoons. Twenty-eight light vehicle bays provide additional capacity for scout elements and support vehicles, while eight small craft bays facilitate rapid personnel and materiel transfers. Cargo capacity of 1,068.5 tons supports the logistics demands of this large combined-arms force.</p><p>The crew complement of 1,356 is by far the largest of any Lee variant, reflecting the substantial number of vehicle crews, infantry personnel, and support staff embarked alongside the vessel's own operating crew. The armor, drive system, weapons array, and structural characteristics are identical to other Lee variants. The Armor Carrier's ability to deliver an entire combined-arms battalion in a single vessel made it invaluable during large-scale planetary assaults, though the concentration of so many troops in a single hull made each loss devastating to the formations depending on these transports.</p>
deployment: |-
  <p>The Armor Carrier variant was deployed to deliver combined-arms formations during large-scale planetary assaults, carrying heavy vehicle battalions and mechanized infantry regiments as a single integrated force. These vessels saw significant action during the Periphery Uprising, where their ability to land an entire combined-arms force simultaneously proved decisive in several campaigns. The concentration of so many troops in each hull made Armor Carrier losses particularly devastating during the Liberation of Terra, contributing to the decision to hold surviving transports in reserve until absolutely necessary.</p>
history: |-
  <p>The Lee class DropShip originated from a proposal presented to SLDF Commanding General Aleksandr Kerensky in 2749 by a consortium of three major naval yards in the Terran Hegemony. Kerensky's vision was to reduce the proliferation of military DropShip classes by creating a single design capable of carrying large payloads of SLDF troops into battle faster than anything currently in service. The development process was far from smooth, as political entanglements and boondoggles similar to those that had plagued the earlier Colossus class DropShip threatened to derail the program entirely.</p><p>Ironically, Star Lord Richard Cameron's attempts to block the Lee's production proved counterproductive. His opposition galvanized support among the Star League Council members who were increasingly wary of Cameron's erratic governance, and their collective approval pushed the design into production in 2756. The SLDF quickly ordered all four configurations, though the cargo transport variant saw the most limited production run with only three vessels completed before the program's priorities shifted to combat variants.</p><p>The Lee first saw major combat during the Periphery Uprising, where its ability to rapidly move large troop formations proved invaluable to the SLDF's suppression campaigns. The class's generous payload capacity allowed commanders to concentrate forces quickly at trouble spots, and the Lee's heavy armament meant it could contribute directly to orbital combat rather than relying entirely on escorts. These early engagements validated Kerensky's original vision of a fast, versatile military transport.</p><p>The Amaris Coup and subsequent Liberation of Terra transformed the Lee's role from triumphant to tragic. When the SLDF fought to reclaim the Hegemony, the Space Defense System's Caspar drone fleets proved devastatingly effective against the large, relatively slow transports. The Lee's substantial carrying capacity, once its greatest asset, became a catastrophic liability as each vessel destroyed took an enormous number of troops with it. Losses mounted so rapidly that surviving Lee transports were held in reserve until the final landings on Terra itself, where they deployed in large numbers for the climactic assault.</p><p>Few Lee class vessels survived the Liberation of Terra in operational condition, and those that did joined Kerensky's Exodus Fleet on its journey to the deep Periphery. The remaining ships were subsequently lost during the fierce fighting of the Pentagon Civil War, and no examples of the class are known to have survived into the modern era. The Lee stands as both a reflection of late Star League engineering ambition and a cautionary example of how concentrated transport capacity can become a strategic vulnerability.</p>
