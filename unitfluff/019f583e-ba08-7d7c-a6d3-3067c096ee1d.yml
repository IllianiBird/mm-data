chassis: "Foot demi-I (ComGuards)"
model: "(LRM)"
overview: |-
  <p>Under the reforms of Precentor Martial Anastasius Focht, Com Guard infantry train extensively in combined-arms cooperation, conducting regular exercises alongside heavier elements to ensure seamless coordination across all branches when battle demands it. Foot infantry Level I formations anchor defensive positions and garrison critical installations, providing the persistent ground presence that BattleMech and armor units cannot maintain indefinitely. Com Guard foot infantry train alongside heavier elements and understand their role within the larger combined-arms framework. Carrying infantry-portable long-range missile systems that extend the platoon's engagement envelope well beyond personal weapon range, these troops provide indirect fire support that can suppress enemy positions from distances where return fire is difficult.</p>
