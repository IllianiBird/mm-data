chassis: "Rampage"
model: "RMP-4G (Benboudaoud)"
overview: |-
  <p>The Rampage is an eighty-five-ton assault BattleMech originally designed for the Rim Worlds Republic, first entering service in 2735. Built by Weigel Armory and Munitions at their facility on Kwangjong-ni, the design served as a workhorse for Republican military forces for decades before being dramatically upgraded into a fast assault platform using captured Star League technology. The redesigned Rampage combined speed with hitting power, producing a chassis capable of keeping pace with much lighter units while delivering devastating volleys.</p><p>The Rampage earned a fearsome reputation during the final years of the Republic, and the destruction of its sole factory permanently ended production. Surviving examples became increasingly rare as the Succession Wars consumed irreplaceable machines, leaving the Rampage as a coveted relic of a bygone era.</p>
capabilities: |-
  <p>The upgraded RMP-5G Rampage was built for speed unusual in an eighty-five ton chassis. Engineers settled on an AMC 340 XL engine augmented by a MASC system, enabling the design to reach nearly ninety kilometers per hour in short bursts. This combination of mass and mobility allows the Rampage to keep pace with medium-weight formations or serve as heavy support for fast strike units. Sixteen tons of PanzerSlab Type 9 armor provide substantial protection for its weight class.</p><p>The Rampage's armament centers on a Lubalin LB 10-X autocannon capable of switching between standard and cluster munitions, paired with an Artemis IV-guided Jackson Dart LRM-10 for accurate long-range fire. Three Marklin Mini Streak SRM-2 launchers and a Tronel XIII large pulse laser deliver punishing close-range salvos, while two Maxell DT medium lasers and a Zippo Mark X flamer round out the weapons suite. A Buzzsaw anti-missile system provides some defense against incoming ordnance. Thirteen double heat sinks manage the thermal load adequately, though sustained fire from all weapons simultaneously can strain the cooling system. The design's reliance on an XL engine serves as a significant vulnerability, as critical torso damage can disable the 'Mech entirely.</p>
deployment: |-
  <p>This custom configuration was built for the commander of Rim Worlds Republic forces on New Dallas. Based on the RMP-5G chassis, the refit replaced the Streak SRM-2 launchers, LRM-10 with Artemis IV, and the MASC system with a single SRM-4 and an LRM-20, substantially increasing indirect fire capability at the cost of short-range precision and burst speed. The remainder of the armament, armor protection, and base performance characteristics were retained from the standard RMP-5G. This configuration saw combat during the fighting on New Dallas in 2766.</p>
history: |-
  <p>The Rampage was born from the Rim Worlds Republic's covert military buildup. Weigel Armory and Munitions constructed a secret factory half a kilometer beneath Kwangjong-ni's Lost Sea, using the body of water as both a power source and a means to disguise the facility's heat signature. Off-world workers lived inside the plant full-time to minimize security risks, while tunnels connected the factory to the nearby Britton mountains where the planetary garrison was stationed. This allowed newly produced 'Mechs and ammunition to be quietly added to Republic Army units before their rotation off-world.</p><p>The original RMP-2G served as one of the Republic's standard assault designs from 2735 onward, with the limited-production RMP-4G following in 2750 as an experimental upgrade incorporating emerging advanced technologies. When Stefan Amaris seized control of the Terran Hegemony in 2767, Republican engineers leveraged captured Star League research and development facilities to produce the dramatically upgraded RMP-5G. The factory on Kwangjong-ni was destroyed that same year.</p><p>During the Amaris Civil War, the Rampage earned a notorious reputation. Republican Guard units wielding the fast assault 'Mech were deployed in pacification operations across occupied Hegemony worlds, with the design's anti-personnel flamer seeing particularly grim use. The 'Mech proved effective in conventional combat as well, its combination of speed and firepower catching opponents who expected a slower assault platform off guard. More than one enemy commander misjudged a Rampage for a less mobile design and found themselves outmaneuvered and outgunned.</p><p>Republican holdouts destroyed access to the Kwangjong-ni facility during Operation ALMARIC to prevent it from falling into Lyran hands, permanently halting Rampage production. The design was classified as obsolete by 2780, and surviving examples became increasingly rare as the Succession Wars ground on without any source of replacement parts or new production. Though lostech prospectors discovered the defunct Weigel factory in 3062, no effort to restart Rampage production has been documented.</p>
