chassis: "Mechanized Wheeled Platoon (LCAF)"
model: "(Rifle AA 3058+)"
overview: |-
  <p>After the Jihad stripped many elite units to fill battle armor companies, the LCAF recognized that conventional infantry remained essential for roles that battle armor could not cost-effectively fill. Mechanized wheeled platoons use wheeled APCs that offer a balance between the speed of hover transport and the protection of tracked vehicles, well-suited to operations on developed road networks. Armed with assault rifles and man-portable anti-aircraft weapons, these platoons provide mobile air defense capability that can accompany mechanized formations on the move.</p>
