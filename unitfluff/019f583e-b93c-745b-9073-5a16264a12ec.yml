chassis: "Field Artillery Level I (ComGuards)"
model: "(Tracked Arrow IV)"
overview: |-
  <p>The Com Guards field conventional infantry as a core component of their combined-arms formations, with Level I infantry units integrated into the same command structure alongside BattleMech, armor, and aerospace elements at every organizational level. Manning Arrow IV artillery systems that fire guided munitions capable of precision strikes at extreme range, these crews provide the most accurate indirect fire available to conventional infantry formations, able to place rounds on specific targets rather than simply saturating an area.</p>
