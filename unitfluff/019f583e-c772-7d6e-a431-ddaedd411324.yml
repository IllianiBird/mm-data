chassis: "Cudgel"
model: "CDG-2B"
overview: |-
  <p>The Cudgel is a Solaris VII arena 'Mech originally conceived in the mid-thirty-first century by engineer Bertrum Moss for Innovative Design Concepts. Built upon surplus Charger chassis, the Cudgel was designed from the outset as a dedicated melee brawler, emphasizing devastating close-quarters physical attacks over ranged firepower. The original CDG-1B debuted in the Solaris arenas in 3053, and IDC later produced the upgraded CDG-2A in 3066 incorporating more advanced technology.</p><p>Despite its niche origins as a gladiatorial machine, the Cudgel has attracted interest from Solaris stables and independent operators seeking a purpose-built assault-weight brawler. IDC's status as one of the few Solaris design firms listed on the Lyran stock exchange has fueled ambitions to bring the Cudgel to wider military markets, though production remains extremely limited.</p>
capabilities: |-
  <p>The Cudgel's design philosophy centers on close-quarters dominance. Its primary weapons are the mace and battle claw mounted on its arms, keeping the limbs free of ranged weaponry to ensure unimpeded physical attacks. An LTV 400 XL engine drives the eighty-ton chassis to a respectable 86 km/h (comparable to many medium 'Mechs) while Triple Strength Myomer pushes that speed to 97 km/h once heat levels rise sufficiently. The activated TSM also doubles the damage inflicted by the Cudgel's melee weapons, transforming already powerful strikes into bone-crushing blows capable of crippling opposing 'Mechs in a single exchange.</p><p>Ranged capability, while secondary to its melee role, is not neglected. The CDG-2A mounts nine medium-class lasers (five standard and four extended-range models) distributed across the torso and head, with a single small laser providing additional rear coverage. This all-energy loadout eliminates ammunition dependency, an important consideration in prolonged arena bouts. Durallex Light ferro-fibrous armor provides solid protection for the 'Mech's weight class.</p><p>However, the reliance on an XL engine leaves the Cudgel vulnerable to torso destruction, a significant liability for a design intended to close to point-blank range where concentrated fire is inevitable.</p>
deployment: |-
  <p>This variant is a weapons-focused variant of the CDG-2A that trades the ten-laser battery for a more concentrated ranged armament. Five extended-range medium lasers provide effective mid-range firepower, while a Streak SRM-6 rack adds reliable close-range punch that complements the 'Mech's melee attacks. The reduced number of ranged weapons simplifies heat management, potentially allowing more frequent TSM activation for enhanced physical combat performance. Built on the same refurbished Charger platform as its CDG-2A sibling, this variant retains the upgraded engine, armor, and myomer systems of the 2A series.</p>
history: |-
  <p>The Cudgel's history is inextricably tied to Solaris VII's gladiatorial culture and the ambitions of Innovative Design Concepts. The design originated in the early 3050s when engineer Bertrum Moss, working with IDC, converted a surplus Charger chassis into a dedicated arena brawler. Moss designed the CDG-1B specifically for the Solaris circuits, equipping the eighty-ton frame with close-range weaponry and a mace-and-claw combination intended to deliver spectacular and devastating physical attacks.</p><p>The original Cudgel found a receptive audience in the arenas of Solaris City, where the spectacle of an assault-weight 'Mech charging into melee resonated with both stable owners and fight enthusiasts. However, the rapid advance of military technology through the Clan Invasion era soon left the CDG-1B behind. Some years after its debut, IDC reacquired the original Cudgel from a retired MechWarrior and began a thorough modernization program.</p><p>The result was the CDG-2A, which debuted in 3066 during the turbulent FedCom Civil War period. The refurbished design incorporated advanced armor, an upgraded engine, and Triple Strength Myomer, technologies that had become available as military innovations trickled down to the Solaris workshops. The Oonthrax Stable became the first paying customer for the CDG-2A, and IDC subsequently produced the CDG-2B variant by converting yet another Charger chassis in 3068.</p><p>Throughout its history, Solaris VII has changed hands multiple times (passing from Free Worlds League to Lyran to Federated Commonwealth control and back) and IDC has continued operations under each successive government. The firm's small-scale, Solaris-based production has remained largely beneath the notice of the larger powers contesting the Game World, allowing the Cudgel to persist as a niche but distinctive gladiatorial design across multiple eras of conflict.</p>
