chassis: "Gulon"
model: "GLN-1B SecurityMech"
overview: |-
  <p>The Gulon is a twenty-five-ton IndustrialMech produced by Alliance Motors, Limited on the Outworlds Alliance world of Sevon. Originally introduced around 3020 as a MiningMech, the GLN-1A was one of Alliance Motors' first 'Mech products and a surprisingly original design rather than a retreaded Dig King. Solid construction and heavy industrial armor lent the chassis to military adaptation, and a SecurityMech variant followed shortly after in 3026. The Gulon filled a vital niche as an armed garrison 'Mech for communities too poor or remote to maintain a proper BattleMech defense force, and it remains one of the most widely deployed IndustrialMechs in the Outworlds Alliance.</p>
capabilities: |-
  <p>The Gulon is built on the AML IndySteel MM Series industrial chassis and powered by an AML 100 fission engine, giving it a maximum speed of sixty-four kilometers per hour. The fission engine is the design's most distinctive and problematic feature. Built in collaboration with a Sevon-based nuclear power plant, the engine requires careful maintenance due to potential radiation hazards, a persistent difficulty that has shaped the design's reputation throughout its service life.</p><p>The SecurityMech variant mounts a Diverse Optics Type 2 medium laser as its primary weapon, supplemented by three Diverse Optics Type 10 small lasers originally designed to cut stone. An advanced fire control system enhances weapon accuracy, giving the Gulon a notable edge over comparable armed IndustrialMechs. The original AML mining drill is retained, providing a devastating close-quarters weapon against infantry and light vehicles. StarSlab/1.5 heavy industrial armor offers reasonable protection for a design of its weight class, though it cannot withstand sustained fire from dedicated BattleMechs. The combination of energy weapons, industrial tools, and manageable speed makes the Gulon an effective light garrison platform.</p>
deployment: |-
  <p>This variant entered production in 3026, refitting the Gulon chassis for a dedicated garrison role. The sprayer is replaced by a Diverse Optics medium laser, and an advanced fire control system is integrated to improve weapon accuracy. These modifications transformed the humble MiningMech into a credible light security platform, capable of engaging bandits, pirates, and light vehicles with reasonable effectiveness. The SecurityMech variant became the more widely recognized version of the Gulon, serving as the primary armed defender for Alliance communities throughout the Succession Wars and into the Raven Alliance era.</p>
history: |-
  <p>Alliance Motors, Limited established itself in the early thirty-first century as part of the Outworlds Alliance's modest but vital industrial base. The company's first major 'Mech product was the Gulon MiningMech, introduced around 3020 during the depths of the Late Succession Wars. Rather than producing yet another retread of the ubiquitous Dig King, Alliance Motors created a largely original design that would prove remarkably adaptable. Within six years, the SecurityMech variant entered production, beginning a long career as the primary armed 'Mech for countless Alliance communities.</p><p>Throughout the Late Succession Wars and into the Clan Invasion era, Gulons served as the backbone of local defense across Outworlds Alliance territory. Many communities relied on Gulons rather than proper BattleMechs for garrison duty, and it was not uncommon for lone Gulon pilots to function as itinerant protectors, each guarding several smaller settlements on backwater worlds. The 'Mech's combination of industrial utility and modest combat capability made it indispensable on planets that could not afford dedicated military hardware. The persistent maintenance difficulties of the fission powerplant, however, eventually drove Alliance Motors to explore alternative engine solutions, a line of development that would lead to the fuel cell-powered Rock Hound ProspectorMech.</p><p>The formation of the Raven Alliance, following Clan Snow Raven's integration with the Outworlds Alliance, brought Clan technology within reach of Alliance Motors for the first time. By 3112, Alliance Defenders Limited had produced a surplus of fusion engines originally destined for the Stinger IIC 2 production line. Several of these engines were rerouted to Alliance Motors on Sevon for installation in a new Gulon variant. Field testing of the resulting Gulon C SolahmaMech occurred that summer, when a pirate band raiding the remote Alliance outpost of Risin encountered two Gulons bearing the new Clan pulse laser armament. The pirates, outgunned and outmatched despite their numerical advantage, were carved apart with minimal damage to the defenders. Alliance Motors was so impressed with the results that they fast-tracked full production of the Gulon C and advocated similar live-fire trials on other pirate-plagued Alliance worlds.</p>
