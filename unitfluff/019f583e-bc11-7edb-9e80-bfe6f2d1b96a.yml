chassis: "Mechanized Tracked Platoon (DCMS)"
model: "(MG 2620+)"
overview: |-
  <p>The Combine's martial traditions extend beyond the BattleMech cockpit, and the Dictum Honorium demands that all citizens contribute their talents to the defense of House Kurita. Infantry soldiers of the DCMS embody that expectation on garrison worlds across the realm. Tracked mechanized infantry ride armored carriers that can cross rough ground where wheeled vehicles cannot follow. The DCMS values these platoons for operations on worlds with poor road infrastructure, where the broken terrain that stops lighter transport is simply another day's march for tracked APCs and the soldiers they carry. Their support squads operate portable machine guns that deliver sustained automatic fire at ranges well beyond personal weapons. A single well-placed machine gun team can suppress an entire enemy platoon and threaten light vehicles that would otherwise ignore conventional infantry.</p>
