chassis: "Snow Fox (Omni)"
model: "Prime"
overview: |-
  <p>The Snow Fox OmniMech is a twenty-ton quad design developed by the Escorpion Imperio, the Deep Periphery state built by Clan Goliath Scorpion following their Abjuration from Clan space. Introduced around 3111, the design represents the Imperio's renewed capability to produce advanced Clan technology, including OmniMechs. Drawing upon the original Ice Hellion Snow Fox chassis as inspiration, the OmniMech variant retains the quad configuration and speed emphasis of its predecessor while incorporating modern construction techniques.</p><p>Despite the 'Mech's diminutive frame, the design provides six tons of pod space for reconfiguration, offering tactical adaptability that the original integrated Snow Fox lacked. The Snow Fox OmniMech represents one of relatively few original designs to emerge from the Deep Periphery during the late Dark Age period.</p>
capabilities: |-
  <p>The Snow Fox OmniMech builds upon the speed-focused philosophy of its predecessor while adding the advantages of OmniMech reconfiguration. Powered by an extralight engine, the chassis achieves impressive speed, and a permanently mounted MASC system pushes this further in short bursts, making the design exceptionally fast for any weight class. The endo steel internal structure and ferro-fibrous armor maximize available tonnage, yielding six tons of pod space for weapons and equipment.</p><p>The Prime configuration demonstrates the design's versatility by pairing three extended-range medium lasers with a targeting computer for enhanced accuracy. An active probe and ECM suite provide a comprehensive electronics package well suited to reconnaissance and electronic warfare roles. The permanently fixed MASC system cannot be removed during reconfiguration, ensuring that all variants retain the chassis's signature burst speed capability. Four tons of ferro-fibrous armor offer reasonable protection for a light quad 'Mech, though the design remains vulnerable to concentrated fire and relies primarily on speed and electronic countermeasures for survivability.</p>
deployment: |-
  <p>This variant configuration equips the Snow Fox OmniMech with three extended-range medium lasers, one in the head and one in each side torso, all linked to a targeting computer for improved accuracy. An active probe and ECM suite round out the electronics package, providing both detection capability and protection against enemy sensors and guided munitions. This configuration mirrors the spirit of the original Snow Fox as a fast reconnaissance and harassment platform, updated with modern technology and enhanced electronic warfare capabilities.</p>
history: |-
  <p>The Snow Fox OmniMech emerged from the Escorpion Imperio's decades-long industrial rebuilding program following their Abjuration from the Clan Homeworlds in 3080. After absorbing the remnants of Clan Ice Hellion, the Goliath Scorpions preserved much of the Hellion's military heritage, including familiarity with the original Snow Fox design. Under the leadership of successive Khans, the Imperio accelerated technological development, eventually regaining the capability to produce OmniMechs.</p><p>The Snow Fox OmniMech first saw major combat during the Hanseatic Crusade of 3140 to 3141, when the Scorpion Empire launched a full-scale invasion of the Hanseatic League. The design's exceptional speed proved valuable in the fast-moving campaign across the League's twenty-nine worlds, where rapid redeployment and flanking maneuvers characterized the Scorpion offensive. The conquest of Bremen and the subsequent formation of the Scorpion Empire in March 3141 secured the design's production future as part of the expanded state's military apparatus.</p><p>Specific factory details for the Snow Fox OmniMech remain undocumented in available records, though production is attributed to the Scorpion Empire's industrial base within the former Imperio and conquered Hanseatic territories. Given the Imperio's isolation from mainstream Clan society and the Inner Sphere, the Snow Fox OmniMech represents one of relatively few original designs to emerge from the Deep Periphery during the late Dark Age period.</p>
