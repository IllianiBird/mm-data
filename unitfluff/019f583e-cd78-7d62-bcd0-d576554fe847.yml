chassis: "Red Shift"
model: "RDS-2A"
overview: |-
  <p>The Red Shift was introduced in 3062 as the first BattleMech produced by Leopard Armor, a venerable Terran vehicle manufacturer that transitioned to BattleMech production under the Word of Blake. Primarily conceived as a TAG spotter for combined-arms formations reliant on Arrow IV artillery, the twenty-ton design filled a critical tactical niche within the Word of Blake Militia. The Red Shift's development was driven by the need to complement Leopard Armor's own Padilla Heavy Artillery Tank, creating an integrated targeting and fire support partnership. Despite its narrow specialization, the Red Shift proved effective enough to see widespread distribution across the Militia, establishing Leopard Armor as a capable BattleMech manufacturer.</p>
capabilities: |-
  <p>The Red Shift's design philosophy centers entirely around its TAG targeting system, making it one of the few light BattleMechs purpose-built as an artillery spotter. A GM 180 XL extralight engine drives the twenty-ton chassis to speeds exceeding 150 kilometers per hour, giving it the agility to reach forward observation positions and evade enemy fire. The Leopard Mark I endo steel frame saves critical weight that is allocated to four tons of StarSlab/1 ferro-fibrous armor, providing impressive protection for a design in its weight class.</p><p>The Guardian ECM suite serves a dual purpose, shielding both the Red Shift and the Padilla artillery vehicles it supports from advanced electronic warfare systems such as Artemis IV and C3 networks. For self-defense, two Tronel XII medium pulse lasers provide accurate close-range firepower, their enhanced tracking capability proving particularly effective against other fast-moving light 'Mechs and vehicles. Ten double heat sinks manage waste heat efficiently, allowing the MechWarrior to fire both lasers while maintaining full speed.</p><p>The design's primary weakness lies in its narrow mission profile, as the Red Shift contributes relatively little direct firepower to engagements where artillery support is unavailable or unnecessary.</p>
deployment: |-
  <p>This variant serves as the baseline production model of the Red Shift, entering service in 3062 with the Word of Blake Militia. This configuration was typically assigned alongside Padilla Heavy Artillery Tanks or other Arrow IV-equipped units, where its combination of spotting capability and electronic protection proved most effective. In some cases, Red Shifts were attached to missile-heavy formations, as the Word of Blake had access to the Free Worlds League's semi-guided warhead technology, allowing the design's TAG system to enhance indirect fire accuracy beyond its primary artillery-spotting role.</p>
history: |-
  <p>The Red Shift's origins are deeply intertwined with the Word of Blake's consolidation of power on Terra. When the Blakists seized control of the Terran system from ComStar in the late 3050s, Leopard Armor, a venerable vehicle manufacturer based in North Africa, simply transferred its contracts to the new regime. The company had maintained a long history of producing combat vehicles for both the Terran Hegemony and ComStar, including the Demon, Rhino, and Padilla Heavy Artillery Tank.</p><p>Following the restart of Padilla production for the Word of Blake Militia around 3058, Leopard Armor's design team undertook the ambitious challenge of developing a BattleMech specifically to complement the heavy artillery tank. The result was the Red Shift, which entered production in 3062 as the company's first foray into BattleMech manufacturing. The design's emphasis on TAG spotting for Arrow IV artillery systems reflected a deliberate effort to recreate combined-arms tactics dating back to the original Star League era.</p><p>The Red Shift saw rapid deployment across the Word of Blake Militia, with every division receiving at least some examples of the design. During the Jihad, Red Shifts served on numerous fronts, often operating in tandem with Padilla batteries. On Outreach in 3068, a Red Shift gained notoriety harassing Wolf's Dragoons guerrilla forces during the Second Battle of Outreach, directing artillery fire and leading defenders into ambushes throughout the campaign.</p><p>Production of all Red Shift variants ceased with the destruction of the Word of Blake during the Jihad's conclusion. The Leopard Armor facility on Terra subsequently fell under Republic of the Sphere control, but Red Shift production was not resumed. Surviving examples became increasingly rare in the post-Jihad era, though the design's specialized nature meant few operators had reason to seek them out without access to Arrow IV-equipped support vehicles.</p>
