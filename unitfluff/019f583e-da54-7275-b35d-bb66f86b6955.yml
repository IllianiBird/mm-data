overview: |-
  <p>The Ostroc was designed in 2511 by Ostmann Industries as a dedicated urban combat platform for the Terran Hegemony's garrison forces. Distinguished by its low-slung walker-pod profile that would later inspire designs like the Stalker and Marauder, the Ostroc combined a silhouette comparable to the diminutive UrbanMech with the firepower expected of a heavy 'Mech. This unique combination made the design exceptionally difficult to target among the towers and debris of contested cityscapes.</p><p>Ostmann Industries' limited production capacity meant the Ostroc remained relatively rare throughout its service life, though the design's reputation for reliability and its interchangeable components with other Ost-series 'Mechs ensured its continued use across the Succession Wars and beyond. Multiple manufacturers eventually took up production, keeping the Ostroc relevant on battlefields well into the thirty-second century.</p>
capabilities: |-
  <p>The Ostroc's primary armament centers on twin Fuersturm-C large lasers mounted in the side torsos, providing effective medium-to-long range firepower without ammunition dependency. Secondary weapons include paired Fuersturm-b medium lasers and a single Totschlagen SRM-4 launcher, giving the design respectable close-range punch. This weapons mix allows the Ostroc to operate effectively as a guerrilla fighter, largely independent of supply lines that might be disrupted in urban combat zones.</p><p>The nineteen-ton Vlar 300 fusion engine propels the Ostroc to speeds of 86 kilometers per hour, making it fast for its weight class and capable of dictating engagement ranges against heavier opponents. Fifteen standard heat sinks provide adequate thermal management for sustained combat. Nine tons of Riese-475 armor offer reasonable protection, though the design's distinctive short arms receive minimal plating and are frequently lost in combat.</p><p>This weak arm protection represents the Ostroc's primary tactical liability. The shocks of physical combat can easily damage the torso-mounted Fuersturm weapon systems, and the loss of one or both arms significantly compromises the 'Mech's ability to brace itself during close-quarters engagements. Experienced pilots learn to leverage their speed advantage to avoid such situations entirely.</p>
deployment: |-
  <p>Kong Interstellar returned to Ostroc production in 3139 with Clan Sea Fox assistance, choosing an optimistic design philosophy that pushed performance boundaries. The OSR-6R mounted an endo-composite chassis supporting a massive Hermes 360 XL engine that propelled the 'Mech to an extraordinary 97 kilometers per hour, making it one of the fastest heavy designs ever produced. Clan-grade extended-range large and medium lasers provided superior firepower, while Durallex reflective armor and CASE II offered protection against both energy weapons and ammunition explosions. A Harpoon Streak SRM-4 rounded out the armament. The variant proved faster, harder-hitting, and cooler than Ronin's competing OSR-3M, though its reliance on components shipped through contested Wolf Empire, Republic, and Free Worlds League space made continued production uncertain. Kong gambled that no faction would risk interfering with Clan Sea Fox deliveries.</p>
history: |-
  <p>The Ostroc served as the flagship design of Ostmann Industries throughout the Star League era, seeing action in every major conflict from its introduction through the Amaris Civil War. Although primarily assigned to garrison duties within the Terran Hegemony, the 'Mech earned a reputation for reliability that kept it in service long after original production ceased. Ostmann licensed its other Ost-series designs to Kong Interstellar simply to maintain adequate output across its product range. Urban legend holds that ComStar founder Jerome Blake himself piloted an Ostroc during the seizure of Terra, though historical records remain inconclusive.</p><p>The destruction of Ostmann Industries' Terra facility during the Amaris Civil War ended production of new Ostrocs, but the design's simple construction and parts compatibility with other Ost-series 'Mechs allowed surviving examples to soldier on. The Draconis Combine became particularly adept at maintaining these aging warriors, and Ostrocs remained common sights in Combine formations throughout the Succession Wars. The wide dispersal of surviving units actually worked against the design when lostech recovery began after the Helm Memory Core discovery, as no concentration of Ostrocs existed to justify dedicated upgrade programs.</p><p>Revival came from an unexpected quarter. The Capellan Confederation's Strategios, having rebuilt their forces after decades of setbacks, ordered all manufacturers to submit bids for a modernized Ostroc replacement. Ceres Metals won the contract with a complete redesign that retained only the name and general profile, entering production in January 3067. The Taurian Concordat and Circinus Federation soon fielded suspiciously similar variants, leading to espionage accusations that further strained Trinity Alliance relations.</p><p>Kong Interstellar, the original licensee of other Ost-series designs, finally returned to Ostroc production in 3139 with Clan Sea Fox assistance. Their new OSR-6R variant incorporated Clan-grade weapons and advanced materials, though its reliance on components shipped through contested space makes continued production uncertain. Meanwhile, Ronin Incorporated on Wallis has produced modest numbers of the OSR-3M, drawing heavily on locally-sourced Ostwar components to maintain Regulan self-sufficiency during the ongoing conflicts fragmenting the former Free Worlds League.</p>
