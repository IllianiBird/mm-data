chassis: "Mechanized Wheeled Platoon (AFFS)"
model: "(Rifle Heavy 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Mechanized wheeled platoons ride wheeled transports that offer good speed on roads and developed terrain, making them well-suited to garrison duty on worlds with established infrastructure where rapid response matters more than cross-country capability. Carrying heavy assault rifles alongside their standard arms, these platoons pack a harder punch than standard rifle formations, trading some logistical simplicity for increased stopping power against armored targets.</p>
