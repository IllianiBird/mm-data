chassis: "Field Gun Platoon (CCAF)"
model: "(Tracked LBX2 3060+)"
overview: |-
  <p>Capellan infantry serve where BattleMechs and armor cannot be spared, which in the resource-constrained CCAF means nearly everywhere. The Xin Sheng movement revitalized the infantry arm alongside every other facet of the Capellan Confederation Armed Forces, giving foot soldiers better equipment and renewed purpose. Field gun platoons provide Capellan infantry with organic direct-fire heavy weapons, towing crew-served autocannons or other heavy guns to prepared positions. The weapon crew operates the gun while the remaining troopers provide local security with personal arms. Their LB 2-X autocannon can fire cluster ammunition for increased hit probability against fast-moving targets, adding tactical flexibility to the crew-served weapon role.</p>
