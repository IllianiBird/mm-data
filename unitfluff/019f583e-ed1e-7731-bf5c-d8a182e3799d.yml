chassis: "Pinto Corvette"
model: "(2502)"
overview: |-
  <p>The Pinto-class corvette was the backbone of Periphery naval power for centuries, serving as a picket and patrol vessel across four major Periphery states. Designed and first constructed by Rockwell-Vasquez Starcraft of the Rim Worlds Republic in the twenty-sixth century, the Pinto became one of the most widely produced WarShips outside the Star League. Its relatively modest displacement and mixed armament made it well suited to system defense and convoy escort duties, though it lacked the firepower to stand against dedicated capital WarShips in a fleet engagement. The design's accessibility and comparatively low cost relative to larger vessels made it attractive to smaller nations that could not afford the Star League's heavier designs, earning the Pinto a lasting reputation as the defining Periphery corvette of its era.</p>
capabilities: |-
  <p>Displacing 160,000 tons across 298 meters of hull, the Pinto carries a diverse armament reflecting its Periphery origins. The forward-arc offensive punch comes from two Light Naval PPCs in the nose, supplemented by five Large Lasers and ten Medium Lasers for anti-fighter defense. Each broadside mounts a NAC/10 naval autocannon alongside two AC/20s and five AC/5s, providing respectable close-range firepower against both capital ships and smaller craft. Two Barracuda capital missile launchers per aft quarter give the vessel rear-arc striking capability, while three NL35 naval lasers are distributed across the forward and aft arcs. An extensive array of small lasers and machine guns across four arcs provides layered anti-fighter and anti-boarding defenses. Eight hundred single heat sinks manage the thermal load. Ninety-three tons of standard armor over a structural integrity of twenty-nine provide adequate protection for a vessel of its role. The Pinto's safe thrust of five and maximum of eight deliver solid acceleration for a corvette, enabling pursuit and evasion maneuvers. The single docking collar supports one DropShip, while twelve fighter bays and two small craft bays provide respectable aerospace support. A single 45-meter gravity deck and over 10,000 tons of cargo capacity allow extended independent deployments far from port.</p>
deployment: |-
  <p>The FWLS Dyson and FWLS Irbid served together during Geralk Marik's Lyran Campaigns, providing orbital fire support at the Battle of Loric. When Lyran BattleMechs appeared on the battlefield, Captain-General Marik called on both corvettes to rain naval autocannon fire on the enemy. However, when ground forces became entangled at close range, both captains refused to continue firing despite Marik's demands, and Lyran forces overran the command post, killing Marik. The TCS New Karachi was among a Taurian flotilla that strayed into the Malagrotta system in 2573, where Federated Suns naval forces destroyed or captured nearly all Taurian vessels in a three-hour engagement. By 2765, the Magistracy of Canopus permanently assigned Pintos to each of its three Chasseurs a Cheval regiments: the MCS Royal Foxx, MCS Thraxa, and MCS Stiletto. The Outworlds Alliance constructed the OAS Pulsar at Alpheratz, the newest of fifteen Alliance WarShips, and Alliance Pintos were known to operate in wolfpacks. During the Jihad, the Word of Blake fielded at least four salvaged Pintos: the Syrstart and Gorgon, both destroyed during CASE WHITE in 3068, and the Milvano and Mayenne, which survived until the final Battle of Terra in 3078.</p>
history: |-
  <p>The Pinto-class corvette entered service in 2502 as a product of the Rim Worlds Republic's independent shipbuilding efforts, designed as a picket and patrol vessel suited to the defensive needs of a Periphery state. The Republic initially sold Pintos to other Periphery nations, including the Taurian Concordat, Magistracy of Canopus, and Outworlds Alliance, establishing the class as the standard light WarShip across the Periphery. Sales were discontinued as the Reunification War loomed, with the Amaris family seeking to maintain the appearance of loyalty to the Star League. The Pinto saw combat during the war itself, with Taurian Concordat vessels deploying at Tentativa and suffering losses at Malagrotta. Production resumed in the 2650s under Tadeo Amaris as part of a massive military buildup that saw approximately thirty additional hulls laid down and mothballed under Star League pressure. The Magistracy of Canopus also began manufacturing Pintos after completing the Diamond Garter Fleet Yards in 2725, while the Outworlds Alliance constructed at least one vessel at Alpheratz after the revocation of Council Edict 2650. By April 2765, over one hundred Pintos were in active service across the four Periphery states, making it the most numerous WarShip class outside the Star League navy. The Rim Worlds Republic alone operated fifty-two active vessels plus thirty in mothball. The Amaris Crisis and the subsequent SLDF campaign to liberate Terra destroyed both primary Pinto production facilities and scattered the surviving vessels. The Finmark yards were specifically destroyed by Lyran forces in 2792. Rumors persisted for centuries that crippled Pintos had withdrawn to uncharted Deep Periphery worlds, surviving as derelicts far from known space. These rumors proved prophetic when the Word of Blake revealed at least four operational Pintos during the Jihad, salvaged and restored to service through means unknown. All four were destroyed between 3068 and 3078, bringing what is likely the final chapter of the Pinto's remarkably long service history to a close.</p>
