chassis: "Pulverizer"
model: "PUL-2V"
overview: |-
  <p>The Pulverizer is a 90-ton assault BattleMech introduced in 2823 as the signature command platform of Clan Wolverine. Designed as a completely original chassis rather than a refit of existing Star League designs, the Pulverizer married proven construction technology with enhanced prototype weapons, creating a platform defined by extreme durability and long-range striking power.</p><p>After the Wolverine Annihilation, Clan Snow Raven recognized the design's merits and adopted the Pulverizer for their own touman. Despite enduring decades of controversy over its tainted origins, the Snow Ravens operated the design throughout the Golden Century until the rise of the OmniMech rendered it obsolete. The Pulverizer's legacy endured through the Kingfisher assault OmniMech, which drew heavily on the older design's proven chassis.</p>
capabilities: |-
  <p>Built as a command platform, the Pulverizer prioritizes long-range engagement and survivability over speed. At 90 tons, the design moves at a modest 64 km/h on a standard fusion engine, relying on weapons reach and thick protection rather than maneuverability. Over fifteen tons of ferro-fibrous armor combined with CASE protection and the standard engine make the Pulverizer extraordinarily difficult to destroy, a quality that served it well in the brutal engagements of the early Clan era.</p><p>The weapons suite centers on a Shredder-II Enhanced ER PPC, a transitional weapon more powerful than standard Star League particle projectors but lacking the devastating output of later Clan-standard ER PPCs. Twin large lasers provide secondary firepower at closer ranges, while a Type III "Great Bow" LRM-10 rack adds sustained indirect fire capability. A Guardian ECM Suite disrupts enemy targeting and sensor networks, reinforcing the Pulverizer's role as a command platform.</p><p>The use of Star League-era endo steel construction saves critical weight, enabling the heavy armor and weapons loadout without sacrificing structural integrity. Fifteen double heat sinks manage the considerable heat output adequately, though sustained alpha strikes can push the design's thermal limits.</p>
deployment: |-
  <p>The original Pulverizer configuration, this variant represents the pinnacle of Clan Wolverine's independent 'Mech design capability. Armed with a Shredder-II Enhanced ER PPC, two standard large lasers, and a Type III "Great Bow" LRM-10, the design emphasizes sustained long-range firepower from a heavily protected platform. A Guardian ECM Suite reflects its intended role as a command 'Mech, disrupting enemy sensor networks while coordinating Wolverine forces. Fifteen double heat sinks manage the considerable weapons load. The PUL-2V served as the signature assault BattleMech of Clan Wolverine during their final years, and all subsequent Pulverizer variants trace their lineage to this original configuration.</p>
history: |-
  <p>The Pulverizer's history is inseparable from the tragic fate of Clan Wolverine. Following Operation KLONDIKE, Khan Sarah McEvedy recognized that mere refits of SLDF designs could not sustain her Clan's ambitions. While the Mercury II and Stag had already pushed beyond simple Star League re-engineering, the Pulverizer represented a fundamentally new design philosophy, a purpose-built command 'Mech tailored to Wolverine doctrine. Introduced in 2823, the Pulverizer entered service just as tensions between the Wolverines and the rest of the Clans reached their breaking point.</p><p>The design saw its first major combat during the Trials leading to the Wolverine Annihilation and throughout Operation SWITCHBACK, the coordinated campaign that destroyed Clan Wolverine. Wolverine saKhan Franklin Hallis reportedly piloted a Pulverizer during the final stand at Barbados. Ironically, the design's effectiveness during these engagements caught the attention of Clan Snow Raven, who salvaged Pulverizers and began their own production at Industrial Complex Raven Alpha on Lum in 2824.</p><p>The Snow Ravens' continued use of a design created by the Not-Named Clan proved deeply controversial throughout the Golden Century. The Grand Council entertained numerous censure motions against the Ravens, and rival Clans (particularly the Ghost Bears) treated victories achieved with Pulverizers as dishonorable. A notable engagement on Brim in 2835 saw a Snow Raven officer use his Pulverizer to devastating effect against a Ghost Bear garrison defending an Eagle factory, destroying a Shogun in brutal close-quarters fighting. The Ghost Bears petitioned the Grand Council, insisting that the use of dezgra BattleMechs could only produce dezgra MechWarriors. The Council ruled against the Bears, but the stigma surrounding the Pulverizer never fully dissipated.</p><p>The rise of the OmniMech ultimately ended active Pulverizer production. Rather than discard the design entirely, Snow Raven scientists used the proven chassis as the foundation for the Kingfisher, an assault OmniMech that debuted in 2887 and carried forward the Pulverizer's emphasis on durability while shedding the tainted Wolverine association.</p><p>Though out of production for centuries, a handful of Pulverizers survived in Snow Raven stores. During the Dark Age, several of these venerable machines reappeared in Raven Alliance formations operating along the Federated Suns border, their mere presence sufficient to alarm militia units unfamiliar with the rare design. Persistent but unverified reports from intelligence sources within the reunified Free Worlds League also claimed sightings of a single iridescent green Pulverizer attacking worlds with Interstellar Expeditions presence near the Periphery border, though such claims remain dubious at best.</p>
