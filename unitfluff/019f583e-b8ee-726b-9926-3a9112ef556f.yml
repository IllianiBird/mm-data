chassis: "Mechanized Wheeled Platoon (CCAF)"
model: "(Mortar 2367+)"
overview: |-
  <p>The CCAF fields conventional infantry in larger numbers than its limited industrial base might suggest, drawing on the Confederation's deep tradition of citizens' militia service. Capellan soldiers learn to fight with fewer resources and less support than their counterparts in wealthier states, compensating with resourcefulness and ideological commitment. Mechanized wheeled platoons balance speed and infantry presence, using armored wheeled transports to move troops quickly along the Confederation's road networks. They sacrifice the cross-country capability of tracked vehicles for faster transit between defensive positions. Mortar sections provide the platoon with organic indirect fire capability, lobbing explosive rounds over obstacles and into defilade positions that direct-fire weapons cannot reach.</p>
