chassis: "Field Gun Platoon (DCMS)"
model: "(Wheeled LBX10 3040+)"
overview: |-
  <p>Conventional infantry within the DCMS serve as the foundation of planetary defense, providing the manpower essential to territorial control while freeing BattleMech and armored assets for offensive operations. The platoon's field gun is a heavy LB-X autocannon with the dual-ammunition flexibility that makes the LB-X family so valued in the field. Solid slugs for armor-piercing work, cluster rounds for soft targets spread across a wide area. One gun, two very different tactical options.</p>
