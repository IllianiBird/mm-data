chassis: "Solitaire"
model: "2"
overview: |-
  <p>Always flying in the face of convention, Clan Diamond Shark introduced the Solitaire in 3064 as a non-OmniMech design intended for front-line service. In a Clan culture that prizes the flexibility of OmniMech technology above all else, the decision to field a standard BattleMech in premier combat formations was a bold move, yet one that paid dividends almost immediately. The Solitaire was designed from the outset as an advance-deployed skirmisher, built to close with enemy formations at extreme speed and tear apart isolated targets before the main engagement begins. Its reputation for punching well above its weight class has made it one of the more sought-after light designs in the Clan inventory.</p>
capabilities: |-
  <p>"Spare no expense" is not a phrase commonly heard among the Diamond Sharks, where even the hardest-line warrior keeps at least one eye on Clan profits. Still, that philosophy guided the creation of the Solitaire. An XL engine, endo steel chassis, and ferro-fibrous armor pack extraordinary performance into a twenty-five ton frame capable of speeds exceeding 160 kph. With ninety-six percent of its maximum armor protection, the Solitaire can absorb punishment that would cripple lighter designs while remaining fast enough to dictate engagement terms against nearly any opponent.</p><p>The Solitaire mounts a quartet of heavy lasers, from the devastating Model X Heavy Large Laser down through paired Model V Heavy Mediums to a Model II Heavy Small Laser. This armament gives the design an outsized bite for its weight class, capable of threatening even assault-weight machines caught out of position. The heavy laser suite does generate significant heat, and the design cannot dissipate a full alpha strike, but Diamond Shark warriors routinely accept this trade-off, maneuvering into a flanking position before unleashing everything at once and withdrawing before their target can respond.</p>
deployment: |-
  <p>Appearing around 3080 during the final stages of the Jihad, this refit variant reflects field modifications applied to existing Solitaire chassis across multiple locations rather than a dedicated factory production run. The variant reconfigures the original weapon loadout to better suit evolving tactical demands encountered during the widespread upheaval of the Jihad era. As a universal refit, the modification has appeared in service with various Clans and factions that acquired Solitaire chassis through Diamond Shark trade networks, extending the design's operational lifespan well into the Dark Age and ilClan periods.</p>
history: |-
  <p>The Solitaire emerged from one of Clan Diamond Shark's more unconventional decisions in the mid-thirty-first century. By 3064, the Diamond Sharks had established themselves as the premier merchant Clan, but their military forces still needed capable front-line machines. Rather than develop yet another OmniMech, the Shark scientists designed a purpose-built standard BattleMech optimized for a single role, advance skirmishing, reasoning that a dedicated design could outperform a generalist OmniMech configuration in that specific niche.</p><p>Production was established aboard the CDS Poseidon, a Potemkin-class WarShip converted into a mobile manufacturing facility. This arrangement reflected the Diamond Sharks' nomadic trading nature and ensured that production could continue regardless of territorial shifts. The facility had relocated from the Clan Homeworlds to the Inner Sphere, operating in the vicinity of Itabaiana during the Civil War and Jihad periods. A second catalog entry under the Diamond Shark Factory Ship designation reflects the mobile nature of this production line.</p><p>The Solitaire quickly proved its worth in combat against Clan Ice Hellion raiders targeting Diamond Shark holdings, and demand for the design grew rapidly among Shark warriors. The Diamond Sharks also leveraged the design as a trade commodity, selling significant numbers to Clan Ghost Bear at favorable prices. Whether this represented repayment for past concessions or an investment in future trade access through Ghost Bear territory remained a matter of debate among intelligence analysts.</p><p>During the Jihad, field refit variants began appearing as the widespread disruption of supply lines encouraged improvisation. The Solitaire 2 emerged around 3080 as a universal refit, not tied to any single Clan or faction, reflecting the broader dispersal of Diamond Shark trade goods across the Inner Sphere. The design continued in service through the Dark Age and into the ilClan era, its speed and firepower ensuring ongoing relevance even as newer designs entered production.</p>
