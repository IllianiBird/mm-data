chassis: "Quasimodo"
model: "QSM-3D"
overview: |-
  <p>The Quasimodo was introduced in 3140 as the next-generation successor to the legendary Hunchback, developed through a collaboration between Kali Yama and the Alphard Trading Corporation. Production takes place on the rebuilt industrial world of Kendall, where the two companies established a joint facility specifically for this design. At fifty-five tons, the Quasimodo is ten percent heavier than its predecessor while achieving twenty percent greater speed, representing a deliberate evolution of the Hunchback's proven close-range brawler concept.</p><p>With countless Hunchbacks throughout Inner Sphere history having been informally dubbed "Quasimodo," the choice of name simultaneously honored the original design's legacy while establishing the new 'Mech's distinct identity. The Quasimodo's combination of advanced defensive systems and all-energy weaponry marks a significant departure from the autocannon-centric philosophy that defined its ancestor.</p>
capabilities: |-
  <p>The Quasimodo's design philosophy emphasizes close-range lethality combined with advanced defensive technology, distinguishing it from the Hunchback's reliance on a single devastating weapon. Three Diverse Optics Type 47V medium variable-speed pulse lasers form the primary armament, complemented by two Magna Mk. VI extended-range medium lasers and a Magna Mk. IV extended-range small laser. This all-energy loadout eliminates ammunition dependency entirely, reminiscent of the popular Hunchback HBK-4P Swayback configuration but executed with far more advanced technology.</p><p>The Quasimodo's most distinctive feature is its Blue Shield Particle Field Damper, an experimental defensive system integrated with Durallex Tensile-4 armor that disrupts incoming particle beam weapons. Triple-strength myomers enhance the design's physical combat capability, activating at elevated heat levels to deliver punishing melee attacks. Rawlings 45 jump jets provide one hundred fifty meters of vertical mobility, a capability absent from the original Hunchback. A Hermes 275 XL engine drives the chassis to eighty-six kilometers per hour, increasing to nearly one hundred with triple-strength myomers active.</p><p>These advantages come at considerable cost. The Hermes 275 XL engine, while providing the speed necessary to close with opponents, leaves the Quasimodo fatally vulnerable to side torso breaches that would merely inconvenience a standard-engine design. The Blue Shield Particle Field Damper remains an experimental system with documented reliability issues under sustained combat stress, and its protection is limited exclusively to particle beam weaponry, offering no benefit against ballistic or missile attacks. Managing the triple-strength myomer activation threshold demands precise heat discipline from the pilot; running too cool wastes the system's potential, while allowing heat to spike beyond the optimal window risks shutdown at close range where the Quasimodo is most exposed. The all-energy armament, while eliminating ammunition concerns, generates substantial waste heat that complicates this already narrow thermal management window.</p>
deployment: |-
  <p>As the sole production variant, this variant first entered service with Free Worlds League Military formations operating out of Kendall in 3140. The design made its public debut on the Solaris VII arena circuit, where Kali Yama leveraged successful arena performances as marketing demonstrations for prospective military buyers. Early FWLM deployments have concentrated the Quasimodo in urban assault and close-quarters interdiction roles, environments where the design's jump capability and melee enhancement can be fully exploited. As of the early 3140s, production remains limited to the Kali Yama/Alphard Trading Corporation joint facility on Kendall, restricting availability primarily to Free Worlds League forces and select export customers.</p>
history: |-
  <p>The Quasimodo emerged from a commercial partnership between Kali Yama and the Alphard Trading Corporation, who collaborated to rebuild a factory on the damaged world of Kendall specifically for its production. The design was positioned as the "next generation Hunchback," intended to carry forward the legendary chassis's legacy while incorporating technologies unavailable when the original was designed centuries earlier.</p><p>The Quasimodo made its public debut not through a military demonstration but on the Solaris VII arena circuit in 3140, where its Blue Shield Particle Field Damper proved particularly effective against particle projection cannon-equipped opponents. The design quickly established itself as a competitive presence on Solaris, and Kali Yama leveraged this visibility as a marketing tool, dispatching successful arena competitors alongside sales teams to court prospective military buyers including the Draconis Combine, though initial sales overtures were declined.</p><p>As a relatively new design, the Quasimodo's combat record remains limited but promising. Early deployments with Free Worlds League Military forces have demonstrated the design's effectiveness as a close-range brawler capable of engaging heavier opponents through superior technology and mobility, particularly in the urban environments where its Hunchback ancestor first earned its fearsome reputation.</p>
