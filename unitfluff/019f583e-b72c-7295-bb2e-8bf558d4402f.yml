chassis: "Mechanized Wheeled Platoon (AFFS)"
model: "(Laser XCT 3067+)"
overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Mechanized wheeled platoons ride wheeled transports that offer good speed on roads and developed terrain, making them well-suited to garrison duty on worlds with established infrastructure where rapid response matters more than cross-country capability. These Xenoplanetary Condition Troops are trained and equipped for combat in hostile environments where standard infantry cannot operate effectively, carrying specialized survival gear alongside laser weapons that allow them to fight in extreme temperatures, toxic atmospheres, or unusual gravity conditions.</p>
