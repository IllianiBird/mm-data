chassis: "Field Artillery Platoon (AFFS)"
model: "(Motorized Thumper Cannon 3079+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing Thumper cannon, a direct-fire variant of the standard Thumper artillery tube, these platoons deliver heavy shell fire against visible targets without the arc trajectory of indirect systems.</p>
