chassis: "Opossum"
model: "OPO-3 SalvageMech MOD"
overview: |-
  <p>The Opossum is a twenty-five-ton IndustrialMech produced by DiNapoli Industries on the world of Ankaa, introduced in 3110 as the company's inaugural product. Designed as a SalvageMech, the Opossum was built to fill growing market demand for affordable, reliable salvage and recovery equipment within the Republic of the Sphere. DiNapoli Industries positioned the Opossum as a cost-effective alternative to competing designs like the Fwltur, and the design gained early traction among civilian contractors and small military formations operating across Prefecture IV.</p><p>Though purely an industrial design with no combat capability in its base configuration, the Opossum's robust construction and versatile equipment suite earned it a reputation as one of the most dependable SalvageMechs in the Republic's civilian market.</p>
capabilities: |-
  <p>The Opossum's design centers on its InterComBust 75 internal combustion engine, which provides a modest top speed of fifty-four kilometers per hour, adequate for its salvage recovery role but insufficient for battlefield maneuver. The IM Heavy II chassis carries StrongArm III heavy industrial armor, providing protection levels well above standard industrial grades and offering meaningful resistance to small arms and light weapons fire. The lack of jump jets limits the design's ability to navigate rough terrain, though the low ground pressure of the light chassis partially compensates in softer ground conditions.</p><p>The design's most notable feature is its Apple Churchill 2000 targeting and tracking system, paired with a Garret T10B communications suite, which together provide exceptional situational awareness for a machine of its class. In its standard configuration, the Opossum mounts a Beagle active probe linked to the Apple Churchill system, enabling detailed mapping of operational areas and identification of salvageable equipment at extended range. A DiNapoli ST7 salvage arm and spot welder round out the equipment suite, allowing field recovery and basic repairs. While the sensor package is impressive for its class, the Opossum's complete lack of weaponry leaves it entirely dependent on escorts in contested areas, a significant operational limitation.</p><p>The OPO-3 MOD variant replaces the spot welder and active probe with a Mydron Light Autocannon and advanced fire control system, trading reconnaissance and repair capability for meaningful self-defense. While this modification limits the SalvageMech's utility in its primary role, the addition of a ballistic weapon allows MOD-equipped Opossums to operate in contested environments where unmodified industrial machines would be prohibitively vulnerable.</p>
deployment: |-
  <p>The OPO-3 MOD originated as a field modification developed by a technician in the Twenty-first Centauri Lancers in 3131, who replaced the standard Opossum's spot welder and Beagle active probe with a light autocannon and advanced fire control system. The modification proved its worth during a joint Oriente-Republic salvage operation on Ventabren in May 3132, where the modified SalvageMech successfully defended a recovery site against unmarked attackers while continuing its primary salvage mission. The success prompted Bannson Universal Unlimited to standardize the modification as a commercially available refit kit. Bannson's own paramilitary forces were among the first to adopt the kit en masse, deploying modified Opossums during operations on Fletcher as early as September 3132. The MOD's proven ability to function in both salvage and light combat roles inspired competitors throughout Prefectures III and IV to develop similar militarization packages for their own SalvageMech platforms.</p>
history: |-
  <p>DiNapoli Industries was founded in 3110 by Angelo DiNapoli on the world of Ankaa, within Prefecture IV of the Republic of the Sphere. The Opossum SalvageMech was the company's inaugural product, entering an industrial market that DiNapoli would come to dominate within two decades. By 3130, DiNapoli Industries had grown into the largest AgroMech manufacturer in Prefecture IV and the fifth largest within the Republic, making it the single largest employer on Ankaa. The company's rapid expansion into AgroMech production, DropShip manufacturing, and heavy ground transport overshadowed the Opossum itself, which remained a modest but steady seller in the SalvageMech market.</p><p>The political upheaval following the HPG Blackout in 3132 brought dramatic changes to both DiNapoli Industries and the Opossum's role. Jacob Bannson, the controversial industrialist behind Bannson Universal Unlimited, had attempted to acquire DiNapoli Industries as early as September 3131. Angelo DiNapoli fought the takeover through the Republic Senate and its Trade Subcommittee, but falling stock prices and a collapsed DropShip contract left the company vulnerable. Bannson completed his acquisition in June 3132, immediately restructuring the company and laying off fifteen thousand workers from subsidiary divisions on Bharat and Yangtze.</p><p>Under Bannson's ownership, the Opossum gained an unexpected second life as a paramilitary platform. When a field technician's modification to a Lancers Opossum demonstrated the SalvageMech's potential as a light combat vehicle, Bannson Universal moved quickly to commercialize the refit as a standardized kit. The OPO-3 MOD saw its combat debut with Bannson's paramilitary forces in September 3132, and the design's success in a raid against a Belyakov-Ourobouros depot on Fletcher validated the concept. Subsequent deployments across Prefectures III and IV demonstrated that even a modest ballistic weapon could transform an otherwise defenseless IndustrialMech into a viable asset for irregular formations lacking access to proper BattleMechs.</p><p>Bannson's control of the Ankaa facilities proved short-lived. In late 3132, the Steel Wolves landed on Ankaa seeking to secure DiNapoli's DropShip manufacturing capacity near the city of Anqabad. A subsequent battle between Steel Wolves and Swordsworn forces caused extensive civilian casualties, though the Steel Wolves ultimately retained control of the industrial facilities. The fate of Opossum production under these successive changes in ownership remains an enduring evidence of the turbulent nature of Dark Age industrial politics.</p>
