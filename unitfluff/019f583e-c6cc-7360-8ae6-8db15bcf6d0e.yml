chassis: "Trebuchet"
model: "TBT-7M"
overview: |-
  <p>The Trebuchet was one of a handful of BattleMech designs produced during the final years of the Star League, first walking off Corean Enterprises' assembly lines in 2780 for the SLDF. Originally designated the TBT-3C and equipped with advanced technology including an extralight engine, Artemis IV fire control, and double heat sinks, the design served as a medium fire support platform intended to operate as part of a well-balanced lance rather than independently. The devastation of the First Succession War forced Corean to redesign the 'Mech without lostech components, producing the simplified TBT-5N in 2799 that would become the standard production model.</p><p>Renowned for its effective blend of long-range missile fire and short-range laser support, the Trebuchet became an almost exclusive staple of the Free Worlds League during the Succession Wars, its surviving manufacturing sites on Stewart and Kalidasa falling within League territory. The design's reputation for easy maintenance and reliable performance ensured its continued production across multiple centuries and manufacturers.</p>
capabilities: |-
  <p>Designed to serve as part of a well-balanced lance, the Trebuchet relies on an effective combination of good mobility and a weapons load that blends long-range missile support with close-in laser firepower. The primary armament consists of twin Zeus LRM-15 launchers, one mounted in the right torso and one in the left arm, capable of softening enemy formations at ranges beyond effective return fire. Three Magna Mk II medium lasers (two in the right arm and one in the left) provide credible close-range defense and discourage lighter 'Mechs from attempting interception.</p><p>The Magna 250 fusion engine drives the fifty-ton chassis to a respectable 86 kilometers per hour, adequate for keeping pace with most fire support formations. Seven and a half tons of Starshield armor provides reasonable protection for the weight class, though dedicated brawlers will outmatch the Trebuchet in sustained close combat. Ten heat sinks manage thermal output adequately when firing lasers at cruising speed, and the chassis has earned a reputation for easy maintenance and quick reloading of its torso-mounted weaponry.</p><p>The design's greatest weakness is endurance. Each LRM launcher carries only a single ton of ammunition, providing barely a minute of continuous fire before the Trebuchet must rely solely on its lasers, where it finds itself outgunned compared to dedicated close-combat 'Mechs of similar tonnage. This limited ammunition supply reflects the design philosophy of operating near friendly supply lines rather than on extended independent patrols.</p>
deployment: |-
  <p>The 7M represents the Trebuchet's rebirth through recovered Star League technology. Built on a Corean-II Deluxe endo-steel chassis with a Magna 250 XL engine, the design restored jump capability via five Rawlings 50 jump jets while mounting ten double heat sinks and CASE ammunition protection. The weapons array retained the proven twin LRM-15 launchers and three medium lasers, supplemented by an Octagon Missile Magnet Narc Missile Beacon with two tons of ammunition, enabling the Trebuchet to share targeting telemetry with lance-mates and dramatically improving missile accuracy. No fewer than three manufacturers (Corean Enterprises, Kali Yama Weapons Industries, and Irian BattleMechs Unlimited) produced the 7M, reflecting both the design's proven combat value and the expanding industrial capacity of the Inner Sphere during the technological renaissance of the late thirty-first century.</p>
history: |-
  <p>The Trebuchet's origins trace to the twilight of the Star League, entering production in 2780 at Corean Enterprises' facilities during the brief period between Terra's liberation from Stefan Amaris and Aleksandr Kerensky's Exodus. The original TBT-3C was a sophisticated design featuring an extralight engine, Artemis IV-equipped LRM launchers, and double heat sinks, but the attrition of the First Succession War quickly rendered these advanced components irreplaceable. By 2799, Corean had redesigned the chassis as the simplified TBT-5N, sacrificing capability for manufacturability.</p><p>The Free Worlds League became the Trebuchet's primary operator during the Succession Wars, a consequence of geography rather than exclusive licensing, Corean's surviving MacAdams-Suharno plant on Stewart and Kali Yama's facilities on Kalidasa both fell within League borders. ComStar's records incorrectly suggested Corean ceased Trebuchet production in 2845, but in truth the MacAdams-Suharno facility maintained an average output of eight units annually throughout the Third Succession War. The confusion likely arose from the destruction of Corean's corporate headquarters and primary factory on Ramen II by Capellan forces that same year, after which the company relocated its headquarters to New Avalon.</p><p>The FWLM developed distinctive tactical doctrines around the Trebuchet, frequently pairing it with the heavier Archer for fire support operations. The Regulan Hussars perfected a siege lance configuration comprising an Archer, two Trebuchets, and a Centurion that proved devastatingly effective. Despite its Free Worlds origins, the design found its way into service with every Great House during the Succession Wars, serving with distinction in nearly every major operation and spawning variants to meet diverse tactical needs.</p><p>The technological renaissance of the 3030s proved transformative for the Trebuchet program. Kali Yama Weapons Industries and Irian BattleMechs Unlimited both began production, and upgraded variants incorporating recovered Star League technology debuted in the years preceding the Clan Invasion. The TBT-7M reintroduced endo-steel construction, an XL engine, and jump capability that the simplified 5N series had abandoned decades earlier. No fewer than three manufacturers produced the upgraded model, reflecting both the design's proven value and the expanding industrial base of the Inner Sphere.</p><p>The Trebuchet continued evolving through subsequent conflicts. House Kurita's adoption of MRM technology spawned field-refitted variants, while Kali Yama's TBT-8B of 3071 attempted to blend the best characteristics of every preceding model into a single chassis. The Word of Blake's use of advanced Trebuchet variants during the Jihad added a darker chapter to the design's distinguished service record. As late as the Dark Age era, Tvastar Enterprises on Regulus produced advanced models incorporating Clan-grade weaponry, demonstrating the enduring viability of a chassis concept first conceived in the dying days of the Star League.</p>
