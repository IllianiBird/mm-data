chassis: "Field Gun Platoon (CCAF)"
model: "(Motorized AC10 2465+)"
overview: |-
  <p>The CCAF fields conventional infantry in larger numbers than its limited industrial base might suggest, drawing on the Confederation's deep tradition of citizens' militia service. Capellan soldiers learn to fight with fewer resources and less support than their counterparts in wealthier states, compensating with resourcefulness and ideological commitment. Field gun platoons provide Capellan infantry with organic direct-fire heavy weapons, towing crew-served autocannons or other heavy guns to prepared positions. The weapon crew operates the gun while the remaining troopers provide local security with personal arms. Their crew-served autocannon/10 delivers punishing direct-fire support capable of threatening most vehicles and even light BattleMechs from prepared positions.</p>
