chassis: "Field Gun Platoon (Generic)"
model: "(Motorized AC20 2502+)"
overview: |-
  <p>Motorized infantry platoons use light ground vehicles, typically motorcycles or utility trucks, for rapid movement between positions. Faster than foot infantry and cheaper than fully mechanized formations, motorized platoons fill the gap between static garrison troops and armored combat units. They excel at road-bound patrol routes, rapid redeployment along prepared axes, and screening operations where speed matters more than protection. Off-road performance depends heavily on terrain and vehicle type, and the troops must dismount to fight, leaving their transport vulnerable.</p><p>The presence of assault-class autocannon typically draws heavy counter-fire, with improved body armor helping the crews survive contact long enough to inflict considerable damage with their limited ammunition supply.</p>
