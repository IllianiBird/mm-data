chassis: "Conqueror Battlecruiser Carrier"
overview: |-
  <p>The Conqueror was Clan Snow Raven's most ambitious WarShip conversion project, transforming aging Star League-era pursuit cruiser hulls into modern carrier-battlecruisers designed to escort the massive Leviathan-class dreadnoughts. Conceived during a joint construction agreement with Clan Ghost Bear in the early 3040s, the design abandoned the speed and heavy energy weapons of its predecessor in favor of vastly expanded fighter capacity and a conventional ballistic armament. The resulting vessel carried more fighter assets than many dedicated carriers while retaining enough capital firepower to operate as a credible battlecruiser in its own right. Among the Raven fleet, the class earned a reputation as a flexible and potent capital asset, able to project aerospace power at a scale few other vessels in the Clan inventory could approach.</p>
capabilities: |-
  <p>The Conqueror's armament reflects its role as a carrier that can fight independently, mounting thirty-two naval autocannons as its primary capital weaponry. Sixteen NAC/30 tubes and sixteen NAC/25 tubes are distributed across the nose, broadside, and aft arcs, delivering devastating ballistic firepower that replaces the Kimagure's signature banks of naval PPCs. Eight medium naval PPCs and three light naval PPCs provide energy-based capital engagement capability, while twelve NL55 and twelve NL45 naval lasers cover the forward and aft quarter positions. Four Barracuda missile launchers supplement the main battery. The anti-fighter defense suite is extensive, incorporating ER large lasers, large pulse lasers, LB-X autocannons, and numerous small-caliber weapons arranged in overlapping defensive arcs.</p><p>The vessel's defining feature is its fighter complement of one hundred aerospace OmniFighters organized in two bays of fifty, each served by six launch doors for rapid sortie generation. A lithium-fusion battery provides consecutive jump capability, while an HPG ensures strategic communications independence. Two docking collars, two gravity decks of sixty-five and eighty-five meters, and twenty-two thousand tons of cargo capacity support extended operations. Nine hundred fifty tons of Lamellor ferro-carbide armor provides substantial protection. The conversion's principal tradeoff was a significant reduction in acceleration from the original hull's pursuit cruiser performance, a necessary sacrifice to accommodate the massive fighter infrastructure.</p>
deployment: |-
  <p>The CSR Conqueror launched in 3052 and completed trials by June of that year, becoming the first of the new class. She was assigned to the Brim Naval Assault Star alongside the heavy cruiser Black Justice and other vessels, remaining in this formation through the 3060s. After surviving the Wars of Reaving and the Jihad, the Conqueror was transferred to a newly formed naval star bearing her name, operating alongside the battlecruiser Kerensky's Hope. The vessel remained in active Raven Alliance service through 3145.</p><p>The CSR Ark Royal followed in 3059 after being delayed by a series of technical malfunctions during construction. She served initially in the Storm Crow Naval Pursuit Star. During the Jihad, the Ark Royal participated in the bombardment of Galedon V in 3069 and subsequently engaged in a Trial of Annihilation against sister ships carrying the Curse of Galedon bioweapon. Under Star Admiral James Lankenau, the Ark Royal participated in the liberation of Dieron in late 3077 and the capture of the Titan Yards during Task Force CRONUS operations near Terra in 3078. The vessel was assigned to the Ice Storm Naval Star through 3145.</p>
history: |-
  <p>The Conqueror's origins lie in a collaboration between Clan Snow Raven and Clan Ghost Bear that began in the early 3040s. When the Ghost Bears approached the Snow Ravens for assistance in constructing their Leviathan-class battleships, the Ravens agreed, leveraging their reputation as the most naval-minded of the Clans. The partnership provided an opportunity to simultaneously upgrade their own fleet. Looking for suitable hull candidates, they selected the Kimagure-class pursuit cruiser, a Star League design originally built by Krester's Ship Construction that had entered service in 2582. A handful of Kimagure hulls had accompanied the Exodus fleet, and Clan Snow Raven possessed several of the surviving examples.</p><p>The Kimagure had earned distinction as one of the fastest capital ships in the Star League fleet, capable of sustaining high acceleration with impressive sprint capability. Its heavy energy armament provided devastating long-range firepower but generated tremendous heat, a weakness that could prove fatal when the vessel was engaged from multiple arcs simultaneously. The Conqueror conversion addressed these limitations by completely overhauling the weapons suite and dramatically expanding the vessel's aerospace capacity, creating a design that could project far more flexible combat power than its predecessor.</p><p>The transformation necessitated significant compromises. Acceleration was substantially reduced as the hull now had to accommodate extensive fighter launch and recovery infrastructure, along with the crews and support staff required to maintain a full-scale aerospace contingent. Armor protection was slightly reduced from the Kimagure's original levels. However, the addition of advanced strategic systems made the Conqueror a far more capable vessel for the Snow Ravens' operational requirements.</p><p>The first vessel launched in 3052 and completed trials by June. The second experienced construction delays and did not launch until 3059. By that time, the Snow Ravens had determined that the Inner Sphere powers lacked significant WarShip forces, rendering additional carrier-escorts unnecessary. The planned production run was cancelled, leaving only two Conqueror-class vessels in existence.</p><p>Both vessels accumulated distinguished service records across decades of conflict, participating in major fleet actions during the Jihad and surviving into the ilClan era. They remained in active Raven Alliance service through 3145, irreplaceable capital assets in a fleet that considers naval power the foundation of its national strategy.</p>
