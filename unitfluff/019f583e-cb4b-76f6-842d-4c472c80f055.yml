chassis: "Thunder Hawk"
model: "TDK-7Y"
overview: |-
  <p>The Thunder Hawk was developed by Norse-Storm BattleMechs in 2771, during the final years of the SLDF's campaign to liberate the Terran Hegemony from the Usurper Stefan Amaris. Weighing one hundred tons, the Thunder Hawk epitomized the doctrine of overwhelming firepower over maneuverability, designed to provide devastating long-range fire support to assault lances. General Aleksandr Kerensky utilized all available Thunder Hawks during the liberation campaign, and the surviving machines accompanied the Exodus fleet into the Deep Periphery. Production ceased after the Amaris Civil War, and the design vanished from the Inner Sphere for nearly three centuries.</p><p>In the mid-3050s, Norse-Storm BattleMechs resumed Thunder Hawk production at their Loxley facility, reintroducing the Inner Sphere to one of the most feared Star League-era assault 'Mechs. The design has since become a mainstay of Lyran assault formations, valued for its devastating long-range firepower and Star League heritage.</p>
capabilities: |-
  <p>The Thunder Hawk's defining feature is its trio of Norse Model M-7D Gauss rifles, which account for over half of the design's total mass. These three ballistic weapons deliver devastating long-range firepower capable of crippling or destroying most lighter 'Mechs in a single volley, making the Thunder Hawk one of the most feared fire support platforms on any battlefield. Norse engineers spread six tons of non-explosive Gauss ammunition throughout the torso sections, preventing a single catastrophic hit from eliminating the 'Mech's primary firepower in one blow.</p><p>Four Defiance B3M medium lasers provide secondary armament for close-range defense when ammunition runs dry or faster opponents close inside the Gauss rifles' optimal engagement envelope. With nearly twenty tons of ArcShield Heavy Type K armor, the Thunder Hawk carries more protection than even the venerable Atlas, granting significant survivability under concentrated fire. The minimal heat generation from its ballistic-heavy loadout means the Thunder Hawk requires only ten heat sinks, freeing tonnage for additional ammunition and armor protection.</p><p>The Thunder Hawk's primary vulnerability lies in its Vlar 300 extra-light fusion engine. While the weight savings are essential to mounting three Gauss rifles on a hundred-ton frame, the fragile XL engine means that a breach of either side torso will render the BattleMech completely inoperable. The design's low top speed of fifty-four kilometers per hour further limits its ability to disengage from unfavorable engagements, making the Thunder Hawk heavily dependent on supporting units for close-range defense.</p>
deployment: |-
  <p>A straightforward modification introduced in the mid-3050s alongside the TDK-7X's reintroduction, this variant strips out all four Defiance B3M medium lasers and replaces them with two medium pulse lasers. While the pulse lasers offer improved accuracy against faster and more maneuverable targets, the reduction in overall short-range firepower made this variant significantly less popular than the standard model. Production was relatively limited, and this variant saw only brief active manufacture before being discontinued.</p>
history: |-
  <p>Norse-Storm BattleMechs originally developed the Thunder Hawk to assist in the final stages of the liberation of the Amaris-ruled Terran Hegemony. Entering service in 2771, the design saw immediate action in the brutal fighting that characterized the campaign's closing years. General Aleksandr Kerensky claimed all available Thunder Hawks for the Exodus fleet, stripping the Inner Sphere of this formidable assault 'Mech. The loss of Norse-Storm's secondary production facility on Yed Posterior, destroyed in 2789, ensured the Thunder Hawk's complete disappearance from Inner Sphere arsenals during the Succession Wars.</p><p>For nearly three centuries, the Thunder Hawk existed only in historical records and ComStar archives. When Norse-Storm BattleMechs resumed operations at their Loxley facility in the mid-3050s, the Thunder Hawk was selected as the first Star League-era design slated for reintroduction. Despite the company's ambitions to establish it as their flagship product, manufacturing difficulties in sourcing components and meeting demand hampered early production runs, and Norse-Storm struggled to compete with larger firms that had better access to advanced technologies.</p><p>Thunder Hawks rapidly became one of the Lyran Alliance's signature assault BattleMech designs following their reintroduction, assigned to nearly every unit fielding assault 'Mechs. During the FedCom Civil War, Loyalist forces employed the Thunder Hawk extensively, adapting its role from pure fire support to that of a battlefield anchor. Loyalist commanders used the 'Mech's tremendous armor and long-range firepower to absorb incoming fire while their lighter lances maneuvered, proving the design's versatility beyond its original doctrine. Following the war, Archon Peter Steiner-Davion awarded units loyal to the Allied cause with the first peacetime shipments of new Thunder Hawks, while indicating the design would eventually be made available for export once Lyran military rebuilding was sufficiently advanced.</p><p>Norse-Storm continued to face stiff competition from manufacturers like Defiance Industries, which had embraced Clan technology weaponry to modernize existing Lyran designs. Unable to match Defiance's access to Clantech, Norse-Storm instead focused on maximizing Inner Sphere capabilities in their newer variants, culminating in the TDK-7Z's Thunderbolt missile launchers. The Thunder Hawk continues to serve as a mainstay of Lyran assault formations well into the ilClan era, its Command 'Mech reputation and Star League heritage ensuring enduring demand despite Norse-Storm's ongoing struggles with production volume.</p>
