chassis: "Sentry"
model: "SNT-04"
overview: |-
  <p>The Sentry was developed in 3056 by Robinson Standard BattleWorks under pressure from the Draconis and Capellan March commands for a more technologically advanced border defense 'Mech than the Watchman could provide. Built on a modified version of the Watchman chassis using the same engine, armor, and jump jets, the Sentry incorporates endo steel construction and double heat sinks to create a more capable forty-ton platform. Like its predecessor, the Sentry was designed for maximum parts interchangeability with existing Enforcer-family designs, and its weapons suite was assembled primarily from surplus components to keep production costs low while delivering meaningfully improved combat performance over the Watchman.</p>
capabilities: |-
  <p>The Sentry is built on a Dorwinion Hyperactive 3 endo steel chassis that provides weight savings over the Watchman's standard frame, permitting heavier armament without sacrificing mobility. The Nissan 200 engine and five HildCo Model 12 jump jets carry over directly from the Watchman, maintaining the same 86 km/h top speed and 150-meter jump capability. Eight and a half tons of Starshield A armor with CASE provides solid protection for the design's weight class, with the CASE system safeguarding against catastrophic ammunition detonation.</p><p>The Sentry's diverse weapons suite reflects its origins in surplus parts allocation. A Parti-Kill Heavy Cannon PPC (sourced from surplus Manticore tank upgrades) serves as the primary anti-'Mech weapon, delivering powerful long-range energy fire. Two Magna 200P small pulse lasers provide accurate close-range firepower effective against both 'Mechs and infantry, while four Sperry Browning machine guns and a Zippo flamer (the former from Vulcan overstock, the latter from Berserker surplus) give the Sentry exceptional anti-infantry capability. This versatility makes the Sentry well-suited to the varied demands of border garrison duty, from conventional 'Mech engagements to riot suppression and counterinsurgency operations.</p>
deployment: |-
  <p>The baseline Sentry mounts a Parti-Kill Heavy Cannon PPC as its primary weapon, supported by two Magna 200P small pulse lasers, four Sperry Browning machine guns with a half-ton of ammunition, and a Zippo flamer. Entering production in 3056 at Robinson Standard BattleWorks, the design was deliberately assembled from surplus weapons systems (flamers from Berserker production, machine guns from Vulcan overstock, PPCs from Manticore tank upgrade programs, and pulse lasers from Dart surplus) to minimize costs and ensure component availability. Ten double heat sinks manage the PPC's substantial thermal demands effectively, giving the Sentry better heat management than its Watchman sibling despite carrying a more powerful primary weapon.</p>
history: |-
  <p>The Sentry's creation was driven by the same Draconis March political dynamics that produced the Watchman, but with a more ambitious mandate. March leaders demanded more advanced technology than the Watchman offered, and First Prince Victor Steiner-Davion authorized a new wing to be added to the Robinson Standard BattleWorks factory to accommodate production. The Sentry entered service in 3056, just one year after the Watchman, demonstrating the efficiency of building new designs around proven components and shared manufacturing infrastructure.</p><p>The allocation of Sentry production became a source of political friction within the Federated Suns. Production was divided evenly among the Draconis, Capellan, and Crucis Marches, a decision that particularly annoyed Duke Sandoval of Robinson, who felt that his March (which hosted the factory and faced the most immediate threat from the Draconis Combine) deserved priority access. The surplus components strategy proved its worth during the FedCom Civil War, when the ready availability of Zippo flamers, Sperry Browning machine guns, Parti-Kill PPCs, and Magna pulse lasers ensured production could continue even as conventional supply chains were disrupted by the conflict.</p><p>The Jihad spurred development of the SNT-W5 variant, which incorporated advanced technology including a light fusion engine, heavy-duty gyro, and light ferro-fibrous armor. This upgrade replaced the entire weapons suite with more modern systems, reflecting the increasing technological sophistication expected of even garrison-class designs in the post-Jihad era. The Sentry's role in the broader Enforcer family lineage (bridging the gap between the simple Watchman and the more specialized Cuirass) ensured its continued relevance in AFFS force structures throughout the thirty-first and into the thirty-second century.</p>
