chassis: "Foot Platoon (DCMS)"
model: "(Flamer 2620+)"
overview: |-
  <p>The Combine's martial traditions extend beyond the BattleMech cockpit, and the Dictum Honorium demands that all citizens contribute their talents to the defense of House Kurita. Infantry soldiers of the DCMS embody that expectation on garrison worlds across the realm. Foot infantry are the cheapest troops the DCMS can field, and the Combine fields them in enormous numbers. Every military district maintains garrison formations whose sole purpose is holding ground that BattleMech regiments cannot occupy permanently. Slow and vulnerable in open terrain, these soldiers prove their worth through discipline and endurance, standing post on worlds across the Combine because the Dragon demands nothing less. Their support troops carry man-portable flamers that spray burning chemicals across several hundred square meters. Devastating against infantry in the open and effective at clearing structures, though the short range and the vulnerability of the operator's fuel tank make flamer duty one of the most dangerous assignments in the platoon.</p>
