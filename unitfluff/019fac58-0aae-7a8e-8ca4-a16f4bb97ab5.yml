chassis: "Field Gun Platoon (Generic)"
model: "(Wheeled LBX2 3060+)"
overview: |-
  <p>Mechanized wheeled platoons transport their infantry in wheeled armored personnel carriers optimized for speed on roads and improved surfaces. Wheeled APCs are cheaper to maintain and faster on pavement than tracked alternatives, making these platoons ideal for garrison rapid-response forces, highway patrol, and urban security operations. Their off-road capability is limited compared to tracked vehicles, restricting employment in rough terrain, but on developed worlds with good road networks, wheeled mechanized infantry offer the best balance of speed, protection, and operating cost.</p><p>Towing LB-X autocannon that can fire cluster munitions to spread damage across a wider area, these field gun crews provide flexible direct fire that adapts to both concentrated and dispersed targets.</p>
