chassis: "Wraith Battle Armor"
model: "(Sqd5)"
overview: |-
  <p>The Wraith is a medium battle armor suit developed by the Rasalhague Dominion at BA Facility Gamma on Mannedorf. Entering service in 3116, the design descended from extensive testing of the earlier Rogue Bear prototype and was built to support conventional infantry forces and conduct infiltration operations. The Wraith's mixed Clan and Inner Sphere technology base reflected the Dominion's hybrid military culture. Offered in a variety of frame sizes uncommon for Clan battle armor, the suit became a practical workhorse for both garrison and frontline Dominion formations.</p>
capabilities: |-
  <p>The standard Wraith mounts a single machine gun in each arm, supplemented by vibro-claws for close combat, anti-BattleMech attacks, and boarding actions. Basic Stealth armor conceals the suit from electronic detection, while jump jets provide a ninety-meter leap range. At one thousand kilograms, the suit falls in the medium weight class with respectable mobility for its protection level.</p><p>The Wraith's heads-up display incorporates an automated threat prioritization system that assigns targeting icons of varying size, color, and shape based on target type and range. Ten user-customizable presets allow troopers to tailor the display to their preferred engagement style. An exchangeable ammunition magazine similar to OmniMech pod technology significantly reduces field reloading time. The absence of modular weapon mounts limits loadout flexibility compared to some competing designs, forcing configuration changes at the factory level rather than in the field.</p>
deployment: |-
  <p>Rasalhague Dominion frontline formations deploy the Wraith in standard five-trooper Clan Points, the most common organization for the suit. Wraith Points operate within Stars alongside OmniMechs or other battle armor, leveraging the suit's stealth capability to screen flanks, scout enemy positions, and execute surgical strikes against high-value targets before withdrawing under concealment.</p>
history: |-
  <p>The Wraith traces its lineage to the Rogue Bear, a heavy battle armor prototype first fielded by Clan Ghost Bear garrison forces in the early 3070s. Decades of iterative refinement at BA Facility Gamma on Mannedorf transformed the concept into the production Wraith, which entered Rasalhague Dominion service in 3116. Unlike most Clan battle armor, the Wraith was engineered around interchangeable form factors to accommodate the Dominion's mixed Clan-freeborn military, where standardized Elemental-proportioned suits excluded many otherwise capable warriors from powered armor duty. Quartermasters complained that the variety of frame sizes created a logistical burden, but field commanders valued the expanded recruitment pool.</p><p>The Wraith earned its reputation during operations in the late 3130s. In 3137, Rasalhague Dominion forces launched border raids against the Draconis Combine while the Combine struggled with the death of Theodore Kurita. On Schuyler, elements of the Fourth Bear Regulars dropped a Star of battle armor onto the Kurokawa motor pool before dawn and fought building to building for three hours against three companies of conventional infantry. Separately, during Clan-on-Clan skirmishes over worlds vacated by Clan Wolf, two Points of Wraiths directed a flanking assault against the Hell's Horses' 666th Mechanized Assault Cluster on New Oslo, intercepting and eliminating the Cluster's command staff during a withdrawal.</p>
