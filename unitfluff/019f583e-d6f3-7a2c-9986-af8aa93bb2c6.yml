chassis: "Phoenix Hawk LAM Mk I"
model: "PHX-HK1"
overview: |-
  <p>Allied Aerospace began development of the Phoenix Hawk LAM Mk I the same year LexaTech Industries' tri-mode Stinger LAM demonstrated the viability of Land-Air 'Mech technology to SLDF evaluators. Six years of development (the first two spent on advanced computer modeling) produced a design that incorporated multiple improvements over the failed Shadow Hawk LAM. The Mk I passed all SLDF functional specification tests, earning high marks for firepower and heat management, and entered service in 2701.</p><p>Allied Aerospace sold the Mk I and its successor to the SLDF throughout the Amaris Crisis, and offered the design to all Successor States following the Exodus. The destruction of Allied's Pollux factory during the First Succession War ended production permanently. Phoenix Hawk LAMs continued in service for over two hundred years with progressively downgraded equipment, and at least one example (Chassis 013) sits preserved in the Wings over Donegal museum.</p>
capabilities: |-
  <p>The Phoenix Hawk LAM Mk I utilizes an Allied 250 engine to achieve 86 kilometers per hour in 'Mech mode, comparable to most medium BattleMechs of its era. The Blankenburg 30 ER large laser provides striking power at ranges exceeding 500 meters, while four Maxim medium lasers deliver considerable short-range firepower. Twelve double heat sinks maintain a comfortable thermal curve, allowing full weapon salvos even while jumping.</p><p>The foremost innovation was the AirMech mode, featuring a relaxed static stability design that made the airframe slightly unstable in aerospace and AirMech configurations, a deliberate trade-off that provided increased atmospheric dogfighting performance. AirMech conversion completed in under ten seconds, with competent pilots able to maneuver and fire during transition. Directional exhaust venting enabled WiGE-like maneuverability with hover capability, reaching approximately 250 kilometers per hour in flight.</p><p>In full fighter mode, the asymmetrical weapon disposition (Blankenburg plus one laser on the right wing, three lasers on the left) created an exploitable imbalance. Standard thrust of 2.5 Gs with a maximum of 4 Gs proved poorly matched against equal-weight dedicated fighters, though sufficient for evading heavier pursuit craft. Limited fuel capacity discouraged full exploitation of aerospace performance.</p>
deployment: |-
  <p>The standard Mk I configuration entered SLDF service in 2701, mounting a Blankenburg 30 ER large laser and four Maxim medium lasers with twelve double heat sinks for excellent thermal management. Allied AVRTech Model A jump jets provided 150 meters of jump capability in 'Mech mode, while Maximillian 100 armor offered reasonable protection across all three operational modes. The Hartford Baseband 3 communications system and Hartford-Allied Trakit 8 V targeting computer completed the electronics suite. Considerable distribution throughout SLDF Striker Regiments established the Mk I as the premier heavy LAM platform of its era.</p>
history: |-
  <p>The Phoenix Hawk LAM Mk I entered SLDF service in 2701, nineteen years after the disastrous Shadow Hawk LAM evaluation that nearly killed the Land-Air 'Mech concept entirely. Allied Aerospace's patient development approach produced a significantly more reliable platform, and the Mk I earned considerable distribution throughout the SLDF. Striker Regiments always featured at least one reconnaissance company of LAMs, and in approximately half those regiments, the recon company comprised entirely of Mk I airframes.</p><p>The Mk I played a notable role during the early trials of the Terran Space Defense System, where a LAM reconnaissance company provided critical intelligence on Caspar drone fighter capabilities. The team evaded drone pursuit and breached a landing bay, forcing SDS engineers to spend two years reprogramming the Caspar system to account for LAM tactical profiles.</p><p>Production ended with the destruction of Allied Aerospace's Pollux facility in 2799 during the First Succession War. Surviving Mk I airframes continued operational service for centuries afterward, though progressive equipment downgrading reduced their capabilities significantly. The rarity of replacement parts made every surviving LAM an irreplaceable asset, with units nursing their airframes through careful maintenance and limited deployment to preserve operational readiness.</p>
