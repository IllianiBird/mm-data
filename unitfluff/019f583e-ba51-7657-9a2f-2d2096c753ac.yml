chassis: "Motorized Platoon (ComStar)"
model: "(Rifle)"
overview: |-
  <p>The Blessed Order maintained conventional infantry formations equipped with preserved Star League-era weapons and personal armor, fielding platoons that were better armed than most Successor State infantry throughout the late Succession Wars. Motorized platoons use light vehicles to achieve ground speeds well beyond foot infantry, allowing rapid redeployment between defensive positions. Their wheeled or motorcycle transport keeps the formation mobile on developed road networks, though off-road performance is limited. Armed with standard ballistic assault rifles, the most common and affordable infantry weapon in the Inner Sphere, these troops deliver reliable short-range firepower and can be equipped and resupplied from almost any garrison stockpile.</p>
