chassis: "Behemoth C"
model: "(Arcship)"
overview: |-
  <p>The Behemoth is the largest DropShip class ever constructed, a hundred-thousand-ton Spheroid cargo hauler that dwarfs even the Mammoth class at nearly twice its tonnage. Incapable of atmospheric operations or planetary landings due to its sheer mass, the Behemoth relies on orbital cargo stations or shuttle craft to transfer goods to a planet's surface. This additional stage in loading operations increases operating costs considerably, limiting the vessel's economic appeal to most merchant lines.</p><p>Despite these limitations, the Behemoth remains indispensable for bulk cargo operations where no other vessel can match its capacity. Its twenty cargo decks can accommodate nearly eighty thousand tons of goods, making a single Behemoth transit worth dozens of trips by smaller vessels. The design has endured across centuries of service, evidence of the soundness of its original engineering.</p>
capabilities: |-
  <p>The Arcship configuration dramatically repurposes the Behemoth C hull for long-duration habitation rather than bulk cargo transport. The weapons suite and armor protection remain identical to the standard Clan variant, with Clan ER large and medium lasers covering flanks and aft arcs. The critical difference lies in the interior, where cargo capacity has been reduced to approximately thirty-eight thousand tons to accommodate living facilities for over thirty-five hundred crew and passengers. This conversion transforms the vessel into a self-contained mobile habitat capable of sustaining a large population during extended interstellar voyages, serving the needs of Clan communities that have adopted a nomadic existence.</p>
deployment: |-
  <p>The Arcship configuration emerged in the early thirty-second century as certain Clan populations adopted a more nomadic existence. These converted Behemoths serve as mobile communities, carrying thousands of inhabitants across interstellar distances. Their deployment reflects a significant cultural shift among some Clan factions, prioritizing population mobility over the fixed territorial holdings that defined earlier Clan society.</p>
history: |-
  <p>The Behemoth class has a complicated design history stretching back to the mid-twenty-seventh century. The Terran Hegemony originally commissioned the design alongside the smaller Mammoth class, promising the designer that both classes could be sold to foreign powers. When the prototypes entered their final development phase around 2650, the Hegemony reneged on that promise, restricting both designs to domestic use only. In 2650, two prototypes were stolen from their orbital moorings and sold to the highest bidder, raising fears that the designs could be reverse-engineered by rival states.</p><p>The theft forced the Hegemony to reconsider its stance, and it ultimately permitted the original manufacturer to sell the design abroad. Although suspicion lingered that the manufacturer had somehow been involved in the heist, nothing was ever proven. This decision to share the design with foreign powers ensured that the Behemoth would remain in production even after the original manufacturer's demise. The finalized production variant entered service in 2782, and multiple shipyards across the Inner Sphere took up manufacturing, ensuring the class survived the Succession Wars intact.</p><p>Visual evidence confirms that at least some Clan forces have operated variants of the Behemoth, though whether these vessels were built by the Clans or captured during the Clan Invasion remains uncertain. Clan-operated examples have reportedly featured upgraded energy weapon suites, though detailed configuration data remains scarce.</p>
