overview: |-
  <p>The Black Python, designated the Viper by Inner Sphere forces, is a Clan Steel Viper second-line heavy BattleMech that entered service around 3051. Designed to fill a role similar to Inner Sphere heavies like the Warhammer and Marauder, the Black Python combines highly accurate pulse laser weaponry with impressive mobility for its seventy-five-ton weight class. The design makes extensive use of weight-saving technologies to mount jump jets while carrying a formidable weapons array, achieving a combination of speed and firepower unusual for a second-line heavy.</p><p>Despite its classification as a second-line design, the Black Python proved effective enough that Clan Steel Viper invested in multiple redesigns over the following decades. Produced primarily at New Kent Armorworks on New Kent, the design remained closely associated with the Steel Vipers throughout its operational history. Following the destruction of Clan Steel Viper during the Wars of Reaving, the chassis was resurrected by the Raven Alliance under the new designation White Raven.</p>
capabilities: |-
  <p>The Black Python's primary armament centers on paired large and medium pulse lasers, providing highly accurate firepower at multiple engagement ranges. Four small pulse lasers and twin machine guns round out the close-range weaponry, making the design particularly lethal against infantry and light vehicles. A targeting computer enhances the already precise pulse weaponry, creating a 'Mech that delivers devastating concentrated fire. Thirteen double heat sinks manage the thermal load from the all-energy primary armament, though sustained combat at close range can still push heat levels to uncomfortable levels.</p><p>Mobility is a defining feature of the design. The New Kent Model VII 375-rated extralight engine drives the Black Python to speeds of 86 kilometers per hour, while five Pryzhok jump jets provide 150 meters of jumping capability. Eleven tons of Armorweave ferro-fibrous armor offer reasonable protection for a heavy 'Mech, though the reliance on an extralight engine creates a significant vulnerability if side torso armor is breached.</p><p>The design's primary weakness is the lack of knockout firepower at long range. Without large-bore autocannons, PPCs, or Gauss rifles, the original Black Python must close to medium range to bring its most effective weapons to bear, exposing it to return fire during the approach.</p>
deployment: |-
  <p>Building on the 3 variant's chassis, this configuration replaces the twin machine guns with an extended-range medium laser. This modification eliminates the design's ammunition dependency entirely, making it better suited for extended operations without resupply. The trade-off is reduced effectiveness against unarmored infantry, but the additional energy weapon provides more consistent damage output against hardened targets. The variant needs no ammunition, making it ideal for independent operations far from supply lines.</p>
history: |-
  <p>The Black Python was developed by Clan Steel Viper as a second-line heavy BattleMech, entering production around 3051 at the New Kent Armorworks facility on New Kent. Drawing design inspiration from Inner Sphere heavy 'Mechs like the Warhammer and Marauder, the Black Python offered comparable firepower in a faster, more mobile package. Its classification as a second-line design meant that Steel Viper trueborn warriors often viewed assignments to Black Python units with some disdain, despite the 'Mech's considerable combat effectiveness.</p><p>The Black Python saw its most significant combat deployments during the Clan Invasion era and the subsequent Civil War period. Clan Steel Viper fielded the design across their touman, with the 'Mech appearing in every Galaxy. The garrisons around the Mercer building on the Steel Viper capital world became particularly associated with the design, where its distinctive shape became synonymous with the Clan itself. As Steel Viper underwent internal reforms during the late 3050s, the Black Python's effectiveness led to broader adoption throughout the touman despite its second-line status.</p><p>Production at New Kent Armorworks continued under Clan Steel Viper ownership through the Civil War era. The Albion MMA Complex on Albion also produced the base Black Python configuration, though this facility changed hands multiple times, passing from Clan Burrock to Clan Star Adder following the Burrock Absorption, and later to Clan Cloud Cobra during the Jihad.</p><p>The destruction of Clan Steel Viper during the Wars of Reaving ended production at New Kent. The Ravens had always lamented seeing the graceful, bird-like Black Python in Viper formations, feeling that such a 'Mech should be soaring with them rather than slithering with the hated Vipers. By resurrecting the pre-3060s Black Python under a new name, Clan Snow Raven stayed true to its scavenger heritage, claiming the chassis and restarting production at Raveena Electronics on Ramora as the White Raven. There is no more Viper, only the White Raven.</p>
