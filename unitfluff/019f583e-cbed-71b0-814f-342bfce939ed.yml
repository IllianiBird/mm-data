chassis: "Great Wyrm"
model: "2"
overview: |-
  <p>The Great Wyrm holds the distinction of being among the first unique BattleMech designs developed by the Clans following their exodus from the Inner Sphere. When General Kerensky departed in 2784, he carried complete copies of the Star League's military hardware specifications, including designs rejected by the SLDF. Clan Mongoose scientists discovered the Dragon specifications and recognized potential the Star League had overlooked. Within little more than a year, they converted the design into the Great Wyrm.</p><p>The Mongoose designers achieved something remarkable: they reduced the chassis weight by fifteen tons while maintaining the Dragon's characteristic speed of 86 kilometers per hour. This weight reduction came primarily through lightening armor protection, deemed acceptable for the Great Wyrm's intended role as a mobile striker. First seeing combat in 2844 against Clan Star Adder forces on Tokasha, the Great Wyrm soon spread throughout every Clan's touman.</p>
capabilities: |-
  <p>The Great Wyrm's weapons suite provides engagement flexibility across all combat ranges while emphasizing the standoff approach favored by its Clan Mongoose creators. Twin Series GAA-22 Ultra Autocannon/2s serve as the primary armament, capable of maintaining sustained long-range fire that harasses opponents while the 'Mech exploits its mobility to control engagement distance. A Mk. 44 LRM-10 launcher supplements this with indirect fire capability, while paired Series 1 Mk. 3 ER medium lasers and Series 1 Mk. 2 ER small lasers provide close-range defense.</p><p>The design philosophy reflects early Clan tactical doctrine emphasizing firepower and speed over protection. Seven tons of CerPlate Mod 2F armor represents roughly thirty percent less protection than the parent Dragon design, a trade-off accepted in favor of improved weapons technology. The RFUM 225 fusion engine maintains the 86 kilometer per hour top speed on the reduced forty-five ton chassis, while ten double heat sinks manage thermal output effectively.</p>
deployment: |-
  <p>Produced during the Jihad in 3069, the Great Wyrm 2 incorporates advanced Clan weapons technology developed in the decades since the original's introduction. The twin UAC/2s and LRM launcher give way to a devastating Hyper-Assault Gauss 20 with two tons of ammunition, fundamentally changing the 'Mech's engagement profile. A third ER medium laser joins the existing pair, while an Anti-Personnel Gauss Rifle provides defense against infantry and battle armor. Ferro-fibrous armor increases protection over the original's standard plating. The variant transforms the Great Wyrm from a harassment platform into a direct-fire striker capable of threatening even heavy opponents.</p>
history: |-
  <p>The Great Wyrm's baptism of fire came in 2844 when Clan Star Adder forces assaulted the Mongoose colony on Tokasha. A Star of the new 'Mechs formed part of the defending Trinary, and though the Adders ultimately prevailed, the Great Wyrms distinguished themselves by being the last to fall. The defenders used their mobility to stay beyond opponents' optimal weapon ranges while maintaining constant autocannon fire, a tactical approach that would define Great Wyrm employment for decades.</p><p>The Great Wyrm's success attracted widespread interest throughout the Kerensky Cluster. Clan Cloud Cobra retooled two of their own production lines to build the 'Mech, operating them for nearly a decade. Other Clans acquired examples through trade, trials, and salvage. However, the introduction of OmniMech technology revolutionized Clan warfare, and traditional BattleMechs like the Great Wyrm found themselves relegated to solahma units deemed unworthy of the new omnipods.</p><p>Main production halted in 2869 when Clan Smoke Jaguar absorbed Clan Mongoose, acquiring their remaining manufacturing capacity. Clan Burrock made limited production runs in 2871-2872 after capturing a former Mongoose facility on Foster, but Clan Fire Mandrill subsequently seized and retooled that plant. Since then, no new Great Wyrms have been constructed, though every Clan maintains some examples in their second-line Clusters. Clans Cloud Cobra, Coyote, Fire Mandrill, Steel Viper, and Star Adder field the most, approximately half a dozen Stars each.</p>
