chassis: "Fusilier Battle Armor"
model: "(Upgrade)(Sqd5)"
overview: |-
  <p>The Fusilier is an assault-class battle armor suit manufactured by General Motors at their Salem facility for the Armed Forces of the Federated Suns. Introduced in the early 3120s, the design was intended to fill a frontline combat role alongside other heavy suits in AFFS battle armor battalions. Often described as the most unremarkable suit in AFFS service, the Fusilier earned a grudging respect for its consistent performance and solid construction in a role where dependability mattered more than distinction.</p>
capabilities: |-
  <p>The upgraded Fusilier trades the Magshot Gauss Rifle for a Man-Portable Plasma Rifle with twenty rounds of ammunition, giving the suit a significant increase in close-range thermal output at the cost of the Magshot's precision. The Jump Booster is downgraded to accommodate the heavier weapon system, reducing effective jump range from sixty meters to thirty. The body-mounted Light Machine Gun and left-arm Armored Glove carry over from the original design unchanged.</p><p>The most significant modification is the replacement of Basic Stealth armor with Reflective Armor. While reflective plating offers improved resistance against energy weapons, it proves considerably more fragile under physical impacts and ballistic threats. The trade-off sacrifices the original's sensor-masking capability and structural resilience for a specialized defense that only pays dividends against energy-heavy opponents, narrowing the suit's operational flexibility.</p>
deployment: |-
  <p>Clan Points operating captured upgraded Fusiliers found the revised armament more appealing than the original configuration, though the suit's fragile armor remained a significant liability by Clan standards. Five-trooper Points assigned to raiding or border skirmish duties occasionally fielded the upgrade when salvage made it available, but the design saw no widespread Clan adoption.</p>
history: |-
  <p>General Motors began manufacturing the Fusilier at their Salem plant in the early 3120s, producing a suit that filled no particular gap in the AFFS order of battle. The Department of the Quartermaster yet procured the design, and GM continued production for over a decade before introducing an upgraded variant after the Blackout. The Fusilier drew on design elements from both the Grenadier and the Sea Fox, producing a competent if unremarkable assault suit that earned a reputation for solid construction rather than any defining tactical specialty.</p><p>Capellan March Militia units developed a marked preference for the original model over the upgrade. A 3139 raid conducted by a New Syrtis CMM detachment on the training world of Nihal demonstrated the reason clearly: when both variants came under fire inside a collapsing structure, the upgraded suits crumpled under falling debris while the original models completed the mission and escaped. The incident reinforced a broader reluctance among frontline units to adopt the newer variant. Warrior House Ijori also acquired captured Fusiliers and employed them on raids across formerly Davion worlds, proving the suit capable even in Capellan hands.</p>
