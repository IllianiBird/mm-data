chassis: "Mechanized Tracked Platoon (AFFS)"
model: "(MG 3067+)"
overview: |-
  <p>The AFFS treats its infantry as professionals rather than expendable garrison filler, drawing soldiers from single worlds or neighboring systems to build the unit cohesion that the Federated Suns considers essential to effective combined-arms operations. Mechanized tracked platoons ride armored personnel carriers that provide both protection and all-terrain mobility, allowing these troops to keep pace with armored advances across open ground and survive the indirect fire that scatters lighter formations. Supplementing their rifles with portable machine guns that provide sustained automatic fire, these platoons anchor defensive positions with suppressive capability that pins attacking infantry and discourages unarmored vehicles from closing.</p>
