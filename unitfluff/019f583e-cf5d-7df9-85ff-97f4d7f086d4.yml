chassis: "Blade"
model: "BLD-XX"
overview: |-
  <p>The Blade is a thirty-five-ton light BattleMech introduced in 3087 as part of the Republic of the Sphere's ambitious military standardization program. Commissioned by Commanding General Victor Steiner-Davion, the design addressed the Republic Armed Forces' critical need to replace the chaotic mix of Age of War relics, Succession Wars survivors, and modern production models inherited from Stone's Coalition. New Hessen WorkMechs won the manufacturing contract with a design philosophy centered on durability, speed, and ease of maintenance, producing a fast strike 'Mech capable of exceeding one hundred kilometers per hour. Drawing heavily on components proven in the company's workhorse Rook chassis, the Blade became one of the RAF's signature light 'Mechs, serving prominently with the Principes Guards, Hastati Sentinels, and elite Knights of the Sphere formations.</p>
capabilities: |-
  <p>Built around the principle that speed equals survival, the Blade mounts a GM 245 extra-light engine that propels its Hessen Light MK I chassis to a maximum speed of one hundred and eighteen kilometers per hour. This emphasis on mobility comes at the cost of jump capability, leaving the design reliant on raw ground speed for tactical repositioning. StarGuard ferro-fibrous armor provides respectable protection for its weight class, with flat plate mounting that reduces armor replacement times by up to fifty percent, giving the design a distinctly industrial aesthetic.</p><p>The Blade's primary armament centers on a Mydron Tornado rotary autocannon supported by a pair of Diverse Optics extended-range medium lasers, all mounted in the right arm. Three tons of ammunition provide respectable endurance even at high rates of fire. While concentrating all weaponry in a single limb presents an obvious vulnerability, this arrangement reflects New Hessen's effort to achieve OmniMech-level ease of maintenance on a standard chassis. Borrowing from Clan modularization concepts, the entire right arm functions as a self-contained weapons system that can be detached at the shoulder and replaced at ground level, dramatically reducing field repair times.</p><p>The ammunition feed system routes through armored channels bypassing the shoulder assembly, addressing the rotary autocannon's susceptibility to jamming within the chassis's tight internal spaces. Field trials demonstrated the Blade suffered ten percent fewer jamming incidents than the comparable Legionnaire.</p>
deployment: |-
  <p>The anti-aircraft variant of the original Blade production line, this variant mounts a Mydron Excel LB 10-X autocannon in place of the standard model, providing the option for cluster munitions effective against fast-moving aerial targets. Two tons of ammunition offer reasonable endurance, but a critical design limitation prevents the ammunition feed system from switching between standard and cluster rounds during combat. Designers were unable to adapt the single-track feed mechanism to handle multiple ammunition types, forcing MechWarriors to choose either standard or cluster loadouts before each engagement. This inflexibility significantly reduces the variant's tactical versatility, though dedicated anti-aircraft units consider the trade-off acceptable for the improved air defense capability.</p>
history: |-
  <p>The Blade emerged from the tumultuous post-Jihad period when the newly formed Republic of the Sphere faced the monumental task of forging a coherent military from the remnants of multiple national armies. The standardization program that birthed the design reflected a broader strategic vision to simplify logistics across the Republic's diverse military formations, and New Hessen WorkMechs' proven track record with the Rook secured the company the manufacturing contract despite its location just outside the Republic's borders.</p><p>The first three years of Blade production were promised exclusively to the Republic Armed Forces, with the Federated Suns securing an option to purchase up to fifty percent of all future production runs. New Avalon initially showed little interest in the design, preferring the heavier Legionnaire and the just-released Cuirass, though RAF deployment of the Blade to the Principes Guards and vital world defense garrisons soon demonstrated the design's value in rapid-response operations.</p><p>The Blade's popularity rapidly outgrew New Hessen's production capacity during the Republic era. Graham-Davis Enterprises of Tamarind licensed the design, but their budget-conscious approach to manufacturing produced the BLD-7R, a cheaper variant that cut the advanced gyro and CASE protections. This decision, combined with Mydron's choice to supply only its incompatible Model RC rotary autocannon to New Hessen going forward, created persistent logistical headaches for the RAF as two fundamentally different ammunition feed systems competed for supply chain resources.</p><p>The Republic eagerly absorbed most of New Hessen's output through the 3120s and secured an exclusive five-year contract in 3130. New Hessen's continued cooperation even after Gray Monday demonstrated the manufacturer's business integrity. However, as the Republic retreated behind Fortress Republic, control of New Hessen shifted. House Davion initially held the planet, but the Capellan Confederation eventually seized control, redirecting Blade production to serve Capellan interests. Meanwhile, Graham-Davis Enterprises continued independent production on Tamarind, ensuring the design remained available across multiple successor states throughout the Dark Age and into the ilClan era.</p>
