chassis: "Eris"
model: "ERS-2N"
overview: |-
  <p>When a critical supplier cut off component deliveries to Nashan Diversified, the promising Hel design was left without a production path. Kallon Weapon Industries purchased the specifications and set about redesigning the chassis as a mobile skirmisher tailored for the perpetual low-intensity conflicts plaguing the former Free Worlds League. Rebranded the Eris (a reflection of the chaos and discord the design was intended to sow among its foes) the fifty-ton 'Mech entered production at Kallon's Loyalty facility around 3115.</p><p>Kallon's engineers distinguished the Eris from both the original Hel and their own popular Wolverine by dramatically enhancing the chassis's mobility in broken terrain, positioning the design as a direct competitor to Earthwerks' Phoenix Hawk line of mobile skirmishers and raiders. The redesign also replaced the Hel's armament with a more flexible weapons suite, giving MechWarriors greater adaptability across engagement ranges.</p>
capabilities: |-
  <p>The Eris builds upon the Hel's proven N&D HLBM endo steel frame and Hermes 250 XL engine, retaining the fifty-ton chassis's excellent speed while dramatically enhancing mobility through the addition of Chilton 360 jump jets paired with a partial wing. This combination grants the Eris exceptional maneuverability in atmospheric operations, with jump performance rivaling many lighter 'Mechs, though the partial wing's effectiveness diminishes in thin atmospheres or vacuum conditions.</p><p>Offensively, the Eris centers its firepower around a Fusigon Smarttooth snub-nose particle projection cannon, trading the Hel's heavy PPC range for greater close-range damage potential. Paired Holly five-tube multi-missile launchers provide remarkable tactical flexibility, allowing MechWarriors to switch between long-range missile bombardment and close-range saturation fire as the engagement dictates. Three Diverse Optics small X-pulse lasers round out the armament, providing devastating accuracy at knife-fighting ranges.</p><p>Kallon Royalstar armor with CASE II protection across both side torsos shields the ammunition stores, mitigating the risk of catastrophic ammunition explosions. At approximately ninety-five percent of maximum armor coverage for the chassis, the Eris offers above-average protection for a medium 'Mech. The persistent vulnerability of the extralight engine to side torso destruction remains the design's most significant weakness, a tradeoff Kallon accepted to maintain the speed and payload necessary for the skirmisher role.</p>
deployment: |-
  <p>The base Eris configuration, introduced around 3115, represents Kallon Weapon Industries' complete reimagining of the original Hel design. The addition of the Chilton 360 partial wing system defines the variant, providing enhanced mobility in broken terrain that distinguishes the Eris from its predecessor. Armed with a Fusigon Smarttooth snub-nose particle projection cannon, paired Holly multi-missile launchers, and three Diverse Optics small X-pulse lasers, this variant trades the Hel's raw long-range hitting power for superior tactical flexibility. This variant has seen extensive service across all Free Worlds League splinter states and remains in production at Kallon's Loyalty facility.</p>
history: |-
  <p>The Eris proved well-suited to the chaotic political arena of the former Free Worlds League, where constant border disputes and factional conflicts created steady demand for mobile skirmishers. During the Dark Age, Kallon's Loyalty facility changed hands alongside the shifting allegiances of the region, passing through various splinter state governments before ultimately returning to Free Worlds League control when the nation reformed.</p><p>The Eris featured regularly in inter-League conflicts, perhaps most especially during the 3140 assault on Aitutaki by the Third Free Worlds Guards. Previous attempts to seize the agricultural world had faltered due to dense native jungles that limited ground-bound BattleMech mobility. Equipped with the Eris, the defending Sixteenth Regulan Hussars readily carried out hit-and-fade and pincer attacks against the bulk of the Guards, with the partial wing system excelling in the hostile environment. The Guards eventually countered by sending forward their own Erises and Phoenix Hawks to pin the Hussars for artillery and air strikes, ultimately eliminating the defenders and securing the world.</p><p>When the Fourth Regulan Hussars counter-attacked to reclaim Aitutaki, the Guards turned the Hussars' own pincer tactics against them, trapping the Fourth between salvaged 'Mechs from the Sixteenth and their main battle line. The Fourth was torn apart and forced to evacuate in disorder.</p><p>The fall of Thermopolis to Clan Wolf disrupted Wolverine production and created unexpected demand for the Eris family, particularly variants replicating the original Hel configuration that shared the Wolverine's tactical role. This development secured Kallon's position in the medium 'Mech market and ensured continued production well into the ilClan era.</p>
