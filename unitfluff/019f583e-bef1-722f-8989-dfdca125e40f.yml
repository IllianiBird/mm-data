chassis: "Motorized Duplus Contubernium (MHAF)"
model: "(LRM)"
overview: |-
  <p>The Marian Hegemony Armed Forces organize their conventional infantry along Roman legionary lines, with formations structured into contubernia, centuries, and cohorts rather than the squads and platoons used by Inner Sphere armies. A duplus contubernium, or double tent-group, fields two squads of ten soldiers. Motorized duplus contubernia use light vehicles for rapid deployment across Hegemony worlds, trading the staying power of heavier mechanized transport for speed and operational reach on patrol and screening duties. Support troops operate man-portable long-range missile launchers capable of engaging targets at distances well beyond personal weapon range, providing indirect fire capability against vehicles and fortified positions.</p>
