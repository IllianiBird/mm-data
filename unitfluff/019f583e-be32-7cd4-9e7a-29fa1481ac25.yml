chassis: "Field Gun Century (MHAF)"
model: "(Motorized Heavy Cannon)"
overview: |-
  <p>The Marian military tradition places infantry at the foundation of its legionary system, with conventional soldiers organized into units bearing Latin designations that reflect the Hegemony's deliberate cultivation of Roman imperial identity. Marian field gun centuries tow crew-served weapons on wheeled, tracked, or motorized carriages, providing direct-fire anti-armor capability that supplements the Legiones Marianes' limited BattleMech strength. The century's field piece is a heavy cannon, a large-caliber weapon that compensates for lack of sophistication with raw destructive power against armored targets.</p>
