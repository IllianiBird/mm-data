chassis: "Mechanized Wheeled Platoon (CCAF)"
model: "(Plasma 3063+)"
overview: |-
  <p>The Capellan Confederation has always relied on its infantry to compensate for the CCAF's chronic shortage of heavier assets. Conventional foot soldiers, drawn from the citizens' militia system that defines Capellan military service, form the backbone of garrison forces across the Confederation's commonalities. Mechanized wheeled platoons balance speed and infantry presence, using armored wheeled transports to move troops quickly along the Confederation's road networks. They sacrifice the cross-country capability of tracked vehicles for faster transit between defensive positions. Plasma rifle sections carry one of the most advanced man-portable energy weapons available, delivering devastating thermal damage that can threaten light vehicles and battle armor at close range.</p>
