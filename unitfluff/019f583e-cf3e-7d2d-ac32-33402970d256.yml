chassis: "Wolverine II"
model: "WVR-7H"
overview: |-
  <p>The Wolverine II represents the pinnacle of Star League-era engineering applied to the venerable Wolverine chassis. Designated the WVR-7H, this Royal variant was developed around 2770 for exclusive use by the Star League Defense Force's elite Royal Brigade formations. The design incorporated the most advanced technology available to the Terran Hegemony, including an endo steel internal structure, ferro-fibrous armor, and double heat sinks, technologies that would become lostech during the Succession Wars.</p><p>While the Wolverine II shared the same basic silhouette and mission profile as its standard counterpart, the extensive use of advanced materials and weapons systems made it a distinctly superior combatant. Most significantly, the Wolverine II served as the direct progenitor of the Clan Conjurer, as the WVR-7H was the specific variant carried aboard the Exodus fleet and subsequently rebuilt with Clan technology to create what Inner Sphere intelligence would designate the Hellhound.</p>
capabilities: |-
  <p>The Wolverine II retains the balanced combat philosophy of the standard Wolverine while dramatically improving upon its capabilities through the application of Star League Royal-grade technology. The endo steel internal structure saves critical weight that is redistributed throughout the design, while ferro-fibrous armor provides superior protection compared to the standard Maximillian plating of the base WVR-6R.</p><p>The most significant weapons upgrade is the replacement of the standard autocannon/5 with an ultra-class autocannon/5, capable of firing at twice the normal rate when tactical circumstances demand concentrated firepower. An additional ton of ammunition ensures the enhanced rate of fire does not compromise battlefield endurance. The short-range missile system receives an Artemis IV fire control integration, dramatically improving missile accuracy and cluster performance, while a medium pulse laser replaces the standard head-mounted medium laser with superior accuracy for close-range engagements.</p><p>The transition to double heat sinks (achieved while actually reducing the total number of sinks from the standard model) provides dramatically improved thermal management, allowing the Wolverine II to sustain a higher rate of fire without the overheating concerns that plague the base variant. CASE protection in both side torsos mitigates the risk of catastrophic ammunition explosions, and additional armor plating around the legs provides improved structural integrity during the aggressive maneuvering for which the Wolverine is known.</p>
deployment: |-
  <p>The sole variant of the Wolverine II was developed around 2770 exclusively for the Star League Defense Force's Royal Brigade formations. Incorporating the most advanced Terran Hegemony technology available, this variant builds upon the standard WVR-6R platform with an endo steel internal structure and ferro-fibrous armor that save critical weight. The remaining heat sinks are upgraded to double-strength models, and the autocannon is replaced with an ultra-class weapon carrying an additional ton of ammunition for sustained engagements. The SRM-6 launcher is mated to an Artemis IV fire control system to improve missile accuracy, while the standard medium laser is upgraded to a pulse model. CASE protection in both side torsos safeguards against catastrophic ammunition explosions, and an additional half-ton of armor concentrated on the legs improves survivability in the lower extremities. The WVR-7H's significance extends far beyond its own service record, as it provided the direct technological foundation for the Clan Conjurer, making this Royal variant the critical evolutionary link between the Inner Sphere Wolverine and its Clan-technology descendants.</p>
history: |-
  <p>The Wolverine II was produced exclusively for the Star League Defense Force's Royal Brigades, the elite formations that served as the Terran Hegemony's premier military force. As a Royal variant, the WVR-7H incorporated technologies restricted to Hegemony use, making it unavailable to the Great Houses' militaries during the Star League era. This exclusivity meant that when the Star League fell, most surviving Wolverine IIs were either lost in the fighting of the Amaris Civil War and subsequent Liberation campaigns, or accompanied General Kerensky on the Exodus.</p><p>The few Wolverine IIs that remained in the Inner Sphere quickly became prized relics as the Succession Wars destroyed the manufacturing base needed to produce their advanced components. With no factory capable of producing endo steel, ferro-fibrous armor, or double heat sinks, damaged Wolverine IIs could not be properly repaired, and the variant gradually disappeared from Inner Sphere battlefields. ComStar is believed to have maintained a small number in their hidden stockpiles, but these were rarely committed to combat during the centuries of technological decline.</p><p>The Wolverine II's most enduring legacy lies not in its own service record but in its role as the foundation for the Clan Conjurer. When the Clans developed their technology base and began upgrading proven Star League designs, the WVR-7H served as the template for what would become the Hellhound, rebuilt with Clan-grade weapons and equipment while retaining the fundamental design philosophy that had made the Wolverine II successful. This lineage makes the Wolverine II a critical link between the Star League's military heritage and the Clans' own arsenal, a distinction that gained renewed significance when the Wolf Empire began producing the Conjurer at the same Thermopolis facility that had once manufactured its Inner Sphere ancestor.</p>
