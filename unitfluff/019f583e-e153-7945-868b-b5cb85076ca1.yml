chassis: "Battle Taxi"
model: "NL-42"
overview: |-
  <p>The NL-42 Battle Taxi is a two-hundred-ton boarding transport small craft originally designed by Blackwell Corporation on New Valencia. Introduced in 3053 as the military equivalent of the ubiquitous S-7A shuttle bus, the Battle Taxi was purpose-built for ship-to-ship boarding operations against DropShips, JumpShips, and WarShips. Its combination of speed, heavy armor protection, and generous troop capacity made it an immediate success with naval forces across the Inner Sphere, and the design was quickly licensed to manufacturers in every major Successor State. The craft's straightforward construction and reliable performance earned it a reputation as the standard small craft for marine assault operations, a role it continues to fill decades after its introduction.</p>
capabilities: |-
  <p>The Battle Taxi relies on a safe thrust of three gravities, with a maximum acceleration of four and a half gravities, to close rapidly with target vessels during boarding actions. A pair of magnetic grapples and a hull-mounted tug adapter allow the craft to latch onto enemy DropShips, JumpShips, or even WarShips, pulling itself alongside to disgorge its marine contingent. If the tug adapter cannot achieve a proper seal, embarked marines can use magnetic boots and cutting tools to create alternate access points along the target hull.</p><p>Armament consists of paired extended-range large lasers mounted in the wing sections for long-range suppressive fire during approach, supplemented by four medium pulse lasers split between the wings for close-range defense. Thirty-two tons of standard armor provide substantial protection during the vulnerable approach phase. The craft's cargo hold accommodates fifty tons of personnel and equipment, typically two points of battle armor or three full platoons of conventional infantry. A crew of three operates the vessel, though a single pilot can manage the craft at reduced effectiveness if necessary.</p>
deployment: |-
  <p>The base NL-42 represents the standard production model as manufactured by Blackwell Corporation and its numerous licensees. This configuration has remained essentially unchanged since its introduction, reflecting the proven nature of the design's balance of approach speed, defensive firepower, and troop capacity for conventional ship-to-ship boarding missions across both naval and anti-piracy operations.</p>
history: |-
  <p>The NL-42 emerged from Blackwell Corporation's extensive experience supporting Wolf's Dragoons, who had long relied on boarding operations as part of their combined-arms doctrine. The design drew on Star League-era boarding craft concepts, updated with technologies available in the early 3050s. Blackwell's close relationship with the Dragoons meant the craft was field-tested extensively before being offered on the open market, and the Dragoons' own variant, known as the Lupus, became the first operational model.</p><p>The design's immediate popularity led to rapid licensing across the Inner Sphere. Andurien AeroTech on Westover, Earthwerks Limited on Ares, Shipil Company on Skye, and Tomori Trans Industrial on Chatham all secured production rights, ensuring that every major Successor State gained access to the craft within a decade of its introduction. This broad manufacturing base reflected growing demand for dedicated boarding craft as naval operations expanded during the Clan Invasion era and the subsequent Civil War period.</p><p>The use of extended-range and pulse laser technology in the base design created a historical curiosity. Sarna records suggest the NL-42 class saw service during earlier, lower-technology eras of the Succession Wars, when such advanced weapon systems were unavailable. What weapons the earlier models carried remains undocumented, though the Lupus variant used by Wolf's Dragoons is confirmed to have mounted the full advanced weapons suite. The Jihad disrupted several production lines, especially Blackwell's facility on New Valencia, but the distributed manufacturing network ensured the Battle Taxi remained available throughout the conflict and into the post-Jihad era. Production continues at multiple sites across the Inner Sphere, with ownership changes reflecting the political upheavals of the Dark Age and ilClan periods.</p>
