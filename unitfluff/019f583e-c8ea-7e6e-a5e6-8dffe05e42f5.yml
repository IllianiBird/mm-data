chassis: "Tsunami"
model: "TS-P1"
overview: |-
  <p>The Tsunami is a forty-ton medium BattleMech designed and manufactured by OmniTech Industries on Solaris VII. Introduced in the early 3050s as OmniTech's flagship design, the machine was intended to serve both on the competitive Solaris arena circuit and as a capable battlefield combatant for minor mercenary commands. Well designed but broadly considered unimpressive by critics, the Tsunami nonetheless carved out a steady niche among Solaris stables and small mercenary outfits. OmniTech's relatively low production rate kept the design from achieving widespread distribution, but those who operated it found a reliable and versatile platform suited to the demands of both arena combat and light battlefield operations.</p>
capabilities: |-
  <p>The Tsunami is built on a conventional chassis powered by a standard fusion engine, achieving respectable mobility for its weight class. The design emphasizes jump capability, with its original configuration mounting enough jump jets to cover significant ground in broken terrain, a prized advantage in both Solaris arenas and battlefield environments. Armor protection is adequate for a forty-ton machine, though not exceptional, placing the Tsunami squarely in the middle of its weight class for survivability.</p><p>Across its production run, the Tsunami has been offered with different weapons configurations suited to different combat philosophies, ranging from conventional ballistic and missile loadouts to more advanced energy-focused armament incorporating extended-range lasers and precision ballistic weapons. Later models incorporated ferro-fibrous armor and triple-strength myomer, trading some jump capability for dramatically improved physical combat performance and a conditional speed advantage. The design has consistently earned a reputation as a difficult machine to maintain, with its complex internal layout limiting its appeal to commands without access to well-stocked repair facilities. However, for operators willing to invest in proper upkeep, the Tsunami rewards with solid versatility and a balanced combat profile that handles both ranged and close-quarters engagements competently.</p>
deployment: |-
  <p>The original Tsunami mounts a conventional weapons loadout suited to its dual role as an arena fighter and light battlefield combatant, pairing energy weapons and ballistic armament with a light missile launcher for additional close-range punch. Without the upgraded model's myomer enhancements, this variant relies instead on superior jump mobility, mounting enough jump jets to cover a hundred-eighty-meter distance that gives it a notable advantage in the broken terrain of Solaris arenas and battlefield environments alike. The TS-P1 continues to appear in several stables and cooperatives throughout Solaris City and its Reaches, with occasional sightings among minor mercenary formations operating in the region.</p>
history: |-
  <p>OmniTech Industries introduced the Tsunami in the early 3050s as their entry into the competitive medium BattleMech market on Solaris VII. The design arrived during a period of rapid technological advancement following the Clan Invasion, but OmniTech initially chose a conservative approach, fielding the original model with proven, readily available components rather than cutting-edge systems. This decision earned the Tsunami a reputation as a reliable but uninspiring machine, one that worked well enough in arena bouts and low-intensity mercenary operations but failed to capture the imagination of buyers seeking the latest technological marvels.</p><p>Despite the lukewarm critical reception, the Tsunami found a steady market among the minor stables and cooperatives operating throughout Solaris City and the surrounding Reaches. Most buyers purchased only one or two machines, limiting OmniTech's production volumes, but the design's versatility in both arena and battlefield roles ensured consistent demand. Several small mercenary commands, including the Fighting Intellectuals and Battle Magic, adopted the Tsunami as a middleweight element in their formations, further demonstrating the design's practical utility beyond the arena circuit.</p><p>The introduction of an upgraded variant around 3063 represented OmniTech's effort to address the criticisms leveled at the original model. By incorporating advanced armor, enhanced myomer systems, and a more capable weapons suite, the company transformed the Tsunami into a more competitive design befitting the Civil War era's technological standards. The upgraded model attracted renewed interest from Solaris gladiators who valued its improved close-combat performance in the arena environment.</p><p>Solaris VII's turbulent political history saw the OmniTech facility pass through several hands over the centuries. Originally under Free Worlds League jurisdiction, the planet shifted to Lyran control during the Succession Wars before becoming part of the Federated Commonwealth. The factory returned to Lyran sovereignty following the FedCom split and continued operations through the Civil War period. Production of the Tsunami appears to have ceased by the Jihad era, with OmniTech's attention and resources likely redirected toward other designs, including the larger Morpheus that drew upon lessons learned from the Tsunami program. By the Dark Age, Solaris VII had fallen under Clan Wolf control, though there is no evidence of renewed Tsunami production under the new regime.</p>
