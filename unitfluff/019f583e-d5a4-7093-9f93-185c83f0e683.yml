chassis: "Prey Seeker"
model: "PY-SR30"
overview: |-
  <p>The Prey Seeker is a fifteen-ton ultralight BattleMech introduced in 3136 by Achernar BattleMechs at their Cahokia facility. Designed as a high-speed scout and raider for the Armed Forces of the Federated Suns, the Prey Seeker grew out of a quiet dissatisfaction among AFFS MechWarriors who felt increasingly marginalized by the rise of combined-arms warfare. Its unusual arm construction and phenomenal speed hearken back to the Clan Dasher OmniMech first encountered during the Clan Invasion, though its mission profile remains firmly rooted in traditional BattleMech scouting doctrine.</p><p>The Prey Seeker stands as a deliberate investment in dedicated reconnaissance at a time when many militaries had shifted toward cheaper combined-arms solutions. Despite the extreme cost of its powerplant, the design proved its worth in the field and entered series production during a period of escalating conflict across the Federated Suns.</p>
capabilities: |-
  <p>The Prey Seeker is built for one purpose above all others: speed. Its Magna 180 XXL engine propels the fifteen-ton chassis to a staggering 194 kilometers per hour, making it faster than even the Clan Dasher or the Fireball. This extraordinary performance comes at significant cost, both financially and in design compromises. A small cockpit and XL gyro help free tonnage, but the 'Mech carries only three and a half tons of StarGuard CIV armor, barely enough to protect against incidental fire. The rear armor is particularly thin, and even a glancing hit from behind risks penetrating to internal structure.</p><p>Armament is equally minimalist. A pair of ChisComp 73 medium re-engineered lasers provide defensive firepower that, while modest, offers a useful advantage against opponents employing advanced armor types such as hardened, ferro-lamellor, or reflective armor. The Prey Seeker lacks jump jets, electronic warfare suites, and active probes, relying entirely on raw speed to avoid detection and engagement. Critics have been quick to point out the astronomical cost of its extralight components, a criticism that has gained traction as territorial losses to the Draconis Combine and Capellan Confederation have strained the Federated Suns' military budget.</p>
deployment: |-
  <p>This variant emerged as a field modification in 3141, reconfiguring the Prey Seeker for anti-infantry operations. All energy weapons are stripped out and replaced with a pair of three-tube machine gun arrays, one in each arm, fed by a ton of ammunition split between both locations. While virtually helpless against armored targets, this variant excels at hunting conventional infantry and supporting ground forces by shredding infantry formations at high speed. The variant found particular use during counter-insurgency operations and planetary garrison duties where enemy infantry posed a greater threat than opposing BattleMechs.</p>
history: |-
  <p>Prey Seekers were rushed into combat deployments soon after the formation of Fortress Republic, without adequate time for testing and doctrinal development. Many MechWarriors had to discover effective tactics through hard-won field experience, learning what the ultralight 'Mech could and could not do under fire. The lack of established doctrine led to significant early growing pains, with commanders often unsure how to best integrate such a fast but fragile asset into their formations.</p><p>One of the first significant deployments was to the Tikonov garrison. An evaluation company of twelve Prey Seekers was assigned to the Tukwila district just before a Capellan raid. The garrison commander, unfamiliar with the new design's capabilities, broke them into three reconnaissance lances to supplement existing VTOL and hovertank scouts. Fortunately for the Prey Seeker pilots, the main raiding force went in a different direction, had they been decisively engaged, the troops' inexperience likely would have led them to fight the ultralight 'Mechs as conventional light BattleMechs, an engagement they would almost certainly have lost.</p><p>During Duke Sandoval's doomed Operation PELAYO in 3141, a number of Prey Seekers were smuggled onto the targeted worlds. Operating solo or in pairs, these 'Mechs proved surprisingly effective scouts, with the speed to evade everything except the fastest hover or VTOL pursuers. Lacking easily detected electronics like active probes or ECM suites, the Prey Seekers avoided detection entirely. When the PELAYO forces landed, the scouts rendezvoused and provided timely intelligence updates that proved invaluable to the operation's initial phases.</p><p>The Prey Seeker also demonstrated an unexpected talent for long-range raiding. Despite their uncomfortable cockpits, many AFFS commanders sent small bands of Prey Seekers on extended patrols around enemy concentrations. On Fairfax, a lance of Prey Seekers was dispatched two hundred kilometers behind Kuritan lines, where the trio tore into supply lines, destroyed bridges, and terrorized infantry security patrols. The DCMS commander was forced to divert an entire company of 'Mechs to track them down, delaying the conquest of the world by at least three weeks. Such actions demonstrated the Prey Seeker's true value, not as a frontline combatant, but as a fast-moving disruptor that could tie down forces far out of proportion to its own combat power.</p>
