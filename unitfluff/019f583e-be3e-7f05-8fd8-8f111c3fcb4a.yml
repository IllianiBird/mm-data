chassis: "Field Gun Century (MHAF)"
model: "(Tracked AC20 3049+)"
overview: |-
  <p>The Marian military tradition places infantry at the foundation of its legionary system, with conventional soldiers organized into units bearing Latin designations that reflect the Hegemony's deliberate cultivation of Roman imperial identity. Marian field gun centuries tow crew-served weapons on wheeled, tracked, or motorized carriages, providing direct-fire anti-armor capability that supplements the Legiones Marianes' limited BattleMech strength. The century's field gun is a massive autocannon that delivers devastating close-range firepower, capable of crippling vehicles and staggering BattleMechs, though its short effective range demands careful positioning.</p>
