overview: |-
  <p>The Blood Asp was introduced in 3060 by Clan Star Adder as a deliberate provocation aimed at their longtime rivals, Clan Blood Spirit. Designed as a heavy assault OmniMech, the ninety-ton Blood Asp was developed from the proven Kingfisher chassis, with Clan Star Adder scientists replacing the standard fusion engine with a Consolidated 360 XL to nearly double the available pod space. This engineering decision came at a cost, however, as structural constraints forced the removal of the Kingfisher's ferro-fibrous armor in favor of standard ceramic plate. Manufactured at the Sheridan LM-TA 8-10 facility, the Blood Asp was one of the first OmniMechs to field the breakthrough heavy laser technology, establishing it as an offensive powerhouse capable of devastating enemies at virtually any range.</p>
capabilities: |-
  <p>The Blood Asp's forty-two tons of pod space provide extraordinary flexibility for a chassis of its weight class, enabling configurations ranging from long-range fire support to devastating close-quarters brawlers. The base chassis incorporates sixteen tons of Forging ZZ7 Ceramic Plate armor and fourteen double heat sinks, providing a solid defensive and thermal foundation for any weapons loadout. The Type MAES-90 Light endo steel internal structure saves critical weight, while the Consolidated 360 XL engine propels the massive OmniMech to a respectable cruising speed of forty-three kilometers per hour.</p><p>The Primary configuration exemplifies the Blood Asp's design philosophy with twin Gauss rifles capable of stripping nearly a ton of armor at extreme range, supplemented by four heavy medium lasers, a pair of medium pulse lasers, and a Streak SRM-6 for close-range engagements. The Series D8 CC-25X communications system and "Hermes" CT-42 Mk. II targeting-tracking suite provide reliable battlefield coordination across all configurations. While the XL engine renders the Blood Asp vulnerable to torso destruction, the sheer weight of firepower available in most configurations ensures that few opponents survive long enough to exploit this weakness.</p>
deployment: |-
  <p>Alternate Configuration C relies almost exclusively on ammunition-based weapons, mounting twin Ultra Autocannon/10s alongside an LB 20-X autocannon for devastating close-range firepower. A single ER large laser provides the only energy-based weapon for long-range engagements. The heavy reliance on ammunition creates a finite combat endurance that makes this configuration best suited for the short and decisive engagements characteristic of Clan Trials, where protracted fighting is uncommon. Once ammunition stores are depleted, the C configuration's combat effectiveness drops precipitously, a trade-off that Clan warriors generally accept given the overwhelming volume of fire available during those critical opening exchanges.</p>
history: |-
  <p>The Blood Asp's creation was rooted in the bitter inter-Clan rivalry between Clan Star Adder and Clan Blood Spirit, a feud stretching back centuries in the Kerensky Cluster. By naming their newest and most powerful assault OmniMech after a creature associated with their despised rivals, the Star Adders delivered an insult as calculated as the 'Mech's weapons loadouts. The design proved its worth immediately upon entering service, and the Star Adders allocated the majority of initial production to their prestigious Alpha Galaxy, with the Keshiks and Delta, Gamma, and Kappa Galaxies receiving limited numbers.</p><p>As a Homeworld Clan design, the Blood Asp remained virtually unknown to the Inner Sphere for decades, appearing only in fragmentary ComStar intelligence reports. This obscurity was briefly broken when the Armed Forces of the Federated Suns acquired a handful of Blood Asps from unknown sources shortly before the FedCom Civil War. Deployed to the Chaos March world of Carver V, these 'Mechs were referred to as "the Star Adder 'Mech" by Davion strategists, a reporting name that persisted even after the machines themselves were destroyed during that conflict.</p><p>The Wars of Reaving proved catastrophic for the Blood Asp's presence beyond Clan Star Adder territory. With the severing of ties between the Homeworld and Invading Clans, Inner Sphere production never materialized, and surviving examples were largely confined to Clan Hell's Horses units that had transported them during their relocation to the Inner Sphere. The design faced genuine risk of extinction outside the Kerensky Cluster.</p><p>The Blood Asp's fortunes reversed dramatically in 3142 when Clan Snow Raven revealed it had acquired manufacturing plans seized by Raven Watch agents from the factory on Sheridan during the chaotic final days of the Homeworld Clans. With Raven facilities on Dante already tooled for Kingfisher production, the transition to Blood Asp manufacture proved straightforward. The Ravens aggressively marketed their newly produced Blood Asps, seeking to undercut Clan Sea Fox's dominance of the OmniMech export market. In 3149, a contingent of Ravens appeared over New Abilene and offered the Second Magistracy Highlanders the chance to claim a Blood Asp through a Trial of blood. When three Blood Asps decimated an entire company while observing strict zellbrigen protocols, the impressed Highlanders acquired several of the lightly damaged OmniMechs. Updated Raven production models feature software modifications allowing the acceptance of Inner Sphere weapons, significantly expanding field customization options for export customers.</p>
