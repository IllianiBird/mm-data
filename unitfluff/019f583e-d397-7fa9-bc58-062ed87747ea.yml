chassis: "Havoc"
model: "HVC-P6"
overview: |-
  <p>The Havoc is a thirty-five-ton light BattleMech designed by Adam Tech Industries and manufactured at their facility on Abadan in the former Free Worlds League. Entering production around 3112, the design was inspired by the venerable JR7-K Jenner and aimed to improve upon many of that proven striker's shortcomings. Adam Tech, a start-up firm that converted a small industrial component manufacturing center into full 'Mech production, marketed the Havoc exclusively to light BattleMech pilots with the slogan "In any battle, you only pilot one 'Mech." This tagline earned the design its widely recognized nickname, "the One." The Havoc proved an immediate commercial success on the Dark Age market, appealing to MechWarriors who demanded quality and survivability from their light chassis.</p>
capabilities: |-
  <p>Built on an X-H54 Endo Steel frame and powered by a Hermes 280 XL engine, the Havoc achieves a top speed of one hundred twenty-nine kilometers per hour, placing it among the fastest designs in its weight class. Five Chilton 360 jump jets provide a leap distance of one hundred fifty meters, granting excellent repositioning capability in broken terrain. Jolassa 328 Ferro-Fibrous armor with CASE II protection delivers a level of survivability rarely seen on a light 'Mech, approaching the protection of many medium-weight designs and allowing the Havoc to absorb punishment that would cripple most of its peers.</p><p>The primary armament consists of four Diverse Optics Extended-Range Medium Lasers paired with a Hovertec Quad SRM-4 launcher fed by two tons of ammunition, enabling specialty munitions loadouts as the tactical situation demands. The heart of the design is its Octagon Tartrac System E targeting and tracking suite, widely considered the finest short-range fire control package available at the time of introduction. The Tartrac carries over three thousand target profiles in its stock database and is field-upgradable. In trials, the Octagon distinguished between similar target silhouettes faster than any competing system tested, drawing favorable comparisons to the Garret D2j. This exceptional fire control allows the Havoc to maximize weapons accuracy during high-speed engagements, though aggressive pilots may find the heat burden challenging when firing all weapons simultaneously.</p>
deployment: |-
  <p>The base production model, this variant mounts the Havoc's standard weapons configuration of paired arm-mounted extended-range medium lasers alongside a center-torso SRM-4 launcher with two tons of ammunition for specialty munitions flexibility. This combination of energy and missile firepower gives the P6 a well-rounded engagement profile at short to medium range. Initial production was targeted at the Republic of the Sphere market before political changes on Abadan broadened the customer base to include Free Worlds League and independent operators across the former League territories.</p>
history: |-
  <p>Adam Tech Industries established itself on Abadan by purchasing and expanding a small industrial component manufacturing center into a full BattleMech production facility. The Havoc was the company's first design, entering production during the early years of the thirty-second century when the Republic of the Sphere still held sovereignty over Abadan. Unlike many Dark Age manufacturers that cut corners to rush products to an equipment-starved market, Adam Tech prioritized build quality and component reliability, selecting widely available materials and proven subsystems that ensured ease of maintenance and broad parts availability.</p><p>As political boundaries shifted during the tumultuous Dark Age, Abadan's sovereignty changed hands multiple times. The Republic of the Sphere's contraction saw the world briefly classified as independent before the reformed Free Worlds League reasserted control. Through each transition, Adam Tech maintained production, and the Havoc found its way into the hands of multiple factions operating in the former League territories.</p><p>The Marik-Stewart Commonwealth deployed Havocs in the defense of Concord during skirmishes with the Lyran Commonwealth in early 3135. In one notable engagement, a pair of Havocs squared off against a Wolfhound and two Mjolnirs in the densely forested Western Wilderness region. During fifteen minutes of heated combat, the Havocs disabled both Mjolnirs and sent the Wolfhound running, demonstrating the design's potency against heavier opposition. When one Havoc took a hit to its ammunition magazine, the CASE II system prevented the destruction of the 'Mech while keeping it combat-ready, validating Adam Tech's emphasis on pilot survivability.</p><p>The Havoc also participated in an unlikely engagement on Lyons alongside mercenary forces from Zelandia Unbound, where the design's exceptional speed proved decisive in a running pursuit against heavier 'Mechs. The Havoc's ability to execute high-speed attack runs and use its jump jets to evade return fire from even assault-weight opponents cemented its reputation as a premier light striker. Production has continued on Abadan into the ilClan era under restored Free Worlds League governance, with Adam Tech expanding its product line to include the GBT-1G Gambit as a complementary long-range design.</p>
