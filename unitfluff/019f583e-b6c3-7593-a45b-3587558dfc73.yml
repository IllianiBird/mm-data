overview: |-
  <p>Federated Suns infantry benefit from one of the strongest industrial bases in the Inner Sphere, with AFFS quartermasters able to supply platoons with standardized equipment and ammunition from a logistics network that few rival states can match. Towing assault-class LB-X autocannon that can fire cluster rounds capable of shredding infantry in the open, these field gun crews deliver the heaviest area-effect direct fire available to ground forces.</p>
