chassis: "Mechanized Hover Level I (ComGuards)"
model: "(SRM)"
overview: |-
  <p>Com Guard conventional infantry benefit from ComStar's access to preserved Star League technology, fielding weapons and equipment that match or exceed the standard issue of any Inner Sphere military, backed by the institutional discipline of the secular Order's professional military culture. Mechanized hover Level I formations are the fastest ground-mobile infantry in the Com Guards, using hovercraft APCs that can cross water obstacles and open terrain at speeds no wheeled or tracked transport can match. Their speed makes them valuable for flanking maneuvers and rapid exploitation of breakthroughs. Equipped with infantry-portable short-range missile launchers that provide anti-armor capability beyond what personal weapons can achieve, these troops can threaten light vehicles and battle armor at close range.</p>
