chassis: "Avar"
model: "B"
overview: |-
  <p>The Avar is a 35-ton Clan light OmniFighter that entered production in 2878. A general-purpose design, the Avar has served the Clans for centuries as a dependable workhorse. While its maneuverability and armor protection are only average for its weight class, the fighter's generous pod space provides significant mission flexibility. Commanders value the Avar's adaptability, appreciating a platform that can be reconfigured to fill a variety of combat roles at short notice. The pilots who fly the Avar tend to view it less favorably, given the fighter's age and lack of any particular specialty that might distinguish it from newer designs. Despite this reputation among its pilots, the Avar has survived repeated calls for retirement thanks to the vocal support of senior officers who recognize the practical value of a reliable, flexible airframe.</p>
capabilities: |-
  <p>Built on a Kerensky Series 9 chassis, the Avar mounts a 280-rated XL fusion engine that provides a safe thrust of ten and maximum thrust of fifteen, giving the fighter solid if unremarkable speed. Seven tons of Great Father Type XIa ferro-aluminum armor provides adequate protection for a light fighter, though it falls short of the heavier plating found on some contemporaries. The real strength of the design lies in its fourteen tons of available pod space, an impressive amount for a 35-ton frame.</p><p>Ten double heat sinks manage waste heat from the fixed systems, with additional heat management dependent on the chosen configuration. A LongTalk 2 communications system and Mark IX targeting and tracking system round out the fixed electronics, providing reliable performance proven across multiple centuries of service. The Avar's combination of moderate speed, decent pod space, and acceptable armor creates a versatile platform that, while excelling at nothing in particular, can be adapted to meet a wide range of tactical requirements. This lack of specialization is both the fighter's greatest weakness and its primary argument for continued production.</p>
deployment: |-
  <p>The B configuration eliminates all ammunition dependency by mounting an all-energy weapon loadout. Twin large pulse lasers in the nose deliver devastating strafing firepower, supported by an ER medium laser on each wing tip. This configuration is considered an excellent strafing vehicle, and its freedom from ammunition concerns gives pilots extended operational endurance compared to missile-dependent configurations.</p>
history: |-
  <p>The Avar entered service in 2878 during the Golden Century, a period of rapid technological advancement and military expansion across Clan space. Clan Coyote maintained a primary production line at their Coyote Industrial complex on Babylon, a facility selected for its capacity to support trade and Trials between multiple Clans. This arrangement ensured the Avar saw distribution beyond a single Clan's touman, contributing to its widespread adoption as a common second-line fighter.</p><p>Throughout the Succession Wars era the Avar served as a steady presence in Clan garrison forces. Its general-purpose nature meant it was rarely the first choice for frontline assignments, but its flexibility ensured it found a role wherever it was deployed. Commanders repeatedly intervened to prevent the design from being mothballed, arguing that its adaptability justified continued production even as newer, more specialized designs entered service.</p><p>Unlike the Vandal, which maintained its position through extreme speed and a dedicated reconnaissance role, the Avar survived on its lack of specialization. The fighter's pod space allowed it to serve in ground support, air superiority, and strike roles depending on the configuration selected, making it a valuable asset for commanders who needed to cover multiple mission profiles with limited assets.</p><p>The Jihad brought unexpected changes to Avar production. Clan Wolf-in-Exile established a new manufacturing line at the WC Aerospace Annex on Arc-Royal, beginning production around 3073. This Inner Sphere facility expanded the Avar's reach beyond the Clan homeworlds and ensured continued availability even as political upheaval disrupted traditional supply lines in Kerensky Cluster space.</p><p>By the ilClan era the Avar remained in service with multiple factions. The Babylon facility's status grew uncertain following Clan Coyote's absorption, while the Arc-Royal line continued production under the Arc-Royal Liberty Coalition banner. The fighter's longevity stands as reflection of the enduring value of a simple, adaptable design in an age of ever-increasing technological complexity.</p>
