chassis: "Field Gun Platoon (Generic)"
model: "(Tracked Heavy Cannon 2200+)"
overview: |-
  <p>Mechanized tracked platoons move their infantry in armored personnel carriers fitted with tracks for reliable all-terrain performance. Tracked APCs handle mud, snow, rubble, and rough ground better than any wheeled or hover alternative, making these platoons the preferred mechanized infantry for operations where terrain is uncertain or hostile. They sacrifice road speed compared to wheeled formations but gain the ability to keep pace with armored vehicles across broken ground. The APCs provide meaningful ballistic protection during transit, though troops must still dismount to fight effectively.</p><p>Towing guns that provide heavy long-range direct fire, these field gun crews can surprise unwary targets at distances beyond personal weapons range.</p>
