chassis: "War Dog"
model: "WR-DG-03FC"
overview: |-
  <p>The War Dog is a seventy-five-ton heavy BattleMech originally designed for the Star League Defense Force, though the prototype chassis and plans disappeared shortly before the fall of the Star League. The design languished in obscurity for centuries until Snord's Irregulars rediscovered several chassis and a complete set of technical plans in 3052. These were delivered to the Blackwell Corporation on Outreach, whose design teams immediately began work on an extended production run. Combining advanced Inner Sphere technology with the recovered Star League blueprints, the War Dog quickly established itself as a capable and menacing heavy combatant with a reputation for rugged survivability and potent firepower.</p>
capabilities: |-
  <p>The War Dog's success stems from its twelve tons of StarSlab 511 ferro-fibrous armor, sufficient to weather the heavy fire typical of engagements against Clan opponents. A Guardian ECM suite and torso-mounted Burow anti-missile system provide layered electronic and physical defenses against advanced enemy systems, giving the design exceptional survivability for its weight class.</p><p>A Grizzard Gauss rifle serves as the 'Mech's primary weapon, delivering punishing long-range fire without generating waste heat. This is supplemented by a Blankenburg large pulse laser and paired Martell medium pulse lasers for accurate close-range engagement, while a rear-mounted Martell small pulse laser discourages flanking attempts. Two Holly Streak SRM-2 one-shot missile packs mounted on the legs provide a last-ditch weapons system for emergencies. One of the design's most distinctive features is its asymmetric armor distribution, with the right arm carrying significantly more protection than the left, shielding the Gauss rifle at the cost of requiring MechWarriors to develop careful gyro balancing techniques.</p>
deployment: |-
  <p>This variant is the only factory variant produced by Blackwell, introduced in 3064 and reportedly developed using technology acquired from the Lyran Alliance. This configuration replaces the original weapons loadout with a more devastating close-to-intermediate range arsenal built around a heavy Gauss rifle, and integrates a C3 slave unit that allows the variant to share targeting data with allied units. The -03FC saw limited production before the destruction of Blackwell's Outreach facility during the Jihad ended all War Dog manufacturing.</p>
history: |-
  <p>The War Dog's combat history began spectacularly during the Dragoon Civil War, when forces loyal to Jaime Wolf deployed the newly produced 'Mechs to devastating effect. Early in the conflict, vid footage prominently featuring two War Dogs destroying five opposing 'Mechs leaked from Harlech to the rest of the Inner Sphere, instantly generating enormous demand for the design. The Blackwell Corporation has since filled orders from every major Inner Sphere power and numerous mercenary commands.</p><p>Despite its popularity, the War Dog carries complicated associations for Wolf's Dragoons themselves. While the design proved instrumental in resolving the Civil War, many Dragoons shun the War Dog, considering it an unwelcome reminder of the internecine conflict that nearly destroyed their organization. Even the Word of Blake managed to acquire a small number of War Dogs before the Dragoons imposed restrictions on dealings with the Blakist faction.</p><p>The War Dog's menacing silhouette and easily recognizable profile also drew attention on the Solaris VII arena circuit, where the 'Mech became a staple attraction. A fair number of War Dogs, some heavily modified by arena combatants, have competed in the fighting pits where their combination of heavy firepower and sturdy construction makes them crowd favorites.</p><p>Production of the War Dog was concentrated exclusively at Blackwell Corporation's Outreach facility, which tied the design's fate to the turbulent history of that world. When Word of Blake forces attacked Outreach at the start of the Jihad in 3067, the Blackwell facilities suffered catastrophic damage, effectively ending War Dog production. The factory's destruction, combined with the subsequent Blakist occupation of Outreach, ensured that no new War Dogs would roll off assembly lines for the foreseeable future, making surviving examples increasingly valuable to their operators.</p>
