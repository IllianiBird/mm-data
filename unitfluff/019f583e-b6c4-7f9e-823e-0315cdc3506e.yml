chassis: "Field Gun Platoon (AFFS)"
model: "(Tracked LBX5 3067+)"
overview: |-
  <p>The Armed Forces of the Federated Suns integrate conventional infantry directly into their Regimental Combat Teams, assigning foot, mechanized, and jump platoons to work permanently alongside BattleMech and armored formations. Towing LB-X autocannon that can switch between solid slugs and cluster rounds, these field gun crews adapt their fire to engage both armored point targets and dispersed infantry formations.</p>
