chassis: "Field Gun Platoon (FWLM)"
model: "(Tracked AC20 3035+)"
overview: |-
  <p>The Free Worlds League Military has long fielded some of the largest infantry formations in the Inner Sphere, with regiments numbering nearly 1,800 soldiers compared to roughly 750 in the Combine and just over 1,000 in the Federated Suns. Towing crew-served autocannon/20 field guns, these platoons deploy the heaviest conventional direct-fire weapon available to infantry formations. A single AC/20 round can cripple a light vehicle or breach BattleMech armor at short range, though the weapon's bulk limits repositioning.</p>
