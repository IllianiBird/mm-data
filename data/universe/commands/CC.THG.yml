# Kali Liao raised two Warrior Houses in secret in 3071 with the Word of Blake's Precentor
# Martial Cameron St. Jamais, out of her Thuggee cult and the Manei Domini. She held no
# authority to raise a Warrior House, so these answer to her rather than to the Warrior
# House Orders and do not fall back on them.
#
# White Tiger and Rakshasa are one record rather than two because nothing that separates
# them reaches unit generation. Both were raised in 3071 and destroyed on Sian in January
# 3074, both are rated A, and both drew on the same two tables. What differs is who filled
# them - White Tiger from Thuggee cultists handpicked by Kali Liao, Rakshasa from Blakist
# Manei Domini - and their battlefield abilities. Which House is being generated is chosen
# in the ruleset instead, where it decides organisation and naming.
#
# Their record of service gives the Capellan Confederation and the Shadow Divisions as the
# two tables their equipment comes from, which is what the pair of fallback factions
# reproduces - the generator averages them, so the Houses draw on both rather than either.
#
# Both were Capellan formations using lances, companies and battalions rather than the Word
# of Blake's base-six organisation, so they declare Inner Sphere sizes and the Confederation
# rank system rather than inheriting anything from the Blakist side.

key: CC.THG
name: Warrior House Thuggee
yearsActive:
  - start: 3071
    end: 3074
ratingLevels:
  - A
fallBackFactions:
  - CC
  - WOB.SD
formationBaseSize: 4
formationGrouping: 3
rankSystem: CCAF
