# One Bloodname and the Houses descending from it. Mechanical fields decide whether a
# warrior may hold the name; the rest is descriptive.
clan: CW
name: "Winson"
houses:
  - founder: "Jennifer"
    founderFullName: "Jennifer Winson"
    founderAffiliation: "Clan Wolf"
    limited: true
    limitedSince: 3085
    postReaving: [CCO]
    summary: "The Winson Bloodname deriving from Jennifer Winson was a Clan Wolf founding legacy. There is another, separate Winson Bloodname deriving from her supposed brother Jerome Winson. It is worth noting that, although this is not known within the BattleTech universe at large, \"Jennifer Winson\" was a false name, and her supposed family relation to Jerome Winson was a forgery to cover up her real identity"
