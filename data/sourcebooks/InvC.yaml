description: 'A Wolfnet report on the history, culture and military capability of five Clans of Operation REVIVAL - Smoke Jaguar, Nova Cat, Ghost Bear, Steel Viper and Diamond Shark - with occupation zone overviews, unit rosters and exclusive BattleMech designs. The only sourcebook covering Clan Smoke Jaguar in depth before its annihilation in 3059-60. Published by FASA in November 1994, 160 pages, ISBN 1-55560-251-7.'
