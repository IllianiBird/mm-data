description: '<p><strong>A Universe of Possibility</strong></p><p>It is the thirty-second century. You are a MechWarrior: master of a multi-ton, towering avatar of destruction that is the culmination of more than 3,000 years of battlefield technology. Whether you''re a soldier-of-fortune or a true-blue patriot, you drop onto hot zones across a thousand worlds to expand the star-spanning empires of one of the Great Houses or warrior-bred Clans.</p><p><em><strong>BattleTech</strong></em> is the world''s greatest game of armored combat. Inside this box you''ll discover epic clashes, dynamic characters, and a myriad of gaming experiences for any type of player: from miniatures to RPG play, hobby painting to fiction, and beyond. The <em><strong>Core Box</strong></em> includes eight high-quality miniatures, rule and lore books, maps and more: everything you need to bring heavy metal clashes to your gaming table!</p><p>Contents:</p><ul><li>8 high-quality, ready-to-play plastic miniatures</li><li>24-page lore booklet</li><li>72-page Rulebook</li><li>16-page Record Sheet booklet</li><li>2 18" x 22" full-color game maps (double sided)</li><li>Punchboard of objective tokens</li><li>8 MechWarrior cards</li><li>Heavy-stock reference sheet</li><li>Poster Map</li><li>2 six-sided dice</li><li>And more!</li></ul>'
