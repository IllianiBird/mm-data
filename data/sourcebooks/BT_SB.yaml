description: '<p><strong>Leap Into The Action</strong></p><p><em>BattleTech</em> is the world''s greatest game of armored combat, filled with a myriad of epic stories and gaming experiences to satiate any player: from miniatures to RPG play, hobby painting to fiction, and beyond.</p><p>The <em>BattleTech Starter Box</em> is the first step on that fantastic journey and includes everything you need to get started: two high-quality miniatures, quick-start rules, a mapsheet, cards to represent your MechWarrior''s unique skills, dice, and more.</p><p><strong>Contents:</strong></p><ul><li>2 high-quality, ready-to-play plastic miniatures<ul><li>the heavily-protected <em>Hammerhead</em> medium ''Mech</li><li>the knife-fighting <em>Kontio</em> medium ''Mech</li></ul></li><li>12-page Quick-Start Rulebook</li><li>4-page lore booklet</li><li>8 half-page, laminated record sheets</li><li>18" x 22" full-color game map (double sided)</li><li>Punchboard of ''Mechs and objective tokens</li><li>2 MechWarrior cards</li><li>2 six-sided dice</li></ul>'
