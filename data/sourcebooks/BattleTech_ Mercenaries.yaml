description: '<p>Whether wet-behind-the-ears recruits or grizzled veterans, mercenaries are the wild card that can tip the balance in combat. These MechWarriors run the razor''s edge between immortality and destruction, and possess the elite skills and the right amount of luck to snatch victory from the jaws of defeat. There are literally hundreds of mercenary outfits, found on nearly every battlefield across the Inner Sphere and beyond. Some are elite, multi-regiment combat commands with centuries-old legacies, while others are down-on-their-luck lances that scratch out a living on backwater worlds. Will you join an existing unit, or try to carve out your own place in the universe?</p>'
